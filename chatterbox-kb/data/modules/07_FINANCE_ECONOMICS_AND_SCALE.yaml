management_account_conservative_case:
  status: proxy/model requiring correction
  April_2026_actual:
    headcount_or_seat_proxy: 65.6
    monthly_revenue: 1970000 ZAR
    revenue_per_HC: 30048 ZAR
    all_in_cost_per_HC: 27037 ZAR
    contribution_or_EBITDA_per_HC: 3006 ZAR
    margin: 10.0%
  mature_proxy:
    revenue_per_HC: 34762 ZAR
    cost_per_HC: 17205 ZAR
    contribution_per_HC: 17558 ZAR
    margin: about 50.5%
  base_330:
    monthly_revenue: about 11470000 ZAR
    monthly_contribution_before_corrections: about 5790000 ZAR
  rule: use conservative base for diligence until finance reconciles stretch assumptions

facility_economics:
  monthly_facility_envelope_from_Jul_2026: about 734256 ZAR
  low_occupancy_example_88_agents_per_agent: about 8344 ZAR
  full_330_productive_per_agent: about 2225 ZAR
  reduction: about 73%
  implication: productive utilisation is urgent; separate physical, active and productive seats

funding_options_model:
  recommended_structure: hybrid/non-dilutive first, subject to contracts, cash forecast and lender terms
  R3m: {asset_funding: 2000000, working_capital: 1000000, use: lean ramp/tight buffer}
  R4m: {asset_funding: 2000000, working_capital: 2000000, use: balanced/preferred planning case}
  R5m: {asset_funding: 2000000, working_capital: 3000000, use: larger payroll/training/collection buffer}
  input_required: funding instrument, security, pricing, drawdown, repayment and investor/lender terms

known_reconciliation_issues:
  - 110 active-agent investor input vs 65.6 April actual headcount/seat proxy; definitions and dates differ
  - R42,500 mature revenue/agent stretch vs R34,762 conservative proxy
  - agent basic R5,000 in latest actuals-matched model vs R5,250 in prior summary
  - forecast headcount can exceed physical 330-seat capacity unless support seating, shifts or second site are separated
  - team-leader forecast gap: model needs 22 TLs at 330; known correction about R391k/month versus prior run-rate
  - EXCO salaries appear zero in part of forecast and must be located or reinstated
  - COO and Operations Manager costs not fully visible
  - finance vacancy/control capacity must be added
  - QA should use automated screening/risk-based sampling rather than linear evaluator growth

north_star_economics:
  - revenue per productive agent/seat
  - clean contribution per productive agent/seat
  - cost per clean sale
  - support cost per productive agent
  - facility cost per productive agent
  - agents per support FTE
  - clean contribution per support FTE
  - technology cost and verified capacity avoided per active agent
  - lead cost, contactability, conversion and return by source/batch
  - campaign-level revenue, cost, margin, clawback and cash conversion

finance_required_outputs:
  - reconciled seat/economic definitions
  - campaign P&L and client profitability
  - 13-week cash forecast
  - monthly management accounts tied to investor dashboard
  - commission rule/version/reconciliation
  - PO and delegation controls
  - debtor days, collections and working-capital gap
  - actual technology, dialler, licence, payroll, facility and central overhead costs

commercial_language_rule:
  allowed: seat-level contribution or modelled contribution
  prohibited_without_tie_out: EBITDA, proven profitability at target scale, guaranteed revenue or investor return
