additional_platforms_and_systems_of_record:
  GoHighLevel:
    role: CRM/workflow engine for B2B pipeline, recruitment candidates, forms, nurturing and routing
    technical_owner: P09
    business_owners: Commercial/People/Operations by process
  Make:
    role: automation/integration layer
    owner: P09
  Salesforce_client_exports:
    role: source for cases and activations; no direct connection allowed in current client context
  CallX:
    role: current dialler/call records, queues, attempts and recordings
    owners: Operations/P14/P11
  Vici:
    role: future/return dialler; must map to same canonical call table as CallX
  Power_BI:
    role: executive reporting layer; reports truth but does not replace transactional systems
    owner: P08 under P02 governance
  Excel_PowerQuery:
    role: controlled analysis/reconciliation and interim ingestion; not permanent shadow operating system
  SQL:
    role: governed reporting/data layer where available
  Payscale:
    role: payroll system of record
    owner: P03/P17
  Xero:
    role: accounting system of record
    owner: P03/Finance_Accountant
  Blue:
    role: projects, tasks and actions unless another platform is formally approved
    owners: P02 + functional executives
  LMS:
    role: training/certification system with AgentOS linkage
    owners: P15/P16/P05
  Controlled_Knowledge_Repository:
    role: policies, SOPs, scripts, disclosures and approved content
    owners: functional owner with P04 control
  Google_Drive_Evidence_Vault:
    role: interim evidence/record repository where approved; requires access/retention controls
  WhatsApp_and_Email_Automation:
    role: candidate/customer reminders and nurture subject to consent, approved content, suppression and audit
  OpenAI_and_frontier_models:
    role: drafting, summarisation, recommendation and controlled agent workflows
    governance: AI register, evaluation, cost, access, prompt/version and kill switch
  Vercel_and_Lovable:
    role: hosting/build platforms for current applications; not systems of record by themselves
  Fable_Claude_Gamma:
    role: design/build/analysis tools; outputs require business acceptance and governance before operational use

platform_rationalisation_rules:
  - CIP governs/connects existing systems; it must not become another disconnected front end.
  - Build API-first adapters but support manual files where direct access is prohibited.
  - One system of record per business object.
  - Duplicates are merged or retired with G6 evidence.
  - Every critical system needs executive, process, system, data, control and backup owners.
  - Every production system needs access, incident, change, release, rollback, recovery, manual fallback and audit controls.
