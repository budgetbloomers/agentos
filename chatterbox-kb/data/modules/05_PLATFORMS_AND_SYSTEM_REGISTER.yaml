domain: platforms_systems
as_of: '2026-07-10'

system_gate_model:
  G0: idea/backlog; no build approval
  G1: design approved or unverified artefact; business case/owner/data/control not fully accepted
  G2: built/prototype; requires operational acceptance
  G3: operational acceptance/pilot with signed process, controls, testing and fallback
  G4: live and controlled; adopted, monitored, resilient and evidenced
  G5: optimised/scaled with verified benefits
  G6: merged/retired with retention, continuity and decommission evidence

