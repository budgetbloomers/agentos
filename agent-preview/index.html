function zar2Stack(v){return zar2(v)+'<div class="exv">'+zar2(exVat(v))+' ex VAT</div>'}
function cycleCalc(){
  const start=String((state.rules.cycleStart?.vals||[])[0]||'').trim();
  if(!start)return null;
  const totD=parseFloat((state.rules.cycleDialingDays?.vals||[])[0])||21;
  const vat=vatPct();
  const targets=[];(state.rules.cycleTargets?.vals||[]).forEach(v=>{const i=String(v).lastIndexOf(':');const t=parseFloat(String(v).slice(i+1));if(!isNaN(t))targets.push([String(v).slice(0,i).trim(),t])});
  const cw={from:start,to:'2099-12-31'};
  const prem=(function(){const f=state.filters;try{return accountPremiums(cw)}finally{state.filters=f}})();
  const dial=rowsFor('CALLX_CALL_RECORDS',cw);
  const byCamp={},dialDays={},tlAgg={};let unatt=0;
  prem.forEach(e=>{if(!e.cb){unatt+=e.gwp||0;return}
    const q=(state.cbInfo[e.cb]?.queue)||'(no queue)';byCamp[q]=(byCamp[q]||0)+(e.gwp||0);
    const tl=(state.cbInfo[e.cb]?.tl)||'(unassigned)';const T=tlAgg[tl]=tlAgg[tl]||{gwp:0,q:{}};T.gwp+=(e.gwp||0);T.q[q]=(T.q[q]||0)+1});
  dial.forEach(r=>{const cb=cbOf(r.agent);if(!cb||!r._d)return;const q=(state.cbInfo[cb]?.queue);if(!q)return;(dialDays[q]=dialDays[q]||new Set()).add(r._d)});
  const wdFallback=workDays({from:start,to:isoDay(anchorDate())});
  const pastOf=camp=>Math.min(totD,(dialDays[camp]?dialDays[camp].size:0)||Math.min(wdFallback,totD));
  const tlRows=Object.entries(tlAgg).map(([tl,T])=>{
    const camp=Object.entries(T.q).sort((a,b)=>b[1]-a[1])[0][0];
    const past=pastOf(camp);const rem=Math.max(0,totD-past);
    const perDay=past>0?T.gwp/past:0;
    return{tl,camp,gwp:T.gwp,perDay,rem,proj:perDay*rem,total:T.gwp+perDay*rem}})
   .sort((a,b)=>b.total-a.total);
  const byTL={};tlRows.forEach(r=>byTL[r.tl]=r);
  return{start,totD,vat,targets,byCamp,dialDays,unatt,wdFallback,pastOf,tlRows,byTL};
}
function cyclePanel(win){

    const cur=byCamp[camp]||0;
    const past=pastOf(camp);
    const rem=Math.max(0,totD-past);
    const perDay=past>0?cur/past:0;
    const proj=perDay*totD;

   +'<span class="s">cycle '+esc(start)+' → '+totD+' dialing days · money attributed through the base table</span></div>'
   +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px">'+targets.map(panel).join('')+'</div>'
   +(unatt>0?'<div class="stale-banner" style="margin-top:10px">'+zar2(unatt)+' of cycle GWP is unattributed to any roster agent and sits outside the campaign panels.</div>':'')
   +'<div style="margin-top:14px"><div class="ac-sec">TEAM LEADER PROJECTIONS — avg GWP per day × remaining dialing days</div>'
   +'<div style="overflow-x:auto"><table class="tbl" style="font-size:12px"><thead><tr><th class="noclick">Team Leader</th><th class="noclick">Campaign</th><th class="noclick">Current GWP</th><th class="noclick">GWP / day</th><th class="noclick">Remaining days</th><th class="noclick">Projection (remaining)</th><th class="noclick">Cycle total (current + projection)</th></tr></thead><tbody>'
   +(tlRows.length?tlRows.map(r=>'<tr><td><b>'+maskName(r.tl)+'</b></td><td style="font-size:11px">'+esc(r.camp)+'</td>'
     +'<td class="num" style="font-weight:800">'+zar2Stack(r.gwp)+'</td><td class="num">'+zar2(r.perDay)+'</td><td class="num">'+r.rem+'</td>'

function pageSales(win){

  const ds=dailySeries(calls,win,rs=>rs.length);

  const gm=gwpMap();const sRows=saleRows(win);const prem=accountPremiums(win);
  const gwpByProd={};prem.forEach(e=>{if(e.gwp!=null)gwpByProd[e.product]=(gwpByProd[e.product]||0)+e.gwp});

    mkChart('chS8',{type:'line',data:{labels:dsIn.labels,datasets:[

      {label:'Outflow (closed)',data:dsOut.data,borderColor:'#6D4AE0',backgroundColor:'rgba(109,74,224,.07)',fill:true,tension:.3,pointRadius:0,borderWidth:2}]},
      options:{plugins:{legend:{position:'top',align:'end',labels:{boxWidth:9,boxHeight:9}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10}},y:{grid:{color:'#EEF2F8'}}},maintainAspectRatio:false}});
    doughnut('chS11',bandMix.filter(e=>e[1]>0));
    doughnut('chS12',closureMix);
    hbar('chS9',Object.entries(gwpByProd).sort((a,b)=>b[1]-a[1]).slice(0,8),'#158A4C');
    hbar('chS10',Object.entries(gwpByAgent).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,v])=>[maskName(n),Math.round(v)]),'#2563EB');
  },0);
  return cyclePanel(win)+kpiRow('Sales',win)

   +'<div class="card"><div class="card-h"><span class="t">Inbound vs outbound</span><span class="info" title="Inbound rows carry no agent — per-agent maths uses outbound only.">i</span></div><div class="chart-wrap"><canvas id="chS2"></canvas></div></div></div>'
   +'<div class="grid g2"><div class="card"><div class="card-h"><span class="t">Calls by campaign</span></div><div class="chart-wrap short"><canvas id="chS4"></canvas></div></div>'
   +'<div class="card"><div class="card-h"><span class="t">Calls by agent (outbound)</span></div><div class="chart-wrap short"><canvas id="chS5"></canvas></div></div></div>'
   +'<div class="grid g3"><div class="card"><div class="card-h"><span class="t">Activation product mix</span><span class="s">as of latest snapshot</span></div><div class="chart-wrap short"><canvas id="chS3"></canvas></div></div>'
   +'<div class="card"><div class="card-h"><span class="t">Disposition mix (closed)</span></div><div class="chart-wrap short"><canvas id="chS6"></canvas></div></div>'
   +'<div class="card"><div class="card-h"><span class="t">Open backlog by owner</span></div><div class="chart-wrap short"><canvas id="chS7"></canvas></div></div></div>'
   +'<div class="grid g21">'
   +'<div class="card"><div class="card-h"><span class="t">Call types by agent</span><span class="info" title="Bands are a live rule (Dictionary → Rules → Call type bands): No Answer <30s, Customer Service 30–179s, Pitch 180–359s, Closing 360s+. Unique = distinct destinations excluding queue legs.">i</span><span class="s">top 15 by volume</span></div>'
   +(agRows.length?'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">Agent</th>'+bandsAll.map(b=>'<th class="noclick">'+esc(b)+'</th>').join('')+'<th class="noclick">Total</th><th class="noclick">Unique</th><th class="noclick">Talk</th></tr></thead><tbody>'
     +agRows.map(a=>'<tr><td><b>'+maskName(a.name)+'</b>'+(a.unmapped?' <span class="pill a" style="padding:1px 6px">unmapped</span>':'')+'</td>'
       +bandsAll.map(b=>'<td class="num">'+(a.bands[b]||'·')+'</td>').join('')
       +'<td class="num" style="font-weight:800">'+a.t.toLocaleString()+'</td>'
       +'<td class="num">'+a.uniq.size.toLocaleString()+'</td>'
       +'<td class="num">'+fmtVal(a.talk,'hours')+'</td></tr>').join('')
     +'</tbody></table></div>'+(unmappedCallAgents?'<div class="stale-banner" style="margin-top:8px">⚠ '+unmappedCallAgents+' dialler agent string(s) matched no roster entry (no CB code found or code not on today\'s list) — flagged above, fix in Mappings or the daily Agent List.</div>':''):'<div class="empty">Upload CallX call records.</div>')
   +'</div>'
   +'<div class="card"><div class="card-h"><span class="t">Call type mix</span><span class="s">band rule applied live</span></div><div class="chart-wrap short"><canvas id="chS11"></canvas></div></div></div>'
   +'<div class="grid g2">'

   +'<div class="card"><div class="card-h"><span class="t">Open leads by agent × attempt status</span><span class="s">top 12 owners</span></div>'
   +(pivotRows.length?'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">Agent (Case Owner → roster)</th>'+pivCols.map(st=>'<th class="noclick">'+esc(st)+'</th>').join('')+'<th class="noclick">Total</th></tr></thead><tbody>'
     +pivotRows.map(p=>'<tr><td><b>'+aName(p.__cb,maskName(p.__name))+'</b>'+(p.__unmapped?' <span class="pill a" style="padding:1px 6px">unmapped</span>':'')+'</td>'+pivCols.map(st=>'<td class="num">'+(p.__sts[st]||'·')+'</td>').join('')+'<td class="num" style="font-weight:800">'+p.__t+'</td></tr>').join('')
     +'</tbody></table></div>'
     +((unmappedOwners||unownedN)?'<div class="stale-banner" style="margin-top:8px">⚠ '+(unmappedOwners?unmappedOwners+' case owner(s) not matched to the roster after cleaning the " - team" suffix — check the Sales Force column in the Agent List. ':'')+(unownedN?unownedN+' case(s) have no owner.':'')+'</div>':'')
     :'<div class="empty">Upload the open cases file.</div>')+'</div></div>'
   +'<div class="grid g21">'

   +(cRows.length?'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">Agent (Case Owner → roster)</th>'+cColsAll.map(st=>'<th class="noclick">'+esc(st)+'</th>').join('')+'<th class="noclick">Total</th></tr></thead><tbody>'
     +cRows.map(p=>'<tr><td><b>'+aName(p.__cb,maskName(p.__name))+'</b>'+(p.__unmapped?' <span class="pill a" style="padding:1px 6px">unmapped</span>':'')+'</td>'+cColsAll.map(st=>'<td class="num">'+(p.__sts[st]||'·')+'</td>').join('')+'<td class="num" style="font-weight:800">'+p.__t+'</td></tr>').join('')
     +'</tbody></table></div>'
     +((cUnmapped||cUnowned)?'<div class="stale-banner" style="margin-top:8px">⚠ '+(cUnmapped?cUnmapped+' closed-case owner(s) not on the roster after suffix cleaning. ':'')+(cUnowned?cUnowned+' case(s) unowned.':'')+'</div>':'')
     :'<div class="empty">Upload the closed cases file.</div>')+'</div>'
   +'<div class="card"><div class="card-h"><span class="t">Closure status mix</span><span class="s">Closed vs No feedback</span></div><div class="chart-wrap short"><canvas id="chS12"></canvas></div></div></div>'

   +'<div class="card"><div class="card-h"><span class="t">Top agents by GWP</span><span class="info" title="Attribution: activation → Voice Log Case → case owner → Agent List → CB code.">i</span></div><div class="chart-wrap short"><canvas id="chS10"></canvas></div></div></div>'
   +(unmappedProd.length?'<div class="stale-banner">⚠ '+unmappedProd.length+' bundled product(s) missing from the GWP table'+(zeroPriced?' — '+zeroPriced+' sale(s) currently priced R0':'')+': '+esc(unmappedProd.slice(0,4).join(', '))+(unmappedProd.length>4?'…':'')+'. Upload an updated GWP file or review Mappings.</div>':'')
   +(unattrib?'<div class="stale-banner">⚠ '+unattrib+' sale(s) could not be attributed to an agent (no case-owner match in the Agent List) — they count in totals but not per-agent GWP. Check Mappings.</div>':'')
   +agingTable(open);

function agingTable(open){
  const buckets=[['0–72h',0,72],['3–14d',72,336],['14–30d',336,720],['30d+',720,1e9]];
  const counts=buckets.map(b=>open.filter(r=>r.age_hours!=null&&r.age_hours>=b[1]&&r.age_hours<b[2]).length);
  const total=counts.reduce((a,b)=>a+b,0)||1;
  return '<div class="card"><div class="card-h"><span class="t">Open case ageing</span><span class="info" title="Salesforce exports age with comma decimals; the parser normalises them.">i</span></div>'
   +'<table class="tbl"><thead><tr><th class="noclick">Bucket</th><th class="noclick">Cases</th><th class="noclick" style="width:45%">Share</th></tr></thead><tbody>'
   +buckets.map((b,i)=>'<tr><td><b>'+b[0]+'</b></td><td class="num">'+counts[i].toLocaleString()+'</td><td><div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:'+(counts[i]/total*100)+'%;background:'+(i>=3?'var(--red)':i===2?'#F59E0B':'var(--blue)')+'"></div></div><span class="num" style="font-size:11px;color:var(--muted)">'+Math.round(counts[i]/total*100)+'%</span></div></td></tr>').join('')
   +'</tbody></table></div>';
}

/* ---------------- PAGE: QA ---------------- */
function pageQA(win){
  if(!hasData())return emptyState('QA & Compliance needs the evaluations export');
  const qa=rowsFor('QA_EVALUATIONS',win);
  const prio=groupCount(qa.filter(r=>r.priority),'priority');
  const coach=groupCount(qa.filter(r=>r.coaching_category),'coaching_category').slice(0,7);
  const crit=groupCount(qa.filter(r=>r.critical_fail_category),'critical_fail_category').slice(0,7);
  /* decision pivot per agent */
  const decFreq=groupCount(qa.filter(r=>r.escalation_decision),'escalation_decision');
  const decNames=decFreq.map(e=>e[0]);
  const decOrder=[...resolveRule('$qaPass'),...resolveRule('$qaCoaching'),...resolveRule('$qaCritical')].filter(d=>decNames.includes(d));
  const decCols=[...decOrder,...decNames.filter(d=>!decOrder.includes(d)).slice(0,2)];
  const QP={};qa.forEach(r=>{const cb=normCB(r.sales_agent_code)||state.sfOwnerMap?.[normName(r.sales_agent)];const key=cb||('RAW::'+normName(r.sales_agent||'(blank)'));
    const p=QP[key]=QP[key]||{__cb:cb,__t:0,__name:cb?((state.cbInfo[cb]?.name)||r.sales_agent):(r.sales_agent||'(blank)'),__unmapped:!cb,__s:0,__sn:0,__d:{},__pe:0,__disp:0};
    p.__t++;if(r.score_percent!=null){p.__s+=r.score_percent;p.__sn++}
    if(r.sm_flag===1||String(r.sm_escalation_reason||'').trim())p.__pe++;
    if(resolveRule('$qaDisputeStatuses').includes(r.status))p.__disp++;
    const d=decCols.includes(r.escalation_decision)?r.escalation_decision:'Other';p.__d[d]=(p.__d[d]||0)+1});
  const qpSales={};(function(){const f=state.filters;try{accountPremiums(win).forEach(e=>{if(e.cb)qpSales[e.cb]=(qpSales[e.cb]||0)+1})}finally{state.filters=f}})();
  const qpRows=Object.values(QP).sort((a,b)=>b.__t-a.__t).slice(0,15);
  const qpUnmapped=Object.values(QP).filter(p=>p.__unmapped).length;
  /* nested category → sub-category */
  const nest=(catF,subF)=>{const N={};qa.forEach(r=>{const c=r[catF];if(!c)return;const n=N[c]=N[c]||{t:0,subs:{}};n.t++;const sb=r[subF]||'(unspecified)';n.subs[sb]=(n.subs[sb]||0)+1});
    return Object.entries(N).sort((a,b)=>b[1].t-a[1].t)};
  const coachNest=nest('coaching_category','coaching_sub');
  const critNest=nest('critical_fail_category','critical_sub');
  const nestCard=(title,data,color,total)=>{
    return '<div class="card"><div class="card-h"><span class="t">'+title+'</span><span class="info" title="Business-level view. Use the Agent filter in the top bar to narrow every count on this page to one agent.">i</span><span class="s">'+data.reduce((s,e)=>s+e[1].t,0)+' findings</span></div>'
     +(data.length?'<table class="tbl"><tbody>'+data.map(([cat,v])=>{
        const pct=total?Math.round(v.t/total*100):0;
        const subs=Object.entries(v.subs).sort((a,b)=>b[1]-a[1]).slice(0,5);
        return '<tr><td style="background:linear-gradient(90deg,'+color+'14 '+pct+'%,transparent '+pct+'%)"><b>'+esc(cat)+'</b></td><td class="num" style="font-weight:800">'+v.t+'</td></tr>'
         +subs.map(([sb,n])=>'<tr><td style="padding-left:26px;font-size:12px;color:var(--body)">'+esc(sb)+'</td><td class="num" style="font-size:12px">'+n+'</td></tr>').join('')}).join('')
     +'</tbody></table>':'<div class="empty">None in this window.</div>')+'</div>'};
  const byTL={};qa.forEach(r=>{const t=r.team_leader;byTL[t]=byTL[t]||{n:0,p:0,c:0,s:0,sn:0};byTL[t].n++;
    if(resolveRule('$qaPass').includes(r.escalation_decision))byTL[t].p++;
    if(resolveRule('$qaCritical').includes(r.escalation_decision))byTL[t].c++;
    if(r.score_percent!=null){byTL[t].s+=r.score_percent;byTL[t].sn++}});
  const tlRows=Object.entries(byTL).map(([t,v])=>({t,n:v.n,pass:v.p/v.n*100,crit:v.c,score:v.sn?v.s/v.sn:null})).sort((a,b)=>b.n-a.n);
  const openCrit=qa.filter(r=>resolveRule('$qaCritical').includes(r.escalation_decision)&&!/closed/i.test(r.qa_status||''));
  setTimeout(()=>{doughnut('chQ1',prio.length?prio:[['No priority flags',1]])},0);
  return kpiRow('QA',win)
   +'<div class="grid g21">'
   +'<div class="card"><div class="card-h"><span class="t">QA by agent</span><span class="info" title="Sales Agent CB is normalised (CB-97 = CB97) and matched to the roster; blank codes fall back to the agent name via the Agent List.">i</span><span class="s">score · decisions · total QA&#39;d — top 15</span></div>'
   +(qpRows.length?'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">Agent</th><th class="noclick">Avg score</th>'+decCols.map(d=>'<th class="noclick">'+esc(d)+'</th>').join('')+'<th class="noclick">Total QA&#39;d</th><th class="noclick" title="As specified: Total Sales ÷ QA&#39;d calls for the window. If the intent was coverage (QA&#39;d ÷ Sales), say the word — it is a one-line flip.">% sales / QA&#39;d</th><th class="noclick" title="Evaluations with an SM Escalation Reason (or SM flag). The column is in the export but blank so far — this lights up the day QA starts using it.">Partner esc.</th><th class="noclick" title="Evaluations whose Status is in the QA dispute rule (closed_retracted + qa_review by default — editable in Dictionary → Rules).">Disputed</th></tr></thead><tbody>'
     +qpRows.map(p=>'<tr><td><b>'+aName(p.__cb,maskName(p.__name))+'</b>'+(p.__unmapped?' <span class="pill a" style="padding:1px 6px">unmapped</span>':'')+'</td>'
       +'<td>'+(p.__sn?'<span class="pill '+((p.__s/p.__sn)>=90?'g':(p.__s/p.__sn)>=80?'a':'r')+'">'+fmtVal(p.__s/p.__sn,'pct')+'</span>':'—')+'</td>'
       +decCols.map(d=>'<td class="num">'+(p.__d[d]||'·')+'</td>').join('')
       +'<td class="num" style="font-weight:800">'+p.__t+'</td>'
       +'<td class="num">'+(p.__cb!=null&&p.__cb in qpSales?fmtVal(qpSales[p.__cb]/p.__t*100,'pct'):(p.__cb?'0%':'—'))+'</td>'
       +'<td class="num">'+(p.__pe||'·')+'</td>'
       +'<td>'+(p.__disp?'<span class="pill a">'+p.__disp+'</span>':'<span class="num">·</span>')+'</td></tr>').join('')
     +'</tbody></table></div>'+(qpUnmapped?'<div class="stale-banner" style="margin-top:8px">⚠ '+qpUnmapped+' agent(s) not matched to the roster — CB code missing or not on today&#39;s Agent List.</div>':'')
     :'<div class="empty">Upload the QA evaluations export.</div>')+'</div>'
   +'<div class="card"><div class="card-h"><span class="t">Risk priority mix</span><span class="info" title="P1 = same-day escalation. P3 = routine coaching.">i</span></div><div class="chart-wrap short"><canvas id="chQ1"></canvas></div></div></div>'
   +'<div class="grid g2">'
   +nestCard('Coaching — categories & sub-categories',coachNest,'#B45309',qa.length)
   +nestCard('Critical fails — categories & sub-categories',critNest,'#C42D2D',qa.length)
   +'</div>'
   +'<div class="grid g21">'
   +'<div class="card"><div class="card-h"><span class="t">Quality by team leader</span></div><table class="tbl"><thead><tr><th class="noclick">Team leader</th><th class="noclick">Evals</th><th class="noclick">Pass rate</th><th class="noclick">Avg score</th><th class="noclick">Critical fails</th></tr></thead><tbody>'
   +tlRows.map(r=>'<tr><td><b>'+maskName(r.t)+'</b></td><td class="num">'+r.n+'</td><td><span class="pill '+(r.pass>=90?'g':r.pass>=80?'a':'r')+'">'+fmtVal(r.pass,'pct')+'</span></td><td class="num">'+fmtVal(r.score,'pct')+'</td><td>'+(r.crit?'<span class="pill r">'+r.crit+'</span>':'<span class="pill g">0</span>')+'</td></tr>').join('')
   +'</tbody></table></div>'
   +'<div class="card"><div class="card-h"><span class="t">Open critical fails</span><span class="s">'+openCrit.length+' pending</span></div>'
   +(openCrit.length?'<table class="tbl"><tbody>'+openCrit.slice(0,9).map(r=>'<tr><td><span class="pill r">'+esc(r.priority||'P1')+'</span></td><td><b>'+maskName(r.sales_agent)+'</b><div style="font-size:11px;color:var(--muted)">'+esc(r.critical_fail_category||'')+'</div></td><td style="text-align:right;font-size:11px;color:var(--muted)">'+esc(r.call_date||'')+'<br>'+maskName(r.team_leader)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">Nothing pending — all criticals closed out.</div>')

/* ---------------- PAGE: QA AGENT PERFORMANCE (assessors) ---------------- */
function pageQAPerf(win){
  if(!hasData())return emptyState('QA Agent Performance needs the QA evaluations export');
  const rows=rowsFor('QA_EVALUATIONS',win);
  if(!rows.length)return emptyState('No evaluations in the selected window');
  const CRIT=resolveRule('$qaCritical'),COACH=resolveRule('$qaCoaching'),PASS=resolveRule('$qaPass');
  const A={};
  rows.forEach(r=>{const k=r.qa_agent||'(blank)';const a=A[k]=A[k]||{name:k,n:0,sec:0,crit:0,coach:0,pass:0,s:0,sn:0};
    a.n++;a.sec+=r.call_duration_seconds||0;
    if(CRIT.includes(r.escalation_decision))a.crit++;
    else if(COACH.includes(r.escalation_decision))a.coach++;
    else if(PASS.includes(r.escalation_decision))a.pass++;
    if(r.score_percent!=null){a.s+=r.score_percent;a.sn++}});
  const list=Object.values(A).sort((x,y)=>y.n-x.n);
  const G=list.reduce((g,a)=>({n:g.n+a.n,sec:g.sec+a.sec,crit:g.crit+a.crit,coach:g.coach+a.coach,pass:g.pass+a.pass,s:g.s+a.s,sn:g.sn+a.sn}),{n:0,sec:0,crit:0,coach:0,pass:0,s:0,sn:0});
  const fh=sec=>{const m=Math.round(sec/60);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
  const row=(a,gt)=>'<tr'+(gt?' style="font-weight:800;background:#F4F8FE;border-top:2px solid var(--line)"':'')+'>'
    +'<td><b>'+(gt?'ALL ASSESSORS ('+list.length+')':maskName(a.name))+'</b></td>'
    +'<td class="num" style="font-weight:800">'+a.n.toLocaleString()+'</td>'
    +'<td class="num">'+fh(a.sec)+'</td>'
    +'<td class="num">'+(a.sn?fmtVal(a.s/a.sn,'pct'):'—')+'</td>'
    +'<td>'+(a.crit?'<span class="pill r">'+a.crit+'</span>':'<span class="num">0</span>')+'</td>'
    +'<td class="num">'+(a.n?fmtVal(a.crit/a.n*100,'pct'):'—')+'</td>'
    +'<td>'+(a.coach?'<span class="pill a">'+a.coach+'</span>':'<span class="num">0</span>')+'</td>'
    +'<td class="num">'+a.pass.toLocaleString()+'</td></tr>';
  return '<div class="card" style="margin-bottom:14px">The assessors&#39; own scoreboard: how many calls each QA agent evaluated, the talk time they actually listened to (summed from Call Duration), and how they classified what they heard. Critical / Coaching / Pass follow the live rules, so a rule change re-reads every assessor. Big gaps in <b>Critical %</b> or <b>Avg score given</b> between assessors on the same period are the calibration conversation to have.</div>'
   +'<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start">'
   +'<div class="card"><div class="card-h"><span class="t">Assessor performance</span><span class="s">'+list.length+' QA agents · '+G.n.toLocaleString()+' evaluations · '+fh(G.sec)+' listened</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">QA Agent</th><th class="noclick">Evaluations</th><th class="noclick">Talk time listened</th><th class="noclick">Avg score given</th><th class="noclick">Critical fails</th><th class="noclick">Critical %</th><th class="noclick">Coaching</th><th class="noclick">Pass</th></tr></thead><tbody>'
   +list.map(a=>row(a,false)).join('')+row(G,true)
   +'</tbody></table></div></div>'
   +'<div class="card"><div class="card-h"><span class="t">Evaluations share</span></div><div style="height:260px"><canvas id="chQP1"></canvas></div></div>'
   +'</div>'
   +setTimeoutChart();
  function setTimeoutChart(){setTimeout(()=>{doughnut('chQP1',list.slice(0,8).map(a=>[maskName(a.name),a.n]))},0);return ''}
}

   +'<tr><td><b>Present person-days</b></td><td class="num">'+S.tw.p.toLocaleString()+'</td><td class="num">'+S.lw.p.toLocaleString()+'</td><td>'+nPill(S.tw.p,S.lw.p)+'</td><td class="num">'+S.tm.p.toLocaleString()+'</td><td class="num">'+S.lm.p.toLocaleString()+'</td><td>'+nPill(S.tm.p,S.lm.p)+'</td></tr>'

  const unknown=[...new Set(att.filter(r=>r.absence_flag).map(r=>r.status_code))];

function pageDisc(win){
  if(!hasData())return emptyState('Agent Discipline reads the QA evaluations export');
  const qa=rowsFor('QA_EVALUATIONS',win);
  const anchor=isoDay(anchorDate());
  const A={};
  qa.forEach(r=>{const key=normCB(r.sales_agent_code)||state.sfOwnerMap?.[normName(r.sales_agent)]||('N'+normName(r.sales_agent));if(!key)return;
    const a=A[key]=A[key]||{cb:key,code:(state.cbInfo[key]?.code)||r.sales_agent_code||'—',name:(state.cbInfo[key]?.name)||r.sales_agent,tl:(state.cbInfo[key]?.tl)||r.team_leader,off:0,open:0,openCrit:0,sla:0,tl1:0,tl2:0,sm:0,last:null};
    a.off=Math.max(a.off,r.offense_number||0);
    const open=!/closed/i.test(r.qa_status||'');
    const isC=resolveRule('$qaCritical').includes(r.escalation_decision);
    const isCo=resolveRule('$qaCoaching').includes(r.escalation_decision);
    if(open&&(isC||isCo))a.open++;
    if(open&&isC)a.openCrit++;
    if(open&&r.sla_deadline){const d=isoDay(parseDT(r.sla_deadline));if(d&&d<anchor)a.sla++}
    if(r.tl1_flag)a.tl1=1;if(r.tl2_flag)a.tl2=1;if(r.sm_flag)a.sm=1;
    if(r.call_date&&(!a.last||r.call_date>a.last))a.last=r.call_date;
  });
  const reg=Object.values(A).filter(a=>a.off>0||a.open>0)
    .sort((x,y)=>(y.openCrit-x.openCrit)||(y.off-x.off)||(y.open-x.open));
  const stageDist={};reg.forEach(a=>{const st=stageFor(a.off);const l=st?st.label:'No stage yet';stageDist[l]=(stageDist[l]||0)+1});
  const escal=qa.filter(r=>r.sm_flag&&!/closed/i.test(r.qa_status||''));
  const ladder=(state.rules.discStages?.vals||[]).join('  ·  ');
  setTimeout(()=>{hbar('chD1',Object.entries(stageDist).sort((a,b)=>b[1]-a[1]),'#C42D2D')},0);
  const stagePill=st=>{if(!st)return '<span class="pill n">—</span>';
    const frac=st.total>1?st.idx/(st.total-1):1;
    return '<span class="pill '+(frac>=0.75?'r':frac>=0.4?'a':'b')+'">'+esc(st.label)+'</span>'};
  return kpiRow('Discipline',win)
   +'<div class="stale-banner" style="background:var(--blue-soft);border-color:#D4E2FB;color:#1D4FD8">Stage ladder in force: '+esc(ladder)+' — this is a live rule (Dictionary → Interpretation rules). CONFIGURATION REQUIRED: confirm the ladder with Claudell / HR before disciplinary use. Derived from the QA export today; a dedicated HR/IR source can be added as a new upload slot later.</div>'
   +'<div class="grid g21">'
   +'<div class="card"><div class="card-h"><span class="t">Disciplinary register</span><span class="s">'+reg.length+' agents with open items or offenses · worst first</span></div>'
   +(reg.length?'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">Agent</th><th class="noclick">Team leader</th><th class="noclick">Offense #</th><th class="noclick">Current stage</th><th class="noclick">Open items</th><th class="noclick">Open criticals</th><th class="noclick">SLA</th><th class="noclick">Path</th><th class="noclick">Last incident</th></tr></thead><tbody>'
    +reg.map(a=>'<tr><td><b>'+aName(a.cb,maskName(a.name))+'</b><div style="font-size:10.5px;color:var(--muted)">'+esc(a.code)+'</div></td>'
     +'<td>'+maskName(a.tl)+'</td>'
     +'<td class="num" style="font-weight:800">'+a.off+'</td>'
     +'<td>'+stagePill(stageFor(a.off))+'</td>'
     +'<td class="num">'+a.open+'</td>'
     +'<td>'+(a.openCrit?'<span class="pill r">'+a.openCrit+'</span>':'<span class="pill g">0</span>')+'</td>'
     +'<td>'+(a.sla?'<span class="pill r">Breached ×'+a.sla+'</span>':'<span class="pill g">OK</span>')+'</td>'
     +'<td>'+['tl1','tl2','sm'].map(f=>'<span class="pill '+(a[f]?'v':'n')+'" style="padding:2px 6px;margin-right:3px">'+f.toUpperCase()+'</span>').join('')+'</td>'
     +'<td style="font-size:11.5px;color:var(--muted)">'+esc(a.last||'—')+'</td></tr>').join('')
    +'</tbody></table></div>':'<div class="empty"><div class="big">Clean sheet</div><p>No agents with open offenses in this window.</p></div>')
   +'</div>'
   +'<div><div class="card" style="margin-bottom:14px"><div class="card-h"><span class="t">Stage distribution</span></div><div class="chart-wrap short"><canvas id="chD1"></canvas></div></div>'
   +'<div class="card"><div class="card-h"><span class="t">Open SM escalations</span><span class="s">'+escal.length+'</span></div>'
   +(escal.length?'<table class="tbl"><tbody>'+escal.slice(0,7).map(r=>'<tr><td><b>'+maskName(r.sales_agent)+'</b><div style="font-size:11px;color:var(--muted)">'+esc((r.sm_reason||'').slice(0,60))+'</div></td><td style="text-align:right;font-size:11px;color:var(--muted)">'+esc(r.call_date||'')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">None open.</div>')
   +'</div></div></div>';
}

/* ---------------- AGENT CARD: scoring engine (NBA explainer) ---------------- */
function nbaVal(key,def){const v=(state.rules.nbaThresholds?.vals||[]).find(x=>String(x).startsWith(key+':'));return v?parseFloat(String(v).split(':')[1]):def}
function compWeights(){const out=[];(state.rules.compositeWeights?.vals||[]).forEach(v=>{const i=String(v).lastIndexOf(':');const w=parseFloat(String(v).slice(i+1));if(!isNaN(w))out.push([String(v).slice(0,i),w])});return out}

function acComposite(st,pctile){

     GWP so an upgrade does not silently drop 15% of the score. */
  ws.forEach(([name,w])=>{let v=(name==='GWP %ile')?st.sc['Total GWP']:st.sc[name];
    if(v==null)return;wSum+=w;acc+=v*w;parts.push({name,v:Math.round(v),w,contrib:v*w})});
  const raw=wSum?acc/wSum:0;
  const tier=cfTier(st);
  const pen=tier.pen;   // capped tier penalty (−2 / −5 / −10) replaces the unbounded per-fail deduction
  return{parts,wSum,raw,pen,tier,adj:Math.max(0,Math.min(100,raw-pen))};
}

function aName(cb,label){cb=cb?normCB(cb):null;return (cb&&state.cbInfo[cb])?'<span class="alink" onclick="agentOpen(&#39;'+cb+'&#39;)">'+label+'</span>':label}

/* ---------------- PAGE: TEAM LEADER VIEW (NBA v3.0 report) ---------------- */
function pageTL(win){
  if(!hasData())return emptyState('The Team Leader view needs the Agent List plus the activity sources');
  const CCP=cycleCalc();
  const GF=state.filters;
  const C=acCtx(win);
  const cbs=Object.keys(state.cbInfo).filter(cb=>{const i=state.cbInfo[cb];
    if(GF.tenure&&i.tenure!==GF.tenure)return false;
    if(GF.team&&i.tl!==GF.team)return false;
    if(GF.campaign&&i.queue!==GF.campaign)return false;
    if(GF.agent&&cb!==normCB(GF.agent))return false;
    return true});
  if(!cbs.length)return emptyState('No roster agents match the current filters');
  const wd=workDays(win);
  const gwpFloor=nbaVal('gwpFloor',99);
  const stats=cbs.map(cb=>{const st=acStats(cb,win,C);st.tierInfo=cfTier(st);st.nba=acNBA(st);
    st.gwpTgtP=st.target>0?gwpFloor*st.target*wd:null;
    st.onTgt=st.gwpTgtP!=null?st.gwp>=st.gwpTgtP:null;
    return st});
  const byGroup={};stats.forEach(st=>{(byGroup[st.group]=byGroup[st.group]||[]).push(st)});
  Object.values(byGroup).forEach(g=>{const sorted=g.map(x=>x.gwp).sort((a,b)=>a-b);
    g.forEach(st=>{const below=sorted.filter(x=>x<st.gwp).length;st.pctile=g.length<2?100:below/(g.length-1)*100;
      st.comp=acComposite(st,st.pctile)})});
  const fleet={gwp:0,sales:0,p1:0,p2:0,bothPass:0,onTgt:0,alSum:0,alN:0};
  stats.forEach(st=>{fleet.gwp+=st.gwp;fleet.sales+=st.sales;
    if(st.nba.lvl===1)fleet.p1++;if(st.nba.lvl===2)fleet.p2++;
    const c1=st.gwpSale!=null&&st.gwpSale>=gwpFloor,c2=st.ta!=null&&st.ta>=100;
    st.c1=c1;st.c2=c2;if(c1&&c2)fleet.bothPass++;if(st.onTgt)fleet.onTgt++;
    if(st.attLead!=null){fleet.alSum+=st.attLead;fleet.alN++}});
  const T={};stats.forEach(st=>{const t=T[st.tl]=T[st.tl]||{tl:st.tl,ag:[],gwp:0,sales:0,comp:0,qaS:0,qaN:0,gs:0,gsN:0,al:0,alN:0,p1:0,p2:0,both:0,r2a3:0,r2a2:0,r2a1:0,canc:0,onTgt:0,tgt:0,mix:{}};
    t.ag.push(st);t.gwp+=st.gwp;t.sales+=st.sales;t.comp+=st.comp.raw;
    if(st.qaS!=null){t.qaS+=st.qaS;t.qaN++}
    if(st.gwpSale!=null){t.gs+=st.gwpSale;t.gsN++}
    if(st.attLead!=null){t.al+=st.attLead;t.alN++}
    if(st.nba.lvl===1)t.p1++;if(st.nba.lvl===2)t.p2++;
    if(st.c1&&st.c2)t.both++;
    if(st.tierInfo.tier==='R2A-3')t.r2a3++;if(st.tierInfo.tier==='R2A-2')t.r2a2++;if(st.tierInfo.tier==='R2A-1')t.r2a1++;
    t.canc+=st.canc;if(st.onTgt)t.onTgt++;if(st.gwpTgtP)t.tgt+=st.gwpTgtP;
    t.mix[st.group]=(t.mix[st.group]||0)+1});
  const tls=Object.values(T).sort((a,b)=>b.gwp-a.gwp);
  const pick=state.tlPick&&T[state.tlPick]?state.tlPick:tls[0].tl;
  const P=T[pick];
  const lvlColor=l=>l===1?'var(--red)':l===2?'#B45309':l===3?'var(--blue)':'#158A4C';

    +'<td class="num" style="font-weight:800">'+(CCP&&CCP.byTL[t.tl]?zar2Stack(CCP.byTL[t.tl].total):'—')+'</td></tr>').join('')

  /* --- dual-check + rule distribution --- */
  const vFail=stats.filter(st=>st.gwpSale!=null&&!st.c1).length;
  const vPassVolFail=stats.filter(st=>st.c1&&!st.c2).length;
  const RD={};stats.forEach(st=>{RD[st.nba.code]=(RD[st.nba.code]||0)+1});
  const RORDER=['R1','R2','R2A-3','R3','R2A-2','R4','R4A','R5','R6','R7','R8','R9','R10'];
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px">'
   +'<div class="card"><div class="card-h"><span class="t">Dual-Check fleet analysis</span><span class="s">value first, then volume</span></div><table class="tbl">'
   +'<tr><td><b style="color:#158A4C">BOTH PASS (value+volume)</b></td><td class="num" style="font-weight:800">'+fleet.bothPass+'</td><td class="num">'+(stats.length?Math.round(fleet.bothPass/stats.length*100):0)+'%</td><td style="font-size:11px">R9 / R10 — sustain, stretch, mentor</td></tr>'
   +'<tr><td><b style="color:var(--red)">VALUE FAIL (Check 1)</b></td><td class="num" style="font-weight:800">'+vFail+'</td><td class="num">'+(stats.length?Math.round(vFail/stats.length*100):0)+'%</td><td style="font-size:11px">R4 — value coaching: mix, upsell, premium</td></tr>'
   +'<tr><td><b style="color:#B45309">VALUE PASS, VOLUME FAIL</b></td><td class="num" style="font-weight:800">'+vPassVolFail+'</td><td class="num">'+(stats.length?Math.round(vPassVolFail/stats.length*100):0)+'%</td><td style="font-size:11px">R4A / R6 — volume coaching: activity, closing, pipeline</td></tr>'
   +'</table><div style="font-size:11px;color:var(--muted);margin-top:8px">Check 1 Value = GWP/sale ≥ R'+gwpFloor+'. Check 2 Volume = daily sales ≥ 100% of the roster target. Compliance tiers and QA<'+nbaVal('qaCritical',80)+'% override as P1/P2.</div></div>'
   +'<div class="card"><div class="card-h"><span class="t">NBA rule distribution</span><span class="s">one rule per agent, most serious first</span></div><table class="tbl">'
   +RORDER.filter(c=>RD[c]).map(c=>{const lv=c==='R1'||c==='R2'||c==='R2A-3'||c==='R3'?1:c==='R2A-2'||c==='R4'||c==='R4A'||c==='R5'||c==='R6'?2:c==='R7'||c==='R8'?3:4;
     const n=RD[c];const w=Math.round(n/stats.length*100);
     return '<tr><td style="width:70px"><b style="color:'+lvlColor(lv)+'">'+c+'</b></td><td><div style="background:#EEF2F8;border-radius:4px;height:14px"><div style="width:'+Math.max(w,3)+'%;background:'+lvlColor(lv)+';height:14px;border-radius:4px"></div></div></td><td class="num" style="font-weight:800;width:50px">'+n+'</td></tr>'}).join('')
   +'</table><div style="font-size:11px;color:var(--muted);margin-top:8px">This fleet: '+stats.filter(x=>x.nba.lvl===1).length+' Level 1 · '+stats.filter(x=>x.nba.lvl===2).length+' Level 2 · '+stats.filter(x=>x.nba.lvl===3).length+' Level 3 · '+stats.filter(x=>x.nba.lvl===4).length+' Level 4</div></div>'

  const noAns=(()=>{let na=0,tot=0;P.ag.forEach(a=>{tot+=a.calls||0;na+=(a.bands&&a.bands['No Answer'])||0});return tot?Math.round(na/tot*1000)/10:null})();
  const agSorted=[...P.ag].sort((a,b)=>b.comp.raw-a.comp.raw);
  h+='<div class="card" style="margin-bottom:16px"><div class="card-h"><span class="t">TL: '+maskName(pick)+'</span><span class="s">'+P.ag.length+' agents · '+Object.entries(P.mix).map(([g,n])=>n+' '+esc(g)).join(' · ')+'</span>'
   +'<span class="right">'+tls.map(t=>'<button class="btn small'+(t.tl===pick?' primary':'')+'" onclick="state.tlPick=&#39;'+esc(t.tl).replace(/'/g,'&#39;')+'&#39;;render()">'+maskName(t.tl)+'</button>').join(' ')+'</span></div>'

   +box(P.alN?(Math.round(P.al/P.alN*100)/100).toFixed(2):'—','ATT/LEAD','var(--blue)')

   +box(CCP&&CCP.byTL[pick]?zar2Stack(CCP.byTL[pick].total):'—','CYCLE PROJ.','#158A4C')
   +'</div>'
   +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:6px">'

     +'<div style="flex:1;background:#EEF2F8;border-radius:4px;height:14px"><div style="width:'+Math.round(st.comp.raw)+'%;background:'+lvlColor(st.nba.lvl)+';height:14px;border-radius:4px"></div></div>'

   +(need.p1?'<div class="card" style="border-left:4px solid var(--red);margin-bottom:8px"><b style="color:var(--red)">[LEVEL 1 · PROTECT THE BUSINESS — '+need.p1.length+' urgent (P1)]</b><div style="font-size:11.5px;margin-top:3px">'+need.p1.map(maskName).join(', ')+'. 24–48h action.</div></div>':'')
   +'<div class="card" style="margin-bottom:8px;font-size:11.5px"><b style="color:var(--red)">[R2A-3 Critical Compliance — '+r2a3N.length+']</b> '+(r2a3N.length?r2a3N.map(maskName).join(', ')+'. 48h review, daily monitoring, Elite blocked.':'none.')+'</div>'
   +'<div class="card" style="margin-bottom:8px;font-size:11.5px"><b style="color:#B45309">[R2A-2 Compliance Risk — '+r2a2N.length+']</b> '+(r2a2N.length?r2a2N.map(maskName).join(', ')+'. 5-day structured coaching, Elite blocked.':'none.')+'</div>'

  return h;
}

/* ---------------- PAGE: LEAD MANAGEMENT ---------------- */
function pageLeads(win){
  if(!hasData())return emptyState('Lead Management joins the Agent List with open cases, closed cases, activations and cancellations');
  const roster=state.facts.AGENT_LIST||[];

  let unOpen=0,unClosed=0;

  rowsFor('SF_CLOSED_CASES',win).forEach(r=>{const cb=cbOfOwner(r.case_owner);if(!cb||!A[cb]){if(!cb)unClosed++;return}
    const a=A[cb];a.tc++;const st=String(r.status||'').toLowerCase();
    if(st.includes('no feedback'))a.nofb++;else a.cl++});
  accountPremiums(win).forEach(e=>{if(e.cb&&A[e.cb])A[e.cb].sales++});
  cancelPremiums(win).forEach(e=>{if(e.cb&&A[e.cb])A[e.cb].canc++});
  rowsFor('CALLX_CALL_RECORDS',win).forEach(r=>{const cb=cbOf(r.agent);if(cb&&A[cb]&&r._d)A[cb].dialDays.add(r._d)});
  const wd=workDays(win);
  const CANON=['1st attempt','2nd attempt','3rd attempt','4th attempt','5th attempt','In Progress','New','Escalated'];
  const present=new Set();Object.values(A).forEach(a=>Object.keys(a.sts).forEach(k=>present.add(k)));
  const stCols=[...CANON.filter(c=>present.has(c)),...[...present].filter(c=>!CANON.includes(c)).sort()].slice(0,10);
  const rows=Object.values(A).sort((x,y)=>String(x.tl).localeCompare(String(y.tl))||y.tc-x.tc||String(x.name).localeCompare(String(y.name)));
  const G={open:0,cl:0,nofb:0,tc:0,sales:0,canc:0,sts:{}};
  rows.forEach(a=>{G.open+=a.open;G.cl+=a.cl;G.nofb+=a.nofb;G.tc+=a.tc;G.sales+=a.sales;G.canc+=a.canc;stCols.forEach(c=>G.sts[c]=(G.sts[c]||0)+(a.sts[c]||0))});
  const pc=(n,d)=>d>0?fmtVal(n/d*100,'pct'):'—';
  const f1=v=>(Math.round(v*10)/10).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
  const cell=(a,gt)=>{const wasted=Math.max(0,a.tc-a.sales);
    return '<tr'+(gt?' style="font-weight:800;background:#F4F8FE;border-top:2px solid var(--line)"':'')+'>'
     +'<td>'+(gt?'ALL AGENTS':maskName(a.tl))+'</td>'

     +'<td style="font-size:11.5px">'+(gt?'—':esc(a.ten))+'</td>'

     +'<td class="num" style="font-weight:800">'+a.open.toLocaleString()+'</td>'
     +'<td class="num">'+a.cl+'</td>'
     +'<td class="num">'+a.nofb+'</td>'
     +'<td class="num" style="font-weight:800">'+a.tc+'</td>'
     +'<td class="num" style="font-weight:800">'+(a.open+a.tc).toLocaleString()+'</td>'

     +'<td class="num">'+f1(a.sales/wd)+'</td>'

     +'<td>'+(a.tc>0?'<span class="pill '+(a.sales/a.tc>=.2?'g':a.sales/a.tc>=.1?'a':'r')+'">'+pc(a.sales,a.tc)+'</span>':'—')+'</td>'
     +'<td class="num">'+pc(a.sales,wasted)+'</td>'

     +'<td class="num">'+pc(a.canc,a.sales)+'</td></tr>'};
  const head=t=>'<th class="noclick">'+t+'</th>';
  /* ---- Daily lead movement ---- */

  const asg={},clo={},salByAcc={},attD={};

  rowsFor('SF_CLOSED_CASES',win).forEach(r=>{const o=r.opened_at;if(o&&o>=clampFrom&&o<=win.to)asg[o]=(asg[o]||0)+1;
    if(r._d)clo[r._d]=(clo[r._d]||0)+1});
  rowsFor('SF_ACTIVATED_SERVICES',win).forEach(r=>{if(r.active_flag!==1||!r.account_number||!r._d)return;
    const k=r.account_number;if(!salByAcc[k]||r._d<salByAcc[k])salByAcc[k]=r._d});
  const salD={};Object.values(salByAcc).forEach(d=>{salD[d]=(salD[d]||0)+1});
  rowsFor('ATTENDANCE',win).forEach(r=>{if(r.present_flag&&r._d)attD[r._d]=(attD[r._d]||0)+1});
  const dd=[];{const cur=new Date(clampFrom+'T00:00:00'),end=new Date(win.to+'T00:00:00');let g=0;
    while(cur<=end&&g++<4000){const k=isoDay(cur);const wdY=cur.getDay()!==0&&cur.getDay()!==6;
      if(wdY||asg[k]||clo[k]||salD[k]||attD[k])dd.push(k);cur.setDate(cur.getDate()+1)}}
  const over=dd.length>70;const days=over?dd.slice(-70):dd;
  const wkOf=k=>{const d=new Date(k+'T00:00:00');const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return isoDay(d)};
  const fmtD=k=>k.slice(8,10)+'.'+k.slice(5,7)+'.'+k.slice(0,4);
  const f1d=v=>(Math.round(v*10)/10).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
  const dRow=(label,a,c,sl,at,bold)=>'<tr'+(bold?' style="font-weight:800;background:#F4F8FE;border-top:2px solid var(--line)"':'')+'>'
    +'<td>'+label+'</td><td class="num">'+(a||'·')+'</td><td class="num" style="font-weight:700">'+(c||'·')+'</td>'
    +'<td class="num" style="font-weight:700">'+(sl||'·')+'</td>'
    +'<td class="num">'+(c?fmtVal((sl||0)/c*100,'pct'):'—')+'</td>'
    +'<td class="num">'+(at||'·')+'</td>'
    +'<td class="num">'+(at?f1d((sl||0)/at):'—')+'</td>'
    +'<td class="num" style="color:'+(at?'var(--red)':'inherit')+'">'+(at?f1d((c||0)/at):'—')+'</td></tr>';
  let dailyRows='',wk=null,W={a:0,c:0,s:0,atSum:0,atN:0},G2={a:0,c:0,s:0,atSum:0,atN:0},wn=0;
  const flushWk=()=>{if(wk==null)return;wn++;dailyRows+=dRow('Week '+wn+' Totals',W.a,W.c,W.s,W.atN?f1d(W.atSum/W.atN):0,true);W={a:0,c:0,s:0,atSum:0,atN:0}};
  days.forEach(k=>{const w=wkOf(k);if(wk!==null&&w!==wk)flushWk();wk=w;
    const a=asg[k]||0,c=clo[k]||0,sl=salD[k]||0,at=attD[k]||0;
    dailyRows+=dRow(fmtD(k),a,c,sl,at,false);
    W.a+=a;W.c+=c;W.s+=sl;if(at){W.atSum+=at;W.atN++}
    G2.a+=a;G2.c+=c;G2.s+=sl;if(at){G2.atSum+=at;G2.atN++}});
  flushWk();
  dailyRows+=dRow('Period Totals',G2.a,G2.c,G2.s,G2.atN?f1d(G2.atSum/G2.atN):0,true);
  const dailyCard='<div class="card" style="margin-bottom:16px"><div class="card-h"><span class="t">Daily lead movement</span>'
   +'<span class="info" title="Leads Assigned counts cases (open + closed) by the day they were opened. Total Closed by close date; Total Sales by contract create date, one per account. Attendance is the headcount of present agents that day. SPD = sales ÷ present agents; Closure p/day = closed ÷ present agents. Week rows show attendance as the average present headcount.">i</span>'
   +'<span class="s">'+(over?'last 70 of '+dd.length+' days — narrow the date range for the rest · ':'')+'all global filters apply</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl" style="font-size:12px"><thead><tr>'
   +head('Date')+head('Leads Assigned')+head('Total Closed')+head('Total Sales')+head('Conversion %')+head('Attendance')+head('SPD')+'<th class="noclick" style="color:var(--red)">Closure p/day</th>'
   +'</tr></thead><tbody>'+dailyRows+'</tbody></table></div></div>';
  return dailyCard
   +'<div class="card"><div class="card-h"><span class="t">Lead management — the funnel per agent</span>'
   +'<span class="info" title="Working days in the selected window: '+wd+'. p/d and Payroll SPD divide by working days; Dialing SPD divides by the days the agent actually dialled (CallX). Wasted = Total Closed − Sales. CONFIRM the two SPD definitions with Ryan.">i</span>'
   +'<span class="s">'+rows.length+' roster agents · window '+esc(win.from)+' → '+esc(win.to)+' · all global filters apply</span></div>'

   +head('Team Leader')+head('Data Set')+head('Tenure')+head('Agent Name')

   +head('Ave Closed p/d')+head('Ave Wasted p/d')+head('Sales')+head('Payroll SPD')+head('Dialing SPD')

   +'</tr></thead><tbody>'
   +rows.map(a=>cell(a,false)).join('')
   +cell(G,true)
   +'</tbody></table></div>'
   +((unOpen||unClosed)?'<div class="stale-banner" style="margin-top:10px">⚠ Not attributed to any roster agent (excluded here, still counted in totals on the Sales page): '+(unOpen?unOpen.toLocaleString()+' open case(s)':'')+(unOpen&&unClosed?' · ':'')+(unClosed?unClosed.toLocaleString()+' closed case(s)':'')+'.</div>':'')
   +'</div>';
}

/* ---------------- PAGE: AGENT SCORECARD ---------------- */
function pageScorecard(win){
  if(!hasData())return emptyState('The Scorecard is built on the Agent List and joins attendance, QA, calls and sales onto it');
  const att=rowsFor('ATTENDANCE',win),qa=rowsFor('QA_EVALUATIONS',win),calls=rowsFor('CALLX_CALL_RECORDS',win);
  const gm=gwpMap();const sales=saleRows(win),cancels=cancelRows(win);
  const openCases=rowsFor('SF_OPEN_CASES',win);const openLoaded=(state.facts.SF_OPEN_CASES||[]).length>0;
  const A={};
  const mk=(c,name,tl)=>A[c]=A[c]||{cb:c,code:(state.cbInfo[c]?.code)||c,name:(state.cbInfo[c]?.name)||name,tl:(state.cbInfo[c]?.tl)||tl,tenure:(state.cbInfo[c]?.tenure)||'—',target:(state.cbInfo[c]?.target)??null,refs:0,days:0,present:0,abs:0,ev:0,pass:0,crit:0,score:0,scoreN:0,calls:0,dur:0,sales:new Set(),gwp:0,cancels:new Set(),joins:{}};
  const roster=state.facts.AGENT_LIST||[];
  const GF=state.filters;
  roster.forEach(a=>{if(!a.cb_norm)return;
    if(GF.tenure&&a.tenure!==GF.tenure)return;
    if(GF.team&&a.team_leader!==GF.team)return;
    if(GF.campaign&&a.queue!==GF.campaign)return;
    if(GF.agent&&normCB(a.cb_code)!==normCB(GF.agent))return;
    const r=mk(a.cb_norm,a.agent_name,a.team_leader);r.joins.list=true});
  att.forEach(r=>{const c=normCB(r.employee_code);if(!c)return;const a=mk(c,r.employee_name,r.reports_to);a.joins.att=true;
    if(r.excluded_flag)return;a.days++;if(r.present_flag)a.present++;if(r.absence_flag)a.abs++});
  openCases.forEach(r=>{const cb=cbOfOwner(r.case_owner);if(!cb)return;const a=mk(cb,r.case_owner,'');a.open=(a.open||0)+1;a.joins.sf=true});
  rowsFor('SF_CLOSED_CASES',win).forEach(r=>{const cb=cbOfOwner(r.case_owner);if(!cb)return;const a=mk(cb,r.case_owner,'');a.closedN=(a.closedN||0)+1;a.joins.sf=true});
  accountPremiums(win).forEach(e=>{if(!e.cb)return;const a=mk(e.cb,e.owner,'');a.joins.sf=true;
    a.sales.add(e.acc);a.gwp+=e.gwp||0});
  cancelPremiums(win).forEach(e=>{if(!e.cb)return;const a=mk(e.cb,e.owner,'');a.cancels.add(e.acc)});
  rowsFor('REFERRALS',win).forEach(r=>{const cb=normCB(r.employee_code)||cbOf(r.agent);if(!cb)return;const a=mk(cb,r.agent,'');a.refs+=(r.referral_count??1)});
  qa.forEach(r=>{const c=normCB(r.sales_agent_code)||state.sfOwnerMap?.[normName(r.sales_agent)];if(!c)return;const a=mk(c,r.sales_agent,r.team_leader);
    a.joins.qa=true;a.ev++;
    if(resolveRule('$qaCoaching').includes(r.escalation_decision))a.coach=(a.coach||0)+1;
    if(resolveRule('$qaPass').includes(r.escalation_decision))a.pass++;
    if(resolveRule('$qaCritical').includes(r.escalation_decision))a.crit++;
    if(r.score_percent!=null){a.score+=r.score_percent;a.scoreN++}});
  calls.forEach(r=>{if(!r.agent)return;const c=cbOf(r.agent);if(c&&A[c]){A[c].calls++;A[c].dur+=r.duration_seconds||0;A[c].joins.calls=true}});
  const gm89=gwpMultVal();
  let rows=Object.values(A).map(a=>({...a,nSales:a.sales.size,nCancels:a.cancels.size,
    gwpT:a.target!=null?a.target*gm89:null,
    pctS:a.target>0?a.sales.size/a.target*100:null,
    pctG:a.target>0?a.gwp/(a.target*gm89)*100:null,
    attRate:a.days?a.present/a.days*100:null,
    passRate:a.ev?a.pass/a.ev*100:null,
    avgScore:a.scoreN?a.score/a.scoreN:null,
    cpd:a.present?a.calls/a.present:null}));
  const sort=state.sort.scorecard||{k:'crit',asc:false};
  rows.sort((x,y)=>{const a=x[sort.k]??-1,b=y[sort.k]??-1;return sort.asc?(a>b?1:-1):(a<b?1:-1)});
  const th=(label,key)=>'<th onclick="sortScore(\''+key+'\')">'+label+(sort.k===key?(sort.asc?' ↑':' ↓'):'')+'</th>';
  const unmappedAgents=[...new Set(calls.filter(c=>c.agent&&!state.agentMap[c.agent]).map(c=>c.agent))];
  const offRoster=roster.length?rows.filter(r=>!r.joins.list):[];

  const offNote=(offRoster.length?' · <span style="color:var(--red)">'+offRoster.length+' with activity but not on the list</span>':'')

  // TL rollup
  const T={};rows.forEach(r=>{const t=r.tl||'(unassigned)';T[t]=T[t]||{n:0,att:0,attN:0,pass:0,passN:0,crit:0,calls:0,present:0,sales:0,gwp:0,cancels:0,target:0,refs:0};const g=T[t];g.n++;
    g.sales+=r.nSales;g.gwp+=r.gwp;g.cancels+=r.nCancels;g.target+=(r.target||0);g.refs+=(r.refs||0);
    if(r.attRate!=null){g.att+=r.attRate;g.attN++}

function csvTemplate(k){

  const sample={CAMPAIGN_REGISTER:[['Matrix Cuddle',8,12,90,92,210,330,55,92,'Yes'],['Matrix Courtesy',5,10,90,94,190,320,48,92,'Yes'],['Matrix Retentions',6,14,92,95,200,325,52,92,'Yes'],['Beam-e Renewals',4,9,90,93,180,315,44,90,'Yes']],
   COMMISSION_RULES:[['Matrix Cuddle','All',1,0,45,85,90,'Quality bonus',750,'Month-end QA at or above 92% with zero critical fails','Calendar month','Activated VAS sale, contract status Active'],
     ['Matrix Cuddle','All',2,60,60,85,90,'','','','',''],['Matrix Cuddle','All',3,100,78,85,90,'','','','',''],['Matrix Cuddle','All',4,140,95,85,90,'','','','','']],
   COMMISSION_STATEMENT:[['10482','Thando Mbeki','Matrix Cuddle','2026-07',96,8352,4320,'Approved'],['10517','Sizwe Ndlovu','Matrix Cuddle','2026-07',71,6177,3195,'Approved']],
   COMMISSION_BRACKETS:[['Matrix Cuddle','Exp Cuddle',1,9286.96,4000,'Calendar month'],['Matrix Cuddle','Exp Cuddle',2,10834.78,6000,'Calendar month'],
     ['Matrix Cuddle','Exp Cuddle',3,12382.61,7500,'Calendar month'],['Matrix Cuddle','Exp Cuddle',4,13930.43,10000,'Calendar month'],
     ['Matrix Cuddle','Exp Cuddle',5,15478.26,12000,'Calendar month'],['Matrix Cuddle','Exp Cuddle',6,17026.09,14000,'Calendar month']]}[k]||[];
  const rows=[s.headers].concat(sample);

function setThresh(id,field,val){const k=state.kpis.find(x=>x.id===id);if(!k)return;
  const n=val===''?null:parseFloat(val);k[field]=(n==null||isNaN(n))?null:n;
  saveConfig();render();toast(k.name+' — thresholds updated across all dashboards','ok')}
function setDir(id,val){const k=state.kpis.find(x=>x.id===id);if(!k)return;k.dir=val;saveConfig();render();toast(k.name+' — direction flipped')}
function resetThresh(id){const k=state.kpis.find(x=>x.id===id);const d=DEFAULT_KPIS.find(x=>x.id===id);if(!k||!d){toast('No default for this custom KPI — set values manually');return}
  k.green=d.green;k.amber=d.amber;k.dir=d.dir;saveConfig();render();toast(k.name+' — restored to default thresholds','ok')}
function clearThresh(id){const k=state.kpis.find(x=>x.id===id);if(!k)return;k.green=null;k.amber=null;saveConfig();render();toast(k.name+' — RAG removed (informational metric)')}
function toggleKPI(id,on){const k=state.kpis.find(x=>x.id===id);if(k){k.show=on;saveConfig();toast(k.name+(on?' shown':' hidden'))}}
function deleteKPI(id){const k=state.kpis.find(x=>x.id===id);if(!k)return;if(!confirm('Delete "'+k.name+'"? (Defaults can be restored later.)'))return;state.kpis=state.kpis.filter(x=>x.id!==id);saveConfig();render()}
function restoreKPIs(){if(!confirm('Restore the default KPI set? Custom KPIs are kept.'))return;const custom=state.kpis.filter(k=>!k.core);state.kpis=JSON.parse(JSON.stringify(DEFAULT_KPIS)).concat(custom);saveConfig();render();toast('Default KPIs restored','ok')}
function restoreRules(){if(!confirm('Restore all interpretation rules to defaults?'))return;state.rules=JSON.parse(JSON.stringify(DEFAULT_RULES));saveConfig();render();toast('Rules restored to defaults','ok')}
function ruleAdd(key){const inp=document.getElementById('rin_'+key);const v=(inp.value||'').trim();if(!v)return;state.rules[key].vals.push(v);inp.value='';saveConfig();render();toast('Rule updated — all KPIs recalculated','ok')}
function ruleDel(key,i){state.rules[key].vals.splice(i,1);saveConfig();render();toast('Rule updated — all KPIs recalculated','ok')}
function mapAgent(name,code){if(code)state.agentMap[name]=normCB(code);else delete state.agentMap[name];saveConfig();toast('Mapping saved')}

function saveKPI(id,isNew){
  const g=v=>document.getElementById(v).value.trim();
  const name=g('kName');if(!name){toast('Give the KPI a name','err');return}
  const ff=g('kFF');let num=null;
  if(ff){let v=g('kFV');if(!v.startsWith('$')&&v.includes(','))v=v.split(',').map(s=>s.trim()).filter(Boolean);
    num=[{f:ff,op:document.getElementById('kFO').value,v:v}]}
  const k={id:isNew?id:id,name,domain:g('kDomain')||document.getElementById('kDomain').value,icon:'target',
    src:document.getElementById('kSrc').value,type:document.getElementById('kType').value,
    field:g('kField')||null,num,format:document.getElementById('kFmt').value,
    dir:document.getElementById('kDir').value,
    green:g('kGreen')===''?null:parseFloat(g('kGreen')),amber:g('kAmber')===''?null:parseFloat(g('kAmber')),
    owner:g('kOwner'),interp:g('kInterp'),red:g('kRed'),show:true,core:false};
  k.domain=document.getElementById('kDomain').value;
  if(isNew)state.kpis.push(k);
  else{const i=state.kpis.findIndex(x=>x.id===id);const old=state.kpis[i];k.core=old.core;k.icon=old.icon;k.special=old.special;k.den=old.den;if(old.type==='cross'){k.type='cross';k.num=old.num;k.den=old.den;k.src=old.src}state.kpis[i]=k}
  saveConfig();closeModal();render();toast('KPI saved — dashboards updated','ok');
}

/* ---------------- DETERMINISTIC 30-DAY HISTORY (prototype data, manual-upload equivalent) ---------------- */
AP.monthWorkdays=function(upToToday){const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  let n=0;const x=new Date(y,m,1);
  while(x.getMonth()===m){if(upToToday&&x.getDate()>d.getDate())break;
    if(x.getDay()!==0&&x.getDay()!==6)n++;x.setDate(x.getDate()+1)}
  return n};
AP.workdays=n=>{const out=[];const d=new Date();let i=0;while(out.length<n){const x=new Date(d);x.setDate(d.getDate()-i);i++;if(x.getDay()===0||x.getDay()===6)continue;out.unshift(isoDay(x))}return out};
AP.CLOSURE_BY_AGENT={thando:72,sizwe:70,naledi:48,bongani:52,amahle:61,refilwe:64,palesa:78,
 kagiso:41,zanele:58,lerato:68,tumelo:63,sipho:65,nomsa:50,jabu:74};
AP.buildHistory=function(){
  const days=AP.workdays(30);AP.D.days=days;AP.D.hist={};
  AP.AGENTS.forEach((a,ai)=>{
    const R=seeded(101+ai*37);const p=a.prof,tr=a.trend||{};const rows=[];
    days.forEach((d,i)=>{
      const late=Math.max(0,i-(days.length-10))/10;                    // trend ramps over the last 10 days
      const j=(k,base,amp)=>Math.max(0,base+(tr[k]||0)*late+(R()-.5)*amp);
      const present=R()<Math.min(1,(p.att+(tr.att||0)*late))?1:0;
      const pres=present?Math.round(j('pres',p.pres,7)):0;
      const conv=present?j('conv',p.conv,1.9):0;
      const sales=present?Math.max(0,Math.round(pres*conv/100)):0;
      rows.push({d:d,present:present,
        sales:sales,pres:pres,conv:pres?Math.round(sales/pres*1000)/10:0,
        contacts:present?Math.round(j('contacts',p.contacts,8)):0,
        calls:present?Math.round(j('contacts',p.contacts,8)*3.4+R()*18):0,
        talk:present?Math.round(j('talk',p.talk,26)):0,
        prod:present?Math.round(j('prod',p.prod,24)):0,
        qa:present?Math.round(j('qa',p.qa,4.5)*10)/10:null,
        clean:present?Math.round(j('clean',p.clean,4.5)*10)/10:null,
        adher:present?Math.round(j('adher',p.adher,5)*10)/10:0,
        compEx:present?(R()<(p.compEx%1||0)?1:0)+Math.floor(p.compEx):0,
        closure:0,leads:0});
      const row=rows[rows.length-1];
      const cl0=AP.CLOSURE_BY_AGENT[a.id]||62;
      row.closure=present?Math.max(5,Math.min(100,Math.round((cl0+(R()-.5)*7)*10)/10)):0;
      row.leads=present?Math.round(row.pres/Math.max(.05,row.closure/100)):0;
    });
    AP.D.hist[a.id]=rows;
  });
};
AP.rows=id=>AP.D.hist[id]||[];

/* A rand driver has to print as rand. Without this, "Avg GWP per Sale" read
   "112 of 99" on the one screen where the whole point is that it is money. */
AP.mFmt=(v,f)=>{if(v==null)return '—';if(f==='pct')return (Math.round(v*10)/10)+'%';if(f==='rand')return AP.zar(v);if(f==='att')return v>=1?'All 5 sessions':(Math.round((v||0)*5)+' of 5 sessions');return Math.round(v).toLocaleString()};
AP.metricRow=function(a,m){
  const t=AP.today(a.id);const cur=t[m.k];const tgt=m.tgt(a);
  const av7=m.k==='present'?AP.avg(a.id,'present',7):AP.avg(a.id,m.k,7);
  const av30=m.k==='present'?AP.avg(a.id,'present',30):AP.avg(a.id,m.k,30);
  const gap=cur==null?null:(m.dir==='higher'?cur-tgt:tgt-cur);
  const dir=(av7==null||av30==null)?0:(av7-av30);
  const ok=gap==null?null:gap>=0;
  return {m:m,cur:cur,tgt:tgt,gap:gap,av7:av7,av30:av30,dir:dir,ok:ok};
};
AP.gapsFor=function(a){
  const DRIVEN={sales:1,pres:1};   // sales is the outcome the other metrics drive — never the diagnosed cause
  return AP.METRICS.map(m=>AP.metricRow(a,m)).filter(r=>r.cur!=null&&r.gap!=null&&r.gap<0&&!DRIVEN[r.m.k])
    .map(r=>{const rel=r.tgt?Math.abs(r.gap)/Math.max(1,Math.abs(r.tgt)):0;
      const W=(window.AP&&AP.SEV_W)||{qa:1.9,clean:1.9,compEx:2.2,present:1.7,conv:1.35,adher:1.15};   // set in the rule book; quality and attendance gate commission
      return Object.assign(r,{sev:rel*(W[r.m.k]||1),rel:rel})})
    .sort((x,y)=>y.sev-x.sev);
};

/* ---------------- COMMISSION ENGINE (configurable per campaign; estimated vs confirmed) ---------------- */
AP.comm=function(id){
  const a=AP.agentById(id),c=AP.camp(a),cfg=c.comm;
  const rows=AP.rows(id);const m=isoDay(new Date()).slice(0,7);
  const mrows=rows.filter(r=>r.d.slice(0,7)===m);
  const qaOK=r=>r.qa==null||r.qa>=cfg.minQA;
  const clOK=r=>r.clean==null||r.clean>=cfg.minClean;
  const qualOf=r=>(qaOK(r)&&clOK(r))?(r.sales||0):0;
  const heldOf=r=>(qaOK(r)&&clOK(r))?0:(r.sales||0);
  const mtdQual=mrows.reduce((s,r)=>s+qualOf(r),0);
  const mtdHeld=mrows.reduce((s,r)=>s+heldOf(r),0);
  const tiers=cfg.tiers;
  let tier=tiers[0];for(const t of tiers){if(mtdQual>=t.from)tier=t}
  const next=tiers.find(t=>t.from>mtdQual)||null;
  const need=next?next.from-mtdQual:0;
  const clearDays=AP.rb?AP.rb('clearing_sessions'):3;const cutoff=rows.filter(r=>r.present).slice(-clearDays)[0];
  const cutIdx=cutoff?rows.findIndex(r=>r.d===cutoff.d):rows.length;
  const confirmedSales=mrows.filter((r,i)=>rows.indexOf(r)<cutIdx).reduce((s,r)=>s+qualOf(r),0);
  const t=rows[rows.length-1]||{};
  const todayQual=qualOf(t),todayHeld=heldOf(t);
  const wk=rows.slice(-5).reduce((s,r)=>s+qualOf(r),0);
  const est=mtdQual*tier.rate;
  const confirmed=confirmedSales*tier.rate;
  const totalDays=AP.monthWorkdays(false),doneDays=Math.max(1,Math.min(totalDays,AP.monthWorkdays(true)));
  const projected=doneDays?Math.round(mtdQual/doneDays*Math.max(totalDays,doneDays)*tier.rate):0;
  const ifTarget=(mtdQual-todayQual+c.dailyTarget)*tier.rate;
  const ifNext=next?next.from*next.rate:null;
  const remDays=Math.max(1,totalDays-doneDays);
  /* delayed means a qualifying sale has sat past the clearing window, not simply that it is recent */
  const stale=mrows.filter(function(r,i){return rows.indexOf(r)<cutIdx-2&&qualOf(r)>0}).length;
  const overdueClearing=(est-confirmed)>0&&stale>0&&confirmed===0;
  const perDay=next?Math.max(1,Math.ceil(need/remDays)):0;
  return {agent:a,camp:c,cfg:cfg,tier:tier,next:next,need:need,rate:tier.rate,remDays:remDays,perDay:perDay,
    mtdQual:mtdQual,mtdHeld:mtdHeld,todayQual:todayQual,todayHeld:todayHeld,weekQual:wk,
    todayEst:todayQual*tier.rate,weekEst:wk*tier.rate,mtdEst:est,confirmed:confirmed,pending:est-confirmed,
    projected:projected,ifTarget:ifTarget,ifNext:ifNext,overdueClearing:overdueClearing,
    nextGain:next?(next.from*next.rate)-est:0};
};

AP.diagnose=function(id){
  const a=AP.agentById(id),c=AP.camp(a);const gaps=AP.gapsFor(a);
  if(!gaps.length)return null;
  const g=gaps[0];
  const cause=AP.SCEN[a.id]||'unclear';
  const ev=[];
  ev.push({t:'Confirmed fact',v:g.m.label+' is '+AP.mFmt(g.cur,g.m.fmt)+' against a target of '+AP.mFmt(g.tgt,g.m.fmt)+' — a gap of '+AP.mFmt(Math.abs(g.gap),g.m.fmt)+'.',src:g.m.src});
  if(g.av7!=null)ev.push({t:'Data pattern',v:'Seven-day average '+AP.mFmt(g.av7,g.m.fmt)+' versus thirty-day '+AP.mFmt(g.av30,g.m.fmt)+' — '+(g.dir>=0?'improving':'deteriorating')+'.',src:'Prototype history'});
  const t=AP.today(a.id);
  if(cause==='skill')ev.push({t:'Data pattern',v:'Presentations are at '+t.pres+' with only '+t.sales+' closes — the opportunity is there, the close is not.',src:'CallX + Salesforce'});
  if(cause==='qa')ev.push({t:'Confirmed fact',v:'Clean-sale rate '+AP.mFmt(t.clean,'pct')+' against a campaign minimum of '+c.comm.minClean+'% — sales below this do not qualify for commission.',src:'QA clean-sale review'});
  if(cause==='system')ev.push({t:'Data pattern',v:'Productive contacts '+t.contacts+' against a target of '+c.contactTarget+' while adherence is '+AP.mFmt(t.adher,'pct')+' — the agent is at their desk but not reaching people.',src:'CallX + adherence'});
  if(cause==='leads')ev.push({t:'Data pattern',v:'Presentations '+t.pres+' are healthy but contacts are only '+t.contacts+' — the list is being worked, the numbers are not answering.',src:'CallX call records'});
  if(cause==='attendance')ev.push({t:'Confirmed fact',v:'Adherence '+AP.mFmt(t.adher,'pct')+' against a target of '+c.adherenceTarget+'% and '+AP.sum(a.id,'present',10)+' of the last 10 days present.',src:'Workforce attendance export'});
  if(cause==='knowledge')ev.push({t:'Data pattern',v:'Tenure group '+a.tenure+' with '+AP.sum(a.id,'sales',30)+' sales in 30 days — the pattern matches a knowledge ramp, not a behaviour problem.',src:'Agent list + Salesforce'});
  if(cause==='motivation')ev.push({t:'Data pattern',v:'Sales and productive time have both fallen while QA has held — capability appears intact.',src:'Prototype history'});
  if(cause==='target')ev.push({t:'Nikola inference',v:'Conversion '+AP.mFmt(t.conv,'pct')+' is above campaign target while sales sit below it — the daily target on the roster may not match the lead volume supplied.',src:'Agent list Target column'});
  const conf=cause==='unclear'?'Low':(gaps.length>2?'Medium':'High');
  return {agent:a,gap:g,gaps:gaps,cause:cause,causeDef:AP.CAUSES[cause],alt:AP.ALT[cause],altDef:AP.CAUSES[AP.ALT[cause]],evidence:ev,confidence:conf,
    next:AP.CAUSES[cause].route,owner:AP.CAUSES[cause].owner};
};

AP.plainWhy=function(a,cause){
  const t=AP.today(a.id),c=AP.camp(a);
  switch(cause){
    case 'skill':return t.pres+' customers were pitched today and '+(t.sales||0)+' bought. The calls are ending before the close.';
    case 'qa':return 'Your clean-sale rate is '+AP.mFmt(t.clean,'pct')+'. Sales below '+c.comm.minClean+'% do not count towards your commission.';
    case 'knowledge':return 'You are still in your first months on '+c.name+', and product questions are where the calls are ending.';
    case 'leads':return 'You reached '+t.contacts+' customers today against '+c.contactTarget+' normally. The numbers on the list are not answering.';
    case 'system':return 'You reached '+t.contacts+' customers today against '+c.contactTarget+' normally, and you were at your desk for all of it.';
    case 'attendance':return 'You were in a working state '+AP.mFmt(t.adher,'pct')+' of the session against '+c.adherenceTarget+'%. That is less time on the phone.';
    case 'motivation':return 'Your sales and your time on the phone have both dropped while your quality has held.';
    case 'target':return 'Your conversion is above target but your sales are below it. Your target may not match the leads you are getting.';
    default:return 'Your team leader needs to listen to two calls before deciding what will help.';
  }
};
AP.payoffStrip=function(play){
  const k=play.metricKey;
  if(!k)return '<div class="pay"><span class="pay-k">This one checks a fact first.</span>'

  if(!p)return '';

  const money=(lift&&lift.heldMoney&&rand>0)?(AP.plainRand(rand)+' is held behind it')
    :(rand>0?(AP.plainRand(rand)+' this month'):'');
  if(p.available<1&&!rand)
    return '<div class="pay"><span class="pay-k">Protects</span><span class="pay-v">'+esc(p.label)+'</span>'
     +'<span class="pay-sep">·</span><span class="pay-v">already at target, worth holding</span>'
     +'<span class="pay-s">'+esc(AP.mFmt(p.value,p.fmt))+' over your last 5 sessions</span></div>';

   +'<span class="pay-k">Moves</span><span class="pay-v">'+esc(p.label)+'</span>'

   +(money?'<span class="pay-sep">·</span><span class="pay-v rand">'+esc(money)+'</span>':'')

};
AP.drvLabel=function(k,fallback){

AP.drvGapText=function(agentId,k){

AP.recs=function(id){
  const dg=AP.diagnose(id);if(!dg)return [];
  const a=dg.agent,c=AP.camp(a),cm=AP.comm(id);
  const out=[];
  const push=(cause,tpl,rank)=>{
    const g=dg.gap;
    out.push({id:'rec_'+a.id+'_'+cause+'_'+rank,agent:a.id,title:tpl.title,instruction:tpl.ins,mins:tpl.mins,
      /* The driver is a property of the ACTION, not of the agent's largest gap.
         Filing "read the affordability answer" under talk time meant the result
         was later measured against a number the action never touched. */
      drv:tpl.drv||null,
      metric:AP.drvLabel(tpl.drv,g.m.label),metricKey:tpl.drv||null,
      gapText:AP.drvGapText(a.id,tpl.drv)||(AP.mFmt(g.cur,g.m.fmt)+' against '+AP.mFmt(g.tgt,g.m.fmt)),
      cause:cause,causeLabel:AP.CAUSES[cause].label,route:AP.CAUSES[cause].route,why:AP.plainWhy(a,cause),
      evidence:dg.evidence,confidence:rank===0?dg.confidence:'Medium',
      impact:rank===0?'High':'Medium',urgency:dg.gap.sev>.35?'High':dg.gap.sev>.18?'Medium':'Low',
      controllable:g.m.ctrl,complianceRisk:(cause==='qa'||g.m.k==='compEx')?'Yes':'No',
      coachingRequired:tpl.coach,supportRequired:tpl.coach,
      commOpp:cm.next?('Closing this gap improves the probability of reaching Tier '+cm.next.n+' — '+cm.need+' qualifying sales away, about '+cm.perDay+' a day over the '+cm.remDays+' working day'+(cm.remDays===1?'':'s')+' left'):'Protects the current commission tier — the top tier on this campaign',
      benefit:'Improves the probability of moving '+g.m.label.toLowerCase()+' back to target'});
  };
  /* If the diagnosed cause points at a driver with nothing left to win, work
     the driver that actually has points in it instead. Diagnosis still decides
     the KIND of action; the rating decides whether it is worth doing at all. */
  const availOf=function(k){if(!k)return 0;
    const p=AP.rating(a.id).parts.find(function(x){return x.k===k});return p?p.available:0};
  const MINR=AP.rb?AP.rb('rec_min_points'):1;
  const worth=function(cause){return (AP.RECTPL[cause]||[]).some(function(t){return availOf(t.drv)>=MINR})};
  /* The driver with the most points sitting in it leads the menu. Diagnosis
     still decides the KIND of action, but a team leader must always be able to
     buy the biggest prize — offering four conversion actions to an agent whose
     money is blocked by quality is how a coaching slot gets spent on nothing. */
  const weakest=AP.rating(a.id).weakest;
  const causeFor=function(k){return Object.keys(AP.RECTPL).find(function(c){
    return (AP.RECTPL[c]||[]).some(function(t){return t.drv===k})})};
  let cause=dg.cause;
  const top=(weakest&&availOf(weakest.k)>=MINR)?causeFor(weakest.k):null;
  if(top&&top!==cause){
    (AP.RECTPL[top]||[]).forEach((t,i)=>push(top,t,i));
    if(worth(cause))(AP.RECTPL[cause]||[]).forEach((t,i)=>push(cause,t,i+10));
    cause=top;
  }else{
    if(!worth(cause)&&top)cause=top;
    (AP.RECTPL[cause]||[]).forEach((t,i)=>push(cause,t,i));
  }
  const alt=dg.alt;if(AP.RECTPL[alt]&&alt!==cause)push(alt,AP.RECTPL[alt][0],2);
  if(dg.gaps[1]){const g2=dg.gaps[1];const c2=g2.m.k==='qa'||g2.m.k==='clean'?'qa':g2.m.k==='adher'||g2.m.k==='present'?'attendance':cause;
    if(AP.RECTPL[c2])push(c2,AP.RECTPL[c2][AP.RECTPL[c2].length-1],3)}
  /* Drop anything aimed at a driver with nothing left to win. An action worth
     0 points and R0 is not an action, and offering one teaches an agent that
     the payoff line is decoration. Keep the best of them only if nothing else
     survives, so the team leader is never left with an empty list. */
  const live=out.filter(function(r){return !r.metricKey||availOf(r.metricKey)>=MINR});
  /* the same instruction must never appear twice in one menu */
  const seen={},uniq=[];
  /* and never offer what the agent is already doing — the two-action ceiling is
     halved by accident when the top recommendation is the open action */
  AP.activePlays(a.id).forEach(function(p){seen[p.title]=1});
  (live.length?live:out.slice(0,1)).forEach(function(r){
    if(seen[r.title])return;seen[r.title]=1;uniq.push(r)});
  return uniq;
};

AP.PLAY_ST={assigned:{l:'Assigned',c:'b'},viewed:{l:'Viewed',c:'n'},started:{l:'Started',c:'b'},assistance_requested:{l:'Assistance requested',c:'a'},
 blocked:{l:'Blocked',c:'r'},completed_agent:{l:'Completed by agent',c:'g'},awaiting_review:{l:'Awaiting review',c:'a'},closed:{l:'Closed',c:'n'},
 replaced:{l:'Replaced',c:'n'},escalated:{l:'Escalated',c:'v'}};
AP.REQ_ST={requested:{l:'Requested',c:'b'},accepted:{l:'Accepted',c:'b'},scheduled:{l:'Scheduled',c:'b'},in_progress:{l:'In progress',c:'a'},
 tl_complete:{l:'Team leader marked complete',c:'a'},awaiting_confirm:{l:'Awaiting agent confirmation',c:'a'},confirmed:{l:'Confirmed complete',c:'g'},
 reopened:{l:'Reopened by agent',c:'r'},unable:{l:'Unable to complete',c:'n'},escalated:{l:'Escalated',c:'v'},overdue:{l:'Overdue',c:'r'}};
AP.DEAD={closed:1,replaced:1,escalated:1};
AP.playsOf=id=>AP.s.plays.filter(p=>p.agent===id);
AP.activePlays=id=>AP.playsOf(id).filter(p=>!AP.DEAD[p.status]);
AP.canAssign=id=>AP.activePlays(id).length<(AP.rb?AP.rb('max_open_actions'):2);
AP.reqsOf=id=>AP.s.reqs.filter(r=>r.agent===id);
AP.coachOf=id=>AP.s.coach.filter(c=>c.agent===id);
AP.openReqs=tlId=>AP.s.reqs.filter(r=>AP.agentById(r.agent).tl===tlId&&['requested','accepted','scheduled','in_progress','reopened','overdue'].indexOf(r.status)>=0);
AP.isOverdue=r=>['requested','accepted','scheduled','in_progress'].indexOf(r.status)>=0&&r.dueBy&&r.dueBy<AP.now();

AP.notify=function(who,agentId,title,detail,kind){
  AP.s.notifs.unshift({id:AP.uid('n'),who:who,agent:agentId,title:title,detail:detail,kind:kind||'info',at:AP.now(),read:false});
  AP.s.notifs=AP.s.notifs.slice(0,200);
};
AP.notifsFor=function(){
  if(AP.s.role==='agent')return AP.s.notifs.filter(n=>n.who==='agent'&&n.agent===AP.s.agentId);
  return AP.s.notifs.filter(n=>n.who==='tl'&&AP.agentById(n.agent).tl===AP.s.tlId);
};
AP.unread=()=>AP.notifsFor().filter(n=>!n.read).length;

/* ---- assignment (team leader only) ---- */
AP.mkPlay=function(agentId,src,due,tlId){
  const a=AP.agentById(agentId);
  return {id:AP.uid('play'),agent:agentId,title:src.title,instruction:src.instruction,
    assignedBy:AP.tlById(tlId||a.tl).name,assignedAt:AP.now(),due:due||'11:00',
    metric:src.metric,metricKey:src.metricKey,gapText:src.gapText,reason:src.reason||src.why||('Your '+String(src.metric).toLowerCase()+' is at '+String(src.gapText||'').toLowerCase()+'.'),
    evidence:src.evidence||[],benefit:src.benefit||'',mins:src.mins||15,status:'assigned',
    supportRequired:!!src.supportRequired,commOpp:src.commOpp||'',confidence:src.confidence||'Medium',
    cause:src.cause||'unclear',causeLabel:src.causeLabel||AP.CAUSES.unclear.label,custom:!!src.custom,
    baseline:AP.baselineOf(agentId,src.metricKey),after:null,
    history:[{at:AP.now(),actor:AP.tlById(tlId||a.tl).name,what:'Assigned'}]};
};
AP.baselineOf=function(agentId,key){
  /* Read the driver off the rating when the action names one, so the after
     reading is the same measurement as the before reading. */
  const p=key?AP.rating(agentId).parts.find(function(x){return x.k===key}):null;
  if(p)return {key:key,label:p.label,fmt:p.fmt,value:p.value,av7:p.value,points:p.points,at:AP.now()};
  const t=AP.today(agentId);const m=AP.METRICS.find(x=>x.k===key)||AP.METRICS[0];
  return {key:key||null,label:key?m.label:'No single driver',fmt:m.fmt,
    value:key&&t[key]!=null?t[key]:null,av7:key?AP.avg(agentId,key,7):null,at:AP.now()};
};
AP.assignPlay=function(agentId,src,due){
  if(!AP.canAssign(agentId)){toast('This agent already has two active Daily Plays.','err');return null}
  const p=AP.mkPlay(agentId,src,due,AP.s.tlId);
  AP.s.plays.unshift(p);
  AP.notify('agent',agentId,'New Daily Play assigned',p.title+' — due '+p.due,'play');
  AP.log('assign','Daily Play · '+AP.agentById(agentId).name,p.title+' (metric: '+p.metric+', cause: '+p.causeLabel+', due '+p.due+')');
  AP.save();return p;
};
AP.replacePlay=function(oldId,src,reason,due){
  const old=AP.s.plays.find(p=>p.id===oldId);if(!old)return null;
  old.status='replaced';old.replaceReason=reason;
  old.history.push({at:AP.now(),actor:AP.tl().name,what:'Withdrawn and replaced — '+reason});
  const p=AP.mkPlay(old.agent,src,due,AP.s.tlId);p.replaces=oldId;
  old.replacedBy=p.id;AP.s.plays.unshift(p);
  AP.notify('agent',old.agent,'Daily Play changed','"'+old.title+'" was replaced with "'+p.title+'" — reason: '+reason,'play');
  AP.log('replace','Daily Play · '+AP.agentById(old.agent).name,'Replaced "'+old.title+'" with "'+p.title+'" — reason: '+reason);
  AP.save();return p;
};
AP.rejectRec=function(agentId,recTitle,reason){
  AP.log('reject','Nikola recommendation · '+AP.agentById(agentId).name,'Rejected "'+recTitle+'" — reason: '+reason);
  AP.s.rejected=AP.s.rejected||{};AP.s.rejected[agentId+'|'+recTitle]=reason;AP.save();
};
/* ---- agent actions ---- */
AP.playAct=function(id,act){
  const p=AP.s.plays.find(x=>x.id===id);if(!p)return;
  const map={view:'viewed',start:'started',complete:'completed_agent',block:'blocked'};
  const label={view:'Viewed by agent',start:'Started',complete:'Marked completed by agent',block:'Marked blocked by agent'};
  if(act==='complete'){p.status='completed_agent';p.completedAt=AP.now();
    p.history.push({at:AP.now(),actor:AP.agentById(p.agent).name,what:label[act]});
    AP.notify('tl',p.agent,'Agent completed an action',AP.agentById(p.agent).name+' completed "'+p.title+'" — review and measure the result','play');
  }else{p.status=map[act]||p.status;p.history.push({at:AP.now(),actor:AP.agentById(p.agent).name,what:label[act]||act})}
  AP.log('play',AP.agentById(p.agent).name,label[act]+' — '+p.title,AP.agentById(p.agent).name);
  AP.save();
};
AP.closePlay=function(id,outcome){
  const p=AP.s.plays.find(x=>x.id===id);if(!p)return;
  p.status='closed';p.closedAt=AP.now();p.outcome=outcome||'Closed by team leader';
  p.history.push({at:AP.now(),actor:AP.tl().name,what:'Closed — '+p.outcome});
  AP.log('play','Daily Play · '+AP.agentById(p.agent).name,'Closed "'+p.title+'" — '+p.outcome);
  AP.save();
};

AP.raiseSupport=function(agentId,playId,reasonCode,note){
  const a=AP.agentById(agentId);const dg=AP.diagnose(agentId);const play=AP.s.plays.find(p=>p.id===playId);
  const r={id:AP.uid('req'),agent:agentId,tl:a.tl,playId:playId||null,reason:reasonCode,
    reasonLabel:(AP.REASONS.find(x=>x.c===reasonCode)||{l:'Other'}).l,note:note||'',
    campaign:AP.camp(a).name,createdAt:AP.now(),dueBy:AP.dueStamp(AP.SLA_HOURS),status:'requested',
    metric:dg?dg.gap.m.label:'—',gap:dg?(AP.mFmt(dg.gap.cur,dg.gap.m.fmt)+' against '+AP.mFmt(AP.gateTargetFor(dg.gap.m.k,dg.agent||a),dg.gap.m.fmt)):'—',
    diagnosis:dg?dg.causeDef.label:'Not yet diagnosed',confidence:dg?dg.confidence:'Low',
    refs:dg?dg.evidence.slice(0,3):[],tlNotes:[],assistance:'',scheduledFor:'',
    history:[{at:AP.now(),actor:a.name,what:'Requested — '+(AP.REASONS.find(x=>x.c===reasonCode)||{l:'Other'}).l}]};
  AP.s.reqs.unshift(r);
  if(play){play.status='assistance_requested';play.reqId=r.id;play.history.push({at:AP.now(),actor:a.name,what:'Assistance requested'})}
  AP.notify('tl',agentId,'New support request',a.name+' — '+r.reasonLabel+' (respond by '+r.dueBy+')','support');
  AP.log('support',a.name,'Raised support request — '+r.reasonLabel,a.name);
