  repeat_min:2,              /* this many of the same cluster is a repeat */
  persistent_min:4,          /* this many is persistent */
  pen_repeat:2, pen_persistent:5, pen_cap:5,
  combined_pen_cap:15,       /* compliance adjustment and coaching adjustment together */
  stale_days:45,             /* past this, a theme is shown as having gone quiet */
  min_conf:0.6,              /* a classification below this is not counted */
  load_high:8                /* sessions in the window above which the load itself is the finding */
};
AP.CX_T=Object.assign({},AP.CX_T_DEFAULT);
AP.cxt=function(k){const v=AP.CX_T[k];return (v==null||v==='')?AP.CX_T_DEFAULT[k]:v};

/* ---- one agent, one key ---------------------------------------------- */
/* "CB-287", "CB - 287", "CB287" and "CB-0287" are one person. In the source
   file 149 distinct employee numbers resolved to 86 real agents; a counter
   built on the raw string would have split one repeat offender four ways. */
AP.cbKey=function(v){
  if(v==null)return null;
  const s=String(v).toUpperCase().replace(/[\s_.\u2013\u2014]/g,'');
  const m=/^CB-?0*(\d+)$/.exec(s);
  return m?('CB-'+m[1]):null;
};



/* =====================================================================
   THE COUNTER PER CB NUMBER
   Sessions come from the uploaded Classified Data when it is there, and from a
   demo profile shaped like the real file when it is not. Either way the shape
   is the same: one row per coaching event, carrying the clusters it was
   classified into.
   ===================================================================== */

AP.CX_SESS_COLS={cb:'Employee Number',name:'Agent Name',type:'Coaching Type',
  date:'Coaching Date',tl:'Team Leader',campaign:'Campaign',id:'Record ID'};

/* the classified columns, grouped by the family they belong to */
AP.CX_COLS={
 purpose:['QA Coaching Purpose','Lead Coaching Purpose','Group Coaching Purpose'],
 gap:['QA Development Area','QA Team Leader Guidance','Lead Management Gap','Lead Management Guidance',
      'Formal Coaching Gap','Informal Team Leader Feedback',
      'Group Coaching Theme 1','Group Coaching Theme 2','Group Coaching Theme 3'],
 commitment:['QA Agent Commitment','Lead Agent Commitment','Formal Agent Commitment',
      'Informal Agent Commitment','Informal Next Action'],
 support:['Formal Support Provided']
};
AP.CX_TYPE_LABEL={'Quality Assurance':'qa','Formal Coaching':'formal','Informal Coaching':'informal',
  'Group Coaching':'group','Lead Management':'lead'};

/* one uploaded row becomes one session */
AP.cxParseRow=function(r){
  const get=function(k){return r[k]!=null?r[k]:r[String(k).toLowerCase().replace(/[^a-z0-9]+/g,'_')]};
  const clusters={};
  Object.keys(AP.CX_COLS).forEach(function(fam){
    AP.CX_COLS[fam].forEach(function(col){
      const v=get(col);if(!v||!String(v).trim())return;
      const conf=get(col+' — Confidence');
      if(conf!=null&&Number(conf)<AP.cxt('min_conf'))return;
      (clusters[fam]=clusters[fam]||[]).push(String(v).trim());
    });
  });
  const d=get('Coaching Date');
  return {cb:AP.cbKey(get('Employee Number')),name:get('Agent Name'),
    type:AP.CX_TYPE_LABEL[get('Coaching Type')]||'informal',
    typeLabel:get('Coaching Type')||'Informal Coaching',
    date:d?String(d).slice(0,10):null,tl:get('Team Leader'),campaign:get('Campaign'),
    id:get('Record ID'),clusters:clusters,source:'upload'};
};

/* Employee number is only carried on QA and Lead Management forms, so a formal
   or informal session has to be resolved by name. Sessions that resolve to
   nobody are counted and reported, never silently dropped. */
AP.cxSessions=function(){
  if(AP._cxCache&&AP._cxCache.at===AP._cxStamp())return AP._cxCache.rows;
  const raw=(state.facts&&state.facts.COACHING_CLUSTERS)||[];
  let rows,orphans=0;
  if(raw.length){
    rows=raw.map(AP.cxParseRow);
    const byName={};
    rows.forEach(function(s){if(s.cb&&s.name)byName[String(s.name).trim().toUpperCase()]=s.cb});
    rows.forEach(function(s){
      if(!s.cb&&s.name)s.cb=byName[String(s.name).trim().toUpperCase()]||null;
      if(!s.cb)orphans++;
    });
  }else{
    rows=AP.cxDemo();
  }
  AP.CX_ORPHANS=orphans;
  AP._cxCache={at:AP._cxStamp(),rows:rows};
  return rows;
};
/* the cache key has to move when anything the counter depends on moves —
   the uploaded rows, any threshold, or the demo seed */
AP._cxStamp=function(){
  const f=(state.facts&&state.facts.COACHING_CLUSTERS)||[];
  return f.length+'|'+JSON.stringify(AP.CX_T)+'|'+(AP.CX_DEMO_SEED||0);
};

/* ---- the counter ------------------------------------------------------ */
/* Counted per session, not per field: a QA form that names the same theme in
   the development area and again in the team-leader comment is one occurrence
   of that theme, not two. Counting fields would make a thorough team leader
   look like a repeat offender. */
AP.cxFor=function(id){
  /* AP.agentById falls back to the first agent when it does not recognise an
     id. Resolving here instead means an unknown id gets an empty profile
     rather than quietly inheriting somebody else's coaching history. */
  const a=(typeof id==='object')?id:(AP.AGENTS||[]).find(function(x){return x.id===id})||null;
  const key=a?a.id:String(id);
  const cb=(a&&AP.cbKey(a.cb))||(a&&typeof AP.empNo==='function'&&AP.cbKey(AP.empNo(a.id)))||key;
  const all=AP.cxSessions().filter(function(s){
    return s.cb===cb||(a&&s.name&&String(s.name).trim().toUpperCase()===String(a.name).trim().toUpperCase())});
  const today=AP.cxToday();
  const win=AP.cxt('window_days');
  const days=function(d){return d?Math.round((today-new Date(d+'T00:00:00'))/86400000):9999};
  const inWin=all.filter(function(s){return days(s.date)<=win});

  const byType={},fam={purpose:{},gap:{},commitment:{},support:{}};
  inWin.forEach(function(s){
    byType[s.type]=(byType[s.type]||0)+1;
    Object.keys(fam).forEach(function(f){
      const seen={};
      (s.clusters[f]||[]).forEach(function(c){
        if(seen[c])return;seen[c]=1;                 /* once per session */
        const e=fam[f][c]=fam[f][c]||{cluster:c,n:0,types:{},last:null,first:null,driver:AP.cxDriver(c)};
        e.n++;e.types[s.type]=(e.types[s.type]||0)+1;
        if(!e.last||s.date>e.last)e.last=s.date;
        if(!e.first||s.date<e.first)e.first=s.date;
      });
    });
  });

  const rank=function(c){
    if(c.n>=AP.cxt('persistent_min'))return {tier:'Persistent',rankN:3};
    if(c.n>=AP.cxt('repeat_min'))return {tier:'Repeat',rankN:2};
    return {tier:'First time',rankN:1};
  };
  Object.keys(fam).forEach(function(f){
    Object.keys(fam[f]).forEach(function(k){
      const e=fam[f][k];Object.assign(e,rank(e));
      e.daysSince=days(e.last);
      /* The window is the filter. This flag only says the theme has gone quiet,
         so a screen can show it differently — it never excludes it from the
         count, or a theme raised four times would stop being a pattern the
         moment nobody mentioned it for three weeks. */
      e.cooling=e.daysSince>AP.cxt('stale_days');
      e.stale=false;
      e.maxFormality=Object.keys(e.types).reduce(function(m,t){
        return Math.max(m,AP.cxType(t).formality)},0);
    });
  });
  const gaps=Object.keys(fam.gap).map(function(k){return fam.gap[k]})
    .sort(function(x,y){return (y.n-x.n)||(y.last<x.last?-1:1)});
  const live=gaps.filter(function(g){return !g.stale});
  const top=live[0]||gaps[0]||null;

  const total=inWin.length;
  return {cb:cb,agent:a,sessions:all,window:inWin,total:total,
    byType:byType,fam:fam,gaps:gaps,top:top,
    repeats:gaps.filter(function(g){return g.rankN>=2}),
    persistent:gaps.filter(function(g){return g.rankN>=3}),
    commitments:Object.keys(fam.commitment).map(function(k){return fam.commitment[k]})
      .sort(function(x,y){return y.n-x.n}),
    lastDate:inWin.length?inWin.map(function(s){return s.date}).sort().slice(-1)[0]:null,
    daysSince:inWin.length?days(inWin.map(function(s){return s.date}).sort().slice(-1)[0]):null,
    overloaded:total>=AP.cxt('load_high'),
    measured:AP.cxSessions().length>0,
    source:(state.facts&&state.facts.COACHING_CLUSTERS||[]).length?'coaching upload':'demo profile'};
};
AP.cxToday=function(){return new Date(isoDay(new Date())+'T00:00:00')};

/* ---- the adjustment --------------------------------------------------- */
/* Same shape as the graduated critical-fail rule: a band, a capped number of
   points, and the reason named on screen. It is applied to the composite, not
   to a driver, so no metric is quietly re-weighted by paperwork. */
AP.cxPenalty=function(id){
  const cx=(typeof id==='object'&&id.gaps)?id:AP.cxFor(id);
  if(!cx.measured)return {points:0,tier:'Not measured',cluster:null,n:0,cx:cx};
  const worst=cx.gaps.filter(function(g){return !g.stale}).sort(function(x,y){return y.n-x.n})[0];
  if(!worst||worst.rankN<2)return {points:0,tier:'First time',cluster:worst?worst.cluster:null,
    n:worst?worst.n:0,cx:cx};
  const pts=worst.rankN>=3?AP.cxt('pen_persistent'):AP.cxt('pen_repeat');
  return {points:Math.min(AP.cxt('pen_cap'),pts),tier:worst.tier,cluster:worst.cluster,
    n:worst.n,driver:worst.driver,cx:cx};
};

/* ---- what format comes next ------------------------------------------- */
/* Escalation is about FORMALITY, not frequency. Nine QA sessions on customer
   verification is nine sessions at formality 2 — the theme has been raised nine
   times and escalated none. This is the single most common pattern in the
   source data: 46 of the 62 agents with a repeat theme had never had a formal
   session about it. */
AP.CX_FORMATS=[
 {min:0,format:'Informal Coaching',why:'First time this has come up. A conversation is the right size of response.'},
 {min:1,format:'Formal Coaching',why:'It has been raised before without being escalated. Put it on the record.'},
 {min:2,format:'Formal Coaching with a documented improvement plan',
  why:'It has been formally coached and it is still recurring. The plan has to change, not just be repeated.'}
];
AP.cxNextFormat=function(gap){
  if(!gap)return AP.CX_FORMATS[0];
  const already=gap.maxFormality||0;
  if(gap.rankN>=3&&already>=3)return AP.CX_FORMATS[2];
  if(gap.rankN>=2)return AP.CX_FORMATS[1];
  return AP.CX_FORMATS[0];
};
AP.cxSupportFor=function(cluster){return AP.CX_SUPPORT_FOR[cluster]||'Performance Follow-Up'};

/* how the counter reads in a sentence a team leader can say out loud */
AP.cxLine=function(gap){
  if(!gap)return '';
  const t=Object.keys(gap.types).map(function(k){
    return gap.types[k]+' '+AP.cxType(k).label.toLowerCase()}).join(', ');
  return esc(gap.cluster)+' has been raised '+gap.n+' '+AP.plural(gap.n,'time')
   +' in '+AP.cxt('window_days')+' days ('+t+'), most recently '
   +(gap.daysSince===0?'today':(gap.daysSince+' '+AP.plural(gap.daysSince,'day')+' ago'))+'.';
};



/* =====================================================================
   THE DEMO PROFILE
   Shaped like the real file: quality assurance dominates, compliance and
   customer verification dominate the themes, and most repeat themes have never
   been escalated past a QA session. Deterministic, so a test that runs twice
   gets the same answer twice.
   ===================================================================== */
AP.CX_DEMO_SEED=7;
AP.cxRand=function(seed){
  let s=0;String(seed).split('').forEach(function(c,i){s=(s*31+c.charCodeAt(0)+i*7)>>>0});
  return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296};
};
/* how many sessions, and how concentrated on one theme — one profile per shape
   of agent, so every branch of the ladder has somebody standing on it */
AP.CX_DEMO_PLAN={
  thando:{n:6, focus:'Objection Handling',      hits:4, formal:0},
  sizwe:{n:9,  focus:'Customer Verification',   hits:7, formal:0},
  naledi:{n:5, focus:'Product Knowledge',       hits:3, formal:1},
  bongani:{n:3,focus:'Call Process & Systems',  hits:1, formal:0},
  amahle:{n:8, focus:'Compliance & Required Wording',hits:6,formal:0},
  refilwe:{n:4,focus:'Pitch & Value Creation',  hits:2, formal:1},
  palesa:{n:2, focus:'Communication & Call Control',hits:1,formal:0},
  kagiso:{n:5, focus:'Compliance & Required Wording',hits:4,formal:2},
  zanele:{n:7, focus:'Lead Management',         hits:5, formal:0},
  lerato:{n:1, focus:'Customer Engagement & Rapport',hits:1,formal:0},
  tumelo:{n:6, focus:'Product Knowledge',       hits:4, formal:0},
  sipho:{n:4,  focus:'Objection Handling',      hits:2, formal:0},
  nomsa:{n:3,  focus:'Customer Verification',   hits:2, formal:0},
  jabu:{n:0,   focus:null,                      hits:0, formal:0}
};
AP.CX_DEMO_FILL=['Compliance & Required Wording','Customer Verification','Product Knowledge',
  'Objection Handling','Call Process & Systems','Communication & Call Control'];
AP.CX_COMMIT_FOR={'Compliance & Required Wording':'Use Required Wording',
 'Customer Verification':'Verify Customer Details','Product Knowledge':'Strengthen Product Pitch',
 'Objection Handling':'Improve Objection Handling','Pitch & Value Creation':'Strengthen Product Pitch',
 'Communication & Call Control':'Improve Communication','Customer Engagement & Rapport':'Build Customer Rapport',
 'Lead Management':'Follow Lead Process','Call Process & Systems':'Follow Call Process'};

AP.cxDemo=function(){
  const out=[],today=AP.cxToday();
  (AP.AGENTS||[]).forEach(function(a){
    const p=AP.CX_DEMO_PLAN[a.id];if(!p||!p.n)return;
    const rnd=AP.cxRand(a.id+AP.CX_DEMO_SEED);
    let formalLeft=p.formal,hits=p.hits;
    for(let i=0;i<p.n;i++){
      const back=Math.floor(3+rnd()*(AP.cxt('window_days')-8));
      const d=new Date(today.getTime()-back*86400000);
      let type='qa';
      if(formalLeft>0&&rnd()<0.45){type='formal';formalLeft--}
      else if(rnd()<0.18)type='informal';
      else if(rnd()<0.08)type='lead';
      const cluster=(hits>0&&p.focus)?(hits--,p.focus)
        :AP.CX_DEMO_FILL[Math.floor(rnd()*AP.CX_DEMO_FILL.length)];
      const cl={gap:[cluster],purpose:[AP.CX_COMPLIANCE.indexOf(cluster)>=0?'Quality & Compliance':'Sales Performance'],
        commitment:[AP.CX_COMMIT_FOR[cluster]||'Apply Coaching & Targets']};
      if(type==='formal')cl.support=[AP.cxSupportFor(cluster)];
      out.push({cb:a.id,name:a.name,type:type,typeLabel:AP.cxType(type).label,
        date:isoDay(d),tl:(AP.tlById(a.tl)||{}).name,campaign:(AP.camp(a)||{}).name,
        id:'DEMO-'+a.id+'-'+i,clusters:cl,source:'demo'});
    }
  });
  return out.sort(function(x,y){return x.date<y.date?-1:1});
};

/* =====================================================================
   THE LADDER LEARNS THE COACHING HISTORY
   Three new rules, and one overlay.

   The overlay is the important half. It does not change WHICH rule fired —
   Golden Rule 1 still returns exactly one next best action — it changes what
   that action says, because "coach them on product knowledge" is the wrong
   instruction for the fourth time in a row.
   ===================================================================== */

AP.CX_REORDER={R1:1,R2:2,'R2A-3':3,'R2B':4,R3:5,'R2A-2':6,R4:7,R4A:8,'R11':9,R5:10,R6:11,
  R7:12,R8:13,'R13':14,'R2A-1':15,R9:16,R10:17};

AP.CX_RULES=[
 {code:'R2B',level:1,rule:'Repeat Compliance Coaching',order:4,cx:true,
  triggerText:'The same compliance theme has been coached four or more times in the window.',
  fires:function(d){
    const cx=AP.cxFor(d.agent.id);
    return cx.persistent.some(function(g){return !g.stale&&AP.CX_COMPLIANCE.indexOf(g.cluster)>=0});
  },
  metric:'qa',
  action:'Compliance review with QA within 48 hours. The theme is recurring after coaching, so review the calls behind each session, not only the last one, and agree a written commitment.',
  owner:'QA · Compliance', when:'Within 48 hours', review:'Weekly until two clean audits'},

 {code:'R11',level:2,rule:'Coaching Not Converting',order:9,cx:true,
  triggerText:'A theme has been coached more than once and the metric it moves is still below target.',
  fires:function(d){
    const cx=AP.cxFor(d.agent.id);
    return cx.repeats.some(function(g){
      if(g.stale||!g.driver)return false;
      const t=AP.compositeTargets(d.agent.id)[g.driver], v=d.m[g.driver];
      return v!=null&&t!=null&&v<t;
    });
  },
  metric:'targetAch',
  action:'Change the format, not the message. The same theme has been coached before and the number has not moved, so the next session is formal, with the support type named and a date to check it.',
  owner:'Team leader', when:'This week', review:'Two weeks, against the metric'},

 {code:'R13',level:3,rule:'Uncoached Gap',order:14,cx:true,
  triggerText:'The driver with the most points available has never been coached.',
  fires:function(d){
    const cx=AP.cxFor(d.agent.id);
    if(!cx.measured)return false;
    const r=AP.composite(d.agent.id);
    const weakest=r.parts.slice().sort(function(x,y){return y.available-x.available})[0];
    if(!weakest||weakest.available<1)return false;
    return !cx.gaps.some(function(g){return g.driver===weakest.k});
  },
  metric:'targetAch',
  action:'Coach it once before escalating anything. The gap costing the most points has never been raised in a session, so there is nothing to escalate from.',
  owner:'Team leader', when:'This week', review:'Next session'}
];

/* the ladder is one list; the new rules join it and everything renumbers */
AP.NBA_RULES.forEach(function(r){
  if(AP.CX_REORDER[r.code]!=null)r.order=AP.CX_REORDER[r.code];
});
AP.CX_RULES.forEach(function(r){
  if(!AP.NBA_RULES.some(function(x){return x.code===r.code}))AP.NBA_RULES.push(r);
});

/* An agent carrying a live repeat theme is not "meeting or exceeding all key
   targets", whatever the metrics say. R9 and R10 are recognition rules. */
AP.nbaOthersInRangeBase=AP.nbaOthersInRange;
AP.nbaOthersInRange=function(d){
  if(!AP.nbaOthersInRangeBase(d))return false;
  const p=AP.cxPenalty(d.agent.id);
  return p.points===0;
};

/* ---- the overlay ------------------------------------------------------ */
AP.cxOverlay=function(id,primary){
  const cx=AP.cxFor(id);
  if(!cx.measured)return {cx:cx,has:false};
  /* the theme that matches the rule that fired, if there is one; otherwise the
     loudest live theme, because that is what the session will be about anyway */
  const onMetric=cx.gaps.filter(function(g){return !g.stale&&g.driver===primary.metric})
    .sort(function(x,y){return y.n-x.n})[0];
  const gap=onMetric||cx.gaps.filter(function(g){return !g.stale})[0]||null;
  if(!gap)return {cx:cx,has:false,line:'Nothing has been coached in the last '+AP.cxt('window_days')+' days.'};
  const fmt=AP.cxNextFormat(gap);
  const support=AP.cxSupportFor(gap.cluster);
  const commit=cx.commitments.filter(function(c){return c.driver===gap.driver})[0];
  return {cx:cx,has:true,gap:gap,onMetric:!!onMetric,format:fmt.format,why:fmt.why,
    support:support,commitment:commit?commit.cluster:null,
    line:AP.cxLine(gap),
    escalating:gap.rankN>=2,
    actionAdd:' '+(gap.rankN>=2
      ? ('This is the '+AP.ordinal(gap.n)+' time '+gap.cluster+' has come up in '+AP.cxt('window_days')
         +' days. '+fmt.why+' Run it as '+fmt.format.toLowerCase()+', with '+support.toLowerCase()+'.')
      : ('First time '+gap.cluster+' has come up. Run it as '+fmt.format.toLowerCase()
         +', with '+support.toLowerCase()+'.'))};
};
AP.ordinal=function(n){
  const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);
};

/* cxFor is asked for the same agent many times while one screen renders — the
   ladder alone calls it from four rules. Memoised against the same stamp the
   session cache uses, so a threshold change still invalidates it. */
AP.cxForBase=AP.cxFor;
AP._cxMemo={};
AP.cxFor=function(id){
  /* resolve the same way the counter does — AP.agentById falls back to the
     first agent, which would key the cache to somebody else entirely */
  const a=(typeof id==='object')?id:(AP.AGENTS||[]).find(function(x){return x.id===id})||null;
  const k=(a?a.id:String(id))+'|'+AP._cxStamp();
  if(AP._cxMemo[k])return AP._cxMemo[k];
  const v=AP.cxForBase(id);
  AP._cxMemo[k]=v;
  return v;
};



/* =====================================================================
   THE COACHING LAYER ON SCREEN
   No new panels. The counter belongs beside the thing it explains: the
   agent's coaching block gets the themes, and the team-leader NBA table gets
   two columns — what has already been said, and what format comes next.
   ===================================================================== */

AP.CX_TIER_C={'First time':'b','Repeat':'a','Persistent':'r','Not measured':'n'};

/* ---- the agent's own history, in their own words ---------------------- */
AP.cxAgentBlock=function(id){
  const cx=AP.cxFor(id);
  if(!cx.total)return '<div class="ap-k" style="margin-top:14px">What you have been coached on</div>'
   +'<div class="ap-empty">Nothing in the last '+AP.cxt('window_days')+' days.</div>';
  const live=cx.gaps.filter(function(g){return !g.stale});
  const rows=(live.length?live:cx.gaps).slice(0,5);
  return '<div class="ap-k" style="margin-top:14px">What you have been coached on</div>'
   +'<div class="dq-s" style="margin-bottom:8px">'+cx.total+' '+AP.plural(cx.total,'session')
   +' in the last '+AP.cxt('window_days')+' days'
   +(cx.daysSince!=null?(', the last one '+(cx.daysSince===0?'today':(cx.daysSince+' '+AP.plural(cx.daysSince,'day')+' ago'))):'')
   +'. This is what was talked about, not a mark against you.</div>'
   +'<table class="tbl"><thead><tr><th class="noclick">What came up</th><th class="noclick">Times</th>'
   +'<th class="noclick">How</th><th class="noclick">What you said you would do</th>'
   +'<th class="noclick">Driver it moves</th></tr></thead><tbody>'
   +rows.map(function(g){
     const c=cx.commitments.filter(function(x){return x.driver===g.driver})[0];
     const d=g.driver?(AP.RATING_DEF.find(function(x){return x.k===g.driver})||{}):null;
     return '<tr><td><b>'+esc(g.cluster)+'</b>'
       +(g.rankN>=2?(' <span class="pill '+AP.CX_TIER_C[g.tier]+'">'+esc(g.tier)+'</span>'):'')+'</td>'
      +'<td class="num">'+g.n+'</td>'
      +'<td>'+esc(Object.keys(g.types).map(function(t){return AP.cxType(t).label}).join(', '))+'</td>'
      +'<td>'+(c?esc(c.cluster):'<span class="ap-cite">nothing recorded</span>')+'</td>'
      +'<td>'+(d&&d.label?esc(d.label):'<span class="ap-cite">—</span>')+'</td></tr>'}).join('')
   +'</tbody></table>';
};

/* ---- the team leader's escalation view -------------------------------- */
/* Rebuilt rather than patched: the NBA row now carries the coaching history
   next to the metric that fired, because a team leader deciding what to do
   needs both in one glance. */
AP.nbaTeamPanel=function(tlId){
  const rows=AP.nbaTeam(tlId);
  const byLevel={1:0,2:0,3:0,4:0};rows.forEach(function(r){byLevel[r.nba.level]++});
  const esc0=rows.filter(function(r){return r.nba.cx&&r.nba.cx.escalating}).length;
  let h='<div class="ap-panel"><div class="ap-panel-h">'+ICO('target')+'<span>Next best action — one per agent</span></div>'
   +'<div class="ap-panel-s">Checked top to bottom; the first rule triggered is the one shown. '
   +AP.NBA_LEVELS.map(function(l){return '<span class="pill '+(AP.NBA_COL[l.colour]||'n')+'">'+l.band+' '+byLevel[l.level]+'</span>'}).join(' ')
   +(esc0?(' &nbsp;<span class="pill a">'+esc0+' to escalate</span>'):'')
   +'</div>'
   +'<table class="tbl"><thead><tr>'
   +'<th class="noclick">Agent</th><th class="noclick">NBA</th><th class="noclick">Reason</th>'
   +'<th class="noclick">Already coached</th><th class="noclick">Run it as</th>'
   +'<th class="noclick">Action</th><th class="noclick">By</th>'
   +'<th class="noclick">Success measure</th><th class="noclick">Composite</th>'
   +'</tr></thead><tbody>'
   +rows.map(function(r){const n=r.nba,c=r.comp,x=n.cx;
     const g=x&&x.gap;
     return '<tr><td><b>'+esc(r.agent.name)+'</b><div class="ap-cite">'+esc(n.data.group.label)+'</div></td>'
      +'<td>'+AP.nbaChip(n)+'<div class="ap-cite">'+esc(n.rule)+'</div></td>'
      +'<td>'+esc(n.metricLabel)+' '+AP.fmtBy(n.metricKey,n.now)+' <span class="ap-cite">vs '+AP.fmtBy(n.metricKey,n.target)+'</span></td>'
      +'<td>'+(g?('<b>'+esc(g.cluster)+'</b> ×'+g.n+'<div class="ap-cite">'
          +esc(Object.keys(g.types).map(function(t){return g.types[t]+' '+AP.cxType(t).label.toLowerCase()}).join(', '))
          +'</div>'):'<span class="ap-cite">nothing in '+AP.cxt('window_days')+' days</span>')+'</td>'
      +'<td>'+(x&&x.format?('<span class="pill '+(x.escalating?'a':'b')+'">'+esc(x.format.split(' with ')[0])+'</span>'
          +'<div class="ap-cite">'+esc(x.support)+'</div>'):'—')+'</td>'
      +'<td>'+esc(n.baseAction||n.action)+'</td>'
      +'<td>'+esc(n.when)+'</td>'
      +'<td>'+esc(n.successMeasure)+'</td>'
      +'<td class="num"><b>'+Math.round(c.adj)+'</b>'
      +(c.penaltyTotal?('<div class="ap-cite">'+c.score+' less '+c.penaltyTotal+'</div>'):'')+'</td></tr>'}).join('')
   +'</tbody></table></div>';

  /* the two checks across the team, and both adjustments in one place */
  h+='<div class="grid g2"><div class="ap-panel"><div class="ap-panel-h">'+ICO('check')+'<span>Two-Check status</span></div>'
   +'<table class="tbl"><thead><tr><th class="noclick">Agent</th><th class="noclick">Check 1 · value</th>'
   +'<th class="noclick">Check 2 · volume</th><th class="noclick">Status</th></tr></thead><tbody>'
   +rows.map(function(r){const t=AP.twoCheck(r.agent.id);
     return '<tr><td>'+esc(r.agent.name)+'</td>'
      +'<td class="num">'+(t.gwpSale==null?'<span class="ap-cite">not measured</span>':AP.zar(t.gwpSale))+'</td>'
      +'<td class="num">'+AP.mFmt(t.targetAch,'pct')+'</td>'
      +'<td>'+AP.pill(t.status,t.c)+'</td></tr>'}).join('')
   +'</tbody></table></div>'
   +'<div class="ap-panel"><div class="ap-panel-h">'+ICO('shield')+'<span>Adjustments to the composite</span></div>'
   +'<div class="ap-panel-s">Two things come off the score and nothing else does: critical fails, and a theme that keeps being coached. Each is capped, and the two together are capped at '+AP.cxt('combined_pen_cap')+'.</div>'
   +'<table class="tbl"><thead><tr><th class="noclick">Agent</th><th class="noclick">Fails</th>'
   +'<th class="noclick">Tier</th><th class="noclick">Repeat theme</th>'
   +'<th class="noclick">Off the score</th><th class="noclick">Elite</th></tr></thead><tbody>'
   +rows.map(function(r){const q=r.comp.r2a,x=r.comp.cx||{};
     return '<tr><td>'+esc(r.agent.name)+'</td><td class="num">'+q.fails+'</td>'
      +'<td>'+AP.pill(q.tier,q.level===1?'r':q.level===2?'a':q.level===3?'b':'g')+'</td>'
      +'<td>'+(x.points?('<b>'+esc(x.cluster)+'</b> ×'+x.n+' <span class="pill '+AP.CX_TIER_C[x.tier]+'">'+esc(x.tier)+'</span>')
          :'<span class="ap-cite">none</span>')+'</td>'
      +'<td class="num">'+(r.comp.penaltyTotal?('−'+r.comp.penaltyTotal
          +(q.penalty&&x.points?('<div class="ap-cite">'+q.penalty+' fails · '+x.points+' coaching</div>'):'')):'0')+'</td>'
      +'<td>'+esc(q.elite)+'</td></tr>'}).join('')
   +'</tbody></table></div></div>';
  return h;
};

/* ---- the taxonomy, so a team leader can read what the clusters mean --- */
AP.cxTaxonomyModal=function(){
  $('#modalBox').classList.add('xl');
  modal('<div class="modal-h"><span class="t">Coaching clusters — the options and what they mean</span>'
   +'<button class="modal-x" onclick="closeModal()">✕</button></div>'
   +Object.keys(AP.CX_FAMILY).map(function(f){
     const F=AP.CX_FAMILY[f];
     return '<div class="ap-panel"><div class="ap-panel-h"><span>'+esc(F.label)+'</span></div>'
       +'<div class="ap-panel-s">'+esc(F.asked)+'</div>'
       +'<table class="tbl"><thead><tr><th class="noclick">Option</th><th class="noclick">What it covers</th>'
       +'<th class="noclick">Driver it moves</th><th class="noclick">Seen in the source</th></tr></thead><tbody>'
       +F.options.map(function(o){
         const d=AP.cxDriver(o.k),dd=d?(AP.RATING_DEF.find(function(x){return x.k===d})||{}):null;
         return '<tr><td><b>'+esc(o.k)+'</b></td><td>'+esc(o.def||'')+'</td>'
          +'<td>'+(dd&&dd.label?esc(dd.label):'<span class="ap-cite">—</span>')+'</td>'
          +'<td class="num">'+o.n+'</td></tr>'}).join('')
       +'</tbody></table></div>'}).join('')
   +'<div class="modal-foot"><button class="dq-btn primary" onclick="closeModal()">Close</button></div>');

/* =====================================================================
   THE COACHING LAYER IN THE UPLOADABLE RULE BOOK
   Three more tabs. The taxonomy a team leader picks from, the escalation
   ladder the coaching types sit on, and the numbers that decide when a theme
   stops being a first offence. All editable without a build — which is what
   the coaching-hub redesign will need.
   ===================================================================== */

Object.assign(AP.RB_SCHEMA,{
 /* the same word is a legitimate option in two families — "Product Knowledge"
    is both a reason for a session and a development area — so the key is the
    family and the option together, never the option alone */
 CX_CLUSTERS:{key:'cluster_key',
   cols:['cluster_key','family','cluster','definition','driver_key','support_when_repeat','seen_in_source','enabled'],
   req:['cluster_key','family','cluster']},
 CX_COACH_TYPES:{key:'type_key',
   cols:['type_key','type_label','formality','individual','note'],
   req:['type_key','type_label','formality']},
 CX_THRESHOLDS:{key:'setting_key',
   cols:['setting_key','value','unit','description'],
   req:['setting_key','value']}
});
AP.RB_SHEETS=Object.keys(AP.RB_SCHEMA);

AP.CX_T_META={
 window_days:{u:'days',d:'The rolling window a repeat is counted in. Sessions older than this stay in the record but stop escalating.'},
 repeat_min:{u:'times',d:'This many of the same cluster in the window makes it a Repeat.'},
 persistent_min:{u:'times',d:'This many makes it Persistent, and fires R2B when the theme is a compliance one.'},
 pen_repeat:{u:'points',d:'Composite adjustment for a Repeat theme.'},
 pen_persistent:{u:'points',d:'Composite adjustment for a Persistent theme.'},
 pen_cap:{u:'points',d:'The cap on the coaching adjustment on its own.'},
 combined_pen_cap:{u:'points',d:'The cap on the compliance adjustment and the coaching adjustment together.'},
 stale_days:{u:'days',d:'A theme not raised for longer than this is history, not a live pattern.'},
 min_conf:{u:'0 to 1',d:'Classifications below this confidence are not counted. The source file flags these for human review.'},
 load_high:{u:'sessions',d:'Sessions in the window above which the coaching load itself is the finding.'}
};

/* ---- export -------------------------------------------------------- */
AP.rbExportCX=function(S){
 const rows=[];
 Object.keys(AP.CX_FAMILY).forEach(function(f){
   AP.CX_FAMILY[f].options.forEach(function(o){
     rows.push([f+'.'+AP.rbKey(o.k),f,o.k,o.def||'',AP.cxDriver(o.k)||'',
       f==='gap'?AP.cxSupportFor(o.k):'',o.n||0,'Yes']);
   });
 });
 S.CX_CLUSTERS=[AP.RB_SCHEMA.CX_CLUSTERS.cols].concat(rows);
 S.CX_COACH_TYPES=[AP.RB_SCHEMA.CX_COACH_TYPES.cols].concat(AP.CX_TYPES.map(function(t){
   return [t.k,t.label,t.formality,t.individual?'Yes':'No',t.note]}));
 S.CX_THRESHOLDS=[AP.RB_SCHEMA.CX_THRESHOLDS.cols].concat(Object.keys(AP.CX_T_DEFAULT).map(function(k){
   const m=AP.CX_T_META[k]||{};
   return [k,AP.cxt(k),m.u||'',m.d||'']}));
 return S;
};
AP.rbExportNBAOnly=AP.rbExport;
AP.rbExport=function(){return AP.rbExportCX(AP.rbExportNBAOnly())};

/* ---- validate ------------------------------------------------------ */
AP.rbValidateNBAOnly=AP.rbValidate;
AP.rbValidate=function(sheets){
  const v=AP.rbValidateNBAOnly(sheets);
  if(!v.data)return v;
  ['CX_CLUSTERS','CX_COACH_TYPES','CX_THRESHOLDS'].forEach(function(n){
    v.data[n]=AP.rbRows(sheets[n]||null);v.counts[n]=v.data[n].length;
    if(!sheets[n])v.warns.push({sheet:n,row:'',msg:'Tab is absent, so the coaching taxonomy already loaded stays as it is.'});
  });

  const fams={purpose:1,gap:1,commitment:1,support:1};
  const drv={};(AP.COMPOSITE_DEF||[]).forEach(function(d){drv[d.k]=1});
  const seen={};
  (v.data.CX_CLUSTERS||[]).filter(function(r){return AP.rbBool(r.enabled,true)}).forEach(function(r){
    const f=AP.rbKey(r.family), c=AP.rbNorm(r.cluster);
    if(!fams[f])v.errs.push({sheet:'CX_CLUSTERS',row:r.__row,
      msg:'family "'+r.family+'" must be one of: purpose, gap, commitment, support.'});
    if(!c)v.errs.push({sheet:'CX_CLUSTERS',row:r.__row,msg:'cluster must be named — it is the value a team leader picks.'});
    const k=f+'|'+c.toLowerCase();
    if(seen[k])v.errs.push({sheet:'CX_CLUSTERS',row:r.__row,msg:'"'+c+'" appears twice in the '+f+' family. One row per option.'});
    seen[k]=1;
    const d=AP.rbNorm(r.driver_key);
    if(d&&!drv[d])v.errs.push({sheet:'CX_CLUSTERS',row:r.__row,
      msg:'driver_key "'+d+'" is not a driver the scorecard measures. Use one of: '+Object.keys(drv).join(', ')+', or leave it blank.'});
  });
  /* the taxonomy has a ceiling for a reason — a dropdown nobody can read is a
     free-text box with extra steps */
  ['purpose','gap','commitment','support'].forEach(function(f){
    const n=(v.data.CX_CLUSTERS||[]).filter(function(r){
      return AP.rbKey(r.family)===f&&AP.rbBool(r.enabled,true)}).length;
    if(n>10)v.errs.push({sheet:'CX_CLUSTERS',row:'',msg:'The '+f+' family has '+n+' enabled options. Ten is the ceiling, including Other / Needs Review.'});
    if(n&&n<3)v.warns.push({sheet:'CX_CLUSTERS',row:'',msg:'The '+f+' family has only '+n+' options. Too few and everything lands in one cluster.'});
    if(n&&!(v.data.CX_CLUSTERS||[]).some(function(r){
      return AP.rbKey(r.family)===f&&/other|needs review/i.test(AP.rbNorm(r.cluster))}))
      v.warns.push({sheet:'CX_CLUSTERS',row:'',msg:'The '+f+' family has no "Other / Needs Review" option. Without one, an unclassifiable note has nowhere to go.'});
  });

  (v.data.CX_COACH_TYPES||[]).forEach(function(r){
    const f=AP.rbNum(r.formality);
    if(f==null||f<1||f>5)v.errs.push({sheet:'CX_COACH_TYPES',row:r.__row,
      msg:'formality must be between 1 and 5. It is what "escalate" means — a theme coached three times at the same formality has not been escalated.'});
  });
  if((v.data.CX_COACH_TYPES||[]).length&&
     !(v.data.CX_COACH_TYPES||[]).some(function(r){return AP.rbNum(r.formality)>=3}))
    v.errs.push({sheet:'CX_COACH_TYPES',row:'',msg:'At least one coaching type must sit at formality 3 or higher, or nothing can ever be escalated to.'});

  const PCT={min_conf:1};
  (v.data.CX_THRESHOLDS||[]).forEach(function(r){
    const k=AP.rbKey(r.setting_key);
    if(!(k in AP.CX_T_DEFAULT)){
      v.errs.push({sheet:'CX_THRESHOLDS',row:r.__row,msg:'setting_key "'+r.setting_key+'" is not one the engine reads.'});return}
    const x=AP.rbNum(r.value);
    if(x==null){v.errs.push({sheet:'CX_THRESHOLDS',row:r.__row,msg:'value must be a number.'});return}
    if(PCT[k]&&(x<0||x>1))v.errs.push({sheet:'CX_THRESHOLDS',row:r.__row,msg:'"'+k+'" is a share between 0 and 1.'});
    if(k==='window_days'&&(x<14||x>365))v.errs.push({sheet:'CX_THRESHOLDS',row:r.__row,msg:'window_days must be between 14 and 365.'});
    if(k==='repeat_min'&&x<2)v.errs.push({sheet:'CX_THRESHOLDS',row:r.__row,msg:'repeat_min must be 2 or more. One occurrence is a first offence by definition.'});
  });
  const rmin=(v.data.CX_THRESHOLDS||[]).find(function(r){return AP.rbKey(r.setting_key)==='repeat_min'});
  const pmin=(v.data.CX_THRESHOLDS||[]).find(function(r){return AP.rbKey(r.setting_key)==='persistent_min'});
  if(rmin&&pmin&&AP.rbNum(pmin.value)<=AP.rbNum(rmin.value))
    v.errs.push({sheet:'CX_THRESHOLDS',row:pmin.__row,msg:'persistent_min must be higher than repeat_min, or nothing can ever be a Repeat.'});

  v.ok=v.errs.length===0;
  return v;
};

/* ---- apply --------------------------------------------------------- */
AP.rbApplyNBAOnly=AP.rbApply;
AP.rbApply=function(v){
  const res=AP.rbApplyNBAOnly(v);
  const d=v.data;

  if(d.CX_CLUSTERS&&d.CX_CLUSTERS.length){
    const fam={purpose:{label:AP.CX_FAMILY.purpose.label,asked:AP.CX_FAMILY.purpose.asked,options:[]},
      gap:{label:AP.CX_FAMILY.gap.label,asked:AP.CX_FAMILY.gap.asked,options:[]},
      commitment:{label:AP.CX_FAMILY.commitment.label,asked:AP.CX_FAMILY.commitment.asked,options:[]},
      support:{label:AP.CX_FAMILY.support.label,asked:AP.CX_FAMILY.support.asked,options:[]}};
    const drvMap={},supMap={};
    d.CX_CLUSTERS.filter(function(r){return AP.rbBool(r.enabled,true)}).forEach(function(r){
      const f=AP.rbKey(r.family), c=AP.rbNorm(r.cluster);
      if(!fam[f]||!c)return;
      fam[f].options.push({k:c,n:AP.rbNum(r.seen_in_source)||0,def:AP.rbNorm(r.definition)});
      const dk=AP.rbNorm(r.driver_key);
      drvMap[c]=dk||null;
      const s=AP.rbNorm(r.support_when_repeat);
      if(s)supMap[c]=s;
    });
    if(Object.keys(fam).every(function(f){return fam[f].options.length})){
      AP.CX_FAMILY=fam;AP.CX_DRIVER=drvMap;
      AP.CX_SUPPORT_FOR=Object.assign({},AP.CX_SUPPORT_FOR,supMap);
    }
  }
  if(d.CX_COACH_TYPES&&d.CX_COACH_TYPES.length){
    AP.CX_TYPES=d.CX_COACH_TYPES.map(function(r){
      return {k:AP.rbKey(r.type_key),label:AP.rbNorm(r.type_label),
        formality:AP.rbNum(r.formality)||1,individual:AP.rbBool(r.individual,true),
        note:AP.rbNorm(r.note)};
    });
  }
  if(d.CX_THRESHOLDS&&d.CX_THRESHOLDS.length){
    d.CX_THRESHOLDS.forEach(function(r){
      const k=AP.rbKey(r.setting_key);
      if(k in AP.CX_T_DEFAULT)AP.CX_T[k]=AP.rbNum(r.value);
    });
  }
  AP._cxCache=null;AP._cxMemo={};
  return res;
};

/* ---- snapshot ------------------------------------------------------ */
AP.rbSnapshotNBAOnly=AP.rbSnapshot;
AP.rbSnapshot=function(){
  const s=AP.rbSnapshotNBAOnly();
  Object.keys(AP.CX_T_DEFAULT).forEach(function(k){s['coaching · '+k]=AP.cxt(k)});
  Object.keys(AP.CX_FAMILY).forEach(function(f){
    s['clusters · '+f]=AP.CX_FAMILY[f].options.map(function(o){return o.k}).join(', ')});
  s['coaching types']=AP.CX_TYPES.map(function(t){return t.label+':'+t.formality}).join(', ');
  return s;
};

/* the preview must put the coaching layer back too */
AP.rbPreviewDiffNBAOnly=AP.rbPreviewDiff;
AP.rbPreviewDiff=function(v){
  const snap=JSON.parse(JSON.stringify({F:AP.CX_FAMILY,D:AP.CX_DRIVER,S:AP.CX_SUPPORT_FOR,
    T:AP.CX_TYPES,X:AP.CX_T}));
  try{ return AP.rbPreviewDiffNBAOnly(v); }
  finally{
    AP.CX_FAMILY=snap.F;AP.CX_DRIVER=snap.D;AP.CX_SUPPORT_FOR=snap.S;
    AP.CX_TYPES=snap.T;AP.CX_T=snap.X;
    AP._cxCache=null;AP._cxMemo={};
  }
};
