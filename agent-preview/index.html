/* ---- assigning an action: three steps ---- */
AP.assignFlow=function(agentId,step,pick){
  AP.s.agentId=agentId;
  if(!AP.canAssign(agentId)){
    const a=AP.agentById(agentId);
    modal('<div class="modal-h"><span class="t">Two actions already set</span><button class="modal-x" onclick="closeModal()">✕</button></div>'
     +'<div class="ap-callout r" style="margin:0"><b>'+esc(AP.firstName(a))+' already has two actions today. Replace an existing action before assigning another.</b></div>'
     +AP.activePlays(agentId).map(p=>'<div class="ap-hrow"><div class="ap-hrow-m"><div class="ap-hrow-n">'+esc(p.title)+'</div>'
       +'<div class="ap-hrow-k">'+esc(AP.PLAY_ST[p.status].l)+'</div></div>'
       +'<div class="ap-hrow-r"><button class="btn" onclick="AP.replaceModal(\''+p.id+'\')">Replace Action</button></div></div>').join('')
     +'<div class="modal-foot"><button class="btn primary" onclick="closeModal()">Back to My Team</button></div>');
    return;
  }
  step=step||1;
  const a=AP.agentById(agentId),dg=AP.diagnose(agentId),recs=AP.recs(agentId),cm=AP.comm(agentId);
  const c=AP.camp(a),short=Math.max(0,c.dailyTarget-cm.todayQual);
  const dots='<div class="ap-steps"><i class="'+(step>=1?'on':'')+'"></i><i class="'+(step>=2?'on':'')+'"></i><i class="'+(step>=3?'on':'')+'"></i></div>';
  if(step===1){
    AP.track('assign_started');
    modal('<div class="modal-h"><span class="t">Step 1 · What needs attention?</span><button class="modal-x" onclick="closeModal()">✕</button></div>'+dots
     +'<div class="ap-hd">'+AP.avatar(a,true)+'<div><div class="ap-hrow-n">'+esc(a.name)+'</div>'
     +'<div class="ap-cite">Employee '+AP.empNo(agentId)+' · '+esc(c.name)+'</div></div></div>'
     +'<div class="ap-callout b" style="margin-top:12px">'
     +(dg?('<b>'+esc(AP.firstName(a))+' is '+(short?short+' sale'+(short===1?'':'s')+' below target. ':'below target on '+esc(dg.gap.m.label.toLowerCase())+'. ')
        +esc(dg.evidence[dg.evidence.length-1].v)+'</b>')
        :'<b>Nothing is materially below target. Only set an action where there is a real gap or a support need.</b>')+'</div>'
     +(dg?'<div class="ap-lines" style="margin-top:10px">'
       +'<div class="ap-line"><span>'+esc(dg.gap.m.label)+'</span><b>'+AP.mFmt(dg.gap.cur,dg.gap.m.fmt)+' against '+AP.mFmt(AP.gateTargetFor(dg.gap.m.k,dg.agent||a),dg.gap.m.fmt)+'</b></div>'
       +'<div class="ap-line"><span>Commission at stake</span><b>'+(cm.next?(cm.need+' sales to the next level, about '+AP.zar(cm.nextGain)+' more this month'):'Top level held')+'</b></div>'
       +'</div>':'')
     +'<div class="modal-foot"><button class="btn" onclick="closeModal()">Back</button>'
     +'<button class="btn primary" onclick="AP.assignFlow(\''+agentId+'\',2)">Choose an Action</button></div>');
    return;
  }
  if(step===2){
    modal('<div class="modal-h"><span class="t">Step 2 · Choose an action</span><button class="modal-x" onclick="closeModal()">✕</button></div>'+dots
     +(recs.length?'':'<div class="ap-callout b" style="margin-bottom:10px"><b>Nikola has nothing to recommend for '+esc(AP.firstName(a))+'.</b> Nothing is below target. Only set an action if you have a reason of your own.</div>')
     +'<div class="ap-picks">'+recs.slice(0,3).map((r,i)=>'<label class="ap-pickrow2"><input type="radio" name="apRec" value="'+r.id+'"'+(i===0?' checked':'')+'>'
       +'<span><b>'+esc(r.title)+'</b>'+(i===0?'<em class="ap-recby">Recommended by Nikola</em>':'')
       +'<small>'+esc(r.instruction)+'</small></span></label>').join('')
     +'<label class="ap-pickrow2"><input type="radio" name="apRec" value="__custom"><span><b>Something else</b><small>Write your own action for '+esc(AP.firstName(a))+'.</small></span></label>'
     +'</div>'
     +'<div class="modal-foot"><button class="btn" onclick="AP.assignFlow(\''+agentId+'\',1)">Back</button>'
     +'<button class="btn primary" onclick="AP.assignFlow(\''+agentId+'\',3,(document.querySelector(\'input[name=apRec]:checked\')||{}).value)">Choose When It Is Due</button></div>');
    return;
  }
  if(pick==='__custom'){AP.customModal(agentId);return}
  const r=AP.findRec(agentId,pick)||recs[0];
  if(!r){AP.customModal(agentId);return}
  modal('<div class="modal-h"><span class="t">Step 3 · When is it due?</span><button class="modal-x" onclick="closeModal()">✕</button></div>'+dots
   +'<div class="ap-req-n"><b>'+esc(r.title)+'</b><div class="ap-cite">'+esc(r.instruction)+'</div></div>'
   +'<div class="ap-opts">'+AP.DUE_WINDOWS.map((w,i)=>'<label class="ap-opt"><input type="radio" name="apDue" value="'+w.c+'"'+(i===0?' checked':'')+'> '+esc(w.l)+'</label>').join('')+'</div>'
   +'<div class="ap-guard">'+esc(AP.firstName(a))+' sees a countdown, one reminder 15 minutes before, and one notice if it goes overdue. Nothing else.</div>'
   +'<div class="modal-foot"><button class="btn" onclick="AP.assignFlow(\''+agentId+'\',2)">Back</button>'
   +'<button class="btn primary" onclick="AP.doAssignFlow(\''+agentId+'\',\''+r.id+'\')">Assign Action</button></div>');
};
AP.doAssignFlow=function(agentId,recId){
  const r=AP.findRec(agentId,recId);if(!r)return;
  const code=(document.querySelector('input[name=apDue]:checked')||{}).value||'block';
  const p=AP.assignPlay(agentId,r,AP.dueWindow(code).l);
  if(!p)return;
  p.dueCode=code;p.dueAt=AP.dueAtFor(code);
  AP.track('assign_completed');
  AP.save();closeModal();render();
  toast('Assigned to '+AP.firstName(AP.agentById(agentId))+' — due '+AP.dueWindow(code).short+'.');
};

/* ---- Team Results: three measures only ---- */
AP.pageTeamResults=function(){
  const tl=AP.tl(),sc=AP.tlScore(tl.id),team=AP.teamOf(tl.id);
  const onTarget=team.filter(a=>AP.comm(a.id).todayQual>=AP.camp(a).dailyTarget).length;
  const supported=sc.plays.filter(p=>p.after);
  const improved=supported.filter(p=>p.after.verdict==='Improved');
  const waiting=sc.reqs.filter(r=>['requested','accepted','scheduled','in_progress','reopened'].indexOf(r.status)>=0);
  const onTime=sc.reqs.filter(r=>r.acceptedMs&&r.createdMs&&(r.acceptedMs-r.createdMs)<=AP.TL_RESPONSE_MINS*60000).length;
  const answered=sc.reqs.filter(r=>r.acceptedMs).length;
  AP.track('view_results');
  let h='<div class="ap-greet slim">'+AP.avatar(tl,true)+'<div><div class="ap-greet-n">Your Team Results</div>'
   +'<div class="ap-greet-s">'+esc(tl.name)+' · '+team.length+' agents</div></div></div>';
  h+='<div class="ap-narr">'+onTarget+' of '+team.length+' agents are on target. '
   +(supported.length?(improved.length+' of '+supported.length+' supported agents improved. '):'No supported agent has been measured yet. ')
   +(waiting.length?(waiting.length===1?'One agent is still waiting for help.':waiting.length+' agents are still waiting for help.'):'No one is waiting for help.')+'</div>';
  h+='<div class="ap-three">'
   +'<div class="ap-tnum"><div class="ap-panel-h">'+ICO('target')+'<span>Agents reaching target</span></div>'
   +'<div class="ap-tnum-v">'+onTarget+' of '+team.length+'</div>'
   +'<div class="ap-bar big"><i style="width:'+(team.length?onTarget/team.length*100:0)+'%"></i></div></div>'
   +'<div class="ap-tnum"><div class="ap-panel-h">'+ICO('up')+'<span>Agents improving after support</span></div>'
   +'<div class="ap-tnum-v">'+improved.length+' of '+supported.length+'</div>'
   +'<div class="ap-bar big"><i class="g" style="width:'+(supported.length?improved.length/supported.length*100:0)+'%"></i></div></div>'
   +'<div class="ap-tnum '+(waiting.length?'urgent':'')+'"><div class="ap-panel-h">'+ICO('headset')+'<span>Support completed on time</span></div>'
   +'<div class="ap-tnum-v">'+onTime+' of '+Math.max(answered,onTime)+'</div>'
   +(waiting.length?'<button class="btn primary" onclick="AP.helpWaiting()">Help Waiting Agent</button>':'<div class="ap-tnum-k">No one is waiting</div>')
   +'</div></div>';
  /* NBA v3 §10 — one row per agent, colour-coded by Level, before anything else */
  h+=AP.nbaTeamPanel(tl.id);
  h+='<div class="ap-panel"><div class="ap-panel-h">'+ICO('coaching')+'<span>What happened after support</span></div>'
   +(supported.length?'<table class="tbl"><thead><tr><th class="noclick">Agent</th><th class="noclick">Action</th><th class="noclick">Before</th><th class="noclick">After</th><th class="noclick">Result</th><th class="noclick">Agent confirmed</th></tr></thead><tbody>'
     +supported.map(p=>{const rq=AP.reqsOf(p.agent).find(r=>r.playId===p.id);
       return '<tr><td><b>'+esc(AP.agentById(p.agent).name)+'</b></td><td>'+esc(p.title)+'</td>'
        +'<td class="num">'+AP.mFmt(p.after.before,p.baseline.fmt)+'</td><td class="num">'+AP.mFmt(p.after.value,p.baseline.fmt)+'</td>'
        +'<td>'+AP.pill(p.after.verdict,p.after.verdict==='Improved'?'g':'a')+'</td>'
        +'<td>'+(rq?(rq.agentConfirm?(rq.agentConfirm.answer==='yes'?AP.pill('Yes','g'):AP.pill('Disputed','r')):AP.pill('Waiting','a')):'<span class="ap-cite">No support asked for</span>')+'</td></tr>'}).join('')
     +'</tbody></table>'
     :'<div class="ap-empty">Nothing measured yet. Use <b>Check the Result</b> on any action once the next call block is in.</div>')
   +'</div>';
  /* This was a league table: every agent, sorted by rating, with a tier badge.
     The rating is measured against an agent's own last five sessions and their
     campaign targets — presenting it as a ranked column of colleagues is the one
     thing it must never be. What a team leader actually needs is triage: the
     three agents where an hour buys the most, and the driver to spend it on. */
  const triage=team.slice().map(a=>({a:a,rt:AP.rating(a.id),cm:AP.comm(a.id)}))
    .filter(x=>x.rt.weakest&&x.rt.weakest.available>=1)
    .sort((x,y)=>y.rt.weakest.available-x.rt.weakest.available).slice(0,3);
  h+='<div class="ap-panel"><div class="ap-panel-h">'+ICO('shield')+'<span>Where your time buys the most</span></div>'
   +'<div class="ap-panel-s">The three agents with the most rating points sitting unclaimed, and the one driver to spend the time on. This is not a ranking — every agent is measured against their own last five sessions and their campaign targets, never against each other.</div>'
   +(triage.length?'<table class="tbl"><thead><tr><th class="noclick">Agent</th><th class="noclick">Spend the time on</th><th class="noclick">Now</th><th class="noclick">Target</th><th class="noclick">Points it releases</th><th class="noclick">Sales held</th></tr></thead><tbody>'
   +triage.map(x=>{const w=x.rt.weakest;
     return '<tr><td><b>'+esc(x.a.name)+'</b></td>'
      +'<td>'+esc(w.label)+'</td>'
      +'<td class="num">'+AP.mFmt(w.value,w.fmt)+'</td><td class="num">'+AP.mFmt(w.target,w.fmt)+'</td>'
      +'<td class="num">'+Math.round(w.available)+'</td>'
      +'<td>'+(x.cm.todayHeld?AP.pill(x.cm.todayHeld+' today','a'):AP.pill('None','g'))+'</td></tr>'}).join('')
   +'</tbody></table>'
   :'<div class="ap-empty">Every agent on this team is at target on every driver.</div>')
   +'<div class="ap-panel-s">A sale below the campaign requirement does not count towards target, commission or the team total — so improvement bought with quality is not improvement.</div>'
   +'</div>';
  h+='<div class="ap-panel"><div class="ap-panel-h">'+ICO('clock')+'<span>Record</span></div>'
   +'<table class="tbl"><thead><tr><th class="noclick">When</th><th class="noclick">Who</th><th class="noclick">What</th></tr></thead><tbody>'
   +AP.s.audit.slice(0,25).map(x=>'<tr><td class="num">'+x.at+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.obj)+' — '+esc(x.detail)+'</td></tr>').join('')
   +'</tbody></table><div class="ap-panel-btns"><button class="btn" onclick="AP.auditModal()">See Full Record</button>'
   +'<button class="btn" onclick="AP.adoptModal()">Usage</button></div></div>';
  return h;
};

/* ---- simplified state system: five action, four support, four commission ---- */
AP.ACTION_STATE=function(p){
  if(!p)return {k:'none',l:'No action set',c:'wait'};
  if(p.pausedAt||p.status==='assistance_requested')return {k:'waiting',l:'Waiting for help',c:'wait'};
  if(['completed_agent','awaiting_review','closed'].indexOf(p.status)>=0)return {k:'completed',l:'Completed',c:'done'};
  const i=AP.dueInfo(p);
  if(i.state==='overdue'||i.state==='now')return {k:'overdue',l:i.label,c:'over'};
  if(i.state==='soon')return {k:'soon',l:i.label,c:'soon'};
  return {k:'active',l:i.label,c:'active'};
};
AP.SUPPORT_STATE=function(r){
  if(!r)return {k:'none',l:'No active support',c:'wait'};
  if(r.status==='awaiting_confirm')return {k:'agent',l:'Waiting for you to confirm',c:'soon'};
  if(r.status==='confirmed')return {k:'done',l:'Completed',c:'done'};
  if(['in_progress','scheduled','accepted'].indexOf(r.status)>=0)return {k:'progress',l:'In progress',c:'active'};
  return {k:'requested',l:'Requested',c:'active'};
};
AP.COMMISSION_STATE=function(cm){
  if(cm.mtdHeld>0)return {k:'blocked',l:'Blocked by quality',c:'over'};
  if(cm.overdueClearing)return {k:'delayed',l:'Delayed',c:'soon'};
  if(cm.pending<=0&&cm.mtdEst>0)return {k:'confirmed',l:'Confirmed',c:'done'};
  return {k:'estimated',l:'Estimated',c:'active'};
};

AP.BUILTIN_CAMPAIGNS=null;
AP.applyUploads=function(){
  if(!AP.BUILTIN_CAMPAIGNS)AP.BUILTIN_CAMPAIGNS=JSON.parse(JSON.stringify(AP.CAMPAIGNS));
  const reg=(state.facts.CAMPAIGN_REGISTER||[]).filter(r=>r.campaign&&r.active);
  const rules=(state.facts.COMMISSION_RULES||[]).filter(r=>r.campaign&&r.rate!=null);
  AP.uploadSource={campaigns:reg.length>0,rules:rules.length>0,statement:(state.facts.COMMISSION_STATEMENT||[]).length>0};
  if(!reg.length&&!rules.length){AP.CAMPAIGNS=JSON.parse(JSON.stringify(AP.BUILTIN_CAMPAIGNS));return}
  const out=reg.length?{}:JSON.parse(JSON.stringify(AP.BUILTIN_CAMPAIGNS));
  const key=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  reg.forEach(function(r){
    const k=key(r.campaign);
    out[k]={id:k,name:r.campaign,dailyTarget:r.daily_target||5,convTarget:r.conv_target||10,
      qaTarget:r.qa_target||90,cleanTarget:r.clean_target||92,talkTarget:r.talk_target||190,
      prodTarget:r.prod_target||320,contactTarget:r.contacts_target||48,adherenceTarget:r.adherence_target||92,
      comm:{qualifying:'Activated sale on this campaign',minQA:85,minClean:90,tiers:[{n:1,from:0,rate:50}],
        bonus:{label:'Quality bonus',cond:'Set in the commission rules file',amount:0},
        exclusions:['Sales cancelled inside the first billing cycle','Sales failing clean-sale review'],
        reversal:'Commission reverses in full where the contract cancels inside the first billing cycle.',
        period:'Calendar month · paid with the following month payroll run',
        clearing:'A sale is confirmed once clean-sale review and activation have both passed.'}};
  });
  /* brackets — matched to the campaign by name, not by internal key */
  const resolve=function(name){
    const k=key(name);if(out[k])return k;
    const hit=Object.keys(out).find(function(x){return String(out[x].name).toLowerCase()===String(name).toLowerCase()});
    if(hit)return hit;
    out[k]={id:k,name:name,dailyTarget:5,convTarget:10,qaTarget:90,cleanTarget:92,talkTarget:190,prodTarget:320,
      contactTarget:48,adherenceTarget:92,
      comm:{qualifying:'Activated sale on this campaign',minQA:85,minClean:90,tiers:[{n:1,from:0,rate:50}],
        bonus:{label:'',cond:'',amount:0},exclusions:['Sales cancelled inside the first billing cycle'],
        reversal:'Commission reverses in full where the contract cancels inside the first billing cycle.',
        period:'Calendar month',clearing:'Confirmed once clean-sale review and activation have passed.'}};
    return k};
  const byCamp={};
  rules.forEach(function(r){const k=resolve(r.campaign);(byCamp[k]=byCamp[k]||[]).push(r)});
  Object.keys(byCamp).forEach(function(k){
    if(!out[k])return;
    const rs=byCamp[k].slice().sort((a,b)=>(a.from||0)-(b.from||0));
    out[k].comm.tiers=rs.map(function(r,i){return {n:r.bracket||i+1,from:r.from||0,rate:r.rate||0}});
    const f=rs[0];
    if(f.min_qa!=null)out[k].comm.minQA=f.min_qa;
    if(f.min_clean!=null)out[k].comm.minClean=f.min_clean;
    if(f.qualifying)out[k].comm.qualifying=f.qualifying;
    if(f.period)out[k].comm.period=f.period;
    if(f.bonus_label)out[k].comm.bonus={label:f.bonus_label,cond:f.bonus_cond||'',amount:f.bonus_amount||0};
  });
  AP.CAMPAIGNS=out;
  /* any agent whose campaign has gone away falls back to the first live campaign */
  const keys=Object.keys(AP.CAMPAIGNS);
  AP.AGENTS.forEach(function(a){if(!AP.CAMPAIGNS[a.camp])a.camp=keys[0]});
};

AP.comsCalc=function(agentId){
  const st=AP.comsState(agentId);
  const rows=AP.bracketRows(st.tenure);
  const worked=Math.max(0,st.worked),dial=Math.max(1,st.dialDays),gwp=Math.max(0,st.gwp);
  const perDay=worked>0?gwp/worked:0;
  const projected=perDay*dial;
  const remaining=Math.max(0,dial-worked);
  const secured=rows.filter(function(r){return projected>=r[0]}).slice(-1)[0]||null;
  const next=rows.find(function(r){return r[0]>projected})||null;
  const nextIdx=next?rows.indexOf(next)+1:null;
  const gapTotal=next?Math.max(0,next[0]-gwp):0;
  const perRemDay=next&&remaining>0?gapTotal/remaining:null;
  const extra=next?(next[1]-(secured?secured[1]:0)):0;
  /* what if the agent writes N more sales a day for the rest of the period */
  const perSale=AP.avgPremium(agentId);
  const n=st.what||1;
  const wGwp=gwp+perSale*n*remaining;
  const wPerDay=worked+remaining>0?wGwp/Math.max(1,worked+remaining)*1:0;
  const wProjected=worked>0?(wGwp/ (worked+remaining||1))*dial:0;
  const wProj=worked>0?((gwp/worked)*dial)+(perSale*n*remaining):0;
  const wSecured=rows.filter(function(r){return wProj>=r[0]}).slice(-1)[0]||null;
  return {st:st,rows:rows,worked:worked,dial:dial,gwp:gwp,perDay:perDay,projected:projected,remaining:remaining,
    secured:secured,next:next,nextIdx:nextIdx,gapTotal:gapTotal,perRemDay:perRemDay,extra:extra,
    perSale:perSale,whatN:n,whatProjected:wProj,whatSecured:wSecured,
    whatExtra:(wSecured?wSecured[1]:0)-(secured?secured[1]:0),
    pacePct:dial?Math.min(100,worked/dial*100):0};
};
AP.avgPremium=function(agentId){
  const a=AP.agentById(agentId),cm=AP.comm(agentId);
  const m=isoDay(new Date()).slice(0,7);
  const rows=AP.rows(agentId).filter(function(r){return r.d.slice(0,7)===m});
  const sales=rows.reduce(function(s,r){return s+(r.sales||0)},0);
  const st=AP.comsState(agentId);
  if(sales>0&&st.gwp>0)return st.gwp/sales;
  return Math.round(99/1.15*100)/100;   /* the R99 reference premium, excluding VAT */
};

   +'<div><span>Remaining days</span><b>'+k.remaining+'</b></div>'
   +'</div>'
   +'<div class="dq-meter" style="background:#E8EDF6"><i style="width:'+k.pacePct+'%;background:var(--dq-blue)"></i></div>'
   +'<div class="dq-s" style="margin-top:8px">Dialling day pace — '+k.worked+' of '+k.dial+' days complete ('+Math.round(k.pacePct)+'% of the period). '
   +'Figures start from '+esc(a.name)+'’s current period in Agent OS and can be changed here without altering anything else.</div></div>';

  /* what if you improve */
  h+='<div class="dq-anchor"><div class="dq-label">What if you improve</div>'
   +'<div class="hub-seg" style="margin-bottom:16px">'
   +[1,2,3].map(function(n){return '<button class="'+(k.whatN===n?'on':'')+'" onclick="AP.comsSet(\'what\','+n+')">+'+n+' sale'+(n>1?'s':'')+' a day</button>'}).join('')
   +'</div>'
   +'<div class="coms-pos">'
   +'<div><span>Premium you would write</span><b>'+AP.rand2(k.whatProjected)+'</b></div>'
   +'<div><span>That is more than now by</span><b>+'+AP.rand2(Math.max(0,k.whatProjected-k.projected))+'</b></div>'
   +'<div><span>Bracket it reaches</span><b>'+(k.whatSecured?AP.rand2(k.whatSecured[1]):'still below the first bracket')+'</b></div>'
   +'</div>'
   +'<div class="dq-b" style="margin-top:8px">'+(function(){
      const short=k.next?Math.max(0,k.next[0]-k.whatProjected):0;
      if(k.whatExtra>0)return 'That is enough to reach the next bracket. It would add '+AP.rand2(k.whatExtra)+' to your commission for the month.';
      if(k.next&&short>0)return 'That is still '+AP.rand2(short)+' of premium short of the next bracket, so the bracket commission does not change yet. The premium itself still counts.';
      return 'The bracket does not change at this pace.';})()+'</div>'
   +'<div class="dq-s" style="margin-top:8px">Bracket commission moves in steps, so writing more does not always move it straight away. Based on an average premium of '+AP.rand2(k.perSale)+' excluding VAT across the '+k.remaining+' remaining day'+(k.remaining===1?'':'s')+'. A projection, not a guarantee.</div></div>';

  /* bracket gap analysis */
  h+='<div class="dq-anchor"><div class="dq-label">Bracket gap analysis — GWP needed per remaining day to reach each bracket</div>'
   +'<table class="coms-tbl"><thead><tr><th>#</th><th>Bracket GWP excluding VAT</th><th>Bracket commission</th><th>GWP gap total</th><th>GWP gap a remaining day</th><th>Status</th></tr></thead><tbody>'
   +k.rows.map(function(r,i){
     const beat=k.projected>=r[0];
     const gap=Math.max(0,r[0]-k.gwp);
     const per=k.remaining>0?gap/k.remaining:null;
     return '<tr'+(beat?' class="beat"':'')+'><td>'+(i+1)+'</td><td class="n">'+AP.rand2(r[0])+'</td><td class="n">'+AP.rand2(r[1])+'</td>'
      +'<td class="n">'+(gap>0?AP.rand2(gap):'—')+'</td><td class="n">'+(gap>0&&per!=null?AP.rand2(per):'—')+'</td>'
      +'<td><span class="dq-state '+(beat?'done':'active')+'">'+(beat?'Beat':'To go')+'</span></td></tr>'}).join('')
   +'</tbody></table>'
   +'<div class="dq-s" style="margin-top:12px">Bracket table for '+esc(k.st.tenure)+' · '+(AP.bracketSource()==='file'
      ?'from the commission brackets file uploaded by finance'
      :(AP.s.role==='agent'?'the shipped default until finance uploads the current one'
        :'the shipped default — upload a brackets file in the Upload Center to replace it'))+'.</div>'
   +'<div class="dq-btns"><button class="dq-link" onclick="AP.comsReset()">Reset to my Agent OS figures</button>'
   +'<button class="dq-link" onclick="window.open(\''+AP.APPS.coms.url+'\',\'_blank\',\'noopener\')">Open the live calculator</button></div></div>';
  h+='</div>';
  return h;
};

/* =====================================================================
   AGENT RATING — the composite that ties behaviour to commission
   One number the agent can move, built from the things they control.
   Weights are governed in the rules registry, not hard-coded here.
   ===================================================================== */
AP.RATING_DEF=[
 {k:'conv',    label:'Conversion rate',  w:25, fmt:'pct', help:'Of the customers you pitched, how many bought.',
   lift:'Use the short answer on the objection that keeps ending your calls, then ask for the sale earlier.'},
 {k:'closure', label:'Lead closure',     w:20, fmt:'pct', help:'Of the leads you were given, how many you took all the way to a decision.',
   lift:'Work every lead on the list to a yes or a no. Leads left unworked cost more than leads lost.'},
 {k:'qa',      label:'Quality',          w:20, fmt:'pct', help:'Out of every 100 sales you write, how many count. A sale counts when it passes the call check and the clean-sale check.',
   lift:'Run the clean-sale steps on every sale before you send it, especially the disclosure and the confirmation.'},
 {k:'talk',    label:'Talk time',        w:15, fmt:'int', help:'Minutes on the phone in a session. More time on the phone means more people to pitch.',
   lift:'Take the next call as soon as you finish the last one. The gaps between calls are what cost you.'},
 {k:'present', label:'Attendance',       w:20, fmt:'att', help:'Days present. You cannot sell on a day you are not here.',
   lift:'A full session at scheduled state. Attendance is the denominator behind every other number.'}
];
AP.ratingWeights=function(){
  const r=(state.rules&&state.rules.agentRating&&state.rules.agentRating.vals)||null;
  if(!r||!r.length)return AP.RATING_DEF.map(function(d){return Object.assign({},d)});
  const map={};r.forEach(function(v){const i=String(v).lastIndexOf(':');
    map[String(v).slice(0,i).trim().toLowerCase()]=parseFloat(String(v).slice(i+1))||0});
  return AP.RATING_DEF.map(function(d){
    const w=map[d.label.toLowerCase()];
    return Object.assign({},d,{w:w==null?d.w:w});
  });
};
AP.RATING_BANDS=[
 {min:90,label:'Elite',c:'done'},{min:80,label:'Strong',c:'done'},{min:70,label:'On track',c:'active'},
 {min:60,label:'Building',c:'soon'},{min:0,label:'Needs support',c:'over'}
];
AP.ratingBand=function(v){return AP.RATING_BANDS.find(function(b){return v>=b.min})||AP.RATING_BANDS[AP.RATING_BANDS.length-1]};

AP.ratingTargets=function(a){
  /* per campaign where the campaign carries one, otherwise the global default */
  const c=AP.camp(a);
  return {conv:c.convTarget,
    closure:c.closureTarget!=null?c.closureTarget:AP.CLOSURE_TARGET,
    qa:c.qualityTarget!=null?c.qualityTarget:AP.QUALIFY_TARGET,
    talk:c.talkTarget,present:1};
};
/* a component starts earning at half of target and pays in full at target — so the rating discriminates */
AP.RATING_FLOOR=0.5;
AP.CLOSURE_TARGET=65;
/* current value of each component, averaged over the last five sessions so one day never swings it */
AP.QUALIFY_TARGET=95;
/* Quality is one number the agent can see and move: the share of the sales
   they wrote that actually counted. The QA score and the clean-sale score stay
   on screen as the diagnosis — which gate is failing — but they are not
   separate maths, and nothing hidden feeds the rating. */
AP.qualifyRate=function(id){
  const cfg=AP.camp(AP.agentById(id)).comm;
  const rows=AP.rows(id).filter(function(r){return r.present}).slice(-(AP.rb?AP.rb('rating_window_sessions'):5));
  var wrote=0,counted=0;
  rows.forEach(function(r){const s=r.sales||0;if(!s)return;wrote+=s;
    if((r.qa==null||r.qa>=cfg.minQA)&&(r.clean==null||r.clean>=cfg.minClean))counted+=s});
  return wrote>0?counted/wrote*100:null;
};
/* Which check is costing this agent sales, read off the sessions that were
   actually held. Returns the worst reading on those sessions, because that is
   the number the agent has to lift — not their average, which can clear both
   minimums while a third of their sales fall out. */
/* 91.5 against a minimum of 92 must not both round to 92 on screen — an agent
   reading "you are at 92, you need 92" concludes the app is broken. */
AP.gateFmt=function(v,t){
  if(v==null)return '—';
  return (Math.round(v)===Math.round(t)&&v<t)?(Math.round(v*10)/10).toFixed(1):String(Math.round(v));
};
AP.holdReason=function(id){
  const cfg=AP.camp(AP.agentById(id)).comm;
  const rows=AP.rows(id).filter(function(r){return r.present&&(r.sales||0)>0}).slice(-(AP.rb?AP.rb('rating_window_sessions'):5));
  var byQA=0,byClean=0,worstQA=null,worstClean=null,held=0;
  rows.forEach(function(r){
    const qaBad=r.qa!=null&&r.qa<cfg.minQA, clBad=r.clean!=null&&r.clean<cfg.minClean;
    if(!qaBad&&!clBad)return;
    held++;
    if(qaBad){byQA+=r.sales||0;if(worstQA==null||r.qa<worstQA)worstQA=r.qa}
    if(clBad){byClean+=r.sales||0;if(worstClean==null||r.clean<worstClean)worstClean=r.clean}
  });
  if(!held)return {by:null,value:null,heldSessions:0,bySales:0};
  const clean=byClean>=byQA;
  return {by:clean?'clean':'qa',value:clean?worstClean:worstQA,
    heldSessions:held,bySales:clean?byClean:byQA};
};
AP.ratingValues=function(id){
  const c=AP.camp(AP.agentById(id));
  const qa=AP.avg(id,'qa',5),clean=AP.avg(id,'clean',5);
  /* Point at the gate that is actually holding the money. A sale is held by the
     COMMISSION MINIMUM, not by the softer campaign target — telling an agent to
     lift a call score that already clears the minimum sends them after the
     wrong number for a week. */
  const cfg=c.comm;
  const hold=AP.holdReason(id);
  const useClean=hold.by==='clean';
  /* the same window as every other driver, so the screens can say five and mean it */
  const W=AP.rb?AP.rb('rating_window_sessions'):5;
  const last=AP.rows(id).slice(-W);
  const present=last.length?last.filter(function(x){return x.present}).length/last.length:0;
  const cm=AP.comm(id);
  return {conv:AP.avg(id,'conv',5),closure:AP.avg(id,'closure',5),
    qa:AP.qualifyRate(id),qaTargetOverride:(c.qualityTarget!=null?c.qualityTarget:AP.QUALIFY_TARGET),
    qaScore:qa,cleanScore:clean,qaIsClean:useClean,
    gateLabel:useClean?'clean-sale score':'call score',
    gateValue:hold.value!=null?hold.value:(useClean?clean:qa),
    gateTarget:useClean?cfg.minClean:cfg.minQA,
    gateFailing:hold.heldSessions>0,
    heldSessions:hold.heldSessions,
    heldSales:cm.mtdHeld,
    talk:AP.avg(id,'talk',5),present:present};
};
AP.rating=function(id){
  const a=AP.agentById(id),defs=AP.ratingWeights(),tg=AP.ratingTargets(a),vals=AP.ratingValues(id);
  let total=0,wsum=0;
  const F=AP.RATING_FLOOR;
  const parts=defs.map(function(d){
    const v=vals[d.k];
    const t=(d.k==='qa'&&vals.qaTargetOverride)?vals.qaTargetOverride:tg[d.k];
    let att=(v==null||!t)?0:Math.max(0,Math.min(1,v/t));          /* never above target — one strong number cannot mask a weak one */
    /* nothing else touches the score. If a number moves the rating, it is on
       screen as one of the five. `available` below is therefore exactly what
       bringing this driver to target pays — asserted by test, not by comment. */
    const scaled=Math.max(0,Math.min(1,(att-F)/(1-F)));
    const pts=Math.round(scaled*d.w*10)/10;
    total+=pts;wsum+=d.w;
    return {k:d.k,label:d.label,help:d.help,lift:d.lift,w:d.w,
      value:v,target:t,fmt:d.fmt,held:(d.k==='qa'?vals.heldSales:0),
      gateLabel:(d.k==='qa'?vals.gateLabel:null),gateValue:(d.k==='qa'?vals.gateValue:null),
      gateTarget:(d.k==='qa'?vals.gateTarget:null),
      att:Math.round(att*1000)/10,fill:Math.round(scaled*1000)/10,
      points:pts,available:Math.round(Math.max(0,d.w-pts)*10)/10,
      onTarget:v!=null&&t?v>=t:false};
  });
  const score=Math.round(Math.min(100,wsum?total/wsum*100:0)*10)/10;
  const band=AP.ratingBand(score);
  const nextBand=AP.RATING_BANDS.slice().reverse().find(function(b){return b.min>score});
  const sorted=parts.slice().sort(function(x,y){return y.available-x.available});
  return {score:score,band:band,nextBand:nextBand||null,
    toNextBand:nextBand?Math.round((nextBand.min-score)*10)/10:0,
    parts:parts,weakest:sorted[0],strongest:parts.slice().sort(function(x,y){return y.att-x.att})[0],
    onTarget:parts.filter(function(p){return p.onTarget}).length};
};
/* what one component is worth in rand if it reaches target */
AP.ratingLift=function(id,k){
  const a=AP.agentById(id),c=AP.camp(a),cm=AP.comm(id),r=AP.rating(id);
  const p=r.parts.find(function(x){return x.k===k});if(!p)return null;
  const m=isoDay(new Date()).slice(0,7);
  const days=AP.rows(id).filter(function(x){return x.d.slice(0,7)===m}).length||1;
  const left=Math.max(1,AP.monthWorkdays(false)-days);
  const v=AP.ratingValues(id);
  const leads=AP.avg(id,'leads',5)||0, pres=AP.avg(id,'pres',5)||0;
  let salesNow=0,salesThen=0;
  if(k==='conv'){salesNow=pres*(v.conv||0)/100;salesThen=pres*p.target/100}
  else if(k==='closure'){const newPres=leads*p.target/100;salesNow=pres*(v.conv||0)/100;salesThen=newPres*(v.conv||0)/100}
  else if(k==='present'||k==='attendance'){
    const rate=(k==='attendance')?((p.value||0)/100):(v.present||0);
    salesNow=pres*(v.conv||0)/100*rate;salesThen=pres*(v.conv||0)/100*1}
  else if(k==='targetAch'){
    /* Target achievement IS the daily number, expressed as a percentage of it.
       Turn it back into sales so the payoff is a sale, not a percentage. */
    const g=AP.tenureGroupOf(a);
    salesNow=(p.value||0)/100*g.dailySales;salesThen=g.dailySales}
  else if(k==='gwpSale'){
    /* Value per sale does not add sales, so it does not add commission. It adds
       what the business earns on the sales already written, and it is Check 1.
       Telling an agent it pays them rand would not be true. */
    const dm=AP.nbaMetrics(id);
    const gap=Math.max(0,(p.target||0)-(p.value||0));
    const extra=gap*(dm.sales||0);
    return {k:k,label:p.label,salesDelta:0,rand:0,
      text:gap>0?('Every sale you write is worth about '+AP.zar(p.value)+'. Bringing it to '+AP.zar(p.target)
        +' adds about '+AP.zar(extra)+' on the sales you have written. That is Check 1. It is worth '
        +Math.round(p.available)+' rating '+AP.plural(Math.round(p.available),'point')+'.')
        :('Your sales already clear '+AP.zar(p.target)+'. Holding it keeps Check 1 passing.')};
  }
  else if(k==='gwpTotal'){
    /* The value gap becomes sales at the value of the agent's own average sale,
       and those sales pay commission at their own tier rate. */
    const dm=AP.nbaMetrics(id);
    const per=dm.m.gwpSale||AP.GWP_MIN_PER_SALE;
    const gap=Math.max(0,(p.target||0)-(p.value||0));
    const salesEq=per>0?gap/per:0;
    const money=salesEq*cm.rate;
    return {k:k,label:p.label,salesDelta:Math.round(salesEq*10)/10,rand:money,
      text:gap>0?('You are '+AP.zar(gap)+' short of your value target this month. At '+AP.zar(per)
        +' a sale that is about '+(Math.round(salesEq/left*10)/10)+' more a session over the '+left
        +' '+AP.plural(left,'session')+' left. That is roughly '+AP.zar(money)+' in commission.')
        :'You are at your value target for this period. Holding it keeps you there.'};
  }
  else if(k==='talk'){
    /* Talk time buys pitches, not sales. Putting a rand figure here asserts
       that longer calls close better — the opposite of what the conversion
       lever tells the same agent to do. It pays points, and says so. */
    return {k:k,label:p.label,salesDelta:0,rand:0,
      text:'More time on the phone means more people to pitch. It is worth '+Math.round(p.available)+' rating '+AP.plural(Math.round(p.available),'point')+'.'};}
  else if(k==='qa'){
    /* Quality does not add sales. It decides whether the ones already written
       count. The figure is what the tier table actually pays once they clear —
       not held x current rate, which understates it whenever a release crosses
       a tier. It is money being held, never money "more". */
    const held=cm.mtdHeld;
    const total=cm.mtdQual+held;
    let tf=c.comm.tiers[0];c.comm.tiers.forEach(function(x){if(total>=x.from)tf=x});
    const recover=Math.max(0,total*tf.rate-cm.mtdQual*cm.rate);
    return {k:k,label:p.label,salesDelta:0,rand:recover,held:held,heldMoney:true,
      text:held?(held+' sale'+(held===1?'':'s')+' you have already written '+(held===1?'is':'are')+' being held — about '+AP.zar(recover)+' that is not counting yet.')
        :'Quality is what keeps the sales you write counting. Holding it protects everything else on this list.'};
  }
  const delta=Math.max(0,salesThen-salesNow);
  const rand=delta*left*cm.rate;
  return {k:k,label:p.label,salesDelta:Math.round(delta*10)/10,rand:rand,
    text:delta>0.05?('Bringing '+AP.lowLabel(p.label)+' to target is worth about '+(Math.round(delta*10)/10)+' more qualifying sale'+(delta>=1.05||delta<0.95?'s':'')+' a session — roughly '+AP.zar(rand)+' more over the '+left+' sessions left this month.')
      :('Bringing '+AP.lowLabel(p.label)+' to target protects the sales you are already writing.')};
};
/* AP.ratingRank is deliberately absent. It returned a team average and an
   above/below flag — a comparison against colleagues, which is the one thing
   the rating must never be. Nothing may reintroduce it. */

/* =====================================================================
   THE SESSION BRIEF — the message that opens the conversation
   ===================================================================== */
AP.briefKey=function(id){return id+'|'+isoDay(new Date())};
AP.briefSeen=function(id){return !!(AP.s.brief&&AP.s.brief[AP.briefKey(id)])};
AP.markBrief=function(id){AP.s.brief=AP.s.brief||{};AP.s.brief[AP.briefKey(id)]=AP.now();AP.save()};

/* the session brief is defined once, further down, in plain language */
/* which kind of help a driver needs — the map the brief's one button rides on */
/* When a metric is gated by the commission rules, the number to quote is the
   one that decides whether a sale counts — not the softer campaign target. Two
   numbers for one gate, one line apart, is how a team leader loses an agent. */
AP.gateTargetFor=function(k,agent){
  const c=AP.camp(agent);
  if(k==='qa')return c.comm.minQA;
  if(k==='clean')return c.comm.minClean;
  const t={conv:c.convTarget,talk:c.talkTarget,prod:c.prodTarget,contacts:c.contactTarget,
    adher:c.adherenceTarget,sales:c.dailyTarget,present:1,closure:AP.CLOSURE_TARGET,compEx:0};
  if(t[k]!=null)return t[k];
  /* never return a target FUNCTION — it renders on screen as a literal NaN */
  const raw=(AP.METRICS.find(function(m){return m.k===k})||{}).tgt;
  return typeof raw==='number'?raw:null;
};
AP.HELP_FOR_PART={conv:'objection',closure:'call_review',qa:'qa',talk:'system',present:'other'};
AP.briefAsk=function(id){
  const b=AP.briefContent(id);
  const code=AP.HELP_FOR_PART[b.rating.weakest.k]||'other';
  const play=AP.nextAction(id);
  AP.s.agentId=id;
  const r=AP.raiseSupport(id,play?play.id:null,code,
    'My agent rating is '+b.rating.score+'. '+b.rating.weakest.label+' is '+AP.mFmt(b.rating.weakest.value,b.rating.weakest.fmt)
    +' against '+AP.mFmt(b.rating.weakest.target,b.rating.weakest.fmt)+' and it is holding back '+b.rating.weakest.available+' rating points.');
  r.createdMs=AP.nowMs();r.ratingPart=b.rating.weakest.label;r.ratingScore=b.rating.score;
  if(play)AP.pausePlay(play);
  AP.track('help_sent','rating_'+b.rating.weakest.k);
  AP.save();closeModal();render();
  toast(AP.firstName(b.tl)+' has your request, with the rating detail attached. Nothing is needed from you until he comes back.');
};
/* the component bars — the same shape everywhere the rating appears */
AP.ratingBars=function(id){
  const r=AP.rating(id);
  return '<div class="rate-bars">'+r.parts.map(function(p){
    const pct=Math.min(100,p.fill==null?p.att:p.fill);
    return '<div class="rate-row">'
     +'<span class="rate-k">'+esc(p.label)+'</span>'
     +'<span class="rate-v">'+AP.mFmt(p.value,p.fmt)+' <em>of '+AP.mFmt(p.target,p.fmt)+'</em></span>'
     +'<span class="rate-bar"><i class="'+(p.onTarget?'ok':pct>=80?'near':'low')+'" style="width:'+pct+'%"></i></span>'
     +'<span class="rate-p">'+p.points+' <em>/ '+p.w+' pts</em></span>'
     +'</div>';
  }).join('')+'</div>';
};

/* =====================================================================
   LEVERS AND PLAIN LANGUAGE
   Three levers. Six facts. Nine things to touch. Short words.
   Percentages are said as "out of 100" because that is how people think.
   ===================================================================== */

/* ---- plain number helpers ---- */
AP.outOf100=function(pct){return Math.round(pct||0)};
AP.plainRand=function(v){const n=Math.round(v||0);
  if(n>=1000)return 'R'+n.toLocaleString('en-ZA');return 'R'+n};
AP.plural=function(n,one,many){return n===1?one:(many||one+'s')};

/* ---- the six words an agent meets, said simply ---- */
/* The two numbers, then the drivers that move them. Nothing else needs
   explaining, because nothing else feeds the rating. */
/* The words the product uses that are not drivers. The drivers explain
   themselves from the engine below, so this list cannot fall behind the score
   the way a hand-written one did when v3 renamed every driver. */
AP.GLOSSARY_HEAD=[
 ['Agent rating','A score out of 100. It shows how well you work. It is not a race against anyone.'],
 ['Commission','The money you earn on top of your pay. It comes from sales that count.'],
 ['GWP','What a sale is worth to the business. It is the premium on the policy, not your commission.'],
 ['Check 1 and Check 2','Every sale is checked twice. Check 1 is what it is worth. Check 2 is how many you write.'],
 ['Next best action','The one thing to work on now. The most serious thing always comes first.']
];
AP.glossary=function(){
  return AP.GLOSSARY_HEAD.concat((AP.RATING_DEF||[]).map(function(d){
    return [d.label,d.help||'']}).filter(function(r){return r[1]}));
};

AP.LEVER_DEF={
 conv:{title:'Ask for the sale sooner',hold:'Keep asking for the sale early',holdWorth:'Keeps your sales coming.',
   how:'On your next five calls, ask for the sale as soon as the customer sounds happy. Do not wait for the end.'},
 closure:{title:'Finish every lead',hold:'Keep finishing every lead',holdWorth:'Keeps your list working.',
   how:'Work every lead on your list until you get a yes or a no. A no is finished. A maybe is not.'},
 qa:{title:'Do the clean-sale steps',hold:'Keep doing the clean-sale steps',holdWorth:'Keeps your sales counting.',
   how:'Before you send a sale, check the disclosure and the confirmation. Every sale. Every time.'},
 talk:{title:'Close the gaps between calls',hold:'Keep your call time up',holdWorth:'Keeps your pitches up.',
   worth:'More time on the phone means more people to pitch.',
   how:'Take your next call as soon as you finish the last one. The gaps between calls are what cost you.'},
 present:{title:'Be here every session',hold:'Keep being here every session',holdWorth:'Keeps your target in reach.',
   how:'A full session, on time, at your desk. You cannot sell on a day you are not here.'}
};
AP.leverNow=function(p){
  switch(p.k){
    case 'conv':return {now:'About '+AP.outOf100(p.value)+' out of every 100 people you pitch say yes.',
                        want:'We want '+AP.outOf100(p.target)+' out of 100.'};
    case 'closure':return {now:'You finish '+AP.outOf100(p.value)+' out of every 100 leads.',
                        want:'We want '+AP.outOf100(p.target)+' out of 100.'};
    case 'qa':return {now:AP.outOf100(p.value)+' out of every 100 sales you wrote counted.',
                        want:'We want '+AP.outOf100(p.target)+' out of 100.',
                        gate:(p.gateValue!=null?('Your '+p.gateLabel+' is '+AP.gateFmt(p.gateValue,p.gateTarget)+'. You need '+AP.outOf100(p.gateTarget)+'. '):'')};
    case 'talk':return {now:'You talk for about '+Math.round(p.value||0)+' minutes a session.',
                        want:'We want '+Math.round(p.target)+' minutes.'};
    case 'present':return {now:'You were here for '+Math.round((p.value||0)*5)+' of your last 5 sessions.',
                        want:'We want all 5.'};
    default:return {now:'',want:''};
  }
};
AP.levers=function(id){
  const r=AP.rating(id);const used={};
  const mk=function(p,hold){
    const d=AP.LEVER_DEF[p.k]||{title:p.label,how:''};
    const n=AP.leverNow(p);
    const lift=hold?null:AP.ratingLift(id,p.k);
    const rand=lift?Math.round(lift.rand):0;
    used[p.k]=1;
    return {k:p.k,hold:!!hold,
      title:hold?(d.hold||d.title):d.title,
      how:hold?('Keep it up. '+d.how):((n.gate||'')+d.how),
      now:n.now,
      want:hold?'You are at target. Hold it there.':n.want,
      points:hold?0:Math.round(p.available),rand:hold?0:rand,
      worth:hold?(d.holdWorth||'Protects what you earn.')
        :(p.k==='qa'&&lift&&lift.heldMoney&&rand>0)?(AP.plainRand(rand)+' is being held.')
        :(rand>0?('About '+AP.plainRand(rand)+' more this month.')
        :(d.worth||(p.k==='qa'?'This keeps the sales you already made counting.':'This protects what you already earn.'))),
      metric:p.label};
  };
  const MINP=AP.rb?AP.rb('lever_min_points'):0.2, NLEV=AP.rb?AP.rb('levers_shown'):3;
  const gaps=r.parts.filter(function(p){return p.available>=MINP}).sort(function(a,b){return b.available-a.available});
  const out=gaps.slice(0,NLEV).map(function(p){return mk(p,false)});
  /* Always three. When there is little left to fix, name what to hold.
     That is a real instruction, not padding, and the count never changes
     from one day to the next — which is what makes the habit stick. */
  if(out.length<NLEV){
    r.parts.slice().sort(function(a,b){return b.points-a.points}).forEach(function(p){
      if(out.length<NLEV&&!used[p.k])out.push(mk(p,true));
    });
  }
  return out;
};

AP.briefContent=function(id){
  const a=AP.agentById(id),c=AP.camp(a),cm=AP.comm(id),tl=AP.tlById(a.tl);
  const r=AP.rating(id),lv=AP.levers(id);
  const strong=r.parts.slice().sort(function(x,y){return y.points-x.points})[0];
  const sn=AP.leverNow(strong);
  const open=AP.greeting()+', '+AP.firstName(a)+'. Your rating is '+Math.round(r.score)+' out of 100.';
  const band='That is \u201c'+r.band.label.toLowerCase()+'\u201d.'
    +(r.nextBand?(' Get '+Math.ceil(r.toNextBand)+' more '+AP.plural(Math.ceil(r.toNextBand),'point')+' to reach \u201c'+r.nextBand.label.toLowerCase()+'\u201d.'):' That is the top band.');
  const good='You are strong at '+AP.lowLabel(strong.label)+'. '+sn.now+' Keep that going.';
  const money=cm.next
    ? ('You have made '+AP.plainRand(cm.todayEst)+' so far today. '+cm.need+' more '+AP.plural(cm.need,'sale')
       +' this month takes you to the next level. That is about '+cm.perDay+' a session, and about '+AP.plainRand(cm.nextGain)+' more.')
    : ('You have made '+AP.plainRand(cm.todayEst)+' so far today. You are on the top level for '+c.name+'.');
  const ask=AP.firstName(tl)+' can help you with this. One tap sends the details. Your clock stops while you wait.';
  return {agent:a,tl:tl,rating:r,levers:lv,open:open,band:band,good:good,money:money,ask:ask,strongest:strong,cm:cm};
};

AP.leverCard=function(l,i){
  /* The payoff sits on the same line as the name of the lever, so the body
     text runs the full width of the card. Fewer wrapped lines means the whole
     brief fits one screen — nobody scrolls to find the button. */
  return '<div class="lev'+(l.hold?' is-hold':'')+'">'
   +'<div class="lev-n">'+(i+1)+'</div>'
   +'<div class="lev-b">'
   +'<div class="lev-top"><div class="lev-t">'+esc(l.title)+'</div>'
   +'<div class="lev-w"><span class="lev-rand">'+esc(l.worth.replace(/^About /,''))+'</span>'
   +(l.points?'<span class="lev-pts">+'+l.points+' rating '+AP.plural(l.points,'point')+'</span>'
      :(l.hold?'<span class="lev-pts hold">Hold this</span>':''))
   +'</div></div>'
   +'<div class="lev-now">'+esc(l.now)+' '+esc(l.want)+'</div>'
   +'<div class="lev-how">'+esc(l.how)+'</div>'
   +'</div>'
   +'</div>';
};

async function init(){
  state.kpis=JSON.parse(JSON.stringify(DEFAULT_KPIS));
  state.rules=JSON.parse(JSON.stringify(DEFAULT_RULES));
  const cfg=await load('cb-config');
  if(cfg){if(cfg.kpis?.length)state.kpis=cfg.kpis;if(cfg.rules)state.rules=Object.assign({},JSON.parse(JSON.stringify(DEFAULT_RULES)),cfg.rules);if(cfg.agentMap)state.agentMap=cfg.agentMap;if(cfg.sfOwnerMap)state.sfOwnerMap=cfg.sfOwnerMap;if(cfg.cbInfo)state.cbInfo=cfg.cbInfo;if(cfg.user)state.user=cfg.user}
  const audit=await load('cb-audit');
  if(audit){state.batches=audit.batches||[];state.exceptions=audit.exceptions||[];state.demo=!!audit.demo}
  for(const k of [...SRC_KEYS,...SES_KEYS]){const f=await load('cb-facts-'+k);if(f?.length)state.facts[k]=f}
  $('#userNm').textContent=state.user;$('#userAv').textContent=state.user[0]||'A';
  render();
}

/* ---------------- IN-APP TRAINING GUIDE ---------------- */
const GUIDE_HTML=`
<h2 style="margin-top:0">Running AgentOS Analytics in 20 minutes a week</h2>
<p>This system turns six manual exports into one governed picture of production, quality and people. Nothing connects to client systems — you download files the way you already do, drop them into the Upload Center, and every dashboard fills itself in. The full manual (with per-source download steps and troubleshooting) is in the separate Training Guide document; this page is the quick version that lives with the tool.</p>

<div class="callout">The golden rule: <b>check the Data Trust bar before you read a single number.</b> Grey means never uploaded, amber means getting old, red means stale. A beautiful chart on stale data is a confident wrong answer.</div>

<h2>The weekly rhythm</h2>
<table class="tbl"><thead><tr><th class="noclick">When</th><th class="noclick">Who</th><th class="noclick">What</th></tr></thead><tbody>
<tr><td><b>Monday 09:00</b></td><td>Ryan</td><td>Upload all six sources for last week. Trust bar goes green.</td></tr>
<tr><td><b>Wednesday</b></td><td>Jared</td><td>Upload the mid-week QA export; work the open critical fails list.</td></tr>
<tr><td><b>Friday</b></td><td>Nick</td><td>Open the Executive view, read "Where value is leaking", assign one action per leak.</td></tr>
</tbody></table>

<h2>Uploading a file (60 seconds)</h2>
<ol>
<li>Go to <b>Upload Center</b> and find the slot for your source — each slot names the system and expected format.</li>
<li>Drag the file in (or Choose file). The app reads it, checks every column heading against the contract, and shows you a preview.</li>
<li>Read the chips: green "Headers valid" means load away; red means the export changed shape — don't force it, tell Ryan.</li>
<li>Click <b>Validate rows &amp; load</b>. Broken rows are never silently dropped — they land in the Exceptions table with a reason.</li>
</ol>
<div class="callout warn">Three quirks the parser already handles, so don't "fix" files in Excel first: Salesforce .xls exports are secretly HTML pages; Salesforce writes ages like <b>3002,0000000000</b> (comma decimals); QA durations arrive as both MM:SS and HH:MM:SS. Opening and re-saving in Excel can corrupt these — upload the raw download.</div>

<h2>Reading a KPI tile</h2>
<p>Every tile is: the value, a coloured dot (green/amber/red against its thresholds), a delta chip versus the previous equal period, and a sparkline. <b>Click any tile</b> to see its full card — what it means, how it's calculated, what to do when it's red, and who owns it. If a tile says "Snapshot · as of…", that source (open cases, activations) has no date column, so it always reflects the latest upload rather than the selected date range.</p>

<h2>The Threshold Control Centre — when success gets redefined</h2>
<p>Open <b>Dictionary, Rules &amp; Thresholds → Thresholds (RAG)</b>, or hit the <b>⚙ Thresholds &amp; rules</b> button that sits above every KPI row. Every metric is listed by dashboard area with its live value, its direction, and two boxes: <b>Good</b> (green at/beyond this) and <b>Watch</b> (amber at/beyond this; red past it). Type a new number, press Enter, and every tile dot, department status and the Executive nutshell recolours instantly — and the change persists. <b>Reset</b> returns a metric to its shipped default; <b>Clear RAG</b> turns a metric informational (no colour). When leadership moves the bar — "pass rate green is now 92, not 90" — this is the sixty-second job that makes it true everywhere at once.</p>

<h2>Changing the rules — the part that makes this yours</h2>
<p>Open <b>KPI Dictionary &amp; Rules → Interpretation rules</b>. These small lists define what the words mean: which dialler statuses count as <i>answered</i>, which QA decisions count as a <i>pass</i>, which attendance codes count as <i>present</i>, what a <i>clean sale</i> is. Add or remove a value and every KPI, chart and scorecard recalculates instantly. Two rules need your confirmation on day one:</p>
<ul>
<li><b>Present codes</b> — the sample data showed P, AL and CA; if your HR export uses more codes, add them under Present or Leave so they're not counted as absence.</li>
<li><b>Clean-sale definition</b> — currently: a Sale-type QA assessment whose Escalation Decision is "Pass". If your definition differs, adjust the Pass values and the Sale assessment types.</li>
</ul>

<h2>Adding a metric (2 minutes, no code)</h2>
<ol>
<li>Dictionary → <b>+ Add KPI</b>.</li>
<li>Name it, pick the page it lives on, pick the source table.</li>
<li>Choose the calculation: count rows, sum/avg a field, or ratio.</li>
<li>Set the filter — e.g. field <kbd>lead_disposition</kbd>, operator <kbd>in</kbd>, value <kbd>Sale</kbd>. Use <kbd>$qaPass</kbd>-style references so your KPI follows rule changes automatically.</li>
<li>Set thresholds, write one honest sentence for "How to read it" and one for "Action when red". A metric without an action is decoration.</li>
</ol>

<h2>The Agent Discipline page</h2>
<p>Built entirely from fields already in the QA export: <b>Offense Number</b> drives the stage ladder, open statuses drive the caseload, <b>SLA Deadline</b> drives breaches, and the TL Stage 1 / TL Stage 2 / SM Escalation fields draw each agent's escalation path. The ladder itself (1: Coaching conversation → 5: Disciplinary hearing by default) is a <b>rule</b>, not code — edit it in Interpretation rules once Claudell / HR confirm the real progression. The register lists every agent with open items or offenses, worst first. One caution: this view supports the conversation; the QA tool and HR file remain the system of record for any formal action.</p>

<h2>Open cases: the per-agent attempt view</h2>
<p>Open cases are the live leads on the floor, and the <b>Case Owner</b> field arrives suffixed — "Abigail Moonsamy - Panimax", "Aamira Marion - EC3". The cleaner strips everything from the spaced hyphen onward and matches the remaining name to the <b>Sales Force</b> column of the daily Agent List, so both spellings of the same agent land on one roster row. The Sales page pivot then shows <b>each agent's count per Status disposition</b> — which attempt every lead sits on — with a Total column, and <b>Total Open Cases</b> is the headline tile. Owners that still match nothing after cleaning are flagged "unmapped" and counted in a banner, never silently absorbed. The Scorecard carries each agent's open-lead count as its own column.</p>

<h2>GWP incl and ex VAT — everywhere money shows</h2>
<p>The GWP table carries <b>VAT-inclusive</b> premiums, so every GWP figure in the app is inclusive by nature — and now shows its <b>ex-VAT</b> value alongside (÷1.15, from the VAT rule): on every rand KPI tile and its detail modal, the Scorecard GWP and GWP-target cells and their TL rollups, the Session Dashboard totals and agent GWP, the cycle panels (Current, Projected and Target each split; <b>Required per Day</b> corrected so the base figure is inclusive and ex = ÷1.15), the Team Leader leaderboard, boxes and Cycle Projection, the Agent Card&#39;s value tile and totals line, and the GWP mapping table itself, which gains an Ex VAT column. Compact tables (peer compare, watch lists, coaching) stay inclusive-only for width, with the basis stated in the TL methodology note. Change the VAT rule and every ex-VAT figure recomputes.</p>

<h2>The VAS cycle panels — run-rate, target and the TL projections</h2>
<p>Sales Production opens with the <b>Operational Performance Overview</b>: one panel per campaign from the cycle-targets rule, each computing Days Past (distinct days with dialler activity for that campaign), Days Remaining, Current Premium (cycle GWP attributed through the base table), <b>Projected premium</b> at the current run rate (current ÷ days past × total dialing days), % to target, and <b>Required per Day</b> ex and incl VAT. Beneath them, every team leader gets their projection exactly as specified — <b>average GWP per day × remaining dialing days</b> — with the cycle total alongside. Cycle start, dialing days, the campaign targets and the VAT rate all live in Dictionary → Rules; the panels use the whole cycle window regardless of the date filter, and unattributed GWP is banner-flagged rather than guessed into a campaign.</p>

<h2>Workforce movement: WoW, MoM and attrition — company, team, campaign</h2>
<p>Under the overall view, the Workforce tab now tracks <b>movement</b>. The company card compares <b>this week vs last week</b> and <b>this month vs last month</b> for attendance %, unplanned absence %, present person-days and <b>attrition</b> — the Terminated / Resigned records the rates deliberately exclude, finally counted in their own right. Below it, two separate tables give the same movement <b>split by Team</b> (Reports To) and <b>split by Campaign</b> (each person&#39;s roster queue via the CB number): people, the attendance pill for the selected window, Att WoW Δ and MoM Δ in percentage points, and attrition shown as this-vs-last with a delta pill where fewer exits is green. The WoW/MoM windows anchor to the latest day in the data — calendar weeks Monday-start and calendar months — so they stay meaningful whatever the date filter says; the roster filters (team, tenure, campaign, department, agent) apply throughout.</p>

<h2>QA by agent: sales ratio, partner escalations, disputes</h2>
<p>The QA &amp; Compliance agent table carries three further columns. <b>% sales / QA&#39;d</b> follows the specified formula — Total Sales ÷ QA&#39;d calls for the window (sales counted once per account, exactly like everywhere else). <b>Partner esc.</b> counts evaluations carrying an SM Escalation Reason; the field exists in the export but is blank so far, so the column reads 0 until QA starts using it — no re-upload needed then, it just appears. <b>Disputed</b> counts evaluations whose Status sits in the <i>QA dispute statuses</i> rule — closed_retracted (challenged and overturned) plus qa_review (challenge in progress) by default, with closed_mitigated deliberately excluded as the normal terminal state; Jared can redraw that line in Dictionary → Rules and the column recounts instantly.</p>

<h2>The Team Leader View — the TL report, live (NBA v3.0)</h2>
<p>The Team Leader View reproduces the monthly TL report from live data: the executive strip (Total GWP, sales, avg GWP/sale vs the R99 line, both-checks pass rate, P1 count, fleet attempts/lead), the <b>leaderboard</b> ranked by Total GWP with tenure mix and P1/P2 counts, the <b>Dual-Check fleet analysis</b> and NBA rule distribution, and — per team, switchable by chips — the KPI strip, agent composite bars coloured by NBA level, WHAT NEEDS ACTION grouped exactly like the report (P1 list, R2A-3 / R2A-2 / R2A-1 tiers, the R8 talk-time note with No-Answer share), WHAT IS WORKING, and the full <b>coaching table</b>: Comp and Adj, both checks, Vol%, QA, Conv, Att/Ld, Talk, CF·CFR, Canc%, OnTgt and the surfaced NBA action. Below sit the four watch lists (value, critical-fail tiers, cancellations over 10%, on-target) and the methodology note. v3.0 upgrades apply everywhere including the Agent Card: <b>graduated critical-fail tiers</b> (R2A-3 ≥4 fails or CFR≥30%, −10; R2A-2, −5; R2A-1 a logged note, −2, never the surfaced rule) with the penalty capped; <b>QA weighted with critical-fail calls scored zero</b>; <b>Att/Lead</b> = dials ÷ unique leads as a 3–5-band diagnostic; and the <b>period GWP target</b> = R99 × daily target × working days. Every threshold is editable in the NBA rules.</p>

<h2>QA Agent Performance — scoring the scorers</h2>
<p>The QA team gets its own tab: every assessor by name with the <b>evaluations they completed</b>, the <b>talk time they actually listened to</b> (summed from each evaluation&#39;s Call Duration), and how they classified what they heard — <b>Critical fails</b> and <b>Coaching</b> as asked, plus Pass, Critical % and the average score they gave, because the point of the view is calibration: two assessors covering the same period should not be a world apart on Critical % or average score. Classification follows the live decision rules, and every global filter applies, so &quot;how tough is QA on this team leader&#39;s calls&quot; is one filter away.</p>

<h2>The Agent Card and the Next Best Action</h2>
<p>Click any agent name — on the Scorecard, Lead Management, the QA table, the discipline register or the case pivots — and their card opens: composite score and rank within their tenure group, the six headline tiles with PASS / WATCH / FAIL, the Two-Check banner (Check 1 Value ≥ R99, Check 2 Volume vs target), the call-cycle bar from the live band rule, the metric snapshot, a peer comparison, and <b>one primary Next Best Action</b> chosen by the decision ladder — R1 Zero Attendance down to R10 Strong/Elite, most serious first, exactly as the NBA explainer prescribes. Every number that drives it is a rule: <b>NBA &amp; scoring thresholds</b> holds the QA lines, attendance lines, the R99 value floor, the volume bands, conversion and talk targets and the critical-fail penalty; <b>Composite score weights</b> holds the 25/20/20/15/10/5/5 build. Change either and every card, rank and action rescores instantly. The card ignores the four roster filters (an agent&#39;s card is always their whole picture) but honours the date range.</p>

<h2>Lead Management — the daily lead report, live</h2>
<p>The Lead Management tab reproduces the manual lead report from its five sources: the Agent List as the row spine, open cases spread across the attempt statuses, closed cases split into <b>Closed</b> and <b>Closed - No feedback</b>, activations as Sales and the inactive file as Cancelled. Total Leads = Total Open + Total Closed. <b>Wasted</b> is Total Closed minus Sales; the per-day averages and <b>Payroll SPD</b> divide by working days in the selected window, while <b>Dialing SPD</b> divides by the days the agent actually dialled. Conversion is Sales over Total Closed (and over Wasted), and Canc to Sales % reads cancellations against sales. Above the funnel, the <b>Daily lead movement</b> table tracks the day-by-day pulse: leads assigned (cases counted by the day they were opened), closed by close date, sales by contract create date, the present-agent headcount, and the two per-head rates — SPD and Closure p/day — with weekly subtotal rows and a period total. Every global filter applies — team leader, tenure, campaign, department, agent and the date range — and cases that map to no roster agent are excluded here but named in the banner, never silently lost.</p>

<h2>Targets, referrals and the achievement columns</h2>
<p>The Scorecard now reads each agent&#39;s <b>Sales target</b> straight from the daily Agent List and derives the <b>GWP target</b> as target × the multiplier rule (R89 by default — Dictionary → Rules → GWP target multiplier). <b>% Sales target</b> is unique-account sales over target; <b>% GWP target</b> is attributed GWP over the derived target; both wear achievement pills (green at 100%+, amber from 75%). Talk time shows in <b>minutes</b>. <b>Referrals</b> now reads the real contact export: each row&#39;s <i>Referral Details</i> note carries an <code>Agent:</code> line that is extracted and matched to the Agent List by name (the <code>Submitted:</code> line dates it, Created as fallback; one row = one referral). Matched counts land on the Scorecard and the Agent Card; names that match no one on the list are counted in a red note on the Scorecard. The earlier simple format still loads as a fallback. Team-leader rollups aggregate targets and referrals the same way. And the <b>Custom range</b> in the date selector is fully wired: pick From and To and every page, tile and table re-windows to exactly those days.</p>

<h2>Session Uploads & the Session Dashboard — the intraday pulse</h2>
<p>Fifteen slots in <b>Session Uploads</b> — and only there; the main Upload Center stays the daily sources — — dialler, open cases and activated sales at <b>08:00, 10:00, 12:00, 15:00 and 16:30</b> — take the exact same exports you already pull, just more often. Each slot holds one file and is replaced on re-upload. The <b>Session Dashboard</b> reads them two ways: a statistics table per session (calls and unique calls from the dialler file; sales counted once per account from the activated file with the <b>GWP beside them</b> — each account carrying its highest mapped premium, the daily money rule; an upload-time stamp per row), . The page is <b>agent-level first</b>: a per-agent table (calls, unique calls, sales) for any picked session, joined through the base table exactly like the daily side — dialler by alias or embedded CB, activated sales through the Voice Log Case chain. The <b>Team leader, Tenure, Campaign and Department filters apply</b> (department resolves through each CB&#39;s latest attendance record); only the date range is ignored, because a snapshot is its own moment. And session data never leaks into the daily analytics, the Scorecard or any KPI tile.</p>

<h2>Global filters: tenure, team leader, campaign — everywhere</h2>
<p>The filter panel now carries <b>Tenure</b> alongside Team leader, Campaign, Agent and Department, and the first three reach <i>every</i> tab through the base table: any row on any source resolves to its CB number — attendance by employee code, QA by Sales Agent CB, the dialler by the Call x alias or embedded code, Salesforce by the cleaned Case Owner, activations through the Voice Log Case chain — and then filters on the roster's tenure, team leader or campaign. Where a source carries its own field (a call's Campaign, an attendance row's Reports To) that field still wins; where it does not, the roster answers. Set "Tenure: New" and the Executive nutshell, GWP, cancellations, discipline register and scorecard all narrow to the new intake — one selection, nine sources. The date range lives in the topbar beside the Filters button — presets plus a fully wired Custom From→To.</p>

<h2>Attendance: live rules and the distribution view</h2>
<p>Attendance joins on the <b>CB number</b>, normalised like everywhere else. Every row carries date, employee type, department and status — and the status <b>classification is live</b>: Present (P, T, L, half-days), authorised Leave (AL, SL, CA, CASAT), roster-exit rows (Terminated, Resigned) excluded from the maths entirely, and anything in no rule counted as unplanned absence (UCA today). Move a code between rules and every rate, tile and table reclassifies instantly — no re-upload. The <b>status distribution</b> card splits every status count by <b>Reporting line, Department, Tenure or Employee type</b> (tenure joins from the daily Agent List), with a Present % per row that ignores exit rows. That is the view for "whose people are actually on the floor" — by team, by department, or by how long they have been here.</p>

<h2>QA: decisions, categories and the two-level view</h2>
<p>The QA export joins on <b>Sales Agent CB</b> with the dash normalised away (CB-97 = CB97); a blank code falls back to the agent name against the roster. The three numbers that matter per agent — <b>average Score</b>, the <b>count of each Escalation Decision</b> (Pass / Coaching / Critical Fail), and <b>total calls QA&#39;d</b> — live in the "QA by agent" table. Below it, the coaching and critical-fail <b>categories nest their sub-categories</b>, with share bars, at business level; set the Agent filter in the top bar and the same tables become that agent&#39;s personal breakdown. What counts as Pass, Coaching or Critical is a rule, not code — if QA renames a decision, update it once in Interpretation rules.</p>

<h2>Closed cases: throughput and the feedback split</h2>
<p>Closed cases are treated exactly like open ones: the <b>Case Owner</b> suffix is cleaned and the name matched to the roster's Sales Force column. <b>Total Closed Cases</b> is the throughput tile; the split that matters — <b>Closed</b> versus <b>Closed - No feedback</b> — has its own rate tile, a status-mix chart, and a per-agent table showing each agent's count per closure status. High no-feedback closing is wasted lead spend; read it next to the open-case attempt pivot to see whether leads die worked or unworked. The Scorecard carries a Closed column per agent, windowed like everything else by the close date.</p>

<h2>Call records: bands, unique calls and the Agent↔Call x join</h2>
<p>CallX rows join the roster on the <b>Agent</b> string versus the list's <b>Call x</b> alias — and when the alias drifts ("Nqobile Nxumalo - CB221"), the CB code inside the string is extracted and matched instead, so formatting quirks never orphan an agent's calls. Every call gets a <b>call type band</b> from its Billable Seconds: under 30 is No Answer, 30–179 Customer Service, 180–359 Pitch, 360+ Closing — and these boundaries are a live rule (Dictionary → Rules → Call type bands), not code. <b>Unique Calls</b> counts distinct destinations, excluding inbound queue legs (destination "s"). Answer Rate follows the band rule: a call answers when it clears the No Answer boundary. The per-agent pivot on the Sales page shows each agent's counts per band, total, unique and talk time.</p>

<h2>GWP, the Agent List and cancellations</h2>
<p>Three uploads turn activity into money. The <b>GWP table</b> prices Bundled Products on a <b>1-sale-1-premium</b> basis: a sale counts once per account number and carries a single premium — the highest-value mapped product on the account. The <b>Agent List is the base of the whole system</b>: one row per agent with CB code, name, team leader, tenure, dialler alias and Salesforce name (codes normalised, CB15 = CB-15). The Scorecard starts from this roster and joins calls, talk time, attendance, QA and sales onto it — an agent with activity but missing from the list is flagged, not invented. Per-agent sale attribution runs activation → Voice Log Case → case owner → Agent List. The <b>Cancellations file</b> counts cancelled accounts <b>windowed by Contract Create Date</b> — cancellations report against when the sale was made — with GWP Lost priced the same way and shown separately, never netted off. Unmapped products or unattributable sales are always flagged; nothing silently prices at zero.</p>

<h2>Agent mapping</h2>
<p>The dialler knows agents by display name; QA and attendance know them by CB code. Dictionary → <b>Agent mapping</b> is the bridge. Names are auto-matched where they match attendance exactly; map the rest by hand once and the Scorecard's calls-per-day column lights up. Never trust a name-only join — codes or nothing.</p>

<h2>Privacy (POPIA)</h2>
<p>PII masking is on by default: names become initials, numbers and emails are partially hidden. The toggle in the footer is for authorised eyes doing casework — turn it back on before screen-sharing. Customer contact details are never needed for any KPI on these pages.</p>

<h2>The Agent OS layer — from numbers to decisions</h2>
<p>The four <b>Agent OS</b> tabs turn this command centre from a reporting tool into a governed system of action, without touching how the dashboards work. The <b>Action Centre</b> re-detects exceptions on every render from the data you already uploaded: any KPI outside its RAG thresholds, stale sources, products missing from the GWP table, unmapped dialler names, cancel-to-sales concentration and cycle pacing. There are no separate thresholds — the Dictionary is the brain, so tightening a threshold there makes the detectors more sensitive everywhere at once. Each case carries its evidence (value, trend, contributors — masked under POPIA), the KPI&#39;s own &quot;if red&quot; playbook as the recommended action, and decision buttons: approve, route to the owner, snooze, or dismiss with a reason. Approve an action and its baseline is stored — the case then re-measures itself against every new upload and tells you whether the number actually moved.</p>
<p>The <b>AI Workforce</b> page names the six bounded jobs that watch your data (plus the Platform Watchdog). Every one runs at <b>Recommend or below</b> — this platform has no write-back into Salesforce or CallX, so Execute is a roadmap state that unlocks per workflow only after API integration, tested limits and a rollback path. <b>Approvals</b> holds routed cases and — when <b>Governed changes</b> is on in Governance — threshold and rule edits, which apply only once the owning executive approves (QA rules → Jared, people rules → Claudell, money rules → Mekaeel, platform → Ryan). <b>Governance &amp; Audit</b> carries the decision-rights matrix, the proposed access model, and the activity log: every decision, approval, configuration change and export, with actor and timestamp. Decisions persist across sessions; detections never do — they are always recomputed from current data, so the Action Centre can never show a stale opinion.</p>
<p>Two additions from the Copilot specification and the raw sample pack: the <b>Power BI · Active Services</b> slot is now the primary money source when loaded — GWP becomes the sum of each account&#39;s Charge Amounts grossed up by the VAT rule (charges arrive ex-VAT), windowed by Contract Create Date and attributed by Owner; the legacy GWP-table model applies automatically whenever the slot is empty, and the 45-column BI Inactive export loads into the existing Cancellations slot with charge-based pricing. And <b>Governance → Open inputs</b> is the register of known unknowns — SPD definitions, per-tenure targets, the clean-sale call-ID mapping, the disciplinary ladder and the rest — each with a named owner and the platform where the answer lives. The <b>Copilot brief</b> button (Executive page and AI Workforce) writes the morning one-pager from the same numbers.</p>
<h2>If something looks wrong</h2>
<p>Work the chain in order: <b>Trust bar</b> (is the source fresh?) → <b>Upload audit</b> (did the batch load with warnings?) → <b>Exceptions</b> (what got rejected and why?) → <b>Rules</b> (does "pass"/"present" mean what you think?) → then, and only then, question the floor. Nine times out of ten the answer is in the first two steps.</p>`;
