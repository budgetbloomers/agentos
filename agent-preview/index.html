/* ---------------- detection (all real, all guarded) ---------------- */
AOS.detect=function(win){
 const out=[];if(!hasData())return out;
 const T=f=>{try{f()}catch(e){}};
 /* 1 · KPI threshold breaches — the dictionary is the brain */
 T(()=>{state.kpis.filter(k=>k.show&&k.green!=null).forEach(k=>{
   const v=evalKPI(k,win);const rag=ragOf(k,v);
   if(rag!=='r'&&rag!=='a')return;
   out.push({key:'k:'+k.id+':'+state.range.mode,sev:rag,cat:'KPI breach',kpi:k,src:k.src,val:v,fmt:k.format,
     ai:AOS_DOM_AI[k.domain]||'revenue',owner:k.owner||aosExcoFor(k),
     title:k.name+' — '+fmtVal(v,k.format),sub:aosTargetLbl(k)+' · '+k.domain,
     vRisk:(k.id==='gwp_lost'?fmtVal(v,'zar')+' premium lost':k.format==='zar'?fmtVal(v,'zar'):'—'),
     rec:k.red||'Investigate with the metric owner.'});});});
 /* 2 · stale / missing sources */
 T(()=>{SRC_KEYS.forEach(s=>{const f=freshness(s);if(f.state!=='a'&&f.state!=='r')return;
   out.push({key:'stale:'+s,sev:f.state,cat:'Data health',src:s,ai:'platform',owner:'Ryan',
     title:SOURCES[s].label+' — '+(f.label||'stale'),sub:'Every KPI reading this source is running on old data',
     vRisk:'Trust — '+(f.days!=null?f.days+' days old':'never uploaded'),
     rec:'Upload the latest export in the Upload Center. The trust bar and this case clear the moment a valid batch lands.'});});});
 /* 3 · pricing integrity — BI zero-charge rows (primary) or unmapped GWP products (legacy) */
 T(()=>{if(!biMode())return;const z=rowsFor('BI_ACTIVE',win).filter(r=>r.active_flag===1&&!(r.charge_amount>0));
   if(!z.length)return;const accs=new Set(z.map(r=>r.account_number));
   out.push({key:'bizero:'+state.range.mode,sev:'a',cat:'Pricing integrity',ai:'finance',owner:'Mekaeel',src:'BI_ACTIVE',
     title:z.length+' active BI row'+(z.length>1?'s':'')+' carry a zero or blank Charge Amount',
     sub:accs.size+' account'+(accs.size>1?'s':'')+' affected — they under-state GWP and are flagged, never hidden',
     vRisk:'GWP under-statement',
     rec:'Check the Power BI export for missing Charge Amounts on these accounts, or confirm the rows are genuinely non-billing (e.g. hardware lines). Ryan owns the export; Mekaeel owns the money rule.'});});
 T(()=>{if(biMode())return;const gm=gwpMap();if(!Object.keys(gm).length)return;const miss={};
   saleRows(win).forEach(r=>{const p=String(r.bundled_product||'').trim();if(p&&gwpOf(gm,p)==null)miss[p]=(miss[p]||0)+1});
   const n=Object.keys(miss).length;if(!n)return;
   out.push({key:'gwpmap:'+state.range.mode,sev:'a',cat:'Pricing integrity',ai:'finance',owner:'Mekaeel',src:'GWP_TABLE',
     title:n+' bundled product'+(n>1?'s':'')+' missing from the GWP table',
     sub:'Affected sales price at R0 and are flagged, never silently counted',
     vRisk:Object.values(miss).reduce((a,b)=>a+b,0)+' service rows unpriced',
     rec:'Add the missing products in Dictionary → Mappings (GWP table upload). Until then Total GWP understates the floor.',
     listT:'Unmapped products',list:Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>[e[0],e[1]+' rows'])});});
 /* 4 · unmapped dialler agents (identity coverage) */
 T(()=>{const rows=rowsFor('CALLX_CALL_RECORDS',win);if(!rows.length)return;const miss={};
   rows.forEach(r=>{if(r.call_type==='inbound')return;if(!cbOf(r.agent)){const n=String(r.agent||'').trim();if(n)miss[n]=(miss[n]||0)+1}});
   const n=Object.keys(miss).length;if(!n)return;
   out.push({key:'idmap:'+state.range.mode,sev:'a',cat:'Identity coverage',ai:'platform',owner:'Ryan',src:'CALLX_CALL_RECORDS',
     title:n+' dialler agent name'+(n>1?'s':'')+' not mapped to a CB code',
     sub:'Their calls are counted in totals but orphaned from the Scorecard and per-agent maths',
     vRisk:Object.values(miss).reduce((a,b)=>a+b,0)+' calls unattributed',
     rec:'Map the names once in Dictionary → Agent mapping — codes or nothing; never trust a name-only join.',
     listT:'Unmapped dialler names',list:Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>[maskName(e[0]),e[1]+' calls'])});});
 /* 5 · cancellation concentration per agent */
 T(()=>{const ok=aosNba('cancelPctOK',10);const sales={},canc={};
   accountPremiums(win).forEach(e=>{if(e.cb)sales[e.cb]=(sales[e.cb]||0)+1});
   const seen={};cancelRows(win).forEach(r=>{const a=r.account_number;if(!a||seen[a])return;seen[a]=1;if(r._cb)canc[r._cb]=(canc[r._cb]||0)+1});
   const bad=Object.keys(canc).filter(cb=>(sales[cb]||0)>=5&&canc[cb]/sales[cb]*100>ok)
     .map(cb=>({cb,pct:canc[cb]/sales[cb]*100,c:canc[cb],s:sales[cb]})).sort((a,b)=>b.pct-a.pct);
   if(!bad.length)return;
   out.push({key:'cancconc:'+state.range.mode,sev:bad.some(b=>b.pct>ok*2)?'r':'a',cat:'Sales quality',ai:'revenue',owner:'Jared',src:'SF_INACTIVE',
     title:bad.length+' agent'+(bad.length>1?'s':'')+' above the '+ok+'% cancel-to-sales line',
     sub:'Cancellations windowed by contract create date — this reads as sales quality, not churn',
     vRisk:'Concentrated clawback risk',
     rec:'Pull the flagged agents’ cancelled accounts, listen to the closing calls with QA, and coach before the next cycle. GWP Lost prices the damage.',
     listT:'Cancel-to-sales % (min 5 sales)',list:bad.slice(0,6).map(b=>[maskName((state.cbInfo[b.cb]||{}).name||b.cb),b.c+'/'+b.s+' · '+(Math.round(b.pct*10)/10)+'%'])});});
 /* 6 · cycle pacing vs GWP targets (rules-driven) */
 T(()=>{const cs=(state.rules.cycleStart?.vals||[])[0];const tgts=state.rules.cycleTargets?.vals||[];if(!cs||!tgts.length)return;
   const totDays=parseFloat((state.rules.cycleDialingDays?.vals||[])[0])||21;
   const cwin={from:cs,to:isoDay(anchorDate())};
   const elapsed=Math.min(workDays(cwin),totDays);if(elapsed<3)return;
   const prem=accountPremiums(cwin);
   tgts.forEach(tv=>{const i=String(tv).lastIndexOf(':');const name=String(tv).slice(0,i).trim(),target=parseFloat(String(tv).slice(i+1));if(!name||!target)return;
     const got=prem.filter(e=>{const inf=e.cb?state.cbInfo[e.cb]:null;return inf&&String(inf.queue||'').toLowerCase().includes(name.toLowerCase())})
       .reduce((s,e)=>s+(e.gwp||0),0);
     const expect=target*elapsed/totDays;if(!expect)return;
     const pace=got/expect*100;if(pace>=90)return;
     out.push({key:'cycle:'+name,sev:pace<70?'r':'a',cat:'Cycle pacing',ai:'growth',owner:'Jared',src:'SF_ACTIVATED_SERVICES',
       title:name+' cycle at '+Math.round(pace)+'% of pace — '+fmtVal(got,'zar')+' vs '+fmtVal(expect,'zar')+' expected',
       sub:'Day '+Math.round(elapsed)+' of '+totDays+' dialing days · target '+fmtVal(target,'zar')+' (Dictionary → Rules → Cycle targets)',
       vRisk:fmtVal(Math.max(0,expect-got),'zar')+' behind pace',
       rec:'Rebalance dialling hours toward '+name+', check the campaign’s answer rate and lead depth, and review agent allocation with the TLs before the cycle closes.'});});});
 out.sort((a,b)=>(a.sev==='r'?0:1)-(b.sev==='r'?0:1));
 return out;
};
/* contributors — who is driving a KPI breach (masked) */
AOS.contrib=function(k,win){
 try{
  const NAME={QA_EVALUATIONS:r=>r.sales_agent,ATTENDANCE:r=>r.employee_name,CALLX_CALL_RECORDS:r=>r.agent,
    SF_OPEN_CASES:r=>r.case_owner,SF_CLOSED_CASES:r=>r.case_owner,SF_INACTIVE:r=>r.owner}[k.src];
  if(!NAME)return null;
  const rows=rowsFor(k.src,win);let bad=null,tot=rows.length;
  if(k.type==='ratio'){const den=k.den?rows.filter(r=>passFilter(r,k.den)):rows;tot=den.length;
    bad=k.dir==='higher'?den.filter(r=>!passFilter(r,k.num)):den.filter(r=>passFilter(r,k.num));}
  else if(k.dir==='lower'&&(k.type==='count'||k.type==='distinct')){bad=k.num?rows.filter(r=>passFilter(r,k.num)):rows.slice();}
  if(!bad||!bad.length)return null;
  const m={};bad.forEach(r=>{const n=NAME(r)||'(unattributed)';m[n]=(m[n]||0)+1});
  return{list:Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6),badN:bad.length,tot};
 }catch(e){return null}
};

AOS.decide=function(key,mode,note){
 const c=AOS.cur[key];if(!c)return;
 const win=periodWindow();
 if(mode==='snooze'){AOS.s.snooze[key]=win.to;AOS.log('decision',c.title,'Snoozed until '+win.to);AOS.save();closeModal();render();toast('Snoozed — returns after '+win.to);return}
 if(mode==='routed'){
  const id='AP-'+(AOS.s.seq++);
  AOS.s.approvals.unshift({id,kind:'case',caseKey:key,title:c.title,detail:'Recommended: '+c.rec,owner:c.owner,risk:c.sev==='r'?'High':'Medium',by:AOS.s.actor,at:AOS.now(),status:'pending'});
  AOS.s.decisions[key]={status:'routed',actor:AOS.s.actor,at:AOS.now(),owner:c.owner,title:c.title};
  AOS.log('decision',c.title,'Routed for approval to '+c.owner+' ('+id+')');AOS.save();closeModal();render();toast('Routed to '+c.owner+' — pending in Approvals');return}
 const base=c.kpi?{v:c.val,fmt:c.fmt,at:AOS.now()}:null;
 AOS.s.decisions[key]={status:mode,actor:AOS.s.actor,at:AOS.now(),owner:c.owner,title:c.title,note:note||'',action:mode==='actioned'?c.rec:'',baseline:mode==='actioned'?base:null};
 AOS.log('decision',c.title,(mode==='actioned'?'Approved recommended action: '+c.rec:'Dismissed'+(note?' — '+note:'')));
 AOS.save();closeModal();render();
 toast(mode==='actioned'?'Action approved and logged — outcome will be re-measured against new data':'Dismissed with reason — logged','ok');
};
AOS.brief=function(){
 try{
  if(!hasData()){toast('Upload data (or load demo) first — the brief only speaks from files','err');return}
  const win=periodWindow();const anchor=isoDay(anchorDate());
  const cases=AOS.detect(win);AOS.cur={};cases.forEach(c=>AOS.cur[c.key]=c);
  const open=cases.filter(c=>{const d=AOS.s.decisions[c.key];return !(d&&d.status!=='routed')&&!(AOS.s.snooze[c.key]>=anchor)});
  let cyc='';
  try{const cs=(state.rules.cycleStart?.vals||[])[0];const tgts=state.rules.cycleTargets?.vals||[];
   if(cs&&tgts.length){const totDays=parseFloat((state.rules.cycleDialingDays?.vals||[])[0])||21;
    const cwin={from:cs,to:anchor};const elapsed=Math.min(workDays(cwin),totDays);const rem=Math.max(1,totDays-elapsed);
    const prem=accountPremiums(cwin);
    cyc=tgts.map(tv=>{const i=String(tv).lastIndexOf(':');const name=String(tv).slice(0,i).trim(),target=parseFloat(String(tv).slice(i+1));if(!name||!target)return '';
      const got=prem.filter(e=>{const inf=e.cb?state.cbInfo[e.cb]:null;return inf&&String(inf.queue||'').toLowerCase().includes(name.toLowerCase())}).reduce((x,e)=>x+(e.gwp||0),0);

  }catch(e){}
  let move='';
  try{const days=[...new Set((state.facts.CALLX_CALL_RECORDS||[]).map(r=>r._d).filter(Boolean))].sort();
   const last=days[days.length-1];
   if(last){const dwin={from:last,to:last};

    const closed=rowsFor('SF_CLOSED_CASES',dwin).length;
    move='<div style="font-size:12.5px;line-height:1.7">Latest dialling day <b>'+esc(last)+'</b>: <b>'+calls.toLocaleString()+'</b> calls · <b>'+sales.toLocaleString()+'</b> sales ('+(biMode()?'BI charges':'legacy pricing')+') · <b>'+closed.toLocaleString()+'</b> cases closed.</div>';}
  }catch(e){}
  let att='';
  try{const k=state.kpis.find(x=>x.id==='attendance_rate');if(k){const v=evalKPI(k,win),pv=evalKPI(k,prevWindow(win));
   if(v!=null)att='<div style="font-size:12.5px;line-height:1.7">Attendance <b>'+fmtVal(v,'pct')+'</b> this window'+(pv!=null?' vs '+fmtVal(pv,'pct')+' previous ('+((v-pv)>=0?'+':'')+(Math.round((v-pv)*10)/10)+'pp)':'')+' · unplanned absence '+(function(){const a=state.kpis.find(x=>x.id==='absenteeism');const av=a?evalKPI(a,win):null;return av==null?'—':fmtVal(av,'pct')})()+'.</div>';}
  }catch(e){}
  const watch=open.slice(0,3).map(c=>'<div style="display:flex;gap:8px;align-items:center;padding:5px 0;font-size:12.5px"><span class="aos-sev '+c.sev+'" style="min-height:16px"></span><b style="flex:1;min-width:0">'+esc(c.title)+'</b><span style="color:var(--muted);white-space:nowrap">'+esc(c.owner)+'</span></div>').join('')||'<div style="font-size:12.5px;color:var(--muted)">Nothing on the watch list — all governed KPIs inside thresholds.</div>';
  const acts=open.slice(0,3).map((c,i)=>'<div style="font-size:12.5px;line-height:1.6;padding:4px 0"><b>'+(i+1)+'.</b> '+esc(c.rec)+' <span style="color:var(--muted)">('+esc(c.owner)+')</span></div>').join('')||'<div style="font-size:12.5px;color:var(--muted)">No actions required today.</div>';
  modal('<div class="modal-h"><span class="t">Copilot daily brief — '+esc(anchor)+'</span><button class="modal-x" onclick="closeModal()">✕</button></div>'
   +'<div class="vh"><span class="chip n">Window '+win.from+' → '+win.to+'</span><span class="chip n">Filters: '+(Object.values(state.filters).some(v=>v)?'active':'none')+'</span><span class="chip '+(biMode()?'g':'n')+'"><span class="dot"></span>Money: '+(biMode()?'BI primary (charges ×VAT)':'legacy GWP table')+'</span><span class="pill v">EVERY NUMBER: FILE + WINDOW + FILTERS</span></div>'
   +(cyc?'<div class="ac-sec">CYCLE PACING — RULES → CYCLE TARGETS</div>'+cyc:'')
   +(move?'<div class="ac-sec" style="margin-top:12px">LATEST MOVEMENT</div>'+move:'')
   +(att?'<div class="ac-sec" style="margin-top:12px">PEOPLE</div>'+att:'')

   +'<div class="ac-sec" style="margin-top:12px">TOP ACTIONS</div>'+acts
   +'<div style="font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5">Generated by the in-app Copilot from the same facts, Dictionary and rules as every dashboard. Open cases carry the full evidence in the Action Centre.</div>'
   +'<div class="modal-foot"><button class="btn" onclick="go(\'actions\');closeModal()">Action Centre</button><button class="btn primary" onclick="closeModal()">Close</button></div>');

AOS.workOf=function(a,win){
 const L=[];const T=f=>{try{f()}catch(e){}};
 T(()=>{if(a.id==='revenue'){const calls=rowsFor('CALLX_CALL_RECORDS',win);const outb=calls.filter(r=>r.call_type!=='inbound').length;
  L.push('Read '+calls.length.toLocaleString()+' call records ('+outb.toLocaleString()+' outbound) and banded every one by billable seconds — bands are Rules, not code.');
  const acts=accountPremiums(win).length;if(acts)L.push('Attributed '+acts.toLocaleString()+' unique activated accounts to agents via the Voice Log Case → owner → roster chain.');
  const oc=rowsFor('SF_OPEN_CASES',win).length;if(oc)L.push('Watching '+oc.toLocaleString()+' open cases for ageing and owner workload.');}});
 T(()=>{if(a.id==='quality'){const ev=rowsFor('QA_EVALUATIONS',win);const cr=ev.filter(r=>resolveRule('$qaCritical').includes(r.escalation_decision)).length;const co=ev.filter(r=>resolveRule('$qaCoaching').includes(r.escalation_decision)).length;
  L.push('Screened '+ev.length.toLocaleString()+' QA evaluations against the editable decision rules.');
  if(cr)L.push('Flagged '+cr+' critical fails and '+co+' coaching triggers for the queue on the QA page.');
  const k=state.kpis.find(x=>x.id==='unverified_sales');if(k){const u=evalKPI(k,win);if(u)L.push('Counted '+Math.round(u)+' activations that no QA evaluation covers — sample before month-end sign-off.')}}});
 T(()=>{if(a.id==='workforce'){const at=rowsFor('ATTENDANCE',win);const pres=at.filter(r=>r.present_flag===1).length;const abs=at.filter(r=>r.absence_flag===1).length;
  L.push('Classified '+at.length.toLocaleString()+' attendance rows through the live code rules — '+pres.toLocaleString()+' present days, '+abs.toLocaleString()+' unplanned absences.');
  L.push('Supplied the present-day denominator to every productivity KPI (calls/day, activations/day).');}});
 T(()=>{if(a.id==='risk'){const ev=rowsFor('QA_EVALUATIONS',win);const open=ev.filter(r=>(parseNum(r.offense_number)||0)>=1&&!/closed/i.test(r.qa_status||'')).length;

  L.push('Tracking '+open+' open offenses on the stage ladder (ladder is a Rule pending HR confirmation).');

 T(()=>{if(a.id==='growth'){const refs=rowsFor('REFERRALS',win).length;if(refs)L.push('Matched '+refs.toLocaleString()+' referral rows to the roster by the Agent: line inside Referral Details.');
  const tg=(state.rules.cycleTargets?.vals||[]).length;if(tg)L.push('Pacing '+tg+' campaign cycle target'+(tg>1?'s':'')+' against pro-rata GWP (Rules → Cycle targets).');
  L.push('Source Quality view stays SOON until recruitment source data lands — no invented numbers.');}});
 T(()=>{if(a.id==='finance'){const prem=accountPremiums(win);const tot=prem.reduce((s,e)=>s+(e.gwp||0),0);const un=prem.filter(e=>e.gwp==null).length;
  if(prem.length)L.push('Priced '+prem.length.toLocaleString()+' unique sales on the 1-sale-1-premium basis — '+fmtVal(tot,'zar')+' total GWP.');
  if(un)L.push('Flagged '+un+' sales whose products are missing from the GWP table — they price at R0 and are never hidden.');
  const k=state.kpis.find(x=>x.id==='gwp_lost');if(k){const l=evalKPI(k,win);if(l)L.push('Priced '+fmtVal(l,'zar')+' of premium lost to cancellations, windowed by contract create date.')}}});
 T(()=>{if(a.id==='platform'){const fresh=SRC_KEYS.filter(s=>freshness(s).state==='g').length;
  L.push(fresh+' of '+SRC_KEYS.length+' sources fresh; '+state.batches.length+' batches in the upload audit; '+state.exceptions.length+' rejected rows quarantined with reasons.');
  L.push('Roadmap: replace manual exports with API feeds (Salesforce, CallX) so Execute mode has something safe to write back to.');}});
 return L.length?L:['No rows in the current window for this specialist’s sources.'];
};

AOS.decideAp=function(id,verdict){
 const a=AOS.s.approvals.find(x=>x.id===id);if(!a||a.status!=='pending')return;
 if(!AOS.canDecide(a)){toast('Only '+a.owner+' or EXCO can decide this item','err');return}
 a.status=verdict;a.decidedBy=AOS.s.actor;a.decidedAt=AOS.now();
 if(a.kind==='change'&&verdict==='approved'&&a.payload){try{AOS.exec[a.payload.fn].apply(null,a.payload.args)}catch(e){}}
 if(a.kind==='case'&&a.caseKey){
  if(verdict==='approved'){const c=AOS.cur[a.caseKey];AOS.s.decisions[a.caseKey]={status:'actioned',actor:AOS.s.actor,at:AOS.now(),owner:a.owner,title:a.title,action:a.detail,baseline:c&&c.kpi?{v:c.val,fmt:c.fmt,at:AOS.now()}:null}}
  else AOS.s.decisions[a.caseKey]={status:'dismissed',actor:AOS.s.actor,at:AOS.now(),owner:a.owner,title:a.title,note:'Rejected at approval'};
 }
 AOS.log('approval',a.title,(verdict==='approved'?'Approved':'Rejected')+' by '+AOS.s.actor+(a.kind==='change'?' — change '+(verdict==='approved'?'applied':'not applied'):''));
 AOS.save();closeModal();render();
 toast((verdict==='approved'?'Approved':'Rejected')+' — '+a.title,verdict==='approved'?'ok':'err');
};

  due_block_mins:90,
  clearing_sessions:3,
  coach_min_movement:0.05,
  flat_results_before_rediagnose:1,
  session_start:'08:00',
  session_end:'16:30'
};
AP.RB=Object.assign({},AP.RB_DEFAULT);
AP.rb=function(k){const v=AP.RB[k];return (v==null||v==='')?AP.RB_DEFAULT[k]:v};

/* severity multipliers — which gap wins when several are open */
AP.SEV_W_DEFAULT={qa:1.9,clean:1.9,compEx:2.2,present:1.7,conv:1.35,adher:1.15};
AP.SEV_W=Object.assign({},AP.SEV_W_DEFAULT);

/* the priority of each trigger on the team-leader ladder */
AP.TRIG_DEFAULT={support_waiting:100,awaiting_confirm:70,finished_unmeasured:65,
  action_overdue:60,no_change_after_support:55,no_action_set:40,due_soon:25,below_target:15,on_target:0};
AP.TRIG=Object.assign({},AP.TRIG_DEFAULT);
AP.TRIG_ON={};                       /* trigger_id -> false when switched off */
AP.trig=function(k){const v=AP.TRIG[k];return v==null?AP.TRIG_DEFAULT[k]:v};
AP.trigOn=function(k){return AP.TRIG_ON[k]!==false};

/* =====================================================================
   THE WORKBOOK CONTRACT
   Tab names and column names are the interface. Change a value, not a name.
   ===================================================================== */
AP.RB_SCHEMA={
 DRIVERS:{key:'driver_key',
   cols:['driver_key','driver_label','weight','target_field','plain_english','enabled'],
   req:['driver_key','driver_label','weight']},
 CAMPAIGNS:{key:'campaign_id',
   cols:['campaign_id','campaign_name','active','daily_target','conv_target','closure_target',
         'quality_target','talk_target','min_qa','min_clean','qualifying_definition','session_start','session_end'],
   req:['campaign_id','campaign_name','daily_target']},
 COMMISSION_TIERS:{key:null,
   cols:['campaign_id','tier','from_sales','rand_per_sale'],
   req:['campaign_id','tier','from_sales','rand_per_sale']},
 BANDS:{key:'band_label',cols:['band_label','min_score'],req:['band_label','min_score']},
 SEVERITY:{key:'metric_key',cols:['metric_key','metric_label','severity_weight'],
   req:['metric_key','severity_weight']},
 TRIGGERS:{key:'trigger_id',
   cols:['trigger_id','priority','condition','headline','next_step','button_label','enabled'],
   req:['trigger_id','priority']},
 CAUSES:{key:'cause_key',cols:['cause_key','cause_label','routes_to','alt_cause'],
   req:['cause_key','cause_label','routes_to']},
 ACTIONS:{key:'action_id',
   cols:['action_id','cause_key','driver_key','title','instruction','minutes','needs_coaching','needs_resource','enabled'],
   req:['action_id','cause_key','title','instruction']},
 THRESHOLDS:{key:'setting_key',cols:['setting_key','value','unit','description'],
   req:['setting_key','value']},
 DATA_INPUTS:{key:'field_key',
   cols:['field_key','description','source','required_by','status','sample'],
   req:['field_key','status']}
};
AP.RB_SHEETS=Object.keys(AP.RB_SCHEMA);

/* ---------------- helpers ---------------- */
AP.rbNorm=function(s){return String(s==null?'':s).trim()};
AP.rbKey=function(s){return AP.rbNorm(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')};
/* Driver keys in the engine are camelCase — gwpSale, targetAch. AP.rbKey
   lowercases, which would quietly detach an uploaded row from the driver it
   names: the row validates, and then nothing moves. Match on letters and digits
   only, and keep the engine's own spelling. */
AP.rbDrvKey=function(s){
  const typed=AP.rbNorm(s);if(!typed)return '';
  const flat=typed.toLowerCase().replace(/[^a-z0-9]+/g,'');
  const pool=[].concat((AP.RATING_DEF||[]).map(function(d){return d.k}),
                       Object.keys(AP.RB_DRV_SEED||{}),
                       (AP.COMPOSITE_DEF||[]).map(function(d){return d.k}));
  for(let i=0;i<pool.length;i++)
    if(String(pool[i]).toLowerCase().replace(/[^a-z0-9]+/g,'')===flat)return pool[i];
  return AP.rbKey(typed);
};
AP.rbNum=function(v){if(v==null||v==='')return null;const n=Number(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:null};
AP.rbBool=function(v,dflt){const s=AP.rbNorm(v).toLowerCase();
  if(s==='')return dflt!==false;
  return ['y','yes','true','1','on','active','enabled'].indexOf(s)>=0};

/* rows[] where rows[0] is the header line -> array of objects keyed by column */
AP.rbRows=function(grid){
  if(!grid||!grid.length)return [];
  const head=grid[0].map(function(h){return AP.rbKey(h)});
  const out=[];
  for(let i=1;i<grid.length;i++){
    const r=grid[i];
    /* Blank lines are skipped, never treated as the end of the table — someone
       adding a row at the bottom must never be silently ignored. A row with an
       empty key fails validation loudly instead. */
    if(!r||!r.some(function(c){return AP.rbNorm(c)!==''}))continue;
    const o={__row:i+1};
    head.forEach(function(h,j){if(h)o[h]=r[j]});
    out.push(o);
  }
  return out;
};

/* =====================================================================
   VALIDATE — every failure names the sheet, the row and what to do
   ===================================================================== */
AP.rbValidate=function(sheets){
  const errs=[],warns=[],counts={};
  const S=function(n){return AP.rbRows(sheets[n]||sheets[n.toLowerCase()]||null)};
  const need=['DRIVERS','CAMPAIGNS','COMMISSION_TIERS','BANDS','CAUSES','ACTIONS','THRESHOLDS'];
  need.forEach(function(n){
    if(!sheets[n])errs.push({sheet:n,row:'',msg:'Tab is missing. The workbook must contain a tab called '+n+'.'});
  });
  if(errs.length)return {ok:false,errs:errs,warns:warns,counts:counts};

  const data={};
  AP.RB_SHEETS.forEach(function(n){
    const rows=S(n);data[n]=rows;counts[n]=rows.length;
    const spec=AP.RB_SCHEMA[n];
    if(!rows.length)return;
    spec.req.forEach(function(c){
      if(!(c in rows[0]))errs.push({sheet:n,row:1,msg:'Column "'+c+'" is missing from the header row.'});
    });
    rows.forEach(function(r){
      spec.req.forEach(function(c){
        if(AP.rbNorm(r[c])==='')errs.push({sheet:n,row:r.__row,msg:'"'+c+'" is empty and is required.'});
      });
    });
    if(spec.key){
      const seen={};
      rows.forEach(function(r){const k=AP.rbKey(r[spec.key]);
        if(!k)return;
        if(seen[k])errs.push({sheet:n,row:r.__row,msg:'"'+r[spec.key]+'" appears twice. Every '+spec.key+' must be unique.'});
        seen[k]=1});
    }
  });

  /* --- drivers --- */
  const drv=data.DRIVERS.filter(function(r){return AP.rbBool(r.enabled,true)});
  const wsum=drv.reduce(function(s,r){return s+(AP.rbNum(r.weight)||0)},0);
  /* The invariant is that the weights total 100 and nothing feeds the score
     from outside this tab — not that there are five of them. NBA v3 uses
     seven. Two is too few to coach against; more than nine cannot be read. */
  if(drv.length<2||drv.length>9)errs.push({sheet:'DRIVERS',row:'',msg:'There must be between 2 and 9 enabled drivers. Found '+drv.length+'.'});
  if(Math.round(wsum)!==100)errs.push({sheet:'DRIVERS',row:'',msg:'Weights must total 100. They total '+wsum+'.'});
  const drvKeys={};drv.forEach(function(r){drvKeys[AP.rbDrvKey(r.driver_key)]=1});
  /* A driver the scorecard has no definition for can be listed and weighted,
     but nothing will ever score it. Say so on upload rather than letting a
     weight sit there doing nothing. */
  drv.forEach(function(r){
    const dk=AP.rbDrvKey(r.driver_key);
    if(dk&&!(AP.COMPOSITE_DEF||[]).some(function(c){return c.k===dk}))
      warns.push({sheet:'DRIVERS',row:r.__row,msg:'"'+AP.rbNorm(r.driver_key)
        +'" is not a metric the scorecard measures, so its weight cannot score anything. Measured drivers: '
        +(AP.COMPOSITE_DEF||[]).map(function(c){return c.k}).join(', ')+'.'});
  });

  /* --- campaigns --- */
  const camps=data.CAMPAIGNS.filter(function(r){return AP.rbBool(r.active,true)});
  if(!camps.length)errs.push({sheet:'CAMPAIGNS',row:'',msg:'At least one campaign must be active.'});
  const campKeys={};
  camps.forEach(function(r){
    campKeys[AP.rbKey(r.campaign_id)]=1;
    [['daily_target',1,100],['conv_target',1,100],['closure_target',1,100],['quality_target',1,100],
     ['talk_target',1,600],['min_qa',0,100],['min_clean',0,100]].forEach(function(t){
      const v=AP.rbNum(r[t[0]]);
      if(v==null)errs.push({sheet:'CAMPAIGNS',row:r.__row,msg:'"'+t[0]+'" must be a number.'});
      else if(v<t[1]||v>t[2])errs.push({sheet:'CAMPAIGNS',row:r.__row,msg:'"'+t[0]+'" is '+v+'. It must be between '+t[1]+' and '+t[2]+'.'});
    });
    const q=AP.rbNum(r.min_qa),c=AP.rbNum(r.min_clean),qt=AP.rbNum(r.quality_target);
    if(q!=null&&qt!=null&&q>100)errs.push({sheet:'CAMPAIGNS',row:r.__row,msg:'min_qa cannot exceed 100.'});
    if(c!=null&&c>100)errs.push({sheet:'CAMPAIGNS',row:r.__row,msg:'min_clean cannot exceed 100.'});
  });

  /* --- tiers --- */
  const byCamp={};
  data.COMMISSION_TIERS.forEach(function(r){
    const ck=AP.rbKey(r.campaign_id);
    if(!campKeys[ck]){errs.push({sheet:'COMMISSION_TIERS',row:r.__row,msg:'campaign_id "'+r.campaign_id+'" is not an active campaign in CAMPAIGNS.'});return}
    const from=AP.rbNum(r.from_sales),rate=AP.rbNum(r.rand_per_sale);
    if(from==null||from<0)errs.push({sheet:'COMMISSION_TIERS',row:r.__row,msg:'from_sales must be zero or more.'});
    if(rate==null||rate<=0)errs.push({sheet:'COMMISSION_TIERS',row:r.__row,msg:'rand_per_sale must be more than zero.'});
    (byCamp[ck]=byCamp[ck]||[]).push({from:from,rate:rate,row:r.__row});
  });
  Object.keys(campKeys).forEach(function(ck){
    const t=byCamp[ck]||[];
    if(!t.length){errs.push({sheet:'COMMISSION_TIERS',row:'',msg:'Campaign "'+ck+'" has no tiers. Every campaign needs at least one.'});return}
    t.sort(function(x,y){return x.from-y.from});
    if(t[0].from!==0)errs.push({sheet:'COMMISSION_TIERS',row:t[0].row,msg:'The first tier for "'+ck+'" must start at 0 sales.'});
    for(let i=1;i<t.length;i++){
      if(t[i].from===t[i-1].from)errs.push({sheet:'COMMISSION_TIERS',row:t[i].row,msg:'Two tiers for "'+ck+'" start at the same number of sales.'});
      if(t[i].rate<t[i-1].rate)warns.push({sheet:'COMMISSION_TIERS',row:t[i].row,msg:'A higher tier pays less per sale than the one below it. Check this is intended.'});
    }
  });

  /* --- bands --- */
  const bands=data.BANDS.map(function(r){return {label:AP.rbNorm(r.band_label),min:AP.rbNum(r.min_score),row:r.__row}})
    .filter(function(b){return b.label});
  if(bands.length<2)errs.push({sheet:'BANDS',row:'',msg:'At least two bands are needed.'});
  bands.forEach(function(b){if(b.min==null||b.min<0||b.min>100)errs.push({sheet:'BANDS',row:b.row,msg:'min_score must be between 0 and 100.'})});
  if(bands.length&&!bands.some(function(b){return b.min===0}))
    errs.push({sheet:'BANDS',row:'',msg:'One band must start at 0, or an agent can score below every band.'});

  /* --- severity keys must name a metric the engine has --- */
  data.SEVERITY.forEach(function(r){
    const typed=AP.rbNorm(r.metric_key);
    if(!AP.METRICS.some(function(x){return x.k.toLowerCase()===typed.toLowerCase()}))
      errs.push({sheet:'SEVERITY',row:r.__row,msg:'metric_key "'+typed+'" is not a metric the engine measures.'});
    const w=AP.rbNum(r.severity_weight);
    if(w==null||w<=0||w>5)errs.push({sheet:'SEVERITY',row:r.__row,msg:'severity_weight must be between 0 and 5.'});
  });

  /* --- causes and actions --- */
  const causeKeys={};data.CAUSES.forEach(function(r){causeKeys[AP.rbKey(r.cause_key)]=1});
  data.CAUSES.forEach(function(r){
    const alt=AP.rbKey(r.alt_cause);
    if(alt&&!causeKeys[alt])errs.push({sheet:'CAUSES',row:r.__row,msg:'alt_cause "'+r.alt_cause+'" is not a cause_key in this sheet.'});
  });
  const acts=data.ACTIONS.filter(function(r){return AP.rbBool(r.enabled,true)});
  const causeHas={};
  acts.forEach(function(r){
    const ck=AP.rbKey(r.cause_key);
    if(!causeKeys[ck])errs.push({sheet:'ACTIONS',row:r.__row,msg:'cause_key "'+r.cause_key+'" is not in the CAUSES tab.'});
    else causeHas[ck]=1;
    const dk=AP.rbDrvKey(r.driver_key);
    if(dk&&dk!=='none'&&!drvKeys[dk])errs.push({sheet:'ACTIONS',row:r.__row,msg:'driver_key "'+r.driver_key+'" is not an enabled driver. Use one of: '+Object.keys(drvKeys).join(', ')+', or leave it blank.'});
    const mins=AP.rbNum(r.minutes);
    if(mins==null||mins<=0||mins>240)errs.push({sheet:'ACTIONS',row:r.__row,msg:'minutes must be between 1 and 240.'});
    const ins=AP.rbNorm(r.instruction);
    ins.split(/(?<=[.!?])\s+/).forEach(function(s){
      const w=(s.match(/[A-Za-z][A-Za-z'-]*/g)||[]).length;
      if(w>16)warns.push({sheet:'ACTIONS',row:r.__row,msg:'A sentence runs to '+w+' words. Agents read this between calls — keep every sentence to 16 or fewer.'});
    });
    if(AP.rbNorm(r.title).split(/\s+/).length>9)
      warns.push({sheet:'ACTIONS',row:r.__row,msg:'The title is longer than nine words.'});
  });
  Object.keys(causeKeys).forEach(function(ck){
    if(!causeHas[ck])warns.push({sheet:'ACTIONS',row:'',msg:'Cause "'+ck+'" has no enabled action. Nothing can be recommended for it.'});
  });
  Object.keys(drvKeys).forEach(function(dk){
    if(!acts.some(function(r){return AP.rbDrvKey(r.driver_key)===dk}))
      warns.push({sheet:'ACTIONS',row:'',msg:'No action moves "'+dk+'". A team leader cannot buy points on that driver except through a custom action.'});
  });

  /* --- triggers --- */
  const pri={};
  data.TRIGGERS.forEach(function(r){
    const p=AP.rbNum(r.priority);
    if(p==null||p<0||p>100)errs.push({sheet:'TRIGGERS',row:r.__row,msg:'priority must be between 0 and 100.'});
    else if(pri[p])errs.push({sheet:'TRIGGERS',row:r.__row,msg:'Priority '+p+' is used twice. Two triggers cannot tie.'});
    else pri[p]=1;
    if(!(AP.rbKey(r.trigger_id) in AP.TRIG_DEFAULT))
      errs.push({sheet:'TRIGGERS',row:r.__row,msg:'trigger_id "'+r.trigger_id+'" is not one the engine knows. Valid: '+Object.keys(AP.TRIG_DEFAULT).join(', ')});
  });

  /* --- thresholds --- */
  data.THRESHOLDS.forEach(function(r){
    const k=AP.rbKey(r.setting_key);
    if(!(k in AP.RB_DEFAULT)){errs.push({sheet:'THRESHOLDS',row:r.__row,msg:'setting_key "'+r.setting_key+'" is not one the engine reads. Valid: '+Object.keys(AP.RB_DEFAULT).join(', ')});return}
    if(k==='session_start'||k==='session_end'){
      if(!/^\d{1,2}:\d{2}$/.test(AP.rbNorm(r.value)))errs.push({sheet:'THRESHOLDS',row:r.__row,msg:'Use a 24-hour time such as 08:00.'});
      return;
    }
    const v=AP.rbNum(r.value);
    if(v==null){errs.push({sheet:'THRESHOLDS',row:r.__row,msg:'value must be a number.'});return}
    const RANGE={rating_floor:[0,0.9],rating_window_sessions:[1,30],max_open_actions:[1,5],
      levers_shown:[1,5],lever_min_points:[0,10],rec_min_points:[0,10],tl_response_mins:[5,120],
      due_soon_mins:[1,60],due_block_mins:[15,480],clearing_sessions:[0,30],
      coach_min_movement:[0,50],flat_results_before_rediagnose:[1,5]};
    const rg=RANGE[k];
    if(rg&&(v<rg[0]||v>rg[1]))errs.push({sheet:'THRESHOLDS',row:r.__row,msg:'"'+k+'" is '+v+'. It must be between '+rg[0]+' and '+rg[1]+'.'});
    if(k==='max_open_actions'&&v>2)warns.push({sheet:'THRESHOLDS',row:r.__row,msg:'More than two open actions is what the module is designed to prevent. An agent with a to-do list stops reading it.'});
    if(k==='levers_shown'&&v!==3)warns.push({sheet:'THRESHOLDS',row:r.__row,msg:'The fixed count of three is what makes the brief a habit.'});
  });

  /* --- data inputs still required --- */
  data.DATA_INPUTS.forEach(function(r){
    if(AP.rbNorm(r.status).toLowerCase()==='required')
      warns.push({sheet:'DATA_INPUTS',row:r.__row,msg:'"'+AP.rbNorm(r.field_key)+'" is marked Required and has not been supplied. Rules that need it will fall back to their default.'});
  });

  return {ok:errs.length===0,errs:errs,warns:warns,counts:counts,data:data};
};

/* =====================================================================
   APPLY — rewrite the engine from a validated workbook
   ===================================================================== */
AP.rbApply=function(v){
  const d=v.data;const before=AP.rbSnapshot();

  /* drivers */
  const drv=d.DRIVERS.filter(function(r){return AP.rbBool(r.enabled,true)});
  AP.RATING_DEF=drv.map(function(r){
    const k=AP.rbDrvKey(r.driver_key);
    const old=AP.RB_DRV_SEED[k]||{};
    return {k:k,label:AP.rbNorm(r.driver_label),w:AP.rbNum(r.weight),
      fmt:old.fmt||'pct',help:AP.rbNorm(r.plain_english)||old.help||'',lift:old.lift||''};
  });

  /* campaigns */
  const tiers={};
  d.COMMISSION_TIERS.forEach(function(r){
    const ck=AP.rbKey(r.campaign_id);
    (tiers[ck]=tiers[ck]||[]).push({n:AP.rbNum(r.tier),from:AP.rbNum(r.from_sales),rate:AP.rbNum(r.rand_per_sale)});
  });
  Object.keys(tiers).forEach(function(ck){tiers[ck].sort(function(x,y){return x.from-y.from});
    tiers[ck].forEach(function(t,i){t.n=i+1})});
  const camps={};
  d.CAMPAIGNS.filter(function(r){return AP.rbBool(r.active,true)}).forEach(function(r){
    const ck=AP.rbKey(r.campaign_id);
    const prev=AP.CAMPAIGNS[ck]||{};
    camps[ck]={id:ck,name:AP.rbNorm(r.campaign_name),
      dailyTarget:AP.rbNum(r.daily_target),
      convTarget:AP.rbNum(r.conv_target),
      closureTarget:AP.rbNum(r.closure_target),
      qualityTarget:AP.rbNum(r.quality_target),
      qaTarget:prev.qaTarget!=null?prev.qaTarget:90,
      cleanTarget:prev.cleanTarget!=null?prev.cleanTarget:92,
      talkTarget:AP.rbNum(r.talk_target),
      prodTarget:prev.prodTarget||330,contactTarget:prev.contactTarget||55,adherenceTarget:prev.adherenceTarget||92,
      sessionStart:AP.rbNorm(r.session_start)||AP.rb('session_start'),
      sessionEnd:AP.rbNorm(r.session_end)||AP.rb('session_end'),
      comm:{qualifying:AP.rbNorm(r.qualifying_definition)||(prev.comm&&prev.comm.qualifying)||'',
        minQA:AP.rbNum(r.min_qa),minClean:AP.rbNum(r.min_clean),
        tiers:tiers[ck]||(prev.comm&&prev.comm.tiers)||[{n:1,from:0,rate:45}]}};
  });
  if(Object.keys(camps).length)AP.CAMPAIGNS=camps;

  /* bands, highest first */
  const bands=d.BANDS.map(function(r){return {min:AP.rbNum(r.min_score),label:AP.rbNorm(r.band_label)}})
    .filter(function(b){return b.label}).sort(function(x,y){return y.min-x.min});
  const BC=['done','done','active','soon','over'];
  AP.RATING_BANDS=bands.map(function(b,i){return {min:b.min,label:b.label,c:BC[Math.min(i,BC.length-1)]}});

  /* severity */
  const sev={};
  d.SEVERITY.forEach(function(r){const w=AP.rbNum(r.severity_weight);
    if(w==null)return;
    const typed=AP.rbNorm(r.metric_key);
    const m=AP.METRICS.find(function(x){return x.k.toLowerCase()===typed.toLowerCase()});
    sev[m?m.k:typed]=w;});
  if(Object.keys(sev).length)AP.SEV_W=sev;

  /* causes */
  const causes={},alt={};
  d.CAUSES.forEach(function(r){
    const ck=AP.rbKey(r.cause_key);
    causes[ck]={label:AP.rbNorm(r.cause_label),route:AP.rbNorm(r.routes_to)};
    const a=AP.rbKey(r.alt_cause);if(a)alt[ck]=a;
  });
  if(Object.keys(causes).length){AP.CAUSES=causes;AP.ALT=alt}

  /* actions, grouped by cause in sheet order */
  const tpl={};
  d.ACTIONS.filter(function(r){return AP.rbBool(r.enabled,true)}).forEach(function(r){
    const ck=AP.rbKey(r.cause_key);const dk=AP.rbDrvKey(r.driver_key);
    (tpl[ck]=tpl[ck]||[]).push({drv:(dk&&dk!=='none')?dk:null,
      title:AP.rbNorm(r.title),ins:AP.rbNorm(r.instruction),
      mins:AP.rbNum(r.minutes)||15,coach:AP.rbBool(r.needs_coaching,false),
      resource:AP.rbNorm(r.needs_resource)});
  });
  if(Object.keys(tpl).length)AP.RECTPL=tpl;

  /* triggers */
  d.TRIGGERS.forEach(function(r){
    const k=AP.rbKey(r.trigger_id);
    AP.TRIG[k]=AP.rbNum(r.priority);
    AP.TRIG_ON[k]=AP.rbBool(r.enabled,true);
  });

  /* The rules registry holds the same weights for the in-app editor. Leaving it
     stale would mean two sources of truth for one number, and the registry wins
     inside AP.ratingWeights — so the workbook writes it. */
  if(state.rules&&state.rules.agentRating){
    state.rules.agentRating.vals=AP.RATING_DEF.map(function(x){return x.label+':'+x.w});
    try{store('cb-rules',state.rules)}catch(e){}
  }

  /* thresholds */
  d.THRESHOLDS.forEach(function(r){
    const k=AP.rbKey(r.setting_key);
    if(!(k in AP.RB_DEFAULT))return;
    AP.RB[k]=(k==='session_start'||k==='session_end')?AP.rbNorm(r.value):AP.rbNum(r.value);
  });
  AP.SESSION={start:AP.rb('session_start'),mid:AP.SESSION?AP.SESSION.mid:'12:00',end:AP.rb('session_end')};
  /* the engine keeps a few named constants; keep them level with the rule book
     so nothing reads a stale value */
  AP.RATING_FLOOR=AP.rb('rating_floor');
  AP.TL_RESPONSE_MINS=AP.rb('tl_response_mins');

  /* data inputs the engine has been told it is still missing */
  AP.RB_INPUTS=d.DATA_INPUTS.map(function(r){
    return {field:AP.rbNorm(r.field_key),status:AP.rbNorm(r.status),
      source:AP.rbNorm(r.source),requiredBy:AP.rbNorm(r.required_by),desc:AP.rbNorm(r.description)};
  });

  AP.RB_LOADED={at:AP.now(),counts:v.counts,warns:v.warns.length};
  AP.save();
  return {before:before,after:AP.rbSnapshot()};
};

/* a compact picture of the engine, for the before/after report */
AP.rbSnapshot=function(){
  /* One entry per thing that can move, so the report names the exact setting
     rather than a wall of text with the change buried in it. */
  const s={};
  AP.RATING_DEF.forEach(function(d){s['weight · '+d.label]=d.w});
  s['drivers']=AP.RATING_DEF.length;
  Object.keys(AP.CAMPAIGNS).forEach(function(k){const c=AP.CAMPAIGNS[k];
    s['campaign · '+c.name]='target '+c.dailyTarget+' · conv '+c.convTarget+' · gates '+c.comm.minQA+'/'+c.comm.minClean
      +' · '+(c.comm.tiers||[]).length+' tiers';});
  s['actions']=Object.keys(AP.RECTPL).reduce(function(t,k){return t+AP.RECTPL[k].length},0);
  s['causes']=Object.keys(AP.CAUSES).length;
  s['bands']=AP.RATING_BANDS.map(function(b){return b.label+' from '+b.min}).join(', ');
  Object.keys(AP.RB_DEFAULT).forEach(function(k){s['setting · '+k]=AP.rb(k)});
  Object.keys(AP.SEV_W).forEach(function(k){s['severity · '+k]=AP.SEV_W[k]});
  Object.keys(AP.TRIG_DEFAULT).forEach(function(k){
    s['priority · '+k]=AP.trigOn(k)?AP.trig(k):'off'});
  return s;
};
AP.rbDiff=function(before,after){
  const out=[];
  Object.keys(after).forEach(function(k){
    if(String(before[k])!==String(after[k]))out.push({field:k,from:before[k],to:after[k]});
  });
  return out;
};

/* what would change, computed without touching the live engine */
AP.rbPreviewDiff=function(v){
  const snap=JSON.parse(JSON.stringify({
    RATING_DEF:AP.RATING_DEF,CAMPAIGNS:AP.CAMPAIGNS,RATING_BANDS:AP.RATING_BANDS,
    RECTPL:AP.RECTPL,CAUSES:AP.CAUSES,ALT:AP.ALT,SEV_W:AP.SEV_W,RB:AP.RB,TRIG:AP.TRIG,TRIG_ON:AP.TRIG_ON,
    SESSION:AP.SESSION,RATING_FLOOR:AP.RATING_FLOOR,TL_RESPONSE_MINS:AP.TL_RESPONSE_MINS,
    RB_INPUTS:AP.RB_INPUTS||null,RB_LOADED:AP.RB_LOADED||null,
    RULEVALS:(state.rules&&state.rules.agentRating)?state.rules.agentRating.vals:null}));
  const before=AP.rbSnapshot();
  let after;
  try{ AP.rbApply(v); after=AP.rbSnapshot(); }
  finally{
    AP.RATING_DEF=snap.RATING_DEF;AP.CAMPAIGNS=snap.CAMPAIGNS;AP.RATING_BANDS=snap.RATING_BANDS;
    AP.RECTPL=snap.RECTPL;AP.CAUSES=snap.CAUSES;AP.ALT=snap.ALT;AP.SEV_W=snap.SEV_W;
    AP.RB=snap.RB;AP.TRIG=snap.TRIG;AP.TRIG_ON=snap.TRIG_ON;AP.SESSION=snap.SESSION;
    AP.RATING_FLOOR=snap.RATING_FLOOR;AP.TL_RESPONSE_MINS=snap.TL_RESPONSE_MINS;
    AP.RB_INPUTS=snap.RB_INPUTS;AP.RB_LOADED=snap.RB_LOADED;
    /* the in-app rules registry is written to storage by apply — put it back,
       or a cancelled preview would survive a refresh */
    if(state.rules&&state.rules.agentRating&&snap.RULEVALS){
      state.rules.agentRating.vals=snap.RULEVALS;
      try{store('cb-rules',state.rules)}catch(e){}
    }
  }
  return AP.rbDiff(before,after);
};

AP.rbCommit=function(){
  const p=AP.RB_PENDING;if(!p||!p.v.ok)return;
  const res=AP.rbApply(p.v);
  const changed=AP.rbDiff(res.before,res.after);
  const batch={batch_id:'R'+String((state.batches.filter(function(b){return b.source_type==='DECISION_RULES'}).length)+1).padStart(4,'0'),
    source_type:'DECISION_RULES',source_system:'Agent OS',uploaded_by:state.user,
    uploaded_at:new Date().toISOString(),period_start:null,period_end:null,
    original_file_name:p.file.name,file_hash:'',raw_row_count:Object.keys(p.v.counts).reduce(function(s,k){return s+p.v.counts[k]},0),
    loaded_row_count:Object.keys(p.v.counts).reduce(function(s,k){return s+p.v.counts[k]},0),
    rejected_row_count:0,validation_status:p.v.warns.length?'warning':'passed',
    parser_version:'rulebook v1',notes:changed.length+' parts of the engine changed'};
  state.batches.unshift(batch);
  state.facts.DECISION_RULES=[{loaded_at:AP.now(),file:p.file.name,changes:changed.length}];
  state.demo=false;
  AP.log('config','Decision engine',
    'Rules reloaded from '+p.file.name+' — '+(changed.length?changed.map(function(c){return c.field}).join(', '):'no change'),'Agent OS');
  try{saveFacts('DECISION_RULES');saveAudit()}catch(e){}
  AP.RB_PENDING=null;
  closeModal();
  toast(changed.length?('Decision engine updated — '+changed.length+' part'+(changed.length===1?'':'s')+' changed')
                      :'Rules loaded — the engine already matched this workbook');
  render();
};

/* =====================================================================
   GWP IS NOT COMMISSION
   v3 Check 1 compares Gross Written Premium per sale against R99 — the
   premium the customer pays. The money layer had been deriving "GWP" from
   the agent's commission rand, which is a different number entirely and
   made Check 1 fail for almost everyone. Those two are now separated.

   Real GWP comes from the GWP Table upload (Bundled Product → GWP) joined
   to activated sales. Until that lands, GWP per sale is NOT MEASURED and
   the framework says so rather than failing an agent on a number nobody
   has supplied. The demo profile below exists only so the ladder can be
   seen working, and it is labelled as demo everywhere it surfaces.
   ===================================================================== */

AP.GWP_DEMO={                 /* premium per sale, ex VAT — demo data only */
 thando:104, sizwe:96, naledi:112, bongani:88, amahle:74, refilwe:92, palesa:131,
 kagiso:83, zanele:99, lerato:118, tumelo:79, sipho:91, nomsa:107, jabu:126
};
AP.gwpPerSale=function(id){
  /* 1 — the real source: the uploaded GWP table joined to this agent's sales */
  const tbl=(state.facts&&state.facts.GWP_TABLE)||[];
  const acts=(state.facts&&state.facts.SF_ACTIVATED_SERVICES)||[];
  if(tbl.length&&acts.length){
    const map={};tbl.forEach(function(r){map[r.product_norm]=r.gwp});
    const mine=acts.filter(function(r){return r.agent_id===id||r.owner_cb===id});
    let n=0,sum=0;
    mine.forEach(function(r){
      const g=map[String(r.product||r.bundled_product||'').toLowerCase().trim()];
      if(g!=null){sum+=g;n++}});
    if(n)return {value:sum/n,source:'GWP table',measured:true,n:n};
  }
  /* 2 — the seeded prototype agents carry a demo premium so the ladder can be
     seen working. Keyed to those ids, so a real agent never picks one up. */
  if(AP.GWP_DEMO[id]!=null)
    return {value:AP.GWP_DEMO[id],source:'demo profile',measured:false,demo:true,n:0};
  /* 3 — nothing uploaded. Say so; never substitute commission for premium. */
  return {value:null,source:'not uploaded',measured:false,n:0};
};
AP.gwpTotalFor=function(id){
  const per=AP.gwpPerSale(id);
  if(per.value==null)return {value:null,source:per.source,measured:false};
  const cm=AP.comm(id);
  return {value:per.value*(cm.mtdQual+cm.mtdHeld),source:per.source,
    measured:per.measured,demo:per.demo};
};

/* ---- cancellations, from the Salesforce inactive export -------------- */
AP.cancelsFor=function(id){
  const rows=(state.facts&&state.facts.SF_INACTIVE)||[];
  if(!rows.length)return null;                     /* not uploaded — reported as unmeasured */
  const mine=rows.filter(function(r){return r.agent_id===id||r.owner_cb===id});
  return {count:mine.length,source:'Salesforce cancellations'};
};


/* =====================================================================
   NBA SCORING FRAMEWORK v3.0
   "One Agent. One Priority. One Action. One Improvement."

   The five Golden Rules, held in code:
     1. One Primary NBA          — AP.nbaFor returns exactly one rule
     2. Most Serious Comes First — the ladder is walked in priority order
     3. Every NBA Has an Action  — what / who / when / target / review
     4. Measured by Tenure Group — every target comes from the agent's group
     5. Two-Check Sales Rule     — VALUE first, then VOLUME

   One departure from the document, made deliberately and on the record:
   §7 scores Total GWP as a percentile within the tenure group. This build
   never scores an agent against a colleague, so Total GWP keeps its 15%
   but is measured against the agent's OWN period GWP target — the figure
   §2 already defines as R99 x daily sales target x working days. Tenure
   still sets every target; it just never sets a ranking.
   ===================================================================== */

AP.NBA_VERSION='3.0';
AP.GWP_MIN_PER_SALE=99;                 /* §2 — fixed R99 for everyone */

/* ---- §2 Tenure Group Targets ---------------------------------------- */
AP.TENURE_GROUPS=[

/* Campaigns the v3 table does not carry a row for yet. Rather than invent a
   target, fall back to the campaign's own daily target and say so on screen. */
AP.tenureGroupOf=function(a){
  if(typeof a==='string')a=AP.agentById(a);
  const g=AP.TENURE_GROUPS.find(function(x){
    if(x.match.tenure&&x.match.tenure!==a.tenure)return false;
    if(x.match.camp&&x.match.camp!==a.camp)return false;
    return true;});
  if(g)return g;
  const c=AP.camp(a);
  return {key:'fallback_'+a.camp,label:'Experienced – '+c.name,fallback:true,
    dailySales:c.dailyTarget,minGwpSale:AP.GWP_MIN_PER_SALE,convTarget:c.convTarget};
};
AP.dailyGwpTarget=function(a){const g=AP.tenureGroupOf(a);return g.dailySales*g.minGwpSale};
AP.periodGwpTarget=function(a){                       /* §2 — x working days */
  return AP.dailyGwpTarget(a)*Math.max(1,AP.monthWorkdays(false));
};

/* ---- the raw readings, over the reporting window -------------------- */
AP.nbaWindow=function(id){
  const w=AP.rb?AP.rb('rating_window_sessions'):5;
  return AP.rows(id).slice(-Math.max(w,1));
};
AP.nbaMetrics=function(id){
  const a=AP.agentById(id),g=AP.tenureGroupOf(a),c=AP.camp(a);
  const rows=AP.nbaWindow(id);
  const worked=rows.filter(function(r){return r.present});
  const sum=function(k,src){return (src||rows).reduce(function(s,r){return s+(r[k]||0)},0)};

  const daysScheduled=rows.length||1;
  const daysAttended=worked.length;
  const sales=sum('sales',worked), leads=sum('leads',worked), calls=sum('calls',worked);
  const cm=AP.comm(id);

  /* GWP is premium, not commission — see AP.gwpPerSale */
  const per=AP.gwpPerSale(id), tot=AP.gwpTotalFor(id);
  const gwpPerSale=per.value, gwpPeriod=tot.value;

  /* audited calls and critical fails come from QA. Until that upload lands,
     compliance exceptions stand in and the screen says which it used. */
  const qaUp=(state.facts&&state.facts.QA_EVALUATIONS)||[];
  const mine=qaUp.filter(function(r){return r.agent_id===id||r.agent===a.name});
  const audited=mine.length?mine.length:0;
  const critFails=mine.length?mine.filter(function(r){return /critical/i.test(r.outcome||r.decision||'')}).length
                             :sum('compEx',worked);
  const cfr=audited>0?(critFails/audited*100):null;   /* null = not measured */
  const critSource=mine.length?'QA evaluations':(audited?'QA evaluations':'compliance exceptions');

  const cancels=(typeof AP.cancelsFor==='function')?AP.cancelsFor(id):null;

  const m={};
  m.attendance = daysScheduled?daysAttended/daysScheduled*100:0;
  m.qa         = AP.avg(id,'qa',rows.length);
  m.targetAch  = g.dailySales&&daysAttended?(sales/daysAttended)/g.dailySales*100:0;
  m.gwpSale    = gwpPerSale;
  m.gwpDayTgt  = AP.dailyGwpTarget(a);
  m.conv       = leads?sales/leads*100:0;
  m.talk       = daysAttended?sum('talk',worked)/daysAttended:0;
  m.gwpTotal   = gwpPeriod;
  m.critFails  = critFails;
  m.cfr        = cfr;
  m.cancels    = cancels==null?null:cancels.count;
  m.cancelPct  = (cancels==null||!sales)?null:(cancels.count/sales*100);
  m.attempts   = leads?calls/leads:0;

  return {agent:a,group:g,camp:c,rows:rows,worked:daysAttended,scheduled:daysScheduled,
    sales:sales,leads:leads,calls:calls,audited:audited,critSource:critSource,
    gwpSource:per.source,gwpMeasured:per.measured,gwpDemo:!!per.demo,
    cancelSource:cancels?cancels.source:'not uploaded',
    periodGwpTarget:AP.periodGwpTarget(a),m:m};
};

/* ---- §3 the Two-Check Sales Rule ------------------------------------ */
AP.twoCheck=function(id){
  const d=AP.nbaMetrics(id),g=d.group;
  const valueMeasured = d.m.gwpSale!=null;
  const valuePass  = valueMeasured ? (d.m.gwpSale >= g.minGwpSale) : null;   /* Check 1 */
  const volumePass = d.m.targetAch >= AP.nt('target_ach');        /* Check 2 */
  const S={
    'PASS|PASS':{status:'ON TARGET',   c:'g',
      means:'Develop and set stretch goals.'},
    'FAIL|PASS':{status:'VALUE ISSUE', c:'a',
      means:'Enough sales, but value is too low. Coach on product mix and upselling.'},
    'PASS|FAIL':{status:'VOLUME ISSUE',c:'a',
      means:'Good value, but not enough sales. Coach on activity, pipeline and closing.'},
    'FAIL|FAIL':{status:'BOTH ISSUES', c:'r',
      means:'Value coaching takes priority; volume is secondary.'}
  };
  if(!valueMeasured)return {valuePass:null,volumePass:volumePass,
    key:'UNMEASURED|'+(volumePass?'PASS':'FAIL'),status:'VALUE NOT MEASURED',c:'n',
    means:'GWP per sale has not been supplied, so Check 1 cannot run. Upload the GWP table to switch it on. Volume '+(volumePass?'passes':'fails')+'.',
    gwpSale:null,minGwpSale:g.minGwpSale,targetAch:d.m.targetAch,source:d.gwpSource};
  const key=(valuePass?'PASS':'FAIL')+'|'+(volumePass?'PASS':'FAIL');
  return Object.assign({valuePass:valuePass,volumePass:volumePass,key:key,source:d.gwpSource,
    gwpSale:d.m.gwpSale,minGwpSale:g.minGwpSale,
    targetAch:d.m.targetAch},S[key]);
};

/* ---- §6 the graduated critical-fail rule (R2A) ---------------------- */
AP.R2A_TIERS=[
/* `level` below is the ladder Level — 1 is Protect the Business, the most
   serious. Severity therefore runs the OPPOSITE way to the number, so the
   comparison that picks the worse of the two bands uses `sev`, where bigger
   means worse. Comparing `level` picked the milder tier. */
 {tier:'R2A-3',rule:'Critical Compliance Fail',level:1,sev:3,priority:'P1',
  fails:function(n){return n>=AP.nt('r2a3_fails')}, cfr:function(r){return r>=AP.nt('r2a3_cfr')},
  penalty:function(){return AP.nt('pen_r2a3')}, elite:'Blocked'},
 {tier:'R2A-2',rule:'Compliance Risk',level:2,sev:2,priority:'P2',
  fails:function(n){return n>=AP.nt('r2a2_fails_min')&&n<=AP.nt('r2a2_fails_max')},
  cfr:function(r){return r>=AP.nt('r2a2_cfr_min')&&r<AP.nt('r2a2_cfr_max')},
  penalty:function(){return AP.nt('pen_r2a2')}, elite:'Blocked'},
 {tier:'R2A-1',rule:'Compliance Note',level:3,sev:1,priority:'P3',
  fails:function(n){return n===AP.nt('r2a1_fails')}, cfr:function(r){return r<AP.nt('r2a1_cfr_max')},
  penalty:function(){return AP.nt('pen_r2a1')}, elite:'Retained'},
 {tier:'Tier 0',rule:'Clean',level:0,sev:0,priority:'—',
  fails:function(n){return n===0}, cfr:function(){return true},
  penalty:function(){return 0}, elite:'Eligible'}
];
AP.r2aTier=function(id){
  const d=(typeof id==='object')?id:AP.nbaMetrics(id);
  const n=d.m.critFails||0, r=d.m.cfr;
  /* §6 — the tier is the HIGHER of the count band and the rate band. When
     audited calls have not been supplied there is no rate band at all, so the
     count decides on its own. */
  const rateKnown=(r!=null);
  let byCount=null,byRate=null;
  AP.R2A_TIERS.forEach(function(t){
    if(byCount===null&&t.fails(n))byCount=t;
    if(rateKnown&&byRate===null&&t.cfr(r)&&t.tier!=='Tier 0')byRate=t;
  });
  if(!byCount)byCount=AP.R2A_TIERS[AP.R2A_TIERS.length-1];
  if(n===0)byRate=null;                       /* no fails means no rate band */
  const pick=(byRate&&byRate.sev>byCount.sev)?byRate:byCount;
  const pen=Math.min(AP.nt('pen_cap'),pick.penalty());
  return {tier:pick.tier,rule:pick.rule,level:pick.level,priority:pick.priority,
    penalty:pen,elite:pick.elite,fails:n,cfr:r,rateKnown:rateKnown,
    audited:d.audited,critSource:d.critSource,
    byCount:byCount.tier,byRate:byRate?byRate.tier:(rateKnown?'—':'not measured')};
};

/* ---- §7 the composite scorecard ------------------------------------- */
/* Seven weighted metrics summing to 100. Total GWP is measured against the
   agent's own period target rather than a peer percentile — the one stated
   departure from the document. */
AP.COMPOSITE_DEF=[
 {k:'gwpSale',  label:'Avg GWP per Sale',   w:25, note:'Check 1, scored independently of volume.'},
 {k:'targetAch',label:'Target Achievement', w:20, note:'Check 2, daily sales against the tenure target.'},
 {k:'qa',       label:'QA Score',           w:20, note:'Critical-fail calls are scored 0 and included.'},
 {k:'gwpTotal', label:'Total GWP',          w:15, note:'Against the agent’s own period GWP target.'},
 {k:'conv',     label:'Conversion',         w:10, note:'Against the tenure conversion target.'},
 {k:'talk',     label:'Talk Time',          w:5,  note:'Per attended day.'},
 {k:'attendance',label:'Attendance',        w:5,  note:'Enables call days.'}
];
AP.compositeTargets=function(id){
  const d=AP.nbaMetrics(id),g=d.group;
  return {gwpSale:g.minGwpSale, targetAch:AP.nt('target_ach'), qa:AP.nt('qa_target'),
    gwpTotal:d.periodGwpTarget, conv:g.convTarget, talk:AP.nt('talk_target'),
    attendance:AP.nt('att_target')};
};
AP.composite=function(id){
  const d=AP.nbaMetrics(id),tg=AP.compositeTargets(id),r2a=AP.r2aTier(d);
  const F=AP.rb?AP.rb('rating_floor'):0.5;
  let raw=0,wsum=0;
  /* A metric nobody has supplied is not a zero — it is absent. The weights
     renormalise across the metrics an agent actually has, and the screen names
     the ones left out. Scoring an unmeasured metric as zero would punish an
     agent for a missing upload. */
  const parts=AP.COMPOSITE_DEF.map(function(def){
    const v=d.m[def.k], t=tg[def.k];
    const measured=(v!=null&&t!=null&&t!==0);
    const att=measured?Math.max(0,Math.min(1,v/t)):null;
    const scaled=measured?Math.max(0,Math.min(1,(att-F)/(1-F))):null;
    const pts=measured?Math.round(scaled*def.w*10)/10:0;
    if(measured){raw+=pts;wsum+=def.w}
    return {k:def.k,label:def.label,note:def.note,w:def.w,value:v,target:t,measured:measured,
      fmt:(AP.NBA_METRICS.find(function(x){return x.k===def.k})||{}).fmt||'pct',
      att:measured?Math.round(att*1000)/10:null,points:pts,
      available:measured?Math.round(Math.max(0,def.w-pts)*10)/10:0,
      onTarget:measured?v>=t:false};
  });
  const unmeasured=parts.filter(function(p){return !p.measured}).map(function(p){return p.label});
  const score=Math.round(Math.min(100,wsum?raw/wsum*100:0)*10)/10;
  /* Two adjustments come off the composite, never off a driver: the graduated
     critical-fail penalty from v3 section 6, and the repeat-coaching penalty
     from the cluster layer. Both are capped on their own and capped together,
     so no agent's score can be erased by adjustments alone. */
  const cxp=(typeof AP.cxPenalty==='function')?AP.cxPenalty(id):{points:0,tier:'Not measured'};
  const penTotal=Math.min((typeof AP.cxt==='function')?AP.cxt('combined_pen_cap'):99,
    r2a.penalty+(cxp.points||0));
  const adj=Math.round(Math.max(0,score-penTotal)*10)/10;
  const sorted=parts.slice().sort(function(x,y){return y.available-x.available});
  return {score:score,adj:adj,penalty:r2a.penalty,r2a:r2a,parts:parts,
    cxPenalty:cxp.points||0,cx:cxp,penaltyTotal:penTotal,
    unmeasured:unmeasured,weightScored:wsum,
    weakest:sorted[0],strongest:parts.slice().sort(function(x,y){return y.att-x.att})[0],
    onTarget:parts.filter(function(p){return p.onTarget}).length,
    eliteEligible:r2a.elite==='Eligible'||r2a.elite==='Retained'};
};

/* ---- Golden Rule 1 and 2: one NBA, most serious first --------------- */
AP.nbaFor=function(id){
  const d=AP.nbaMetrics(id);
  const tier=AP.r2aTier(d);
  const enabled=AP.NBA_RULES.filter(function(r){return AP.NBA_ON[r.code]!==false});
  const ordered=enabled.slice().sort(function(a,b){
    return (AP.nbaOrder(a)-AP.nbaOrder(b))});
  let primary=null;const alsoFlagged=[];
  ordered.forEach(function(r){
    let hit=false;
    try{hit=r.fires(d)}catch(e){hit=false}
    if(!hit)return;
    if(r.flagOnly){alsoFlagged.push(r);return}          /* a flag, not a primary NBA */
    if(!primary)primary=r;
  });
  /* Golden Rule 1 — there is always exactly one. Nothing triggered means the
     agent is clean and in range, which is R10's job to say. */
  if(!primary)primary=AP.NBA_RULES.find(function(r){return r.code==='R10'});
  const lv=AP.nbaLevel(primary.level);
  const part=AP.composite(id).parts.find(function(p){return p.k===primary.metric});
  /* The ladder decides WHICH rule fires. The coaching history decides what the
     action says — "coach them on product knowledge" is the wrong instruction
     the fourth time in a row. Golden Rule 1 is untouched: still one NBA. */
  const cxo=(typeof AP.cxOverlay==='function')?AP.cxOverlay(id,primary):null;
  const rd=(function(){
    if(primary.metric==='cfr'&&d.m.cfr==null)
      return {key:'critFails',label:'Critical Fails',now:d.m.critFails||0,target:0};
    return {key:primary.metric,
      label:part?part.label:(AP.NBA_METRICS.find(function(m){return m.k===primary.metric})||{}).label,
      now:part?part.value:d.m[primary.metric],
      target:part?part.target:(primary.metric==='cfr'?0:null)};
  })();
  return {
    code:lv.band+' · '+primary.code, ruleCode:primary.code,
    level:primary.level, band:lv.band, levelTitle:lv.title, levelGoal:lv.goal, colour:lv.colour,
    rule:primary.rule, trigger:primary.triggerText,
    action:primary.action+((cxo&&cxo.actionAdd)||''),
    baseAction:primary.action, cx:cxo,
    owner:(cxo&&cxo.escalating&&primary.level>1)?'Team leader · documented':primary.owner,
    when:primary.when, review:primary.review,
    /* cfr is a compliance reading, not one of the seven scored metrics. Its
       target is zero. And when nobody has uploaded audited calls there is no
       rate at all, so the reading falls back to the fail COUNT — "8 fails
       against 0" is a fact a team leader can act on; "— against 0%" is not. */
    metricKey:rd.key,
    metricLabel:rd.label,
    now:rd.now,
    target:rd.target,
    successMeasure:AP.nbaSuccess(primary,d),
    flags:alsoFlagged.map(function(r){return {code:r.code,rule:r.rule,action:r.action}}),
    r2a:tier, data:d
  };
};
AP.nbaOrder=function(r){const v=AP.NBA_ORDER[r.code];return v==null?r.order:v};
AP.NBA_ORDER={};              /* rule book may reorder the ladder */
AP.NBA_ON={};                 /* rule book may switch a rule off */

AP.nbaSuccess=function(r,d){
  const fmt=function(v,f){return AP.mFmt(v,f==='rand'?'int':(f||'pct'))};
  switch(r.metric){
    case 'attendance':return 'Attendance back to '+AP.nt('att_target')+'% or better';
    case 'qa':        return 'QA score back to '+AP.nt('qa_target')+'% or better';
    case 'cfr':       return 'No further critical fails at the next audit';
    case 'gwpSale':   return 'GWP per sale at or above R'+d.group.minGwpSale;
    case 'targetAch': return 'Sales at '+AP.nt('target_ach')+'% of the daily target of '+d.group.dailySales;
    case 'conv':      return 'Conversion at or above '+d.group.convTarget+'%';
    case 'talk':      return 'Talk time at or above '+AP.nt('talk_target')+' minutes a day';
    default:          return 'Metric back within target';
  }
};

/* the whole team, ordered the way §10 says a team leader reads it */
AP.nbaTeam=function(tlId){
  return AP.teamOf(tlId||AP.s.tlId).map(function(a){

    if(x.nba.level!==y.nba.level)return x.nba.level-y.nba.level;
    return AP.nbaOrder({code:x.nba.ruleCode,order:99})-AP.nbaOrder({code:y.nba.ruleCode,order:99});
  });
};


/* =====================================================================
   THE v3 COMPOSITE BECOMES THE SINGLE SCORE
   There is now one /100 in the product. AP.rating() returns the v3
   composite, so the session brief, the levers, the payoff strips, the
   triage list and the team-leader screens all read the same seven metrics
   against the same tenure targets.

   The score an agent sees is the ADJUSTED composite — after the capped
   critical-fail penalty — because that is their true standing. The raw
   composite and the penalty are both carried so nothing is hidden.
   ===================================================================== */

/* ---- the plain-language line for each of the seven ------------------ */
AP.NBA_PLAIN={
 gwpSale:'What the average sale you write is worth to the business.',
 targetAch:'How close your daily sales come to your target.',
 qa:'Your call quality score. A critical fail scores that call zero.',
 gwpTotal:'The total value you have written this period against your own target.',
 conv:'Out of every 100 leads you get, how many become a sale.',
 talk:'Minutes on the phone on the days you work.',
 attendance:'Being here, on time, for the whole session.'
};
/* lowercase a metric label without destroying its initialisms:
   "Avg GWP per Sale" reads as "avg GWP per sale", never "avg gwp per sale" */
AP.lowLabel=function(t){
  return String(t||'').split(' ').map(function(w){
    return /^[A-Z]{2,}$/.test(w)?w:w.toLowerCase()}).join(' ');
};

/* the seven v3 metrics become the drivers, in weight order */
AP.RATING_DEF=AP.COMPOSITE_DEF.map(function(d){
  const m=AP.NBA_METRICS.find(function(x){return x.k===d.k})||{};
  return {k:d.k,label:d.label,w:d.w,fmt:m.fmt==='rand'?'rand':(m.fmt||'pct'),
    help:AP.NBA_PLAIN[d.k]||m.def||'',lift:''};
});
AP.RB_DRV_SEED={};AP.RATING_DEF.forEach(function(d){AP.RB_DRV_SEED[d.k]={fmt:d.fmt,help:d.help,lift:d.lift}});

AP.rating=function(id){
  const c=AP.composite(id);
  const score=c.adj;                       /* the penalised score is the real one */
  const band=AP.ratingBand(score);
  const nextBand=AP.RATING_BANDS.slice().reverse().find(function(b){return b.min>score});
  const sorted=c.parts.slice().sort(function(x,y){return y.available-x.available});
  return {score:score,raw:c.score,penalty:c.penalty,r2a:c.r2a,
    cxPenalty:c.cxPenalty||0,cx:c.cx,penaltyTotal:c.penaltyTotal||c.penalty,
    unmeasured:c.unmeasured,weightScored:c.weightScored,
    band:band,nextBand:nextBand||null,
    toNextBand:nextBand?Math.round((nextBand.min-score)*10)/10:0,
    parts:c.parts,weakest:sorted[0],
    strongest:c.parts.slice().filter(function(p){return p.measured})
      .sort(function(x,y){return y.att-x.att})[0]||c.parts[0],
    onTarget:c.onTarget,
    eliteEligible:c.eliteEligible};
};

/* ---- the rules registry is the other place the weights live ---------- */
/* AP.ratingWeights reads that registry BY LABEL and lets it override the
   engine. v3 renamed every driver, so a registry left over from the five-driver
   rating silently re-weighted the score — "Talk time: 15" landing on a 5-point
   metric, and the seven weights totalling 125 instead of 100. Reconcile on
   load. Only the labels are compared, so a weight a user has deliberately
   edited survives; a driver set that no longer matches is rewritten. */
/* small helpers the agent-facing sentences use, so the number of drivers is
   never written into a string again */
AP.numWord=function(n){
  return ['zero','one','two','three','four','five','six','seven','eight','nine','ten'][n]||String(n)};
AP.drvWeight=function(k){
  const d=(AP.ratingWeights()||[]).find(function(x){return x.k===k});return d?d.w:0};

AP.syncRatingRegistry=function(){
  if(!state.rules||!state.rules.agentRating)return false;
  const lab=function(v){const s=String(v);return s.slice(0,s.lastIndexOf(':')).trim().toLowerCase()};
  const want=AP.RATING_DEF.map(function(d){return d.label+':'+d.w});
  const have=state.rules.agentRating.vals||[];
  const same=have.length===want.length&&have.every(function(v,i){return lab(v)===lab(want[i])});
  if(same)return false;
  state.rules.agentRating.vals=want;
  try{store('cb-rules',state.rules)}catch(e){}
  return true;
};
try{AP.syncRatingRegistry()}catch(e){}

/* ---- validate ------------------------------------------------------ */
AP.rbValidateBase=AP.rbValidate;
AP.rbValidate=function(sheets){
  const v=AP.rbValidateBase(sheets);
  if(!v.data)return v;
  const rows=function(n){return AP.rbRows(sheets[n]||null)};
  ['TENURE_GROUPS','NBA_LADDER','R2A_TIERS','NBA_THRESHOLDS'].forEach(function(n){
    v.data[n]=rows(n);v.counts[n]=v.data[n].length;
    if(!sheets[n])v.warns.push({sheet:n,row:'',msg:'Tab is absent, so the NBA v3 values already loaded stay as they are.'});
  });

  (v.data.TENURE_GROUPS||[]).filter(function(r){return AP.rbBool(r.enabled,true)}).forEach(function(r){
    [['daily_sales_target',1,50],['min_gwp_per_sale',1,10000],['conversion_target',1,100]].forEach(function(t){
      const x=AP.rbNum(r[t[0]]);
      if(x==null)v.errs.push({sheet:'TENURE_GROUPS',row:r.__row,msg:'"'+t[0]+'" must be a number.'});
      else if(x<t[1]||x>t[2])v.errs.push({sheet:'TENURE_GROUPS',row:r.__row,msg:'"'+t[0]+'" is '+x+'; it must be between '+t[1]+' and '+t[2]+'.'});
    });
  });

  const known={};AP.NBA_RULES.forEach(function(r){known[r.code]=1});
  const seenOrder={};
  (v.data.NBA_LADDER||[]).forEach(function(r){
    const c=AP.rbNorm(r.rule_code);
    if(!known[c])v.errs.push({sheet:'NBA_LADDER',row:r.__row,msg:'rule_code "'+c+'" is not a rule the engine knows. Valid: '+Object.keys(known).join(', ')});
    const lv=AP.rbNum(r.level);
    if(lv==null||lv<1||lv>4)v.errs.push({sheet:'NBA_LADDER',row:r.__row,msg:'level must be 1, 2, 3 or 4.'});
    const o=AP.rbNum(r.order);
    if(o==null)v.errs.push({sheet:'NBA_LADDER',row:r.__row,msg:'order must be a number — it decides which rule is checked first.'});
    else if(seenOrder[o])v.errs.push({sheet:'NBA_LADDER',row:r.__row,msg:'order '+o+' is used twice. Two rules cannot tie.'});
    else seenOrder[o]=1;
    ['action','owner','when','review'].forEach(function(f){
      if(AP.rbNorm(r[f])==='')v.errs.push({sheet:'NBA_LADDER',row:r.__row,
        msg:'"'+f+'" is empty. Golden Rule 3 — every NBA states what, who, when and when it is reviewed.'});
    });
  });
  /* A tab that omits a rule leaves that rule on its built-in position, which
     can collide with a position the tab moved something else to. Check the
     ladder that would RESULT, not only the rows in the file. */
  if(v.data.NBA_LADDER&&v.data.NBA_LADDER.length){
    const inTab={};(v.data.NBA_LADDER||[]).forEach(function(r){inTab[AP.rbNorm(r.rule_code)]=AP.rbNum(r.order)});
    const resulting={};
    AP.NBA_RULES.forEach(function(rule){
      const o=(inTab[rule.code]!=null)?inTab[rule.code]:rule.order;
      if(o==null)return;
      if(resulting[o]!=null&&resulting[o]!==rule.code){
        const other=resulting[o];
        const missing=(inTab[rule.code]==null)?rule.code:(inTab[other]==null?other:null);
        v.errs.push({sheet:'NBA_LADDER',row:'',msg:'Position '+o+' would be held by both '+other+' and '+rule.code+'.'
          +(missing?(' "'+missing+'" is not in the tab, so it keeps its built-in position — add a row for it.'):' Two rules cannot tie.')});
      }
      resulting[o]=rule.code;
    });
  }

  /* Golden Rule 1: something must always be able to fire */
  const on=(v.data.NBA_LADDER||[]).filter(function(r){return AP.rbBool(r.enabled,true)});
  if(v.data.NBA_LADDER&&v.data.NBA_LADDER.length&&!on.some(function(r){return AP.rbNorm(r.rule_code)==='R10'}))
    v.errs.push({sheet:'NBA_LADDER',row:'',msg:'R10 must stay enabled. It is the rule that fires when nothing else does, and Golden Rule 1 says there is always exactly one NBA.'});

  (v.data.R2A_TIERS||[]).forEach(function(r){
    const pen=AP.rbNum(r.composite_penalty);
    if(pen==null||pen<0||pen>50)v.errs.push({sheet:'R2A_TIERS',row:r.__row,msg:'composite_penalty must be between 0 and 50.'});
    if(['Blocked','Retained','Eligible'].indexOf(AP.rbNorm(r.elite))<0)
      v.errs.push({sheet:'R2A_TIERS',row:r.__row,msg:'elite must be Blocked, Retained or Eligible.'});
  });

  (v.data.NBA_THRESHOLDS||[]).forEach(function(r){
    const k=AP.rbKey(r.setting_key);
    if(!(k in AP.NBA_T_DEFAULT)){
      v.errs.push({sheet:'NBA_THRESHOLDS',row:r.__row,msg:'setting_key "'+r.setting_key+'" is not one the engine reads.'});return}
    const x=AP.rbNum(r.value);
    if(x==null){v.errs.push({sheet:'NBA_THRESHOLDS',row:r.__row,msg:'value must be a number.'});return}
    /* name the percentage settings rather than pattern-matching the key —
       talk_target is minutes and att_zero is days */
    const PCT={att_target:1,att_risk:1,qa_target:1,qa_critical:1,qa_moderate_low:1,qa_moderate_high:1,
      target_ach:1,sales_critical_pct:1,sales_low_high_pct:1,sales_near_low_pct:1,sales_near_high_pct:1,
      cancel_watch_pct:1,r2a1_cfr_max:1,r2a2_cfr_min:1,r2a2_cfr_max:1,r2a3_cfr:1};
    if(PCT[k]&&(x<0||x>100))
      v.errs.push({sheet:'NBA_THRESHOLDS',row:r.__row,msg:'"'+k+'" is a percentage; it must be between 0 and 100.'});
    if(k==='pen_cap'&&x!==10)
      v.warns.push({sheet:'NBA_THRESHOLDS',row:r.__row,msg:'v3 §6 caps the compliance penalty at 10. Changing it departs from the framework.'});
  });

  v.ok=v.errs.length===0;
  return v;
};

/* ---- apply --------------------------------------------------------- */
AP.rbApplyBase=AP.rbApply;
AP.rbApply=function(v){
  const res=AP.rbApplyBase(v);
  const d=v.data;

  /* One weight, one place. The DRIVERS tab IS the composite scorecard, so the
     workbook has to write the definition the score is computed from — not just
     the list the screens read. Order follows the workbook. A driver the
     composite cannot measure is left out here; validate() warns about it. */
  if(AP.RATING_DEF&&AP.RATING_DEF.length){
    const byC={};AP.COMPOSITE_DEF.forEach(function(c){byC[c.k]=c});
    const kept=AP.RATING_DEF.filter(function(x){return byC[x.k]}).map(function(x){
      return {k:x.k,label:x.label||byC[x.k].label,w:x.w,note:byC[x.k].note}});
    if(kept.length)AP.COMPOSITE_DEF=kept;
  }

  if(d.TENURE_GROUPS&&d.TENURE_GROUPS.length){
    AP.TENURE_GROUPS=d.TENURE_GROUPS.filter(function(r){return AP.rbBool(r.enabled,true)}).map(function(r){
      const m={};
      if(AP.rbNorm(r.match_tenure))m.tenure=AP.rbNorm(r.match_tenure);
      if(AP.rbNorm(r.match_campaign))m.camp=AP.rbKey(r.match_campaign);
      return {key:AP.rbKey(r.group_key),label:AP.rbNorm(r.group_label),match:m,
        dailySales:AP.rbNum(r.daily_sales_target),minGwpSale:AP.rbNum(r.min_gwp_per_sale),
        convTarget:AP.rbNum(r.conversion_target)};
    });
  }
  if(d.NBA_LADDER&&d.NBA_LADDER.length){
    AP.NBA_ORDER={};AP.NBA_ON={};
    d.NBA_LADDER.forEach(function(r){
      const c=AP.rbNorm(r.rule_code);
      const rule=AP.NBA_RULES.find(function(x){return x.code===c});
      if(!rule)return;
      AP.NBA_ORDER[c]=AP.rbNum(r.order);
      AP.NBA_ON[c]=AP.rbBool(r.enabled,true);
      rule.level=AP.rbNum(r.level)||rule.level;
      rule.rule=AP.rbNorm(r.rule_name)||rule.rule;
      rule.triggerText=AP.rbNorm(r.trigger_text)||rule.triggerText;
      rule.action=AP.rbNorm(r.action)||rule.action;
      rule.owner=AP.rbNorm(r.owner)||rule.owner;
      rule.when=AP.rbNorm(r.when)||rule.when;
      rule.review=AP.rbNorm(r.review)||rule.review;
    });
  }
  if(d.R2A_TIERS&&d.R2A_TIERS.length){
    d.R2A_TIERS.forEach(function(r){
      const t=AP.rbNorm(r.tier);
      const num=function(f){return AP.rbNum(r[f])};
      if(t==='R2A-3'){if(num('fails_min')!=null)AP.NBA_T.r2a3_fails=num('fails_min');
        if(num('cfr_min')!=null)AP.NBA_T.r2a3_cfr=num('cfr_min');
        if(num('composite_penalty')!=null)AP.NBA_T.pen_r2a3=num('composite_penalty')}
      if(t==='R2A-2'){if(num('fails_min')!=null)AP.NBA_T.r2a2_fails_min=num('fails_min');
        if(num('fails_max')!=null)AP.NBA_T.r2a2_fails_max=num('fails_max');
        if(num('cfr_min')!=null)AP.NBA_T.r2a2_cfr_min=num('cfr_min');
        if(num('cfr_max')!=null)AP.NBA_T.r2a2_cfr_max=num('cfr_max');
        if(num('composite_penalty')!=null)AP.NBA_T.pen_r2a2=num('composite_penalty')}
      if(t==='R2A-1'){if(num('fails_min')!=null)AP.NBA_T.r2a1_fails=num('fails_min');
        if(num('cfr_max')!=null)AP.NBA_T.r2a1_cfr_max=num('cfr_max');
        if(num('composite_penalty')!=null)AP.NBA_T.pen_r2a1=num('composite_penalty')}
    });
  }
  if(d.NBA_THRESHOLDS&&d.NBA_THRESHOLDS.length){
    d.NBA_THRESHOLDS.forEach(function(r){
      const k=AP.rbKey(r.setting_key);
      if(k in AP.NBA_T_DEFAULT)AP.NBA_T[k]=AP.rbNum(r.value);
    });
  }
  AP.save();
  return res;
};

   groups, the ladder, the thresholds and the composite definition, so those
   are put back here. */

  const snap=JSON.parse(JSON.stringify({

    NBA_ORDER:AP.NBA_ORDER,NBA_ON:AP.NBA_ON,

      triggerText:r.triggerText,action:r.action,owner:r.owner,when:r.when,review:r.review}})}));
  try{ return AP.rbPreviewDiffBase(v); }
  finally{
    AP.COMPOSITE_DEF=snap.COMPOSITE_DEF;AP.TENURE_GROUPS=snap.TENURE_GROUPS;
    AP.NBA_T=snap.NBA_T;AP.NBA_ORDER=snap.NBA_ORDER;AP.NBA_ON=snap.NBA_ON;

    AP.NBA_RULES.forEach(function(r){const o=by[r.code];if(o)Object.assign(r,o)});
  }
};



/* =====================================================================
   THE COACHING LAYER — ThroughBalls cluster framework v1.0
   The seven NBA v3 metrics say WHAT is wrong. The coaching clusters say what
   has already been said about it, how often, and in what format. Together they
   decide the next best action for one named agent.

   Three things this layer holds:
     1. The taxonomy — four families, taken verbatim from the clustering
        framework so the dropdown a team leader sees and the cluster the engine
        reasons about are the same string.
     2. A counter per CB number — by coaching type and by cluster, inside a
        rolling window — which is what separates a first-time issue from a
        repeat and a repeat from a persistent one.
     3. The bridge — every cluster names the v3 driver it damages, so a coaching
        theme and a KPI gap can be argued about in the same sentence.

   Per the decision on the record: the composite stays seven metrics. A repeat
   cluster applies a capped adjustment the same way a critical fail does. It
   never re-weights the drivers.
   ===================================================================== */
