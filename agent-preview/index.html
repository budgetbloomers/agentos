<script type="application/json" id="cowork-artifact-meta">

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatterbox AgentOS — Analytics Command Centre</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0B1B33; --navy2:#0B1B33; --ink:#0B1B33; --body:#3B4A63; --muted:#5A6880;
  --line:#E3E9F3; --bg:#F4F6FA; --card:#FFFFFF;
  --blue:#1D4ED8; --blue-soft:#EAF1FF; --sky:#1D4ED8;
  --green:#0F7A43; --green-soft:#E6F6ED;
  --amber:#8A5300; --amber-soft:#FCF0DD;
  --red:#B42318; --red-soft:#FBE9E9;
  --violet:#0B1B33; --violet-soft:#EFEAFD;
  --radius:14px; --shadow:0 1px 2px rgba(15,30,54,.05),0 4px 14px rgba(15,30,54,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100vh}

/* ============ SIDEBAR ============ */
.sidebar{width:236px;min-width:236px;background:var(--navy);color:#C9D6EC;display:flex;flex-direction:column;padding:14px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo-card{background:#fff;border-radius:12px;padding:14px 12px;text-align:center;margin-bottom:16px}
.logo-img{width:100%;max-width:158px;display:block;margin:0 auto 2px}
.logo-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:13px;font-weight:600;letter-spacing:0;color:#8FA3C4;margin:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#C9D6EC;font-weight:600;font-size:13px;border:none;background:transparent;width:100%;text-align:left;transition:background .12s}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #fff}
.nav-item.soon{opacity:.45}
.nav-item .soon-tag{margin-left:auto;font-size:9px;background:rgba(255,255,255,.14);padding:2px 6px;border-radius:20px;font-weight:700;letter-spacing:.4px}
.sys-card{margin-top:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:11px 12px;font-size:12px}
.sys-card .t{font-weight:700;color:#E7EEFA;margin-bottom:5px}
.sys-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.user-card{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 10px;background:rgba(255,255,255,.05);border-radius:11px}
.user-av{width:32px;height:32px;border-radius:50%;background:#2E4670;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.user-nm{font-weight:700;font-size:12.5px;color:#EDF2FB}
.user-rl{font-size:10.5px;color:#8FA2C4}

/* ============ MAIN ============ */
.main{flex:1;padding:20px 24px 30px;min-width:0}
.topbar{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.3px}
.page-sub{color:var(--muted);font-size:13px;margin-top:2px}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--body)}
.ctrl select{border:none;outline:none;font-weight:600;color:var(--ink);background:transparent}
.ctrl input[type=date]{border:none;outline:none;color:var(--ink)}
.btn{border-radius:9px;padding:8px 14px;font-weight:700;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--body)}
.btn:hover{border-color:#C7D2E4}
.btn.primary{min-height:44px;padding:0 24px;font-size:15px;border-radius:8px;background:var(--blue);color:#fff;border:1px solid var(--blue);font-weight:700}
.btn.primary:hover{background:#1D4FD8}
.btn.danger{color:var(--red);border-color:#F1C6C6}
.btn.small{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Trust bar */
.trustbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:16px;box-shadow:var(--shadow)}
.trust-title{font-size:13px;font-weight:700;letter-spacing:0;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid transparent}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.g{background:var(--green-soft);color:var(--green)}.chip.g .dot{background:var(--green)}
.chip.a{background:var(--amber-soft);color:var(--amber)}.chip.a .dot{background:var(--amber)}
.chip.r{background:var(--red-soft);color:var(--red)}.chip.r .dot{background:var(--red)}
.chip.n{background:#EEF2F8;color:var(--muted)}.chip.n .dot{background:#A9B6CC}
.stale-banner{background:var(--amber-soft);border:1px solid #F2DDBB;color:var(--amber);border-radius:11px;padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:14px}
.demo-banner{background:var(--violet-soft);border:1px solid #DCD2F8;color:var(--violet);border-radius:11px;padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);position:relative;cursor:pointer;transition:transform .1s, box-shadow .1s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 3px 6px rgba(15,30,54,.07),0 8px 22px rgba(15,30,54,.08)}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.kpi-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.kpi-ic svg{width:16px;height:16px}
.kpi-name{font-size:12px;font-weight:700;color:var(--body);line-height:1.25}
.kpi-val{font-size:25px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:baseline;gap:5px}
.kpi-val .unit{font-size:13px;font-weight:700;color:var(--muted)}
.kpi-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:6px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:14px}
.delta.up{background:var(--green-soft);color:var(--green)}
.delta.down{background:var(--red-soft);color:var(--red)}
.delta.flat{background:#EEF2F8;color:var(--muted)}
.delta.bad-up{background:var(--red-soft);color:var(--red)}
.delta.good-down{background:var(--green-soft);color:var(--green)}
.asof{font-size:10.5px;color:var(--muted);font-weight:600}
.spark{height:26px;width:82px;flex:none}
.rag-dot{position:absolute;top:13px;right:13px;width:9px;height:9px;border-radius:50%}
.rag-dot.g{background:var(--green)}.rag-dot.a{background:var(--amber)}.rag-dot.r{background:var(--red)}.rag-dot.n{background:#D4DCE9}

/* Cards / sections */
.grid{display:grid;gap:14px;margin-bottom:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h .t{font-size:14.5px;font-weight:800}
.card-h .s{font-size:11.5px;color:var(--muted);font-weight:600}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.info{width:15px;height:15px;border-radius:50%;background:#EDF1F8;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;cursor:help;flex:none}
.chart-wrap{position:relative;height:250px}
.chart-wrap.tall{height:300px}.chart-wrap.short{height:200px}

/* Tables */
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:13px;letter-spacing:0;color:var(--muted);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.noclick{cursor:default}
.tbl td{padding:8px 9px;border-bottom:1px solid #EEF2F8;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#F7FAFE}
.pill{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:14px;white-space:nowrap}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.b{background:var(--blue-soft);color:var(--blue)}
.pill.v{background:var(--violet-soft);color:var(--violet)}
.pill.n{background:#EEF2F8;color:var(--muted)}
.rank{width:22px;height:22px;border-radius:50%;background:#EEF2F8;color:var(--body);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
.bar-cell{display:flex;align-items:center;gap:8px}
.bar-track{flex:1;height:6px;background:#EDF1F8;border-radius:4px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:4px;background:var(--blue)}
.nut-row{display:flex;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid #EEF2F8;cursor:pointer;border-radius:8px}
.nut-row:last-child{border-bottom:none}
.nut-row:hover{background:#F7FAFE}
.nut-ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.nut-ic svg{width:16px;height:16px}
.nut-name{font-weight:800;min-width:158px;font-size:13px}
.nut-sent{color:var(--body);font-size:12.5px;flex:1;line-height:1.45}
.th-in{width:78px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.th-in:focus{border-color:var(--blue);outline:none}
.modal.xl{width:min(1140px,96vw);max-height:92vh;overflow-y:auto}
.alink{cursor:pointer;border-bottom:1px dashed transparent}
.alink:hover{color:var(--blue);border-bottom-color:var(--blue)}
.ac-head{background:var(--navy);color:#fff;border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ac-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 14px;text-align:center}
.ac-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:14px}
.ac-tile{border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;background:#fff}
.ac-tile.watch{background:#FFF7E0;border-color:#F0D48A}
.ac-tile.fail{background:#FDECEC;border-color:#F2B8B8}
.ac-big{font-size:23px;font-weight:800}
.ac-sub{font-size:10.5px;color:var(--muted);margin:2px 0 7px;line-height:1.35}
.ac-sec{background:var(--navy);color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px;padding:6px 10px;border-radius:8px;margin:0 0 8px}
.ac-bar{height:16px;border-radius:4px;display:flex;overflow:hidden;font-size:10px;color:#fff;margin-bottom:6px}
.ac-bar span{display:flex;align-items:center;padding-left:6px;white-space:nowrap;overflow:hidden}
.exv{font-size:9.5px;color:var(--muted);font-weight:600;line-height:1.25}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;font-weight:800;color:var(--body);margin-bottom:5px}

/* Upload center */
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px;margin-bottom:16px}
.slot{background:#fff;border:1.5px dashed #C6D2E6;border-radius:var(--radius);padding:15px;transition:border-color .12s,background .12s}
.slot.drag{border-color:var(--blue);background:var(--blue-soft)}
.slot-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.slot-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.slot-ic svg{width:17px;height:17px}
.slot-t{font-weight:800;font-size:13.5px}
.slot-s{font-size:11px;color:var(--muted);font-weight:600}
.slot-meta{font-size:11.5px;color:var(--muted);margin:7px 0 10px;line-height:1.5}
.slot-foot{display:flex;gap:8px;align-items:center}
.file-note{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,23,48,.5);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:50;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:860px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(10,23,48,.3)}
.modal.narrow{max-width:640px}
.modal-h{display:flex;align-items:center;margin-bottom:14px}
.modal-h .t{font-size:17px;font-weight:800}
.modal-x{margin-left:auto;border:none;background:#EEF2F8;width:28px;height:28px;border-radius:50%;font-size:14px;font-weight:800;color:var(--body)}
.vh{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.prev-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.prev-wrap table{font-size:11px;border-collapse:collapse;min-width:100%}
.prev-wrap th{background:#F5F8FC;padding:6px 8px;text-align:left;font-weight:800;color:var(--body);white-space:nowrap;border-bottom:1px solid var(--line)}
.prev-wrap td{padding:5px 8px;border-bottom:1px solid #F0F4F9;white-space:nowrap;color:var(--body)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.field{margin-bottom:11px}
.field label{display:block;font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;background:#fff;color:var(--ink)}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field .hint{font-size:11px;color:var(--muted);margin-top:3px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}

/* Toast */
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--navy);color:#fff;padding:11px 15px;border-radius:11px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(10,23,48,.3);max-width:340px;animation:tin .18s ease}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Dictionary */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;font-weight:700;font-size:12.5px;color:var(--body)}
.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}
.rule-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rtag{background:var(--blue-soft);color:var(--blue);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:14px;display:inline-flex;gap:6px;align-items:center}
.rtag button{border:none;background:transparent;color:inherit;font-weight:800;font-size:12px;padding:0}
.footer-note{color:var(--muted);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px solid var(--line);margin-top:8px}
.footer-note .right{margin-left:auto;display:flex;gap:12px;align-items:center}
.switch{position:relative;width:34px;height:19px;display:inline-block;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch .tr{position:absolute;inset:0;background:#CBD5E4;border-radius:20px;transition:.15s}
.switch .tr:before{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.switch input:checked + .tr{background:var(--blue)}
.switch input:checked + .tr:before{transform:translateX(15px)}
.guide h2{font-size:17px;font-weight:800;margin:20px 0 8px}
.guide h3{font-size:14px;font-weight:800;margin:14px 0 6px}
.guide p,.guide li{font-size:13px;color:var(--body);line-height:1.65}
.guide ol,.guide ul{padding-left:20px;margin:6px 0}
.guide .callout{background:var(--blue-soft);border:1px solid #D4E2FB;border-radius:11px;padding:11px 14px;margin:10px 0;font-size:12.5px;color:#1D4FD8;font-weight:600}
.guide .callout.warn{background:var(--amber-soft);border-color:#F2DDBB;color:var(--amber)}
.guide table{margin:8px 0}
kbd{background:#EEF2F8;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700}
@media(max-width:1080px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}
@media(max-width:860px){.sidebar{position:fixed;left:-240px;z-index:60;transition:left .18s}.sidebar.open{left:0}.main{padding:14px}.menu-btn{display:inline-flex}}
.menu-btn{display:none;align-items:center;justify-content:center}
/* ===== MY DAILY PLAYS / TEAM PERFORMANCE CONTROL ROOM ===== */
.ap-switch{padding:10px 12px 12px;margin:2px 10px 8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:11px}
.ap-switch-k{font-size:13px;letter-spacing:0;font-weight:600;color:#8FA3C4;margin-bottom:6px}
.ap-seg{display:flex;background:rgba(0,0,0,.22);border-radius:8px;padding:2px;margin-bottom:7px}
.ap-seg button{flex:1;border:none;background:transparent;color:#A9BBD8;font-size:11.5px;font-weight:800;padding:6px 4px;border-radius:6px}
.ap-seg button.on{background:var(--navy);color:#fff}
.ap-sel{width:100%;background:rgba(0,0,0,.24);color:#DCE6F7;border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:6px 7px;font-size:11.5px;font-weight:600}
.ap-sel option{background:#0E2244;color:#DCE6F7}
.ap-badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;border-radius:9px;padding:1px 5px;min-width:16px}
.ap-persona{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);flex-wrap:wrap}
.ap-persona-n{font-size:16px;font-weight:800}
.ap-persona-s{font-size:11.5px;color:var(--muted);font-weight:600}
.ap-persona-r{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-right:6px}
.ap-av{width:36px;height:36px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex:none}
.ap-av.big{width:46px;height:46px;font-size:15px;border-radius:12px;background:linear-gradient(135deg,var(--blue),#4F7DF3);color:#fff}
.ap-hero{background:linear-gradient(135deg,var(--navy),#16386E);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.ap-hero-msg{font-size:16.5px;font-weight:700;line-height:1.55;max-width:900px}
.ap-hero-meta{font-size:11px;color:#A9BBD8;margin-top:8px;font-weight:600}
.ap-hero-meta .ap-cite{color:#8FA3C4}
.ap-callout{border-radius:12px;padding:11px 14px;font-size:12.5px;line-height:1.6;margin-bottom:14px;border:1px solid}
.ap-callout.b{background:var(--blue-soft);border-color:#CFE0FF;color:#123A86}
.ap-callout.a{background:var(--amber-soft);border-color:#F0DDBC;color:#7A3E06}
.ap-callout.r{background:var(--red-soft);border-color:#F1C6C6;color:#8E1F1F}
.ap-callout.v{background:var(--violet-soft);border-color:#DCD2FA;color:#4A2FA8}
.ap-callout .btn{margin-left:8px}
.ap-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;margin-bottom:14px}
.ap-tiles.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ap-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow)}
.ap-tile.good{border-color:#BFE6CF;background:linear-gradient(180deg,#F4FBF7,#fff)}
.ap-tile.money{border-color:#CFE0FF;background:linear-gradient(180deg,#F5F8FF,#fff)}
.ap-tile.warn{border-color:#F0DDBC;background:linear-gradient(180deg,#FFFBF4,#fff)}
.ap-tile.bad{border-color:#F1C6C6;background:linear-gradient(180deg,#FFF6F6,#fff)}
.ap-tile-k{font-size:13px;letter-spacing:0;font-weight:600;color:var(--muted);margin-bottom:5px}
.ap-tile-v{font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.ap-tile-s{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;line-height:1.45}
.ap-of{font-size:13px;color:var(--muted);font-weight:700}
.ap-bar{height:6px;border-radius:4px;background:#EEF2F8;margin-top:8px;overflow:hidden}
.ap-bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.ap-k{font-size:13px;letter-spacing:0;font-weight:600;color:var(--muted);margin-bottom:3px}
.ap-k.light{color:#A9BBD8}
.ap-big{font-size:14px;font-weight:700;line-height:1.55;color:var(--ink)}
.ap-sub{font-size:12.5px;color:var(--body);line-height:1.6;margin-top:7px}
.ap-good{border-left:4px solid var(--green)}
.ap-need{border-left:4px solid var(--amber)}
.ap-infer{font-size:11.5px;color:var(--violet);background:var(--violet-soft);border-radius:8px;padding:7px 9px;margin-top:8px;font-weight:600;line-height:1.5}
.ap-infer-i{color:var(--violet);font-weight:700}
.ap-cite{font-size:10.5px;color:var(--muted);font-weight:600}
.ap-empty{font-size:12.5px;color:var(--muted);padding:14px;text-align:center;background:#F7FAFE;border-radius:10px;font-weight:600}
.ap-rule{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.ap-play{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:11px;background:#fff}
.ap-play.done{background:#F8FBF9;border-color:#CFE9DA}
.ap-play-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ap-play-n{font-size:13px;font-weight:700;letter-spacing:0;color:#fff;background:var(--navy);padding:3px 8px;border-radius:6px}
.ap-play-t{font-size:14px;font-weight:800}
.ap-play-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;font-size:12px;color:var(--body);margin-bottom:9px}
.ap-play-why{font-size:12.5px;line-height:1.6;color:var(--body);background:#F7FAFE;border-radius:9px;padding:8px 10px;margin-bottom:7px}
.ap-play-do{font-size:12.5px;line-height:1.6;color:var(--ink);background:var(--blue-soft);border-radius:9px;padding:8px 10px;margin-bottom:7px}
.ap-play-money{font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:9px;padding:7px 10px;margin-bottom:7px}
.ap-play-res{font-size:12.5px;font-weight:700;border-radius:9px;padding:8px 10px;margin-bottom:7px}
.ap-play-res.good{background:var(--green-soft);color:var(--green)}
.ap-play-res.flat{background:var(--red-soft);color:var(--red)}
.ap-play-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ap-exp td{font-size:11.5px;color:var(--muted);background:#F9FBFE;padding-top:4px!important;padding-bottom:8px!important}
.ap-money-hero{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;background:linear-gradient(135deg,var(--navy),#1B4A8F);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.ap-mh-v{font-size:34px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.ap-mh-s{font-size:12px;color:#C3D3EC;margin-top:7px;line-height:1.55;font-weight:600}
.ap-mh-s b{color:#fff}
.ap-prog{position:relative;height:26px;background:rgba(0,0,0,.28);border-radius:14px;overflow:hidden;margin-top:8px}
.ap-prog i{display:block;height:100%;background:linear-gradient(90deg,#22C55E,#4ADE80);border-radius:14px}
.ap-prog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#fff}
.ap-rules-x{font-size:11.5px;color:var(--body);line-height:1.7;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.ap-rules-x div{margin-bottom:4px}
.ap-reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ap-reason{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:12.5px;font-weight:700;color:var(--ink)}
.ap-reason:hover{border-color:var(--blue);background:var(--blue-soft)}
.ap-req,.ap-coach{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;background:#fff}
.ap-req.od{border-color:#F1C6C6;background:#FFFAFA}
.ap-req.disp{border-left:4px solid var(--red)}
.ap-coach.done{background:#F8FBF9;border-color:#CFE9DA}
.ap-req-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;font-size:13px}
.ap-req-n{font-size:12.5px;line-height:1.6;color:var(--body);background:#F7FAFE;border-radius:9px;padding:8px 10px;margin-bottom:7px}
.ap-req-n.ok{background:var(--green-soft);color:var(--green)}
.ap-req-n.bad{background:var(--red-soft);color:var(--red)}
.ap-attach{background:#F7FAFE;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:11px;font-size:11.5px;color:var(--body);line-height:1.75}
.ap-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink);background:#fff}
.ap-input:focus{outline:none;border-color:var(--blue)}
.ap-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}
.ap-opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ap-opts.row{flex-direction:row;flex-wrap:wrap}
.ap-opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.ap-opt:hover{border-color:var(--blue);background:var(--blue-soft)}
.ap-guard{font-size:11.5px;color:var(--violet);background:var(--violet-soft);border-radius:9px;padding:8px 11px;margin-top:11px;font-weight:600;line-height:1.55}
.ap-ba{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;background:#F7FAFE;border-radius:9px;padding:8px 10px;margin-top:7px}
.ap-notes{margin-top:8px;font-size:12px;color:var(--body);line-height:1.6}
.ap-notes div{margin-bottom:4px}
.ap-trends{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ap-trend{border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.ap-trend-v{font-size:14px;font-weight:800;margin-top:4px}
.ap-spark{width:100%;height:26px;display:block;margin-top:4px}
.ap-queue{display:flex;flex-direction:column;gap:7px}
.ap-q{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600;flex-wrap:wrap;min-width:0}
.ap-q>*{min-width:0}
.ap-q.bad{border-color:#F1C6C6;background:#FFFAFA}
.ap-q span:nth-child(2){flex:1 1 140px;min-width:0}
.ap-q .btn{margin-left:auto}
.ap-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ap-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;box-shadow:var(--shadow)}
.ap-card.r{border-top:3px solid var(--red)}.ap-card.a{border-top:3px solid var(--amber)}
.ap-card.b{border-top:3px solid var(--blue)}.ap-card.g{border-top:3px solid var(--green)}
.ap-card-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ap-card-n{font-size:13.5px;font-weight:800}
.ap-card-kpi{display:flex;gap:12px;font-size:12px;color:var(--body);flex-wrap:wrap}
.ap-card-gap{font-size:12px;color:var(--body);margin-top:8px;line-height:1.5}
.ap-card-gap.ok{color:var(--green);font-weight:700}
.ap-card-dg{font-size:11.5px;color:var(--muted);margin-top:3px}
.ap-card-money{font-size:11.5px;font-weight:700;color:var(--green);margin-top:7px;line-height:1.5}
.ap-card-st{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.ap-card-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ap-pickrow{display:flex;gap:8px;flex-wrap:wrap}
.ap-pick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px 11px 7px 8px;font-size:12px}
.ap-pick.on{border-color:var(--blue);background:var(--blue-soft)}
.ap-pick span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.3}
.ap-pick small{font-size:10.5px;color:var(--muted);font-weight:700}
.ap-rec{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.ap-rec.rej{opacity:.62;background:#FAFBFD}
.ap-rec-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px;font-size:13.5px}
.ap-rec-n{width:22px;height:22px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex:none}
.ap-block{font-size:11.5px;color:var(--red);background:var(--red-soft);border-radius:8px;padding:7px 10px;margin-top:8px;font-weight:700}
.ap-diag{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.ap-diag-row{display:flex;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid #EEF2F8;font-size:12.5px;flex-wrap:wrap}
.ap-diag-row:last-child{border-bottom:none}
.ap-diag-row .ap-k{min-width:190px;margin:0}
.ap-evid{display:flex;flex-direction:column;gap:8px;margin-top:9px}
.ap-ev{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.55}
.ap-ev .pill{flex:none}
.ap-routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:7px;margin-top:6px}
.ap-route{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
.ap-route:hover{border-color:var(--blue);background:var(--blue-soft)}
.ap-route span{display:flex;flex-direction:column;font-size:12.5px;line-height:1.4}
.ap-route small{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
.ap-lock{font-size:11px;color:var(--amber);font-weight:800;background:var(--amber-soft);border-radius:8px;padding:5px 9px}
.ap-narr{font-size:14.5px;font-weight:700;line-height:1.6;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.ap-notif{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #EEF2F8;padding:10px 2px;font-size:12.5px}
.ap-notif.read{opacity:.55}
.ap-notif-i{font-size:15px;flex:none}
.ap-notif-d{font-size:11.5px;color:var(--body);margin-top:2px;line-height:1.5}
.ap-nik-out{min-height:100px;max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:12px;background:#F9FBFE;margin-bottom:10px}
.ap-nik-q{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:7px}
.ap-nik-a{font-size:12.5px;line-height:1.65;color:var(--body)}
.ap-nik-a p{margin-bottom:8px}
.ap-nik-a b{color:var(--ink)}
.ap-nik-guard{font-size:11.5px;color:var(--violet);background:var(--violet-soft);border-radius:9px;padding:8px 11px;margin-bottom:10px;font-weight:600;line-height:1.55}
.ap-chipwrap{display:flex;gap:6px;flex-wrap:wrap}
.ap-qchip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 11px;font-size:11.5px;font-weight:700;color:var(--body)}
.ap-qchip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.ap-ol{margin:0 0 8px 18px;font-size:12.5px;line-height:1.7}
#page,#page .card,.ap-play,.ap-req,.ap-coach,.ap-rec,.ap-card,.ap-tile,.ap-diag{min-width:0}
#page .card{overflow-wrap:anywhere}
.ap-req-h,.ap-play-h,.ap-rec-h,.ap-card-kpi,.ap-ba,.ap-play-btns,.ap-card-btns{min-width:0}
.ap-persona,.ap-diag-row,.ap-ev{min-width:0}
@media(max-width:900px){
  .ap-money-hero{grid-template-columns:1fr;gap:14px}
  .ap-q .btn{margin-left:0}
  .ap-q span:nth-child(2){flex:1 1 100%}
  .ap-persona-r .btn{flex:1 1 auto}
  .ap-tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .ap-cards{grid-template-columns:1fr}
  #page table.tbl{display:block;overflow-x:auto;white-space:nowrap}
  .ap-persona-r{margin-left:0;width:100%}
  .ap-2col{grid-template-columns:1fr}
  .ap-hero-msg{font-size:15px}
  .ap-mh-v{font-size:28px}
  .ap-diag-row .ap-k{min-width:0}
  .ap-play-btns .btn,.ap-card-btns .btn{flex:1 1 auto;min-height:38px}
  .ap-reason{min-height:44px}
}

/* ===== FAMILIAR FLOOR EXPERIENCE ===== */
.ap-i{width:16px;height:16px;flex:none;vertical-align:-3px}
.ap-i.xl{width:34px;height:34px}
.btn.big{padding:12px 20px;font-size:14px;border-radius:11px;min-height:46px}
.ap-greet{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--navy),#17427F);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;flex-wrap:wrap}
.ap-greet.slim{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.ap-greet-l{display:flex;align-items:center;gap:13px;min-width:0}
.ap-greet-n{font-size:21px;font-weight:800;line-height:1.15}
.ap-greet-s{font-size:12px;font-weight:600;color:#B9CBE6;margin-top:2px}
.ap-greet.slim .ap-greet-s{color:var(--muted)}
.ap-greet-m{font-size:14px;font-weight:700;margin-top:7px;line-height:1.5;max-width:760px}
.ap-greet-r{margin-left:auto;display:flex;gap:8px;padding-right:6px}
.ap-greet .ap-av.big{background:rgba(255,255,255,.16);color:#fff}
.ap-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.ap-panel.money{background:linear-gradient(135deg,#0C2A55,#1A56A8);color:#fff;border:none}
.ap-panel.money .ap-panel-h{color:#CFE0FF}
.ap-panel.warn{border-color:#F0DDBC;background:linear-gradient(180deg,#FFFBF4,#fff)}
.ap-panel.wait{border-color:#CFE0FF;background:linear-gradient(180deg,#F5F8FF,#fff)}
.ap-panel.good{border-color:#BFE6CF;background:linear-gradient(180deg,#F5FBF7,#fff)}
.ap-panel.nik{border-left:4px solid var(--violet)}
.ap-panel-h{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:0;font-weight:700;color:var(--ink);margin-bottom:10px;flex-wrap:wrap}
.ap-explain{font-style:normal;text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:600;color:var(--muted);margin-left:auto}
.ap-panel-s{font-size:13.5px;line-height:1.6;color:var(--body)}
.ap-panel.money .ap-panel-s{color:#C9DAF5}
.ap-panel-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ap-money-v{font-size:40px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.ap-money-v small{font-size:15px;font-weight:700;color:#A9C4EA}
.ap-money-s{font-size:13.5px;color:#C9DAF5;margin-top:6px;line-height:1.55;max-width:640px}
.ap-money-f{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#A9C4EA;margin-top:6px;flex-wrap:wrap;gap:8px}
.ap-panel.money .ap-bar.big{background:rgba(255,255,255,.16)}
.ap-panel.money .ap-bar.big i{background:linear-gradient(90deg,#34D399,#6EE7B7)}
.ap-panel.money .btn.primary{margin-top:12px;background:#fff;color:var(--navy);border-color:#fff}
.ap-bar.big{height:10px;border-radius:6px;background:#EDF1F7;margin-top:10px;overflow:hidden}
.ap-bar.big i{display:block;height:100%;border-radius:6px;background:var(--blue);transition:width .6s cubic-bezier(.2,.7,.3,1)}
.ap-bar.big i.g{background:var(--green)}.ap-bar.big i.a{background:var(--amber)}
.ap-big-v{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.ap-big-v small{font-size:14px;font-weight:700;color:var(--muted)}
/* action card */
.ap-action{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:14px;padding:15px 16px;background:#fff}
.ap-action.amber{border-left-color:var(--amber)}.ap-action.red{border-left-color:var(--red)}
.ap-action.grey{border-left-color:#A9B6CC;background:#FAFBFD}
.ap-action.done{border-left-color:var(--green);background:#F7FCF9}
.ap-action-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.ap-action-n{font-size:13px;font-weight:700;letter-spacing:0;color:#fff;background:var(--navy);padding:4px 10px;border-radius:7px}
.ap-action-n.light{background:#EEF2F8;color:var(--muted)}
.ap-action-t{font-size:18px;font-weight:800;line-height:1.3;margin-bottom:7px}
.ap-action-w{font-size:13.5px;color:var(--body);line-height:1.6;margin-bottom:8px}
.ap-action-d{font-size:13.5px;color:var(--ink);background:var(--blue-soft);border-radius:10px;padding:10px 12px;line-height:1.6;font-weight:600}
.ap-action-btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px;align-items:center}
.ap-after{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600}
.ap-timer{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap}
.ap-timer.blue{background:var(--blue-soft);color:var(--blue)}
.ap-timer.amber{background:var(--amber-soft);color:var(--amber)}
.ap-timer.red{background:var(--red-soft);color:var(--red)}
.ap-timer.grey{background:#EEF2F8;color:var(--muted)}
.ap-timer.sm{font-size:11px;padding:3px 8px}
.ap-own{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;background:#EEF2F8;color:var(--muted);margin-left:auto}
.ap-own.you{background:var(--green-soft);color:var(--green)}
.ap-own.tl{background:var(--violet-soft);color:var(--violet)}
.ap-own.tech,.ap-own.coach{background:var(--amber-soft);color:var(--amber)}
/* second action, deliberately lighter */
.ap-mini{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#FBFCFE}
.ap-mini-h{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;flex-wrap:wrap}
.ap-mini-t{font-size:13.5px;font-weight:700;flex:1;min-width:0}
.ap-mini-x{font-size:17px;color:var(--muted);font-weight:800;width:18px;text-align:center}
.ap-mini-b{padding:0 13px 13px}
.ap-mini.open{background:#fff}
/* completion + level */
.ap-done-pop,.ap-level{position:fixed;left:50%;bottom:34px;transform:translate(-50%,26px);opacity:0;display:flex;gap:13px;align-items:center;
  background:var(--green);color:#fff;padding:14px 20px;border-radius:14px;box-shadow:0 12px 34px rgba(15,30,54,.26);z-index:120;max-width:min(560px,92vw);
  transition:opacity .32s ease,transform .32s cubic-bezier(.2,.7,.3,1)}
.ap-level{background:linear-gradient(135deg,#0C6E3F,#12A05C)}
.ap-done-pop.go,.ap-level.go{opacity:1;transform:translate(-50%,0)}
.ap-done-pop b,.ap-level b{font-size:15px}
.ap-done-pop div div,.ap-level div div{font-size:13px;opacity:.94}
.ap-done-pop small{display:block;font-size:11.5px;opacity:.82;margin-top:3px}
.ap-done-i,.ap-level-i{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.ap-done-i .ap-i,.ap-level-i .ap-i{width:20px;height:20px}
/* help */
.ap-helpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.ap-helpbtn{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 15px;font-size:14px;font-weight:700;color:var(--ink);min-height:52px}
.ap-helpbtn:hover{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.ap-sent{display:flex;gap:13px;align-items:flex-start;background:var(--blue-soft);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6}
.ap-sent .ap-i{width:26px;height:26px;color:var(--blue)}
.ap-sent b{font-size:15px}
/* line lists */
.ap-lines{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ap-line{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid #EEF2F8;font-size:13.5px}
.ap-line:last-child{border-bottom:none}
.ap-line span{color:var(--body)}
.ap-line b{text-align:right;font-variant-numeric:tabular-nums}
.ap-line.calc{background:#F7FAFE}
/* progress dots */
.ap-dots{display:flex;gap:12px;margin:4px 0 10px}
.ap-dot{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--muted)}
.ap-dot i{width:15px;height:15px;border-radius:50%;border:2px solid #D8E1EE;background:#fff;display:block}
.ap-dots.big .ap-dot i{width:22px;height:22px}
.ap-dot.done i{background:var(--green);border-color:var(--green)}
.ap-dot.protected i{background:#EEF2F8;border-color:#C6D2E3;border-style:dashed}
.ap-imp{display:flex;gap:9px;align-items:flex-start;background:var(--green-soft);color:var(--green);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;margin-top:9px;line-height:1.5}
.ap-act{border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.ap-act-n{font-size:16px;font-weight:800;margin-top:3px}
.ap-sess{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.ap-mid{display:flex;gap:13px;align-items:flex-start;background:var(--blue-soft);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.6}
.ap-mid .ap-i{width:24px;height:24px;color:var(--blue);flex:none}
.ap-eos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.ap-eos-c{border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.ap-eos-c.money{background:linear-gradient(180deg,#F5F8FF,#fff);border-color:#CFE0FF}
.ap-eos-v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.ap-eos-k{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.ap-tt{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ap-ring{position:relative;width:96px;height:96px;flex:none}
.ap-ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ap-ring-bg{fill:none;stroke:#EDF1F7;stroke-width:8}
.ap-ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.3,1)}
.ap-ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ap-ring-t b{font-size:15px;font-weight:800}
.ap-ring-t small{font-size:9.5px;color:var(--muted);font-weight:700;max-width:74px;line-height:1.2}
/* team leader */
.ap-three{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px;margin-bottom:14px}
.ap-tnum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.ap-tnum.urgent{border-color:#F1C6C6;background:linear-gradient(180deg,#FFF7F7,#fff)}
.ap-tnum-v{font-size:32px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.ap-tnum-k{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.ap-tnum .btn{margin-top:12px;width:100%}
.ap-hrow{display:flex;gap:13px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:9px;flex-wrap:wrap}
.ap-hrow.urgent{border-color:#F1C6C6;background:#FFFAFA}
.ap-hrow.warm{border-color:#F0DDBC;background:#FFFDF8}
.ap-hrow-m{flex:1;min-width:180px}
.ap-hrow-n{font-size:14.5px;font-weight:800}
.ap-hrow-n .ap-cite{font-weight:600}
.ap-hrow-p{font-size:13.5px;font-weight:700;color:var(--ink);margin-top:3px}
.ap-hrow-k{font-size:12px;color:var(--muted);margin-top:2px}
.ap-hrow-s{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--blue);font-weight:700;margin-top:6px}
.ap-hrow-r{display:flex;gap:9px;align-items:center;margin-left:auto;flex-wrap:wrap}
.ap-hrow-t{font-size:12px;color:var(--muted);font-weight:700}
.ap-hd{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.ap-steps{display:flex;gap:7px;margin-bottom:14px}
.ap-steps i{height:4px;flex:1;border-radius:3px;background:#E3E9F3}
.ap-steps i.on{background:var(--blue)}
.ap-picks{display:flex;flex-direction:column;gap:9px}
.ap-pickrow2{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer}
.ap-pickrow2:hover{border-color:var(--blue);background:var(--blue-soft)}
.ap-pickrow2 span{display:flex;flex-direction:column;gap:3px;min-width:0}
.ap-pickrow2 b{font-size:14px}
.ap-pickrow2 small{font-size:12.5px;color:var(--muted);line-height:1.5}
.ap-recby{font-style:normal;font-size:10.5px;font-weight:800;color:var(--violet);background:var(--violet-soft);border-radius:12px;padding:2px 9px;align-self:flex-start}
/* walkthrough */
.ap-walk{text-align:center;padding:12px 8px 4px}
.ap-walk .ap-i{color:var(--blue);margin-bottom:12px}
.ap-walk-n{font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted)}
.ap-walk-t{font-size:23px;font-weight:800;margin-top:7px}
.ap-walk-b{font-size:14.5px;color:var(--body);margin-top:9px;line-height:1.6;max-width:400px;margin-left:auto;margin-right:auto}
.ap-walk-d{display:flex;gap:7px;justify-content:center;margin:18px 0}
.ap-walk-d i{width:8px;height:8px;border-radius:50%;background:#DCE4EF}
.ap-walk-d i.on{background:var(--blue);width:22px;border-radius:5px}
.ap-walk .btn{width:100%;max-width:280px}
.ap-wait-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}
@media(max-width:900px){
  .ap-greet-n{font-size:18px}.ap-money-v{font-size:32px}.ap-big-v{font-size:24px}
  .ap-greet-r{margin-left:0;width:100%}
  .ap-action-t{font-size:16px}
  .ap-action-btns .btn{flex:1 1 auto}
  .ap-own{margin-left:0}
  .ap-hrow-r{margin-left:0;width:100%}
  .ap-hrow-r .btn{flex:1}
  .ap-tnum .btn{min-height:44px}
  .ap-helpbtn{min-height:56px}
}

/* =====================================================================
   DESIGN QUALITY OPERATING SYSTEM — desktop Agent and Team Leader views
   3 primary actions · 6 secondary elements · 9 interactive elements
   Four type sizes per screen. Strict 8pt spacing. Blue means action only.
   ===================================================================== */
:root{
  --dq-navy:#0B1B33;      /* structure and navigation */
  --dq-blue:#1D4ED8;      /* primary action only */
  --dq-surface:#FFFFFF;   /* main surface */
  --dq-bg:#F4F6FA;        /* background layer */
  --dq-line:#E1E7F0;
  --dq-ink:#0C1729;
  --dq-body:#3C4A61;
  --dq-muted:#5A6880;
  --dq-green:#0F7A43;     /* success only */
  --dq-amber:#8A5300;     /* attention required */
  --dq-red:#B42318;       /* urgent failure only */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px;
}
/* four sizes per screen: 36 / 19 / 15 / 13 */
.dq-num{font-size:36px;line-height:1.05;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.dq-h{font-size:19px;line-height:1.35;font-weight:700;letter-spacing:-.2px}
.dq-b{font-size:15px;line-height:1.6;font-weight:400;color:var(--dq-body)}
.dq-s{font-size:13px;line-height:1.5;font-weight:500;color:var(--dq-muted)}
.dq-b strong,.dq-s strong{font-weight:700;color:var(--dq-ink)}

.dq{max-width:1080px;margin:0 auto;padding-bottom:var(--s5);font-size:15px;color:var(--dq-ink)}
.dq button,.dq div,.dq span{font-size:inherit}
.dq .dq-num{font-size:36px}.dq .dq-h,.dq .dq-act-t,.dq .dq-card-n{font-size:19px}
.dq .dq-s,.dq .dq-label,.dq .dq-link,.dq .dq-state,.dq .dq-row-k,.dq .dq-row-x,.dq .dq-sum-v,.dq .dq-sum-x,.dq .dq-wait,.dq .dq-q-s,.dq .dq-top-m,.dq .dq-split-k,.dq .dq-money-tag,.dq .dq-sec-h,.dq .dq-note,.dq .dq-calc{font-size:13px}
.dq .dq-money .dq-num{font-size:40px}.dq .dq-split-v,.dq .dq-top-n{font-size:19px}
.dq *{box-sizing:border-box}
/* top bar — information only, never interactive */
.dq-top{display:flex;align-items:center;gap:var(--s2);padding:0 0 var(--s3);border-bottom:1px solid var(--dq-line);margin-bottom:var(--s3)}
.dq-top-id{width:44px;height:44px;border-radius:8px;background:var(--dq-navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.dq-top-n{font-size:19px;font-weight:700;line-height:1.3;color:var(--dq-ink)}
.dq-top-m{font-size:13px;color:var(--dq-muted);font-weight:500;margin-top:2px}
.dq-top-m span+span:before{content:"·";margin:0 8px;color:#B9C4D6}

/* anchors */
.dq-anchor{background:var(--dq-surface);border:1px solid var(--dq-line);border-radius:12px;padding:var(--s3);margin-bottom:var(--s2)}
.dq-anchor.lead{background:var(--dq-navy);border-color:var(--dq-navy);color:#fff;padding:var(--s4)}
.dq-anchor.lead .dq-b{color:#C2CEE0}
.dq-anchor.lead .dq-s{color:#93A3BC}
.dq-anchor.focus{border-color:#C9D6EC;box-shadow:inset 3px 0 0 var(--dq-blue)}
.dq-anchor.quiet{background:transparent;border-style:dashed}
.dq-label{font-size:13px;font-weight:600;color:var(--dq-muted);margin-bottom:var(--s1)}
.dq-anchor.lead .dq-label{color:#93A3BC}

/* commission anchor */
.dq-money{display:flex;align-items:flex-end;gap:var(--s2);flex-wrap:wrap}
.dq-money .dq-num{font-size:40px;color:#fff}
.dq-money-tag{font-size:13px;font-weight:600;color:#93A3BC;padding-bottom:6px}
.dq-split{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid rgba(255,255,255,.14)}
.dq-split-k{font-size:13px;color:#93A3BC;font-weight:500;margin-bottom:6px}
.dq-split-v{font-size:19px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.dq-meter{height:6px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:10px;overflow:hidden}
.dq-meter i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .4s ease}
.dq-meter.ok i{background:#4ADE80}
.dq-calc{margin-top:var(--s3);font-size:13px}
.dq-link{background:none;border:none;padding:0;font-size:13px;font-weight:600;color:var(--dq-blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.dq-anchor.lead .dq-link{color:#9DC1FF}
.dq-link:hover{color:var(--dq-ink)}
.dq-anchor.lead .dq-link:hover{color:#fff}

/* action anchor */
.dq-act-h{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s1)}
.dq-state{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid}
.dq-state:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.dq-state.active{color:var(--dq-blue);border-color:#C7D8F7;background:#F1F6FE}
.dq-state.soon{color:var(--dq-amber);border-color:#EBD9B8;background:#FDF8F0}
.dq-state.over{color:var(--dq-red);border-color:#F0C9C5;background:#FEF4F3}
.dq-state.done{color:var(--dq-green);border-color:#BEE0CD;background:#F2FAF6}
.dq-state.wait{color:var(--dq-muted);border-color:var(--dq-line);background:#F7F9FC}
.dq-act-t{font-size:19px;font-weight:700;color:var(--dq-ink);margin-bottom:var(--s1)}
.dq-act-r{font-size:15px;line-height:1.6;color:var(--dq-body)}
.dq-act-do{font-size:15px;line-height:1.6;color:var(--dq-ink);margin-top:var(--s2)}
.dq-btns{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.dq-btn{min-height:44px;padding:0 var(--s3);border-radius:8px;font-size:15px;font-weight:600;border:1px solid var(--dq-line);background:var(--dq-surface);color:var(--dq-body);cursor:pointer}
.dq-btn:hover{border-color:#B9C7DE}
.dq-btn.primary{background:var(--dq-blue);border-color:var(--dq-blue);color:#fff}
.dq-btn.primary:hover{background:#1740B8}
.dq-btn:focus-visible,.dq-link:focus-visible,.dq-row:focus-visible,.dq-sum:focus-visible,.dq-card:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
.dq-note{font-size:13px;color:var(--dq-muted);margin-top:var(--s2)}

/* second action — collapsed by default, never equal weight */
.dq-second{margin-top:var(--s2);border-top:1px solid var(--dq-line);padding-top:var(--s2)}
.dq-row{display:flex;align-items:center;gap:var(--s2);width:100%;text-align:left;background:none;border:none;padding:8px 0;min-height:44px;cursor:pointer;color:var(--dq-body);font-size:15px;font-weight:500}
.dq-row:hover{color:var(--dq-ink)}
.dq-row-k{font-size:13px;color:var(--dq-muted);font-weight:600;min-width:104px}
.dq-row-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dq-row-x{font-size:13px;color:var(--dq-muted);font-weight:600}
.dq-second-b{padding:var(--s1) 0 0 104px;font-size:15px;line-height:1.6;color:var(--dq-body)}

/* support anchor — one state only */
.dq-support{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.dq-support .dq-b{margin:0}

/* secondary strip — compact rows, never cards */
.dq-strip{border:1px solid var(--dq-line);border-radius:12px;overflow:hidden;margin-bottom:var(--s2);background:var(--dq-surface)}
.dq-sum{display:flex;align-items:center;gap:var(--s2);width:100%;background:none;border:none;border-bottom:1px solid var(--dq-line);
  padding:var(--s2) var(--s3);min-height:56px;text-align:left;cursor:pointer;font-size:15px;color:var(--dq-ink);font-weight:500}
.dq-sum:last-child{border-bottom:none}
.dq-sum:hover{background:#F8FAFD}
.dq-sum-k{font-weight:600;min-width:180px}
.dq-sum-v{color:var(--dq-muted);font-size:13px;flex:1;min-width:0}
.dq-sum-x{color:var(--dq-muted);font-size:13px;font-weight:600}
.dq-foot{display:flex;gap:var(--s3);align-items:center;padding-top:var(--s2)}

/* team leader — three summary numbers */
.dq-three{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-bottom:var(--s3)}
.dq-sumcard{background:var(--dq-surface);border:1px solid var(--dq-line);border-radius:12px;padding:var(--s3);text-align:left;cursor:pointer;min-height:120px}
.dq-sumcard:hover{border-color:#B9C7DE}
.dq-sumcard.alert{border-color:#F0C9C5;background:#FEF9F8}
.dq-sumcard .dq-num{font-size:36px;color:var(--dq-ink);margin:6px 0 4px}
.dq-sumcard.alert .dq-num{color:var(--dq-red)}

/* who needs help — one expanded card, never more than three */
.dq-card{width:100%;text-align:left;background:var(--dq-surface);border:1px solid var(--dq-line);border-radius:12px;
  padding:var(--s3);margin-bottom:var(--s2);cursor:pointer}
.dq-card:hover{border-color:#B9C7DE}
.dq-card.open{border-color:#C9D6EC;box-shadow:inset 3px 0 0 var(--dq-blue);cursor:default}
.dq-card.open.urgent{box-shadow:inset 3px 0 0 var(--dq-red)}
.dq-card-h{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.dq-card-n{font-size:19px;font-weight:700;color:var(--dq-ink)}
.dq-card.collapsed{padding:var(--s2) var(--s3);min-height:64px;display:flex;align-items:center;gap:var(--s2)}
.dq-card.collapsed .dq-card-n{font-size:15px;font-weight:600}
.dq-lines{margin-top:var(--s2)}
.dq-lines div{font-size:15px;line-height:1.6;color:var(--dq-body);margin-bottom:4px}
.dq-lines div strong{color:var(--dq-ink)}
.dq-next{font-size:15px;color:var(--dq-ink);font-weight:600;margin-top:var(--s2)}
.dq-wait{margin-left:auto;font-size:13px;font-weight:600;color:var(--dq-muted)}
.dq-wait.late{color:var(--dq-red)}

.dq-sec-h{font-size:13px;font-weight:600;color:var(--dq-muted);margin:var(--s3) 0 var(--s1)}
.dq-q{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s3);border-bottom:1px solid var(--dq-line);font-size:15px;color:var(--dq-body);min-height:48px}
.dq-q:last-child{border-bottom:none}
.dq-q-k{flex:1;min-width:0}
.dq-q-v{font-weight:700;color:var(--dq-ink);font-variant-numeric:tabular-nums}
.dq-q-s{font-size:13px;color:var(--dq-muted);min-width:96px;text-align:right}
@media(max-width:1180px){.dq-three{grid-template-columns:1fr}.dq-split{grid-template-columns:1fr}}

.nav-label{text-transform:none!important;letter-spacing:.1px!important;font-size:12px!important;font-weight:600!important}
.ap-switch-k{text-transform:none!important;letter-spacing:.1px!important;font-size:12px!important}
.dq-anchor.lead .dq-meter i{background:#fff}
.nav-more{width:100%;background:none;border:none;text-align:left;color:#8FA3C4;font-size:12px;font-weight:600;padding:10px 14px 6px;cursor:pointer}
.nav-more:hover{color:#CFE0FF}
/* ===== CONNECTED HUBS ===== */
.hub{border:1px solid var(--dq-line);border-radius:12px;overflow:hidden;background:var(--dq-surface);margin-bottom:var(--s2)}
.hub-bar{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s3);border-bottom:1px solid var(--dq-line);background:#FBFCFE;flex-wrap:wrap}
.hub-t{font-size:15px;font-weight:700;color:var(--dq-ink)}
.hub-u{font-size:13px;color:var(--dq-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.hub-live{margin-left:auto;font-size:13px;font-weight:600;color:var(--dq-muted);display:inline-flex;align-items:center;gap:6px}
.hub-live:before{content:"";width:7px;height:7px;border-radius:50%;background:#B9C4D6}
.hub-live.on{color:var(--dq-green)}.hub-live.on:before{background:var(--dq-green)}
.hub-live.off{color:var(--dq-amber)}.hub-live.off:before{background:var(--dq-amber)}
.hub-frame{position:relative;background:#F7F9FC}
.hub-frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}

/* =====================================================================
   ONE TYPE SCALE, EVERYWHERE
   The contract is four sizes: 36 display, 19 heading, 15 body, 13 small.
   Today and My Team already hold to it. The analytics-era panels never did,
   and NBA v3 built on top of them — My Progress was rendering eleven sizes
   and Team Results nine, which is what makes a dense screen feel heavy even
   when every number on it is right. These rules pin the strays onto the four.
   Nothing here changes a layout, a colour or a word.
   ===================================================================== */

<div id="cbxGate"><div class="bx">
  <h1>Agent Analytics</h1>
  <p class="lead">Sign in with your CB number.</p>
  <div class="err" id="cbxErr" style="display:none"></div>
  <label for="cbxU">CB number</label>
  <input id="cbxU" type="text" autocomplete="username" autocapitalize="characters" placeholder="CB123">
  <label for="cbxP">Password</label>
  <input id="cbxP" type="password" autocomplete="current-password" placeholder="Your password">
  <button id="cbxGo">Sign in</button>

<script id="cbx-gate">
/* ===================== THE CB LOGIN, IN FRONT OF THE PROTOTYPE =====================
   The prototype ships with a role toggle and an agent picker so a designer can
   look at any of the fourteen sample people. Behind a real login that is exactly
   what must not happen, so this does three things:
     1. holds the whole app behind CB number + password (the SAME /api/login the
        rest of the suite uses — no second auth system);
     2. pins the session to role 'agent' and neuters setRole/setAgent, so the
        picker cannot be used to look at somebody else;
     3. replaces the prototype's role switcher with a read-only identity card.
   It uses its own session key, never 'cbx_token' — the suite is one origin, and
   reading the management key would let a signed-in staff tab walk straight in. */
(function(){
  var API='https://chatterbox-agentos-api.chatterbox-agentos.workers.dev';
  var TKEY='cbx_agent_token';
  document.body.classList.add('cbx-locked');

  function post(path,body){
    var o={method:'POST',headers:{'Content-Type':'application/json','X-Cbx-Client':'v5'}};
    var t=null; try{ t=sessionStorage.getItem(TKEY); }catch(e){}
    if(t) o.headers.Authorization='Bearer '+t;
    if(body) o.body=JSON.stringify(body);
    return fetch(API+path,o).then(function(r){return r.json().then(function(j){
      return Object.assign({_status:r.status},j);},function(){return {_status:r.status};});},
      function(){return {_status:0,error:'We could not reach the server.'};});
  }

  function lock(user){
    /* The prototype is a DESIGN artefact running on fourteen invented people.
       Say so, permanently and unmissably, so nothing on screen is ever mistaken
       for this person's real figures. */
    var bar=document.createElement('div');
    bar.id='cbxProtoBar';
    bar.textContent='PROTOTYPE — sample data, not your real figures. Signed in as '
      +(user.full_name||user.username)+'.';
    document.body.appendChild(bar);

    var lockIn=setInterval(function(){
      if(typeof AP==='undefined'||!AP.s) return;
      clearInterval(lockIn);
      AP.s.role='agent';
      AP.setRole=function(){};                       // no switching to team leader
      AP.setAgent=function(){};                      // no looking at a colleague
      AP.navSwitch=function(){
        return '<div class="ap-switch"><div class="ap-switch-k">Signed in</div>'
          +'<div class="ap-who" style="padding:8px 10px;font:700 13px Inter,system-ui,sans-serif;color:#E7EEFA">'
          + (user.full_name||user.username) + '</div></div>';
      };
      try{ if(typeof render==='function') render(); }catch(e){}
    },120);
  }

  function open(user){
    var g=document.getElementById('cbxGate'); if(g) g.remove();
    document.body.classList.remove('cbx-locked');
    lock(user);
  }

  function fail(m){
    var e=document.getElementById('cbxErr');
    if(e){ e.textContent=m; e.style.display='block'; }
    var b=document.getElementById('cbxGo'); if(b){ b.disabled=false; b.textContent='Sign in'; }
  }

  function submit(){
    var u=document.getElementById('cbxU').value.trim();
    var p=document.getElementById('cbxP').value;
    if(!u||!p) return fail('Enter your CB number and your password.');
    var b=document.getElementById('cbxGo'); b.disabled=true; b.textContent='Signing in…';
    post('/api/login',{username:u,password:p}).then(function(r){
      if(r._status===200&&r.token){
        try{ sessionStorage.setItem(TKEY,r.token); }catch(e){}
        open(r.user||{username:u});
      } else fail(r.error||'Sign in failed.');
    });
  }

  document.getElementById('cbxGo').onclick=submit;
  document.getElementById('cbxP').onkeydown=function(e){ if(e.key==='Enter') submit(); };

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}
function uid(p){return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}return h.toString(16)}
function parseDT(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?null:d}
  let s=String(v).trim();
  s=s.replace(/(\d{4})\/(\d{2})\/(\d{2}),?\s*/,'$1-$2-$3 ');            // 2026/02/26, 16:05
  const d=new Date(s.replace(' ','T'));
  if(!isNaN(d))return d;
  const d2=new Date(s); return isNaN(d2)?null:d2;
}
function isoDay(d){if(!d)return null;const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function normCB(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function normName(v){return String(v||'').toLowerCase().replace(/\s+-\s*.*$|\s*-\s+.*$/,'').replace(/\s+/g,' ').trim()}
function parseNum(v){
  if(v==null||v===''||v instanceof Date)return null;
  if(typeof v==='number'){ if(v>1e8 && v%1e10===0) return v/1e10; return v } // absurd comma-decimal artefact
  let s=String(v).trim().replace('%','');
  if(s.includes(',')&&!s.includes('.')) s=s.replace(/,/g,'.');
  s=s.replace(/\s/g,'');

  if(typeof v==='number')return cap(v);

/* =====================================================================
   FILE READING — Salesforce .xls files are HTML tables; .xlsx via SheetJS
   ===================================================================== */
function readUpload(file,srcKey){
  const spec=srcKey?SOURCES[srcKey]:null;
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error('Could not read the file.'));
    rd.onload=()=>{
      try{
        const buf=rd.result; const bytes=new Uint8Array(buf.slice(0,8));
        const isZip=bytes[0]===0x50&&bytes[1]===0x4B, isCFB=bytes[0]===0xD0&&bytes[1]===0xCF;
        let rows=[];
        const viaSheetJS=()=>{const wb=XLSX.read(buf,{type:'array',cellDates:true});
          if(spec&&spec.sheetScan){
            const norm=h=>String(h||'').toLowerCase().replace(/\s+/g,' ').trim();
            const req=spec.required.map(norm);
            let all=null;
            for(const sn of wb.SheetNames){
              const rws=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
              if(!rws.length)continue;
              const hs=rws[0].map(norm);
              if(!req.every(r=>hs.includes(r)))continue;
              if(!all){all=rws}
              else{const map=rws[0].map(h=>all[0].findIndex(x=>norm(x)===norm(h)));
                rws.slice(1).forEach(r=>{const nr=new Array(all[0].length).fill('');r.forEach((v,i)=>{if(map[i]>=0)nr[map[i]]=v});all.push(nr)})}
            }
            if(all)return all;
          }
          const ws=wb.Sheets[wb.SheetNames[0]];
          return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})};
        if(isZip||isCFB){ rows=viaSheetJS(); }                                              // xlsx / legacy xls
        else{
          const text=new TextDecoder('utf-8').decode(buf);
          if(text.includes('\u0000')){ rows=viaSheetJS(); }                                 // binary that dodged the sniff
          else if(/^\s*</.test(text)){                                                          // Salesforce HTML .xls
            const doc=new DOMParser().parseFromString(text,'text/html');
            const table=doc.querySelector('table');
            if(!table)throw new Error('No table found — is this a Salesforce report export?');
            rows=[...table.querySelectorAll('tr')].map(tr=>[...tr.querySelectorAll('th,td')].map(c=>c.textContent.trim()));
          }else{                                                                            // CSV
            const p=Papa.parse(text.replace(/^\uFEFF/,''),{skipEmptyLines:'greedy'});
            rows=p.data;
          }
        }
        rows=rows.filter(r=>r&&r.some(c=>String(c??'').trim()!==''));
        if(rows.length<1)throw new Error('The file appears to be empty.');
        const headers=rows[0].map(h=>String(h??'').trim());
        const seen={};const keyFor=headers.map(h=>{seen[h]=(seen[h]||0)+1;return seen[h]>1?h+' #'+seen[h]:h});
        const data=rows.slice(1).map(r=>{const o={};keyFor.forEach((k,i)=>o[k]=r[i]!==undefined?r[i]:'');return o});
        resolve({headers,data,rowsRaw:rows,textHash:hashStr(headers.join('|')+'|'+rows.length+'|'+file.size+'|'+(file.name||''))});
      }catch(e){reject(e)}
    };
    rd.readAsArrayBuffer(file);
  });
}

/* ---------------- HEADER + ROW VALIDATION ---------------- */
function validateHeaders(srcKey,headers){
  const spec=SOURCES[srcKey];
  const norm=h=>h.toLowerCase().replace(/\s+/g,' ').trim();
  const have=new Set(headers.map(norm));
  const missing=spec.headers.filter(h=>!have.has(norm(h)));
  const expected=new Set(spec.headers.map(norm));
  const extra=headers.filter(h=>!expected.has(norm(h)));
  const missingReq=spec.required.filter(h=>!have.has(norm(h)));
  return {missing,extra,missingReq,ok:missingReq.length===0};
}
function hcol(row,header){ // header-insensitive fetch
  if(header in row)return row[header];
  const n=header.toLowerCase().replace(/\s+/g,' ').trim();
  for(const k in row){if(k.toLowerCase().replace(/\s+/g,' ').trim()===n)return row[k]}
  return '';
}

/* ---------------- UPLOAD PIPELINE ---------------- */
let pendingUpload=null;
async function handleFile(srcKey,file){
  try{
    /* the rule book is a multi-sheet workbook, not a row export — it takes its
       own read and its own confirm modal, inside the same upload chrome */
    if(SOURCES[srcKey]&&SOURCES[srcKey].rulesMode){
      const buf=await file.arrayBuffer();
      AP.rbConfirmModal(file,AP.rbReadWorkbook(new Uint8Array(buf)));
      return;
    }
    const parsed=await readUpload(file,srcKey);
    const hv=validateHeaders(srcKey,parsed.headers);
    const dupe=state.batches.find(b=>b.file_hash===parsed.textHash&&b.source_type===srcKey&&b.validation_status!=='failed');
    pendingUpload={srcKey,file,parsed,hv,dupe};
    openUploadModal();
  }catch(e){toast('Upload failed: '+e.message,'err')}
}
function openUploadModal(){
  const {srcKey,file,parsed,hv,dupe}=pendingUpload;const spec=SOURCES[srcKey];
  const prevHead=parsed.headers.slice(0,10);
  const prevRows=parsed.data.slice(0,5);
  const chips=[

  if(spec.pairMode){const g=loadGWPPairs(parsed.rowsRaw,batch_id);loaded=g.out;rejects.push(...g.rejects)}

function anchorDate(){

  return mx?new Date(mx+'T12:00:00'):new Date();
}
function periodWindow(){
  const a=anchorDate();
  if(state.range.mode==='custom')return(state.range.from&&state.range.to)?{from:state.range.from,to:state.range.to}:{from:'1900-01-01',to:isoDay(a)};
  if(state.range.mode==='all')return{from:'1900-01-01',to:isoDay(a)};
  const days=parseInt(state.range.mode,10);
  const f=new Date(a);f.setDate(f.getDate()-(days-1));
  return{from:isoDay(f),to:isoDay(a)};
}
function prevWindow(w){
  const f=new Date(w.from+'T12:00:00'),t=new Date(w.to+'T12:00:00');
  const len=Math.round((t-f)/864e5)+1;
  const pt=new Date(f);pt.setDate(pt.getDate()-1);
  const pf=new Date(pt);pf.setDate(pf.getDate()-(len-1));
  return{from:isoDay(pf),to:isoDay(pt)};
}

}

  return _mind=m||isoDay(anchorDate())}

  if(f>t)f=t;let n=0;const d=new Date(f+'T00:00:00');const end=new Date(t+'T00:00:00');
  let guard=0;while(d<=end&&guard++<4000){const wd=d.getDay();if(wd!==0&&wd!==6)n++;d.setDate(d.getDate()+1)}
  return Math.max(1,n)}

const GFMAP={ // global filter field per source

function rowsFor(src,win){

  if(spec.snapshot){
    const latest=state.batches.find(b=>b.source_type===src&&b.loaded_row_count>0);
    if(latest)rows=rows.filter(r=>r._batch===latest.batch_id);
  }else if(win){rows=rows.filter(r=>r._d&&r._d>=win.from&&r._d<=win.to)}
  const noGF=(src==='AGENT_LIST'||src==='GWP_TABLE');   // only mapping tables are never filtered; sessions honour roster filters (not the date range)
  const rbase=spec.session?spec.session.base:src;
  const cbRow=r=>{switch(rbase){
    case 'ATTENDANCE':return normCB(r.employee_code)||null;
    case 'QA_EVALUATIONS':return normCB(r.sales_agent_code)||state.sfOwnerMap?.[normName(r.sales_agent)]||null;
    case 'CALLX_CALL_RECORDS':return cbOf(r.agent);
    case 'SF_OPEN_CASES':case 'SF_CLOSED_CASES':return cbOfOwner(r.case_owner);
    case 'SF_INACTIVE':case 'BI_ACTIVE':return cbOfOwner(r.owner);
    case 'REFERRALS':return normCB(r.employee_code)||cbOf(r.agent);

    default:return null}};
  if(!noGF)for(const gf in state.filters){const v=state.filters[gf];if(!v)continue;
    const field=GFMAP[gf]?.[src];
    if(gf==='agent'){rows=rows.filter(r=>{const c=field?normCB(r[field]):cbRow(r);return c===normCB(v)});continue}
    if(gf==='tenure'){rows=rows.filter(r=>{const c=cbRow(r);return !!c&&state.cbInfo[c]?.tenure===v});continue}
    if(gf==='team'){rows=rows.filter(r=>{if(field&&String(r[field]??'')===v)return true;const c=cbRow(r);return !!c&&state.cbInfo[c]?.tl===v});continue}
    if(gf==='campaign'){rows=rows.filter(r=>{if(field)return String(r[field]??'')===v;const c=cbRow(r);return !!c&&state.cbInfo[c]?.queue===v});continue}
    if(gf==='dept'){rows=rows.filter(r=>{if(field)return String(r[field]??'')===v;const c=cbRow(r);return !!c&&cbDept()[c]===v});continue}
    if(field)rows=rows.filter(r=>String(r[field]??'')===v);
  }
  if(src==='CALLX_CALL_RECORDS'||spec.session?.base==='CALLX_CALL_RECORDS')rows=rows.map(r=>({...r,call_band:callBandFor(r.billable_seconds)}));
  if(src==='ATTENDANCE'){
    const U=a=>a.map(x=>String(x).toUpperCase());
    const P=U(resolveRule('$presentCodes')),L=U(resolveRule('$leaveCodes')),X=U(resolveRule('$excludeCodes')),S=state.rules.salesDepts.vals;
    rows=rows.map(r=>{const c=String(r.status_code||'').toUpperCase();
      const ex=X.includes(c),p=!ex&&P.includes(c),l=!ex&&L.includes(c);
      return{...r,excluded_flag:ex?1:0,present_flag:p?1:0,leave_flag:l?1:0,absence_flag:(!ex&&!p&&!l)?1:0,is_sales:S.includes(r.department)?1:0}});

function agg(rows,type,field,filt){

  if(type==='avg'){const v=f.map(r=>parseNum(r[field])).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
  if(type==='distinct'){const st=new Set();f.forEach(r=>{const v=r[field];if(v!=null&&String(v).trim()!=='')st.add(String(v).toLowerCase())});return st.size}
  return f.length;
}
function gwpMap(){const m={};(state.facts.GWP_TABLE||[]).forEach(r=>m[r.product_norm]=r.gwp);return m}
function gwpOf(m,product){return m[String(product||'').toLowerCase().trim()]??null}
let _obc=null,_cbd=null;
function cbDept(){if(_cbd)return _cbd;const m={},seen={};
  (state.facts.ATTENDANCE||[]).forEach(r=>{const c=normCB(r.employee_code);if(!c)return;const d=r._d||'';
    if(!seen[c]||d>=seen[c]){seen[c]=d;m[c]=r.department}});
  return _cbd=m}
function ownerByCaseMap(){if(_obc)return _obc;const m={};
  (state.facts.SF_CLOSED_CASES||[]).forEach(r=>{if(r.case_number)m[String(r.case_number).trim()]=r.case_owner});
  (state.facts.SF_OPEN_CASES||[]).forEach(r=>{if(r.case_number&&!m[String(r.case_number).trim()])m[String(r.case_number).trim()]=r.case_owner});

function saleRows(win){ // active service rows with agent attribution

function cancelRows(win){return rowsFor('SF_INACTIVE',win).map(r=>Object.assign({},r,{_cb:cbOfOwner(r.owner)}))}
/* 1 sale = 1 premium: each unique account carries a single GWP — the highest-value mapped product on it */
function biMode(){return (state.facts.BI_ACTIVE||[]).length>0}
function vatMult(){return 1+((parseFloat((state.rules.vatRate?.vals||[])[0])||0)/100)}
function accountPremiums(win){
  if(biMode()){ // PRIMARY: BI charges per account, grossed to incl-VAT (spec §3.4)
    const M=new Map();
    rowsFor('BI_ACTIVE',win).filter(r=>r.active_flag===1).forEach(r=>{const acc=r.account_number;if(!acc)return;
      let e=M.get(acc);if(!e){e={acc,gwp:0,ex:0,product:null,_maxc:-1,cb:null,owner:''};M.set(acc,e)}
      if(!e.cb&&r.owner){e.cb=cbOfOwner(r.owner);e.owner=r.owner}
      const c=r.charge_amount||0;e.ex+=c;
      if(c>e._maxc){e._maxc=c;e.product=r.merged_bundle||r.product_bundle}
    });
    const vm=vatMult();
    return[...M.values()].map(e=>{e.gwp=Math.round(e.ex*vm*100)/100;delete e._maxc;return e});
  }
  const gm=gwpMap();const M=new Map();
  saleRows(win).forEach(r=>{const acc=r.account_number;if(!acc)return;
    let e=M.get(acc);if(!e){e={acc,gwp:null,product:null,cb:null,owner:''};M.set(acc,e)}
    if(!e.cb&&r._cb){e.cb=r._cb;e.owner=r._owner}
    const g=gwpOf(gm,r.bundled_product);
    if(g!=null&&(e.gwp==null||g>e.gwp)){e.gwp=g;e.product=r.bundled_product}
  });
  return[...M.values()];
}
function cancelPremiums(win){
  const rows0=cancelRows(win);
  if(rows0.some(r=>(r.charge_amount||0)>0)){ // BI Inactive export carries charges — price from them
    const M=new Map();const vm=vatMult();
    rows0.forEach(r=>{const acc=r.account_number;if(!acc)return;
      let e=M.get(acc);if(!e){e={acc,gwp:0,ex:0,product:null,_maxc:-1,cb:null,owner:''};M.set(acc,e)}
      if(!e.cb&&r._cb){e.cb=r._cb;e.owner=r.owner}
      const c=r.charge_amount||0;e.ex+=c;
      if(c>e._maxc){e._maxc=c;e.product=r.merged_bundle||r.product_bundle}
    });
    return[...M.values()].map(e=>{e.gwp=Math.round(e.ex*vm*100)/100;delete e._maxc;return e});
  }
  const gm=gwpMap();const M=new Map();
  cancelRows(win).forEach(r=>{const acc=r.account_number;if(!acc)return;
    let e=M.get(acc);if(!e){e={acc,gwp:null,product:null,cb:null,owner:''};M.set(acc,e)}
    if(!e.cb&&r._cb){e.cb=r._cb;e.owner=r.owner}
    const g=gwpOf(gm,r.product_bundle);

function evalKPI(k,win){
  if(k.type==='cross'){
    const n=agg(rowsFor(k.num.src,win),k.num.agg,k.num.field,k.num.filter);
    const d=agg(rowsFor(k.den.src,win),k.den.agg,k.den.field,k.den.filter);
    return d?n/d:null;
  }
  const rows=rowsFor(k.src,win);
  if(k.special==='gwpTotal'){return accountPremiums(win).reduce((s,e)=>s+(e.gwp||0),0)}
  if(k.special==='gwpAvg'){const ps=accountPremiums(win);return ps.length?ps.reduce((s,e)=>s+(e.gwp||0),0)/ps.length:null}
  if(k.special==='gwpLost'){return cancelPremiums(win).reduce((s,e)=>s+(e.gwp||0),0)}
  if(k.special==='slaBreach'){
    const a=isoDay(anchorDate());
    return rows.filter(r=>!/closed/i.test(r.qa_status||'')&&r.sla_deadline&&((isoDay(parseDT(r.sla_deadline))||'9999')<a)).length;
  }
  if(k.special==='unverified'){
    const acts=agg(rows,'distinct','account_number',k.num);
    const qaSales=agg(rowsFor('QA_EVALUATIONS',win),'count',null,[{f:'assessment_type',op:'in',v:'$saleAssess'}]);
    return Math.max(0,acts-qaSales);
  }
  if(k.type==='ratio'){
    const den=k.den?rows.filter(r=>passFilter(r,k.den)):rows;
    if(!den.length)return null;
    return den.filter(r=>passFilter(r,k.num)).length/den.length*100;
  }
  return agg(rows,k.type,k.field,k.num);
}
function kpiSnapshotSrc(k){
  if(k.type==='cross')return !!(SOURCES[k.num?.src]?.snapshot||SOURCES[k.den?.src]?.snapshot);
  return !!(k.src&&SOURCES[k.src]?.snapshot);
}
function kpiSeries(k,win){ // daily sparkline
  if(kpiSnapshotSrc(k))return null;
  const f=new Date(win.from+'T12:00:00'),t=new Date(win.to+'T12:00:00');
  const days=Math.min(90,Math.round((t-f)/864e5)+1);
  const out=[];
  for(let i=0;i<days;i++){const d=new Date(f);d.setDate(d.getDate()+i);const day=isoDay(d);
    out.push({d:day,v:evalKPI(k,{from:day,to:day})})}
  const nz=out.filter(p=>p.v!=null&&p.v!==0);
  return nz.length>=2?out.map(p=>({d:p.d,v:p.v==null?0:p.v})):null;
}
function kpiDelta(k,win){
  if(kpiSnapshotSrc(k))return null;
  const cur=evalKPI(k,win),prev=evalKPI(k,prevWindow(win));
  if(cur==null||prev==null||prev===0)return null;
  if(k.format==='pct')return{val:cur-prev,unit:'pp'};
  return{val:(cur-prev)/prev*100,unit:'%'};
}

function staleLimit(){return parseInt(state.rules.staleDays.vals[0]||'7',10)}
function freshness(src){
  const b=state.batches.find(x=>x.source_type===src&&x.validation_status!=='failed');
  if(!b)return{state:'n',label:'No upload',days:null,batch:null};
  const days=Math.floor((Date.now()-new Date(b.uploaded_at))/864e5);
  const lim=staleLimit();
  return{state:days<=lim?'g':days<=lim*2?'a':'r',label:days===0?'Today':days+'d ago',days,batch:b};
}

function zar2(v){return 'R'+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})}
function vatPct(){const p=parseFloat((state.rules.vatRate?.vals||[])[0]);return (isNaN(p)?15:p)/100}
function exVat(v){return v/(1+vatPct())}
