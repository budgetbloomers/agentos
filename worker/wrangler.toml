# Chatterbox AgentOS — API Worker (Phase 2+)
# Deploy:  cd worker && npx wrangler deploy
# Secrets (typed interactively, NEVER in files/chat):
#   npx wrangler secret put SUPABASE_SECRET_KEY
name = "chatterbox-agentos-api"
main = "src/index.mjs"
compatibility_date = "2026-07-01"

# Serve under the Pages domain via routes after first deploy, or use
# Pages Functions binding later. For the test week, the Worker's own
# workers.dev URL also works — set rules.askEndpoint accordingly.

# THE ROSTER SAFETY NET (Nick, 2026-08-28). Ops keeps its own copy of the Agent List and
# used to re-ingest only when a human opened it, so a list uploaded in VAS could sit unseen
# there for days. The scheduled handler re-syncs the roster into every store every ten
# minutes, with nothing open anywhere. Fingerprint-gated: no change, no writes.
[triggers]
crons = ["*/10 * * * *", "3,23,43 * * * *"]   # the tick, and the coaching wave (:03/:23/:43) — each firing has its own budget. The Wimpy HighLevel retry, which shared this trigger at :07/:27/:47 (spec 015 R11), left with the Wimpy service (Spec Kit 018, 2026-10-09)
# The Wimpy HighLevel secrets are the Wimpy service's now (wimpy-service/.env, or Vercel environment variables). At the 018
# release, remove them from this Worker:  npx wrangler secret delete WIMPY_HL_API_KEY  ·  npx wrangler secret delete WIMPY_HL_LOCATION_ID

# REQUEST LOGS (Spec Kit 031, 2026-10-11 — Nick: "I get a lot of notification didnt reach the server, is something wrong
# with supabase or agent os"). Cloudflare killed 102 requests for exceeding resources on 9 Oct and nothing said which.
# Workers Logs is included in the FREE plan: 200,000 events a day, kept 3 days. The floor makes ~6,000 requests a day and
# the Worker adds one `cbx_heavy` line per heavy request, so every request is kept (rate 1) at ~6 % of the allowance.
# How to query: specs/031-server-overload-upload-days/runbook.md. Re-check the allowance before 1 Dec 2026 (Cloudflare
# moves Workers Logs to "Observability pricing" that day).
[observability]
enabled = true
head_sampling_rate = 1

[ai]
binding = "AI"                  # Workers AI — Hermes 2 Pro (Phase 3)

[vars]
SUPABASE_URL = "https://fxvnjhfdenycxxuklord.supabase.co"

