/* ===================== NIKOLA =====================
   ONE FACT, ONE EXPLANATION, ONE NEXT ACTION — about your own results only.
   The prototype's wording, and the constraint is the point: Nikola reads the same
   scoped payload the page is already showing and never reaches past it. An agent's
   Nikola can only discuss that agent; a team leader's can only discuss their team.

   THE IRON RULE HOLDS: it explains numbers, it never computes them. Every figure
   below is lifted from the payload; the assistant is asked to put it in words, and
   the page shows the numbers itself so a wrong sentence can never become a wrong
   number. */
function nikBrief(){
  var out=[];
  if(ME&&!TEAM){
    var c=calcNowInitial();
    out.push('Today: <b>'+num(ME.sales)+' of '+num(ME.target)+'</b> sales that count.'
      +(c&&c.projection?' Commission so far <b>'+R(c.projection)+'</b> — estimated.':''));
    if(ME.pctT!=null) out.push('You are at <b>'+pct(ME.pctT,0)+'</b> of your target for the days you have worked.');
    /* The single biggest lever, chosen the way the breakdown chooses it: the
       figure furthest below its own target, not the smallest number on screen. */
    var lev=null;
    if(ME.pctT!=null&&ME.pctT<1) lev='target achievement, currently '+pct(ME.pctT,0)+' against 100%';
    else if(ME.qa!=null&&ME.qa<0.9) lev='call quality, currently '+pct(ME.qa,0)+' against 90%';
    else if(ME.att!=null&&ME.att<0.95) lev='attendance, currently '+pct(ME.att,0)+' against 95%';
    if(lev) out.push('The one thing that would move the most: <b>'+esc(lev)+'</b>.');
    else out.push('Every figure on your card is at or above its target. Hold the pace.');
  } else if(TEAM){
    var t=TEAM.totals||{};
    out.push('Your team: <b>'+num(t.sales)+' of '+num(t.target)+'</b> sales'
      +(t.pctT!=null?' — <b>'+pct(t.pctT,0)+'</b> of target':'')+'.');
    out.push('<b>'+num(t.onTarget)+' of '+num(t.reporting)+'</b> of your people are at or past their own target.');
    var co=TEAM.coaching&&TEAM.coaching.totals;
    if(co) out.push('<b>'+num(co.sessions)+'</b> coaching sessions recorded with '+num(co.agents)+' of them in the last 90 days.');
  }
  return out;
}
function nikolaPage(a,c){
  var isTeam=!!(TEAM&&!ME);
  var qs=isTeam
    ? ['How is my team doing?','Who needs me first?','Who has had no coaching?','Which of my people are on target?']
    : ['How am I doing today?','What should I fix first?','How much commission have I earned?','How many sales to my next level?','Why has my quality changed?'];
  return '<div class="card"><h3>Nikola</h3>'
    +'<p class="why" style="margin:0">One fact, one explanation, one next action — about '
    +(isTeam?'your own team only.':'your own results only.')+'</p></div>'
    +'<div class="card"><div class="nikbrief">'
    + nikBrief().map(function(l){return '<p>'+l+'</p>';}).join('')
    +'<p class="niksrc">From your own published figures · '+esc(prettyPeriod())+'</p>'
    +'</div>'
    +'<div class="nikqs">'+qs.map(function(q){
        return '<button class="nikq" data-q="'+esc(q)+'">'+esc(q)+'</button>';}).join('')+'</div>'
    +'<div class="nikrow"><input id="nikIn" placeholder="Ask about your '+(isTeam?'team':'results')+'…" '
    +'autocomplete="off"><button class="btn primary" id="nikGo">Ask Nikola</button></div>'
    +'<div id="nikOut"></div>'
    +'<p class="nikfoot">Nikola explains and recommends. It reads only what is on this page, '
    +'and it never works out a number of its own — every figure it quotes is one you can see here.</p>'
    +'</div>';
}
function wireNikola(){
  var inp=$('nikIn'), go=$('nikGo'), out=$('nikOut');
  if(!go) return;
  var ask=function(q){
    if(!q) return;
    out.innerHTML='<div class="nikans"><div class="spin" style="margin:0 auto"></div></div>';
    api('/api/portal/ask',{q:q}).then(function(r){
      if(!r.ok){ out.innerHTML='<div class="nikans err">'+esc((r.json&&r.json.error)||'Nikola could not answer just now.')+'</div>'; return; }
      out.innerHTML='<div class="nikans"><b>'+esc(q)+'</b><p>'+esc(r.json.answer||'')+'</p>'
        +'<span class="niksrc">'+esc(r.json.basis||'From your own figures')+'</span></div>';
    });
  };
  go.onclick=function(){ ask(inp.value.trim()); };
  inp.onkeydown=function(e){ if(e.key==='Enter') ask(inp.value.trim()); };
  Array.prototype.forEach.call(document.querySelectorAll('.nikq'),function(b){
    b.onclick=function(){ inp.value=b.getAttribute('data-q'); ask(inp.value); };
  });
}


/* ===================== THE DRILL-DOWN =====================
   Clicking a name in Team Results opens everything that name was listed for.
   The management app opens an agent card; this is the same idea, scoped: the rule
   that fired and why, what to do about it and by when, what came off the score,
   the two checks, and then the agent's own month underneath.

   Everything here is READ from the NBA digest — the ladder, the composite and the
   R2A tier are computed by the engine that published it and by nothing on this
   page. */
function nbaDetail(){
  var n=D.nba;
  if(!n||!n.agent) return '';
  var a=nbaNorm(n.agent), L=lvlOf(a.nba.lvl), th=n.thresholds||{};   // same defaults as the team list — the drilldown must not be the one unguarded path
  var f1=function(v){return v==null?'—':num(v,1);};

  /* THE PERIOD THE LADDER WAS RUN OVER. It is whatever window the management app
     had open when it published, and that is NOT always this month — say which,
     because "11% of target" over four years and over one month mean opposite
     things. */
  var per=n.period?(n.period.from+' → '+n.period.to):'unknown period';
  var wide=(n.workDays||0)>40;

  var head='<div class="card nbacard" style="border-left:4px solid '+L.c+'">'
    +'<div class="nbah"><span class="pill '+L.p+'">P'+a.nba.lvl+' · '+esc(a.nba.code)+'</span>'
    +'<b>'+esc(a.nba.label)+'</b><span class="nbalvl">'+esc(L.n)+'</span></div>'
    +'<div class="nbab"><b>Why it fired:</b> '+esc(a.nba.reason||'—')+'</div>'
    +'<div class="nbab"><b>What happens next:</b> '+esc(a.nba.action||'—')+'</div>'
    +'<div class="nbab"><b>By:</b> '+esc(byDeadline(a.nba.hrs))+'</div>'
    +'</div>';

  var score='<div class="card"><h3>The score, and what came off it</h3>'
    +'<div class="ac-tiles">'
    +acTile('COMPOSITE',f1(a.composite.adj),'Out of 100, after penalties',
        a.composite.adj>=75?'pass':(a.composite.adj>=55?'watch':'focus'))

    +acTile('CRITICAL FAILS',num(a.r2a.fails),
        (a.r2a.cfr==null?'':'CFR '+num(a.r2a.cfr,1)+'% of audited calls'),
        a.r2a.fails?'focus':'pass')
    +acTile('R2A TIER',esc(a.r2a.tier||'Tier 0'),
        a.composite.pen?('−'+f1(a.composite.pen)+' off the score'):'Nothing off the score',
        a.r2a.tier&&a.r2a.tier!=='Tier 0'?'focus':'pass')
    +acTile('ELITE',esc(a.r2a.elite||'Allowed'),'Whether the top band is reachable',
        a.r2a.elite==='Blocked'?'focus':'pass')
    +'</div>'
    +'<p class="why">Two things come off the score and nothing else: critical fails, and a theme '
    +'being coached repeatedly. Each is capped, and the two together are capped again.</p></div>';

  var tc=a.twoCheck||{};
  var checks='<div class="card"><h3>The two checks on every sale</h3>'
    +'<p class="why">Value is checked before volume.</p>'
    +'<div class="scroller"><table class="tbl"><thead><tr><th class="l">Check</th><th>Value</th><th>Needs</th><th>Result</th></tr></thead><tbody>'
    +'<tr><td class="l">1 · value — GWP per sale</td><td class="num">'+(tc.gwpSale==null?'—':R(tc.gwpSale))+'</td>'
      +'<td class="num sub2">R'+num(th.gwpFloor||99)+' incl</td>'
      +'<td class="num"><span class="pill '+(tc.value?'g':'a')+'">'+(tc.value?'PASS':'BELOW')+'</span></td></tr>'
    +'<tr><td class="l">2 · volume — target achievement</td><td class="num">'+(tc.ta==null?'—':num(tc.ta,1)+'%')+'</td>'
      +'<td class="num sub2">100%</td>'
      +'<td class="num"><span class="pill '+(tc.volume?'g':'a')+'">'+(tc.volume?'PASS':'BELOW')+'</span></td></tr>'
    +'</tbody></table></div>'
    +'<p class="why" style="margin-top:10px"><b>'+esc(tc.status||'—')+'</b>'
    +(tc.status==='Both Issues'?' — value coaching takes priority.':'')+'</p></div>';

  var d=a.driver;
  var lever=d?('<div class="card"><h3>Where your time buys the most</h3>'
    +'<p class="why">The driver with the most composite points still unclaimed.</p>'
    +'<div class="ac-tiles"><div class="ac-tile"><div class="ac-big">'+esc(d.label)+'</div>'
    +'<div class="ac-lab">THE ONE TO SPEND TIME ON</div>'
    +'<div class="ac-sub">'+f1(d.points)+' points sit behind it</div></div></div></div>'):'';

  var note='<div class="card"><h3>What this is measured over</h3>'
    +'<p class="why" style="margin:0">The ladder, the composite and the two checks above were worked out over '
    +'<b>'+esc(per)+'</b>'+(n.workDays?(' — '+num(n.workDays)+' working days'):'')+'.'
    +(wide?' <b>That is not this month.</b> Target achievement over a window that long is measured against '
      +'a target for that whole window, so a low percentage here does not mean a bad month — it means the '
      +'management app published this with its date range set wide. Re-publish it on the month to read these as monthly figures.':'')
    +'</p></div>';

  return head+score+checks+lever+note;
}


/* ===================== THE AGENT DRAWER =====================
   Clicking a name in the team leader view POPS THIS OPEN over the page — it does
   not navigate. That is the behaviour of the agent drawer in VAS Analytics and it
   is the right one here: a team leader is working down a list, and being thrown
   onto a different screen loses their place in it. Escape or the scrim closes it
   and the list is exactly where they left it.

   Everything in it is READ from the payload the Worker already scoped to this
   team leader — the same /api/portal/agent call, rendered into a panel instead of
   a page. No new data reaches the browser, so the drawer cannot widen access.

   WHAT IS NOT HERE, AND WHY: per-tile deltas (▼33% against last period). The
   published digest carries one overall trend, not a previous value for every
   metric, so a delta on each tile would have to be invented. The overall trend
   is shown where it belongs — once, at the top — and the tiles carry the figure
   alone. */
var DRAWER_CB=null;

function drawerTile(lab,val,sub,tone){
  return '<div class="dk-t'+(tone?' '+tone:'')+'"><span class="dk-l">'+esc(lab)+'</span>'
    +'<div class="dk-v num">'+val+'</div>'
    +(sub?'<div class="dk-s">'+esc(sub)+'</div>':'')+'</div>';
}

function drawerHTML(P){
  var a=P.me, n=(P.nba&&P.nba.agent)||null;
  if(!a) return '<div class="dk-body"><p class="dk-empty">No published figures for this agent this month.</p></div>';

  var score=n?n.composite.adj:null;
  var ring=(function(){
    if(score==null) return '';
    var pctv=Math.max(0,Math.min(100,score));
    var col=pctv>=75?'#34D399':(pctv>=55?'#FBBF24':'#FB7185');
    return '<div class="dk-ring" style="background:conic-gradient('+col+' '+(pctv*3.6)+'deg,rgba(255,255,255,.10) 0)">'
      +'<span><b>'+num(score,0)+'</b><i>SCORE</i></span></div>';
  })();

  var trend=a.trend==='up'?['up','▲ improving']:(a.trend==='down'?['down','▼ off last week’s pace']:['flat','— steady']);
  var badges=(a.badges||[]).length
    ? '<div class="dk-badges">'+a.badges.map(function(b){return '<span class="dk-badge">'+esc(b[0])+' '+esc(b[1])+'</span>';}).join('')+'</div>'
    : '<div class="dk-badges"><span class="dk-badge muted">No badges yet this period</span></div>';

  var talkDay=(a.talk!=null&&a.act)?(a.talk/a.act):null;
  var tiles='<div class="dk-tiles">'
    +drawerTile('GWP',R(a.gwpEx),'Premium written')
    +drawerTile('SALES',num(a.sales),'of '+num(a.target)+' target')
    +drawerTile('% TARGET',a.pctT==null?'—':pct(a.pctT,0),'For the days worked',
        a.pctT>=1?'good':(a.pctT>=0.8?'warn':'bad'))
    +drawerTile('SPD',a.spd==null?'—':num(a.spd,2),'Sales a day')
    +drawerTile('QA',a.qa==null?'—':pct(a.qa,1),'Call quality',
        a.qa==null?'':(a.qa>=0.9?'good':(a.qa>=0.8?'warn':'bad')))
    +drawerTile('ATTENDANCE',a.att==null?'—':pct(a.att,1),num(a.act,a.act%1?1:0)+' of '+num(a.emp,a.emp%1?1:0)+' days',
        a.att==null?'':(a.att>=0.95?'good':(a.att>=0.85?'warn':'bad')))
    +drawerTile('CANCELLATIONS',a.canc==null?'—':num(a.canc),
        (a.canc!=null&&a.sales)?pct(a.canc/a.sales,1)+' of sales':'Not supplied')
    +drawerTile('TALK / DAY',talkDay==null?'—':(function(){var m=Math.round(talkDay/60);return m>=60?Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m':m+'m';})(),'On the days worked')
    +'</div>';

  var rank='<div class="dk-rank">'
    +(a.rankTeam?'<span><b>#'+num(a.rankTeam)+'</b> in team</span>':'')
    +(a.rankCo?'<span><b>#'+num(a.rankCo)+'</b> company-wide</span>':'')
    +'<span class="dk-rank-s">by premium written</span></div>';

  /* The ladder, when the team scope carries it. Same content as the drill-down
     page it replaces. */
  var nba='';
  if(n){
    var L=lvlOf(n.nba.lvl);
    nba='<div class="dk-sec"><h4>Next best action</h4>'
      +'<div class="dk-nba" style="border-left-color:'+L.c+'">'
      +'<div class="dk-nba-h"><span class="pill '+L.p+'">P'+n.nba.lvl+' · '+esc(n.nba.code)+'</span> <b>'+esc(n.nba.label)+'</b></div>'
      +'<p><b>Why it fired:</b> '+esc(n.nba.reason||'—')+'</p>'
      +'<p><b>What happens next:</b> '+esc(n.nba.action||'—')+'</p>'
      +'</div>'
      +'<div class="dk-mini">'
      +'<span>Composite <b>'+num(n.composite.adj,1)+'</b> <i>of 100, after '+num(n.composite.pen,1)+' off</i></span>'
      +'<span>Critical fails <b>'+num(n.r2a.fails)+'</b> <i>'+esc(n.r2a.tier||'Tier 0')+'</i></span>'
      +'<span>Elite <b>'+esc(n.r2a.elite||'Allowed')+'</b></span>'
      +'<span>Two checks <b>'+esc(n.twoCheck.status||'—')+'</b></span>'
      +'</div>'
      +(P.nba.period&&(P.nba.workDays||0)>40
        ? '<p class="dk-warn">These were worked out over '+esc(P.nba.period.from+' → '+P.nba.period.to)
          +' — '+num(P.nba.workDays)+' working days, not this month. Read the percentages against that window.</p>'
        : '')
      +'</div>';
  }

  /* Coaching, from the Hub, exactly as the coaching tab reads it. */
  var co=P.coaching, cSec='';
  if(co&&co.error){
    cSec='<div class="dk-sec"><h4>Coaching history</h4><p class="dk-empty">The Coaching Hub could not be reached just now.</p></div>';
  } else if(co&&co.agents&&co.agents[0]){
    var m=co.agents[0], sess=m.sessions||[];
    var themes=(m.themes||[]).filter(function(t){return t.family==='gap';});
    cSec='<div class="dk-sec"><h4>Coaching history</h4>'
      +'<p class="dk-sub">last '+(co.windowDays||90)+' days · from the Coaching Hub · only development themes escalate</p>'
      +(themes.length?themes.map(function(t){
          var comp=/compliance|verification/i.test(t.key);
          return '<div class="dk-th"><div><b>'+esc(coachLabel(t.key))+'</b>'
            +(comp?' <span class="dk-flag">COMPLIANCE</span>':'')
            +'<div class="dk-s">'+t.shown+' session'+(t.shown===1?'':'s')+' · '
            +(t.scored?t.scored+' chosen by a coach':'inferred from notes')
            +(t.last?' · last raised '+esc(coachDate(t.last)):'')+'</div></div>'
            +'<span class="dk-esc">'+(t.scored>=2?'Repeat':(t.scored?'First time':'not scored'))+'</span></div>';
        }).join(''):'<p class="dk-empty">No development themes raised in this window.</p>')
      +(sess.length?'<p class="dk-sub" style="margin-top:10px">'+sess.length+' session'+(sess.length===1?'':'s')
        +' recorded · latest '+esc(coachDate(m.last))+'</p>':'')
      +'<p class="dk-note">No composite adjustment — nothing has reached Repeat on a coach-chosen theme. '
      +'Every theme above was read from the notes rather than picked on the coaching form.</p>'
      +'</div>';
  }

  return '<div class="dk-body">'+ring
    +'<div class="dk-id"><div class="dk-av" style="background:hsl('+hue(a.code)+',58%,52%)">'+esc(initials(a.name))+'</div>'
    +'<div><div class="dk-trend '+trend[0]+'">'+trend[1]+'</div>'
    +'<div class="dk-meta">'+esc(a.code)+' · <b>'+esc(a.campaign||'')+'</b>'+(a.tenure?' · '+esc(a.tenure):'')
    +(a.tl?' · worked this period under <b>'+esc(a.tl)+'</b>':'')+'</div>'
    + badges +'</div></div>'
    + tiles + rank + nba + cSec
    +'</div>';
}

function openDrawer(cb){
  var d=$('cbxDrawer'), sc=$('cbxScrim');
  if(!d){
    d=document.createElement('aside'); d.id='cbxDrawer'; d.className='cbx-drawer';
    sc=document.createElement('div'); sc.id='cbxScrim'; sc.className='cbx-dscrim';
    document.body.appendChild(sc); document.body.appendChild(d);
    sc.onclick=closeDrawer;
  }
  DRAWER_CB=cb;
  d.innerHTML='<div class="dk-head"><button class="dk-x" id="dkClose">✕</button>'
    +'<div class="dk-nm">Loading…</div></div>'
    +'<div class="dk-body"><div class="spin" style="margin:40px auto"></div></div>';
  sc.classList.add('open'); d.classList.add('open');
  document.body.classList.add('dk-locked');
  $('dkClose').onclick=closeDrawer;
  document.addEventListener('keydown',dkEsc);

  api('/api/portal/agent?cb='+encodeURIComponent(cb)).then(function(r){
    if(DRAWER_CB!==cb) return;                      // a later click won
    if(r.status===403){
      d.innerHTML='<div class="dk-head"><button class="dk-x" id="dkClose">✕</button><div class="dk-nm">Not your team</div></div>'
        +'<div class="dk-body"><p class="dk-empty">That agent is not on your team, so their figures are not available here.</p></div>';
      $('dkClose').onclick=closeDrawer; return;
    }
    if(!r.ok){
      d.innerHTML='<div class="dk-head"><button class="dk-x" id="dkClose">✕</button><div class="dk-nm">Could not open</div></div>'
        +'<div class="dk-body"><p class="dk-empty">'+esc((r.json&&r.json.error)||'Please try again.')+'</p></div>';
      $('dkClose').onclick=closeDrawer; return;
    }
    var P=r.json, a=P.me||{}, n=(P.nba&&P.nba.agent)||null;
    var risk=n?(n.nba.lvl===1?['High risk','r']:(n.nba.lvl===2?['Watch','a']:['On track','g'])):null;
    d.innerHTML='<div class="dk-head">'
      +'<button class="dk-back" id="dkClose2">← Back</button>'
      +'<div class="dk-nm">'+esc(a.name||cb)+'</div>'
      +(risk?'<span class="pill '+risk[1]+'">'+esc(risk[0])+'</span>':'')
      +'<button class="dk-x" id="dkClose">✕</button></div>'
      + drawerHTML(P);
    $('dkClose').onclick=closeDrawer;
    if($('dkClose2')) $('dkClose2').onclick=closeDrawer;
    d.scrollTop=0;
  });
}
function dkEsc(e){ if(e.key==='Escape') closeDrawer(); }
function closeDrawer(){
  var d=$('cbxDrawer'), sc=$('cbxScrim');
  if(d) d.classList.remove('open');
  if(sc) sc.classList.remove('open');
  document.body.classList.remove('dk-locked');
  document.removeEventListener('keydown',dkEsc);
  DRAWER_CB=null;
}

function coachBlank(type){

    else if(f[2]==='signoffs') d.employeeSignoffs=[{employeeName:'',date:'',signature:''}];

      SCORECARD.forEach(function(g){ g[1].forEach(function(r){ d.criteria[r[0]]={call1:'—',call2:'—',call3:'—'}; }); }); }
    else d[f[0]]='';
  }); });
  if(d.date==='') d.date=todayISO();
  if(d.dateOfCoaching==='') d.dateOfCoaching=todayISO();

/* ---- reading and writing the nested paths ---- */
function cGet(p){ return p.split('.').reduce(function(o,k){return o==null?o:o[k];},CFORM.data); }
function cSet(p,v){
  var ks=p.split('.'), o=CFORM.data;
  for(var i=0;i<ks.length-1;i++) o=o[ks[i]];
  o[ks[ks.length-1]]=v;
  CFORM.dirty=true;
  var e=$('cfMsg'); if(e){ e.textContent='Not saved yet'; e.className='hmsg'; }
}
function wireCoachForm(){
  if(!CFORM.type) return;
  Array.prototype.forEach.call(document.querySelectorAll('.cc'),function(el){
    var h=function(){ cSet(el.getAttribute('data-cp'),el.value); };
    if(el.tagName==='SELECT') el.onchange=h; else el.oninput=h;
  });
  var ag=$('cfAgent');
  if(ag) ag.onchange=function(){
    var o=ag.options[ag.selectedIndex];
    /* Name and CB move together — a session filed under a name the join cannot
       resolve is a session AgentOS will never count. */
    cSet('agentName',ag.value);
    cSet('employeeNumber',o?o.getAttribute('data-cb')||'':'');
  };
  Array.prototype.forEach.call(document.querySelectorAll('.sig'),function(box){
    sigPad(box,box.getAttribute('data-sig'),cGet,cSet);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.sigclr'),function(b){
    b.onclick=function(){ cSet(b.getAttribute('data-clr'),''); render(); };
  });
  if($('cfAddSign')) $('cfAddSign').onclick=function(){
    CFORM.data.employeeSignoffs.push({employeeName:'',date:'',signature:''});
    CFORM.dirty=true; render();
  };
  if($('cfBack')) $('cfBack').onclick=coachClose;
  if($('cfSave')) $('cfSave').onclick=coachSave;
}
function coachSave(){
  if(CFORM.saving) return;
  var d=CFORM.data, sp=COACH_SPEC[CFORM.type];
  if(CFORM.type!=='groupCoaching'&&CFORM.type!=='qualityCoaching'&&!d.agentName)
    return hubMsg('cfMsg','Choose the agent first.',true);
  CFORM.saving=true; hubMsg('cfMsg','Saving…');
  var body={type:CFORM.type};
  for(var k in d) body[k]=d[k];
  api('/api/portal/hub/coaching',body).then(function(r){
    CFORM.saving=false;
    if(!r.ok) return hubMsg('cfMsg',(r.json&&r.json.error)||'Could not save.',true);
    CFORM={type:null,data:null,dirty:false,saving:false};
    HUB.coaching=null;
    api('/api/portal/hub/coaching').then(function(x){ HUB.coaching=x.ok?x.json:null; render(); });
  });
}

/* ---- reading one back ---- */
/* The list arrives WITHOUT signatures — the proxy strips them on the way out,
   because a base64 image per record is megabytes a browser has no use for. So
   this shows everything that was written except the drawn signature itself;
   the signed document lives in the Hub. */
var CO_HIDE={_id:1,_creationTime:1,_table:1,_label:1,teamLeaderId:1,createdAt:1,
  webhookStatus:1,webhookAt:1,webhookError:1,webhookAttempts:1,clusterConfidence:1};
function coachLabelFor(key){
  var lab=null;
  Object.keys(COACH_SPEC).forEach(function(t){ COACH_SPEC[t].sec.forEach(function(s){ s.f.forEach(function(f){
    if(f[0]===key&&f[1]&&!lab) lab=f[1]; }); }); });
  return lab||key.replace(/([A-Z])/g,' $1').replace(/^./,function(c){return c.toUpperCase();});
}
function clusterName(v){
  var out=null;
  Object.keys(FAMILIES).forEach(function(f){ FAMILIES[f].options.forEach(function(o){ if(o[0]===v) out=o[1]; }); });
  return out||v;
}
function coachRows(s){
  return Object.keys(s).filter(function(k){ return !CO_HIDE[k]&&s[k]!==''&&s[k]!=null; })
    .map(function(k){
      var v=s[k];
      if(k==='criteria'&&v&&typeof v==='object'){
        var scored=[];
        SCORECARD.forEach(function(g){ g[1].forEach(function(r){
          var c=v[r[0]]||{};
          if((c.call1&&c.call1!=='—')||(c.call2&&c.call2!=='—')||(c.call3&&c.call3!=='—'))
            scored.push(esc(r[1])+' — '+esc(c.call1||'—')+' · '+esc(c.call2||'—')+' · '+esc(c.call3||'—'));
        }); });
        if(!scored.length) return '';
        return '<div class="bd-row"><b>Scorecard</b></div><div class="bd-x">'+scored.join('<br>')+'</div>';
      }
      if(Array.isArray(v)){
        var lines=v.map(function(x){
          return esc(Object.keys(x).filter(function(kk){ return kk!=='signature'&&x[kk]; })
            .map(function(kk){ return x[kk]; }).join(' · '));
        }).filter(Boolean);
        if(!lines.length) return '';
        return '<div class="bd-row"><b>'+esc(coachLabelFor(k))+'</b></div><div class="bd-x">'+lines.join('<br>')+'</div>';
      }
      if(/^cluster/.test(k)) v=clusterName(v);
      v=String(v);
      if(v.length>60) return '<div class="bd-row"><b>'+esc(coachLabelFor(k))+'</b></div><div class="bd-x">'+esc(v)+'</div>';
      return '<div class="bd-row"><b>'+esc(coachLabelFor(k))+'</b><div>'+esc(v)+'</div></div>';
    }).join('');
}
/* Reuses the agent drawer's shell rather than building a second one — same
   scrim, same Esc handling, same scroll lock. */

/* ============ ALL FORMS ============
   Both hubs in one list, because "did I do that one?" is a question about the
   month, not about which app it was captured in. Nothing new is fetched: this
   is the same two payloads the Coaching Hub and KPI Hub tabs already hold, put
   in one order. Everything on it is this leader's own — the Worker scopes both
   hubs to the session and there is no request shape that widens it. */
var FILT={q:'',kind:'all'};

function allFormsRows(){
  var out=[];
  ((HUB.coaching&&HUB.coaching.sessions)||[]).forEach(function(x){
    out.push({src:'coaching',id:x._id,kind:x._label||'Coaching',
      who:x.agentName||'(group)',cb:x.employeeCode||'',
      date:x.date||x.dateOfCoaching||'',status:'',
      note:String(x.developmentAreas||x.teamLeaderFeedback||x.coachingDetails||'')});
  });
  ((HUB.kpi&&HUB.kpi.forms)||[]).forEach(function(f){
    out.push({src:'kpi',id:f._id,kind:f.title||'KPI form',
      who:f.agentName||'—',cb:'',
      /* A KPI form has no session date — it is stamped when it is created. */
      date:f.createdAt?new Date(f.createdAt).toISOString().slice(0,10):'',
      status:f.status||'draft',
      note:[f.weekLabel,f.month,f.year].filter(Boolean).join(' · ')});
  });
  var q=FILT.q.toLowerCase();
  return out.filter(function(r){
    if(FILT.kind!=='all'&&r.src!==FILT.kind) return false;
    if(!q) return true;
    return (r.who+' '+r.cb+' '+r.kind+' '+r.note).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
}

/* ---- loading + wiring ---- */
function hubLoad(which){
  if(HUB[which]) { render(); return; }
  api('/api/portal/hub/'+which).then(function(r){
    HUB[which]=r.ok?r.json:{error:(r.json&&r.json.error)||'Could not reach the hub.'};
    render();
  });
}
function hubMsg(id,txt,bad){ var e=$(id); if(e){ e.textContent=txt; e.className='hmsg'+(bad?' bad':' ok'); } }

function wireCoachHub(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-coach-new]'),function(b){
    b.onclick=function(){ coachOpen(b.getAttribute('data-coach-new')); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-coach-view]'),function(b){
    b.onclick=function(){ coachView(b.getAttribute('data-coach-view')); };
  });
}
function wireKpiHub(){
  var b=$('hkSave');
  if(b) b.onclick=function(){
    if(HUB.busy) return;
    var body={action:'create',title:$('hkTitle').value,agentName:$('hkAgent').value,
      weekLabel:$('hkWeek').value,month:$('hkMonth').value,year:parseInt($('hkYear').value,10)};
    HUB.busy=true; hubMsg('hkMsg','Creating…');
    api('/api/portal/hub/kpi',body).then(function(r){
      HUB.busy=false;
      if(!r.ok) return hubMsg('hkMsg',(r.json&&r.json.error)||'Could not create.',true);
      HUB.kpi=null; hubMsg('hkMsg','Created.');
      api('/api/portal/hub/kpi').then(function(x){ HUB.kpi=x.ok?x.json:null; render(); });
    });
  };
  /* Submit and delete. Both go through the same proxy, so the Hub also refuses
     a form id that is not this leader's — the button is a convenience, not the
     boundary. */
  var act=function(attr,action,confirmTxt){
    Array.prototype.forEach.call(document.querySelectorAll('['+attr+']'),function(el){
      el.onclick=function(){
        if(confirmTxt&&!window.confirm(confirmTxt)) return;
        el.disabled=true;
        api('/api/portal/hub/kpi',{action:action,formId:el.getAttribute(attr)}).then(function(r){
          /* a failed submit/delete must SAY so — a silent refetch reads as "it worked" (audit, 2026-08-27) */
          if(!r.ok){ el.disabled=false; toast((r.json&&r.json.error)||'That did not save — try again.'); return; }
          HUB.kpi=null;
          api('/api/portal/hub/kpi').then(function(x){ HUB.kpi=x.ok?x.json:null; render(); });
        });
      };
    });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-kpi-open]'),function(el){
    el.onclick=function(){ kpiOpen(el.getAttribute('data-kpi-open')); };
  });
  act('data-kpi-submit','submit',null);
  act('data-kpi-del','delete','Delete this form? It is removed from the KPI Hub for good.');
}


/* ===================== THE MONTHLY KPI FORM, IN FULL =====================
   The same four pages the KPI Hub shows, editable here and saved back into the
   Hub as `formData`. It is the form 27 of the 29 existing records use.

   THE MATHS IS THE HUB'S MATHS, CARRIED OVER LINE FOR LINE from
   kpi-hub/src/utils/kpiMath.js. "% to Target" is achieved ÷ target as a whole
   percent, and the parser has to cope with what people actually type into those
   cells: "90%", "4:30" as four and a half hours, "R2 136", and the South African
   decimal comma where "0,3" is nought point three but "2,225" is two thousand.
   Re-deriving that by eye would quietly change a number on a signed document, so
   it is transcribed, not rewritten.

   formData is a single JSON string on the Hub's record. The proxy passes it
   through untouched, so signatures already captured in the Hub survive a save
   from here — nothing is dropped by round-tripping. */

/* ============ KPI HUB FORMS ============
   Three documents, one editor. The Hub stores each as a JSON blob in `formData`
   and picks its React page from the form's title, so the shapes here have to
   match field for field: a form filled in on this page opens correctly in the
   Hub, and one filled in there opens correctly here. */

var KPI_KINDS={
  monthly:{ pages:4, weeks:5, weekKey:'weeks',
    rows:[['attendance','Attendance',''],['talkTime','Talk-time',''],['totalSales','Total Sales',''],
          ['spd','SPD',''],['totalGwp','Total GWP',''],['gwpAve','GWP Ave',''],
          ['insOptIns','Ins Opt-ins',''],['referrals','Referrals',''],['qaScore','QA Score','']] },
  /* Nesting and PIP carry their graduation targets pre-filled and editable,
     exactly as the Hub seeds them. */
  nesting:{ pages:2, weeks:0, weekKey:null,
    rows:[['attendance','Attendance','90%'],['talkTime','Talk-time','04:30'],['totalSales','Total Sales','10'],
          ['spd','SPD','2'],['totalGwp','Total GWP','R890'],['gwpAve','GWP Ave','R89'],
          ['qaScore','QA score','90%']] },
  pip:{ pages:2, weeks:2, weekKey:'pipWeeks',
    rows:[['attendance','Attendance','90%'],['talkTime','Talk-time','04:30'],['totalSales','Total Sales','40'],
          ['spd','SPD','8'],['totalGwp','Total GWP','R3 560'],['gwpAve','GWP Ave','R89'],
          ['qaScore','QA score','90%']] }
};
/* The Hub routes on the title too — there is no kind field on the record. */
function kpiKind(title){
  var t=String(title||'').toLowerCase();
  if(t.indexOf('nesting')>=0) return 'nesting';
  if(t.indexOf('improvement')>=0||t.indexOf('pip')>=0) return 'pip';
  return 'monthly';
}
var WEEK_NAMES=['Week One','Week Two','Week Three','Week Four','Week Five'];
var OUTCOMES=[['exceeded','Exceeded Performance Expectations'],['met','Met Performance Expectations'],
  ['partiallyMet','Partially Met Performance Expectations'],['didNotMeet','Did Not Meet Performance Expectations']];
var FINAL_OUTCOMES=[['satisfactory','Performance Satisfactory'],
  ['improvementRequired','Performance Improvement Required'],['pipInitiated','PIP Initiated']];

/* --- kpiMath.js, verbatim --- */
function parseKpiValue(raw){
  if(raw==null) return null;
  var s=String(raw).trim();
  if(!s) return null;
  var hms=s.match(/^(\d+):(\d{1,2}):(\d{1,2})$/);
  if(hms) return +hms[1]*60 + +hms[2] + +hms[3]/60;
  var hm=s.match(/^(\d+):(\d{1,2})$/);
  if(hm) return +hm[1]*60 + +hm[2];
  var n=s.replace(/[^0-9.,-]/g,'');
  if(n.indexOf(',')>=0){
    if(/,\d{1,2}$/.test(n)) n=n.replace(/\./g,'').replace(',','.');
    else n=n.replace(/,/g,'');
  }
  var parsed=parseFloat(n);   /* not "num" — that is the global formatter */
  return isFinite(parsed)?parsed:null;
}
function computePct(target,achieved){
  var t=parseKpiValue(target), a=parseKpiValue(achieved);
  if(t===null||a===null||t===0) return null;
  return Math.round((a/t)*100)+'%';
}

function kpiBlank(kind){
  var k={}; KPI_KINDS[kind].rows.forEach(function(r){ k[r[0]]={target:r[2]||'',achieved:'',pct:''}; });
  return k;
}
function kpiWeekBlank(kind){
  var w={kpis:kpiBlank(kind),agentName:'',agentDate:'',tlName:'',tlDate:''};
  if(kind==='monthly'){ w.agreedPlan=''; w.agentSignature=''; w.tlSignature=''; }
  return w;
}
function kpiDefault(kind){
  var d={agentFullName:'',lineManagerFullName:'',date:'',kpis:kpiBlank(kind)};
  if(kind==='monthly'){
    d.employeeDate='';d.employeeSignature='';d.teamLeaderDate='';d.teamLeaderSignature='';
    d.weeks=[0,1,2,3,4].map(function(){return kpiWeekBlank(kind);});
    d.performanceOutcome='';d.strengthsIdentified=['','',''];d.areasForImprovement=['','',''];
    d.planOfActionP3=['','',''];d.planOfActionP4=['','',''];
    d.finalOutcome='';d.reviewDate='';d.agentReviewSignature='';d.tlReviewSignature='';
  } else if(kind==='nesting'){
    d.agentSignature='';d.tlSignature='';
    d.performanceOutcome='';d.reviewDate='';d.reviewAgentSignature='';d.reviewTlSignature='';
  } else {
    d.employeeName='';d.managerName='';d.ackDate='';d.employeeSignature='';
    d.pipWeeks=[0,1].map(function(){return kpiWeekBlank(kind);});
  }
  return d;
}

var FORM={id:null,kind:'monthly',meta:null,data:null,page:1,dirty:false,saving:false};

function kpiOpen(id){
  var f=(HUB.kpi&&HUB.kpi.forms||[]).filter(function(x){return x._id===id;})[0];
  if(!f) return;
  var kind=kpiKind(f.title), d=kpiDefault(kind), rows=KPI_KINDS[kind].rows;
  /* An older record may predate a KPI row. Fill the gap rather than let the
     editor throw on a missing key and lose the whole form. */
  function fill(k){
    if(!k) k={};
    rows.forEach(function(r){
      if(!k[r[0]]) k[r[0]]={target:r[2]||'',achieved:'',pct:''};
      k[r[0]].pct=computePct(k[r[0]].target,k[r[0]].achieved)||'';
    });
    return k;
  }
  if(f.formData){
    try{
      var p=JSON.parse(f.formData);
      for(var k in p) d[k]=p[k];
      /* The PIP's agent name used to be stored as `agentName`. */
      if(kind==='pip'&&!d.agentFullName&&p.agentName) d.agentFullName=p.agentName;
    }catch(e){}
  }
  d.kpis=fill(d.kpis);
  var wk=KPI_KINDS[kind].weekKey;
  if(wk){
    var n=KPI_KINDS[kind].weeks, old=d[wk]||[];
    d[wk]=[]; for(var i=0;i<n;i++) d[wk].push(old[i]||kpiWeekBlank(kind));
    d[wk].forEach(function(w){ w.kpis=fill(w.kpis); });
  }
  if(!d.agentFullName&&f.agentName) d.agentFullName=f.agentName;
  if(!d.lineManagerFullName) d.lineManagerFullName=(TEAM&&TEAM.name)||'';
  FORM={id:id,kind:kind,meta:f,data:d,page:1,dirty:false,saving:false};
  render();
}
function kpiClose(){
  if(FORM.dirty&&!window.confirm('Close without saving? Your changes to this form will be lost.')) return;
  FORM={id:null,kind:'monthly',meta:null,data:null,page:1,dirty:false,saving:false};
  render();
}

/* ---- reading and writing the nested paths ---- */
function fGet(p){ return p.split('.').reduce(function(o,k){return o==null?o:o[k];},FORM.data); }
function fSet(p,v){
  var ks=p.split('.'), o=FORM.data;
  for(var i=0;i<ks.length-1;i++) o=o[ks[i]];
  o[ks[ks.length-1]]=v;
  FORM.dirty=true;
  var msg=$('fMsg'); if(msg){ msg.textContent='Unsaved changes'; msg.className='hmsg'; }
}
function wireKpiForm(){
  if(!FORM.id) return;
  Array.prototype.forEach.call(document.querySelectorAll('.fpg'),function(b){
    b.onclick=function(){ FORM.page=parseInt(b.getAttribute('data-page'),10); render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.kc'),function(el){
    el.oninput=function(){
      var p=el.getAttribute('data-p');
      fSet(p,el.value);
      /* Recompute the row's % the moment either cell changes — the Hub does it on
         save, and a team leader filling this in wants to see it now. */
      var m=p.match(/^(.*)\.(target|achieved)$/);
      if(m){
        var cell=fGet(m[1]);
        var pctEl=document.querySelector('[data-pct="'+m[1]+'"]');
        var v=computePct(cell.target,cell.achieved);
        cell.pct=v||'';
        if(pctEl) pctEl.textContent=v||'—';
      }
    };
  });
  /* One value, drawn as a row of boxes: ticking one clears the rest, and
     ticking the set one clears the field — the same behaviour as the Hub. */
  Array.prototype.forEach.call(document.querySelectorAll('[data-out]'),function(el){
    el.onchange=function(){ fSet(el.getAttribute('data-out'),el.checked?el.value:''); render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.sig'),function(box){
    sigPad(box,box.getAttribute('data-sig'));
  });
  Array.prototype.forEach.call(document.querySelectorAll('.sigclr'),function(b){
    b.onclick=function(){ fSet(b.getAttribute('data-clr'),''); render(); };
  });
  if($('fBack')) $('fBack').onclick=kpiClose;
  if($('fSave')) $('fSave').onclick=function(){ kpiSave(false); };
  if($('fSubmit')) $('fSubmit').onclick=function(){
    if(!window.confirm('Submit this form? It is marked submitted in the KPI Hub.')) return;
    kpiSave(true);
  };
}
function kpiSave(submit){
  if(FORM.saving) return;
  FORM.saving=true;
  var msg=$('fMsg'); if(msg){ msg.textContent='Saving…'; msg.className='hmsg'; }
  api('/api/portal/hub/kpi',{action:'update',formId:FORM.id,
      formData:JSON.stringify(FORM.data),agentName:FORM.data.agentFullName||FORM.meta.agentName||''})
    .then(function(r){
      if(!r.ok){ FORM.saving=false; if(msg){msg.textContent=(r.json&&r.json.error)||'Could not save.';msg.className='hmsg bad';} return; }
      if(!submit){
        FORM.saving=false; FORM.dirty=false;
        if(msg){ msg.textContent='Saved.'; msg.className='hmsg ok'; }
        HUB.kpi=null; api('/api/portal/hub/kpi').then(function(x){ HUB.kpi=x.ok?x.json:null; });
        return;
      }
      api('/api/portal/hub/kpi',{action:'submit',formId:FORM.id}).then(function(s){
        FORM.saving=false; FORM.dirty=false;
        HUB.kpi=null;
        api('/api/portal/hub/kpi').then(function(x){
          HUB.kpi=x.ok?x.json:null;
          FORM.meta=(HUB.kpi&&HUB.kpi.forms||[]).filter(function(f){return f._id===FORM.id;})[0]||FORM.meta;
          render();
        });
      });
    });
}

/* A signature is drawn, not typed. Canvas → data URL, stored inside formData
   exactly as the Hub stores it, so a signature captured here opens correctly in
   the Hub and the other way round. */
/* A signature pad writes through whichever editor opened it — the KPI form and
   the coaching form keep separate state, so the setter is passed in rather than
   assumed. */
function sigPad(box,path,set){
  set=set||fSet;
  if(box.querySelector('img')) return;
  var c=document.createElement('canvas');
  c.width=box.clientWidth*2||600; c.height=box.clientHeight*2||160;
  c.style.width='100%'; c.style.height='100%';
  box.innerHTML=''; box.appendChild(c);
  var x=c.getContext('2d'); x.scale(2,2); x.lineWidth=1.8; x.lineCap='round'; x.strokeStyle='#0F1E36';
  var down=false,last=null,drew=false;
  var pos=function(e){ var r=c.getBoundingClientRect();
    var t=(e.touches&&e.touches[0])||e;
    return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  var start=function(e){ down=true; last=pos(e); e.preventDefault(); };
  var move=function(e){ if(!down) return; var p=pos(e);
    x.beginPath(); x.moveTo(last.x,last.y); x.lineTo(p.x,p.y); x.stroke(); last=p; drew=true; e.preventDefault(); };
  var end=function(){ if(!down) return; down=false; if(drew) set(path,c.toDataURL('image/png')); };
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false}); c.addEventListener('touchmove',move,{passive:false});
  c.addEventListener('touchend',end);
}

/* ===================== THE AGENTOS SHELL =====================
   Navy sidebar + main column, the same frame every other app in the suite
   wears. The nav is short on purpose: an agent has three places to be, a team
   leader four. The sidebar carries who is signed in and how fresh the numbers
   are — the Data Trust habit from the management apps, shrunk to one line. */

var ICON={month:'🎯',mtd:'📅',week:'🗓️',day:'📆',coaching:'⭐',calc:'🧮',team:'👥',agent:'👤',results:'📊',kpi:'📋',prog:'📈',nik:'✦',forms:'🗂️',wimpy:'🍔'};

/* The nav must match the SECTIONS actually on screen, which is decided by the
   view being rendered — not by the account. A team leader drilling into one of
   their agents is looking at an agent page (month / coaching / commission); a nav
   built from their role would point at a #sec-team that is not there. */
/* The nav must match the PAGES the current view actually has. A team leader
   drilling into one of their agents is looking at an agent page, so they get the
   agent nav plus a way back — a nav built from their role would offer a team page
   that is not rendered. */
/* THE PROTOTYPE'S NAV, both roles. Its agent side is Today · Commission ·
   My Progress · Nikola; its team leader side is My Team · KPI Hub · Coaching Hub ·
   HR Operations · Team Results · Nikola. HR Operations is left out on Nick's
   instruction and there is no data behind it here. Month to date stays because he
   asked for it separately, and My coaching because it is real and already working. */
var TL_VIEWS=['team','help','kpihub','coach_team','forms','results','mtd_team','weekly_team','daily_team','nik_team'];
/* The third view. Campaign · Team Leaders · Assistance · Nikola — the spec's
   four pages, nothing else. */
var CM_VIEWS=['cm','cm_teams','cm_assist','cm_nik'];
function navFor(active){
  if(CM_VIEWS.indexOf(active)>=0)
    return [['cm','Campaign',ICON.results],['cm_teams','Team Leaders',ICON.team],
            ['cm_assist','Assistance',ICON.kpi],['cm_nik','Nikola',ICON.nik]];
  if(TL_VIEWS.indexOf(active)>=0)
    /* 'All Forms' is OFF the nav (Nick, 2026-08-26) — the view survives for old
       links; both hubs still carry their own forms. */
    return [['team','My Team',ICON.team],['help','Help Center',ICON.coaching],
            ['kpihub','KPI Hub',ICON.kpi],
            ['coach_team','Coaching Hub',ICON.coaching],
            ['results','Team Results',ICON.results],
            ['mtd_team','Month to date',ICON.mtd],['weekly_team','Weekly',ICON.week],
            ['daily_team','Daily',ICON.day],['nik_team','Nikola',ICON.nik]];
  /* 'My coaching' is OFF the agent nav (Nick, 2026-08-26). The view itself still
     exists — the "Ask … to help" button on My Progress deep-links to it, and the
     coaching themes still show on My Progress and Today — there is simply no tab. */
  return [['month','Today',ICON.month],['calc','Commission',ICON.calc],
          ['progress','My Progress',ICON.prog],
          ['wimpy','Wimpy Order',ICON.wimpy],
          ['nik','Nikola',ICON.nik]];
}

/* Freshness, stated plainly. A number on stale data is a confident wrong
   answer, which is why the management apps lead with a Data Trust bar; this is
   the same idea in one line an agent will actually read. */
function freshHTML(){
  if(!D||!D.updatedAt) return '';
  var age=(Date.now()-Date.parse(D.updatedAt))/3600000;
  var col=age<6?'#34D399':(age<26?'#FBBF24':'#FB7185');
  var word=age<6?'Up to date':(age<26?'Updated earlier today':'Waiting on new data');
  return '<div class="sys-card"><div class="t"><span class="sys-dot" style="background:'+col+'"></span>'+esc(word)+'</div>'
    +'<div class="l">Numbers last refreshed '+esc(stamp())+'.'
    +(D.coaching&&D.coaching.stale?'<br>Coaching is showing an older copy.':'')+'</div></div>';
}

function sidebarHTML(active){
  var nm=(TEAM&&TEAM.name)||(D&&D.name)||(U&&(U.name||U.full_name))||'';
  /* Label the ACCOUNT, not the screen. On a drilldown the payload is one agent's
     detail, which used to make a team leader's own sidebar say "Agent" while they
     were looking at somebody else's month. TEAM (their own page) is the reliable
     record of who is signed in, because a drilldown never overwrites it. */
  var acct=TEAM||D||{};
  var role=(acct.role==='campaign_manager'||acct.scope==='campaign')?'Campaign Manager'
    :(acct.role==='team_leader')?'Team Leader'
    :(acct.staff||acct.scope==='all')?'Management preview'
    :(acct.role==='agent')?'Agent':'Signed in';
  return '<aside class="sidebar" id="side">'
    +'<div class="logo-card"><img class="logo-img" src="'+LOGO+'" alt="The Chatterbox">'
    +'<div class="logo-sub">Agent Analytics</div></div>'
    +'<div class="nav"><div class="nav-label">'
    +(CM_VIEWS.indexOf(active)>=0?'My campaign':active==='team'?'My team':'My performance')+'</div>'
    +navFor(active).map(function(n){
      return '<button class="nav-item'+(n[0]===active?' active':'')+'" data-view="'+n[0]+'">'
        +'<span class="ic">'+n[2]+'</span>'+esc(n[1])+'</button>';
    }).join('')
    +'</div>'
    +freshHTML()
    +'<div class="user-card"><div class="user-av" style="background:hsl('+hue(nm)+',58%,52%)">'+esc(initials(nm))+'</div>'
    +'<div><div class="user-nm">'+esc(nm)+'</div><div class="user-rl">'+esc(role)+'</div></div>'
    +'<button class="signout" id="signOutBtn">⏻</button></div>'

}

/* One frame, used by every screen after sign-in. `body` is the main column. */
function shell(title,sub,body,active,right){
  $('root').innerHTML='<div class="app">'+sidebarHTML(active||'month')+'<div class="scrim" id="scrim"></div>'
    +'<main class="main"><div class="wrap">'
    +'<div class="topbar"><button class="menu-btn" id="menuBtn">☰</button>'
    +'<div><div class="page-title">'+title+'</div><div class="page-sub">'+sub+'</div></div>'
    +'<div class="topbar-right">'+(right||'')+'</div></div>'
    +'<div class="reveal">'+body+'</div>'
    +'</div></main></div>';
  wireShell();
  window.scrollTo(0,0);

function wireShell(){
  var b=$('signOutBtn'); if(b) b.onclick=signOut;
  var m=$('menuBtn'), s=$('side'), sc=$('scrim');
  var close=function(){ if(s)s.classList.remove('open'); if(sc)sc.classList.remove('on'); };
  if(m) m.onclick=function(){ if(s)s.classList.toggle('open'); if(sc)sc.classList.toggle('on'); };
  if(sc) sc.onclick=close;
  Array.prototype.forEach.call(document.querySelectorAll('.nav-item[data-view]'),function(n){
    /* Leaving the KPI tab closes an open form. A half-typed form left hidden
       behind another tab is how somebody loses an hour of typing. */
    n.onclick=function(){
      close();
      var nv=n.getAttribute('data-view');
      if(typeof FORM!=='undefined'&&FORM.id&&nv!=='kpihub'){
        if(FORM.dirty&&!window.confirm('Leave this form? Unsaved changes are lost.')) return;
        FORM={id:null,kind:'monthly',meta:null,data:null,page:1,dirty:false,saving:false};
      }
      if(typeof CFORM!=='undefined'&&CFORM.type&&nv!=='coach_team'){
        if(CFORM.dirty&&!window.confirm('Leave this session? It has not been written to the Hub.')) return;
        CFORM={type:null,data:null,dirty:false,saving:false};
      }
      VIEW=nv; render();
    };
  });
}

/* Re-render the current person at the current nav position. Everything is
   already in memory — switching sections never re-asks the Worker. */
function render(){
  if(!D) return;
  /* The campaign manager is the third branch, decided by what is LOADED —
     the same rule as isTeam below. */
  if(D.scope==='campaign'&&!D.me){
    if(CM_VIEWS.indexOf(VIEW)<0) VIEW='cm';
    return cmView();
  }
  var isTeam=(D.role==='team_leader'||D.scope==='team'||D.scope==='all')&&!D.__back&&!D.me;
  /* A drilldown is an AGENT page even though the account is a team leader, so the
     view has to be decided by what is loaded, not by the role. */
  if(isTeam){
    if(TL_VIEWS.indexOf(VIEW)<0) VIEW='team';
    return teamView();
  }
  if(['month','calc','progress','coaching','nik','wimpy'].indexOf(VIEW)<0) VIEW='month';
  if(D.notReported) return notReported();
  if(D.me) return show(D.me);
}

function loginScreen(msg){
  preShell('<div class="greet">'+esc(greeting())+'</div>'

    +'<div class="card">'

    +'<label for="cb">CB number</label>'
    +'<input id="cb" type="text" inputmode="text" autocomplete="username" autocapitalize="characters" '
    +'placeholder="CB123" aria-label="CB number">'
    +'<label for="pw">Password</label>'
    +'<input id="pw" type="password" autocomplete="current-password" placeholder="Your password" aria-label="Password">'
    +'<button class="primary" id="go">Sign in</button>'
    +'</div>'
    +'<p class="why" style="text-align:center;margin-top:14px">Not sure of your CB number or password? Ask your team leader.</p>');
  var cb=$('cb'), pw=$('pw'), go=$('go');
  var fail=function(m){ var e=$('lerr'); if(e){ e.textContent=m; e.style.display='block'; }
    go.disabled=false; go.textContent='Sign in'; };
  var submit=function(){
    var u=cb.value.trim(), p=pw.value;
    if(!u||!p) return fail('Enter your CB number and your password.');
    go.disabled=true; go.textContent='Signing in…';
    api('/api/login',{username:u,password:p}).then(function(r){
      if(r.status===200&&r.json.token){
        try{ sessionStorage.setItem(TKEY,r.json.token); }catch(e){}
        U=r.json.user;
        if(U.must_change_password) return changePassword();
        loadPortal();

  };
  go.onclick=submit;
  pw.onkeydown=function(e){ if(e.key==='Enter') submit(); };
  cb.onkeydown=function(e){ if(e.key==='Enter') pw.focus(); };
  setTimeout(function(){ try{cb.focus();}catch(e){} },80);
}

/* Only reached when an account is issued with --force-change. The rule (10
   characters) is the Worker's, restated here so the failure is instant rather
   than a round trip. */
function changePassword(){
  preShell('<div class="greet">Choose your own password</div>'
    +'<div class="greet-sub">You are signed in as <b>'+esc(U.full_name||U.username)+'</b>. Pick a password only you know.</div>'
    +'<div class="card"><div class="err" id="perr" style="display:none"></div>'
    +'<label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" placeholder="At least 10 characters">'
    +'<label for="p2">Confirm it</label><input id="p2" type="password" autocomplete="new-password" placeholder="Type it again">'
    +'<button class="primary" id="pgo">Save and continue</button></div>');
  $('pgo').onclick=function(){
    var a=$('p1').value, b=$('p2').value, e=$('perr');
    var bad=function(m){ e.textContent=m; e.style.display='block'; };
    if(a.length<10) return bad('At least 10 characters.');
    if(a!==b) return bad('Those two do not match.');
    $('pgo').disabled=true;
    api('/api/password',{new_password:a}).then(function(r){
      if(r.ok){ U.must_change_password=false; loadPortal(); }
      else { $('pgo').disabled=false; bad(r.json.error||'Could not save that password.'); }
    });
  };
}

/* ===================== loading what you are allowed to see ===================== */
/* NO MONTH FILTER, ON PURPOSE (Nick 2026-08-26, reversing the same morning's request):
   the portal always opens on the LIVE month and nothing else - Month to Date, Weekly and
   Daily all read the current month from its 1st to the latest published day. The Worker
   still understands ?month= and VAS still files a frozen copy of each month as it ends,
   so if a look-back is ever wanted again it is a UI change only; nothing here sends it. */
function loadPortal(){
  $('root').innerHTML='<div class="msg"><div class="spin"></div><div class="d">Loading your numbers…</div></div>';
  api('/api/portal/overview').then(function(r){
    if(r.status===401){ try{sessionStorage.removeItem(TKEY);}catch(e){} return loginScreen('Your session has expired. Please sign in again.'); }
    if(!r.ok) return fatal('We could not open your page', r.json.error||'Please try again in a minute.', r.status>=500);
    D=r.json;
    if(D.scope==='campaign') return cmView();
    if(D.role==='team_leader'||D.scope==='team'||D.scope==='all') return teamView();
    if(D.notReported) return notReported();
    if(!D.me) return fatal('Nothing to show yet','No figures have been published for you this month.');
    show(D.me);
  })
  /* A RENDER THAT THROWS MUST NOT LOOK LIKE A SLOW NETWORK. Without this the
     exception vanishes into the promise, the page keeps showing "Loading your
     numbers…" for ever and there is nothing in the console to find. A shadowed
     helper did exactly that to the team leader page. Fail visibly instead. */
  .catch(function(e){
    fatal('We could not draw your page', String((e&&e.message)||e||'Unexpected error')+'. Please try again.', true);
  });
}

/* On the roster, but this engine does not report their campaign — or they have

  shell(esc(greeting())+', '+esc(firstName(D.name)),
    'Your month — '+esc(prettyPeriod()),
    '<div class="card"><p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--body)">'+esc(body)+'</p></div>'
    +coachHTML(D.coaching,true), 'month');
}



/* ===================== WIMPY ORDER =====================
   The agent's own lunch order, inside their own page. It reuses the sign-in they
   already have, the shell every other tab wears, and the same api() helper — so
   there is no second app, no second login, and no second idea of who they are.

   WHERE THE NUMBERS COME FROM. The menu and every price are served by the Worker
   (worker/src/wimpy.mjs) and rendered here; not one price is written in this
   file, so a price change is one edit in one place. The total this page shows is
   for the agent to read: the Worker re-prices the whole order on submit from its
   own copy, and the figure that reaches the kitchen is the one IT worked out.

   WHY THE ORDER IS POSTED TO OUR OWN WORKER. The CSP lets this page reach itself
   and the Worker, nothing else — a fetch straight to the n8n webhook would be
   blocked by the browser. Proxying is also how the Coaching Hub and the Help
   Center already work, and it keeps the webhook URL off 130 phones. */

var WMENU=null, WDAY=null, WCART=[], WCAT='breakfast', WNOTE='', WEDIT=null, WSTATE='order', WERR='', WBUSY=false, WDONE=null, WOPEN=false;

function wZar(v){ return 'R'+Number(v||0).toFixed(2); }
/* Money in cents until the last moment: adding a hundred floats is how a total
   ends in .0000000004. The Worker does the same, so the two agree exactly. */
function wCents(v){ return Math.round(Number(v||0)*100); }
/* A price with the REAL price it is cut from, and the saving (Nick, 31 Aug:
   "add the 20% off but make it the real price"). wasPrice is decided by the
   Worker — a supplied Wimpy list price where Nick gave one, otherwise the
   brief's own "~20% off" rule run backwards — and this only renders it. The
   badge shows each item's ACTUAL saving, so a deeper cut reads as the deeper
   cut it is rather than being flattened to a uniform claim. */
function wPriceInner(base, was){
  if(!(was>base)) return wZar(base);
  return wZar(base)+' <s class="was">'+wZar(was)+'</s>'
    +'<em class="save">save '+Math.round((1-base/was)*100)+'%</em>';
}
function wItemDef(id){ return ((WMENU&&WMENU.items)||[]).filter(function(i){return i.id===id;})[0]||null; }
function wLineCents(l){
  var d=wItemDef(l.id); if(!d||d.basePrice==null) return 0;
  var c=wCents(d.basePrice);
  (l.added||[]).forEach(function(a){ c+=wCents(a.price); });
  return c*(l.quantity||1);
}
function wTotalCents(){ return WCART.reduce(function(n,l){ return n+wLineCents(l); },0); }

function wLoadMenu(){
  api('/api/portal/wimpy/menu').then(function(r){
    WMENU = r.ok ? r.json : {error:(r.json&&r.json.error)||'The menu could not be loaded.'};
    if(VIEW==='wimpy') render();
  });
}

/* ---------- the page ---------- */
function wimpyPage(){
  if(!WMENU) { wLoadMenu(); return '<div class="card"><p class="why">Loading the menu…</p></div>'; }
  if(WMENU.error) return '<div class="card"><p class="why">'+esc(WMENU.error)+'</p></div>';
  if(WSTATE==='done') return wDonePage();
  if(WSTATE==='confirm') return wConfirmPage();

  var who='<div class="wp-who">'
    +'<div><span class="k">Agent</span><span class="v">'+esc(D.name||'')+'</span></div>'
    +'<div><span class="k">CB Number</span><span class="v">'+esc(D.cb||'')+'</span></div></div>';

  /* THE 3-3-3-1 HEADER (the weekday brief, 2026-08-31). The Big One is the
     hero of the day and gets the strongest emphasis on the page; the week strip
     underneath is the reason to come back tomorrow. Weekend: the nine core
     choices stand and the hero slot trails Monday's feature instead. All of it
     renders from the menu payload - the day, the item and the price are decided
     by the Worker, never by this page's clock. */
  var hero='';
  if(WMENU.bigOne){
    var bo=WMENU.bigOne;
    hero='<div class="wp-hero"><div class="wp-hero-day">'+esc((bo.dayName||'').toUpperCase())+' · TODAY’S BIG ONE</div>'
      +'<div class="wp-hero-name">'+esc(bo.name)+'</div>'
      +'<div class="wp-hero-desc">'+esc(bo.description||'')+'</div>'
      +'<div class="wp-hero-row"><span class="wp-hero-price">'+wPriceInner(bo.basePrice,bo.wasPrice)+'</span>'
      +'<button class="btn primary" data-wadd="'+esc(bo.id)+'">Customise &amp; add</button></div></div>';
  }else if(WMENU.weekend){
    hero='<div class="wp-hero off"><div class="wp-hero-day">TODAY’S BIG ONE</div>'
      +'<div class="wp-hero-name">Back Monday</div>'
      +'<div class="wp-hero-desc">'+esc(WMENU.weekend.message||'')+' Monday’s feature: '
      +esc(WMENU.weekend.next.name)+' — '+wZar(WMENU.weekend.next.basePrice)+'.</div></div>';
  }
  /* THE WEEK, READABLE (Nick: "just to see what was available"). Tapping a day
     opens its Big One to READ — what is in it, its price, the real price it is
     cut from — and says plainly which day it can be had. Deliberately no add
     button on an off day: the Worker refuses an off-day Big One by name, and a
     button that always errors is worse than no button at all. */
  var week='';
  if(WMENU.week&&WMENU.week.length){
    week='<div class="wp-week">'+WMENU.week.map(function(w){
      return '<div class="wp-day'+(w.today?' today':'')+(WDAY===w.day?' open':'')
        +'" data-wday="'+w.day+'" role="button" tabindex="0"'
        +' aria-label="'+esc(w.dayName+': '+w.name+', '+wZar(w.basePrice))+'">'
        +'<span class="d">'+esc(w.dayName.slice(0,3))+'</span>'
        +'<span class="n">'+esc(w.name)+'</span>'
        +'<span class="p">'+wZar(w.basePrice)
        +(w.wasPrice>w.basePrice?' <s>'+wZar(w.wasPrice)+'</s>':'')+'</span></div>';
    }).join('')+'</div>';
    var wv=WMENU.week.filter(function(w){return w.day===WDAY;})[0];
    if(wv&&!wv.today){
      week+='<div class="wp-peek"><div class="d">'+esc(wv.dayName.toUpperCase())+'’S BIG ONE</div>'
        +'<div class="n">'+esc(wv.name)+'</div>'
        +'<div class="desc">'+esc(wv.description||'')+'</div>'
        +'<div class="row"><span class="p">'+wPriceInner(wv.basePrice,wv.wasPrice)+'</span>'
        +'<span class="when">Available '+esc(wv.dayName)
        +(WMENU.bigOne?' — today’s is the '+esc(WMENU.bigOne.name)+'.':' — the Big One returns Monday.')
        +'</span></div></div>';
    }
  }
  var header='<div class="wp-title"><h2>'+esc(WMENU.title||'Weekday Value Menu')+'</h2>'
    +'<span class="sub">3 breakfasts · 3 burgers · 3 toasteds · today’s Big One — made fresh</span></div>';

  var cats='<div class="wp-cats">'+(WMENU.categories||[]).map(function(c){
    return '<button class="wp-cat'+(c.id===WCAT?' on':'')+'" data-wcat="'+esc(c.id)+'">'+esc(c.label)+' <span class="ct">3</span></button>';
  }).join('')+'</div>';

  var grid='<div class="wp-grid">'+(WMENU.items||[]).filter(function(i){return i.category===WCAT;}).map(function(i){
    /* An item with no price is shown and NOT orderable — the brief is explicit
       that an unverified price must not be invented, and hiding the item would
       be its own kind of lie. */
    var priced=i.basePrice!=null;
    return '<div class="wp-card"><h4>'+esc(i.name)+'</h4>'
      +'<div class="d">'+esc(i.description||'')+'</div>'
      +(priced?'<div class="p">'+wPriceInner(i.basePrice,i.wasPrice)+'</div>'
              :'<div class="p na">Price not set yet</div>')
      +(priced?'<button class="btn primary" data-wadd="'+esc(i.id)+'">Customise &amp; add</button>'
              :'<button class="btn" disabled title="This item has no price configured">Unavailable</button>')
      +'</div>';
  }).join('')+'</div>';

  return who+header+hero+week+'<div class="wp-wrap"><div>'+cats+grid+'<div class="wp-pad"></div></div>'+wCartHTML()+'</div>';
}

    (l.removed||[]).forEach(function(r){ bits.push('<li class="rm">No '+esc(String(r).toLowerCase())+'</li>'); });

      +'<button class="btn primary" id="wpReview" style="width:100%;margin-top:10px">Submit Wimpy Order</button>':'')
    +'</div>';

/* ---------- the customisation sheet ---------- */
function wOpen(id, editIx){
  var d=wItemDef(id); if(!d||d.basePrice==null) return;
  var start = editIx!=null ? JSON.parse(JSON.stringify(WCART[editIx]))
    : { id:d.id, quantity:1, choices:{}, removed:[], added:[] };
  var host=document.createElement('div'); host.className='cmov'; host.id='wpSheet';
  document.body.appendChild(host);

  var draw=function(){
    var cents=wCents(d.basePrice);
    (start.added||[]).forEach(function(a){ cents+=wCents(a.price); });
    var total=cents*(start.quantity||1);
    var missing=(d.choices||[]).filter(function(ch){ return ch.required && !(start.choices||{})[ch.id]; });

    var choices=(d.choices||[]).map(function(ch){
      return '<label>'+esc(ch.label)+(ch.required?' <span style="color:var(--red)">*</span>':'')+'</label>'
        +'<div class="wp-opts">'+ch.options.map(function(o){
          var on=(start.choices||{})[ch.id]===o;
          return '<button class="wp-opt rd'+(on?' on':'')+'" data-wch="'+esc(ch.id)+'" data-wval="'+esc(o)+'">'
            +'<span class="bx">'+(on?'✓':'')+'</span>'+esc(o)+'</button>';
        }).join('')+'</div>';
    }).join('');

    var removable=(d.includedIngredients||[]).filter(function(g){return g.removable;});
    var fixed=(d.includedIngredients||[]).filter(function(g){return !g.removable;});
    var inc=(d.includedIngredients||[]).length?'<label>Included — untick anything to leave it out</label><div class="wp-opts">'
      +fixed.map(function(g){ return '<button class="wp-opt on" disabled><span class="bx">✓</span>'+esc(g.name)+'</button>'; }).join('')
      +removable.map(function(g){
        var off=(start.removed||[]).indexOf(g.name)>=0;
        return '<button class="wp-opt'+(off?'':' on')+'" data-wrm="'+esc(g.name)+'">'
          +'<span class="bx">'+(off?'':'✓')+'</span><span'+(off?' class="gone"':'')+'>'+esc(g.name)+'</span>'
          +(off?'<span class="pr">removed</span>':'')+'</button>';
      }).join('')+'</div>':'';

    var addons=(d.addOns||[]).length?'<label>Add extras</label><div class="wp-opts">'
      +d.addOns.map(function(a){
        var on=(start.added||[]).some(function(x){return x.id===a.id;});
        return '<button class="wp-opt'+(on?' on':'')+'" data-wao="'+esc(a.id)+'">'
          +'<span class="bx">'+(on?'✓':'')+'</span>'+esc(a.name)
          +'<span class="pr">'+(a.price?'+'+wZar(a.price):'no charge')+'</span></button>';
      }).join('')+'</div>':'';

    host.innerHTML='<div class="cmpanel">'
      +'<h3>'+esc(d.name)+'</h3>'
      +'<div class="sub">Base price '+wZar(d.basePrice)+' · '+esc(d.description||'')+'</div>'
      +(missing.length?'<div class="wp-err">Choose a '+missing.map(function(m){return esc(m.label.toLowerCase());}).join(' and a ')+' before adding this.</div>':'')
      +choices+inc+addons
      +'<label>Quantity</label>'
      +'<div class="wp-qty"><button id="wpMinus">−</button><span class="q" id="wpQ">'+start.quantity+'</span><button id="wpPlus">+</button></div>'
      +'<div class="wp-bar">'
      +'<button class="btn" id="wpCancel">Cancel</button>'
      +'<span class="v">'+wZar(total/100)+'</span>'
      +'</div>'
      +'<button class="btn primary" id="wpAdd" style="width:100%;margin-top:12px"'+(missing.length?' disabled':'')+'>'
      +(editIx!=null?'Save changes':'Add to order')+'</button>'
      +'</div>';

    host.querySelectorAll('[data-wch]').forEach(function(b){ b.onclick=function(){
      start.choices=start.choices||{}; start.choices[b.getAttribute('data-wch')]=b.getAttribute('data-wval'); draw(); }; });
    host.querySelectorAll('[data-wrm]').forEach(function(b){ b.onclick=function(){
      var g=b.getAttribute('data-wrm'); start.removed=start.removed||[];
      var i=start.removed.indexOf(g); if(i>=0) start.removed.splice(i,1); else start.removed.push(g); draw(); }; });
    host.querySelectorAll('[data-wao]').forEach(function(b){ b.onclick=function(){
      var id2=b.getAttribute('data-wao'); start.added=start.added||[];
      var i=-1; start.added.forEach(function(x,ix2){ if(x.id===id2) i=ix2; });
      if(i>=0) start.added.splice(i,1);
      else { var a=(d.addOns||[]).filter(function(x){return x.id===id2;})[0]; if(a) start.added.push({id:a.id,name:a.name,price:a.price}); }
      draw(); }; });
    host.querySelector('#wpMinus').onclick=function(){ start.quantity=Math.max(1,(start.quantity||1)-1); draw(); };
    host.querySelector('#wpPlus').onclick=function(){ start.quantity=Math.min(20,(start.quantity||1)+1); draw(); };
    host.querySelector('#wpCancel').onclick=function(){ host.remove(); };
    var add=host.querySelector('#wpAdd');
    if(add) add.onclick=function(){
      if(missing.length) return;
      if(editIx!=null) WCART[editIx]=start; else WCART.push(start);
      host.remove(); WOPEN=true; render();
    };
  };
  host.onclick=function(e){ if(e.target===host) host.remove(); };
  draw();
}
