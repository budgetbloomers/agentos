/* ---------- validation, mirrored from the Worker so a mistake is caught here
     first and explained in the same words ---------- */
function wValidate(){
  if(!String(D.name||'').trim()) return 'Your account has no name on it, so an order cannot be placed.';
  if(!String(D.cb||'').trim()) return 'Your account has no CB number, so an order cannot be placed.';
  if(!WCART.length) return 'Add at least one item before submitting.';
  for(var i=0;i<WCART.length;i++){
    var l=WCART[i], d=wItemDef(l.id);
    if(!d) return 'One of the items is no longer on the menu — remove it and add it again.';
    if(d.basePrice==null) return d.name+' has no price set yet, so it cannot be ordered.';
    if(!(l.quantity>=1)) return d.name+': choose how many.';
    var miss=(d.choices||[]).filter(function(ch){ return ch.required && !(l.choices||{})[ch.id]; });
    if(miss.length) return d.name+': choose a '+miss.map(function(m){return m.label.toLowerCase();}).join(' and a ')+'.';
  }
  if(!(wTotalCents()>0)) return 'The order total is not valid.';
  return '';
}

function wSubmit(){
  if(WBUSY) return;                       // the click is already in flight
  var bad=wValidate(); if(bad){ WERR=bad; return render(); }
  WBUSY=true; WERR=''; render();          // the button disables on the same tick
  api('/api/portal/wimpy/order',{
    total_price: wTotalCents()/100,
    order:{
      items: WCART.map(function(l){ return { id:l.id, quantity:l.quantity, choices:l.choices||{},
        removed:l.removed||[], added:(l.added||[]).map(function(a){return {id:a.id};}) }; }),
      additional_notes: WNOTE
    }
  }).then(function(r){
    WBUSY=false;
    if(r.ok&&r.json&&r.json.ok){
      /* cleared ONLY now — the order survives every failure path above */
      WDONE={total:r.json.total_price}; WCART=[]; WNOTE=''; WSTATE='done'; WERR='';
    } else {
      WERR=(r.json&&r.json.error)||'Unable to submit the order. Please try again.';
    }
    render();
  });
}

function wireWimpy(){
  document.querySelectorAll('[data-wday]').forEach(function(b){
    var go=function(){ var d=+b.getAttribute('data-wday'); WDAY=(WDAY===d?null:d); render(); };
    b.onclick=go;
    b.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
  document.querySelectorAll('[data-wcat]').forEach(function(b){ b.onclick=function(){ WCAT=b.getAttribute('data-wcat'); render(); }; });
  document.querySelectorAll('[data-wadd]').forEach(function(b){ b.onclick=function(){ wOpen(b.getAttribute('data-wadd')); }; });
  document.querySelectorAll('[data-wedit]').forEach(function(b){ b.onclick=function(){ wOpen(WCART[+b.getAttribute('data-wedit')].id, +b.getAttribute('data-wedit')); }; });
  document.querySelectorAll('[data-winc]').forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute('data-winc'); WCART[i].quantity=Math.min(20,WCART[i].quantity+1); render(); }; });
  document.querySelectorAll('[data-wdec]').forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute('data-wdec');
    if(WCART[i].quantity>1) WCART[i].quantity--; else WCART.splice(i,1); render(); }; });
  document.querySelectorAll('[data-wdel]').forEach(function(b){ b.onclick=function(){ WCART.splice(+b.getAttribute('data-wdel'),1); render(); }; });
  var note=$('wpNote'); if(note) note.onchange=function(){ WNOTE=note.value; };
  var pull=$('wpPull'); if(pull) pull.onclick=function(){ WOPEN=!WOPEN; render(); };
  var rev=$('wpReview'); if(rev) rev.onclick=function(){
    var n=$('wpNote'); if(n) WNOTE=n.value;
    var bad=wValidate(); if(bad){ WERR=bad; return render(); }
    WERR=''; WSTATE='confirm'; render();
  };
  var back=$('wpBack'); if(back) back.onclick=function(){ WSTATE='order'; WERR=''; render(); };
  var send=$('wpSend'); if(send) send.onclick=wSubmit;
  var nw=$('wpNew'); if(nw) nw.onclick=function(){ WSTATE='order'; WDONE=null; WERR=''; WOPEN=false; render(); };
}

/* ===================== THE CAMPAIGN MANAGER VIEW =====================
   The third view: agent → team leader → CAMPAIGN MANAGER. Everything here
   RENDERS what the Worker computed (worker/src/campaign.mjs + assist.mjs);
   not one number is calculated on this page — the rule the whole app keeps.

   D.cm       — the sales half: campaigns[], each with teams, the fourteen
                measures, the projection, the diagnosis ladder, the brief.
   D.assist   — the assistance half: the register, the KPIs, the blockage
                panel. {error} when HighLevel is unreachable, and the page
                says so instead of drawing an empty queue.

   Six of the fourteen tiles read "not published yet" until the PULSE digest
   carries the dialler and lead measures — an absence is not a nought, and the
   idiom is copied from the tiles that already say it. */

var CMSEL=null;                       // which campaign is selected
var CMEXP={};                         // expanded team rows on cm_teams
var CMF={team:'',pri:'',blk:'',sla:'',st:''};   // register filters
var TLA=null, TLA_AT=0;               // the team leader's own requests

function cmCamp(){
  var cs=(D.cm&&D.cm.campaigns)||[];
  if(!cs.length) return null;
  for(var i=0;i<cs.length;i++) if(cs[i].key===CMSEL) return cs[i];
  return cs[0];
}
function cmMins(v){ if(v==null) return '—'; v=Math.round(v);
  return v>=120?(Math.round(v/6)/10)+' h':v+' min'; }
function cmDate(v){ if(!v) return '—'; return String(v).slice(0,16).replace('T',' '); }
function cmSlaChip(sla){
  if(!sla) return '—';
  if(sla.state==='met') return '<span class="mini g">'+esc(sla.label)+'</span>';
  if(sla.state==='met_late') return '<span class="mini r">'+esc(sla.label)+'</span>';
  if(sla.state==='breached') return '<span class="mini r">'+esc(sla.label)+'</span>';
  if(sla.state==='near') return '<span class="mini a">'+esc(sla.label)+'</span>';
  return '<span class="mini n">'+esc(sla.label)+'</span>';
}
function cmPriPill(p){ return '<span class="mini '+(p==='P1'?'r':p==='P2'?'a':'n')+'">'+esc(p||'—')+'</span>'; }
function cmStPill(st){
  var t=st==='Live'?'b':st==='Resolved'?'g':/Awaiting|Follow/.test(st)?'a':'n';
  return '<span class="mini '+t+'">'+esc(st)+'</span>';
}
function cmReqs(campKeyStr){
  var rs=(D.assist&&!D.assist.error&&D.assist.requests)||[];
  if(!campKeyStr) return rs;
  /* EXACT, never a substring: with campaigns named "VAS" and "VAS Courtesy" an
     indexOf() match would file every Courtesy request under VAS as well. */
  return rs.filter(function(r){ return String(r.campaign||'').trim().toLowerCase()===campKeyStr; });
}

/* The freshness band — the language rule is absolute: never "live", never
   "real time". */
function cmBandHTML(){
  var f=(D.cm&&D.cm.freshness)||{};
  var out='<div class="cm-band'+(f.stale?' warn':'')+'">'+esc(f.label||'No upload loaded')
    +(f.updatedAt?' · data last uploaded '+esc(cmDate(f.updatedAt)):'')
    +(f.stale?' — these figures are older than a day':'')+'</div>';
  if(D.cm&&D.cm.assistError)
    out+='<div class="cm-band warn">The assistance register could not be reached — sales figures below are unaffected. '
      +esc(D.cm.assistError)+'</div>';
  if(D.assist&&D.assist.truncated)
    out+='<div class="cm-band warn">The register scan was cut short — some older requests may be missing from the counts.</div>';
  return out;
}

/* ---------- the four pages ---------- */

function cmCmdPage(c){
  var k=c.kpis, a=(D.assist&&!D.assist.error&&D.assist.kpis)||null;
  var reqs=cmReqs(c.key), open=reqs.filter(function(r){return !r.closed;});
  var missing=c.teams.filter(function(t){return t.agents>0&&t.pct!=null&&t.pct<1;});
  var risky=open.filter(function(r){return r.sla.state==='breached'||r.sla.state==='near';});
  var asking=[...new Set(open.map(function(r){return r.tl;}))];

  /* the five answers */
  var tiles='<div class="kpi-grid">'
    +kpi('🎯','var(--blue-soft)','Sales this month so far',num(k.sales.v),'of '+num(k.sales.target),
      (k.sales.v<k.sales.target?num(k.sales.target-k.sales.v)+' behind':'On or past target'))
    +kpi('👥',missing.length?'var(--red-soft)':'var(--green-soft)','Team leaders missing target',
      num(missing.length),'of '+num(c.teams.length),
      missing.length?missing.map(function(t){return t.tl.split(' ')[0];}).join(', '):'Everyone is at target')
    +kpi('🙋',open.length?'var(--amber-soft)':'var(--green-soft)','Team leaders asking for help',
      num(asking.length),'',num(open.length)+' open request'+(open.length===1?'':'s'))
    +kpi('⏱️',risky.length?'var(--red-soft)':'var(--green-soft)','Close to or outside SLA',
      num(risky.length),'',
      num(open.filter(function(r){return r.sla.state==='breached';}).length)+' outside · '
      +num(open.filter(function(r){return r.sla.state==='near';}).length)+' close')
    +'</div>';

  /* Nikola brief */
  var b=c.brief||{signals:[],actions:[]};
  var brief='<div class="card"><h3>✦ Nikola · campaign brief</h3>'
    +'<p class="why">'+b.signals.map(esc).join(' ')+'</p><div class="cm-brief">'
    +b.actions.map(function(x){
      return '<div class="cm-act"><div class="nn"></div><div style="flex:1;min-width:200px">'
        +'<div class="aw">'+esc(x.what)+'</div><div class="ay">'+esc(x.why)+'</div>'
        +'<div class="am">Owner · '+esc(x.owner)+' &nbsp; Due · '+esc(x.due)+' &nbsp; '+cmPriPill(x.priority)+'</div></div>'
        +(x.links_to&&x.links_to.kind==='req'
          ?'<button class="btn" data-openreq="'+esc(x.links_to.id)+'">Open</button>'
          :'<button class="btn" data-goteams="1">Open</button>')
        +'</div>';
    }).join('')
    +'</div><p class="why" style="margin-top:10px">Nikola prioritises what the rules found. It never decides anything about a person — every action above names a human owner.</p></div>';

  /* the fourteen sales measures */
  var proj=c.projection;
  var sales='<h3 style="margin:16px 0 4px;font-size:14px">My sales numbers</h3>'
    +'<p class="why">Every figure is the team-leader measure, added up across the '+num(c.teams.length)
    +' team'+(c.teams.length===1?'':'s')+' on this campaign, for this month so far. Nothing here is a separate calculation.</p>'
    +'<div class="kpi-grid">'
    +kpi('🧾','var(--blue-soft)','Total Sales',num(k.sales.v),'of '+num(k.sales.target)+' target',
      (k.sales.pct!=null?Math.round(k.sales.pct*100)+'% to the month-to-date target':''),
      k.sales.pct!=null?'<span class="delta '+(k.sales.pct>=1?'up':'down')+'">'+(k.sales.v-k.sales.target>=0?'+':'')+num(k.sales.v-k.sales.target)+' · '+Math.round(k.sales.pct*100)+'%</span>':'')
    +kpi('💰','var(--green-soft)','Total GWP',R(k.gwp.v),'',
      'of '+R(k.gwp.target)+' month target'+(k.gwp.projected!=null?' · projected '+R(k.gwp.projected):''))
    +kpi('📐','var(--blue-soft)','Average GWP per Sale',(k.aveG.v==null?'—':R(k.aveG.v)),'',
      'reference R'+num(k.aveG.ref)+' a sale',
      k.aveG.v!=null?'<span class="delta '+(k.aveG.v>=k.aveG.ref?'up':'down')+'">'+(k.aveG.v>=k.aveG.ref?'+':'')+'R'+num(Math.round(k.aveG.v-k.aveG.ref))+'</span>':'')
    +(k.conv==null?'':kpi('🔁',(k.conv.v>=k.conv.target?'var(--green-soft)':'var(--amber-soft)'),'Conversion Rate',
      pct(k.conv.v,1),'','sales ÷ '+num(k.conv.leads)+' unique leads · target '+pct(k.conv.target,0),
      '<span class="delta '+(k.conv.v>=k.conv.target?'up':'down')+'">'+pct(k.conv.v,1)+' of '+pct(k.conv.target,0)+'</span>'))
    +kpi('📞','var(--blue-soft)','Average Talk Time',(k.talk.v==null?'—':num(Math.round(k.talk.v/60))),'min a day',
      'target '+num(k.talk.targetMin)+' min a day per productive agent')
    +(k.attempts==null?'':kpi('🎛️',((k.attempts.v>=k.attempts.low&&k.attempts.v<=k.attempts.high)?'var(--green-soft)':'var(--amber-soft)'),
      'Attempts per Lead',num(k.attempts.v,2),'','healthy band '+k.attempts.low+' to '+k.attempts.high,
      (k.attempts.v<k.attempts.low
        ?'<span class="delta down">under-dialling — leads are not being worked</span>'
        :k.attempts.v>k.attempts.high?'<span class="delta down">over-dialling — the same leads are being re-hit</span>'
        :'<span class="delta up">inside the band</span>')))
    +(k.contactRate==null?'':kpi('📶','var(--blue-soft)','Contact Rate',pct(k.contactRate.v,1),'',
      num(k.contactRate.contacts)+' productive contacts from '+num(k.contactRate.dials)+' dials'))
    +(k.leads==null?'':kpi('📥','var(--blue-soft)','Lead Volume',num(k.leads.v),'',
      'unique leads'+(k.leads.cover==null?'':' · '+num(k.leads.cover,1)+' workable leads for every sale')))
    +kpi('⭐',(k.qa.v!=null&&k.qa.v<k.qa.target)?'var(--amber-soft)':'var(--green-soft)','Average QA Score',
      (k.qa.v==null?'—':pct(k.qa.v,1)),'','target '+pct(k.qa.target,0)+' · mean of agent means')
    +kpi('🚨',(k.crit.fails||k.crit.p1Open)?'var(--red-soft)':'var(--green-soft)','Critical Failures',
      num(k.crit.fails),'','from compliance exceptions'+(k.crit.p1Open?' · '+num(k.crit.p1Open)+' P1 assistance request'+(k.crit.p1Open===1?'':'s')+' open':''))
    +kpi('↩️',(k.canc.rate!=null&&k.canc.rate>k.canc.guard)?'var(--red-soft)':'var(--blue-soft)','Cancellations',
      num(k.canc.v),'',(k.canc.rate==null?'No cancellations recorded this period':pct(k.canc.rate,1)+' of gross sales · guardrail '+pct(k.canc.guard,0)))
    +kpi('🕐',(k.att.v!=null&&k.att.v<k.att.target)?'var(--amber-soft)':'var(--green-soft)','Attendance',
      (k.att.v==null?'—':pct(k.att.v,0)),'',num(k.att.productive)+' of '+num(k.att.agents)+' agents productive · target '+pct(k.att.target,0))
    +'</div>'
    /* ONE line, not four dead tiles. A measure with no source is removed; a measure
       whose source simply has not been uploaded is worth naming ONCE, because that
       is a thing somebody can go and fix. */
    +(k.conv==null?'<p class="why">Conversion, attempts per lead and lead volume need the Lead Management <b>Open Cases</b> and <b>Closed Cases</b> exports — they are not loaded, so those figures are left out rather than guessed.</p>':'')
    +(proj?'<p class="why"><b>How the projection is worked out.</b> '+R(proj.perDay)+' average GWP per completed dialling day × '
      +num(proj.workingDays)+' planned dialling days = '+R(proj.result)+'. '+num(proj.diallingDays)
      +' dialling days completed. It assumes the remaining days run at the same rate as the days already worked.</p>':'');

  /* unattributed — banner-flagged by name, never silently allocated */
  var un=c.unattributed||{agents:[],notCovered:[]};
  var unHtml=(un.agents.length||un.notCovered.length)
    ?'<div class="cm-band warn">'
      +(un.agents.length?'Sales with no GWP reading: '+un.agents.map(esc).join(', ')+' — counted in volume, left out of GWP. ':'')
      +(un.notCovered.length?'On the roster but not reported this period: '+un.notCovered.map(esc).join(', ')+'.':'')
      +' Sent for data review — never silently allocated.</div>':'';

  /* how I am unblocking teams */
  var unblock='';
  if(a){
    unblock='<h3 style="margin:16px 0 4px;font-size:14px">How I am unblocking teams</h3>'
      +'<p class="why">Acknowledging a request is not assistance. The clock below stops when real help starts or an owner takes it and records a next action.</p>'
      +'<div class="kpi-grid">'
      +kpi('📨','var(--blue-soft)','Requests received',num(a.received),'',num(a.open)+' still open')
      /* A DASH IS NOT A MEASUREMENT. With no request raised there is no median and no
         SLA percentage to state, so the tile is left out rather than drawn empty. The
         ZEROS below stay: "0 open", "nobody is stopped from working" are facts a
         manager wants to read, and they are not the same as "we cannot tell". */
      +(a.slaPct==null?'':kpi('⏱️',(a.outsideSla?'var(--red-soft)':'var(--green-soft)'),'Within SLA',
        Math.round(a.slaPct)+'%','',
        num(a.withinSla)+' of '+num(a.answered)+' answered in time · '+num(a.received-a.answered)+' not started yet',
        (a.outsideSla||a.nearBreach)?'<span class="delta down">'+num(a.outsideSla)+' outside · '+num(a.nearBreach)+' close</span>':''))
      +(a.medianFirstResponse==null?'':kpi('🚑','var(--blue-soft)','Median time to first assistance',
        cmMins(a.medianFirstResponse),'','measured to real help, not to acknowledgement'))
      +(a.medianResolution==null?'':kpi('🏁','var(--blue-soft)','Median time to resolution',
        cmMins(a.medianResolution),'','request raised to confirmed'))
      +kpi('📅','var(--blue-soft)','Sessions',num(a.sessionsCompleted)+' of '+num(a.sessionsRequested),'',
        num(a.sessionsBooked)+' booked · '+num(a.sessionsLive)+' live')
      +kpi('🤝','var(--blue-soft)','Awaiting confirmation',num(a.awaitingTl+a.awaitingAgent),'',
        num(a.awaitingTl)+' team leader · '+num(a.awaitingAgent)+' agent')
      +kpi('🔔',(a.followUpsOverdue?'var(--red-soft)':'var(--blue-soft)'),'Follow-ups',num(a.followUpsDue),'',
        a.followUpsDue?(num(a.followUpsOverdue)+' overdue — a follow-up nobody ran is a case nobody measured'):'Nothing waiting to be read again')
      +(a.repeatRate==null?'':kpi('🔂',(a.repeatThemes?'var(--amber-soft)':'var(--green-soft)'),'Repeat blockage rate',
        Math.round(a.repeatRate)+'%','',
        num(a.repeatThemes)+' theme'+(a.repeatThemes===1?' has':'s have')+' come back inside 30 days'))
      +kpi('📤','var(--blue-soft)','Escalated',num(a.escalated),'','sent to an owner outside the campaign')
      +(a.evidenceCompleteness==null?'':kpi('📎','var(--blue-soft)','Evidence completeness',
        Math.round(a.evidenceCompleteness)+'%','','requests carrying at least one piece of evidence'))
      +kpi('📈',(a.improvedOf.of&&!a.improvedOf.n)?'var(--amber-soft)':'var(--green-soft)','Improved after assistance',
        num(a.improvedOf.n)+' of '+num(a.improvedOf.of),'',
        (a.improvedPct==null?'No measured follow-ups yet':Math.round(a.improvedPct)+'% of measured follow-ups'))
      +kpi('🚨',(a.p1Open?'var(--red-soft)':'var(--green-soft)'),'P1 open',num(a.p1Open),'',
        a.p1Open?'An agent or a team cannot work — this outranks everything':'Nobody is stopped from working')
      +'</div>';
  }

  /* what is blocking the campaign */
  var bp=(D.assist&&!D.assist.error&&D.assist.blockPanel)||[];
  var block='';
  if(bp.length){
    block='<div class="card"><h3>⊙ What is blocking the campaign</h3>'
      +'<div class="scroller"><table class="tbl"><thead><tr><th class="l">Blockage</th><th class="l">Goes to</th>'
      +'<th>Open</th><th>Raised</th><th>Agents affected</th><th>Oldest open</th><th>Average resolution</th><th>Comes back</th></tr></thead><tbody>'
      +bp.map(function(x){
        return '<tr><td class="l"><b>'+esc(x.label)+'</b></td><td class="l">'+esc(x.routes_to)+'</td>'
          +'<td class="num">'+num(x.open)+'</td><td class="num">'+num(x.raised)+'</td>'
          +'<td class="num">'+num(x.affected)+'</td>'
          +'<td class="num">'+(x.oldestDays==null?'—':x.oldestDays+'d')+'</td>'
          +'<td class="num">'+(x.avgResolution==null?'—':cmMins(x.avgResolution))+'</td>'
          +'<td>'+(x.comesBack?'<span class="mini a">Yes</span>':'<span class="mini g">No</span>')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
  }

  return cmBandHTML()+tiles+brief+sales+unHtml+unblock+block
    +(c.reconciled?'':'<div class="cm-band warn">The campaign total does not equal the sum of the teams shown — the digest is inconsistent. Treat these figures with care and re-publish from PULSE.</div>');
}

function cmAssistPage(){
  if(D.assist&&D.assist.error)
    return cmBandHTML()+'<div class="card"><h3>Support sessions and SLA updates</h3>'
      +'<p class="why">The register could not be reached: '+esc(D.assist.error)+'</p></div>';
  var all=(D.assist&&D.assist.requests)||[];
  var c=cmCamp();
  var rows=all.filter(function(r){
    if(CMF.team&&r.tl!==CMF.team) return false;
    if(CMF.pri&&r.priority!==CMF.pri) return false;
    if(CMF.blk&&r.blockage!==CMF.blk) return false;
    if(CMF.sla&&r.sla.state!==CMF.sla) return false;
    if(CMF.st==='open'&&r.closed) return false;
    if(CMF.st==='closed'&&!r.closed) return false;
    return true;
  });
  var tls=[...new Set(all.map(function(r){return r.tl;}))].sort();
  var blks=(D.assist.blockages||[]);
  var sel=function(name,opts,cur,lab){
    return '<div class="f"><span>'+lab+'</span><select data-cmf="'+name+'">'
      +'<option value="">All</option>'
      +opts.map(function(o){ var v=o[0],l=o[1];
        return '<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(l)+'</option>';}).join('')
      +'</select></div>';
  };
  var outside=all.filter(function(r){return !r.closed&&r.sla.state==='breached';}).length;
  var near=all.filter(function(r){return !r.closed&&r.sla.state==='near';}).length;

  return cmBandHTML()
    +'<div class="card"><h3>Support sessions and SLA updates <span class="cnt">'+num(rows.length)+' of '+num(all.length)+'</span></h3>'
    +'<div class="cm-filter">'
    +sel('team',tls.map(function(t){return [t,t];}),CMF.team,'Team leader')
    +sel('pri',[['P1','P1'],['P2','P2'],['P3','P3'],['P4','P4']],CMF.pri,'Priority')
    +sel('blk',blks.map(function(b){return [b.key,b.label];}),CMF.blk,'Blockage')
    +sel('sla',[['breached','Outside'],['near','Close'],['within','Within'],['met','Met']],CMF.sla,'SLA')
    +sel('st',[['open','Open'],['closed','Closed']],CMF.st,'Status')
    +'<button class="btn" id="cmClear">Clear</button>'
    +'<span class="sub2" style="align-self:center">'+num(outside)+' outside SLA · '+num(near)+' close</span>'
    +'</div>'
    +'<div class="scroller"><table class="tbl" style="min-width:1200px"><thead><tr>'
    +'<th class="l">Team leader</th><th class="l">Team</th><th>Affected</th><th class="l">Blockage</th>'
    +'<th>Priority</th><th>Raised</th><th>First assistance</th><th>SLA</th><th>Status</th><th>Session</th><th class="l">Owner</th>'
    +'</tr></thead><tbody>'
    +rows.map(function(r){
      return '<tr style="cursor:pointer" data-openreq="'+esc(r.id)+'">'
        +'<td class="l"><b>'+esc(r.tl)+'</b></td><td class="l sub2">'+esc(r.team)+'</td>'
        +'<td class="num">'+(r.affected?num(r.affected)+' agents':'—')+'</td>'
        +'<td class="l">'+esc(r.blockageLabel)+(r.repeat?' <span class="mini a">repeat</span>':'')+(r.restricted?' <span class="mini n">restricted</span>':'')+'</td>'
        +'<td>'+cmPriPill(r.priority)+'</td>'
        +'<td class="sub2">'+esc(cmDate(r.requested))+'</td>'
        +'<td class="num">'+(r.firstResponse==null?'not started':cmMins(r.firstResponse))+'</td>'
        +'<td>'+cmSlaChip(r.sla)+'</td>'
        +'<td>'+cmStPill(r.status)+'</td>'
        +'<td class="num">'+(r.sessionMins==null?'—':cmMins(r.sessionMins))+'</td>'
        +'<td class="l sub2">'+esc(r.owner||r.ownerHint||'—')+'</td>'
        +'</tr>';
    }).join('')
    +'</tbody></table></div>'
    +'<p class="why" style="margin-top:8px">The SLA column measures to the moment real assistance started. A request that was opened and read but not worked is still running against its clock.</p></div>';
}

/* ---------- the request drawer ---------- */
function cmOpenReq(id){
  var host=document.createElement('div'); host.className='cmov'; host.id='cmov';
  host.innerHTML='<div class="cmpanel"><p class="why">Opening the request…</p></div>';
  host.onclick=function(e){ if(e.target===host) host.remove(); };
  document.body.appendChild(host);
  api('/api/portal/cm/detail?id='+encodeURIComponent(id)).then(function(r){
    if(!r.ok){ host.querySelector('.cmpanel').innerHTML='<p class="why">'+esc(r.json.error||'Could not open it.')+'</p>'; return; }
    var d=r.json;
    var isCm=(D.scope==='campaign'||D.scope==='all');
    var act=function(label,payload,cls){
      return '<button class="btn'+(cls?' '+cls:'')+'" data-act=\''+esc(JSON.stringify(payload))+'\'>'+esc(label)+'</button>';
    };
    var buttons=[];
    if(!d.closed){
      if(isCm){
        if(d.firstResponse==null){
          buttons.push(act('Start assistance',{action:'start',id:id},'primary'));
          buttons.push(act('Acknowledge (clock keeps running)',{action:'acknowledge',id:id}));
          buttons.push(act('Assign to route owner',{action:'assign',id:id}));
          buttons.push(act('Book a session',{action:'book',id:id}));
        } else if(!d.completedAt){
          buttons.push(act('Complete session…',{action:'complete',id:id,__prompt:'resolution',__q:'What was actually done? (the resolution)'},'primary'));
          buttons.push(act('Add evidence…',{action:'evidence',id:id,__prompt:'text',__q:'What is the evidence?'}));
        } else if(!d.tlConfirmed){
          buttons.push(act('Add evidence…',{action:'evidence',id:id,__prompt:'text',__q:'What is the evidence?'}));
        }
        if(d.followUpDue) buttons.push(act('Read the 48-hour follow-up',{action:'followup',id:id},'primary'));
        if(d.tlConfirmed&&!d.agentConfirmed&&d.status==='Awaiting agent confirmation')
          buttons.push(act('Record agent confirmation',{action:'confirm_agent',id:id}));
        buttons.push(act('Escalate…',{action:'escalate',id:id,__prompt:'reason',__q:'Why is this escalating?'}));
      }
      if(D.role==='team_leader'&&d.status==='Awaiting team leader confirmation'){
        buttons.push(act('Confirm the assistance happened',{action:'confirm_tl',id:id},'primary'));
        buttons.push(act('Dispute it',{action:'confirm_tl',id:id,disputed:'true'}));
      }
    } else if(isCm){
      buttons.push(act('Reopen…',{action:'reopen',id:id,__prompt:'reason',__q:'Why is it being reopened?'}));
    }
    var gates=(d.closed||!d.completedAt)?'':(function(){
      var missing=[];
      if(!d.evidenceN) missing.push('evidence');
      if(!d.tlConfirmed) missing.push('team leader confirmation');
      return missing.length?'<div class="cm-band warn">Cannot resolve yet — still missing: '+missing.join(', ')+'.</div>':'';
    })();
    host.querySelector('.cmpanel').innerHTML=
      '<h3>'+esc(d.blockageLabel)+' · '+esc(d.tl)+'</h3>'
      +'<div class="sub">'+esc(d.team)+' · raised '+esc(cmDate(d.requested))+' · '+cmPriPill(d.priority)+' '+cmSlaChip(d.sla)+' '+cmStPill(d.status)
      +(d.reopened?' · reopened ×'+num(d.reopened):'')+'</div>'
      +(d.restricted?'<div class="cm-band">Restricted — personal matter. The description is held with the team leader and was never written to the register.</div>':'')
      +(d.owner?'<p class="why">Owner · <b>'+esc(d.owner)+'</b> · routes to '+esc(d.route||'')+'</p>'
        :(d.ownerHint?'<p class="why">Routes to '+esc(d.route||'')+' · '+esc(d.ownerHint)+'</p>':''))
      +gates
      +'<div class="cm-actions">'+buttons.join('')+'</div>'
      +(d.notes&&d.notes.length?'<label>The record</label>'+d.notes.map(function(nx){
          return '<div class="cm-note-row"><div class="at">'+esc(cmDate(nx.at))+'</div>'+esc(nx.body)+'</div>';
        }).join(''):'')
      +(d.history&&d.history.length?'<label>Every change</label>'+d.history.slice().reverse().map(function(h){
          return '<div class="cm-note-row"><div class="at">'+esc(cmDate(h.at))+' · '+esc(h.actor)+'</div>'+esc(h.what)+'</div>';
        }).join(''):'')
      +'<div class="cm-actions" style="margin-top:18px"><button class="btn" id="cmovClose">Close</button></div>';
    host.querySelector('#cmovClose').onclick=function(){ host.remove(); };
    Array.prototype.forEach.call(host.querySelectorAll('[data-act]'),function(bn){
      bn.onclick=function(){
        var payload=JSON.parse(bn.getAttribute('data-act'));
        if(payload.__prompt){
          var v=window.prompt(payload.__q||'Details'); if(v==null||!String(v).trim()) return;
          payload[payload.__prompt]=String(v).trim();
        }
        delete payload.__prompt; delete payload.__q;
        bn.disabled=true;
        api('/api/portal/cm/act',payload).then(function(rr){
          if(!rr.ok){ window.alert(rr.json.error||'That did not work.'); bn.disabled=false; return; }
          host.remove(); TLA=null; loadPortal();
        });
      };
    });
  });
}

/* ---------- the shell for the four pages ---------- */
function cmView(){
  TEAM=D;
  if(CM_VIEWS.indexOf(VIEW)<0) VIEW='cm';
  var c=cmCamp();
  if(!c){
    shell('Campaign Manager','',
      '<div class="card"><p class="why">No campaigns are assigned to this account yet, or nothing has been published for them. Ask Nick to check cm:assignments.</p></div>','cm');
    return wireShell();
  }
  CMSEL=c.key;
  var cs=(D.cm&&D.cm.campaigns)||[];
  var reqs=cmReqs(c.key);
  var p1=reqs.filter(function(r){return !r.closed&&r.priority==='P1';}).length;
  var right=(p1?'<span class="pill r" style="align-self:center">● P1 open</span>':'')
    +(cs.length>1?'<select class="ctrl" id="cmSel">'+cs.map(function(x){
        return '<option value="'+esc(x.key)+'"'+(x.key===c.key?' selected':'')+'>'+esc(x.label)+'</option>';
      }).join('')+'</select>':'')
    /* The period comes from the digest, never from a hardcoded string: the payload
       states what it covers, and printing "this month so far" over a payload that
       covered something else is how a wrong number becomes an unnoticed one. */
    +'<span class="ctrl">'+esc(prettyPeriod())+'</span>'
    +'<button class="btn" id="cmEod">EOD report</button>';
  var subs={cm:'Sales, team leaders and what is blocking them',
    cm_teams:'One row per team leader — the number, the blockage and the next action',
    cm_assist:'Every request, its clock, its owner and its evidence',
    cm_nik:'One fact, one explanation, one next action'};
  var body=VIEW==='cm_teams'?cmTeamsPage(c)
    :VIEW==='cm_assist'?cmAssistPage()
    :VIEW==='cm_nik'?cmNikPage(c)
    :cmCmdPage(c);
  /* On "All campaigns" the team COUNT and the people count differ — a leader
     running two campaigns is two teams — so say both rather than imply six
     people are seven. */
  var who=(c.leaders&&c.leaders!==c.teamLeaders)
    ? num(c.leaders)+' team leaders · '+num(c.teamLeaders)+' teams'
    : num(c.teamLeaders)+' team leader'+(c.teamLeaders===1?'':'s');
  shell(esc(c.label),
    esc(D.name||'')+' · Campaign Manager · '+who+' · '+num(c.agents)+' agents · '+esc(subs[VIEW]||''),
    body+'<div class="foot">Numbers updated '+esc(stamp())+'<br><button id="out">Sign out</button></div>',
    VIEW,right);
  var out=$('out'); if(out) out.onclick=signOut;
  var selEl=$('cmSel'); if(selEl) selEl.onchange=function(){ CMSEL=selEl.value; CMEXP={}; render(); };
  var eod=$('cmEod'); if(eod) eod.onclick=function(){
    eod.disabled=true; eod.textContent='Building…';
    api('/api/portal/cm/eod').then(function(r){
      eod.disabled=false; eod.textContent='EOD report';
      if(!r.ok) return window.alert(r.json.error||'Could not build the pack.');
      var host=document.createElement('div'); host.className='cmov';
      host.innerHTML='<div class="cmpanel"><h3>End-of-day pack</h3>'
        +'<div class="sub">Copy it into the evening thread.</div>'
        +'<div class="cm-actions"><button class="btn primary" id="cmCopy">Copy</button>'
        +'<button class="btn" id="cmEodClose">Close</button></div>'
        +'<pre style="white-space:pre-wrap;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px" id="cmEodTxt"></pre></div>';
      host.onclick=function(e){ if(e.target===host) host.remove(); };
      document.body.appendChild(host);
      host.querySelector('#cmEodTxt').textContent=r.json.markdown||'';
      host.querySelector('#cmEodClose').onclick=function(){ host.remove(); };
      host.querySelector('#cmCopy').onclick=function(){
        try{ navigator.clipboard.writeText(r.json.markdown||''); }catch(e){}
      };
    });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-openreq]'),function(b){
    b.onclick=function(){ cmOpenReq(b.getAttribute('data-openreq')); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-goteams]'),function(b){
    b.onclick=function(){ VIEW='cm_teams'; render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-exp]'),function(b){
    b.onclick=function(){ var i=+b.getAttribute('data-exp'); var t=c.teams[i];
      if(t){ CMEXP[t.tl]=!CMEXP[t.tl]; render(); } };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-cmf]'),function(el){
    el.onchange=function(){ CMF[el.getAttribute('data-cmf')]=el.value; render(); };
  });
  var clr=$('cmClear'); if(clr) clr.onclick=function(){ CMF={team:'',pri:'',blk:'',sla:'',st:''}; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-cb]:not(option)'),function(b){
    b.onclick=function(){ openDrawer(b.getAttribute('data-cb')); };
  });
}

/* ===================== THE TEAM LEADER'S SIDE OF ASSISTANCE =====================
   The other end of the workflow, wrapped onto My Team rather than editing it:
   raise a request to the campaign manager, watch its clock, and confirm or
   dispute that the help happened. raise_request is a team-leader permission —
   a campaign manager cannot raise a request to themselves. */
function tlaLoad(){
  api('/api/portal/cm/assist').then(function(r){
    TLA=r.ok?r.json:{error:r.json.error||'unreachable'};
    TLA_AT=Date.now();
    if(VIEW==='team') render();
  });
}
function tlAssistHTML(){
  var inner;
  if(!TLA) inner='<p class="why">Checking your requests…</p>';
  else if(TLA.error) inner='<p class="why">The assistance register could not be reached right now.</p>';
  else{
    var mine=(TLA.requests||[]).filter(function(r){return !r.closed;});
    inner=(mine.length?'<div class="scroller"><table class="tbl"><thead><tr>'
        +'<th class="l">Blockage</th><th>Priority</th><th>Raised</th><th>SLA</th><th>Status</th><th></th></tr></thead><tbody>'
        +mine.map(function(r){
          return '<tr><td class="l">'+esc(r.blockageLabel)+'</td><td>'+cmPriPill(r.priority)+'</td>'
            +'<td class="sub2">'+esc(cmDate(r.requested))+'</td><td>'+cmSlaChip(r.sla)+'</td>'
            +'<td>'+cmStPill(r.status)+'</td>'
            +'<td><button class="btn" data-openreq="'+esc(r.id)+'">Open</button></td></tr>';
        }).join('')+'</tbody></table></div>'
      :'<p class="why">Nothing open. When your team is blocked on something you cannot fix — leads, the dialler, a system, training — raise it here and the clock starts on your campaign manager, not on you.</p>');
  }
  return '<div class="card"><h3>🚩 Campaign assistance'
    +(TLA&&!TLA.error&&(TLA.requests||[]).filter(function(r){return !r.closed;}).length
      ?' <span class="cnt">'+num((TLA.requests||[]).filter(function(r){return !r.closed;}).length)+' open</span>':'')
    +'</h3><p class="why">Acknowledgement is not assistance — the clock only stops when real help starts.</p>'
    +inner
    +'<div class="cm-actions"><button class="btn primary" id="tlaRaise">Ask your campaign manager</button></div></div>';
}
function wireTlAssist(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-openreq]'),function(b){
    b.onclick=function(){ cmOpenReq(b.getAttribute('data-openreq')); };
  });
  var btn=$('tlaRaise'); if(!btn) return;
  btn.onclick=function(){
    var blks=(TLA&&TLA.blockages)||[];
    if(!blks.length) blks=[{key:'other',label:'Other — requires classification'}];
    var camps=[...new Set((D.agents||[]).map(function(a){return a.campaign;}).filter(Boolean))];
    var sla=(TLA&&TLA.sla)||{p1:15,p2:30,p3:240,p4:1440};
    var host=document.createElement('div'); host.className='cmov';
    host.innerHTML='<div class="cmpanel"><h3>Ask your campaign manager</h3>'
      +'<div class="sub">One request per blockage — the same problem twice joins the first rather than becoming a second case.</div>'
      +'<label>What is the team blocked on?</label>'
      +'<select id="tlaBlk">'+blks.map(function(b){return '<option value="'+esc(b.key)+'">'+esc(b.label)+'</option>';}).join('')+'</select>'
      +'<label>How urgent is it?</label>'
      +'<select id="tlaPri">'
      +'<option value="P1">P1 — an agent or the team cannot work ('+sla.p1+' min)</option>'
      +'<option value="P2">P2 — a sale, a customer or compliance is at risk ('+sla.p2+' min)</option>'
      +'<option value="P3" selected>P3 — performance, knowledge or coaching ('+Math.round(sla.p3/60)+' h)</option>'
      +'<option value="P4">P4 — planned improvement or a follow-up ('+Math.round(sla.p4/60)+' h)</option>'
      +'</select>'
      +(camps.length>1?'<label>Which campaign?</label><select id="tlaCamp">'
        +camps.map(function(cx){return '<option>'+esc(cx)+'</option>';}).join('')+'</select>':'')
      +'<label>What is happening? <span id="tlaRestr" style="display:none;color:var(--amber)">— kept private: only the status travels</span></label>'
      +'<textarea id="tlaDesc" placeholder="Say what the team is blocked on, and since when."></textarea>'
      +'<label>How many agents are affected?</label>'
      +'<input id="tlaAff" type="number" min="0" max="99" value="1">'
      +'<div class="err" id="tlaErr" style="display:none"></div>'
      +'<div class="cm-actions"><button class="btn primary" id="tlaGo">Raise it</button>'
      +'<button class="btn" id="tlaCancel">Cancel</button></div></div>';
    host.onclick=function(e){ if(e.target===host) host.remove(); };
    document.body.appendChild(host);
    var blkSel=host.querySelector('#tlaBlk');
    blkSel.onchange=function(){
      var b=blks.filter(function(x){return x.key===blkSel.value;})[0];
      host.querySelector('#tlaRestr').style.display=(b&&b.restricted)?'inline':'none';
    };
    host.querySelector('#tlaCancel').onclick=function(){ host.remove(); };
    host.querySelector('#tlaGo').onclick=function(){
      var go=host.querySelector('#tlaGo'); go.disabled=true;
      api('/api/portal/cm/request',{
        blockage:blkSel.value,
        priority:host.querySelector('#tlaPri').value,
        campaign:host.querySelector('#tlaCamp')?host.querySelector('#tlaCamp').value:(camps[0]||''),
        description:host.querySelector('#tlaDesc').value,
        affected:host.querySelector('#tlaAff').value
      }).then(function(r){
        if(!r.ok){ go.disabled=false; var e2=host.querySelector('#tlaErr');
          e2.textContent=r.json.error||'That did not go through.'; e2.style.display='block'; return; }
        host.remove(); TLA=null; tlaLoad();
      });
    };
  };
}

/* ===================== the team leader's page =====================
   Deliberately the same shape as an agent's: how the month is going, then the
   people. A team leader asked for "how is my team doing and who needs me
   today" — not a second management dashboard. Everything here is summed from
   the SAME per-agent figures the agent sees of themselves, so a team total can
   never disagree with the people it is made of. */
function teamView(){
  TEAM=D;
  /* NORMALISE THE VIEW HERE, not only in render(). loadPortal() calls this
     directly after sign-in, so a VIEW still sitting on its 'month' default gave a
     team leader the AGENT nav (month / mtd / coaching) over a team page, and every
     tab then pointed at a page that was not rendered. Each view owns its own
     state so it is correct whoever calls it. */
  if(TL_VIEWS.indexOf(VIEW)<0) VIEW='team';
  var t=D.totals||{};
  /* NOT named pct — the global pct() formatter is used inside cell() below, and a
     local of that name shadows it for the whole closure ("pct is not a function",
     thrown inside loadPortal's then() where nothing catches it, so the page just
     sat on "Loading your numbers…"). Same trap as the spark/sparkHTML one. */
  var teamPct=t.pctT==null?null:t.pctT;
  /* `.track` is the bar, `.prog` is the container it normally sits in — using
     .prog here paints nothing at all, because it carries only margins. */
  var bar=function(v){ var w=Math.max(0,Math.min(100,Math.round((v||0)*100)));
    var col=v>=1?'var(--green)':v>=0.8?'var(--amber)':'var(--blue)';
    return '<div class="track"><i style="width:'+w+'%;background:'+col+'"></i></div>'; };

  /* The one panel on the page that shouts, same as the agent's — but white, not
     green. Green is reserved for money a person is personally paid; a team's
     written premium is not that. */
  var hero='<div class="hero"><div class="lab">'+esc(D.team||'My team')+' · premium written this month</div>'
    +'<div class="amt dim">'+R(t.gwpEx)+'</div>'
    +'<div class="note">'+num(t.sales)+' sales from '+num(t.reporting)+' '+(t.reporting===1?'person':'people')
    +(teamPct!=null?' · <b>'+pct1(teamPct)+'</b> of the team target':'')+'</div>'
    +(teamPct!=null?'<div style="margin-top:12px;position:relative">'+bar(teamPct)+'</div>':'')
    +'<div class="boxes">'
    +'<div class="box"><div class="v">'+num(t.onTarget)+' of '+num(t.reporting)+'</div><div class="k">On target</div></div>'
    +'<div class="box"><div class="v">'+R(t.aveG)+'</div><div class="k">Average sale</div></div>'
    +'<div class="box"><div class="v">'+(t.att==null?'—':pct1(t.att))+'</div><div class="k">Attendance</div></div>'
    +'<div class="box"><div class="v">'+(t.qa==null?'—':pct1(t.qa))+'</div><div class="k">Quality</div></div>'
    +'</div></div>';

  /* The AgentOS KPI strip, carrying the four figures a team leader is asked
     about on a Monday — not the twenty the management grid shows. */
  var kpis='<div class="kpi-grid">'
    +kpi('💰','var(--green-soft)','Premium written',R(t.gwpEx),'','What the team has written so far this month.')
    +kpi('🎯','#EAF1FF','Sales',num(t.sales),'of '+num(t.target),
        (teamPct!=null?pct1(teamPct)+' of the team target for the days worked.':'The team target for the month.'))
    +kpi('👥','var(--blue-soft)','On target',num(t.onTarget),'of '+num(t.reporting),'People at or past their own target.')
    +kpi('💬','#EAF1FF','Coaching',
        (D.coaching&&D.coaching.totals?num(D.coaching.totals.sessions):'—'),'sessions',
        'Recorded for your team in the last 90 days.')
    +'</div>';

  /* NOT named 'spark' — a var of that name shadows the spark() helper that
     builds it, and the call below would resolve to the half-built local. */
  /* The "Sales, day by day" sparkline card is GONE (Nick 2026-08-26: "it offers no value
     to my agents and team leaders"). The Daily tab carries the real day-by-day table; a
     wiggly line under it answered no question anyone asks. The variable stays so the
     render path below is untouched. */
  var daily='';

  /* Ranked by premium — the same order the digest publishes — because that is
     the order a team leader reads a team in. Nobody is coloured red: the point
     is who needs a conversation, not who is a failure. */
  /* THE AGENTOS TEAM LEADER VIEW IS A TABLE, NOT A LIST OF CARDS.
     Its "<TL> — agents" card puts every agent on one row with the metrics side by
     side, because a team leader reads a team by scanning down a column, not by
     comparing twelve cards. Same component here: .tbl, a totals row, the metric
     column set the management view uses wherever the digest carries it.

     THREE OF ITS COLUMNS ARE MISSING ON PURPOSE. Unique calls/day and Conversion
     are not in the published digest, and Critical fails is banned from it — a QA
     critical fail is disciplinary material and must not travel to this app. They
     are left out rather than filled with something that is not them. */
  var tot=teamAgg(D.agents||[]);
  var cell=function(a,isTot){
    var nm=isTot
      ? '<td class="l"><b>My team</b><div class="sub2">'+num((D.agents||[]).length)+' people</div></td>'
      : '<td class="l"><button class="lnk" data-cb="'+esc(a.code)+'">'+esc(a.name)+'</button>'
        +'<div class="sub2">'+esc(a.code)+' · '+esc(a.campaign||'')+(a.tenure?' · '+esc(a.tenure):'')+'</div></td>';
    if(!isTot&&!a.covered) return '<tr>'+nm+'<td class="sub2" colspan="11">Not reported on this page</td></tr>';
    var talkDay=(a.talk!=null&&a.act)?a.talk/a.act:null;
    return '<tr'+(isTot?' class="totrow"':'')+'>'+nm
      +'<td class="num">'+num(a.sales)+'</td>'
      +'<td class="num sub2">'+num(a.target)+'</td>'
      +'<td class="num">'+(a.pctT==null?'–':pctPill(a.pctT))+'</td>'
      +'<td class="num">'+R(a.gwpEx)+'</td>'
      +'<td class="num">'+(a.aveG==null?'–':R(a.aveG))+'</td>'
      +'<td class="num">'+(a.spd==null?'–':num(a.spd,2))+'</td>'
      +'<td class="num">'+(talkDay==null?'–':(function(){var m=Math.round(talkDay/60);return m>=60?Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m':m+'m';})())+'</td>'
      +'<td class="num">'+(a.qa==null?'–':pct(a.qa,0))+'</td>'
      +'<td class="num">'+(a.att==null?'–':pct(a.att,0))+'</td>'
      +'<td class="num">'+num(a.ref)+'</td>'
      +'<td class="num">'+(isTot?num((D.coaching&&D.coaching.totals&&D.coaching.totals.sessions)||0):num(coachCount(a.code)))+'</td>'
      +'</tr>';
  };
  var rows='<div class="scroller"><table class="tbl tltable"><thead><tr>'
    +'<th class="l">Agent</th><th>Sales</th><th>Target</th><th>% to target</th><th>GWP</th>'
    +'<th>Ave sale</th><th>Sales/day</th><th>Talk/day</th><th>QA</th><th>Attendance</th>'
    +'<th>Referrals</th><th>Coaching</th></tr></thead><tbody>'
    +(D.agents||[]).map(function(a){return cell(a,false);}).join('')
    +cell(tot,true)
    +'</tbody></table></div>';

  shell(
    esc(greeting())+', '+esc(firstName(D.name)),
    (VIEW==='mtd_team' ? 'Your team\'s month to date — the table management reads.'
      : VIEW==='weekly_team' ? 'Your team, week by week — the same weeks management reports on.'
      : VIEW==='daily_team' ? 'Your team\'s day-by-day detail — the daily table management reads.'
      : VIEW==='kpihub' ? 'The KPI acknowledgement forms for your team.'
      : VIEW==='nik_team' ? 'One fact, one explanation, one next action.'
      : VIEW==='coach_team' ? 'Every coaching product recorded for your team.'
      : VIEW==='help' ? 'Requests from your agents, and where each one stands.'
      : VIEW==='forms' ? 'Every document you have created, across both hubs.'
      : VIEW==='results' ? 'Agents on target, the next best action for each, and what is coming off the score.'
      : 'Who needs you next — '+esc(prettyPeriod())+'.'),
    (VIEW==='mtd_team' ? pageMTD()
      : VIEW==='weekly_team' ? pageWeeklyTeam()
      : VIEW==='daily_team' ? pageDailyTeam()
      : VIEW==='kpihub' ? (FORM.id?kpiFormPage():kpiHubPage())
      : VIEW==='nik_team' ? nikolaPage(null,null)
      : VIEW==='coach_team' ? (CFORM.type?coachFormPage():coachHubPage())
      : VIEW==='help' ? helpPage()
      : VIEW==='forms' ? allFormsPage()
      : VIEW==='results' ? pageTeamResults()
          +'<div class="card"><h3>'+(D.staff?'Everyone':'My team')+' — agents <span class="cnt">'+num((D.agents||[]).length)+'</span></h3>'
          +'<p class="why">Click a name to open their month and their coaching.</p>'+rows+'</div>'
      /* My Team is the ladder screen only — who needs you next. The full agents
         table lives on Team Results, which is where the management view keeps it. */
      : pageMyTeam()+tlAssistHTML()+daily)
    +'<div class="foot">Numbers updated '+esc(stamp())+'<br><button id="out">Sign out</button></div>',
    VIEW==='team'?'team':VIEW);

  if(VIEW==='nik_team') wireNikola();
  /* The hubs are fetched the first time their tab is opened, not on sign-in —
     two Convex round trips should not sit in front of every team leader's page. */
  if(VIEW==='coach_team'){ if(!HUB.coaching) hubLoad('coaching'); else if(CFORM.type) wireCoachForm(); else wireCoachHub(); }
  /* The archive reads both hubs, so it asks for whichever it has not got. */
  if(VIEW==='forms'){
    if(!HUB.coaching) hubLoad('coaching');
    else if(!HUB.kpi) hubLoad('kpi');
    else wireAllForms();
  }

/* "1 – 31 August" rather than "2026-08-01 to 2026-08-31". The ISO form is how
   the data is stored; it is not how anyone reads a month. */
function prettyPeriod(){
  /* THE RANGE ENDS WHERE THE DATA ENDS, not where the calendar month does (Nick,
     2026-08-26). The digest's period is the whole month (1–31 August), but figures only
     exist up to the last uploaded day — printing "31 August" over 25 days of data reads
     as a promise the page cannot keep, and every daily upload should visibly move this
     label forward. D.dates is the engine's own list of days that carry data; its last
     entry is the honest end. The calendar end stays as the fallback for a digest
     published before dates travelled. */
  try{
    var end=D.period.to;
    if(D.dates&&D.dates.length){
      var last=D.dates[D.dates.length-1];
      if(last>=D.period.from&&last<=D.period.to) end=last;
    }
    var f=new Date(D.period.from+'T00:00:00Z'), t=new Date(end+'T00:00:00Z');
    var mf=new Intl.DateTimeFormat('en-ZA',{timeZone:'UTC',month:'long'});
    var df=new Intl.DateTimeFormat('en-ZA',{timeZone:'UTC',day:'numeric'});
    if(mf.format(f)===mf.format(t)) return df.format(f)+' – '+df.format(t)+' '+mf.format(t);
    return df.format(f)+' '+mf.format(f)+' – '+df.format(t)+' '+mf.format(t);
  }catch(e){ return D.period.from+' to '+D.period.to; }
}
function stamp(){
  try{
    return new Intl.DateTimeFormat('en-ZA',{timeZone:'Africa/Johannesburg',day:'numeric',month:'short',
      hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(D.updatedAt));
  }catch(e){ return String(D.updatedAt||'').slice(0,16).replace('T',' '); }
}

/* ===================== the agent's page ===================== */
/* The calculator projects to MONTH END, so it needs every working day in the
   period — not the days we happen to have data for. Older digests only carry
   diallingDays; fall back to it rather than showing nothing. */
/* THE MONTH'S WORKING DAYS — computed here, not taken on trust.
   The digest may be published by an older PULSE tab that only carries
   diallingDays (days WITH DATA, i.e. elapsed). Trusting that produced "16 days
   worked out of 14 working days this month", a NEGATIVE remaining-days count,
   and a commission of R7,670 where the real figure was R17,896. The period is
   right there in the payload, so count the weekdays in it and only fall back
   when even that is impossible. */
function DAYS(){
  if(D&&D.workingDays>0) return D.workingDays;
  try{
    var n=0,d=new Date(D.period.from+'T00:00:00Z'),e=new Date(D.period.to+'T00:00:00Z');
    while(d<=e){ var w=d.getUTCDay(); if(w>0&&w<6)n++; d.setUTCDate(d.getUTCDate()+1); }
    if(n>0) return n;
  }catch(e){}
  return (D&&D.diallingDays)||0;
}
/* What the projection divides by. A month can never have fewer working days than
   the agent has already worked; if the data says otherwise, believe the agent. */
function TDAYS(){ return Math.max(DAYS(), (ME&&ME.act)||0); }
function calcNow(){
  var f=function(id,dflt){ var el=$(id); return el?el.value:dflt; };
  var plan=($('cPlan')&&$('cPlan').value)||ME.plan;   // the figures card's tenure select — sandbox only, never saved
  return commCalc(plan,
    f('cDays',ME.act), f('tDays',TDAYS()), f('cGwp',ME.gwpEx),
    EXTRA, D.comm);
}

/* ===================== THE AGENT CARD =====================
   THIS IS THE AGENTOS AGENT VIEW, not a version of it. Same structure as the
   agent drill-down in Chatterbox_AgentOS_Analytics.html: a navy .ac-head naming
   the person, their group, their team leader and the period, with rank boxes on
   the right; then a row of .ac-tile metric tiles each carrying a value, a
   one-line definition and a pass / watch / focus state.

   Two deliberate differences from the management card, and only two:
     · no composite score and no NBA ladder code (R4, R2A…). Those are diagnostic
       instruments for a team leader; an agent reading "R4 GWP Value Failure" on
       their own screen learns a code, not what to do.
     · the third state is FOCUS, not FAIL. Everything else about the tile is the
       management tile — the layout, the pill, the amber watch state.
   Every threshold below is the one the digest already implies (target, QA target,
   attendance target); nothing new is invented here. */
function tileState(v,pass,watch){ return v==null?'none':(v>=pass?'pass':(v>=watch?'watch':'focus')); }
function acTile(label,val,sub,state){
  var pill={pass:['g','ON TRACK'],watch:['a','WATCH'],focus:['r','FOCUS'],none:['n','NO DATA']}[state]||['n','NO DATA'];
  return '<div class="ac-tile '+state+'"><div class="ac-big">'+val+'</div>'
    +'<div class="ac-lab">'+esc(label)+'</div><div class="ac-sub">'+esc(sub)+'</div>'
    +'<span class="pill '+pill[0]+'">'+pill[1]+'</span></div>';
}
function agentKpis(a,c){
  var head='<div class="ac-head">'
    +'<div style="flex:1;min-width:220px">'
    +'<div class="ac-nm">'+esc(a.name)+' <span class="ac-cd">'+esc(a.code)+'</span></div>'
    +'<div class="ac-meta">'+esc(a.campaign||'')+(a.tenure?' · '+esc(a.tenure):'')
    +(a.tl?' · Team leader: '+esc(a.tl):'')+' · '+esc(prettyPeriod())+' · '+num(DAYS())+' working days</div></div>'
    +(a.rankTeam?'<div class="ac-box"><div class="v">#'+num(a.rankTeam)+'</div><div class="k">OF '+num(a.nTeam)+' IN TEAM · BY GWP</div></div>':'')
    +(a.rankCo?'<div class="ac-box"><div class="v">#'+num(a.rankCo)+'</div><div class="k">OF '+num(a.nCo)+' ON FLOOR · BY GWP</div></div>':'')
    +'</div>';

  var perDayTarget=(a.target&&DAYS())?a.target/DAYS():null;
  var tiles='<div class="ac-tiles">'
    +acTile('TARGET ACHIEVED', a.pctT==null?'—':pct(a.pctT,0),
        num(a.spd,2)+' sales a day'+(perDayTarget?' · target '+num(perDayTarget,1)+'/day':''),
        tileState(a.pctT,1,0.75))
    +acTile('PREMIUM WRITTEN', R(a.gwpEx), 'What your commission is worked out on', a.gwpEx>0?'pass':'none')
    +acTile('AVERAGE SALE', a.aveG==null?'—':R(a.aveG), 'What a typical sale of yours is worth',
        tileState(a.aveG,gwpFloorEx(),0.9*gwpFloorEx()))
    +acTile('QA SCORE', a.qa==null?'—':pct(a.qa,0), 'Your average call quality this month',
        tileState(a.qa,0.9,0.8))
    +acTile('ATTENDANCE', a.att==null?'—':pct(a.att,0),
        num(a.act,a.act%1?1:0)+' of '+num(a.emp,a.emp%1?1:0)+' days attended',
        tileState(a.att,0.95,0.85))
    +acTile('REFERRALS', num(a.ref), 'People you sent through to the team', a.ref>0?'pass':'none')
    +'</div>';
  return head+tiles;
}

/* ---- 1. the hero: what you are on track to earn ---- */
/* THE FIRST BRACKET IS A TURNSTILE, NOT A REWARD — SAY SO.
   Level 1 is the worst-value rung on the whole ladder: for M1 it is 50 sales for
   R1,250, about R25 a sale, 32% of premium. Two levels up is 60 sales for R3,000
   — the ten sales in between are worth R175 each. Showing only "27 more sales →
   R1,250" frames the cheapest rung as the prize and makes the scheme look mean,
   which is exactly the reaction it got. This line shows where it starts paying. */
function climbLine(c,sale){
  if(!c||!c.table||!c.nextMove) return '';
  var i=c.table.findIndex(function(r){return r.gwp===c.nextMove.nextComm?false:r.comm===c.nextMove.nextComm;});
  if(i<0) i=c.table.findIndex(function(r){return r.status==='next_target'||r.gwpGapTotal>0;});
  if(i<0) return '';
  var up=c.table[Math.min(i+2,c.table.length-1)];
  if(!up||up.comm<=c.table[i].comm) return '';
  var extraSales=Math.round((up.gwp-c.table[i].gwp)/sale);
  if(extraSales<=0) return '';
  return '<div class="climb">Then it climbs fast — <b>'+num(extraSales)+' more sales</b> after that takes you to '
    +'<b>'+R(up.comm)+'</b>. The first one is the hard one.</div>';
}
function heroHTML(c){
  if(!ME.plan){
    return '<div class="card hero"><div class="lab">Your commission</div>'
      +'<div class="amt dim">Not set up yet</div>'
      +'<div class="note">We don\'t have a commission model on file for '
      +esc(ME.campaign||'your campaign')+' · '+esc(ME.tenure||'your tenure')+' yet, so we won\'t guess a number. '
      +'Your team leader can confirm what yours is. Everything else on this page is live.</div></div>';
  }
  if(!c){
    /* null has TWO causes and they need different words (adversarial review, 2026-08-27):
       no worked days yet, or the comm rules missing from the digest — telling an agent
       with ten worked days "once you have worked a day" is false and unfixable by them. */
    var noRules=!D.comm||D.comm.saleValue==null;
    return '<div class="card hero"><div class="lab">Your commission</div>'
      +'<div class="amt dim">—</div>'
      +'<div class="note">'+(noRules
        ?'The commission table for your plan has not reached this page yet — your sales and figures are unaffected. It usually appears within a few minutes; tell your team leader if it stays blank.'
        :'Once you have worked a day this month, we can show what you are on track to earn.')+'</div></div>';
  }
  /* NOBODY IS SHOWN A BARE R 0.
     An agent below the first bracket earns nothing YET, and a giant green zero
     tells them only that they have failed — which is the opposite of this
     page's job. When the projection pays nothing, the hero becomes the FIRST
     PAYOUT they can still reach and exactly what it takes to get there, in
     sales, because sales are the unit an agent controls. The honest projection
     never disappears; it moves to the footnote. */
  var sale=(D.comm&&D.comm.saleValue)||(89/1.15);
  var perDaySales=function(rand){ return rand/sale; };

  if(ME.plan!=='M0'&&!(c.projection>0)&&c.nextMove){
    var gap=Math.max(0,c.nextMove.gap);
    var needSales=Math.ceil(gap/sale);
    var rem=Math.max(0,c.metrics.remainingDays);
    var aDay=rem>0?perDaySales(c.nextMove.neededPerDay):null;
    return '<div class="card hero"><div class="lab">Your first payout</div>'
      +'<div class="amt num" style="color:var(--amber);text-shadow:0 0 34px rgba(251,191,36,.26)">'+R(c.nextMove.nextComm)+'</div>'
      +'<div class="note">That is what lands when you reach the first bracket. You need <b>'
      +num(needSales)+' more sale'+(needSales===1?'':'s')+'</b> this month'
      +(aDay!=null&&rem>0?' — about <b>'+num(Math.ceil(aDay))+' a day</b> across your '+num(rem)+' remaining day'+(rem===1?'':'s')+'.':'.')
      +'</div>'
      +climbLine(c,sale)
      +'<div class="tiny">You have written '+R(ME.gwpEx)+' over '+num(ME.act,ME.act%1?1:0)+' day'+(ME.act===1?'':'s')+'. '
      +'At today\'s pace the month ends around '+R(c.metrics.premiumProjected)+', which is short of the '
      +R(c.nextMove.gap+ME.gwpEx)+' the first bracket needs — so this is the number to chase, and it moves every time you sell.</div></div>';
  }

  var line;
  if(ME.plan==='M0'){
    line='On M0 your commission is the full premium you write, so every sale lands straight in your pocket.';
  } else if(c.nextTarget&&c.nextTarget.kind==='top'){
    line='<b>You are at the top bracket.</b> That is the maximum — hold it to the end of the month.';
  } else if(c.nextMove&&c.nextMove.extraComm>0&&c.nextMove.neededPerDay!=null&&c.nextMove.neededPerDay>0){
    var s=Math.ceil(perDaySales(c.nextMove.neededPerDay));
    line='Write <b>'+R(c.nextMove.neededPerDay)+' more a day</b> — about <b>'+num(s)+' sale'+(s===1?'':'s')+' a day</b> — '
      +'and you move up to <b>'+R(c.nextMove.nextComm)+'</b>, which is <b>'+R(c.nextMove.extraComm)+'</b> extra in your pocket.';
  } else if(c.nextMove&&c.nextMove.gap<=0){
    /* The gap is measured against premium ALREADY BANKED, so it can go negative:
       you have written past the next bracket, but your projected month-end has
       not caught up. "You are R 0 away" was the old wording and said nothing.
       What is actually true is better news than that. */
    line='You have <b>already written past</b> the next bracket at <b>'+R(c.nextMove.nextComm)+'</b> — '
      +'keep this pace to the end of the month and it is yours.';
  } else if(c.nextMove){
    line='You are <b>'+R(c.nextMove.gap)+'</b> away from the next bracket at <b>'+R(c.nextMove.nextComm)+'</b>.';
  } else {
    line='Keep going — every sale from here lifts this number.';
  }
  return '<div class="card hero"><div class="lab">On track to earn this month</div>'
    +'<div class="amt num">'+R(c.projection)+'</div>'
    +'<div class="note">'+line+'</div>'
    +'<div class="tiny">Based on the '+R(ME.gwpEx)+' of business you have written over '
    +num(ME.act,ME.act%1?1:0)+' day'+(ME.act===1?'':'s')+', spread across the '+num(DAYS())+' working days this month. '
    +'It moves every time you sell.</div></div>';
}

/* ---- 1b. the whole month on one screen ----
   Everything an agent has, in one scannable list with a verdict per line, so
   "how am I doing?" is answered without reading five cards and doing the
   comparison in your head. Nothing new is computed here — every figure comes
   from the digest, this is purely the summary view. */
/* ===================== MY PROGRESS — the v22 prototype's layout on LIVE data =====
   Nick, 2026-08-26: "this is how I want my progress to look and this must be all
   real data pulling from the live data in the dashboards". Every figure below is
   PUBLISHED, never computed here: the rating, penalties, two checks, stats and
   biggest-unclaimed-driver come from the weekly review (kv:nba-digest, served per
   agent by the Worker); the day rows, score fallback, targets and ranks from the
   PULSE digest; coaching themes from the Coaching Hub feed. Where the prototype
   showed a figure that has no live source (per-driver points, per-session
   commission, assigned-action before/after), the section shows what IS real
   instead of inventing — a chip instead of a points cell, premium instead of a
   flat per-sale rand, the coached themes without a promises column. */
function pgHead(){
  return '<div class="card" style="padding:18px 20px"><b style="font-size:16px">'+esc(ME.name||'')+'</b>'
    +'<div class="sub2" style="margin-top:3px">'+esc(ME.code||'')+(ME.campaign?' · '+esc(ME.campaign):'')+(ME.tenure?' · '+esc(ME.tenure):'')+'</div></div>';
}
function pgPct(v,t){ return (v!=null&&t)?Math.max(3,Math.min(100,(v/t)*100)):0; }
function pgTheme(k){ return String(k||'').replace(/[_-]+/g,' ').replace(/\b\w/g,function(m){return m.toUpperCase();}); }
/* THE DRIVER ROWS RUN ON VAS ANALYTICS (Nick, 2026-08-26: "the data must come from
   the vas analytics"). Every value is this month's digest figure — the same numbers
   the VAS dashboard shows — never the weekly review's snapshot, which is run on its
   own window and once showed a top agent at 21,6% of target. Points appear only on
   the rows the VAS score actually scores (scoreParts, published by PULSE); the other
   rows are real month figures against the rule-book targets, chips only. */
/* ONE VAT BASIS PER COMPARISON (audit, 2026-08-27). The engine's gwpFloor (R99) is
   INCL-VAT — the management app literally prints "≥R99 incl" — while every money figure
   on this page (aveG, gwpEx) is EX-VAT, the comms basis. Comparing them raw made the
   value check ~15% stricter than the rule: an agent at R95 ex (≈R109 incl — a real pass,
   and a pass on the TL's Team Results, which reads the engine's own twoCheck) read
   "fail" here. The floor converts to ex-VAT in exactly one place. */
function gwpFloorEx(){ var th=(D&&D.nba&&D.nba.thresholds)||{}; return (th.gwpFloor!=null?th.gwpFloor:99)/1.15; }
function pgDrivers(){
  var th=(D.nba&&D.nba.thresholds)||{}, sp=ME.scoreParts||null;
  var days=ME.days||[], sSum=0,cSum=0;
  for(var i=0;i<days.length;i++){ if((days[i].c||0)>0){ sSum+=days[i].s||0; cSum+=days[i].c; } }
  var conv=cSum>0?(sSum/cSum)*100:null;                                  // month sales ÷ month calls, dialler-covered days only
  var talkDay=(ME.talk!=null&&ME.act>0)?(ME.talk/60)/ME.act:null;        // digest talk is SECONDS for the month
  var ta=ME.pctT!=null?ME.pctT*100:null, qa=ME.qa!=null?ME.qa*100:null, att=ME.att!=null?ME.att*100:null;
  var pts=function(k){ return (sp&&sp[k]&&sp[k].pts!=null)?{p:sp[k].pts,w:sp[k].w}:null; };
  return [
    {k:'gwpSale',l:'Avg GWP per Sale',v:ME.aveG!=null?'R'+num(ME.aveG):'—',t:th.gwpFloor!=null?'R'+num(gwpFloorEx(),2)+' ex VAT':'—',met:(ME.aveG!=null&&th.gwpFloor!=null)?ME.aveG>=gwpFloorEx():null,pct:pgPct(ME.aveG,th.gwpFloor!=null?gwpFloorEx():null)},
    {k:'ta',l:'Target Achievement',v:ta!=null?num(ta,1)+'%':'—',t:'100%',met:ta!=null?ta>=100:null,pct:pgPct(ta,100),pts:pts('t')},
    {k:'qa',l:'QA Score',v:qa!=null?num(qa,1)+'%':'—',t:th.qaTarget?num(th.qaTarget)+'%':'—',met:(qa!=null&&th.qaTarget)?qa>=th.qaTarget:null,pct:pgPct(qa,th.qaTarget),pts:pts('qa')},
    {k:'gwp',l:'Total GWP',v:ME.gwpEx!=null?'R'+num(ME.gwpEx):'—',t:ME.gwpT!=null?'R'+num(ME.gwpT):'—',met:(ME.gwpEx!=null&&ME.gwpT)?ME.gwpEx>=ME.gwpT:null,pct:pgPct(ME.gwpEx,ME.gwpT)},
    {k:'conv',l:'Conversion',v:conv!=null?num(conv,1)+'%':'—',t:th.convTarget?num(th.convTarget)+'%':'—',met:(conv!=null&&th.convTarget)?conv>=th.convTarget:null,pct:pgPct(conv,th.convTarget)},
    {k:'talk',l:'Talk Time',v:talkDay!=null?num(talkDay)+' min a day':'—',t:th.talkTargetMin?num(th.talkTargetMin)+' min':'—',met:(talkDay!=null&&th.talkTargetMin)?talkDay>=th.talkTargetMin:null,pct:pgPct(talkDay,th.talkTargetMin)},
    {k:'att',l:'Attendance',v:att!=null?num(att)+'%':'—',t:th.attTarget?num(th.attTarget)+'%':'—',met:(att!=null&&th.attTarget)?att>=th.attTarget:null,pct:pgPct(att,th.attTarget),pts:pts('att')}
  ];
}
function pgAdviceText(key){
  var th=(D.nba&&D.nba.thresholds)||{};

  var rem=Math.max(0,DAYS()-(ME.act||0));
  if(key==='ta'){ var shortS=(ME.target&&ME.sales!=null)?Math.max(0,Math.ceil(ME.target-ME.sales)):null;
    if(shortS===0) return 'You are at your sales target — hold it there to month end.';
    return shortS!=null?('You are '+num(shortS)+' sale'+(shortS===1?'':'s')+' from your target this month'
      +(rem>0&&shortS>0?' — about '+num(Math.ceil(shortS/rem))+' more a day over your '+num(rem)+' remaining day'+(rem===1?'':'s')+'.':'.'))

  if(key==='gwp'){ var shortR=(ME.gwpT!=null&&ME.gwpEx!=null)?Math.max(0,ME.gwpT-ME.gwpEx):null;
    return shortR!=null&&shortR>0?('You are '+R(shortR)+' short of your value target this month'
      +(ME.aveG?' — at '+R(ME.aveG)+' a sale that is about '+num(Math.ceil(shortR/ME.aveG))+' more sale'+(Math.ceil(shortR/ME.aveG)===1?'':'s')+'.':'.'))
      :'You have passed your value target — every further rand is pure upside.'; }
  if(key==='conv') return 'Lifting conversion from '+(by.conv?by.conv.v:'—')+' toward '+num(th.convTarget||0)+'% — the same calls, with more of them becoming sales.';
  if(key==='qa') return 'QA sits at '+(by.qa?by.qa.v:'—')+' against '+num(th.qaTarget||0)+'% — one clean week of calls moves this.';
  if(key==='att') return 'Attendance is at '+(by.att?by.att.v:'—')+' against '+num(th.attTarget||0)+'% — every day on the floor protects the rest of your card.';
  if(key==='talk') return 'Talk time is at '+(by.talk?by.talk.v:'—')+' against '+num(th.talkTargetMin||0)+' minutes — more time in conversation is more chances to close.';
  if(key==='gwpSale') return 'The value of each sale is what this measures — hold every sale at R'+num(gwpFloorEx(),2)+' (ex VAT) or better.';
  return 'Bringing this to target is the next block of points on your card.';
}
/* ===================== THE COMPOSITE RATING PANEL =====================
   NBA v3.0's seven-driver score, rendered from the object PULSE publishes on the
   digest (ME.composite). Nothing here recomputes anything: the engine owns the
   arithmetic, this owns the explanation.

   Three wording rules from the view spec, in order of importance:
     1. Never show an adjustment without its reason on the same row. An unexplained
        loss is the fastest way to lose an agent's trust in the score.
     2. Always show how it clears. An adjustment with no route out reads as a mark
        on a permanent record.
     3. A clear adjustment still shows. Hiding it means the agent only ever learns
        the rule by being punished by it.
   And the word is "adjustment", never "penalty". */
/* SHOW THE FIGURE EVEN WHEN THE ENGINE WILL NOT SCORE IT (Nick, 2026-08-28: "I want to
   show the conversion of the agent but it does not have to be measured").

   PULSE publishes `shown` on the part, but a digest already sitting in the store does
   not carry it, and waiting for the next push means the agent sees a dash today for no
   reason — the page is holding the day rows the figure comes from. So it is computed
   here when it has not travelled, over the SAME window the rating uses, never the whole
   month, or the number would not belong beside the rest of the row. */
function cShown(p){
  if(p.shown!=null) return p.shown;
  if(p.k!=='conv') return null;
  var c=ME.composite||{}, from=c.windowFrom, to=c.windowTo;
  var days=(ME.days||[]).filter(function(f){ return !from||!to||(f.d>=from&&f.d<=to); });
  var s=0,n=0;
  for(var i=0;i<days.length;i++){ if((days[i].c||0)>0){ s+=days[i].s||0; n+=days[i].c; } }
  return n>0?Math.round((s/n)*1000)/10:null;
}
function cFmt(p){
  /* A figure we can show but must not score. The row still reads "shown, not scored" in
     the points column, so the number is information, never a mark. */
  if(p.value==null&&cShown(p)!=null){
    p=Object.assign({},p,{shown:cShown(p)});
    if(p.k==='gwpSale'||p.k==='gwpTotal') return R(p.shown);
    if(p.k==='talk') return num(p.shown)+' min';
    return num(p.shown,1)+'%';
  }
  if(p.value==null) return '—';
  if(p.k==='gwpSale'||p.k==='gwpTotal') return R(p.value);
  if(p.k==='talk') return num(p.value)+' min';
  return num(p.value,1)+'%';
}
function cFmtT(p){
  if(p.target==null) return '—';
  if(p.k==='gwpSale'||p.k==='gwpTotal') return R(p.target);
  if(p.k==='talk') return num(p.target)+' min';
  return num(p.target,1)+'%';
}
function cLadder(rungs,activeIdx){
  var tone=['t0','t1','t1','t2'];
  return '<div class="pg-lad">'+rungs.map(function(r,i){
    return '<span class="'+(i===activeIdx?'on '+(tone[i]||'t2'):'')+'">'+esc(r.tier)
      +' · '+(r.off?'−'+num(r.off):'0')+'</span>';
  }).join('')+'</div>';
}
/* The driver labels travel once per digest, not once per agent. An older payload
   still carries them on each part, so read the dictionary first and fall back. */
function cDrv(k){
  var list=(D&&D.compositeDrivers)||[];
  for(var i=0;i<list.length;i++) if(list[i].k===k) return list[i];
  return null;
}
/* A LAST-RESORT NAME FOR EVERY DRIVER. The dictionary travels once per digest, so any
   hop that drops it — an older payload, an envelope that hand-picks its fields, which is
   exactly what happened on 28 August — left the page printing raw keys at agents. A
   fallback map costs seven lines and makes that impossible. */
var C_LABELS={gwpSale:'Avg GWP per Sale',targetAch:'Target Achievement',qa:'QA Score',
  gwpTotal:'Total GWP',conv:'Conversion',talk:'Talk Time',attendance:'Attendance'};
function cLabel(p){ var d=cDrv(p.k); return (d&&d.label)||p.label||C_LABELS[p.k]||p.k; }
function pgComposite(){
  var c=ME.composite; if(!c) return '';
  /* NOTHING WORKED YET IS NOT A ZERO. An agent with no worked session in the period
     has nothing to rate, and printing 0 out of 100 under "Needs support" would be a
     judgement on an empty file rather than on them. */
  if(c.rated===false) return '<div class="card"><h2>Agent rating</h2>'
    +'<p class="why">You have not worked a session in this period yet, so there is nothing to rate. '
    +'Your rating appears after your first session.</p></div>';

  var floor=c.floor||50;
  var h='<div class="card"><h2>Agent rating</h2>'
    +'<div class="pg-score '+cls+'"><b class="num">'+num(adj)+'</b><small>out of 100</small></div>';

    +(c.nextBand?' — '+num(c.nextBand.pointsAway,1)+' points from '+esc(c.nextBand.label):'')+'</h3>';

        :'<small>'+(cShown(p)!=null?'shown, not scored':'not measured')+'</small> ')
      +(p.measured?(p.onTarget?'<span class="chip2 beat"><i></i>At target</span>'
                              :'<span class="chip2 togo"><i></i>To go</span>'):'')
      +'</span></div>';
  }).join('')+'</div>';
  h+='<div class="tiny2" style="margin-top:6px">Each bar changes shade at half of your target. '
    +'Points only start there, so the solid part is what you are being paid for.'
    +(c.parts.some(function(p){return !p.measured&&cShown(p)!=null;})

    +'<span class="off '+(cx.points?'neg':'zero')+'">'+(cx.points?'−'+num(cx.points):'0')+'</span></div>';

  var si=c.signIn||{};

    +'<span class="lad-cell"><div>'+(si.measured

function pgRating(){

     four-driver breakdown as `scoreParts` — 25,6 in one field and 36 in the other for the
     same agent. PULSE no longer publishes that pairing, but a digest already sitting in
     the store does, and the page must not believe it until the next push. */

     changeover so they can be diffed per agent; the moment PULSE publishes the
     seven-driver rating, that is the one the agent sees. */
  if(ME.composite) return pgComposite();

     (the leaderboard's Score chip, published as ME.score) and the points come from
     its published breakdown — the weekly review's composite is NOT used here: it
     runs on its own window and once rated a top agent 68 on stale figures. */
  var score=ME.score!=null?Math.round(ME.score*100):null;
  if(score==null) return '';

  var sp=ME.scoreParts||null;

    +'<div class="pg-score '+cls+'"><b class="num">'+num(score)+'</b><small>out of 100</small></div>';
  var drv=pgDrivers();
  var met=drv.filter(function(d){return d.met===true;}).length;
  var known=drv.filter(function(d){return d.met!=null;}).length;
  /* biggest unclaimed points among the SCORED drivers — never the unmeasured one */
  var lbl={t:'Target Achievement',qa:'QA Score',att:'Attendance',opt:'Opt-ins'};
  var top=null;
  if(sp) for(var k in sp){ if(k==='opt'&&!sp[k].v) continue;   // opt-ins retired: 0/null = not a real gap to chase
    var gapP=(sp[k].w||0)-(sp[k].pts||0);
    if(gapP>0.05&&(!top||gapP>top.gap)) top={k:k,label:lbl[k]||k,gap:Math.round(gapP*10)/10}; }
  h+='<h3 class="pg-verdict">'+(score>=80?'Strong month':(score>=65?'Building':'Needs support'))

  h+='<p class="why">'+num(met)+' of your '+num(known)+' drivers are at target.'
    +(top?' The most points sitting unclaimed are in <b>'+esc(top.label)+'</b> — '+num(top.gap,1)+' of them.':'')+'</p>';
  /* THE WEIGHTS ARE READ, NOT RECITED (audit, 2026-08-28). VAS scores the drivers an agent
     actually has and renormalises the rest to 100, so the split is no longer always
     45/25/20/10 — printing those literals told an agent with no QA evaluations that quality
     was worth 25 of their points when it was worth none of them, and promised a "ceiling of
     90" that no longer exists. The weights now come from the same scoreParts the rows below
     are chipped with, so the paragraph and the arithmetic cannot drift apart. */
  var wLbl={t:'target achievement',qa:'quality',att:'attendance',opt:'opt-ins'};
  var wTxt=sp?['t','qa','att','opt'].filter(function(k){return sp[k]&&sp[k].w>0;})
    .map(function(k){return wLbl[k]+' '+num(sp[k].w,1);}).join(', '):'';
  h+='<div class="tiny2" style="margin-top:4px">Your rating comes straight from Agent OS — this month\'s figures against the targets for your level, never a ranking against your colleagues. '
    +(wTxt?'This month it is scored out of 100 across '+wTxt+'.'
          +((sp&&sp.opt&&sp.opt.w>0)?'':' Opt-ins are not reported this period, so they carry none of your points rather than counting against you.')
      :'')+'</div>';
  h+='<div class="pg-drv">'+drv.map(function(d){

/* IS THE WEEKLY REVIEW STILL SPEAKING ABOUT THIS MONTH?
   Found 2026-08-28: the published review ran over 2022-08-27 to 2026-08-22 — 1 040
   working days, four years — and on that window CB287 read QA 27,2% and target
   achievement 550%. It fired "P1 · R2 Critical QA Failure", a 48-hour compliance
   action, on a named agent whose QA over the reported month is 55,5% and over the
   rated window 77,4%. The NBA ladder is defined over a REPORTING PERIOD; a four-year
   average is not one, and no action may be raised against a person from it.
   Nothing in the codebase writes kv:nba-digest — only readers — so this does not
   heal itself and the guard has to live here. */
function nbaWindowSane(){
  var np=(D.nba&&D.nba.period)||null, dp=D.period||null;
  if(!np||!np.from||!np.to||!dp||!dp.from||!dp.to) return true;   // nothing to compare: say nothing
  var day=86400000;
  var len=function(x){var a=Date.parse(x.from+'T00:00:00Z'),b=Date.parse(x.to+'T00:00:00Z');
    return (isNaN(a)||isNaN(b))?null:Math.round((b-a)/day)+1;};
  var nl=len(np), dl=len(dp);
  if(nl==null||dl==null||dl<=0) return true;
  return nl<=dl*3;                       // a review three times wider than the period is not this period
}
function pgNBA(){

    +'The last review covered '+esc((D.nba.period&&D.nba.period.from)||'?')+' to '

      +(best?'<div class="tiny2">Best day this month: '+num(best)+' sales ('+esc(bd)+') — a good day to beat it.</div>':'')+'</div>');
  }
  var co=D.coaching,mine=null;
  if(co&&co.agents)for(var j=0;j<co.agents.length;j++)if(co.agents[j].code===ME.code){mine=co.agents[j];break;}
  if(mine&&mine.themes&&mine.themes.length){
    var t0=mine.themes[0];
    cells.push('<div class="pg-card"><div class="t">Today\'s focus</div>'
      +esc(pgTheme(t0.key))+(t0.shown>1?' has come up '+num(t0.shown)+' times in coaching':' came up in coaching')
      +' — one strong call on it today is how it comes off the list.</div>');
  }
  if(cells.length) h+='<div class="pg-cards" style="margin-top:0;margin-bottom:16px">'+cells.join('')+'</div>';
  return h;
}

   (mandatory: the note is what the team leader reads), send. Each send creates a
   NEW HighLevel opportunity via the Worker — duplicates are deliberate, the same
   person asking twice with different reasons is two real requests.

  t.textContent=msg; t.classList.add('show');

}

var ACTS=null, ACTS_BUSY=false;

function actsLoad(){
  if(ACTS_BUSY) return;                   // one in-flight fetch — every teamView render re-fires this while ACTS is null (audit, 2026-08-27)
  ACTS_BUSY=true;
  api('/api/portal/help/actions').then(function(r){

function actReview(){
  /* the MONDAY of the review's week, not its publish date — a mid-week republish
     of the NBA digest must not change every key and orphan the week's statuses
     (review, 2026-08-26). Existing records keyed 2026-08-24 ARE a Monday, so
     nothing already created is orphaned by this. */
  var d=String((D.nba&&D.nba.updatedAt)||'').slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  var t=new Date(d+'T00:00:00Z'), dow=t.getUTCDay();
  t.setUTCDate(t.getUTCDate()-((dow+6)%7));
  return t.toISOString().slice(0,10);
}
function actPills(a){

     off the dashboard, history in HighLevel. Resolved but STILL recurring = back
     as a candidate — flagging it reopens the same record, never a duplicate. */
