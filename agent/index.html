<!--
  ============================================================================
  AGENT ANALYTICS  —  the agent's own page.  Served at /agent/
  ============================================================================

  WHAT THIS IS. The fourth app in the suite, and the only one an agent or a team
  leader ever sees. An agent signs in and sees how their own month is going, what
  they are on track to earn, what one more sale a day is worth, and the coaching
  they have had. A team leader signs in and sees their own team, with the same
  page one tap away for each of their agents. Its job is to MOTIVATE, not to
  diagnose.

  CB NUMBER AND PASSWORD (Nick, 2026-08-24). This page used to be a single
  passwordless link — anyone holding it could look up any colleague, which was an
  accepted trade while the page was purely motivational. It is not acceptable once
  a page shows a team leader their team and an agent their coaching record, so the
  link was retired and per-person logins took its place.

  THE LOGIN IS THE EXISTING ONE. There is no second authentication system here:
  the page POSTs to /api/login exactly as the management apps do, and PBKDF2
  hashing, five-strike lockout, hashed session tokens and the audit log are all
  the same code (worker/src/auth.mjs). The CB number IS the username; the Worker
  normalises "CB-93", "cb 93" and "093" onto one account.

  THE SECURITY IS NOT ON THIS PAGE. Nothing here decides what anybody may see.
  The page asks for /api/portal/overview and renders what comes back — an agent's
  response contains one agent and an anonymous group average, a team leader's
  contains their team. Nothing is filtered out on screen because nothing else was
  ever sent, so editing this file cannot widen anyone's access. The enforcement is
  worker/src/portal.mjs, and the Worker refuses roles 'agent' and 'team_leader'
  every route outside a six-entry allow-list — without that, /api/kv alone would
  hand any signed-in agent the entire 16.6 MB dataset.

  WHAT IT DELIBERATELY IS NOT.
    · It does not load auth-gate.js. That is the MANAGEMENT gate — tab
      permissions, PII unmasking, nav-hiding for the other three apps — and
      none of it belongs in front of an agent.
    · It contains NO link to Ops Analytics, VAS Analytics or Tracker Analytics
      — not in a menu, not behind a role check, not hidden by CSS. There is
      nothing to find. Navigation into this app is one-way: staff arrive from
      the other three app switchers; nobody travels back out.
    · It computes no metric. Every performance number here was calculated by
      PULSE (nicks_code/index.html) and published in the digest, so this page
      and the Agent Performance tab cannot drift apart. The only arithmetic
      below is the commission calculator, ported line-for-line from the
      Comms Calculator and proven equal by diagnostics/verify-agent-analytics.mjs.
    · It never invents coaching. Sessions come from the Coaching Hub through the
      Worker; when the Hub is unreachable the page says so, because "no coaching"
      and "we could not ask" mean opposite things to the person reading it.

  LANGUAGE RULE. No acronym an agent has not been taught. "GWP" is fine — they
  are paid on it. "SPD", "pctT", "composite", "R2A" are not, and must never
  appear on this screen. Every number gets one short sentence saying what it
  means. Nothing is ever framed as failure.
  AMENDED 2026-08-26 (Nick's v22 prototype): My Progress now shows the agent
  their own weekly-review row — the 0-100 rating, the ladder chip (P2 · R4A
  style) and the two checks — because the floor is taught these in one-to-ones.
  The rule still holds everywhere else, and every figure keeps its sentence.
-->

<style>
/* ===================================================================
   THE CHATTERBOX AGENTOS DESIGN SYSTEM.
   Tokens, navy sidebar, KPI grid, cards, tables, pills and chips are
   the ones in Chatterbox_AgentOS_Analytics.html, so this app is
   visibly the same product as the rest of the suite. What is NOT
   copied is the density: an agent gets the same components carrying
   far fewer numbers, each with one plain sentence under it.
   =================================================================== */
:root{
  --navy:#0A1730; --navy2:#0E2244; --ink:#0F1E36; --body:#3B4A63; --muted:#71809B;
  --line:#E3E9F3; --bg:#F2F5FA; --card:#FFFFFF;
  --blue:#2563EB; --blue-soft:#EAF1FF; --sky:#38BDF8;
  --green:#158A4C; --green-soft:#E6F6ED;
  --amber:#B45309; --amber-soft:#FCF0DD;
  --red:#C42D2D; --red-soft:#FBE9E9;
  --violet:#6D4AE0; --violet-soft:#EFEAFD;
  --radius:14px; --shadow:0 1px 2px rgba(15,30,54,.05),0 4px 14px rgba(15,30,54,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:13px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--blue)}

/* ============ SHELL ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;min-width:236px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#C9D6EC;display:flex;flex-direction:column;padding:14px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo-card{background:#fff;border-radius:12px;padding:14px 12px;text-align:center;margin-bottom:16px}
.logo-img{width:100%;max-width:158px;display:block;margin:0 auto 2px}
.logo-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#5D6F92;margin:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#C9D6EC;font-weight:600;font-size:13px;border:none;background:transparent;width:100%;text-align:left;transition:background .12s}
.nav-item .ic{width:17px;text-align:center;flex:none;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.active{background:var(--blue);color:#fff}
.sys-card{margin-top:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:11px 12px;font-size:12px}
.sys-card .t{font-weight:700;color:#E7EEFA;margin-bottom:5px;font-size:12px}
.sys-card .l{color:#9FB0CC;font-size:11.5px;line-height:1.5}
.sys-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.user-card{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 10px;background:rgba(255,255,255,.05);border-radius:11px}
.user-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.user-nm{font-weight:700;color:#E7EEFA;font-size:12.5px;line-height:1.2}
.user-rl{font-size:10.5px;color:#9FB0CC}
.signout{margin-left:auto;border:1px solid rgba(148,182,255,.22);background:rgba(148,182,255,.08);color:#C6D3E8;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.main{flex:1;padding:20px 26px 34px;min-width:0;max-width:100%;overflow-x:hidden}
.topbar{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.3px}
.page-sub{color:var(--muted);font-size:13px;margin-top:2px}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--body)}
.btn{border-radius:9px;padding:8px 14px;font-weight:700;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--body)}
.btn:hover{border-color:#C7D2E4}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.menu-btn{display:none;align-items:center;justify-content:center;border-radius:9px;padding:8px 12px;font-weight:800;border:1px solid var(--line);background:#fff;color:var(--body)}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,23,48,.5);z-index:55}
.scrim.on{display:block}

/* ============ KPI GRID ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.kpi-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.kpi-name{font-size:12px;font-weight:700;color:var(--body);line-height:1.25}
.kpi-val{font-size:25px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:baseline;gap:5px}
.kpi-val .unit{font-size:13px;font-weight:700;color:var(--muted)}
.kpi-sub{font-size:11px;color:var(--muted);line-height:1.4;margin-top:6px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:14px}
.delta.up{background:var(--green-soft);color:var(--green)}
.delta.down{background:var(--red-soft);color:var(--red)}
.delta.flat{background:#EEF2F8;color:var(--muted)}

/* ============ CARD ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card h3{font-size:14.5px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .cnt{font-size:11px;font-weight:800;color:var(--muted);background:#EEF2F8;border-radius:999px;padding:2px 9px}
.why{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:8px}
/* FULL WIDTH, like VAS Analytics. The 1180px cap squeezed the Month to date
   table — thirteen agent columns into a fraction of the window — and left a band
   of empty page beside every screen. PULSE's shell has no cap; neither does this. */
.wrap{max-width:none;width:100%}
.reveal{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:20px;padding-bottom:10px}
.foot button{border:none;background:none;color:var(--blue);font-weight:700;font-size:12.5px;text-decoration:underline;padding:4px}

/* ============ HERO — the one thing on the page that shouts ============
   The navy agent-card panel from AgentOS (.ac-head). Money the agent
   personally earns is the only figure allowed to be green and huge. */
.hero{background:var(--navy);color:#fff;border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(620px 300px at 88% -30%,rgba(56,189,248,.20),transparent 62%)}
.hero .lab{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#7FB2FF;position:relative}
.hero .amt{font-size:clamp(38px,7.5vw,54px);font-weight:900;letter-spacing:-2px;color:#34D399;line-height:1.05;margin:4px 0 2px;position:relative}
.hero .amt.dim{color:#fff}
.hero .note{font-size:14px;color:#D7E2F5;line-height:1.55;margin-top:8px;position:relative;max-width:72ch}
.hero .note b{color:#fff}
.hero .tiny{font-size:11.5px;color:#93A6C6;margin-top:10px;position:relative;max-width:84ch;line-height:1.5}
.hero .climb{font-size:12.5px;color:#BFD2EE;margin-top:10px;position:relative;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 12px;max-width:72ch}
.hero .climb b{color:#fff}
.hero .cap{font-size:13px;color:#D7E2F5;margin-top:8px;position:relative;line-height:1.55}
.hero .cap b{color:#fff}
.hero .big{font-size:clamp(30px,6vw,42px);font-weight:900;letter-spacing:-1.4px;color:#fff;position:relative}
/* The four figures beside the headline (.ac-box in AgentOS). Without these the
   value and its label render as two bare lines of text and the panel reads as a
   list of orphaned numbers. */
.hero .boxes{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;position:relative}
.hero .box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 15px;text-align:center;min-width:104px}
.hero .box .v{font-size:19px;font-weight:800;color:#fff;line-height:1.2}
.hero .box .k{font-size:10px;color:#A9BCDA;text-transform:uppercase;letter-spacing:.7px;margin-top:2px}
/* The progress track sits on navy here, so the light grey it uses on a white
   card shows as a bright sliver past the fill. */
.hero .track{background:rgba(255,255,255,.16)}

/* ============ BREAKDOWN (your month at a glance) ============
   A two-column grid: label + value on the first row, the plain-language verdict
   spanning underneath. Not a flex row — the verdict needs the full width. */
.bd{border-top:1px solid #EEF2F8}
.bd-row{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:baseline;padding:11px 2px;border-bottom:1px solid #EEF2F8}
.bd-row:last-child{border-bottom:none}
.bd-l{font-size:13.5px;color:var(--body);font-weight:600;display:flex;align-items:center;gap:9px}
.bd-v{font-size:17px;font-weight:800;color:var(--ink);text-align:right;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.bd-x{grid-column:1/-1;font-size:11.5px;color:var(--muted);padding-left:16px;line-height:1.4}
.dt{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--muted)}
.dt.good{background:var(--green)}
.dt.ok{background:var(--blue)}
.dt.warn{background:var(--amber)}
.dt.push{background:var(--blue);opacity:.5}

/* ============ TRACKING ============
   .prog is the CONTAINER, .track is the bar. Getting this the wrong way round
   turns the card into an 11px sliver. */
.prog{margin:14px 0 4px}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.prog .top b{font-size:15px;color:var(--ink);font-weight:800}
.prog .top span{font-size:12px;color:var(--muted)}
.track{height:11px;border-radius:7px;background:#EDF1F8;overflow:hidden}
.track i{display:block;height:100%;border-radius:7px;transition:width .7s cubic-bezier(.22,.68,.32,1)}
.verdict{margin-top:9px;font-size:13px;line-height:1.5}
.verdict.good{color:var(--green)} .verdict.mid{color:var(--amber)} .verdict.go{color:var(--body)}

/* ============ WHERE YOU STAND ============ */
.rankrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rank{background:#F7FAFE;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.rank .pos{font-size:30px;font-weight:900;letter-spacing:-1.4px;color:var(--ink);line-height:1.05}
.rank .pos small{font-size:14px;font-weight:800;color:var(--muted);margin-left:1px}
.rank .lab{font-size:11px;color:var(--muted);margin-top:4px}
.trend{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700;margin-top:14px}
.trend.up{background:var(--green-soft);color:var(--green)}
.trend.down{background:var(--red-soft);color:var(--red)}
.trend.flat{background:#EEF2F8;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{display:flex;align-items:center;gap:7px;background:var(--blue-soft);border:1px solid #CFE0FF;color:var(--blue);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700}
.badge b{font-size:15px;line-height:1}

/* ============ WHAT-IF ============ */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line);background:#fff;color:var(--body);border-radius:20px;padding:8px 16px;font-size:12.5px;font-weight:700}
/* THE STATE LETTERS WERE NEVER GIVEN A COLOUR (Nick, 2026-08-28: "on track needs to be
   green and focus needs to be red"). Every tile already asked for one — pill g / a / r /
   b — but only the base .pill existed, so ON TRACK, WATCH and FOCUS all rendered as the
   same white outline and the state had to be read off the word alone. Semantic colour,
   separate from the accent blue, which stays reserved for the primary action. */
.pill.g{background:var(--green-soft);border-color:#BFE3CC;color:var(--green)}
.pill.a{background:var(--amber-soft);border-color:#EDD9A3;color:var(--amber)}
.pill.r,.pill.b{background:var(--red-soft);border-color:#F1C6C6;color:var(--red)}
.pill.n{background:var(--bg);border-color:var(--line);color:var(--muted)}
.pill:hover{border-color:#C7D2E4}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.whatif{text-align:center;padding:8px 0 2px}
.whatif .big{font-size:clamp(30px,8vw,44px);font-weight:900;letter-spacing:-1.7px;color:var(--amber);line-height:1.05}
.whatif .cap{font-size:13.5px;color:var(--body);margin-top:8px;line-height:1.5}
.whatif .cap b{color:var(--ink)}

/* ============ CALCULATOR ============ */
details.tool{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
details.tool summary{cursor:pointer;list-style:none;font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;padding:16px 18px}
details.tool summary::-webkit-details-marker{display:none}
details.tool summary .chev{margin-left:auto;color:var(--muted);font-size:11px}
.tool-body{padding:0 18px 18px;border-top:1px solid var(--line)}
.note-done{background:var(--amber-soft);border:1px solid #F0D48A;color:var(--amber);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-top:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0 4px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-weight:700;color:var(--ink)}
.field input:disabled{background:#F7FAFE;color:var(--muted)}
.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.reset{margin-top:12px;background:none;border:none;color:var(--blue);font:600 12.5px inherit;padding:0;text-decoration:underline}
/* ---- commission page, prototype layout (Nick, 2026-08-26: match the v22 preview) ---- */
.coms-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.coms-av{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.coms-top h1{font-size:19px;font-weight:800;color:var(--ink);margin:0}
.coms-top .meta{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.coms-top .meta span+span:before{content:'·';margin:0 7px;color:#C3CDDE}
.coms-hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#DCE6F5;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 20px;margin-bottom:16px}
.coms-hero .lab{font-size:11.5px;font-weight:800;color:#9FB2CE}
.coms-hero .amt{font-size:40px;font-weight:800;color:#fff;letter-spacing:-.5px;margin:6px 0 2px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.coms-hero .amt small{font-size:12.5px;font-weight:700;color:#9FB2CE;letter-spacing:0}
.coms-hero .line{font-size:13px;color:#C4D2E8;margin-top:6px}
.coms-split{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
@media(max-width:640px){.coms-split{grid-template-columns:1fr}}
.coms-split .k{font-size:11.5px;font-weight:700;color:#9FB2CE}
.coms-split .v{font-size:21px;font-weight:800;color:#fff;margin-top:4px}
.coms-split .s{font-size:12px;color:#9FB2CE;margin-top:8px}
.coms-meter{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:14px;overflow:hidden}
.coms-meter i{display:block;height:100%;border-radius:3px;background:#fff;transition:width .3s}
.card.figures{border-left:3px solid var(--blue)}
.field select{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-weight:700;color:var(--ink);font-size:13px}
.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.coms-rows{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.coms-rows>div{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 14px;font-size:13px;color:var(--body);background:#fff}
.coms-rows>div+div{border-top:1px solid #EEF2F8}
.coms-rows b{font-weight:800;color:var(--ink)}
.pace{height:7px;border-radius:4px;background:#E8EDF6;margin-top:14px;overflow:hidden}
.pace i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.seg{display:inline-flex;background:#F1F5FB;border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px;flex-wrap:wrap}
.seg .pill{border:none;background:transparent;border-radius:8px;padding:8px 14px;color:var(--body)}
.seg .pill.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,30,54,.12)}
.chip2{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;border-radius:14px;padding:4px 10px;white-space:nowrap}
.chip2 i{width:6px;height:6px;border-radius:50%;display:inline-block}
.chip2.togo{background:var(--blue-soft);color:var(--blue)}.chip2.togo i{background:var(--blue)}
.chip2.beat{background:var(--green-soft);color:var(--green)}.chip2.beat i{background:var(--green)}
.chip2.here{background:var(--navy);color:#fff}.chip2.here i{background:#fff}
.chip2.next{background:var(--amber-soft);color:var(--amber)}.chip2.next i{background:var(--amber)}
.tiny2{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.55}
/* ---- My Progress, prototype layout (Nick, 2026-08-26) ---- */
.pg-score{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 22px;margin:10px 0 6px}
.pg-score b{font-size:34px;font-weight:800}
.pg-score small{font-size:11px;color:var(--muted);font-weight:700}
.pg-score.low{background:var(--red-soft);border-color:#F1C6C6}.pg-score.low b{color:var(--red)}
.pg-score.mid{background:var(--amber-soft);border-color:#EDD9A3}.pg-score.mid b{color:var(--amber)}
.pg-score.good{background:var(--green-soft);border-color:#BFE3CC}.pg-score.good b{color:var(--green)}
.pg-verdict{font-size:16px;font-weight:800;color:var(--ink);margin:10px 0 4px}
.pg-drv{margin-top:14px}
.pg-row{display:grid;grid-template-columns:150px 165px 1fr 168px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #EEF2F8}
.pg-row:last-child{border-bottom:none}
.pg-l{font-size:12.5px;font-weight:700;color:var(--ink)}
.pg-v{font-size:12.5px;font-weight:700;white-space:nowrap}.pg-v small{color:var(--muted);font-weight:600}
.pg-bar{height:8px;border-radius:4px;background:#E8EDF6;overflow:hidden;display:block}
.pg-bar i{display:block;height:100%;border-radius:4px}
.pg-bar i.ok{background:var(--green)}.pg-bar i.part{background:var(--amber)}
/* THE TWO-TONE BAR. Points do not start until half of target, so a bar that simply
   filled to attainment would contradict the points beside it — 55% of target looks
   over half full and pays 2 of 20. The run below the floor is real progress, so it
   is filled, but it pays nothing, so it is pale. The SOLID part is exactly what the
   points column counts, and the shade change is the floor marker. */
.pg-bar2{position:relative;height:8px;border-radius:4px;background:#E8EDF6;overflow:hidden;display:block}
.pg-bar2 i{position:absolute;top:0;height:100%;display:block}
.pg-bar2 i.pale{left:0;opacity:.28;border-radius:4px 0 0 4px}
.pg-bar2 i.solid{border-radius:0 4px 4px 0}
.pg-bar2.ok i{background:var(--green)} .pg-bar2.short i{background:var(--amber)}
.pg-bar2 u.tick{position:absolute;top:-2px;width:1px;height:12px;background:var(--navy);opacity:.4}
/* the deduction ladder: one segment per tier, the agent's filled, the rest outline.
   It has to stay on one line — a ladder that wraps stops reading as a scale. */
.pg-lad{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.pg-lad span{flex:0 0 auto;font-size:10.5px;font-weight:700;border:1px solid var(--line);
  border-radius:10px;padding:2px 8px;color:var(--muted);white-space:nowrap;background:transparent}
.pg-lad span.on{color:#fff;border-color:transparent}
.pg-lad span.on.t0{background:var(--green)} .pg-lad span.on.t1{background:var(--amber)}
.pg-lad span.on.t2{background:var(--red)}
.pg-ded{display:grid;grid-template-columns:170px 1fr 64px;gap:12px;align-items:start;
  padding:11px 0;border-bottom:1px solid #EEF2F8}
.pg-ded:last-of-type{border-bottom:none}
.pg-ded .off{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pg-ded .off.zero{color:var(--muted)} .pg-ded .off.neg{color:var(--red)}
.pg-ded .off.plus{color:var(--green)}
.pg-tally{margin-top:12px;padding-top:11px;border-top:2px solid var(--line);text-align:right;
  font-variant-numeric:tabular-nums;font-size:13px}
@media(max-width:720px){.pg-ded{grid-template-columns:1fr 58px;gap:6px}.pg-ded .lad-cell{grid-column:1/-1}}
.pg-chip{display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap;font-size:12px}
.pg-chip small{color:var(--muted);font-weight:600}
@media(max-width:720px){.pg-row{grid-template-columns:112px 1fr 130px;gap:8px}.pg-bar{display:none}}
.pg-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.pg-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--body);line-height:1.5}
.pg-card .t{font-weight:800;color:var(--ink);margin-bottom:6px;font-size:12px}
.pg-btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn2{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 16px;font-weight:700;font-size:12.5px;color:var(--ink)}
.btn2.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.pg-nba-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.pg-nba-h b{font-size:14px}
.pg-tag{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.pg-status{border-radius:9px;padding:9px 12px;font-size:12.5px;margin:8px 0 10px}
.pg-status b{margin-right:8px;font-size:11px;letter-spacing:.5px}
.pg-status.bad{background:var(--red-soft);color:var(--red)}
.pg-status.warn{background:var(--amber-soft);color:var(--amber)}
.pg-status.good{background:var(--green-soft);color:var(--green)}
.pg-dots{display:flex;gap:14px;margin:10px 0 6px}
.pg-dotcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.pg-dl{font-size:10.5px;font-weight:800;color:var(--muted)}
.pg-dot{width:22px;height:22px;border-radius:50%;border:2px solid #CBD6E6;background:#fff}
.pg-dot.on{background:var(--green);border-color:var(--green)}
.pg-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:10px}
.pg-tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pg-tile .lab{font-size:11px;font-weight:800;color:var(--muted)}
.pg-tile svg{width:100%;height:40px;display:block;margin:4px 0}
.pg-tv b{font-size:15px}.pg-tv small{font-size:11px;color:var(--muted)}
/* ---- Today's number — the daily briefing (Nick, 2026-08-26) ---- */
.td-rungs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.td-rung{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.td-n{min-width:56px;height:56px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex:none}
.td-rung:first-child .td-n{background:var(--green-soft);color:var(--green)}
.td-rung:last-child .td-n{background:var(--violet-soft);color:var(--violet)}
.td-t{font-weight:800;color:var(--ink);font-size:13px}
.td-s{font-size:12px;color:var(--body);margin-top:3px;line-height:1.45}
/* ---- Ask-for-help modal + the TL Help Center (2026-08-26) ---- */
.help-ov{position:fixed;inset:0;background:rgba(10,23,48,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px}
.help-box{background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(10,23,48,.35);max-width:720px;width:100%;padding:20px 22px}
.help-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.help-h b{font-size:16px}
.help-x{border:none;background:#F1F5FB;border-radius:50%;width:30px;height:30px;font-size:13px;color:var(--body)}
.help-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.help-cat{border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px 14px;font-weight:700;font-size:13px;color:var(--ink);text-align:left}
.help-cat:hover{border-color:var(--blue);background:var(--blue-soft)}
.help-sel{font-size:12.5px;color:var(--body);margin-bottom:8px}

#helpNote:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.help-ctx{border:1px dashed var(--line);background:#F7FAFE;border-radius:10px;padding:11px 13px;font-size:12px;color:var(--body);margin-top:10px;line-height:1.6}
.help-ctx .t{font-weight:800;color:var(--muted);font-size:11px;margin-bottom:3px}
.help-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.hc-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #EEF2F8}
.hc-row:last-child{border-bottom:none}
.hc-row.closed{opacity:.62}
.hc-name{font-weight:800;color:var(--blue);text-decoration:underline}
.hc-note{display:none;white-space:pre-wrap;background:#F7FAFE;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--body);margin-top:8px;max-width:560px}
.hc-note.on{display:block}
.hc-stages{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hc-st{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.hc-st.done{color:var(--green);border-color:#BFE3CC;background:var(--green-soft)}
.hc-st.on{background:var(--blue);border-color:var(--blue);color:#fff}
.hc-st:hover:not(.on){border-color:var(--blue);color:var(--blue)}
.act-pills{justify-content:flex-start;margin-top:10px}
/* pills UNDER the row, never beside it — beside pushed them out of the card and
   clipped "Done" off the right edge of the screen */
.needwrap{display:block;margin-bottom:10px}
.needwrap .needrow{margin-bottom:6px}
.needwrap .act-pills{margin:0 0 0 4px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(10,23,48,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#F7FAFE;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .lab{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--ink);margin:5px 0 2px;line-height:1.1}
.stat .sub{font-size:11.5px;color:var(--muted);line-height:1.45}

/* ============ BRACKET TABLE ============ */
.scroller{overflow-x:auto;margin-top:14px}
.tbl{width:100%;border-collapse:collapse;min-width:540px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:800;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}

.sub2{font-size:10.5px;color:var(--muted)}

/* ============ TEAM LIST ============ */
.tlist{margin-top:4px}

.tbar{margin-top:11px}
.tbl2{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px;font-weight:600}

/* ============ THE AGENT CARD (AgentOS .ac-*) ============
   Lifted from the agent drill-down in Chatterbox_AgentOS_Analytics.html: a navy
   header naming the person with rank boxes on the right, then a row of metric
   tiles. The management card's third state is FAIL in red; here it is FOCUS in

.ac-head{background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px 18px;display:flex;gap:14px;
  align-items:center;flex-wrap:wrap;margin-bottom:14px;position:relative;overflow:hidden}

.ac-cd{opacity:.75;font-weight:600;font-size:15px}
.ac-meta{font-size:11.5px;opacity:.8;margin-top:3px;position:relative;line-height:1.5}

  padding:8px 14px;text-align:center;position:relative;min-width:104px}
.ac-box .v{font-size:24px;font-weight:800;line-height:1.1}
.ac-box .k{font-size:9.5px;letter-spacing:.6px;opacity:.8;margin-top:2px}
.ac-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:14px}

.ac-big{font-size:23px;font-weight:800;letter-spacing:-.5px}
.ac-lab{font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--body);margin-top:2px}
.ac-sub{font-size:10.5px;color:var(--muted);margin:2px 0 7px;line-height:1.35;min-height:28px}

/* ============ NBA DRILL-DOWN ============ */
.nbacard{padding:16px 18px}
.nbah{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.dk-t.good{border-color:rgba(52,211,153,.35)} .dk-t.warn{border-color:rgba(251,191,36,.35)} .dk-t.bad{border-color:rgba(251,113,133,.35)}
.dk-l{font-size:9.5px;font-weight:800;letter-spacing:.11em;color:#8296B5}
.dk-v{font-size:21px;font-weight:800;color:#EAF1FB;margin:3px 0 1px;letter-spacing:-.5px}
.dk-s{font-size:11px;color:#71809B;line-height:1.4}
.dk-rank{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;background:rgba(148,182,255,.05);
  border:1px solid rgba(148,182,255,.13);border-radius:11px;padding:10px 13px;font-size:12.5px;color:#9FB0CC}

/* the compliance marker on a coaching theme — a small in-line flag, NOT .pill
   (that is the light-theme button pill: on this dark drawer it rendered as a

.dk-flag{display:inline-block;vertical-align:1px;margin-left:8px;font-size:9.5px;font-weight:800;letter-spacing:.6px;color:#FCA5A5;background:rgba(196,45,45,.18);border:1px solid rgba(252,165,165,.35);border-radius:9px;padding:2px 8px;line-height:1.4;white-space:nowrap}

/* ============ HUB FORMS ============ */
.hfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.hf.wide{grid-column:1/-1}
.hf label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.hf input,.hf select,.hf textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:600 13.5px inherit;color:var(--ink)}
.hf textarea{resize:vertical;font-weight:500;line-height:1.5}
.hf input:focus,.hf select:focus,.hf textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.hrow{display:flex;align-items:center;gap:12px;margin-top:6px}
.hmsg{font-size:12.5px;font-weight:600}
.hmsg.ok{color:var(--green)} .hmsg.bad{color:var(--red)}
.tbl td.sml{font-size:12px;line-height:1.5;color:var(--body);max-width:340px;white-space:normal}
/* ============ FORM EDITOR ============ */
.fhead{position:sticky;top:0;z-index:5}
.frow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.frow b{font-size:15px}
.frow .hmsg{margin-left:auto}
.fpgs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.fpg{border:1px solid var(--line);background:#fff;color:var(--body);border-radius:9px;padding:7px 15px;font:700 12.5px inherit}
.fpg.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fsec{font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.kpitbl{min-width:560px}
.kpitbl input.kc{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:600 13px inherit;color:var(--ink);background:#fff}
.kpitbl input.kc:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.kpct{font-weight:800;color:var(--ink)}
.hf input.line{margin-bottom:7px}
.wk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.wk>summary{cursor:pointer;list-style:none;font-weight:800;font-size:14px;padding:2px 0}
.wk>summary::-webkit-details-marker{display:none}
/* ---- the six coaching documents ---- */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.pick{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 15px;font:inherit;color:var(--ink)}
.pick:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(37,99,235,.10)}
.pick b{font-size:13.5px;font-weight:800}
.pick span{font-size:11.5px;color:var(--muted);font-weight:600}
.cc{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font:600 13px inherit;color:var(--ink);background:#fff}
textarea.cc{font-weight:500;line-height:1.5;resize:vertical}
.cc:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.callrow{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px;background:#fff;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px;align-items:end}
.callrow>b{grid-column:1/-1;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.sctbl{min-width:520px}
.sctbl select{width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font:600 12px inherit;background:#fff}
.scgrp td{background:#F4F7FC;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted)}
.fprose{font-size:13.5px;line-height:1.6;color:var(--body);margin:10px 0}
.fbul{margin:6px 0 12px 18px;font-size:13.5px;line-height:1.7;color:var(--body)}
.obox{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.oitem{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.oitem input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
.sig{border:1px dashed var(--line2,#C7D2E4);border-radius:9px;height:80px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:crosshair;overflow:hidden}
.sig span{font-size:12px;color:var(--muted)}
.sig img{max-height:78px;max-width:100%}
.sigclr{margin-top:6px}
/* ============ MONTH TO DATE ============
   Metric rows against people columns, the shape VAS Analytics uses. On a team of
   twenty the table is wider than any screen, so the metric column is frozen —
   without it you scroll right and lose which row you are reading. */
.tbl.mtd{min-width:auto}
.tbl.mtd th,.tbl.mtd td{white-space:nowrap;text-align:right}
.tbl.mtd th.stick,.tbl.mtd td.stick{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;
  font-weight:700;color:var(--ink);box-shadow:1px 0 0 var(--line)}
.tbl.mtd th.stick{background:#F7FAFE}
.tbl.mtd tr:hover td{background:#F7FAFE}
.tbl.mtd tr:hover td.stick{background:#F1F6FD}
.tbl.mtd th{text-align:right}
.tbl.mtd th.tot,.tbl.mtd td.tot{background:var(--blue-soft);font-weight:800;color:var(--ink)}
.tbl.mtd tr:hover td.tot{background:#DCE9FF}
.tbl th.l,.tbl td.l{text-align:left}

/* ============ CHART ============ */
.spark{height:56px;margin-top:12px}
.spark svg{width:100%;height:56px;display:block}

/* ============ SIGN IN ============ */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 520px at 82% -12%,rgba(37,99,235,.10),transparent 60%),var(--bg)}
.login .box{width:390px;max-width:100%}
.login .mast{text-align:center;margin-bottom:20px}
.login .mast img{width:172px;margin:0 auto 4px;display:block}
.login .brand-sub{font-size:11px;color:var(--muted)}
.login .greet{font-size:21px;font-weight:800;letter-spacing:-.3px;text-align:center;margin-bottom:3px}
.login .greet-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.login .card{padding:20px 22px;margin-bottom:0}
.login label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.login label:first-of-type{margin-top:0}
.login input{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14px;font-weight:600;color:var(--ink)}
.login input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.login .primary{width:100%;margin-top:18px;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:14px;background:var(--blue);color:#fff}
.login .primary:disabled{opacity:.6}
.err{background:var(--red-soft);border:1px solid #F2B8B8;color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:12px;font-weight:600}

/* ============ STATES ============ */
.msg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:13px;padding:24px;text-align:center}
.msg .t{font-size:17px;font-weight:800;color:var(--ink)}
.msg .d{max-width:46ch;line-height:1.6}
.boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:13px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.finder{max-width:460px;margin:0 auto}
.mast{text-align:center}
.brand{font-weight:900;letter-spacing:-.4px}
.brand i{font-style:normal;color:var(--blue)}
.brand-sub{font-size:11px;color:var(--muted)}
.greet{font-size:24px;font-weight:800;letter-spacing:-.3px}
.greet-sub{color:var(--muted);font-size:13px;margin-top:2px}

@media(max-width:860px){
  .sidebar{position:fixed;left:-244px;z-index:60;transition:left .18s;box-shadow:0 0 40px rgba(0,0,0,.35)}

  .main{padding:14px}
  .menu-btn{display:inline-flex}
  .page-title{font-size:20px}

}

/* The management-orientation tables (MTD / Weekly / Daily): agents as rows. The first
   column stays put while the metrics scroll; the Grand Total row reads as a floor, not
   as another agent; day boundaries in the Daily table get a heavier rule. */
.tbl.vastbl th,.tbl.vastbl td{white-space:nowrap;padding:7px 10px}
.tbl.vastbl th.stick,.tbl.vastbl td.stick{position:sticky;left:0;background:var(--card,#fff);z-index:1}
.tbl.vastbl thead th{position:sticky;top:0;background:var(--card,#fff);z-index:2}
.tbl.vastbl thead th.stick{z-index:3}
.tbl.vastbl tr.grand td{border-top:2px solid var(--ink,#111);font-weight:600;background:var(--card,#fff)}
.tbl.vastbl tr.dayfirst td{border-top:2px solid var(--line,#D8E0EC)}
.tbl.vastbl .sub2{font-size:10px;color:var(--muted,#7A8699)}


/* ============ THE CAMPAIGN MANAGER VIEW ============
   Same components as everything above — the suite wears one skin. What is new
   is only what the control table and the assistance register need: a status
   stripe, small SLA chips, and a right-hand drawer for one request. */
.cm-band{font-size:13px;color:var(--body);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:14px}
.cm-band.warn{background:var(--amber-soft);border-color:#EDD9A3;color:var(--amber)}
.mini{display:inline-block;font-size:11px;font-weight:800;border-radius:12px;padding:2px 9px;white-space:nowrap}
.mini.g{background:var(--green-soft);color:var(--green)}
.mini.a{background:var(--amber-soft);color:var(--amber)}
.mini.r{background:var(--red-soft);color:var(--red)}
.mini.b{background:var(--blue-soft);color:var(--blue)}
.mini.n{background:var(--bg);color:var(--muted)}
.cmtbl td:first-child{border-left:3px solid transparent}
.cmtbl tr.rag-r td:first-child{border-left-color:var(--red)}
.cmtbl tr.rag-a td:first-child{border-left-color:var(--amber)}
.cmtbl tr.rag-g td:first-child{border-left-color:var(--green)}
.cmtbl tr.rag-n td:first-child{border-left-color:var(--line-2,#CBD6E8)}
.cm-brief{counter-reset:cmb}
.cm-act{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:10px}
.cm-act .nn{counter-increment:cmb;flex:none;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cm-act .nn::before{content:counter(cmb)}
.cm-act .aw{font-weight:700;color:var(--ink);font-size:13.5px}
.cm-act .ay{font-size:12.5px;color:var(--body);margin-top:2px}
.cm-act .am{font-size:12px;color:var(--muted);margin-top:5px}
.cmov{position:fixed;inset:0;background:rgba(10,23,48,.55);z-index:90;display:flex;justify-content:flex-end}
.cmpanel{width:min(580px,100%);background:var(--card);height:100%;overflow-y:auto;padding:20px 22px;box-shadow:-8px 0 30px rgba(15,30,54,.25)}
.cmpanel h3{font-size:16px;font-weight:800;margin-bottom:2px}
.cmpanel .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.cmpanel label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:12px 0 4px}
.cmpanel textarea,.cmpanel input[type=text],.cmpanel input[type=number],.cmpanel select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
.cmpanel textarea{min-height:84px;resize:vertical}
.cm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cm-note-row{border-top:1px solid var(--line);padding:9px 0;font-size:12.5px;color:var(--body);white-space:pre-wrap}
.cm-note-row .at{font-size:11px;color:var(--muted);margin-bottom:2px}
.cm-filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end}
.cm-filter .f{display:flex;flex-direction:column;gap:3px}
.cm-filter .f span{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.cm-filter select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff;color:var(--ink)}

.wp-hero .btn.primary{background:#fff;color:#7f1d1d;border-color:#fff}
.wp-week{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.wp-day{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;gap:1px}
.wp-day.today{border-color:#b91c1c;box-shadow:0 0 0 1px #b91c1c inset}
.wp-day .d{font-size:10px;font-weight:900;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.wp-day.today .d{color:#b91c1c}
.wp-day .n{font-size:11.5px;font-weight:800;color:var(--ink);line-height:1.2}
.wp-day .p{font-size:11px;font-weight:700;color:var(--muted)}
.wp-cat .ct{opacity:.55;font-weight:800}
.was{color:var(--muted);font-weight:600;font-size:.82em;margin-left:6px;opacity:.85}
.save{display:inline-block;font-style:normal;font-size:10px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:#15803d;background:rgba(21,128,61,.1);border-radius:99px;padding:2px 8px;margin-left:7px;vertical-align:1px}
.wp-hero .was{color:#fff;opacity:.7}
.wp-hero .save{color:#7f1d1d;background:#fff}
.wp-day{cursor:pointer;text-align:left}
.wp-day:focus-visible{outline:2px solid #b91c1c;outline-offset:2px}
.wp-day.open{background:rgba(185,28,28,.06)}
.wp-day .p s{color:var(--muted);font-weight:600;margin-left:4px}
.wp-peek{background:var(--card);border:1px solid #b91c1c;border-radius:12px;padding:13px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.wp-peek .d{font-size:10px;font-weight:900;letter-spacing:1.2px;color:#b91c1c}
.wp-peek .n{font-size:17px;font-weight:900;color:var(--ink);margin:2px 0}
.wp-peek .desc{font-size:12.5px;color:var(--muted);line-height:1.45;max-width:62ch}
.wp-peek .row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:9px}
.wp-peek .row .p{font-size:16px;font-weight:900;color:var(--ink)}
.wp-peek .when{font-size:11.5px;font-weight:700;color:var(--muted)}
.wp-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.wp-cat{border:1px solid var(--line);background:#fff;color:var(--body);border-radius:20px;padding:8px 16px;font-size:12.5px;font-weight:700}
.wp-cat.on{background:var(--blue);border-color:var(--blue);color:#fff}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.wp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.wp-card h4{font-size:14px;font-weight:800;color:var(--ink);line-height:1.25}
.wp-card .d{font-size:12px;color:var(--muted);line-height:1.5;flex:1}
.wp-card .p{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
.wp-card .p.na{font-size:12.5px;font-weight:700;color:var(--amber)}
.wp-card button{width:100%}
/* the cart — a column beside the menu, a sheet under it on a phone */
.wp-cart{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;position:sticky;top:14px}
.wp-cart h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px}
.wp-line{border-top:1px solid var(--line);padding:11px 0}
.wp-line:first-of-type{border-top:none}
.wp-line .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wp-line .n{font-size:13px;font-weight:800;color:var(--ink)}
.wp-line .m{font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.wp-line ul{list-style:none;margin:5px 0 0;padding:0}
.wp-line li{font-size:11.5px;color:var(--muted);line-height:1.5}
.wp-line li.rm::before{content:"− ";color:var(--red);font-weight:800}
.wp-line li.ad::before{content:"+ ";color:var(--green);font-weight:800}
.wp-line li.ch::before{content:"• ";color:var(--blue);font-weight:800}
.wp-qty{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.wp-qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:800;line-height:1;padding:0}
.wp-qty .q{min-width:22px;text-align:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
/* Edit is pushed right; Remove sits beside it. Both used to be shoved past the
   cart's edge by a margin-left:auto on each, which clipped "Remove" clean off. */
.wp-qty .lnk{font-size:11.5px;padding:4px 6px}
.wp-qty .lnk:first-of-type{margin-left:auto}
.wp-tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:10px;padding-top:10px}
.wp-tot .l{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.wp-tot .v{font-size:23px;font-weight:900;letter-spacing:-.6px;color:var(--ink);font-variant-numeric:tabular-nums}
.wp-empty{font-size:12.5px;color:var(--muted);line-height:1.6;padding:6px 0 2px}
@media(max-width:1000px){
  .wp-cart{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:16px 16px 0 0;z-index:60;max-height:72vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(15,30,54,.22)}
  .wp-cart.shut{transform:translateY(calc(100% - 62px))}
  .wp-pull{display:flex;width:100%;align-items:center;gap:10px;border:none;background:none;padding:0 0 10px;font-weight:800;color:var(--ink)}
  .wp-pad{height:78px}
}
@media(min-width:1001px){.wp-pull{display:none}.wp-pad{display:none}}
/* the customisation sheet reuses .cmov/.cmpanel, but slides from the right on a
   desk and up from the bottom on a phone, which is where a thumb is */
.wp-opts{display:flex;flex-direction:column;gap:2px}
.wp-opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--ink);background:#fff;text-align:left;width:100%}
.wp-opt.on{border-color:var(--blue);background:var(--blue-soft)}
.wp-opt .bx{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2,#C7D2E4);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.wp-opt.on .bx{background:var(--blue);border-color:var(--blue)}
.wp-opt.rd .bx{border-radius:50%}
.wp-opt .gone{text-decoration:line-through;color:var(--muted)}
.wp-opt .pr{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.wp-bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin:16px -22px -20px;padding:13px 22px;display:flex;align-items:center;gap:12px}
.wp-bar .v{font-size:19px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:auto}
.wp-err{background:var(--red-soft);border:1px solid #F1C6C6;color:var(--red);font-size:12.5px;font-weight:600;border-radius:9px;padding:9px 12px;margin-bottom:10px;line-height:1.5}
.wp-ok{text-align:center;padding:26px 10px}
.wp-ok .big{font-size:44px;line-height:1}
.wp-ok h3{font-size:18px;font-weight:800;margin:12px 0 4px;color:var(--ink)}

</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}

/* Money the way an agent reads it on a payslip: R 5 280 (no cents on headline
   figures — cents on a motivational number are noise, and the calculator's own
   table keeps them where precision matters). */
/* One formatter per decimal place, built once. toLocaleString WITH an options object
   constructs a fresh Intl.NumberFormat on every call, which a CPU profile of the suite showed
   dominating table builds; #format gives byte-identical output. This page runs on the agents'
   own phones, where that construction cost is felt hardest. */
var __nfCache={};
function __nf(d){return __nfCache[d]||(__nfCache[d]=new Intl.NumberFormat('en-ZA',{minimumFractionDigits:d,maximumFractionDigits:d}));}
function R(v,dec){
  if(v==null||isNaN(v))return '—';
  return 'R '+__nf(dec||0).format(Number(v));
}
function pct(v,d){return v==null||isNaN(v)?'—':(v*100).toFixed(d||0)+'%';}
function num(v,d){return v==null||isNaN(v)?'—':__nf(d||0).format(Number(v));}
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||'there';}
function initials(n){var p=String(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'?').toUpperCase()+((p[1]||'')[0]||'').toUpperCase();}
function hue(code){var s=0,t=String(code||'');for(var i=0;i<t.length;i++)s+=t.charCodeAt(i);return s%360;}

/* Greeting on SOUTH AFRICAN time, whatever the device clock says. Intl with an
   IANA zone — not a fixed +2 offset — so it stays correct if the country ever
   observes DST again, and it is right for an agent whose phone is on the wrong
   timezone or who opens the link from abroad. */
function sastHour(){
  try{
    return parseInt(new Intl.DateTimeFormat('en-ZA',{timeZone:'Africa/Johannesburg',hour:'numeric',hour12:false}).format(new Date()),10);
  }catch(e){ return new Date().getHours(); }
}
function greeting(){var h=sastHour();return h<12?'Good morning':(h<17?'Good afternoon':'Good evening');}

/* ===================== the commission model =====================
   Ported line-for-line from the Comms Calculator (src/routes/index.tsx and
   src/routes/m0.tsx). Line references are to that source. Do NOT "tidy" the
   maths: two of its choices look like bugs and are not —
     · the gap to the next bracket is measured against the ACTUAL GWP written so
       far, not the projection (index.tsx:137), so it answers "how much more must
       I write", which is the question an agent is actually asking;
     · commission inside a bracket is pro-rata on that bracket's rate
       (index.tsx:115), it is not the flat bracket amount.
   diagnostics/verify-agent-analytics.mjs runs both implementations over a grid
   and fails the build on any difference. */
function commissionFor(brackets,projected){          // index.tsx:104-116
  if(!brackets)return 0;
  var active=null;
  for(var i=brackets.length-1;i>=0;i--){ if(projected>=brackets[i].gwp){active=brackets[i];break;} }
  return active?projected*(active.comm/active.gwp):0;
}
function commCalc(plan,completedDays,totalDays,totalGWP,extraSales,rules){
  /* a digest without the comm block must degrade to the "Not set up yet" hero,
     never throw inside show() and take the whole portal down (audit, 2026-08-27) */
  if(!rules||rules.saleValue==null||(plan!=='M0'&&!rules.brackets)) return null;
  var cDays=parseFloat(completedDays), tDays=parseFloat(totalDays), gwp=parseFloat(totalGWP);
  if(isNaN(cDays)||isNaN(tDays)||isNaN(gwp)||cDays<=0) return null;      // index.tsx:96
  var metrics={averageGWP:gwp/cDays, premiumProjected:(gwp/cDays)*tDays, remainingDays:tDays-cDays}; // :98-100

  // M0 has no brackets at all: commission is 100% of the projected premium (m0.tsx:214-219)
  if(plan==='M0'){
    var wf0=metrics.premiumProjected+extraSales*rules.saleValue*metrics.remainingDays;
    return {plan:'M0',metrics:metrics,projection:metrics.premiumProjected,brackets:null,
      nextMove:null,table:null,nextTarget:null,
      whatIf:{newPremium:wf0,newComm:wf0,extraVsCurrent:wf0-metrics.premiumProjected}};
  }

  var brackets=rules.brackets[plan];
  /* .length too: an EMPTY bracket table published for a plan crashed nextTarget's
     table[0] read and blanked the whole portal for everyone on that plan
     (review, 2026-08-26). Empty = no model on file, same as missing. */
  if(!brackets||!brackets.length) return null;
  var projected=metrics.premiumProjected;
  var projection=commissionFor(brackets,projected);                       // :118-121

  var nextMove=null;                                                      // :123-141
  var nb=null;
  for(var i=0;i<brackets.length;i++){ if(projected<brackets[i].gwp){nb=brackets[i];break;} }
  if(nb){
    var gap=nb.gwp-gwp;                                                   // :137 — vs ACTUAL
    nextMove={nextComm:nb.comm, gap:gap,
      neededPerDay:metrics.remainingDays>0?gap/metrics.remainingDays:null, // :138
      extraComm:nb.comm-(projection||0)};                                 // :139
  }

  var extraGWP=extraSales*rules.saleValue*metrics.remainingDays;          // :149
  var newProjected=metrics.premiumProjected+extraGWP;                     // :150
  var newComm=commissionFor(brackets,newProjected);                       // :151
  var whatIf={newPremium:newProjected,newComm:newComm,extraVsCurrent:newComm-(projection||0)};

  var activeIndex=-1;                                                     // :164-170
  for(var j=brackets.length-1;j>=0;j--){ if(projected>=brackets[j].gwp){activeIndex=j;break;} }
  var remDays=metrics.remainingDays;
  var table=brackets.map(function(b,index){                               // :172-187
    var gwpGapTotal=b.gwp-gwp;
    var gwpGapPerRemainingDay=remDays>0?gwpGapTotal/remDays:null;
    var status='not_reached';
    if(index===activeIndex) status='current';
    else if(activeIndex>=0&&index<activeIndex) status='beat';
    else if(gwpGapTotal<=0) status='beat';
    else if(activeIndex>=0&&index===activeIndex+1) status='next_target';
    return {gwp:b.gwp,comm:b.comm,targetIncVat:b.gwp,gwpGapTotal:gwpGapTotal,
      gwpGapPerRemainingDay:gwpGapPerRemainingDay,status:status};
  });

  var nextTarget;                                                         // :190-218
  var ai=table.findIndex(function(r){return r.status==='current';});
  if(ai===-1){ nextTarget={kind:'none',perDay:table[0].gwpGapPerRemainingDay}; }
  else if(ai>=brackets.length-1){ nextTarget={kind:'top'}; }
  else {
    var nb2=brackets[ai+1];
    var gap2=nb2.gwp-parseFloat(totalGWP);
    nextTarget={kind:'next',bracketNumber:ai+2,
      perDay:remDays>0?gap2/remDays:null, nextComm:nb2.comm, extra:nb2.comm-(projection||0)};
  }

  return {plan:plan,metrics:metrics,projection:projection,brackets:brackets,
    nextMove:nextMove,whatIf:whatIf,table:table,nextTarget:nextTarget};
}

/* ===================== inline sparkline ===================== */
function spark(values,color){
  var vs=values.filter(function(v){return v!=null;});
  if(vs.length<2) return '';
  var w=600,h=44,min=Math.min.apply(null,vs),max=Math.max.apply(null,vs),span=(max-min)||1;
  var pts=values.map(function(v,i){return [(i/(values.length-1))*w, h-5-((v-min)/span)*(h-12)];});
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('');
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'
    +'<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+color+'" stop-opacity=".3"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +'<path d="'+line+'L'+w+' '+h+'L0 '+h+'Z" fill="url(#sg)"/>'
    +'<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.4" fill="'+color+'"/></svg>';
}

/* ===================== signing in =====================
   CB NUMBER + PASSWORD, on the existing Chatterbox login. This page holds no
   user list and no password logic of its own: it POSTs to /api/login exactly
   like the management apps do, and everything that protects that — PBKDF2,
   lockout after five failures, hashed session tokens, the audit log — is the
   same code. The CB number IS the username; the Worker normalises "CB-93",
   "cb 93" and "093" to the same account, because that is how people type it.

   WHAT THIS PAGE DELIBERATELY DOES NOT DO: decide what you are allowed to see.
   It asks the Worker for /api/portal/overview and renders whatever comes back.
   An agent's response contains one agent and a group average; a team leader's
   contains their team. Nothing else is filtered out on screen, because nothing
   else was ever sent. Editing this file cannot widen anybody's access. */
function api(path, body){
  var o={method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Cbx-Client':'v5'}};
  var t=null; try{ t=sessionStorage.getItem(TKEY); }catch(e){}
  if(t) o.headers.Authorization='Bearer '+t;
  if(body) o.body=JSON.stringify(body);
  return fetch(API+path,o).then(function(r){
    return r.json().then(function(j){ return {ok:r.ok,status:r.status,json:j}; },
                         function(){ return {ok:false,status:r.status,json:{}}; });
  },function(){ return {ok:false,status:0,json:{error:'We could not reach the server. Check your connection and try again.'}}; });
}
function signOut(){
  api('/api/logout',{}).then(function(){},function(){});
  try{ sessionStorage.removeItem(TKEY); }catch(e){}
  U=null; D=null; ME=null; TEAM=null;
  loginScreen();
}

    +'<div class="mast"><img src="'+LOGO+'" alt="The Chatterbox"><div class="brand-sub">Agent Analytics</div></div>'
    +inner+'</div></div>';

}

/* ===================== MONTH TO DATE =====================
   A MIRROR OF THIS SUITE'S OWN MTD TABLE, NOT A NEW REPORT. PULSE's VAS
   Analytics → Month to Date lays the month out as metric ROWS against people
   COLUMNS with a total column on the right; a team leader opening Month to Date
   here gets the same table with their own agents as the columns and their team
   as the total. Same metrics, same order, same wording — so a figure quoted off
   this page is the figure management is looking at.

   Every value is READ from the digest, never recomputed: the row definitions
   below only format what PULSE already published. Where the source has not
   supplied a metric the cell is a dash, because a zero would read as a real
   measurement. */
/* CANCELLATIONS ARE A TEAM LEADER FIGURE, NOT AN AGENT ONE.
   The agent page has one standing rule: nothing is framed as failure, and
   cancellations are the sharpest way to break it — an agent reading "your sales
   cancelled" on their own motivational page is exactly what this app was built
   not to do. A team leader is accountable for the number and it is on the
   management MTD table, so it travels, and it stops here. */
function mtdRows(forAgent){
  var d1=function(v){return v==null?'–':num(v,1);};
  var d0=function(v){return v==null?'–':num(v,0);};
  var p1=function(v){return v==null?'–':pct(v,1);};
  var dur=function(sec){
    if(sec==null) return '–';
    var m=Math.round(sec/60), h=Math.floor(m/60);
    return h?(h+'h '+String(m%60).padStart(2,'0')+'m'):(m+'m');
  };
  /* THE VAS TABLE, ROW FOR ROW (Nick 2026-08-26): same metrics, same labels, same order,
     same formulas as the management dashboard's own Month to Date columns - transposed, but never a
     different number. Two formulas worth naming because they LOOK interchangeable and are
     not, and this table used to use the wrong one: Ave Talk Time divides by EMPLOYED shifts
     (utilisation - an unworked shift drags it down); Talk / Day Worked divides by ACTUAL
     shifts (intensity on the days they were there). VAS shows both, so this does too.
     Score is the VAS leaderboard's own 0-100 (perfScore), published in the digest - shown,
     never recomputed here. */
  var rows=[
    ['Employed Shifts',      function(o){return d1(o.emp);}],
    ['Actual Shifts',        function(o){return d1(o.act);}],
    ['Att %',                function(o){return p1(o.att);}],
    ['Sales Target',         function(o){return d0(o.target);}],
    ['Sales Achieved',       function(o){return '<b>'+d0(o.sales)+'</b>';}],
    ['% of Sales Target',    function(o){return o.pctT==null?'–':pctPill(o.pctT);}],
    ['SPD',                  function(o){return o.spd==null?'–':num(o.spd,2);}],
    ['Cancellations',        function(o){return d0(o.canc);}],
    ['% of Cancellations',   function(o){return (o.canc==null||!o.sales)?'–':pct(o.canc/o.sales,1);}],
    ['Ave Talk Time',        function(o){return dur(o.talk==null?null:(o.emp?o.talk/o.emp:null));}],
    ['GWP Target',           function(o){return o.gwpT==null?'–':R(o.gwpT);}],
    ['GWP Achieved',         function(o){return '<b>'+R(o.gwpEx)+'</b>';}],
    ['% To GWP Target',      function(o){return (o.gwpT==null||!o.gwpT||o.gwpEx==null)?'–':pctPill(o.gwpEx/o.gwpT);}],
    ['Ave GWP',              function(o){return o.aveG==null?'–':R(o.aveG);}],
    ['Referrals',            function(o){return d0(o.ref);}],
    ['% Of Referrals To Sales Achieved', function(o){return (o.ref==null||!o.sales)?'–':pct(o.ref/o.sales,1);}],
    ['Call Quality (QA)',    function(o){return p1(o.qa);}],
    ['Talk / Day Worked',    function(o){return dur(o.talk==null?null:(o.act?o.talk/o.act:null));}],
    /* ONE SCORE, ONE NAME. The rating card shows the seven-driver composite, so this
       row must show the same number — it used to render the four-driver score beside
       it, so the same agent read two different figures called "Score" on one screen. */
    ['Score',                function(o){
      if(o.composite&&o.composite.rated!==false&&o.composite.adj!=null) return '<b>'+Math.round(o.composite.adj)+'</b>';
      return o.score==null?'–':'<b>'+Math.round(o.score*100)+'</b>';}],
  ];
  return forAgent ? rows.filter(function(r){return r[0].indexOf('Canc')<0;}) : rows;
}
function pctPill(v){
  var c=v>=1?'g':(v>=0.8?'a':'r');
  return '<span class="pill '+c+'">'+pct(v,0)+'</span>';
}

/* The team total column. Sums where summing is right, and RE-DERIVES the rates
   rather than averaging the agents' — a mean of percentages weights a quiet M0
   desk the same as a full Exp desk and is simply a different number from the
   team's own rate. */
function teamAgg(rows){
  var cov=rows.filter(function(a){return a.covered;});
  var sum=function(f){ var any=false,t=0;
    cov.forEach(function(r){ if(r[f]!=null){any=true;t+=Number(r[f])||0;} });
    return any?t:null; };
  var emp=sum('emp'), act=sum('act'), sales=sum('sales'), target=sum('target');
  var gwpEx=sum('gwpEx'), gwpT=sum('gwpT'), canc=sum('canc'), talk=sum('talk');
  var qav=cov.filter(function(r){return r.qa!=null;});
  return {
    covered:true, emp:emp, act:act, sales:sales, target:target, gwpEx:gwpEx, gwpT:gwpT,
    canc:canc, talk:talk, ref:sum('ref'),
    att:(emp?act/emp:null),
    pctT:(target?sales/target:null),
    spd:(act?sales/act:null),
    aveG:(sales?gwpEx/sales:null),
    qa:(qav.length?qav.reduce(function(n,r){return n+r.qa;},0)/qav.length:null),
    /* Score is per person by definition; the team column carries the plain mean of the
       members who have one, the same way QA does - a rate re-derived from sums would be a
       different formula from the one VAS publishes. */
    score:(function(){var sv=cov.filter(function(r){return r.score!=null;});
      return sv.length?sv.reduce(function(n,r){return n+r.score;},0)/sv.length:null;})(),
    /* Averaged on the SAME measure the column prints. Mixing a 0-1 score with a
       0-100 composite in one mean would produce a number that is neither. */
    composite:(function(){var cv=cov.filter(function(r){return r.composite&&r.composite.rated!==false&&r.composite.adj!=null;});
      return cv.length?{rated:true,adj:cv.reduce(function(n,r){return n+r.composite.adj;},0)/cv.length}:null;})(),
  };
}

function pageMTD(){
  var mine=(D.agents||[]).filter(function(a){return a.covered;});
  if(!mine.length) return '<div class="card"><h3>Month to date</h3>'
    +'<p class="why">Nobody on your team has figures published for this month yet.</p></div>';
  var total=teamAgg(mine);
  return '<div class="card">'
    +'<h3>Month to date <span class="cnt">'+esc(prettyPeriod())+'</span></h3>'
    +'<p class="why">The same table management reads — one row per agent, your team\'s totals on the last row. Nothing here is worked out twice; these are the published figures.</p>'
    +vasAgentsTable(mine,total,mtdRows())
    +'<p class="why" style="margin-top:12px">Dialling days this month: <b>'+num(D.diallingDays)+'</b> '
    +'· working days: <b>'+num(D.workingDays)+'</b>. A dash means that figure has not been supplied for '
    +'this month — it is not a zero.</p>'
    +'</div>';
}

/* THE MANAGEMENT ORIENTATION (Nick 2026-08-26: "formatted well"): agents as ROWS and
   metrics as COLUMNS, exactly as the management dashboard lays its table out, with a
   Grand Total row re-derived from sums — never a mean of the rows above it. The earlier
   transpose (metrics as rows) squeezed a column per agent and became unreadable past
   eight people. Sorted by SPD like the source table; the first column stays put while
   the rest scroll. */
function vasAgentsTable(list,total,cols){
  var byS=list.slice().sort(function(x,y){return (y.spd||0)-(x.spd||0);});
  return '<div class="scroller"><table class="tbl vastbl"><thead><tr>'
    +'<th class="l stick">Agent</th>'
    +cols.map(function(c){return '<th>'+esc(c[0])+'</th>';}).join('')
    +'</tr></thead><tbody>'
    +byS.map(function(a){
      return '<tr><td class="l stick"><b>'+esc(a.name)+'</b><div class="sub2">'+esc(a.code)+'</div></td>'
        +cols.map(function(c){return '<td class="num">'+c[1](a)+'</td>';}).join('')+'</tr>';
    }).join('')
    +'<tr class="grand"><td class="l stick"><b>Grand Total</b></td>'
    +cols.map(function(c){return '<td class="num">'+c[1](total)+'</td>';}).join('')
    +'</tr></tbody></table></div>';
}

/* ===================== WEEKLY & DAILY, FOR THE TEAM LEADER =====================
   (Nick, 2026-08-26.) the management dashboard's own Weekly and Daily tabs, scoped to this team.
   Both read the per-day rows PULSE publishes in the digest (agent.days) - nothing is
   computed twice, and a digest published before those rows existed degrades to a plain
   sentence instead of an empty table. Two talk figures on purpose, same as everywhere
   else: Ave Talk divides by employed shifts, Talk / Day Worked by actual. */
function daysPublished(){
  return (D.agents||[]).some(function(a){return a.covered&&Array.isArray(a.days)&&a.days.length;});
}
function staleDaysCard(title){
  return '<div class="card"><h3>'+esc(title)+'</h3>'
    +'<p class="why">The published figures do not carry day-level detail yet - they were '
    +'published by an older version of the management dashboard. They refresh within a couple of '
    +'minutes of a signed-in VAS session being open; nothing is missing from the data itself.</p></div>';
}
function durShort(sec){
  if(sec==null) return '–';
  var m=Math.round(sec/60), h=Math.floor(m/60);
  return h?(h+'h '+String(m%60).padStart(2,'0')+'m'):(m+'m');
}
function sumDays(a,from,to){
  var o={emp:0,act:0,t:0,s:0,x:0,tk:0,c:0,r:0,any:false,dc:false};
  (a.days||[]).forEach(function(f){
    if(from&&f.d<from) return; if(to&&f.d>to) return;
    o.any=true; o.emp+=f.emp||0; o.act+=f.act||0; o.t+=f.t||0; o.s+=f.s||0;
    o.x+=f.x||0; o.tk+=f.tk||0; o.c+=f.c||0; o.r+=f.r||0; if(f.dc)o.dc=true;
  });
  return o;
}
function weeklyRows(){
  return [
    ['Employed Shifts', function(o){return num(o.emp,o.emp%1?1:0);}],
    ['Actual Shifts',   function(o){return num(o.act,o.act%1?1:0);}],
    ['Sales Achieved',  function(o){return '<b>'+num(o.s)+'</b>';}],
    ['SPD',             function(o){return o.act?num(o.s/o.act,2):'–';}],
    ['GWP Achieved',    function(o){return '<b>'+R(o.x)+'</b>';}],
    ['Ave GWP',         function(o){return o.s?R(o.x/o.s):'–';}],
    ['Talk Time',       function(o){return (o.tk>0||o.dc)?durShort(o.tk):'–';}],
    ['Talk / Day Worked', function(o){return o.act&&(o.tk>0||o.dc)?durShort(o.tk/o.act):'–';}],
    ['Calls',           function(o){return o.c?num(o.c):'–';}],
    ['Referrals',       function(o){return num(o.r);}],
  ];
}

function pageDailyTeam(){

        +'<td class="num">'+num(f.emp,f.emp%1?1:0)+'</td><td class="num">'+num(f.act,f.act%1?1:0)+'</td>'

/* ===================== COACHING, BY PRODUCT =====================
   The Coaching Hub keeps six separate coaching products and its own dashboard
   counts them separately. Rolling them into one "sessions" number loses the
   thing a team leader is actually asked about — whether the FORMAL coaching got
   done, not whether some coaching happened. Every product is listed, including
   the ones sitting on zero, because a zero here is a finding. */
var COACH_PRODUCTS=['Formal Coaching','Informal Coaching','Group Coaching',
  'Quality Assurance Coaching','Coaching Scorecard','Lead Management Coaching'];

function productCounts(sessions){
  var out={}; COACH_PRODUCTS.forEach(function(p){out[p]=0;});
  (sessions||[]).forEach(function(s){ var k=s.type||s.typeLabel; if(k in out) out[k]++; else out[k]=(out[k]||0)+1; });
  return out;
}
function productGrid(counts,total){
  var ICONS={'Formal Coaching':'📋','Informal Coaching':'💬','Group Coaching':'👥',
    'Quality Assurance Coaching':'🛡️','Coaching Scorecard':'📊','Lead Management Coaching':'🎯'};
  var keys=Object.keys(counts);
  return '<div class="kpi-grid">'+keys.map(function(k){
    var n=counts[k], w=total?Math.round(n/total*100):0;
    return '<div class="kpi"><div class="kpi-top">'
      +'<div class="kpi-ic" style="background:'+(n?'var(--blue-soft)':'#EEF2F8')+'">'+(ICONS[k]||'📄')+'</div>'
      +'<div class="kpi-name">'+esc(k)+'</div></div>'
      +'<div class="kpi-val num">'+num(n)+'</div>'
      +'<div class="track" style="margin-top:8px"><i style="width:'+w+'%;background:'+(n?'var(--blue)':'transparent')+'"></i></div>'
      +'<div class="kpi-sub">'+(n?(w+'% of all coaching recorded'):'None recorded this window')+'</div></div>';
  }).join('')+'</div>';
}

/* ===================== THE NBA LAYER =====================
   Everything below RENDERS the decision ladder; nothing computes it. The engine
   is acStats / cfTier / acNBA / acComposite in Chatterbox_AgentOS_Analytics.html
   and it publishes its answers to kv:nba-digest. If a number here disagrees with
   that app the digest is stale — it cannot be a second implementation, because
   there isn't one. */

var LVL={1:{n:'PROTECT THE BUSINESS',c:'#C42D2D',p:'r'},2:{n:'PROTECT THE REVENUE',c:'#B45309',p:'a'},
         3:{n:'IMPROVE THE SKILL',c:'#2563EB',p:'b'},4:{n:'DEVELOP & RECOGNISE',c:'#158A4C',p:'g'}};
function lvlOf(n){ return LVL[n]||LVL[4]; }
/* Rows are NORMALISED here so one malformed digest row cannot throw inside a render
   and turn the whole TL page into the fatal screen (audit, 2026-08-27): every consumer
   dereferences a.nba.lvl / a.composite.adj / a.twoCheck.status directly, and only the
   drilldown guarded them. Defaults are honest "unknowns", never fake passes. */
function nbaNorm(a){
  if(!a) return a;
  if(!a.nba) a.nba={lvl:4,code:'—',label:'Not scored',reason:'',action:''};
  if(a.nba.lvl==null) a.nba.lvl=4;
  if(!a.composite) a.composite={adj:null};
  if(!a.twoCheck) a.twoCheck={status:'—',gwpSale:null,ta:null};
  if(a.twoCheck.status==null) a.twoCheck.status='—';
  if(!a.r2a) a.r2a={fails:0,tier:null,elite:null};   // r2a was missed in the first pass — :1395/:1617 dereference it too
  return a;
}
function nbaAgents(){ var n=D.nba; var rows=(n&&!n.error&&n.agents)?n.agents:[];
  return rows.map(nbaNorm); }
function nbaBy(cb){ var a=nbaAgents(); for(var i=0;i<a.length;i++) if(a[i].cb===cb) return a[i]; return null; }
function nbaMissingCard(){
  var n=D.nba;
  if(n&&n.agents&&n.agents.length) return '';
  /* TWO DIFFERENT EMPTY STATES, AND THEY MEAN OPPOSITE THINGS. Either nothing has
     been published at all, or it has been published and none of THIS team is in
     it — which happens when the management app's roster disagrees with the Agent
     List about who reports to whom. Saying "not published yet" to a leader whose
     colleagues can see their own scores sends them looking for the wrong problem. */
  if(n&&n.agents&&!n.agents.length&&n.updatedAt) return '<div class="card"><h3>None of your team is in the scores</h3>'
    +'<p class="why" style="margin:0">The decision ladder and composite were published on '
    +esc(String(n.updatedAt).slice(0,10))+', but none of your people appear in them. That happens when the '
    +'management app is working from a different team list to the Agent List — your agents are on it under '
    +'another team leader, or not on it at all. Everything else on this page is your real data and is unaffected.</p></div>';
  return '<div class="card"><h3>Scores are not published yet</h3>'
    +'<p class="why" style="margin:0">The decision ladder, composite and two-check status are worked out by '
    +'the management dashboard, which has not published them yet. Everything else on this page is unaffected — '
    +(n&&n.error?'it reported: '+esc(n.error):'ask Nick to open it once and this fills in on its own')+'.</p></div>';
}
function byDeadline(h){ return h==null?'—':(h<=24?'Within 24 hours':h<=48?'Within 48 hours':h<=72?'This week':'Within '+Math.round(h/24)+' days'); }

/* ---- SCREEN 1 · MY TEAM — who needs you now ----

function pageMyTeam(){

  return staleWarn+banner+cards+ladder+two+adj+spend;
