      if(b.classList.contains('on')) return;
      b.disabled=true;
      var hid=b.getAttribute('data-hid'), sid=b.getAttribute('data-sid');
      api('/api/portal/help/stage',{id:hid,stageId:sid}).then(function(r){
        if(r.ok){
          toast(r.json.closed?'Closed — nice work.':'Moved to '+(r.json.stage||'')+'.');
          /* patch locally — HighLevel's SEARCH index lags a few seconds behind an
             update, so an immediate refetch can show the OLD stage and look broken */
          (HELPD.requests||[]).forEach(function(q){ if(q.id===hid){
            q.stageId=sid; q.stage=r.json.stage||q.stage; q.closed=!!r.json.closed;
            q.stageIdx=(HELPD.stages||[]).findIndex(function(s){return s.id===sid;}); } });
          render();
        }
        else { b.disabled=false; toast((r.json&&r.json.error)||'Could not move it — try again.'); }
      });
    };
  });
}
function trackHTML(){
  var p=ME.pctT, bar=Math.max(0,Math.min(100,(p||0)*100));
  var col=p==null?'var(--muted)':(p>=1?'var(--green)':(p>=.75?'var(--amber)':'var(--blue)'));
  var v,cls;
  if(p==null){ v='We need a target on file before we can track this.'; cls='go'; }
  else if(p>=1.25){ v='Outstanding — you are '+pct(p-1,0)+' past your target with time still to go.'; cls='good'; }
  else if(p>=1){ v='You are over target. Everything from here is upside.'; cls='good'; }
  else if(p>=.75){ v='Nearly there — '+num(Math.max(0,(ME.target||0)-(ME.sales||0)),0)+' more sales gets you to target.'; cls='mid'; }
  else { v='Room to push — '+num(Math.max(0,(ME.target||0)-(ME.sales||0)),0)+' more sales gets you to target.'; cls='go'; }

  return '<div class="card"><h2>How you are tracking</h2>'
    +'<p class="why">Your target for the days worked so far, and how close you are to it.</p>'
    +'<div class="prog"><div class="top"><b>'+num(ME.sales)+' of '+num(ME.target,ME.target%1?1:0)+' sales</b>'
    +'<span>'+(p==null?'':pct(p,0)+' of target')+'</span></div>'
    +'<div class="track"><i style="width:'+bar.toFixed(1)+'%;background:'+(p>=1?'var(--green)':'var(--grad)')+'"></i></div>'
    +'<div class="verdict '+cls+'">'+esc(v)+'</div></div></div>';
}

/* ---- 4. where you stand ----
   Peers are never named and never listed. An agent sees their own position and
   the anonymous group average for people on their campaign and tenure. */
function standHTML(){
  var t=ME.trend, tl={up:'Climbing',down:'Off last week\'s pace',flat:'Steady'}[t]||'Steady';
  var ti={up:'▲',down:'▼',flat:'▬'}[t]||'▬';
  var grp=(D.groups||{})[ME.campaign+'|'+ME.tenure];
  var cmp='';
  if(grp&&grp.n>1){
    var diff=ME.gwpEx-grp.gwpEx;
    cmp='<p class="why" style="margin:14px 0 0">Others at your level are averaging '+R(grp.gwpEx)+' this month. '
      +(diff>=0?'You are <b style="color:var(--green)">'+R(Math.abs(diff))+' ahead</b> of that.'
              :'You are '+R(Math.abs(diff))+' off that pace — very catchable.')+'</p>';
  }
  return '<div class="card"><h2>Where you stand</h2>'
    +'<p class="why">Your position by premium written. Nobody else\'s numbers are shown here — and yours are not shown to them.</p>'
    +'<div class="rankrow">'
    +'<div class="rank"><div class="pos num">'+(ME.rankTeam?ME.rankTeam:'—')+'<small> of '+num(ME.nTeam)+'</small></div>'
    +'<div class="lab">in your team</div></div>'
    +'<div class="rank"><div class="pos num">'+(ME.rankCo?ME.rankCo:'—')+'<small> of '+num(ME.nCo)+'</small></div>'
    +'<div class="lab">across the floor</div></div>'
    +'</div>'
    +'<div class="trend '+esc(t||'flat')+'">'+ti+' '+esc(tl)+'</div>'
    +(ME.badges&&ME.badges.length?'<div class="badges">'+ME.badges.map(function(b){
        return '<div class="badge"><b>'+esc(b[0])+'</b>'+esc(b[1])+'</div>';}).join('')+'</div>':'')
    +cmp
    +'</div>';
}

/* ---- 5. what if you improve (prototype layout — Nick, 2026-08-26) ---- */
function whatIfHTML(c){
  if(!ME.plan||!c) return '';
  /* WITH NO DAYS LEFT THERE IS NO "WHAT IF" — so do not render a card whose
     three buttons cannot change anything and whose only content is an apology.
     That case belongs on the figures card, the one place the day counts are
     editable, so an agent can still ask the question by changing them. */
  if(!(c.metrics.remainingDays>0)) return '';
  return '<div class="card"><h2>What if you improve</h2>'
    +'<div class="seg" id="wpills">'
    +[1,2,3].map(function(n){return '<button class="pill'+(n===EXTRA?' on':'')+'" data-n="'+n+'">+'+n+' sale'+(n>1?'s':'')+' a day</button>';}).join('')
    +'</div><div id="wout">'+whatIfBody(c)+'</div></div>';
}
function whatIfBody(c){
  if(!c||!c.whatIf) return '';
  var sale=(D.comm&&D.comm.saleValue)||(89/1.15);
  var rem=Math.max(0,c.metrics.remainingDays);
  var reached=null;
  if(c.plan!=='M0'&&c.brackets)for(var i=c.brackets.length-1;i>=0;i--){ if(c.whatIf.newPremium>=c.brackets[i].gwp){reached=c.brackets[i];break;} }
  var rows='<div class="coms-rows">'
    +'<div><span>Premium you would write</span><b class="num">'+R(c.whatIf.newPremium,2)+'</b></div>'
    +'<div><span>That is more than now by</span><b class="num" style="color:var(--green)">+'+R(Math.max(0,c.whatIf.newPremium-c.metrics.premiumProjected),2)+'</b></div>'
    +'<div><span>'+(c.plan==='M0'?'Commission it pays':'Bracket it reaches')+'</span><b class="num">'
      +(c.plan==='M0'?R(c.whatIf.newComm,2):(reached?R(reached.comm,2):'still below the first bracket'))+'</b></div>'
    +'</div>';
  /* "No extra" has TWO opposite causes and they must never share a message.
     At the top bracket there is nothing above you. Below the FIRST bracket the
     extra sales are real but have not yet cleared the entry level — the honest
     answer is the shortfall, never "you are at the top". */
  var d=c.whatIf.extraVsCurrent, line;
  var belowFirst=!(c.projection>0);
  if(c.plan==='M0'){ line='On M0 every extra sale pays its full premium — nothing to unlock, nothing held back.'; }
  else if(d>0){ line='That is enough to move your commission: it adds <b>'+R(d)+'</b>, taking you to <b>'+R(c.whatIf.newComm)+'</b> for the month.'; }
  else if(c.nextTarget&&c.nextTarget.kind==='top'){ line='You are already at the top of the scale — more sales keep it there.'; }
  else if(c.nextMove&&rem<=0){ line='Your working days for this month are done — this is your total. Next month the counter resets.'; }
  else if(c.nextMove&&c.nextMove.gap<=0){ line='You have already written past the next bracket. Hold this pace and <b>'+R(c.nextMove.nextComm)+'</b> is yours.'; }
  else if(c.nextMove){
    var short=0;
    if(c.brackets)for(var j=0;j<c.brackets.length;j++){ if(c.whatIf.newPremium<c.brackets[j].gwp){ short=c.brackets[j].gwp-c.whatIf.newPremium; break; } }
    line=short>0
      ? 'That is still <b>'+R(short)+'</b> of premium short of the '+(belowFirst?'first':'next')+' bracket, so the bracket commission does not change yet. The premium itself still counts.'
      : 'Every sale still counts toward <b>'+R(c.nextMove.nextComm)+'</b>.';
  } else { line='Every sale from here lifts your total.'; }
  return rows+'<p class="why" style="margin-top:12px">'+line+'</p>'
    +'<div class="tiny2">Bracket commission moves in steps, so writing more does not always move it straight away. Based on '
    +R(sale,2)+' of premium excluding VAT for each extra sale across your '+num(rem)+' remaining day'+(rem===1?'':'s')+'. A projection, not a guarantee.</div>';
}
function wireWhatIf(){
  var box=$('wpills'); if(!box) return;
  Array.prototype.forEach.call(box.querySelectorAll('.pill'),function(b){
    b.onclick=function(){
      EXTRA=parseInt(b.getAttribute('data-n'),10);
      Array.prototype.forEach.call(box.querySelectorAll('.pill'),function(x){x.classList.remove('on');});
      b.classList.add('on');
      var c=calcNow(); if($('wout')) $('wout').innerHTML=whatIfBody(c);
      refreshTool(c);
    };
  });
}

/* ---- 6. the commission page — the v22 prototype's layout on the REAL model ----
   Nick, 2026-08-26: "in agent view this is how I want my commission calculator to
   look". The LOOK is the prototype's (identity bar → explainer → navy pace hero →
   editable figures → what-if → bracket gap table). The NUMBERS are still commCalc,
   the line-for-line Comms Calculator port proven equal by
   diagnostics/verify-agent-analytics.mjs — the prototype's own flat-step maths was
   fictional-data code and is NOT ported. Where prototype copy described flat steps
   ("pass the step and the whole step is paid"), the wording here says what the real
   model does: each bracket pays a better rate on everything written.
   The old "nobody is shown a bare R 0" hero rule is deliberately retired ON THIS
   PAGE by that instruction — the hero now reads R 0.00 · below the first bracket,
   with the bracket-1 payout named right under it as the number to chase. The Today
   page hero (heroHTML) keeps the first-payout framing. */
var PLAN_LAB={M1:'M1',M2:'M2',EXP_COURTESY:'Experienced — Courtesy',EXP_CUDDLE:'Experienced — Cuddle',M0:'M0'};
function comsDaysNow(){
  var w=$('cDays'),t=$('tDays'),g=$('cGwp');
  return { worked:parseFloat(w?w.value:ME.act)||0,
           dial:parseFloat(t?t.value:TDAYS())||0,
           gwp:parseFloat(g?g.value:ME.gwpEx)||0 };
}
function comsTop(){
  return '<div class="coms-top"><div class="coms-av" style="background:hsl('+hue(ME.code)+',58%,42%)">'+esc(initials(ME.name))+'</div>'
    +'<div><h1>Commission calculator</h1>'
    +'<div class="meta"><span>'+esc(ME.name||'')+'</span>'+(ME.code?'<span>'+esc(ME.code)+'</span>':'')
    +(ME.campaign?'<span>'+esc(ME.campaign)+'</span>':'')
    +'<span>'+esc(prettyPeriod())+' — '+num(TDAYS())+' working days</span></div></div></div>';
}
function comsExplain(c){
  return '<div class="card" style="border-style:dashed">'
    +'<h2>Two different things, both called commission</h2>'
    +'<p class="why" style="margin-top:8px"><b>Today</b> shows what your current pace is worth'
    +(c&&c.projection>0?': <b>'+R(c.projection)+'</b> so far this month':'')+'. That number comes from this table.</p>'
    +'<p class="why" style="margin-top:8px">This page is the campaign bracket table. It works on the <b>value</b> of what you sell over the whole month, not on how many sales you make. Nothing on this page is earned yet.</p>'
    +'<div class="tiny2"><b>Premium</b> is the monthly amount a customer pays for what you sold. '
    +'<b>GWP</b> is all of your premium added up for the month, before VAT. '
    +'<b>A bracket</b> is a step — each step you reach pays a better rate on everything you have written.</div>'
    +'</div>';
}
function comsHero(c){ return '<div class="coms-hero" id="comsHero">'+comsHeroInner(c)+'</div>'; }
function comsHeroInner(c){
  if(!c) return '<div class="lab">Bracket you are on pace for</div><div class="amt">—</div>'
    +'<div class="line">'+((!D.comm||D.comm.saleValue==null)
      ?'The bracket table for your plan has not reached this page yet — nothing here is lost, and your figures are unaffected.'
      :'Once you have worked a day this month, we can show what this pace secures. You can also type numbers into the figures below to explore.')+'</div>';
  var dd=comsDaysNow(), pctFill=dd.dial>0?Math.min(100,(dd.worked/dd.dial)*100):0;   /* pctFill, never "pct" — shadowing the global formatter has blanked pages before */
  if(c.plan==='M0'){
    return '<div class="lab">On pace to earn</div>'
      +'<div class="amt num">'+R(c.projection,2)+'<small>projected, not earned</small></div>'
      +'<div class="line">On M0 your commission is 100% of the premium you write — projected GWP of '+R(c.metrics.premiumProjected,2)+' excluding VAT.</div>'
      +'<div class="coms-meter"><i style="width:'+pctFill+'%"></i></div>'
      +'<div class="s" style="font-size:12px;color:#9FB2CE;margin-top:8px">'+num(dd.worked)+' of '+num(dd.dial)+' working days complete</div>';
  }
  var curIdx=-1; (c.table||[]).forEach(function(r,i){ if(r.status==='current')curIdx=i; });
  var nb=null,nbIdx=-1;
  if(c.brackets)for(var i=0;i<c.brackets.length;i++){ if(c.metrics.premiumProjected<c.brackets[i].gwp){ nb=c.brackets[i]; nbIdx=i; break; } }
  var tag=curIdx>=0?('bracket '+(curIdx+1)+' · projected, not earned'):'below the first bracket';
  var line=nb
    ? 'Projected GWP of '+R(c.metrics.premiumProjected,2)+' excluding VAT over '+num(dd.dial)+' working days. Bracket '+(nbIdx+1)+' pays '+R(nb.comm,2)+'.'
    : 'Projected GWP of '+R(c.metrics.premiumProjected,2)+' excluding VAT. You are on the top bracket for your level — hold it to month end.';
  var gapCell,gapSub;
  if(!c.nextMove){ gapCell='—'; gapSub='Nothing above you to close.'; }
  else if(c.nextMove.gap<=0){ gapCell='R 0.00'; gapSub='You have already written past it — hold this pace to month end.'; }
  else{ gapCell=R(c.nextMove.gap,2);
    gapSub=(c.nextMove.neededPerDay!=null&&c.metrics.remainingDays>0)
      ?('Write '+R(c.nextMove.neededPerDay,2)+' more per remaining day')
      :'No working days left to spread it over.'; }
  var meterPct=nb?Math.min(100,Math.max(0,(dd.gwp/nb.gwp)*100)):100;
  return '<div class="lab">Bracket you are on pace for</div>'
    +'<div class="amt num">'+R(c.projection,2)+'<small>'+tag+'</small></div>'
    +'<div class="line">'+line+'</div>'
    +'<div class="coms-split">'
    +'<div><div class="k">Gap to the next bracket</div><div class="v num">'+gapCell+'</div><div class="s">'+gapSub+'</div></div>'
    +'<div><div class="k">What the next bracket adds</div><div class="v num">'+(c.nextMove?'+'+R(Math.max(0,c.nextMove.extraComm),2):'—')+'</div>'
    +'<div class="coms-meter"><i style="width:'+meterPct+'%"></i></div>'
    +'<div class="s">'+num(dd.worked)+' of '+num(dd.dial)+' working days complete</div></div>'
    +'</div>';
}
function comsFigures(c){
  var plans=[]; try{ plans=Object.keys((D.comm&&D.comm.brackets)||{}); }catch(e){}
  if(plans.indexOf('M0')<0) plans=plans.concat('M0');
  if(ME.plan&&plans.indexOf(ME.plan)<0) plans.unshift(ME.plan);
  var done=c&&!(c.metrics.remainingDays>0);
  return '<div class="card figures"><h2>Your figures for '+esc(prettyPeriod())+'</h2>'
    +(done?'<div class="note-done">Your working days for this month are counted — so there are no remaining days left to add sales to. '
      +'Change the numbers below to see what a different month would have paid.</div>':'')
    +'<div class="fields">'
    +'<div class="field"><label>Tenure</label><select id="cPlan">'
      +plans.map(function(p){return '<option value="'+esc(p)+'"'+(p===((c&&c.plan)||ME.plan)?' selected':'')+'>'+esc(PLAN_LAB[p]||p)+'</option>';}).join('')+'</select></div>'
    +'<div class="field"><label>Total working days passed</label><input id="cDays" type="number" inputmode="decimal" min="0" step="0.5" value="'+esc(ME.act)+'"></div>'
    +'<div class="field"><label>Total working days in the period</label><input id="tDays" type="number" inputmode="numeric" min="1" step="1" value="'+esc(TDAYS())+'"></div>'
    +'<div class="field"><label>Total GWP excluding VAT</label><input id="cGwp" type="number" inputmode="decimal" min="0" step="1" value="'+esc(Math.round(ME.gwpEx*100)/100)+'"></div>'
    +'</div>'
    +'<div id="figRows">'+figRowsInner(c)+'</div>'
    +'<button class="reset" id="reset">Reset to my real figures</button>'
    +'</div>';
}
function figRowsInner(c){
  if(!c) return '<p class="why" style="margin-top:12px">Enter the days you have worked to see the breakdown.</p>';
  var dd=comsDaysNow(), pctFill=dd.dial>0?Math.min(100,(dd.worked/dd.dial)*100):0;   /* pctFill, never "pct" — shadowing the global formatter has blanked pages before */
  return '<div class="coms-rows">'
    +'<div><span>Average GWP a day, excluding VAT</span><b class="num">'+R(c.metrics.averageGWP,2)+'</b></div>'
    +'<div><span>Premium projected, excluding VAT</span><b class="num">'+R(c.metrics.premiumProjected,2)+'</b></div>'
    +'<div><span>Remaining days</span><b class="num">'+num(Math.max(0,c.metrics.remainingDays))+'</b></div>'
    +'</div>'
    +'<div class="pace"><i style="width:'+pctFill+'%"></i></div>'
    +'<div class="tiny2">Working day pace — '+num(dd.worked)+' of '+num(dd.dial)+' days complete ('+Math.round(pctFill)+'% of the period). '
    +'Figures start from your current period in Agent OS and can be changed here without altering anything else — nothing you type is saved.</div>';
}
function comsTableCard(c){
  return '<div class="card"><h2>Bracket gap analysis</h2>'
    +'<p class="why">GWP needed per remaining day to reach each bracket. The gap counts from the premium you have actually banked — exactly how much more you must write, not an estimate.</p>'
    +'<div id="toolOut">'+toolBody(c)+'</div></div>';
}
function toolBody(c){
  if(!c) return '<p class="why" style="margin-top:12px">Enter the days you have worked to see the ladder.</p>';
  if(c.plan==='M0') return '<p class="why" style="margin-top:12px">On M0 your commission is 100% of the premium you write — there are no brackets to climb.</p>';
  var chip={beat:['beat','Beat'],current:['here','You are here'],next_target:['next','Next up'],not_reached:['togo','To go']};
  return '<div class="scroller"><table class="tbl" style="min-width:620px"><thead><tr>'
    +'<th>#</th><th>Bracket GWP excluding VAT</th><th>Bracket commission</th><th>GWP gap total</th><th>GWP gap a remaining day</th><th>Status</th>'
    +'</tr></thead><tbody>'
    +c.table.map(function(r,i){
      var ch=chip[r.status]||chip.not_reached;
      return '<tr class="'+r.status+'"><td class="num">'+(i+1)+'</td>'
        +'<td class="num">'+R(r.gwp,2)+'</td>'
        +'<td class="num" style="color:var(--ink);font-weight:700">'+R(r.comm,2)+'</td>'
        +'<td class="num">'+(r.gwpGapTotal<=0?'—':R(r.gwpGapTotal,2))+'</td>'
        +'<td class="num">'+(r.gwpGapTotal<=0||r.gwpGapPerRemainingDay==null?'—':R(r.gwpGapPerRemainingDay,2))+'</td>'
        +'<td><span class="chip2 '+ch[0]+'"><i></i>'+ch[1]+'</span></td></tr>';
    }).join('')
    +'</tbody></table></div>'
    +'<div class="tiny2">Bracket table for '+esc(PLAN_LAB[c.plan]||c.plan)+' — the official one from Agent OS. If it looks out of date, tell your team leader.</div>';
}
function comsPage(c){
  if(!ME.plan) return comsTop()+heroHTML(c);   // heroHTML's "not set up yet" card says why, without guessing
  return comsTop()+comsExplain(c)+comsHero(c)+comsFigures(c)+whatIfHTML(c)+comsTableCard(c);
}
function refreshTool(c){
  if($('comsHero')) $('comsHero').innerHTML=comsHeroInner(c);
  if($('figRows')) $('figRows').innerHTML=figRowsInner(c);
  if($('toolOut')) $('toolOut').innerHTML=toolBody(c);
}
function wireTool(){
  ['cPlan','cDays','tDays','cGwp'].forEach(function(id){
    var el=$(id); if(!el) return;
    var h=function(){
      var c=calcNow();
      refreshTool(c);
      if($('wout')) $('wout').innerHTML=whatIfBody(c);
    };
    el.addEventListener('input',h);
    el.addEventListener('change',h);
  });
  var r=$('reset');
  if(r) r.onclick=function(){
    if($('cPlan')) $('cPlan').value=ME.plan;
    if($('cDays')) $('cDays').value=ME.act;
    if($('tDays')) $('tDays').value=TDAYS();
    if($('cGwp')) $('cGwp').value=Math.round(ME.gwpEx*100)/100;
    var c=calcNow(); refreshTool(c);
    if($('wout')) $('wout').innerHTML=whatIfBody(c);
  };
}

boot();
</script>
</body>
</html>
