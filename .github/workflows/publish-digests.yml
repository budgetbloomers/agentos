name: publish digests

# THE DIGESTS NO LONGER NEED A BROWSER OPEN ON SOMEBODY'S DESK (audit, 2026-09-03), and since
# the never-stale plan (2026-09-07) neither does anything else in the pipeline. Every step
# below is the same headless tool a person would run, on a schedule, from the cloud — nothing
# local, per the ZERO-LOCAL rule. Every step reports to kv:jobs-status (tools/job-status.mjs);
# the Worker's sentinel raises runner-never-ran / runner-silent / verification-failed from it.
#
# GITHUB DROPS CRON SLOTS (2026-09-08: no run of any schedule for six hours on a Monday morning,
# Actions "operational"). The Worker's own cron now asks for the 15-minute tick when it is overdue
# (worker/src/runner.mjs → workflow_dispatch with steps=tick); GitHub's schedule stays as the first
# scheduler and the Worker is the one that cannot be dropped.
#
# Secrets (Settings → Secrets → Actions): SUPABASE_URL, SUPABASE_SECRET_KEY, SUPABASE_DB_URL.
# Plus HL_API_KEY / HL_LOCATION_ID for the referrals pull. All five were set on 2026-09-07; the first
# run (#1) republished the digests, relayed the archive into Ops, refreshed coaching and loaded the lake.

on:
  schedule:
    - cron: '7,22,37,52 4-18 * * 1-6'   # digests + Ops relay, 06:00–20:00 SAST, Mon–Sat — off the quarter-hours GitHub drops
    - cron: '13 */2 * * *'          # coaching snapshot, every two hours
    - cron: '41 19 * * *'           # daily: lake load (21:41 SAST)
    - cron: '41 4 * * *'            # daily: referrals (06:41 SAST)
    - cron: '9 20 * * 1-5'          # nightly verification (22:09 SAST)
    - cron: '9 5 * * 1'             # Monday 07:09 SAST: weekly reach report
  workflow_dispatch:
    inputs:
      steps:
        description: "tick = the 15-minute digests + Ops relay only (what the Worker asks for when GitHub drops the cron); all = every step; verify = the nightly proof"
        type: choice
        default: all
        options: [all, tick, verify]

concurrency: { group: publish-digests, cancel-in-progress: false }

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  HL_API_KEY: ${{ secrets.HL_API_KEY }}            # HighLevel referrals (tools/fetch-referrals.mjs reads env)
  HL_LOCATION_ID: ${{ secrets.HL_LOCATION_ID }}

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.steps != 'verify') || startsWith(github.event.schedule, '7,22') || github.event.schedule == '13 */2 * * *' || github.event.schedule == '41 19 * * *' || github.event.schedule == '41 4 * * *' || github.event.schedule == '9 5 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Credentials
        run: printf 'SUPABASE_URL=%s\nSUPABASE_SECRET_KEY=%s\nSUPABASE_DB_URL=%s\n' "$SUPABASE_URL" "$SUPABASE_SECRET_KEY" "$SUPABASE_DB_URL" > supabase.env
      - name: Install deps
        working-directory: nicks_code/diagnostics
        run: |
          npm install --no-audit --no-fund
          npm install --no-save pg@8
          npx playwright install --with-deps chromium
      - name: Build the deployed engines locally (the tools drive site/)
        run: node tools/prepare-site.js

      # ---- every 15 minutes: the Data Rake drains the large-file queue (before the digests, so a
      #      file that just landed is in the lake when they republish) ----
      - name: Data Rake — large files → lake
        id: rake
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '7,22') }}
        run: node tools/rake.mjs
      - if: ${{ always() && steps.rake.conclusion != 'skipped' }}
        run: node tools/job-status.mjs rake ${{ steps.rake.outcome }}

      # ---- every 15 minutes: the digests and the Ops relay ----
      - name: Agent digest — live month + history (PULSE engine, headless)
        id: digest
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '7,22') }}
        run: node tools/digest-republish.mjs --apply --history
      - if: ${{ always() && steps.digest.conclusion != 'skipped' }}
        run: node tools/job-status.mjs agent-digest ${{ steps.digest.outcome }}
      - name: Ops relay — the Ops page ingests every unseen archived file
        id: relay
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '7,22') }}
        run: node tools/ops-relay.mjs --wait 300
      - if: ${{ always() && steps.relay.conclusion != 'skipped' }}
        run: node tools/job-status.mjs ops-relay ${{ steps.relay.outcome }}
      - name: NBA digest (Ops engine, headless)
        id: nba
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '7,22') }}
        run: node tools/nba-republish.mjs --apply
      - if: ${{ always() && steps.nba.conclusion != 'skipped' }}
        run: node tools/job-status.mjs nba-digest ${{ steps.nba.outcome }}

      # ---- every two hours ----
      - name: Coaching Hub snapshot
        id: coaching
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.steps == 'all') || github.event.schedule == '13 */2 * * *' }}
        run: node tools/sync-coaching-hub.mjs
      - if: ${{ always() && steps.coaching.conclusion != 'skipped' }}
        run: node tools/job-status.mjs coaching-snapshot ${{ steps.coaching.outcome }}

      # ---- daily ----
      - name: Supabase lake load
        id: lake
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.steps == 'all') || github.event.schedule == '41 19 * * *' }}
        run: node tools/lake-load.mjs
      - if: ${{ always() && steps.lake.conclusion != 'skipped' }}
        run: node tools/job-status.mjs lake-load ${{ steps.lake.outcome }}
      - name: HighLevel referrals
        id: referrals
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.steps == 'all') || github.event.schedule == '41 4 * * *' }}
        run: node tools/fetch-referrals.mjs
        continue-on-error: true
      - if: ${{ always() && steps.referrals.conclusion != 'skipped' }}
        run: node tools/job-status.mjs referrals ${{ steps.referrals.outcome }}

      # ---- weekly ----
      - name: Weekly reach report
        id: reach
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.steps == 'all') || github.event.schedule == '9 5 * * 1' }}
        run: node tools/reach-report.mjs --write
      - if: ${{ always() && steps.reach.conclusion != 'skipped' }}
        run: node tools/job-status.mjs reach-report ${{ steps.reach.outcome }}

  verify:
    if: ${{ github.event.schedule == '9 20 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.steps == 'verify') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Credentials
        run: printf 'SUPABASE_URL=%s\nSUPABASE_SECRET_KEY=%s\nSUPABASE_DB_URL=%s\n' "$SUPABASE_URL" "$SUPABASE_SECRET_KEY" "$SUPABASE_DB_URL" > supabase.env
      - name: Install deps
        working-directory: nicks_code/diagnostics
        run: |
          npm install --no-audit --no-fund
          npm install --no-save pg@8
          npx playwright install --with-deps chromium
      - run: node tools/prepare-site.js
      - name: Nightly proof — every tab, every control, a real save
        id: nightly
        run: |
          set +e; fails=""
          for s in verify-all-tabs verify-controls verify-store-freshness verify-publish-agent-list verify-agent-card verify-rule-constants verify-composite-score verify-password-lifecycle verify-composite-recompute verify-rake verify-no-duplicates verify-upload-formats; do
            node nicks_code/diagnostics/$s.mjs > /tmp/$s.log 2>&1 || fails="$fails $s($(grep -oE '[0-9]+ failed' /tmp/$s.log | head -1 || true): $(grep -E 'FAIL|Error' /tmp/$s.log | head -2 | cut -c1-120 | tr '\n' ';'))"
          done
          node nicks_code/diagnostics/verify-live-save.mjs --live > /tmp/live.log 2>&1 || fails="$fails verify-live-save"
          mkdir -p suite-logs && cp /tmp/*.log suite-logs/ || true
          echo "fails=$fails" >> "$GITHUB_OUTPUT"
          [ -z "$fails" ]
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with: { name: suite-logs, path: suite-logs, retention-days: 14 }
      - if: ${{ always() }}
        run: node tools/job-status.mjs verify-nightly ${{ steps.nightly.outcome }} "${{ steps.nightly.outputs.fails }}"
