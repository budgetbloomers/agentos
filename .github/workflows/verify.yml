name: verify

# THE 70 SUITES RUN THEMSELVES (audit, 2026-09-03). Until now every diagnostic ran only
# when a human remembered; two suites rotted for days unnoticed. This job runs the suites
# that need no live credentials on every push, and — when the Supabase secrets are set on
# the repository — the live ones too. A red run here should block a deploy.
#
# Secrets (Settings → Secrets → Actions): SUPABASE_URL, SUPABASE_SECRET_KEY, SUPABASE_DB_URL.

# NOT ON PUSH ANY MORE (2026-09-16): the account's Actions are billing-blocked and every push
# produced a refused run and an email to Nick. By hand only; the suites run locally before a deploy.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install diagnostics deps (playwright, xlsx, pg)
        working-directory: nicks_code/diagnostics
        run: |
          npm install --no-audit --no-fund
          npm install --no-save pg@8
          npx playwright install --with-deps chromium

      - name: Build site/ (consistency check included)
        run: node tools/prepare-site.js

      - name: Credential-free suites
        run: |
          set -e
          # verify-help-repeat / verify-help-contact (2026-09-28): an agent can ask their team leader for
          # help again — the Help location allows one HighLevel card per person, so every repeat ask 502'd
          for t in verify-agent-analytics verify-wimpy verify-engine-rules verify-rule-constants verify-public-holidays verify-saturday-rule verify-leave-days verify-ops-leave \
                   verify-cm-targets verify-campaign-manager verify-perf-score verify-history \
                   verify-tbc-backdate verify-variance verify-save-acks verify-login-lockout \
                   verify-help-repeat verify-help-contact \
                   verify-drill verify-campaign-moves verify-campaign-split verify-comm-model \
                   verify-attendance-format verify-upload-station-layout verify-digest-fence \
                   verify-cm-digest verify-coaching-wave verify-cm-signoff-worker verify-cm-view; do
            echo "== $t =="; node nicks_code/diagnostics/$t.mjs
          done

      # A step-level if may not read the secrets context — this workflow was INVALID and every one of
      # its 30 push runs since 3 Sep failed at startup with zero jobs (found 2026-09-08). The secret is
      # lifted into a job-level env below and the step tests that instead.
      - name: Live suites (only when secrets are present)
        if: ${{ env.SUPABASE_SECRET_KEY != '' }}
        run: |
          set -e
          printf 'SUPABASE_URL=%s\nSUPABASE_SECRET_KEY=%s\nSUPABASE_DB_URL=%s\n' "$SUPABASE_URL" "$SUPABASE_SECRET_KEY" "$SUPABASE_DB_URL" > supabase.env
          for t in verify-composite-score verify-agent-sync verify-campaign-sync verify-all-tabs \
                   verify-live-integrity verify-agent-list verify-roster-changes verify-nba-publish verify-password-lifecycle verify-rake verify-no-duplicates verify-upload-formats verify-lead-book; do
            echo "== $t =="; node nicks_code/diagnostics/$t.mjs
          done
