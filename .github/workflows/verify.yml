name: verify

# THE 70 SUITES RUN THEMSELVES (audit, 2026-09-03). Until now every diagnostic ran only
# when a human remembered; two suites rotted for days unnoticed. This job runs the suites
# that need no live credentials on every push, and — when the Supabase secrets are set on
# the repository — the live ones too. A red run here should block a deploy.
#
# Secrets (Settings → Secrets → Actions): SUPABASE_URL, SUPABASE_SECRET_KEY, SUPABASE_DB_URL.

# NOT ON PUSH ANY MORE (2026-09-16): the account's Actions are billing-blocked and every push
# produced a refused run and an email to Nick. By hand only; the suites run locally before a deploy.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install diagnostics deps (playwright, xlsx, pg)
        working-directory: nicks_code/diagnostics
        run: |
          npm install --no-audit --no-fund
          npm install --no-save pg@8
          npx playwright install --with-deps chromium

      - name: Build site/ (consistency check included)
        run: node tools/prepare-site.js

      - name: Credential-free suites
        run: |
          set -e
          # verify-help-repeat / verify-help-contact (2026-09-28): an agent can ask their team leader for
          # help again — the Help location allows one HighLevel card per person, so every repeat ask 502'd
          # verify-coaching-signature / verify-coaching-drafts (2026-10-05, specs 003 + 004): signatures drawn on a
          # coaching form reach the Hub; drafts are kept until Submit; a submitted document is never shown to its TL
          # verify-wimpy-signin (2026-10-06, spec 009): the Wimpy sign-in needs the person's password and shares
          # the main sign-in's lock; a CB number alone signs nobody in
          # verify-session-name (2026-10-07, spec 011): Ops shows and stamps the signed-in person, never the last saver
          # verify-kv-large-store (2026-10-07, spec 013): a store too big for the Worker to unpack is kept compressed, read back intact
          # verify-targets-027 (2026-10-11, spec 027): the Agent List row's Target in force that day sits between the CM override and the
          # rule book (VAS engine, digest, /api/roster, CM settings, Ops); September keeps the rule book; mixed groups are named
          # verify-usage-028 (2026-10-11, spec 028): the usage report — migration-061 runs for real in PGlite (table, auth_log
          # trigger, views, anon/authenticated locked out), the Worker records every event without ever changing an answer,
          # and tools/usage-backfill.mjs is re-runnable with the live Worker's keys
          # verify-usage-029 (2026-10-11, spec 029): who asks for help and what is asked most — migration-062 in PGlite (topics,
          # merges, askers per day/week/month, TL, CM), the TL's words on CM requests, the AI topic after the answer, the tools
          # verify-usage-030 (2026-10-11, spec 030): who asked — name, CB, team, TL / CM on every ask (migration-063 in PGlite)
          # spec 014 (2026-10-07) system sweep: one suite per area — VAS, Ops, Agent Analytics+Wimpy, Worker, tick+tools
          # verify-wimpy-history (2026-10-07, spec 015): Wimpy "My orders" shows only the signed-in person's own orders; HighLevel cards never break ordering
          for t in verify-agent-analytics verify-wimpy verify-wimpy-signin verify-wimpy-history verify-session-name verify-kv-large-store verify-vas-sweep-014 verify-ops-sweep-014 verify-agent-sweep-014 verify-worker-sweep-014 verify-tick-014 verify-engine-rules verify-rule-constants verify-public-holidays verify-saturday-rule verify-leave-days verify-ops-leave \
                   verify-coaching-signature verify-coaching-drafts \
                   verify-cm-targets verify-targets-027 verify-campaign-manager verify-perf-score verify-history \
                   verify-tbc-backdate verify-variance verify-save-acks verify-login-lockout \
                   verify-help-repeat verify-help-contact verify-usage-028 verify-usage-029 verify-usage-030 \
                   verify-drill verify-campaign-moves verify-campaign-split verify-comm-model \
                   verify-attendance-format verify-upload-station-layout verify-digest-fence \
                   verify-cm-digest verify-coaching-wave verify-cm-signoff-worker verify-cm-view \
                   verify-empty-month verify-referrals-schedule verify-coaching-attribution verify-live-month-page; do
            echo "== $t =="; node nicks_code/diagnostics/$t.mjs
          done

      # A step-level if may not read the secrets context — this workflow was INVALID and every one of
      # its 30 push runs since 3 Sep failed at startup with zero jobs (found 2026-09-08). The secret is
      # lifted into a job-level env below and the step tests that instead.
      - name: Live suites (only when secrets are present)
        if: ${{ env.SUPABASE_SECRET_KEY != '' }}
        run: |
          set -e
          printf 'SUPABASE_URL=%s\nSUPABASE_SECRET_KEY=%s\nSUPABASE_DB_URL=%s\n' "$SUPABASE_URL" "$SUPABASE_SECRET_KEY" "$SUPABASE_DB_URL" > supabase.env
          for t in verify-composite-score verify-agent-sync verify-campaign-sync verify-all-tabs \
                   verify-live-integrity verify-agent-list verify-roster-changes verify-nba-publish verify-password-lifecycle verify-rake verify-no-duplicates verify-upload-formats verify-lead-book; do
            echo "== $t =="; node nicks_code/diagnostics/$t.mjs
          done
