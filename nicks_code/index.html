/* ---- coaching history, read live from the Coaching Hub via the Worker ----
   Same source the AgentOS drill-down reads; PULSE holds no copy either. The
   rules that matter are applied here too:
   · only the GAP family escalates (purpose is why the session was held, not
     what the agent is working on — and purpose.quality_compliance sits on 451
     of 458 historical sessions, so counting it would penalise everyone equally
     and mean nothing)
   · "inferred" classifications were read out of a coaching note by the
     back-classifier, not chosen by a coach. Shown, never scored — otherwise a
     regex fires a Level 1 compliance review on a named person.
   · one occurrence per session per cluster; a theme not raised for 45 days
     stops escalating. */
window.__COACH_TH={windowDays:90,repeatMin:2,persistentMin:4,penRepeat:2,penPersistent:5,penCap:5,staleDays:45,minConf:0.6};
window.__COACH_COMPLIANCE=["gap.compliance_required_wording","gap.customer_verification"];
window.__coachRow=function(id){
  var d=document.getElementById(id), x=document.getElementById(id+'_x');
  if(!d) return; var open=d.style.display!=='none';
  d.style.display=open?'none':'block'; if(x)x.textContent=open?'▸':'▾';
};
window.__coachLabel=function(k){
  var s=String(k||"").replace(/^[a-z]+\./,"").replace(/_/g," ");
  return s.replace(/\b[a-z]/g,function(c){return c.toUpperCase()});
};
/* Org-wide coaching, from the Hub, with the rules applied here rather than in
   the Worker — the thresholds live beside the rest of the framework so there is
   one place to change them. Same two rules as the drawer: only the gap family
   escalates, and inferred classifications are shown but never scored. */
window.__coachTierOf=function(themes){
  var TH=window.__COACH_TH, to=new Date();
  var stale=new Date(to.getTime()-TH.staleDays*86400000).toISOString().slice(0,10);
  var pen=0,tier="",worst=null;
  (themes||[]).forEach(function(t){
    if(t.family!=="gap"||t.scored<TH.repeatMin) return;
    if(t.last&&t.last<stale) return;
    var p=t.scored>=TH.persistentMin?TH.penPersistent:TH.penRepeat;
    if(p>pen){pen=Math.min(p,TH.penCap);worst=t;tier=t.scored>=TH.persistentMin?"Persistent":"Repeat"}
  });
  return{pen:pen,tier:tier,worst:worst};
};
window.__coachHubFill=function(){try{
  var el=document.getElementById("coachHub"); if(!el) return;
  var TH=window.__COACH_TH;
  var ctrl=new AbortController(), timer=setTimeout(function(){ctrl.abort()},8000);
  fetch("https://chatterbox-agentos-api.chatterbox-agentos.workers.dev/api/coaching/summary",
    {headers:{"Authorization":"Bearer "+(sessionStorage.getItem("cbx_token")||"")},signal:ctrl.signal})
  .then(function(r){return r.json()}).then(function(d){
    clearTimeout(timer);
    var e=document.getElementById("coachHub"); if(!e) return;
    if(!d||d.error){e.innerHTML='<div class="sub">Coaching Hub unavailable right now.</div>';return}
    var T=d.totals||{}, agents=d.agents||[];

    // per-agent standing, then the escalations the ladder actually calls for
    var repeat=[],persistent=[],r2b=[];
    agents.forEach(function(a){
      var s=window.__coachTierOf(a.themes); a._t=s;
      if(s.tier==="Persistent") persistent.push(a); else if(s.tier==="Repeat") repeat.push(a);
      if(s.worst&&window.__COACH_COMPLIANCE.indexOf(s.worst.key)>=0&&s.worst.scored>=TH.persistentMin) r2b.push(a);
    });
    // themes across the business
    var th={};
    agents.forEach(function(a){a.themes.forEach(function(t){
      if(t.family!=="gap")return;
      var x=th[t.key]||(th[t.key]={key:t.key,shown:0,scored:0,agents:0});
      x.shown+=t.shown; x.scored+=t.scored; x.agents++;
    })});
    var themes=Object.keys(th).map(function(k){return th[k]}).sort(function(a,b){return b.shown-a.shown}).slice(0,8);
    var maxShown=themes.length?themes[0].shown:1;

    var kpi=function(lab,val,sub){return '<div class="minikpi"><span class="lab">'+lab+'</span><div class="val num">'+val+'</div><div class="sub" style="font-size:11px">'+(sub||'')+'</div></div>'};
    var pctCoach=T.sessions?Math.round((T.scored/T.sessions)*100):0;

    var esc=r2b.length
      ? '<div style="margin-top:12px;padding:10px 12px;border:1px solid #f87171;border-radius:10px">'
        +'<div style="font-weight:700;color:#f87171">R2B · Repeat Compliance Coaching · Level 1</div>'
        +'<div class="sub" style="font-size:11.5px;margin:2px 0 6px">The same compliance theme coached '+TH.persistentMin+'+ times. Compliance review with QA within 48 hours.</div>'
        +r2b.map(function(a){return '<div style="font-size:12.5px"><a class="linky" onclick="openDrawer(\''+a.code+'\')">'+(a.name||a.code)+'</a> · '+window.__coachLabel(a._t.worst.key)+' ×'+a._t.worst.scored+'</div>'}).join('')
        +'</div>'
      : '<div class="sub" style="margin-top:12px;font-size:12px">No compliance theme has reached '+TH.persistentMin+' coach-chosen sessions, so R2B is not firing for anyone.</div>';

    var rows=themes.map(function(t){
      var comp=window.__COACH_COMPLIANCE.indexOf(t.key)>=0;
      var w=Math.max(3,Math.round(t.shown/maxShown*100));
      return '<div style="padding:7px 0;border-top:1px solid var(--line,rgba(255,255,255,.08))">'
        +'<div style="display:flex;gap:8px;align-items:baseline"><span style="flex:1;font-weight:600">'+window.__coachLabel(t.key)
        +(comp?' <span style="font-size:9px;font-weight:700;color:#f87171;border:1px solid #f87171;border-radius:5px;padding:1px 5px">COMPLIANCE</span>':'')+'</span>'
        +'<span class="num" style="font-weight:700">'+t.shown+'</span></div>'
        +'<div style="height:5px;border-radius:3px;background:var(--glass2,rgba(255,255,255,.06));margin-top:4px"><div style="height:5px;border-radius:3px;width:'+w+'%;background:'+(comp?'#f87171':'#60a5fa')+'"></div></div>'
        +'<div class="sub" style="font-size:11px;margin-top:3px">'+t.agents+' agent'+(t.agents===1?'':'s')+' · '+t.scored+' coach-chosen · '+(t.shown-t.scored)+' inferred</div>'
      +'</div>';
    }).join("");

    e.innerHTML=
      '<div class="cardhead"><div><h3>Coaching Hub</h3><div class="sub">last 90 days · '+(T.sessions||0)+' sessions · only development themes escalate</div></div></div>'
      +'<div class="grid kpis" style="margin-top:8px">'
        +kpi('SESSIONS',(T.sessions||0),(T.byType?((T.byType.qa||0)+' QA · '+(T.byType.formal||0)+' formal · '+(T.byType.informal||0)+' informal · '+(T.byType.lead||0)+' lead'):''))
        +kpi('AGENTS COACHED',agents.length,'of the roster, in the window')
        +kpi('COACH-CHOSEN',pctCoach+'%',(T.scored||0)+' of '+(T.sessions||0)+' · rest inferred, not scored')
        +kpi('ESCALATING',(repeat.length+persistent.length),persistent.length+' persistent · '+repeat.length+' repeat')
      +'</div>'
      +esc
      /* A HEADING OVER NOTHING IS WORSE THAN NO HEADING (2026-08-31). When no session in
         the window carries a gap-family theme, `rows` is an empty string and this printed
         "MOST COACHED DEVELOPMENT THEMES" above blank space — the reader is told a list
         exists and then shown nothing. Either the list renders, or the block says why it
         cannot: on this Hub every theme is inferred rather than coach-chosen, which is the
         actual reason a theme list can come back empty. */
      +(rows
        ? '<div style="margin-top:14px"><div class="sub" style="font-weight:700;letter-spacing:.4px">MOST COACHED DEVELOPMENT THEMES</div>'+rows+'</div>'
        : '<div class="sub" style="margin-top:14px;font-size:12px">No development theme has been recorded on a session in this window, so there is nothing to rank. A theme is only counted once someone picks one on the coaching form.</div>')
      +((T.unresolved||T.noTheme)?'<div class="sub" style="margin-top:10px;font-size:11.5px">'
        +(T.noTheme?'<b>'+T.noTheme+'</b> session'+(T.noTheme===1?'':'s')+' were filed with no development theme picked, so they count toward nothing. ':'')
        +(T.unresolved?T.unresolved+' could not be matched to a CB number, so they are attributed to nobody.':'')
        +'</div>':'');

    /* Fill each queue card with that agent's own development themes. The queue
       says who looks like they need coaching from the numbers; this says what
       they have actually been coached on, which is the thing a team leader needs
       before deciding what the next session is about. */
    var byCode={}; agents.forEach(function(a){byCode[a.code]=a});
    document.querySelectorAll('[id^="qct_"]').forEach(function(box){
      var code=box.id.slice(4), a=byCode[code];
      var gaps=a?a.themes.filter(function(t){return t.family==="gap"}).sort(function(x,y){return y.shown-x.shown}):[];
      if(!gaps.length){
        /* Three different situations, and they need different answers. Saying
           "nothing matched" when a session exists but carries no theme sent a
           team leader looking for a data problem instead of asking the coach to
           classify the session. */
        var msg;
        if(!a) msg='No coaching session in the Hub is matched to '+code+'. Either this agent has not been coached, or the session was filed without a CB number.';
        else if(a.noTheme>=a.sessions) msg='<b>'+a.sessions+' coaching session'+(a.sessions===1?'':'s')+' recorded, but no development theme was picked</b> on '+(a.sessions===1?'it':'them')+'. Nothing counts toward a theme until someone chooses one on the coaching form.';
        else msg=a.sessions+' coaching session'+(a.sessions===1?'':'s')+' recorded, but only purpose was captured — no development theme, so nothing escalates.';
        box.innerHTML='<h4>Development themes</h4><p class="sub">'+msg+'</p>'
          +(a?'<div class="ev">Evidence: <a class="linky" onclick="openDrawer(\''+code+'\')">open the agent to see the session'+(a.sessions===1?'':'s')+'</a></div>':'');
        return;
      }
      var s=window.__coachTierOf(a.themes);
      var named=gaps.slice(0,4).map(function(t){
        var comp=window.__COACH_COMPLIANCE.indexOf(t.key)>=0;
        var tier=t.scored>=TH.persistentMin?"Persistent":t.scored>=TH.repeatMin?"Repeat":t.scored?"first time":"not scored";
        return '<b>'+window.__coachLabel(t.key)+'</b> ×'+t.shown+(comp?' <span style="font-size:9px;font-weight:700;color:#f87171;border:1px solid #f87171;border-radius:5px;padding:0 4px">COMPLIANCE</span>':'')+' — '+tier;
      }).join('<br>');
      var totalShown=gaps.reduce(function(n,t){return n+t.shown},0);
      var totalScored=gaps.reduce(function(n,t){return n+t.scored},0);
      var means=s.pen
        ? 'The worst live theme is <b>'+window.__coachLabel(s.worst.key)+'</b> at '+s.worst.scored+' coached sessions, which is '+s.tier
          +' — that takes <b>−'+s.pen+'</b> off the composite and means the next session should be <b>'
          +(s.tier==="Persistent"?'Formal Coaching with a documented improvement plan':'Formal Coaching')+'</b>, not another conversation at the same level.'
        : totalScored
          ? 'Nothing has been raised twice by a coach inside '+TH.windowDays+' days, so every theme is still first-time and nothing is coming off the composite. A second session on the same theme makes it a Repeat.'
          : 'None of these were chosen by a coach — they were read from the notes of older sessions, so they are shown for context but never scored. Picking the theme on the coaching form is what starts the count.';
      box.innerHTML='<h4>Development themes <span class="pill pmuted">Coaching Hub</span></h4>'
        +'<p><b>Raised:</b><br>'+named+(gaps.length>4?'<br><span class="sub">+'+(gaps.length-4)+' more</span>':'')+'</p>'
        +'<p><b>What this means:</b> '+means+'</p>'
        +'<div class="ev">Evidence: '+totalShown+' session'+(totalShown===1?'':'s')+' in the last '+TH.windowDays+' days · '+totalScored+' chosen by a coach · '
        +'<a class="linky" onclick="openDrawer(\''+code+'\')">open the agent to see each one</a></div>';
    });
  })
  .catch(function(){clearTimeout(timer);var e=document.getElementById("coachHub");if(e)e.innerHTML='<div class="sub">Coaching Hub unavailable right now.</div>';});
}catch(e){}};

window.__vasCoachHist=function(code){try{

    {headers:{"Authorization":"Bearer "+(sessionStorage.getItem("cbx_token")||"")},signal:ctrl.signal})
  .then(function(r){return r.json()})
  .then(function(d){
    clearTimeout(timer);
    if(drawerCode!==__histFor) return;                       // a different agent is open now
    var e2=document.getElementById("vasCoachHist"); if(!e2) return;
    if(!d||d.error){e2.innerHTML='<div class="sub">Coaching is unavailable right now. Everything else on this card is unaffected.</div>';return}
    var sessions=d.sessions||[];
    if(!sessions.length){e2.innerHTML='<div class="sub">No coaching sessions recorded for this agent in the last '+TH.windowDays+' days.</div>';return}
    var to=new Date(), from=new Date(to.getTime()-TH.windowDays*86400000);
    var iso=function(x){return x.toISOString().slice(0,10)};
    var themes={};
    sessions.forEach(function(s){
      if(!s.date||s.date<iso(from)) return;
      var scored=s.clusterSource!=="inferred"&&(s.clusterConfidence==null||s.clusterConfidence>=TH.minConf);
      var seen={};
      (s.clusters||[]).forEach(function(c){
        if(seen[c.clusterKey]) return; seen[c.clusterKey]=1;
        var t=themes[c.clusterKey]||(themes[c.clusterKey]={key:c.clusterKey,family:c.family,scored:0,shown:0,last:"",sessions:[]});
        t.shown++; if(scored)t.scored++; if(s.date>t.last)t.last=s.date;
        // keep the sessions behind the count so tapping a theme can show them
        t.sessions.push({date:s.date,type:s.type,scored:scored,conf:s.clusterConfidence});
      });
    });
    var list=Object.keys(themes).map(function(k){return themes[k]}).sort(function(a,b){return b.scored-a.scored||b.shown-a.shown});
    var staleBefore=iso(new Date(to.getTime()-TH.staleDays*86400000));
    var pen=0,tier="",worst=null;
    list.forEach(function(t){
      if(t.family!=="gap"||t.scored<TH.repeatMin) return;
      if(t.last&&t.last<staleBefore) return;
      var p=t.scored>=TH.persistentMin?TH.penPersistent:TH.penRepeat;
      if(p>pen){pen=Math.min(p,TH.penCap);worst=t;tier=t.scored>=TH.persistentMin?"Persistent":"Repeat"}
    });
    /* One row per theme rather than a five-column table — the drawer is far too
       narrow for that, and it wrapped "not scored" and every date onto two lines. */
    var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var shortDate=function(d){
      if(!d) return "—";
      var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d); if(!m) return d;
      // every date here is inside the 90-day window, so the year is noise
      return (+m[3])+" "+MON[(+m[2])-1];
    };
    var PILL={Persistent:"#f87171",Repeat:"#fbbf24","First time":"#34d399"};
    var rows=list.map(function(t){
      var tiered=t.family==="gap", inf=t.shown-t.scored;
      var tl=!tiered?"does not escalate":t.scored>=TH.persistentMin?"Persistent":t.scored>=TH.repeatMin?"Repeat":t.scored?"First time":"not scored";
      var col=PILL[tl]||"var(--ink3,#94a3b8)";
      var comp=window.__COACH_COMPLIANCE.indexOf(t.key)>=0;
      // the label on the right already says the outcome — don't repeat it here
      var why=!tiered?"purpose"
             :inf===t.shown?"inferred from notes"
             :inf?(t.scored+" chosen · "+inf+" inferred")
             :"chosen by the coach";
      /* Tapping a theme shows the sessions behind the count and what the rules
         do with them — the number alone does not tell a team leader whether to
         escalate, or why a theme with four sessions is not being scored. */
      var det=t.sessions.slice().sort(function(x,y){return x.date<y.date?1:-1}).map(function(s){
        return '<div style="display:flex;gap:8px;font-size:11.5px;padding:3px 0">'
          +'<span style="width:58px;flex:none;color:var(--ink3,#94a3b8)">'+shortDate(s.date)+'</span>'
          +'<span style="flex:1;text-transform:capitalize">'+s.type+'</span>'
          +'<span style="flex:none;color:'+(s.scored?"#34d399":"var(--ink3,#94a3b8)")+'">'
            +(s.scored?'counted':'inferred'+(s.conf!=null?' ('+Math.round(s.conf*100)+'%)':''))+'</span>'
        +'</div>';
      }).join("");
      var rule=!tiered
        ? 'Purpose says why the session was held. Only development themes escalate, so this never moves the score.'
        : 'Counted once per session. '+TH.repeatMin+' makes it a Repeat (−'+TH.penRepeat+'), '+TH.persistentMin+' makes it Persistent (−'+TH.penPersistent+')'
          +(comp?'. On a compliance theme, '+TH.persistentMin+' also fires R2B — a Level 1 compliance review within 48 hours':'')
          +'. Currently '+t.scored+' counted of '+t.shown+'.'
          +(t.scored<t.shown?' Inferred classifications were read from the notes, not chosen by a coach, so they never score.':'')
          +(t.scored>=TH.repeatMin?' Next session should be '+(t.scored>=TH.persistentMin?'Formal Coaching with a documented improvement plan':'Formal Coaching')+'.':'');
      var id='ct_'+t.key.replace(/[^a-z0-9]/gi,'_');
      return '<div style="border-top:1px solid var(--line,rgba(255,255,255,.08))">'
        +'<div onclick="window.__coachRow(\''+id+'\')" style="display:flex;align-items:baseline;gap:8px;padding:9px 0;cursor:pointer">'
          +'<div style="flex:1;min-width:0">'
            +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
              +'<span style="font-weight:600;color:var(--ink,#e2e8f0)">'+window.__coachLabel(t.key)+'</span>'
              +(comp?'<span style="font-size:9px;font-weight:700;letter-spacing:.5px;color:#f87171;border:1px solid #f87171;border-radius:5px;padding:1px 5px;white-space:nowrap">COMPLIANCE</span>':'')
            +'</div>'
            +'<div style="font-size:11.5px;color:var(--ink3,#94a3b8);margin-top:2px">'
              +t.shown+(t.shown===1?" session":" sessions")+' · '+why+' · last raised '+shortDate(t.last)
            +'</div>'
          +'</div>'
          +'<span style="flex:none;white-space:nowrap;font-size:11px;font-weight:700;color:'+col+'">'+tl+'</span>'
          +'<span id="'+id+'_x" style="flex:none;color:var(--ink3,#94a3b8);font-size:11px">▸</span>'
        +'</div>'
        +'<div id="'+id+'" style="display:none;padding:2px 0 10px 0">'
          +'<div class="sub" style="font-size:11px;font-weight:700;letter-spacing:.4px;margin-bottom:2px">SESSIONS</div>'+det
          +'<div class="sub" style="font-size:11.5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line,rgba(255,255,255,.08))">'+rule+'</div>'
        +'</div>'
      +'</div>';
    }).join("");
    var note=pen
      ? "<b>−"+pen+"</b> applied to the composite · worst live theme "+window.__coachLabel(worst.key)+" ("+tier+") · next session should be <b>"
        +(tier==="Persistent"?"Formal Coaching with a documented improvement plan":"Formal Coaching")+"</b>"
      : "No composite adjustment — no development theme has reached Repeat on a classification a coach chose.";
    e2.innerHTML=rows
      +'<div style="font-size:11.5px;color:var(--ink3,#94a3b8);margin-top:10px;padding-top:9px;border-top:1px solid var(--line,rgba(255,255,255,.08))">'+note+'</div>';
  })
  .catch(function(){clearTimeout(timer);var e2=document.getElementById("vasCoachHist");if(e2)e2.innerHTML='<div class="sub">Coaching is unavailable right now. Everything else on this card is unaffected.</div>';});
}catch(e){}};

  // timeline: evals + milestones

  const best=(M.byAgentDay[code]||[]).slice().sort((x,y)=>y.sales-x.sales)[0];

  for(const w of M.weeks){ const ww=(M.wtdCC[w.num]||{}); const wg=(ww[camp]||{})[code];

  if(M.term[code]) events.push({d:M.term[code],tone:'crit',t:'Marked terminated/resigned',p:'From the attendance register'});
  events.sort((x,y)=>y.d.localeCompare(x.d));
  const scoreColor=(sc==null)?'var(--muted)':(sc>=0.75?'var(--good)':(sc>=0.5?'var(--amber)':'var(--crit)'));
  return `
  <button class="btn ghost" onclick="closeDrawer()" aria-label="Back" style="position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:6px;z-index:3"><span style="font-size:16px">←</span> Back</button>

    ${avatarOf(a.name,code,'lg')}

/* ================= exports ================= */
function exportCSV(filename, cols, rows){
  const clean=v=>{ const s=String(v??'').replace(/<[^>]*>/g,''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const lines=[cols.map(c=>clean(c.h)).join(',')];
  for(const r of rows) lines.push(cols.map(c=>clean(c.csv?c.csv(r):c.f(r))).join(','));
  downloadText(filename, lines.join('\n'));
}
function downloadText(filename, text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));
  a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}
/* ================= MTD TRACKER GENERATOR =================
   Rebuilds the "VAS - <Month> MTD Tracker" workbook: Pivot Table, the daily sheet, WTD and
   MTD per campaign, Team Split and TL MTD. Same sheets, same columns, same order as the
   workbook this replaces, computed from the uploaded files instead of by hand.
   Everything is written as real numbers with Excel number formats (talk time as a duration,
   percentages as percentages) so the sheets stay sortable and chartable.
   NOTE ON TL MTD: in the hand-built workbook that sheet sat on a different basis to the MTD
   sheets beside it (head count x planned dialing days, rather than the shifts actually
   worked), so the two never reconciled. Here it is computed from the SAME actuals as every
   other sheet - one basis for the whole workbook. */
const XF={pct:'0.0%',dur:'[h]:mm:ss',money:'#,##0',num:'0.00',min:'0.0'};
function xlSheet(aoa,fmt){
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  if(fmt) for(const key in fmt){
    const col=Number(key);
    for(let r=0;r<aoa.length;r++){
      const ref=XLSX.utils.encode_cell({r,c:col}), cell=ws[ref];
      if(cell&&typeof cell.v==='number') cell.z=fmt[key];
    }
  }
  return ws;
}
const dur=s=>(s||0)/86400;                       // seconds -> Excel time fraction
const mins=s=>Math.round((s||0)/60*10)/10;        // seconds -> minutes, one decimal (average talk per shift, Nick 2026-09-08)
const pctOf=(n,d)=>d?n/d:0;
const ddmm=d=>{const p=String(d).split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:String(d)};

function trackerAgentCols(mtd){
  // the workbook's per-agent block; MTD carries the two cancellation columns, WTD does not
  const c=[['Team Leader',r=>r.tl],['Tenure',r=>r.tenure],['Agent',r=>r.agent],
    ['Employed Shifts ',r=>r.emp],['Actual Shifts ',r=>r.act],['Att % ',r=>pctOf(r.act,r.emp)],
    ['Sales Target ',r=>r.target],['Sales Achieved ',r=>r.sales],[' % of Sales Target ',r=>pctOf(r.sales,r.target)],
    ['SPD',r=>r.act?r.sales/r.act:0]];
  if(mtd)c.push(['Cancellations',r=>r.canc||0],['% of Cancellations',r=>pctOf(r.canc||0,r.sales)]);
  /* EMPLOYED shifts, exactly as the screen and the TL MTD sheet use (audit round 7,
     2026-08-28). This divided by ACTUAL, so every agent with any absence disagreed with the
     screen — in the same direction, by exactly the attendance ratio — inside the very
     workbook whose TL sheet carries a comment explaining why employed is the denominator.
     A null stays null: the screen shows '–' where the dialler never covered the agent, and
     the export must not invent 0:00:00. */
  c.push(['Ave Talk Time (min)',r=>r.aveTalk==null?'':mins(r.aveTalk)],
    ['GWP Target ',r=>r.gwpT],['GWP Achieved ',r=>r.gwp],['% To GWP Target',r=>pctOf(r.gwp,r.gwpT)],
    ['Ave GWP ',r=>r.sales?r.gwp/r.sales:0],['Referrals ',r=>r.ref||0],
    ['% Of Referrals To Sales Achieved ',r=>pctOf(r.ref||0,r.sales)],
    ['QA',r=>r.qa&&r.qa.n?r.qa.avg:'No QA %']);
  return c;
}
function trackerAgentSheet(title,rows,mtd){
  const cols=trackerAgentCols(mtd);

  if(rows.length){ const t=totalRow(rows,'Grand Total'); t.tenure='';t.agent='';
    aoa.push(cols.map(c=>c[1](t))); }

    if(/Ave Talk Time/.test(c[0]))fmt[i]=XF.min;

const TL_METRICS=[
  ['Dialing Days',o=>o.days??''],['Employed HC',o=>o.hc??''],
  ['Total Employed Shifts',o=>o.emp],['Total Actual Shifts',o=>o.act],
  ['% Of Attendance',o=>pctOf(o.act,o.emp)],
  ['Sales Target',o=>o.target],['Sales Achieved',o=>o.sales],
  ['% To Sales Target',o=>pctOf(o.sales,o.target)],['SPD',o=>o.act?o.sales/o.act:0],
  ['Cancellations',o=>o.canc||0],['% of Cancellations to Sales',o=>pctOf(o.canc||0,o.sales)],
  ['GWP Target',o=>o.gwpT],['GWP Achieved',o=>o.gwp],['% To GWP Target',o=>pctOf(o.gwp,o.gwpT)],
  /* Ave Talk Time divides by EMPLOYED shifts here too. It used to divide by actual, which put
     the TL rollup at odds with the agent rows in the very same workbook — spec §9 reads it as
     an AVERAGE over the daily fact rows, and every fact row carries exactly 1 employed shift,
     so employed is the denominator. Talk / Day Worked keeps the actual-shift view beside it. */
  ['Ave GWP',o=>o.sales?o.gwp/o.sales:0],
  ['Ave Talk Time (min)',o=>mins(o.emp?o.talk/o.emp:0)],
  ['Talk / Day Worked (min)',o=>mins(o.act?o.talk/o.act:0)],
  ['Referrals',o=>o.ref||0],['Referrals %',o=>pctOf(o.ref||0,o.sales)],
  ['Number Of Agents on Target',o=>o.onT??''],['% Of Agents on Target',o=>pctOf(o.onT||0,o.hc||0)],

function exportTracker(){
  if(!M||!M.dates.length){ toast('Nothing to build yet - upload the day\'s files first'); return; }
  if(typeof XLSX==='undefined'||!XLSX.writeFile){ toast('Spreadsheet library not loaded - refresh and retry'); return; }
  const wb=XLSX.utils.book_new();
  const monthName=new Date(M.dates[0]+'T00:00:00Z').toLocaleString('en',{month:'long',timeZone:'UTC'});
  /* Nesting gets its own block and its own MTD sheet (spec §7). In the reference period
     it was filtered out of both workbook pivots, dropping 3 agents and 17 sales from every
     report with nothing to say they were missing. VT is excluded here by design — tracker
     units carry no GWP and never belong in the VAS money totals. */
  const camps=CAMPS.filter(c=>c!=='VT');

  /* ---- Pivot Table: the source block the workbook's pivots read from, plus the two
     side blocks it carries (cancellations by agent, and QA by agent). */
  const piv=[['Week',M.weeks.length?'Week '+M.weeks[M.weeks.length-1].num:''],['Campaign',camps.join(' + ')],[],
    ['Team Leader','Tenure','Agent','Sum of Employed Shifts','Sum of Actual Shifts','Sum of Sales Target',
     'Sum of Sales Achieved','Average of Talk Time (min)','Sum of GWP Target','Sum of GWP Achieved','Sum of Referrals',
     '','','Row Labels','Count of Contract Deactivate Date','','Agent','Comment','Issued Date','','','Row Labels','Average of Score %']];
  const allRows=camps.flatMap(c=>agentRows(c,null));
  allRows.sort((a,b)=>String(a.agent).localeCompare(String(b.agent)));
  allRows.forEach(r=>piv.push([r.tl,r.tenure,r.agent,r.emp,r.act,r.target,r.sales,
    /* employed shifts, not actual (2026-09-08): the MTD sheets and the screen already divided by
       employed (spec §6.4) while this pivot divided by actual — one figure, two answers */
    mins(r.emp?r.talk/r.emp:0),r.gwpT,r.gwp,r.ref||0,'','',r.agent,r.canc||0,'','','','','',
    r.agent,(r.qa&&r.qa.n)?r.qa.avg:'']));
  XLSX.utils.book_append_sheet(wb,xlSheet(piv,{7:XF.min,8:XF.money,9:XF.money,21:XF.pct}),'Pivot Table');

  /* ---- the daily sheet, one row per agent per dialing day (the workbook's month tab).
     Range-aggregate dialler rows are excluded here by design: a multi-day ViciDial export
     is one total per agent and cannot be attributed to a single day without inventing it.
     They still count in every period total below. */
  const dCols=[['Week',r=>'Week '+r.week],['Date',r=>ddmm(r.date)],['Team Leader',r=>r.tl],['Campaign',r=>r.campaign],
    ['Agent',r=>r.agent],['Emp Code',r=>r.code],['Tenure',r=>r.tenure],['Employed Shifts',r=>r.emp],
    ['Actual Shifts',r=>r.act],['Att %',r=>pctOf(r.act,r.emp)],['Sales Target',r=>r.target],
    ['Sales Achieved',r=>r.sales],['% of Sales Target',r=>pctOf(r.sales,r.target)],['Talk Time',r=>dur(r.talk)],
    ['GWP Target',r=>r.gwpT],['GWP Achieved',r=>r.gwp],['% of GWP Target',r=>pctOf(r.gwp,r.gwpT)],
    ['Ave GWP',r=>r.sales?r.gwp/r.sales:0],['Referrals',r=>r.ref||0],
    ['% Of Referrals To Sales Achieved',r=>pctOf(r.ref||0,r.sales)]];
  const daily=[dCols.map(c=>c[0])];
  M.facts.filter(f=>!f.rangeAgg).forEach(f=>daily.push(dCols.map(c=>c[1](f))));
  XLSX.utils.book_append_sheet(wb,xlSheet(daily,{9:XF.pct,12:XF.pct,13:XF.dur,14:XF.money,15:XF.money,16:XF.pct,17:XF.money,19:XF.pct}),monthName.slice(0,31));

  /* ---- WTD (latest week) and MTD, one sheet per campaign, as in the workbook */
  const wk=M.weeks.length?M.weeks[M.weeks.length-1].num:null;
  for(const camp of camps){
    const rows=wk?agentRows(camp,wk):[];
    XLSX.utils.book_append_sheet(wb,trackerAgentSheet(`${camp} Team${camp==='Courtesy'?'s':''} - Week ${wk||''}`,rows,false),('WTD - '+camp).slice(0,31));
  }
  for(const camp of camps)
    XLSX.utils.book_append_sheet(wb,trackerAgentSheet(camp,agentRows(camp,null),true),('MTD - '+camp).slice(0,31));

  /* ---- Team Split: the roster the whole workbook joins onto */
  const ts=[['Employee Code','Sales Force','Start Date','Team Leader','Agent Name','Campaign','Tenure','Call x','Sales Force','Target','Employee Code']];
  S.roster.slice().sort((a,b)=>String(a.tl).localeCompare(String(b.tl))||String(a.name).localeCompare(String(b.name)))
    .forEach(a=>ts.push([a.code,a.sf||'',a.start||'',a.tl||'',a.name||'',a.campaign||'',a.tenure||'',a.callx||'',a.sf||'',a.target||0,a.code]));
  XLSX.utils.book_append_sheet(wb,xlSheet(ts,{}),'Team Split');

  /* ---- TL MTD: a block per campaign, one column per team leader + campaign totals */
  const tl=[];
  for(const camp of camps){
    const keys=Object.keys(M.tlAgg).filter(k=>k.split('|')[0]===camp).sort();
    if(!keys.length) continue;
    /* THE SCREEN'S FIGURE, WHICH IS THE RULE BOOK'S (audit, 2026-08-28). This recomputed
       dialling days per campaign from any activity, so the workbook disagreed with the TL
       MTD table it mirrors — and it counted days the attendance register does not cover,
       which non-negotiable 12 explicitly excludes. One definition, one number. */
    const dialDays=M.diallingDays;
    const cols=keys.map(k=>({...M.tlAgg[k],days:dialDays}));
    const tot={...M.campAgg[camp],days:dialDays};
    tl.push([camp]);
    tl.push(['Team Leaders',...keys.map(k=>k.split('|')[1]),'Campaign Totals']);
    for(const [lab,fn] of TL_METRICS) tl.push([lab,...cols.map(fn),fn(tot)]);
    tl.push([]);
  }

  const tlWs=xlSheet(tl,{});
  // per-row formats: percentages, the duration row and the money rows
  tl.forEach((row,r)=>{
    const lab=String(row[0]||'');
    let z=null;
    if(/^%|%$|% Of|% To|% of/.test(lab)) z=XF.pct;
    else if(/Ave Talk Time|Talk \/ Day Worked/.test(lab)) z=XF.min;
    else if(/GWP Target|GWP Achieved|Ave GWP/.test(lab)) z=XF.money;
    else if(/SPD/.test(lab)) z=XF.num;
    if(!z) return;
    for(let c=1;c<row.length;c++){ const cell=tlWs[XLSX.utils.encode_cell({r,c})]; if(cell&&typeof cell.v==='number') cell.z=z; }
  });
  XLSX.utils.book_append_sheet(wb,tlWs,'TL MTD');

  XLSX.writeFile(wb,`VAS - ${monthName} ${M.dates[0].slice(0,4)} MTD Tracker ${ddmm(M.dates[0]).slice(0,5)} - ${ddmm(M.dates[M.dates.length-1]).slice(0,5)}.xlsx`);
  toast('MTD tracker generated - '+M.dates.length+' dialing day(s), '+allRows.length+' agents');
}

function exportReport(){
  if(!M){ toast('Nothing to export'); return; }
  if(typeof XLSX==='undefined'||!XLSX.writeFile){ toast('Spreadsheet library not loaded — refresh and retry'); return; }
  const wb=XLSX.utils.book_new();
  const clean=v=>typeof v==='number'?v:String(v??'').replace(/<[^>]*>/g,'');
  const used={};
  const sheet=(name,cols,rows)=>{
    const aoa=[cols.map(c=>c.h)]; rows.forEach(r=>aoa.push(cols.map(c=>clean(c.csv?c.csv(r):c.f(r)))));
    let nm=name.replace(/[:\\/?*\[\]]/g,'-').slice(0,31),i=1; while(used[nm]) nm=(name.slice(0,27)+' ~'+(i++)).slice(0,31); used[nm]=1;
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),nm);
  };
  const dCols=[{h:'Week',f:r=>'Week '+r.week},{h:'Date',f:r=>r.date},{h:'Team Leader',f:r=>r.tl},{h:'Campaign',f:r=>r.campaign},
    {h:'Agent',f:r=>r.agent},{h:'Emp Code',f:r=>r.code},{h:'Tenure',f:r=>r.tenure},{h:'Employed Shifts',f:r=>r.emp},
    {h:'Actual Shifts',f:r=>r.act},{h:'Sales Target',f:r=>r.target},{h:'Sales Achieved',f:r=>r.sales},
    {h:'Talk Time',f:r=>fmtDur(r.talk)},{h:'GWP Target',f:r=>r.gwpT},{h:'GWP Achieved',f:r=>r.gwp},
    {h:'Referrals',f:r=>r.ref||0}];
  // Export honours the on-screen filters: campaign (S.ui.camp) and team leader (S.ui.team) —
  // the same gFilter every view uses, so you extract exactly what you're looking at.
  const teamOK=r=>!S.ui.team||r.tl===S.ui.team;
  /* EVERY TAB EXPORTS THE TABLE IT SHOWS, not the rows underneath it. Each page publishes its
     own column definition to window.__exp when it renders — the same list the screen is drawn
     from — so calling the page here yields exactly what the user is looking at, filters and
     all. Falls back to the raw fact columns only if a page cannot build (a missing source),
     because a workbook with a sheet missing is worse than one with a plainer sheet. */
  { const keep=window.__exp;
    const TAB_SHEETS=[[PAGES.daily,'Daily Reports',dCols,M.facts.filter(gFilter)],
                      [PAGES.agents,'Agent Performance',null,null],
                      [PAGES.attend,'Workforce',null,null]];
    for(const [fn,label,fbCols,fbRows] of TAB_SHEETS){
      let done=false;
      try{ window.__exp=null; fn(); const x=window.__exp;
        if(x&&x.cols&&x.rows&&x.rows.length){ sheet(label,x.cols,x.rows); done=true; }
      }catch(err){ /* one page failing must not take the whole workbook down */ }
      if(!done&&fbCols&&fbRows&&fbRows.length) sheet(label,fbCols,fbRows);
    }
    window.__exp=keep; }
  const camps=S.ui.camp?[S.ui.camp]:CAMPS.filter(c=>c!=='VT');
  for(const camp of camps){
    for(const w of M.weeks){
      const rows=agentRows(camp,w.num).filter(teamOK); if(!rows.length) continue;
      sheet(`WTD - ${camp} - Week ${w.num}`,aggCols({}),[...rows,totalRow(rows,'Grand Total')]);
    }
    const rows=agentRows(camp,null).filter(teamOK);
    if(rows.length) sheet('MTD - '+camp,aggCols({canc:true,noOpt:true}),[...rows,totalRow(rows,'Grand Total')]);   // MTD drops opt-ins on screen — the export matches
  }
  const tlKeys=Object.keys(M.tlAgg).filter(k=>{const p=k.split('|');return (!S.ui.camp||p[0]===S.ui.camp)&&(!S.ui.team||p[1]===S.ui.team)});
  const metricList=[['Employed HC','hc'],['Total Employed Shifts','emp'],['Total Actual Shifts','act'],['% Of Attendance','att'],
    ['Sales Target','target'],['Sales Achieved','sales'],['% To Sales Target','pctT'],['SPD','spd'],['Cancellations','canc'],
    ['GWP Target','gwpT'],['GWP Achieved','gwp'],['% To GWP Target','pctG'],['Ave GWP','aveG'],
    ['Referrals','ref'],['Agents on Target','onT']];
  const tlAoa=[['Metric',...tlKeys.map(k=>k.replace('|',' — '))]];
  for(const [lab,key] of metricList)
    tlAoa.push([lab,...tlKeys.map(k=>{ const v=M.tlAgg[k][key]; return v==null?'':(typeof v==='number'?(key.startsWith('pct')||key==='att'?(v*100).toFixed(1)+'%':Math.round(v*100)/100):v); })]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tlAoa),'TL MTD');
  /* LEAD MANAGEMENT goes in as its OWN sheet, built from the same column definitions the
     page renders from — so the workbook carries the table as it appears on screen rather
     than the raw case rows underneath it. Rendering the page populates window.__exp; this
     calls the page function directly so the sheet is present whichever tab the export is
     fired from. Skipped cleanly when neither of its case books is loaded. */
  if(((S.opencasesLM&&S.opencasesLM.rows.length)||S.closedcases)&&S.roster.length){
    const keep=window.__exp;
    try{ PAGES.leads(); const e=window.__exp;
      if(e&&e.cols&&e.rows) sheet('Lead Management',e.cols,e.rows);
    }catch(err){ /* a page that cannot build must not take the whole workbook down */ }
    window.__exp=keep;
  }
  const tag=(S.ui.camp||'All')+(S.ui.team?'_'+S.ui.team.replace(/[^A-Za-z0-9]+/g,''):'');
  XLSX.writeFile(wb,`VAS_${tag}_${S.ui.month}_${S.ui.mode}.xlsx`);
  toast('Workbook exported (.xlsx)');
}

/* ================= boot ================= */
/* Read an upload as TEXT the rest of the pipeline understands.
   .csv/.txt pass straight through. .xlsx (ZIP magic PK) and legacy .xls (CFB magic D0CF)
   are rendered by SheetJS into VAS's OWN multi-sheet format — "### Sheet: Name ###" +
   CSV — so splitSheets/toObjects/INGEST all work unchanged, every sheet included.
   cellDates + dateNF force ISO yyyy-mm-dd: Excel hands back serials or locale strings
   ("7/13/26"), and INGEST.bi requires /^\d{4}-\d{2}-\d{2}$/ or it silently drops the row. */
async function fileToText(f){ return bufferToText(f.name, await f.arrayBuffer()); }
/* PURE spreadsheet → "### Sheet:" text conversion. SELF-CONTAINED on purpose: it is
   serialised with .toString() and shipped into a Web Worker so the multi-second
   XLSX parse of a 50 MB export runs OFF the main thread (the UI used to freeze
   solid for the duration — that was the upload "lag"). No globals, no toast, no
   template literals in here. `data` is an ArrayBuffer (xlsx/xls) or a string
   (Salesforce HTML-.xls). */
function __sheetCore(XLSX, data){
  const wb=(typeof data==='string')?XLSX.read(data,{type:'string'}):XLSX.read(data,{type:'array',cellNF:true});
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn]; if(!ws) continue;
    // Columns whose header names a date, by column index. Some Power BI/SF exports stamp
    // date serials with a junk custom format ('"TRUE";"TRUE";"FALSE"') that SSF.is_date
    // cannot recognise — every date then renders as literal "TRUE" and each row dies on
    // the downstream date guards. For numeric cells in a date-NAMED column whose format
    // is not a date format, convert plausible date serials (1995–2064) directly.
    const dateCols=new Set();
    try{
      const R=XLSX.utils.decode_range(ws['!ref']||'A1');
      // header rows only (first two), and 'date' as a whole word — a DATA cell like
      // "Updated" or "Candidate" deeper in the sheet must never mark a numeric column
      for(let r=R.s.r;r<=Math.min(R.e.r,R.s.r+1);r++)
        for(let cc=R.s.c;cc<=R.e.c;cc++){
          const h=ws[XLSX.utils.encode_cell({r,c:cc})];
          if(h&&h.t==='s'&&/(^|[^a-z])date([^a-z]|$)/i.test(h.v)) dateCols.add(cc);
        }
    }catch(e){}
    for(const a in ws){
      if(a[0]==='!') continue;
      const c=ws[a]; if(!c) continue;
      // Rewrite EVERY date cell to a literal yyyy-mm-dd string. Excel stores dates as
      // serials rendered through a locale format — sheet_to_csv would emit "7/13/26",
      // and every guard downstream (INGEST.bi's /^\d{4}-\d{2}-\d{2}$/, parseDateLoose)
      // wants ISO, so the whole file would parse and then drop every row. SSF.format on
      // the raw serial is timezone-safe; the t==='d' arm covers workbooks already
      // carrying real Date cells. TIME-ONLY cells (Duration hh:mm:ss — no y/d in the
      // format) must NOT become dates: durSecs needs the h:m:s string, so render those
      // as hh:mm:ss or talk time reads zero.
      if(c.t==='n'&&c.z&&XLSX.SSF&&XLSX.SSF.is_date(c.z)){
        const z=String(c.z);
        // time-only (no y/d in the format, incl. 'mm:ss'): render elapsed-style so a
        // 30-hour duration stays 30:00:00 instead of wrapping mod 24, and never
        // becomes a date (that zeroed talk time)
        c.v=(/[hHsS]/.test(z)&&!/[yYdD]/.test(z))?XLSX.SSF.format('[h]:mm:ss',c.v):XLSX.SSF.format('yyyy-mm-dd',c.v);
        c.t='s'; delete c.w; delete c.z;
      }else if(c.t==='n'&&c.v>34700&&c.v<60000&&dateCols.has(XLSX.utils.decode_cell(a).c)){
        // date serial hidden behind a non-date format in a date-named column (see above)
        c.v=XLSX.SSF.format('yyyy-mm-dd',c.v); c.t='s'; delete c.w; delete c.z;
      }else if(c.t==='d'&&c.v instanceof Date){
        const d=c.v;
        c.v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        c.t='s'; delete c.w; delete c.z;
      }
    }
  }
  return wb.SheetNames.map(sn=>'### Sheet: '+sn+' ###\n'+XLSX.utils.sheet_to_csv(wb.Sheets[sn],{blankrows:false})).join('\n');
}
/* Background parser: a Blob Worker built from __sheetCore's own source, loading the
   self-hosted SheetJS via importScripts. Falls back to the synchronous in-page parse
   when workers are unavailable (file://, CSP without worker-src, old browser). */
let __shWorkerP=null, __shJobs={}, __shSeq=0;
function __sheetWorkerP(){
  if(__shWorkerP) return __shWorkerP;
  __shWorkerP=(async()=>{
    try{
      // inline the self-hosted SheetJS into the worker blob — no importScripts, so no
      // MIME/CSP surprises; the ~1 MB source is fetched once and reused for every file
      const r=await fetch(new URL('/xlsx.full.min.js',location.href));
      if(!r.ok) return null;
      const lib=await r.text();
      const src=lib+'\n;var __core=('+__sheetCore.toString()+');'+
        'self.onmessage=function(e){var d=e.data;try{var t=__core(self.XLSX||XLSX,d.data);'+
        'self.postMessage({id:d.id,text:t});}catch(err){self.postMessage({id:d.id,error:String(err&&err.message||err)});}};';
      const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
      w.onmessage=e=>{ const j=__shJobs[e.data.id]; if(!j) return; delete __shJobs[e.data.id];
        e.data.error?j.reject(new Error(e.data.error)):j.resolve(e.data.text); };
      w.onerror=()=>{ for(const k in __shJobs){ __shJobs[k].reject(new Error('worker failed')); delete __shJobs[k]; } };
      return w;
    }catch(e){ return null; }   // no worker support — callers use the in-page parse
  })();
  return __shWorkerP;
}
async function __convertOffThread(data){
  const w=await __sheetWorkerP(); if(!w) return null;
  const id=++__shSeq;
  return new Promise((resolve,reject)=>{ __shJobs[id]={resolve,reject};
    try{ w.postMessage({id, data}); }
    catch(e){ delete __shJobs[id]; reject(e); } });
}
async function bufferToText(name, buf){
  const b=new Uint8Array(buf.slice(0,8));
  const isZip=b[0]===0x50&&b[1]===0x4B, isCFB=b[0]===0xD0&&b[1]===0xCF;
  let data=buf;
  if(!isZip&&!isCFB){
    const text=new TextDecoder('utf-8').decode(buf).replace(/^﻿/,'');
    // Salesforce exports "Open Cases.xls" that is really an HTML <table> — SheetJS
    // parses HTML strings, so route it there instead of feeding tags to parseCSV.
    const head=text.slice(0,512).trimStart().toLowerCase();
    if(!(head.startsWith('<')&&/<(!doctype|html|head|meta|table)/.test(head))) return text;
    data=text;
  }
  // heavy parse off the main thread when possible — the page keeps painting
  try{ const t=await __convertOffThread(data); if(t!=null) return t; }catch(e){ /* fall through to the in-page parse */ }
  if(typeof XLSX==='undefined'){ toast('Cannot read '+name+' — the spreadsheet reader did not load. Refresh, or export as CSV.'); return null; }
  // cellNF (set inside __sheetCore) keeps each cell's number format on `c.z`; without it
  // SheetJS renders dates into `c.w` ("7/13/26") and the ISO rewrite could never fire.
  return __sheetCore(XLSX, data);
}
/* Fingerprint the file's BYTES — identical content is recognised no matter what the
   file is called ("call_records (2).xlsx" re-downloaded = same hash), so the daily
   re-upload of an unchanged export is skipped instead of re-ingested/duplicated. */
async function hashBuf(buf){
  try{
    const h=await crypto.subtle.digest('SHA-256',buf);
    return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){ // non-secure context fallback: dual DJB2/FNV-style rolling hash + length
    const u=new Uint8Array(buf); let h1=5381,h2=52711;
    for(let i=0;i<u.length;i++){ h1=((h1*33)^u[i])>>>0; h2=((h2*31)+u[i])>>>0; }

/* Is the data this registry entry stored still present? A hash entry whose days were
   since deleted (file removals, orphan cleanup) must NOT block re-uploading the same
   file to repair the gap — that would show "already uploaded" while the data is gone. */
function dupStillLive(f){
  const ty=String(f.type||'');
  if(ty.startsWith('roster')) return true;
  /* 'open cases' (no suffix) is the retired Lead Allocation source — its entries never
     block anything (ingest refuses the file anyway). Lead Management's own book is the
     one that decides for 'open cases (lead mgmt)'. */
  if(ty==='open cases') return false;
  if(ty.startsWith('open')) return !!(S.opencasesLM&&(S.opencasesLM.rows||[]).length);
  if(ty.startsWith('closed')) return !!(S.closedcases&&Object.keys(S.closedcases.rows||{}).length);
  /* Cancellations key by contract, not by day, so they are not in STORE_OF and fell through
     to "always live" — a registry entry survived a cloud hydrate that had emptied cancRows
     and then blocked the re-upload that would have repaired it, with "already uploaded" as
     the only explanation. They are live only while rows this file contributed are still there. */
  if(ty.startsWith('cancellations')) return Object.values(S.cancRows||{}).some(r=>r.f===f.name);
  /* Multi-day ViciDial ranges live in S.vici keyed by their own from..to, which the type
     string carries — they are not in STORE_OF and fell through to "always live", the same
     hole the cancellations case above plugs. A registry entry that survived a cloud hydrate
     with an emptied S.vici blocked the one upload that would repair it, with "already
     uploaded" as the only explanation — and Cuddle talk time read 0:00:00 with the file
     sitting right there in the registry. Live only while the range's rows are still stored. */
  if(ty.startsWith('vici range')){ const v=(S.vici||{})[ty.split(' ')[2]||'']; return !!(v&&v.rows&&v.rows.length); }
  /* Referrals are a snapshot store, not day-keyed — same hydrate-empty trap as the two
     cases above: live only while THIS file's snapshot is the one held. */
  if(ty.startsWith('referrals')) return !!(S.refs&&S.refs.f===f.name&&Object.keys(S.refs.by||{}).length);
  const st=STORE_OF[ty.split(' ')[0]];
  if(!st) return true;
  const ds=f.dates||[];
  if(!ds.length) return false;      // stored nothing (e.g. every day was fuller elsewhere) — always allow a retry
  return ds.every(d=>S[st][d]);
}
/* ONE UPLOAD STATION FEEDS BOTH APPS. Every file this station ingests is archived —
   raw bytes, not derived rows — so AgentOS Analytics can pull it and run it through
   its OWN parser (see the Worker's /api/upload-archive note). Fire-and-forget: a
   failed archive never blocks the upload here, but it is SAID, never silent — the
   file would otherwise quietly stop existing for the other dashboard. */
function archiveUpload(name,buf,hash){
  try{
    const tk=sessionStorage.getItem('cbx_token'); if(!tk) return;
    const base='https://chatterbox-agentos-api.chatterbox-agentos.workers.dev';
    /* manifest first (a few KB) so re-uploads of an already-archived file never re-send
       multi-MB bodies — and so the dup-skip path below can self-heal a failed archive. */
    fetch(base+'/api/upload-manifest',{headers:{'Authorization':'Bearer '+tk}})
      .then(r=>r.ok?r.json():{files:[]}).catch(()=>({files:[]}))
      .then(man=>{
        if((man.files||[]).some(f=>f&&f.h===hash)) return;   // already archived
        return fetch(base+'/api/upload-archive?name='+encodeURIComponent(name)+'&hash='+encodeURIComponent(hash),
          {method:'POST',headers:{'Authorization':'Bearer '+tk,'Content-Type':'application/octet-stream'},body:buf})
          .then(async r=>{ if(!r.ok){ let m='HTTP '+r.status; try{m=(await r.json()).error||m}catch(e){}
            toast('"'+name+'" loaded here, but could not be archived for AgentOS Analytics — '+m+'. Upload it there by hand.',9000); return; }
            /* TELL THE OTHER TAB NOW (Nick, 2026-08-28: "when files are uploaded in vas
               analytics it should also be uploaded in ops analytics"). The pull already
               happens on open, on focus and every ten minutes — but someone sitting IN Ops
               while a colleague uploads in VAS waited up to ten minutes and saw nothing.
               Both apps are the same origin, so one broadcast makes it immediate. It is a
               nudge, never the mechanism: a closed tab, a different machine or a missing
               BroadcastChannel all still catch up on the timer exactly as before. */
            try{ if('BroadcastChannel' in window){
              const ch=new BroadcastChannel('cbx-uploads');
              ch.postMessage({t:'archived',name:name,hash:hash,at:Date.now()});
              ch.close();
            } }catch(e){}
          });
      })
      .catch(()=>toast('"'+name+'" loaded here, but could not be archived for AgentOS Analytics (network) — upload it there by hand.',9000));
  }catch(e){}
}

async function syncUploadsFromStation(){

       recent files are at the FRONT. slice(-40) took the forty OLDEST — every one of them

       whole list and nothing was wrong; the moment the manifest passes forty it becomes a
       permanent relay stall, with new uploads never even considered. Take the newest forty
       and apply them oldest-first, which is what the comment always intended. */

         swallowed a quota error out of save(), a render throw, or a worker failure in the CSV
         parser — the file was already marked decided, never retried, and NOTHING was said.
         Ops' side raises an exception row and a toast; this now retries instead. */
      try{ await handleFiles([new File([buf],fm.n)], null); ingested++; }
      catch(e){ delete seen[fm.h];                            // not deterministic — let it come round again

       memory and never persisted it, so the same file was downloaded and refused again on

    if(dirty)save();

async function handleFiles(list, expected){
  let ok=0, skipped=0;
  for(const f of Array.from(list)){
    let buf=null;
    try{ buf=await f.arrayBuffer(); }catch(e){ toast('Could not read '+f.name+' — '+(e.message||e)); continue; }
    const hash=await hashBuf(buf);
    const dup=(S.files||[]).find(x=>x.hash&&x.hash===hash);
    /* Same bytes, but filed under a RETIRED rule = not a duplicate. QA moved from Date of
       Call to Date of Assessment (Nick 2026-08-26): every evaluation already in the store
       sits on its old day, and the only honest way to re-file them is to re-ingest the
       export — which is exactly the upload the hash check used to swallow as "already
       uploaded". Each evals registry entry now records the basis it was filed under; a
       hash match only skips when the basis ALSO matches, so re-uploading the same file
       after a rule change re-files it (the global Record-ID sweep moves rows, never
       copies), and re-uploading it with nothing changed still skips as before. */
    const basisStale=dup&&dup.type==='evals'&&dup.basis!==MTD_RULES.qa.dateField;
    if(dup&&!basisStale&&dupStillLive(dup)){ skipped++; toast('Skipped '+f.name+' — already uploaded'+(dup.name!==f.name?' (as "'+dup.name+'")':''));
      archiveUpload(f.name,buf,hash);   // self-heal: an earlier failed archive gets another chance (manifest check makes this ~free)
      /* A SKIPPED agent list still spends the one-shot "effective from". The date was set for
         this upload; leaving it armed because the file turned out to be a duplicate means the
         NEXT list — a real reorganisation, weeks later — is filed against a date in the past,
         which is precisely the failure this control exists to prevent. */
      if(/^roster/.test(dup.type||'')&&S.settings.rosterAsOf){ S.settings.rosterAsOf=''; save(); }
      continue; }
    if(dup) S.files=S.files.filter(x=>x!==dup);   // stale entry, its data is gone — drop it and re-ingest
    if(f.size>4*1048576){ // big export: sticky progress toast — the parse itself runs in a background thread
      toast('Reading '+f.name+' ('+Math.round(f.size/1048576)+' MB) — the app stays usable while this loads…',600000);
      await new Promise(r=>setTimeout(r,60));
    }
    let text=null;
    try{ text=await bufferToText(f.name,buf); }catch(e){ toast('Could not read '+f.name+' — '+(e.message||e)); }
    if(text==null) continue;
    if(await ingestText(f.name,text,expected,hash)){ ok++; archiveUpload(f.name,buf,hash); }
  }
  if(ok){
    if(!S.ui.month) S.ui.month=latestMonth();
    const r=periodRange();
    const ds=[...allDataDates()];
    if(r&&!ds.some(d=>d>=r.from&&d<=r.to)&&ds.length){ S.ui.preset=''; S.ui.month=latestMonth(); }  // a sticky 'today/7d' preset outside the data's range would show "No data yet" right after a successful upload
    save(); rebuild(); renderAll();
    toast(ok+' file'+(ok>1?'s':'')+' loaded'+(skipped?' · '+skipped+' skipped (already uploaded)':''));
  }else if(skipped){
    toast(skipped+' file'+(skipped>1?'s':'')+' skipped — already uploaded, nothing new to add');
  }
}

/* SA PUBLIC HOLIDAYS, observed dates (a Sunday holiday moves to Monday per the
   Public Holidays Act; Saturday ones stay put and never touch a weekday count).
   Used by workingDays and daysWithData in the agent digest. EXTEND EACH DECEMBER.

const SA_HOLIDAYS=new Set([
  '2026-01-01','2026-03-21','2026-04-03','2026-04-06','2026-04-27','2026-05-01',
  '2026-06-16','2026-08-10','2026-09-24','2026-12-16','2026-12-25','2026-12-26',

  '2027-06-16','2027-08-09','2027-09-24','2027-12-16','2027-12-25','2027-12-27']);
/* campaign+tenure -> commission bracket. The calculator's four bracket keys are
   a one-to-one match with salesTargetMatrix (MTD_RULES:501), which is why this
   map is a lookup and not a heuristic. 'M0' means the M0 calculator (commission
   is 100% of projected premium, no brackets — m0.tsx:218). null means we have no
   published model for that combination: the page then says so rather than
   guessing a number, because a wrong commission figure is worse than none. */
function commPlanOf(campaign,tenure){
  const c=String(campaign||'').trim(), t=String(tenure||'').trim().toUpperCase();
  if(c==='Nesting') return 'M0';
  if(t==='M0') return 'M0';
  /* the Agent List's "Download & Test" campaign ↔ the comm workbook's "Exp Agents Only -
     Download / Upsell" sheet (2026-09-03). Experienced agents only; anyone else on it has
     no model on file and the page says so rather than guessing. */
  if(/download/i.test(c)) return t.startsWith('EXP')?'EXP_DOWNUP':null;
  if(c==='Courtesy'){ if(t==='M1')return 'M1'; if(t==='M2')return 'M2'; if(t.startsWith('EXP'))return 'EXP_COURTESY'; return null; }
  if(c==='Cuddle'){ if(t.startsWith('EXP'))return 'EXP_CUDDLE'; if(t==='M1')return 'M1'; if(t==='M2')return 'M2'; return null; }
  return null;
}

function agentDigestPayload(){
  if(!M||!Array.isArray(M.agents)||!M.agents.length) return null;

  /* Ranks: the drawer's ordering (5927-5930), computed once for the whole floor
     instead of once per agent. Same sort, same tie behaviour, O(n log n). */
  const rankAll=M.agents.map(x=>({c:x.code,g:(primaryAgg(x.code)||{}).gwp||0})).sort((x,y)=>y.g-x.g);
  const rankCo={}; rankAll.forEach((r,i)=>{ rankCo[r.c]=i+1; });
  const teamOf={}; M.agents.forEach(a=>{ teamOf[a.code]=a.tl||''; });
  const rankTeam={}, teamSize={};
  { const seenT={};
    rankAll.forEach(r=>{ const tl=teamOf[r.c]||''; seenT[tl]=(seenT[tl]||0)+1; rankTeam[r.c]=seenT[tl]; });
    for(const tl in seenT) teamSize[tl]=seenT[tl]; }

  /* Sparklines in ONE pass over the facts, not one pass per agent. seriesBy()
     walks every fact row each time it is called, so calling it inside the agent
     loop was 130 full scans of M.facts every 90 seconds — an O(agents × facts)
     shape hiding behind a tidy-looking one-liner. Same numbers, one scan. */
  const dayIdx={}; M.dates.forEach(function(d,i){ dayIdx[d]=i; });
  const sparkBy={};
  /* DIALLER VOLUME, in the SAME single pass. Published so the campaign view can show
     contact rate and attempts per lead without a second walk of the facts. */
  const callsBy={};
  for(const f of M.facts){
    const i=dayIdx[f.date]; if(i===undefined) continue;
    const s=sparkBy[f.code]||(sparkBy[f.code]=new Array(M.dates.length).fill(0));
    s[i]+=f.sales||0;
    const c=callsBy[f.code]||(callsBy[f.code]={calls:0,ans:0});
    c.calls+=f.calls||0; c.ans+=f.ans||0;
  }

  /* THE LEAD DENOMINATOR. Conversion is sales / UNIQUE LEADS — the rule the Lead
     Management tab states and scores against (`Conv % (leads)`), and the reason
     compositeFor() leaves conv null rather than publishing sales-per-call wearing
     conversion's name. Publishing the denominator itself lets every consumer apply
     the real rule instead of inventing a proxy. Asked for UNFILTERED, so one
     person's campaign chip cannot narrow what the whole floor is told.
     Null, never zero, when the case books are not loaded: no leads uploaded and an
     agent worked no leads are different facts. */
  let leadsBy=null;
  try{ if(S.opencasesLM||S.closedcases){ const lb=leadBook(true); leadsBy={};
    for(const cb in lb.A) leadsBy[cb]=lb.A[cb].leads.size; } }catch(e){ leadsBy=null; }

  const rows=[];
  for(const a of M.agents){
    const g=primaryAgg(a.code)||{};
    const camp=M.primaryCamp[a.code]||a.campaign||'';
    const tenure=g.tenure||a.tenure||'';
    const t=trendOf(a.code)||{dir:'flat',pct:null};

    // badges — drawer logic verbatim (5931-5938)
    const badges=[];
    if(rankCo[a.code]===1) badges.push(['🏆','Top earner company-wide']);
    else if(rankCo[a.code]<=3) badges.push(['🥇','Top 3 company-wide']);
    if(rankTeam[a.code]===1&&(teamSize[teamOf[a.code]]||0)>1) badges.push(['⭐','#1 in your team']);
    if(g.qa&&g.qa.avg>=0.95&&g.qa.n>=3) badges.push(['🛡️','QA excellence — 95%+']);
    if((g.att??0)>=0.99&&g.emp>=5) badges.push(['🎯','Perfect attendance']);
    if((g.pctT||0)>=1.25) badges.push(['🚀','125%+ of target']);

    /* Rounded on the way out. A rand figure carrying nine decimal places is
       noise that triples the payload for hundreds of readers, and the dashboard
       itself displays these rounded. Money keeps cents (the calculator reads
       gwpEx, and a cent is the smallest unit that can matter); rates keep four
       places, which is finer than any percentage this page prints. */
    const r2=v=>v==null?null:Math.round(v*100)/100;
    const r4=v=>v==null?null:Math.round(v*10000)/10000;

    rows.push({
      code:a.code, name:a.name||a.code, campaign:camp, tenure:tenure,
      /* THE TEAM LEADER, published so Agent Analytics can scope a team leader to
         their own team in the WORKER. Team membership is the Agent List's 'Team
         Leader' column and nothing else — there is no team id in this system — so
         without this field the portal would have to name-match a leader to their
         agents at request time, which is the fragile join the whole design avoids.
         a.tl is already the period-correct leader (movers keep the leader they sat
         under during the period; a.tlNow is where they sit today). Not a figure —
         it publishes no money and no score. */
      tl:a.tl||'',
      plan:commPlanOf(camp,tenure),
      gwpEx:r2(g.gwpEx)||0, sales:g.sales||0, target:r2(g.target)||0,
      pctT:r4(g.pctT), spd:r4(g.spd),
      att:r4(g.att), qa:(g.qa&&g.qa.avg!=null?r4(g.qa.avg):null),
      aveG:r2(g.aveG), ref:g.ref||0,
      /* THE REST OF THE MONTH-TO-DATE ROW. Agent Analytics' Month to Date tab
         mirrors this app's own MTD table (metric rows x people), so it needs the
         same figures per agent rather than a second calculation of them. Published
         as null when the source has not supplied one — a blank cell is honest, a
         zero would read as 'no cancellations' when it means 'we were not told'. */
      canc:g.canc==null?null:r2(g.canc), gwpT:g.gwpT==null?null:r2(g.gwpT),
      talk:g.talk==null?null:Math.round(g.talk),
      /* Dialler + leads. `leads` is the unique-lead denominator; null means the case
         books are not loaded, which is not the same as an agent with no leads. */
      calls:(callsBy[a.code]||{}).calls||0, ans:(callsBy[a.code]||{}).ans||0,
      leads:leadsBy?(leadsBy[a.code]||0):null,
      act:r2(g.act)||0, emp:r2(g.emp)||0,
      rankCo:rankCo[a.code]||null, nCo:rankAll.length,
      rankTeam:rankTeam[a.code]||null, nTeam:teamSize[teamOf[a.code]]||0,
      trend:t.dir, trendPct:(t.pct==null?null:Math.round(t.pct*1000)/1000),
      badges:badges,
      spark:(sparkBy[a.code]||[]).map(v=>Math.round(v*100)/100),
      /* THE VAS SCORE (Nick 2026-08-26): the leaderboard's perfScore, published so Agent
         Analytics shows the same 0-100 the Score chip shows here — never a second formula
         that drifts. 0-1 on the wire, x100 at display, like every other rate in this payload. */
      /* The published score IS the composite now — Agent Analytics, the AI digest and
         every consumer read one number. perfScore still travels as scoreParts' basis
         for the agents the composite cannot rate. */
      score:r4(displayScore(a.code,g)),
      /* THE SEVEN-DRIVER COMPOSITE (Nick, 2026-08-28), published ALONGSIDE the
         four-driver score rather than replacing it, so both can be read for one
         upload cycle and diffed per agent before the card switches over. */
      composite:compositeFor(a.code,a),
      /* THE SCORE'S OWN BREAKDOWN (Nick 2026-08-26: the agent's rating card runs on
         VAS data). The same perfParts the score is summed from — pts to one decimal,
         v is the underlying rate (null = not measured this period, and the page says
         so instead of printing a zero). */
      /* SCORE AND PARTS MUST DESCRIBE THE SAME FORMULA. The published score is the
         composite now, so publishing the four-driver breakdown beside it said 25,6 in
         one field and 36 in the other for the same agent. The composite carries its own
         seven parts; scoreParts survives only for an agent whose score IS still
         perfScore — which is the same condition displayScore falls back on. */
      scoreParts:(function(){ const c=scoreFor(a.code); if(c&&c.rated) return null;
        const p=perfParts(g); if(!p) return null;
        const r1=v=>v==null?null:Math.round(v*10)/10;
        /* w is the EFFECTIVE weight, taken from perfParts rather than repeated as a literal:
           a driver the agent has no data for now leaves the denominator, so the four weights
           still sum to 100 but not to 45/25/20/10. Publishing the old constants here would
           have made the rating card's own arithmetic disagree with the score above it. */
        return { t:{v:r4(p.t.v),w:p.t.w,pts:r1(p.t.pts)}, qa:{v:r4(p.qa.v),w:p.qa.w,pts:r1(p.qa.pts)},
                 att:{v:r4(p.att.v),w:p.att.w,pts:r1(p.att.pts)}, opt:{v:r4(p.opt.v),w:p.opt.w,pts:r1(p.opt.pts)} }; })(),
      /* THE AGENT'S DAYS (Nick 2026-08-26): the same agent-day facts the Daily and Weekly
         tabs read, so the team leader's portal can carry those two views without a second
         calculation of anything. Lean keys on purpose — ~84 agents x ~22 days rides in every
         digest push. dCov travels because a day the dialler never covered must show a dash,
         not a zero; provisional travels because a +- sale must keep its +-. */
      /* k = CANCELLATIONS on the day. Sales are counted NET of cancellation, so a day whose
         only sale was cancelled publishes s:0 — and the agent's own session list, whose column
         is honestly headed "Sales that counted", had no way to say WHY it did not count. It
         read as a day they wrote nothing. The engine has carried canc on every fact row since
         the money model was regrained; it simply never travelled. */
      days:(M.byAgentDay[a.code]||[]).map(f=>({d:f.date,w:f.week,emp:r2(f.emp)||0,act:r2(f.act)||0,
        t:r2(f.target)||0,s:f.sales||0,x:r2(f.gwpEx)||0,tk:Math.round(f.talk||0),c:f.calls||0,
        r:f.ref||0,k:f.canc||0,p:f.provisional?1:0,dc:f.dCov?1:0}))
    });
  }

  /* Anonymous peer context. Grouped on campaign|tenure — the same cut the target
     matrix uses — so "the group average" is always a like-for-like comparison.
     No peer is ever named; only the average travels. */
  const groups={};
  rows.forEach(r=>{ const k=r.campaign+'|'+r.tenure;
    const o=groups[k]=groups[k]||{n:0,gwpEx:0,sales:0,tS:0,tT:0};
    o.n++; o.gwpEx+=r.gwpEx; o.sales+=r.sales;
    /* WEIGHTED, the way agg() defines % to target everywhere else: SUM(sales) / SUM(target).
       This used to average each agent's own percentage, which gave a two-day joiner on a
       target of 2 the same weight as a full-month agent on 8, and contradicted the mean
       sales and mean target published beside it in the same object. */
    o.tS+=r.sales||0; o.tT+=r.target||0; });
  for(const k in groups){ const o=groups[k];
    o.gwpEx=Math.round((o.n?o.gwpEx/o.n:0)*100)/100;
    o.sales=Math.round((o.n?o.sales/o.n:0)*100)/100;
    o.pctT=o.tT?Math.round(o.tS/o.tT*10000)/10000:null; delete o.tS; delete o.tT; }

  /* THE PEOPLE THIS PAGE CANNOT ANSWER FOR — and why.
     One link goes to the whole floor, but the digest above only holds agents in
     a reported VAS campaign with activity this period. On the August roster that
     is 84 of 130: the other 46 are Vehicle Tracking, which is a different product
     with no VAS commission model and is deliberately not reported by this engine
     (MTD_RULES.reportedCampaigns). Left alone, every one of those people would
     search their own name and be told "No match" — which reads as "the company
     has lost me", not as "you are on a different scheme".
     So we publish their NAME ONLY, with a reason, and the page gives them a
     straight answer instead of a dead end. No figures travel for these people;
     nothing here changes what the engine reports. */
  const covered={}; rows.forEach(r=>{ covered[r.code]=1; });
  const notCovered=[];
  for(const a of (S.roster||[])){
    if(covered[a.code]) continue;
    if(MTD_RULES.excludeAgents&&MTD_RULES.excludeAgents[a.code]) continue;   // deliberately off the books
    notCovered.push({code:a.code,name:a.name||a.code,tl:a.tl||'',
      why:CAMPS.includes(campOf(a.campaign))?'nodata':'campaign',
      campaign:a.campaign||''});
  }

  return {
    v:1,
    updatedAt:new Date().toISOString(),
    dataReach:dataReach(),                 // last day each source covers (never-stale plan)
    expectedReach:expectedReach(),         // the day it should cover right now
    /* which cm:targets set these figures were built WITH — the settings page
       compares this to the live stamp and says 'refreshing' instead of quietly
       showing %-to-target computed on the previous targets */
    cmTargetsStamp:(S.cmTargets&&S.cmTargets.stamp)||'',
    period:{from:M.range.from,to:M.range.to},
    /* TWO DIFFERENT DAY COUNTS, AND CONFUSING THEM BREAKS THE MONEY.
       diallingDays is days we HAVE DATA FOR — days elapsed. workingDays is every
       weekday in the period, which is what a month-end projection must divide by.
       Sending diallingDays as the calculator's "dial days in period" made it think
       August had 14 days and ended tomorrow: it projected off 14 instead of 21 and
       told an agent on 23 August she had 1 day left, so "write R252 a day" (3 sales,
       reachable) printed as "write R2,012 a day" (26 sales in one day, absurd). */
    /* ...AND A PUBLIC HOLIDAY IS NOT A WORKING DAY (Nick, 2026-09-02: "shouldn't
       it be 21 working days not 22"). Bare weekdays said September 2026 has 22,
       but the comm model (Matrix Vas Comm Model_September26.xlsx) is built on 21
       dialling days because Heritage Day (Thu 24 Sep) is a weekday nobody dials.
       August proved the same rule: 21 weekdays, DD 20 in the model — Women's Day
       observed Mon 10 Aug. SA_HOLIDAYS below carries the observed dates (a Sunday
       holiday moves to Monday per the Public Holidays Act; Saturday ones stay and
       never touch this count). EXTEND IT EACH DECEMBER for the coming year. */
    /* Monday-anchored weeks inside the period, for the portal's Weekly view — the same
       M.weeks the Weekly tab here iterates, boundaries and all. */
    weeks:(M.weeks||[]).map(w=>({num:w.num,from:w.dates[0],to:w.dates[w.dates.length-1]})),
    diallingDays:M.diallingDays||M.dates.length||0,
    workingDays:(function(){let n=0,d=M.range.from;
      while(d<=M.range.to){const w=new Date(d+'T00:00:00Z').getUTCDay();if(w>0&&w<6&&!SA_HOLIDAYS.has(d))n++;d=addDays(d,1);}
      return n||M.diallingDays||M.dates.length||0;})(),
    /* DAYS WITH DATA (Nick, 2026-09-03: "1st to 2nd is not 3 working days — do not
       include today, today's stats are not included"). The agent page's "days worked"
       came from the attendance register, which lands before the day's sales files —
       so an agent read 3 days worked against 2 days of figures, and every per-day
       number inherited the error. This is the count of working days from the 1st to
       the LAST DATE THAT CARRIES FACTS (M.dates — the same list the period label
       ends on). The page caps days-worked at it: a day counts once its files land. */
    daysWithData:(function(){const last=(M.dates||[]).filter(x=>x>=M.range.from&&x<=M.range.to).sort().pop();
      if(!last) return 0; let n=0,d=M.range.from;
      while(d<=last){const w=new Date(d+'T00:00:00Z').getUTCDay();if(w>0&&w<6&&!SA_HOLIDAYS.has(d))n++;d=addDays(d,1);}
      return n;})(),
    dates:M.dates,
    /* the model that was in force for THIS period's month — see COMM_RULES_BY_MONTH */
    comm:COMM_RULES_BY_MONTH[String(M.range.from||'').slice(0,7)]||COMM_RULES,
    /* One copy of the seven driver labels, notes and weights for the whole payload —
       see the note in compositeFor. The panel joins them to each agent's numbers. */
    compositeDrivers:COMPOSITE_RULES.drivers.map(d=>({k:d.k,label:d.label,note:d.note,w:d.w})),
    groups:groups,
    agents:rows,
    notCovered:notCovered
  };
}

/* Publish on the same cadence and with the same guards as the AI digest
   (ask-widget.js:58-73): never push without a token, never push an empty
   session over a rich digest, never re-push an unchanged payload. */
(function(){
  var API='https://chatterbox-agentos-api.chatterbox-agentos.workers.dev';
  var last='';
  function push(){
    try{
      var tk=sessionStorage.getItem('cbx_token'); if(!tk) return;
      if(!window.__vasHydrated) return;                       // still syncing — M may be partial
      if(!S||!(S.files||[]).length) return;                   // empty session must never overwrite
      return send();
    }catch(e){}
  }
  function send(){
    try{
      var tk=sessionStorage.getItem('cbx_token'); if(!tk) return;
      var p=agentDigestPayload(); if(!p||!p.agents.length) return;
      /* THE DIGEST IS A MONTH. NEVER PUBLISH ANYTHING ELSE.
         periodRange() reads S.ui — the SHARED view blob — so whichever period the
         publishing browser happens to be looking at becomes what every agent, team
         leader and campaign manager in the suite is told their MONTH is. Somebody
         clicking "yesterday" or a 7-day range would republish the floor's month as
         one day, silently, to everyone. That is the exact shape of the "all the data
         is wrong" incident, and the digest is the one store where it reaches people
         who have no way to notice.

         26th-to-25th cycle, a custom span — is refused here rather than corrected,
         because a browser on the right period publishes moments later anyway and a
         stale-but-true digest beats a fresh-but-wrong one. */
      if(!/^\d{4}-\d{2}-01$/.test((p.period&&p.period.from)||'')) return;

      var cmp=JSON.stringify(p.agents)+p.period.from+p.period.to;   // ignore updatedAt churn
      if(cmp===last) return; last=cmp;

         agents, their past months data keeps on showing"). The guard above only
         asked for a period starting on the 1st, so a VAS browser reviewing AUGUST
         republished August as kv:agent-digest every 90 seconds and every agent's
         Today page rolled back a month while the calendar said 3 September. A past
         month may refresh ITS OWN history key below; only the month we are in may
         write the key the portal opens on. SAST month, never the device's. */
      var __dm=(p.period&&p.period.from?String(p.period.from).slice(0,7):'');

          headers:{'Content-Type':'text/plain','Authorization':'Bearer '+tk,'X-Cbx-Client':'v5'},
          body:body}).catch(function(){});

         month, so the portal can offer past months. Any month may refresh its own key;
         only the live key above is fenced to the current month. */
      if(/^\d{4}-\d{2}$/.test(__dm))
        fetch(API+'/api/kv?key=agent-digest-'+__dm,{method:'POST',

    }catch(e){}
  }
  window.__agentDigestPush=push;                              // manual trigger + the test harness
  setInterval(push,90000);
  document.addEventListener('cbx-authed',function(){setTimeout(push,8000)});
  setTimeout(push,11000);
})();
