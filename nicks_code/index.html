      if(!acc||/^applied filters/i.test(acc)){ skip++; continue; }   // Power BI footer, not data
      // same test-data exclusions as the Active export — this file is the other half of the
      // union that Sales Achieved and GWP are counted over (spec §6.3/§6.5)
      if(MTD_RULES.excludeChargeCodes.includes(String(r['Charge Code']||'').trim().toUpperCase())){ excl++; continue; }
      if(MTD_RULES.excludeAccounts.includes(acc)){ excl++; continue; }
      const dd=parseDateLoose(r['Contract Deactivate Date']);
      if(!dd){ skip++; continue; }                                    // still active - not a cancellation
      const cd=parseDateLoose(r['Contract Create Date']);
      if(!cd){ skip++; continue; }                                    // cannot be dated to a sale period
      const key=acc+'|'+String(r['Contract Number']||'').trim()+'|'+dd;
      if(seen.has(key)){ dupes++; continue; }                         // same contract twice in one file
      seen.add(key);
      const owner=(r['Owner']||'').trim();                            // stored RAW - resolved at model-build time
      if(!owner){ skip++; continue; }
      // unit + charge are kept so the sale can be added back GROSS (grossUpSales) and so
      // cancellations are counted in the SAME unit Sales Achieved counts in — the case.
      // Storing only the account here is what would double-count the gross-up once Active
      // moved to case grain, so the two sources move together or not at all.
      const chg=parseFloat(String(r['Charge Amount']||'').replace(/\s/g,'').replace(/^(-?\d+),(\d+)$/,'$1.$2').replace(/[^0-9.\-]/g,''));
      const cs=String(r['Case Number']||'').trim();
      if(cs) casedC++; else uncasedC++;
      S.cancRows[key]={d:cd,dd,owner,f:name,a:acc,c:cs||null,x:isNaN(chg)?0:chg};
      dates.add(cd); added++;
    }
    if(!added){ toast('"'+name+'" carried no cancellations that could be dated to a sale'); return null; }
    /* A CANCELLATION CAN BE UNDONE — the saves team wins the customer back, the contract
       reactivates, and the account LEAVES the next Inactive pull. The store used to
       accumulate forever, so a reversed cancellation stayed on the agent's record with no
       path out (Enoch's acct 10485558, 2026-08-18: reinstated in Salesforce, immortal here).
       THE FILE OWNS THE DEACT-WINDOW IT COVERS — the same span-supersede the BI Active
       ingest uses for months. Inside [min deact, max deact] of this pull, a stored
       cancellation absent from the file is treated as REVERSED and removed; outside the
       window nothing is touched, so a narrow pull still cannot wipe older months. Removals
       are counted and said out loud: a filtered pull (one campaign, one team) would look
       exactly like a mass reinstatement, and the toast is how the person who chose the file
       finds out. Re-uploading the same file is a no-op (every key present). */
    let reversed=0; const reversedWho={};
    { let lo=null,hi=null;
      for(const k of seen){ const dd=k.split('|')[2]; if(!lo||dd<lo)lo=dd; if(!hi||dd>hi)hi=dd; }
      for(const k in S.cancRows){ if(seen.has(k)) continue;
        const dd=k.split('|')[2];
        if(dd>=lo&&dd<=hi){ const r=S.cancRows[k];
          reversedWho[r.owner]=(reversedWho[r.owner]||0)+1; delete S.cancRows[k]; reversed++; } }
    }
    grossUpSales();
    if(reversed){ const who=Object.entries(reversedWho).slice(0,3).map(([o,n])=>o.split(' ')[0]+' ('+n+')').join(', ');
      toast(reversed+' previously-stored cancellation contract(s) inside this file’s deactivation window are NOT in it — '
        +'treated as reversed (customer saved / contract reinstated) and removed: '+who
        +(Object.keys(reversedWho).length>3?' +more':'')
        +'. If this was a FILTERED pull rather than the full export, re-upload the full one now — this warning is the only trace.',14000); }
    if(uncasedC) toast(uncasedC+' cancellation row(s) in "'+name+'" carry no Case Number — they fall back '
      +'to their account for matching, which is the older grain. Re-pull the Inactive export if the sales '
      +'count looks wrong on those days.',10000);
    return regFile(name,'cancellations',[...dates].sort(),recs.length,{skip,dupes,excl,cased:casedC,uncased:uncasedC,reversed,unit:'case'});
  },
  /* Referrals (HighLevel pull) — a SNAPSHOT of per-agent referral counts, replaced
     wholesale on every upload. The agent is matched THROUGH THE AGENT LIST (employee code
     first, then the roster name/alias index); a name matching nobody is counted in an
     unmatched bucket and reported, never invented onto the roster. Counts are referral
     BLOCKS (a contact can carry up to five referred people), so totals exceed row counts
     by design. While a referrals upload is loaded, keyed referral adjustments are ignored
     — the same one-source doctrine as cancellations. */
  referrals(recs,name){ return INGEST._refStore(recs,name,r=>({code:String(r['Employee Code']||'').trim(),agent:String(r['Agent Name']||'').trim(),cnt:parseInt(r['Referral Count'],10)||1,created:String(r['Created']||'').slice(0,10)})) },
  referralsAgg(recs,name){ return INGEST._refStore(recs,name,r=>({code:String(r['cb']||'').trim(),agent:String(r['agent_name']||r['agent_name_raw']||'').trim(),cnt:parseInt(r['referrals'],10)||0})) },
  _refStore(recs,name,pick){
    if(!S.roster.length){
      // Without the Agent List EVERY name is unmatched — storing that snapshot would show
      // 0 referrals for the whole floor AND suppress keyed adjustments. Refuse; the sync
      // watchdog retries once the roster has hydrated.
      toast('Referrals not stored — the Agent List must load first (it maps every referral). Will retry automatically.');
      return {type:'referrals (deferred — no roster)',rows:recs.length,dates:[]};
    }
    buildIndex();
    const codes=new Set(S.roster.map(a=>String(a.code||'').toUpperCase().replace(/[^A-Z0-9]/g,'')));
    /* Tiered name matching, UNIQUE-OR-NOTHING — the HighLevel form captures the agent as
       free text ("ASHLEIGH", "Thulani Mbonambi", a typo'd surname). After the exact
       resolveKey pass: token subset, then a single token, then edit-distance-1 tokens —
       each accepted only when exactly ONE roster agent fits. Ambiguity stays unmatched. */
    const nrm=s=>String(s||'').toLowerCase().replace(/\s+-\s*.*$|\s*-\s+.*$/,'').replace(/\s+/g,' ').trim();
    const lev1=(a,b)=>{if(a===b)return true;if(a.length<4||b.length<4||Math.abs(a.length-b.length)>1)return false;
      let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;
        if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1};
    const tm=(t,rt)=>{const c=s=>s.replace(/[^a-z0-9]/g,'');return t===rt||lev1(c(t),c(rt))};
    const rn=[];S.roster.forEach(a=>{const cd=String(a.code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      [a.name,a.sf].forEach(nm=>{if(nm)rn.push({toks:nrm(nm).split(' '),code:cd})})});
    const fuzzy=raw=>{const toks=nrm(raw).split(' ');if(!toks[0])return '';
      const hits=new Set();
      for(const r of rn){if(toks.every(t=>r.toks.some(x=>tm(t,x)))||r.toks.every(x=>toks.some(t=>tm(t,x))))hits.add(r.code)}
      return hits.size===1?[...hits][0]:''};
    const by={},un={},byDay={};let noAgent=0,total=0,dated=0;
    for(const r of recs){
      const p=pick(r); if(!p.cnt) continue;
      total+=p.cnt;
      let code=p.code.toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!codes.has(code)) code=(p.agent&&typeof resolveKey==='function'?resolveKey(p.agent):null)||'';
      if(!(code&&codes.has(code))&&p.agent) code=fuzzy(p.agent);
      if(code&&codes.has(code)){ by[code]=(by[code]||0)+p.cnt;
        /* KEEP THE DATE. The HighLevel rows carry the contact's created day, and dropping it
           here was the only reason Daily and Weekly referrals could not show real numbers —
           the source was never dateless, the aggregation was. Same matching, same count,
           bucketed per day alongside the total so the two can never disagree. */
        if(p.created&&p.created.length===10&&p.created.slice(0,2)==='20'&&p.created.charAt(4)==='-'&&p.created.charAt(7)==='-'){ dated+=p.cnt;
          (byDay[p.created]=byDay[p.created]||{})[code]=(byDay[p.created][code]||0)+p.cnt; }
      }
      else if(p.agent) un[p.agent]=(un[p.agent]||0)+p.cnt;
      else noAgent+=p.cnt;
    }
    S.refs={by,un,noAgent,total,f:name,byDay:dated>0?byDay:null,dated};
    const unN=Object.keys(un).length;
    toast('Referrals loaded: '+total+' across '+Object.keys(by).length+' agents'+(unN?' · '+unN+' name(s) match no one on the Agent List':'')+(noAgent?' · '+noAgent+' with no agent captured':''));
    return regFile(name,'referrals',[],recs.length,{total,matched:Object.keys(by).length,unmatched:unN,noAgent});
  },
  /* SALESFORCE OPEN CASES — the lead book, a SNAPSHOT of who is holding what right now.
     Replaced wholesale on every upload (a point-in-time position cannot be merged with an
     older one). Rows are stored RAW with the owner string intact and resolved through the
     Agent List at render time, exactly as the dialler sources are: re-uploading the roster
     re-attributes every case with no re-upload of this file.
     One row per case: the export repeats a case across contract lines, and the dedupe is
     on Case Number. */
  /* ONE BOOK SINCE 2026-08-27 (Nick: "remove lead allocation … remove lead allocation open
     cases"). Only the Lead Management pull is ingested now. The Salesforce Open Cases
     header cannot say which pull it is, so the declaration decides: the Lead Management
     slot, or "Lead Management" in the filename (routed in ingestText). An Open Cases file
     with neither declaration is the retired Lead Allocation pull and is REFUSED with a
     message — never loaded quietly into the wrong book. */
  _openCases(recs,name,store,label){
    const rows=[]; const seen=new Set(); let dupes=0, skip=0, badAge=0;
    /* AGE COMES FROM THE OPEN DATE, NOT FROM "Age (Hours)".
       Salesforce's own Age column cannot be trusted: the 18-Aug pull writes
       3 930 000 000 000 in it — every row — and a mixed pull put 9e10 on 386 of 90 080 rows,
       which surfaced as an "Oldest lead: 90 000 000 000,0 hours" card. Date/Time Opened is a
       real timestamp in the same file (an Excel serial carrying time of day), so the age is
       DERIVED from it and the file's own column is used only when there is no open date —
       and then only if the number is physically possible. Anything implausible is dropped and
       counted, never shown: an age no human could produce is not a data point, it is a defect
       wearing a number's clothes. */
    const AGE_MAX_H=LEAD_AGE_MAX_H;           // the shared ceiling — see its definition
    const openedAt=v=>{                       // -> ms since epoch, keeping time of day
      if(v==null||v==='') return null;
      if(v instanceof Date) return v.getTime();
      const t=String(v).trim();
      if(/^\d+(\.\d+)?$/.test(t)) return Date.UTC(1899,11,30)+Math.round(parseFloat(t)*86400000);
      const d=new Date(t.replace(' ','T')); return isNaN(d)?null:d.getTime();
    };
    for(const r of recs){
      const cs=String(r['Case Number']||'').trim();
      if(!cs){ skip++; continue; }
      if(seen.has(cs)){ dupes++; continue; }
      seen.add(cs);
      const ms=openedAt(r['Date/Time Opened']);
      const opened=ms!=null?new Date(ms).toISOString().slice(0,10):(parseDateLoose(r['Date/Time Opened'])||'');
      let ah=null;
      if(ms!=null) ah=Math.max(0,(Date.now()-ms)/36e5);            // the reliable path
      else {                                                        // no open date — try the file's column
        const v=parseFloat(String(r['Age (Hours)']??'').replace(/[^0-9.\-]/g,''));
        if(isFinite(v)&&v>=0&&v<=AGE_MAX_H) ah=v;
      }
      if(ah!=null&&!(ah>=0&&ah<=AGE_MAX_H)){ ah=null; badAge++; }    // implausible -> unknown, and counted
      rows.push({k:cs,owner:String(r['Case Owner']||'').trim(),
        status:String(r['Status']||'').trim(),opened,age:ah==null?null:Math.round(ah*10)/10});
    }
    if(!rows.length) return null;                       // stored nothing -> not a load; fail loudly
    S[store]={rows,f:name,at:new Date().toISOString().slice(0,16).replace('T',' '),total:rows.length};
    if(dupes) toast(dupes+' repeated case row(s) in "'+name+'" collapsed — one row per Case Number');
    if(badAge) toast(badAge+' case(s) in "'+name+'" carry an impossible age and now read as unknown rather than a number '
      +'— Salesforce\'s "Age (Hours)" column is unreliable in this export, so age is derived from Date/Time Opened instead.',11000);
    return regFile(name,label,[],recs.length,{cases:rows.length,dupes,skip,badAge});
  },
  /* SALESFORCE CLOSED CASES — the other half of the funnel. Time-series, not a snapshot:
     it is keyed on Case Number and ACCUMULATES, so a later pull adds its closures without
     wiping earlier ones. Dated on Date/Time Closed. */
  opencases(recs,name){
    /* The retired Lead Allocation pull. Refused, loudly — see the routing note above. */
    toast('"'+name+'" was not loaded — Lead Allocation was removed from VAS Analytics. '
      +'To feed Lead Management, drop the file on the Lead Management — Open Cases slot '
      +'(or use the export named "Lead Management Open Cases …").',11000);
    return null;
  },
  opencasesLM(recs,name){ return INGEST._openCases(recs,name,'opencasesLM','open cases (lead mgmt)'); },
  closedcases(recs,name){
    if(!S.closedcases) S.closedcases={rows:{},f:name,at:''};
    let added=0, dupes=0, skip=0; const dates=new Set();
    for(const r of recs){
      const cs=String(r['Case Number']||'').trim();
      if(!cs){ skip++; continue; }
      const closed=parseDateLoose(r['Date/Time Closed'])||'';
      if(!closed){ skip++; continue; }
      if(S.closedcases.rows[cs]){ dupes++; continue; }
      S.closedcases.rows[cs]={owner:String(r['Case Owner']||'').trim(),
        status:String(r['Status']||'').trim(),opened:parseDateLoose(r['Date/Time Opened'])||'',d:closed};
      dates.add(closed); added++;
    }
    if(!added){ toast('"'+name+'" carried no closed cases that could be dated'); return null; }
    S.closedcases.f=name; S.closedcases.at=new Date().toISOString().slice(0,16).replace('T',' ');
    return regFile(name,'closed cases',[...dates].sort(),recs.length,{added,dupes,skip});
  }
};

function removeFile(idx){
  const f=S.files[idx]; if(!f) return;
  if(!confirm('Remove "'+f.name+'"?\n\nIts data leaves the dashboard and the change is saved to the cloud database.')) return;
  const t0=f.type.split(' ')[0];
  // ownership guard: registry date lists overlap by design (daily cumulative BI exports,
  // overlapping dialler files). A day is only deleted if THIS file still owns it — for
  // calls that is callsMeta provenance; for the rest, no other same-type file claims it.
  // Without this, removing yesterday's entry wiped days today's file had re-stored.
  const claimedElsewhere=d=>S.files.some(x=>x!==f&&x.type.split(' ')[0]===t0&&(x.dates||[]).includes(d));

  const st=STORE_OF[t0];   // the shared registry - never a second copy
  if(st && f.dates) for(const d of f.dates){
    if(st==='calls'){
      if(S.callsMeta&&S.callsMeta[d]&&S.callsMeta[d].f&&S.callsMeta[d].f!==f.name) continue; // a fuller file owns this day now
      delete S.calls[d]; if(S.callsMeta) delete S.callsMeta[d];
    }else if(st==='evals'){
      /* QA days MERGE across files now, so a day can hold two exports' evaluations and
         deleting it would take the other file's with it. Each evaluation remembers the file
         it came from — drop exactly those, and the day only when nothing is left. */
      const bk=S.evals[d]; if(!bk) continue;
      for(const c in bk){
        const keep=(bk[c]||[]).filter(e=>!(e&&e.f===f.name));
        if(keep.length) bk[c]=keep; else delete bk[c];
      }
      if(!Object.keys(bk).length) delete S.evals[d];
    }else{
      if(claimedElsewhere(d)) continue;
      delete S[st][d];
    }
  }

  // A ViciDial DAY file owns only its own v-tagged entries on that day - CallX rows for the
  // same day belong to another file and must survive. Removing it also releases the day, so
  // a multi-day range covering it can count again.
  if(f.type.startsWith('calls (ViciDial)')) for(const d of f.dates||[]){
    const bk=S.calls[d]; if(!bk) continue;
    for(const k in bk) if(bk[k]&&bk[k].v) delete bk[k];
    if(!Object.keys(bk).length){ delete S.calls[d]; if(S.callsMeta) delete S.callsMeta[d]; }
    if(S.viciDays) delete S.viciDays[d];
  }
  // A ViciDial RANGE file carries its own key in the registry type - drop the stored range.
  if(f.type.startsWith('vici range')&&S.vici) delete S.vici[f.type.replace('vici range ','').trim()];
  // cancellations key by contract, so drop exactly the ones this file contributed
  if(f.type.startsWith('cancellations')&&S.cancRows) for(const k in S.cancRows) if(S.cancRows[k].f===f.name) delete S.cancRows[k];
  if(f.type==='open cases') S.opencases=null;
  if(f.type==='open cases (lead mgmt)') S.opencasesLM=null;
  // closed cases key by case number, so drop exactly the ones this file contributed
  if(f.type==='closed cases'&&S.closedcases){
    for(const k in S.closedcases.rows) if((f.dates||[]).includes(S.closedcases.rows[k].d)) delete S.closedcases.rows[k];
    if(!Object.keys(S.closedcases.rows).length) S.closedcases=null;
  }
  if(f.type==='referrals'&&S.refs&&S.refs.f===f.name) S.refs=null;
  S.files.splice(idx,1);
  grossUpSales();   // sales are gross of cancellation - dropping either file re-derives them
  save(); rebuild(); render();
  // VAS mirrors its WHOLE state to the cloud KV blob (vas-state) — deleting a file and saving
  // overwrites that blob without it, so the removal reaches Supabase. Push NOW rather than wait
  // on save()'s 1.5s debounce, so a quick tab-close can't leave the deletion only local.
  if(typeof __cloudPush==='function' && window.__vasHydrated){ clearTimeout(__cloudT); __cloudPush(false); toast('Removed '+f.name+' — updated in the cloud'); }
  else toast('Removed '+f.name);
}

/* ================= identity resolution ================= */
let IDX=null;
const normFull = s => (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function buildIndex(){
  __rkMemo=Object.create(null);   // identity may have changed — every cached resolveKey answer is void
  IDX={byCode:{},byName:{},byCallx:{},tok:[],ruleLabel:{},ruleAlias:{}};
  /* The spec's own correction tables (§3), indexed once. These are the LAST resort in
     resolveKey — a roster that already carries the right "Call x" string resolves first —
     but they are what keeps identity right when the agent list goes stale, which open item
     OI-06 records that it does: 18 QA codes and 18 attendance codes match no roster sheet. */
  for(const k in MTD_RULES.diallerLabelCorrections) IDX.ruleLabel[normFull(k)]=MTD_RULES.diallerLabelCorrections[k];
  for(const k in MTD_RULES.nameAliases) IDX.ruleAlias[normName(k)]=normName(MTD_RULES.nameAliases[k]);
  for(const a of S.roster){
    IDX.byCode[a.code]=a;
    // dialer names can carry a DIFFERENT CB number than the employee code
    // (e.g. "Kyle Kisten CB-138" is employee CB137) — so the full "Call x"
    // string wins over the embedded code when resolving call records.
    if(a.callx) IDX.byCallx[normFull(a.callx)]=a.code;
    for(const n of [a.name,a.sf,a.callx]) if(n){ const k=normName(n); if(k) IDX.byName[k]=a.code; }
    { const t=nameTokens(a.name); if(t.length>=2) IDX.tok.push({code:a.code,t}); }
  }
}
/* MEMOISED (perf audit, 2026-08-27). The fallback chain below runs several string
   normalisations and, for owner-name keys that miss every index, an O(roster) token
   scan — and Lead Management alone calls this ~40,000 times per render over the
   closed-cases book (321ms of a 320ms build). The same few hundred distinct strings
   repeat throughout, so the answer is cached per string and the cache is dropped in
   buildIndex(), which runs on every rebuild — i.e. whenever the roster, the manual
   map or any upload could have changed an identity. */
let __rkMemo=Object.create(null);
function resolveKey(key){
  const kk=String(key);
  const hit=__rkMemo[kk]; if(hit!==undefined) return hit;
  return (__rkMemo[kk]=resolveKeyUncached(key));
}
function resolveKeyUncached(key){
  if(S.map[key]!==undefined) return S.map[key]==='__ignore__'?null:S.map[key];
  /* A BARE EMPLOYEE CODE, LEADING ZEROS AND ALL. ViciDial's call report writes the code
     zero-padded — CB014, CB016, CB047 — while the Agent List carries CB14, CB16, CB47. This
     returned null on the mismatch and stopped, so three real agents and 4h37m of talk went
     to Unmatched with nothing wrong anywhere. cbCode() already strips the padding (it parses
     the digits as base 10) and was sitting at the bottom of this function, unreachable for
     exactly the keys that needed it. Verified against the name: all three resolve to the
     same agent either way, so this corrects an identity that was already unambiguous rather
     than guessing at a new one. */
  if(/^CB\d+$/i.test(key)){
    const up=key.toUpperCase();
    if(IDX.byCode[up]) return up;
    const z=cbCode(up);                       // CB014 -> CB14
    return (z&&IDX.byCode[z])?z:null;
  }
  const fx=IDX.byCallx[normFull(key)]; if(fx) return fx;
  const nn=IDX.byName[normName(key)]; if(nn) return nn;
  /* The spec's dialler-label table, matched on the WHOLE label. It has to be consulted
     before cbCode() below, because that is exactly the fallback it exists to stop: the
     labels in it carry a CB number belonging to someone else, and "Kyle Kisten CB-138"
     resolving on its number pays 735 of his calls to Jabu Ntombela. */
  const rl=IDX.ruleLabel[normFull(key)]; if(rl&&IDX.byCode[rl]) return rl;
  // middle names: match on tokens, but only when exactly one roster agent contains them all
  const kt=nameTokens(key);
  if(kt.length>=2){ const h=IDX.tok.filter(e=>kt.every(x=>e.t.includes(x))); if(h.length===1) return h[0].code; }
  // spelled differently from the roster (spec §3 name aliases) — resolve the alias, then retry
  const al=IDX.ruleAlias[normName(key)]; if(al&&IDX.byName[al]) return IDX.byName[al];
  const c=cbCode(key); if(c&&IDX.byCode[c]) return c;
  return null;
}

/* ================= period & model ================= */
/* AS-AT CUT-OFF. Without one, "this month" quietly means "every date any uploaded file
   happens to carry" — and the sources almost never end on the same day: the HR register
   usually runs a day or two ahead of the dialler, which runs ahead of the money file. A
   tracker cut on the 4th then cannot be reconciled against a dashboard that has silently
   included the 5th, and every shift-derived column (Employed Shifts, Sales Target, GWP
   Target, Att %, SPD) reads high by a whole day with nothing wrong anywhere.
   This caps where the period ENDS without changing its shape — the month is still the month,
   week buckets and targets are unchanged, the window simply stops on the day you name. */
function applyAsAt(r,p){
  const a=S.ui.asAt;
  if(!a||p==='custom'||!r) return r;      // custom already has both ends under the user's hand
  if(a<r.from||a>=r.to) return r;         // outside the period, or not earlier than it already ends
  return {from:r.from,to:a};
}
/* The last date each source actually covers. When these disagree, the period silently
   stretches to the furthest one — which is exactly the reconciliation trap above. */
function sourceEnds(){
  const last=o=>{ const k=Object.keys(o||{}); return k.length?k.sort()[k.length-1]:null; };
  return {attendance:last(S.att), sales:last(S.sales), calls:last(S.calls)};
}
function periodRange(){
  const p=S.ui.preset||(S.ui.mode==='cycle'?'cycle':'month');
  return applyAsAt(periodRangeRaw(p),p);
}
function periodRangeRaw(p){
  const today=dkey(new Date());
  const mk=(from,to)=>({from,to});
  if(p==='today') return mk(today,today);
  if(p==='yesterday'){ const y=addDays(today,-1); return mk(y,y); }
  if(p==='7d') return mk(addDays(today,-6),today);
  if(p==='30d') return mk(addDays(today,-29),today);
  if(p==='mtd') return mk(today.slice(0,7)+'-01',today);
  if(p==='prevMonth'){ const [y,m]=today.split('-').map(Number);
    return mk(dkey(new Date(Date.UTC(y,m-2,1))),dkey(new Date(Date.UTC(y,m-1,0)))); }
  if(p==='custom'&&S.ui.from&&S.ui.to) return S.ui.from<=S.ui.to?mk(S.ui.from,S.ui.to):mk(S.ui.to,S.ui.from);
  const mo=S.ui.month||latestMonth(); if(!mo) return null;
  const [y,m]=mo.split('-').map(Number);
  if(p==='cycle') return mk(dkey(new Date(Date.UTC(y,m-2,26))),dkey(new Date(Date.UTC(y,m-1,25))));
  return mk(mo+'-01',dkey(new Date(Date.UTC(y,m,0))));
}
function allDataDates(){
  return new Set([...Object.keys(S.sales),...Object.keys(S.calls),...Object.keys(S.tracker)]);
}
function latestMonth(){
  const ds=[...allDataDates()].sort();
  return ds.length?ds[ds.length-1].slice(0,7):new Date().toISOString().slice(0,7);
}

let M=null, MP=null; // current & previous-period models
function prevRange(){
  const r=periodRange(); if(!r) return null;
  const p=S.ui.preset||(S.ui.mode==='cycle'?'cycle':'month');
  if(p==='cycle'){ const [y,m]=(S.ui.month||latestMonth()).split('-').map(Number);
    return {from:dkey(new Date(Date.UTC(y,m-3,26))),to:dkey(new Date(Date.UTC(y,m-2,25)))}; }
  if(p==='month'||p==='prevMonth'||p==='mtd'){
    const [y,m]=r.from.split('-').map(Number);
    return {from:dkey(new Date(Date.UTC(y,m-2,1))),to:dkey(new Date(Date.UTC(y,m-1,0)))};
  }
  const len=Math.round((new Date(r.to+'T00:00:00Z')-new Date(r.from+'T00:00:00Z'))/86400000)+1;
  return {from:addDays(r.from,-len),to:addDays(r.from,-1)};
}
function monthlyHistory(){
  const months={};
  const addDay=(d,s,g)=>{ const m=d.slice(0,7);
    const o=months[m]=months[m]||{sales:0,gwp:0,src:'daily'}; o.sales+=s; o.gwp+=g; };
  for(const d in S.sales){ let s=0,g=0; for(const v of Object.values(S.sales[d])){s+=v.n;g+=v.gwp;} addDay(d,s,g); }
  for(const d in S.tracker){ if(S.sales[d]) continue; let s=0,g=0; for(const v of Object.values(S.tracker[d])){s+=v.sales;g+=v.gwp;} addDay(d,s,g); }
  return Object.entries(months).sort((a,b)=>a[0].localeCompare(b[0])).map(([m,o])=>({month:m,...o}));
}
/* Drop PHANTOM file registrations — an entry for a date-bearing source that recorded a row
   count but stored ZERO days. These were minted before VAS could read .xlsx: the uploader
   decoded the ZIP as text, parseCSV split the noise into thousands of junk "rows", the type
   still matched on header strings inside the workbook XML, then every row failed its date
   guard. The registry then advertised a file that contributed nothing, so the Upload Station
   and the Data Trust bar both lied. Runs from rebuild() so it heals state arriving from ANY
   path — localStorage, an ingest, or a cloud hydrate that carries the old junk back.
   Roster is exempt (it legitimately has no dates); open cases is judged on whether its
   statuses actually resolved, since "?" for every row is the same binary-garbage tell. */
function pruneDeadFiles(){
  const before=(S.files||[]).length;
  S.files=(S.files||[]).filter(f=>{
    // Entries carrying a content hash were ingested AFTER the xlsx fix by a reader that
    // verified them — they are never phantoms, and a 0-date calls entry can be legitimate
    // (every one of its days was covered more fully by another file). Keeping it keeps its
    // hash, which is what stops tomorrow's re-upload of the same file re-parsing 50 MB.
    /* Lead Allocation retired 2026-08-27: its registry entries (hashed or not) and its book
       are cleared here so state saved before the cut heals itself on the next rebuild.
       Match on the FULL type — split(' (')[0] collapses 'open cases (lead mgmt)' to
       'open cases' too, which is Lead Management's and must survive. */
    if(f.type==='open cases'){ S.opencases=null; return false; }
    if(f.hash) return true;
    const t=String(f.type||'').split(' (')[0];
    if(t==='roster') return true;
    if(f.type==='open cases (lead mgmt)'){ const dead=!(S.opencasesLM&&(S.opencasesLM.rows||[]).length); if(dead) S.opencasesLM=null; return !dead; }
    if(t==='closed cases') return !!(S.closedcases&&Object.keys(S.closedcases.rows||{}).length);
    return (f.dates||[]).length>0;
  });
  return before-(S.files||[]).length;
}
function rebuild(){
  normalizeState();      // hydrate() may have just replaced S with a blob missing keys
  /* RE-DERIVE SALES FROM THE STORED INPUTS, EVERY BUILD. This used to run only at upload, so
     n and gwp were frozen under whatever cancellation rule was in force the day the file
     landed — change the rule and every already-uploaded day kept the old answer until it was
     uploaded again. It is idempotent by construction (`a` holds the ACTIVE units and is never
     mutated; the cancelled ones are re-added, or not, from S.cancRows each time), so running
     it here simply means the CURRENT rule is the one on screen.
     What this can and cannot fix: the gross/net cancellation rule is re-derivable from stored
     data and so applies immediately. The account→case REGRAIN is not — Case Number was never
     stored by the old ingest — so those days keep account units until their export is
     re-uploaded, which staleGrainBanner() says out loud. */
  grossUpSales();
  pruneDeadFiles();
  buildIndex();
  const r=periodRange();
  M=r?buildModel(r, r.from+'|'+r.to):null;
  const pr=prevRange();
  MP=pr?buildModel(pr, pr.from+'|'+pr.to):null;
  VCHK=M?validateMTD(M):null;      // rule checks run on every rebuild, so every upload is checked
  /* THE LIST MUST HAVE TAKEN EFFECT — checked on every build (Nick, 2026-08-27: "everytime
     the agent list is uploaded data must change"). When the modelled period is the CURRENT
     month — the month recordOrgList hands to the latest list — every roster agent the model
     reports on must read the roster's campaign and team leader. Any survivor of a future
     regression becomes a NAMED red banner (listAppliedBanner) and taints the applied toast,
     never silence. Past months are exempt: they are supposed to differ from today's list. */
  window.__listCheck=(function(){
    try{
      if(!M||!S.roster.length||!r) return null;
      /* Against the month the LIST rewrote, not the calendar month (audit round 3,
         2026-08-27). recordOrgList rewrites the month of rosterAsOf — a list uploaded with
         an "effective from" in July rewrites July, and comparing August facts to it painted
         the red banner telling the user to re-upload, which could not help. With no receipt
         yet, fall back to the calendar month. */
      const __lm=(S.rosterEffect&&S.rosterEffect.asOf)?String(S.rosterEffect.asOf).slice(0,7):dkey(new Date()).slice(0,7);
      if(String(r.from).slice(0,7)!==__lm) return null;
      const by={}; (M.agents||[]).forEach(a=>by[a.code]=a);
      const bad=[];
      for(const a of S.roster){
        if(a.campaign==='VT') continue;                 // not a reported campaign
        const m=by[a.code]; if(!m) continue;            // excluded / not covered — not a mismatch
        const tlOk=(m.tl||'')===(a.tl||'')||(provisionalTL(m.tl)&&provisionalTL(a.tl));
        /* m is a SPREAD of the roster row, so m.campaign===a.campaign always — the campaign
           half of this check was a tautology and could never fire. The campaign the model
           actually used is primaryCamp (audit round 6, second pass). */
        const mCamp=(M.primaryCamp&&M.primaryCamp[a.code])||m.campaign;
        if(mCamp!==a.campaign||!tlOk)
          bad.push({code:a.code,name:a.name||a.code,model:mCamp+' / '+(m.tl||'—'),list:a.campaign+' / '+(a.tl||'—')});
      }
      return {bad,at:Date.now()};
    }catch(e){return null}
  })();
  if(S.rosterEffect&&S.rosterEffect.pending){
    delete S.rosterEffect.pending;
    const fe=S.rosterEffect, n=(window.__listCheck&&window.__listCheck.bad.length)||0;
    /* Deferred past handleFiles' own "N files loaded" toast — there is one toast element,
       and the receipt is the message worth keeping on screen. */
    setTimeout(function(){ toast('Agent List applied — '+fmtNum(fe.agents)+' agent(s): '+fmtNum(fe.moved)+' moved, '+fmtNum(fe.fresh)+' new, '
      +fmtNum(fe.left)+' left. '+(n?'BUT '+fmtNum(n)+' agent(s) still mismatch the list — see the red banner on Month to Date.'
      :'The whole of '+String(fe.asOf||'').slice(0,7)+' now reads this list.'),10000); },1600);
  }
}

/* ================= RULE CHECKS (spec §11) =================
   The reconciliation checks V01-V22, run against the built model after every upload. This is
   the step that turns the rule book from documentation into something enforced: a figure that
   breaks one of these is wrong in a way that is invisible on screen — a duplicated agent-day,
   a cancellation counted against a sale that isn't there, a campaign token that quietly falls
   out of both totals.

   Each returns {id, sev, ok, msg}. `sev:'error'` is a figure you must not publish;
   `sev:'warn'` is provisional data you should know about. Checks the spec defines against the
   EXCEL workbook rather than the model (V18 pivot cache ref, V19 cached formula values) are
   not applicable to a live dashboard and are reported as such by exportTracker instead. */
let VCHK=null;
function validateMTD(m){
  const out=[], add=(id,sev,ok,msg)=>out.push({id,sev,ok,msg});
  const F=m.facts, R=m.range;
  const rosterCodes=new Set(S.roster.map(a=>a.code));
  const money=F.filter(f=>f.campaign!=='VT');   // VT carries dialler-counted sales and no GWP

  /* V01 — one row per agent per day. A duplicate double-counts everything on the row.
     rangeAgg rows are exempt and must be: a multi-day ViciDial pull has no per-day detail, so
     its talk is carried on a deliberate extra row against the last covered day, with emp, act,
     target and sales all zero. It adds a row without adding a shift or a sale. Counting those
     as duplicates reported 24 phantom failures on a clean August drop. */
  { const seen=new Set(), dup=[];
    for(const f of F){ if(f.rangeAgg) continue; const k=f.date+'|'+f.code; if(seen.has(k)) dup.push(k); seen.add(k); }
    add('V01','error',!dup.length, dup.length?dup.length+' duplicate agent-day row(s), e.g. '+dup.slice(0,3).join(', '):'no duplicate Date + Emp Code'); }

  // V02 — Employed Shifts is a count of rows, never a number in a row.
  { const bad=F.filter(f=>f.emp>1);
    add('V02','error',!bad.length, bad.length?bad.length+' row(s) carry Employed Shifts > 1':'every row carries Employed Shifts of 1 or 0'); }

  /* V03/V04 — sales and GWP must still equal what the BI union says, after every transform.
     Scoped to the money campaigns. Vehicle Tracking agents DO appear in the BI export (20
     sales / R4 278 in the reference period) but tracker units are not VAS revenue: the fact
     table counts VT sales from dialler dispositions and carries no GWP for them, so
     including that money on the recompute side would report a permanent R4 278 discrepancy
     that is not one. Unmapped owners are outside both sides and are V14's job, not this. */
  { const campOfCode={}; S.roster.forEach(a=>campOfCode[a.code]=a.campaign);
    let n=0,g=0;
    for(const d in S.sales){ if(d<R.from||d>R.to) continue;
      for(const k in S.sales[d]){ const c=resolveKey(k); if(!c||!rosterCodes.has(c)) continue;
        // only the campaigns this dashboard reports on — the rest are tallied by offCampaign
        if(!CAMPS.includes(campOfCode[c])) continue;
        if(S.settings.applyExclusions!==false&&MTD_RULES.excludeAgents[c]) continue;
        n+=S.sales[d][k].n; g+=S.sales[d][k].gwp; } }
    const fn=money.filter(f=>!f.provisional).reduce((a,f)=>a+f.sales,0);
    const fg=money.reduce((a,f)=>a+f.gwp,0);
    add('V03','error',Math.abs(fn-n)<0.5, 'Sales Achieved '+fmtNum(fn)+' vs BI union '+fmtNum(n));
    add('V04','error',Math.abs(fg-g)<=1, 'GWP '+fmtR(fg)+' vs round(charge x '+MTD_RULES.vat+') per account '+fmtR(g)); }

  // V05 — employed shifts should be the roster present on each dialling day, and no more.
  { const emp=F.reduce((a,f)=>a+f.emp,0), ag=new Set(F.filter(f=>f.emp).map(f=>f.code)).size, dd=m.diallingDays;
    add('V05','warn',emp<=ag*dd, 'Employed Shifts '+fmtNum(emp)+' over '+ag+' agents x '+dd+' dialling day'+(dd===1?'':'s')); }

  /* V06 — every fact row must sit in a reported campaign. Anything else is dropped upstream
     and tallied into offCampaign, so a stray token arriving here means the filter leaked and
     a campaign is silently inflating a total it does not belong to. */
  { const known=new Set(CAMPS), bad=[...new Set(F.map(f=>f.campaign))].filter(c=>!known.has(c));
    add('V06','error',!bad.length, bad.length?'unreported campaign token(s) in the fact table: '+bad.join(', '):'every row is '+CAMPS.join(' or ')); }

  // V07 — more cancellations than sales means the two are counted in different units.
  { const by={}; money.forEach(f=>{ const t=by[f.code]=by[f.code]||{s:0,c:0,e:0}; t.s+=f.sales; t.c+=f.canc; t.e+=(f.emp||0)+(f.act||0)+(f.talk||0); });
    /* An agent whose ONLY row in the period is a cancellation legitimately has c>s: under the
       net rule the sale itself is gone, and the day may carry no register at all. That row is
       kept deliberately (see the skip guard in buildModel) so the cancellation is not lost —
       it must not then raise an ERROR here, which non-negotiable 12 says may never ship.
       Anyone who actually worked in the period is still checked (audit round 6, 2026-08-28). */
    const bad=Object.entries(by).filter(([,t])=>t.c>t.s&&t.e>0);
    add('V07','error',!bad.length, bad.length?bad.length+' agent(s) show more cancellations than sales: '+bad.slice(0,3).map(([c])=>c).join(', '):'cancellations never exceed sales'); }

  // V08 — an agent with no roster row has no target, tenure or team leader.
  { const bad=[...new Set(F.map(f=>f.code))].filter(c=>!rosterCodes.has(c));
    add('V08','error',!bad.length, bad.length?bad.length+' agent(s) not on the roster: '+bad.slice(0,4).join(', '):'every agent resolves to a roster Employee Code'); }

  // V09/V10 — one row per agent per campaign, and the two sales campaigns must not overlap.
  /* V09 tested Object.keys against a Set OF THE SAME KEYS — always equal, so it could never
     fail (audit round 3, 2026-08-27). The real risk it was meant to cover is one agent-day
     landing in TWO campaigns, which is what actually corrupts a per-campaign total. */
  { const seenCD={}; let dup=0; const dupEx=[];
    for(const f of F){ const k=f.code+'|'+f.date;
      if(seenCD[k]&&seenCD[k]!==f.campaign){ dup++; if(dupEx.length<3) dupEx.push(f.code+' '+f.date+': '+seenCD[k]+'+'+f.campaign); }
      seenCD[k]=f.campaign; }
    add('V09','error',!dup, dup?dup+' agent-day(s) counted in two campaigns: '+dupEx.join(', '):'no agent-day appears in two campaigns');
    const cu=new Set(Object.keys(m.mtdCC.Cuddle||{})), ov=Object.keys(m.mtdCC.Courtesy||{}).filter(c=>cu.has(c));
    add('V10','error',!ov.length, ov.length?ov.length+' agent(s) in both Cuddle and Courtesy: '+ov.slice(0,3).join(', '):'Cuddle and Courtesy agent sets are disjoint'); }

  // V11 — structural: totalRow() recomputes every ratio from the summed numerator and
  // denominator, so an averaged percentage cannot reach a total row by construction.
  add('V11','error',true,'grand-total ratios are recomputed from sums, never averaged');

  // V12 — structural: cancellations are a column on the fact row, defaulting to 0, not a
  // lookup table an agent can be absent from. The workbook's failure mode (a missing agent
  // falling through IFERROR to an indistinguishable 0) cannot occur here; exportTracker
  // re-asserts it when it writes the N:O range.
  add('V12','error',true,'every agent in the fact table carries a cancellations value');

  // V13 — nothing outside the window survived filtering.
  { const bad=F.filter(f=>f.date<R.from||f.date>R.to);
    add('V13','error',!bad.length, bad.length?bad.length+' row(s) fall outside '+R.from+'..'+R.to:'no record falls outside '+R.from+' .. '+R.to); }

  // V14 — unmapped source rows are money and calls attributed to nobody.
  { const u=Object.keys(m.unmatched||{});
    add('V14','warn',!u.length, u.length?u.length+' unmapped source name(s): '+u.slice(0,3).map(esc).join(', '):'every source row resolved to an agent'); }

  // V15 — the sources ending on different days is the single commonest false alarm.
  { const e=sourceEnds(), ends=[...new Set(Object.values(e).filter(Boolean))];
    add('V15','warn',ends.length<=1||!!S.ui.asAt, ends.length<=1?'all sources end on the same day'
      :'sources end on different days (attendance '+(e.attendance||'—')+', sales '+(e.sales||'—')+', calls '+(e.calls||'—')+')'+(S.ui.asAt?' — capped by the as-at date':' — set an as-at date to pin the window')); }

  // V16 — referrals have no source file at all (open item OI-01).
  { const anyRef=F.some(f=>f.ref>0);
    add('V16','warn',anyRef,anyRef?'referrals present':'no upload carries Referrals — the column reads 0 and is not a measurement'); }

  // V17 — an agent who sold or dialled with no attendance row breaks Att % silently.
  { const bad=F.filter(f=>(f.talk>0||f.sales>0)&&((S.att[f.date]||{})[f.code])==null);   // '' IS a row (audit round 3)
    const codes=[...new Set(bad.map(f=>f.code))];
    add('V17','warn',!bad.length, bad.length?codes.length+' agent(s) worked with no attendance record: '+codes.slice(0,3).join(', '):'attendance exists for every agent with calls or sales'); }

  /* V18 — A WHOLE CAMPAIGN WITH NO DIALLER RECORD. Ave Talk Time reading 0:00:00 down an
     entire tab is not a calculation fault, it is a missing upload, and on screen the two look
     identical. Establishing that the Cuddle floor simply had no dialler data — every agent
     employed, selling, and with no call record, because ViciDial's export was pulled without
     their user groups — took a long investigation that this check would have ended in a
     glance. Named per campaign, and only where there are shifts to compare against, so an
     empty period stays quiet. */
  { const byCamp={};
    for(const f of F){ const t=byCamp[f.campaign]=byCamp[f.campaign]||{codes:new Set(),dial:new Set(),emp:0};
      t.codes.add(f.code); t.emp+=f.emp; if((f.talk||0)>0) t.dial.add(f.code); }
    const dark=Object.entries(byCamp).filter(([,t])=>t.emp>0&&t.dial.size===0);
    const thin=Object.entries(byCamp).filter(([,t])=>t.emp>0&&t.dial.size>0&&t.dial.size<t.codes.size/2);
    /* WARN, however loud the message reads. A campaign with no dialler data yet is the
       ordinary state of every morning before the export lands, and non-negotiable 12 says
       never ship a figure with an error-severity FAIL — as an error this would condemn the
       day's first upload over a file that is merely not in yet. */
    add('V18','warn', !dark.length&&!thin.length,
      dark.length
        ? dark.map(([c,t])=>`${c}: not one of its ${t.codes.size} agents has a dialler record — Ave Talk reads 0,0 min for the whole tab. The dialler export does not cover this campaign.`).join(' ')
        : (thin.length
            ? thin.map(([c,t])=>`${c}: only ${t.dial.size} of ${t.codes.size} agents have a dialler record`).join('; ')
            : 'every reported campaign has dialler coverage')); }

  // V20/V21/V22 — QA integrity.
  { let zero=0,zeroCF=0,ev=0,pass=0,coach=0,cf=0,upheld=0,open=0;
    for(const d in S.evals){ if(d<R.from||d>R.to) continue;
      for(const c in S.evals[d]) for(const v of S.evals[d][c]){
        if(typeof v==='number'){ ev++; continue; }
        ev++;
        const dec=(v.dec||'').toLowerCase();
        if(v.s===0){ zero++; if(dec.includes('critical')) zeroCF++; }
        if(dec.includes('critical')) cf++; else if(dec.includes('coach')) coach++; else pass++;
        if((v.dsp||0)>0&&/upheld/i.test(v.dspSt||'')) upheld++;
        if(v.st&&!/risk mitigated/i.test(v.st)) open++;
      } }
    add('V20','warn',zero===zeroCF, zero?(zeroCF+' of '+zero+' zero scores are Critical Fails'):'no zero scores in the period');
    add('V21','error',pass+coach+cf===ev, 'Pass '+pass+' + Coaching '+coach+' + Critical Fail '+cf+' = '+(pass+coach+cf)+' against '+ev+' evaluations');
    add('V22','warn',!upheld, upheld?upheld+' upheld dispute(s) — the period\'s QA is provisional':'no upheld disputes in the period');
  /* V23 — a campaign the Agent List names and the rule book does not. Reported under the
     Courtesy rules (Nick, 2026-09-03) until the rule book gives it its own — said here so
     nobody mistakes the borrowed rules for a decision about that campaign. */
  { const nc=m.newCampaigns||[];
    add('V23','warn',!nc.length, nc.length?'campaign(s) on the Agent List the rule book does not name — reported under the Courtesy rules until it does: '+nc.join(', '):'every reported campaign is named in the rule book'); }
    if(open) out.push({id:'QA',sev:'warn',ok:false,msg:open+' of '+ev+' evaluations are not closed — QA is provisional'}); }

  /* Campaigns deliberately left out of this dashboard. Reported every build, with the sales
     and GWP they take with them, so "the totals look light" always has an answer on screen. */
  { const off=Object.entries(m.offCampaign||{});
    if(off.length) out.push({id:'campaign',sev:'info',ok:true,
      msg:'not reported on: '+off.map(([c,v])=>`${c} (${v.agents} agent${v.agents===1?'':'s'}, ${v.sales} sale${v.sales===1?'':'s'}${v.gwp?', '+fmtR(v.gwp):''})`).join('; ')
        +' — excluded by the reported-campaigns rule, not missing data'}); }

  // The exclusions are applied, so they must be visible: a head count short by three with no
  // explanation is exactly the kind of silent hole the spec keeps warning about.
  if(S.settings.applyExclusions!==false){
    const ex=Object.keys(MTD_RULES.excludeAgents).filter(c=>rosterCodes.has(c));
    if(ex.length) out.push({id:'§5',sev:'info',ok:true,msg:ex.length+' agent(s) excluded by the maintained list: '+ex.map(c=>c+' — '+MTD_RULES.excludeAgents[c]).join('; ')});
  }
  return out;
}
/* Saturday in the calendar sense (dates are YYYY-MM-DD, weekday-safe in UTC). Governed by
   MTD_RULES.saturdayShiftsFrom: before that date a Saturday is an ordinary day. */
function saturdayDataOnly(d){
  const from=MTD_RULES.saturdayShiftsFrom; if(!from||d<from) return false;
  return new Date(d+'T00:00:00Z').getUTCDay()===6;
}
/* HOW FAR THE DATA REACHES (never-stale plan, Phase 2, 2026-09-07). The trust bar used to count
   files by upload age; what a manager needs is the last DAY each source covers, against the day
   it should cover. expectedReach(): the daily drop lands by 13:00 SAST with yesterday's data,
   and there is no Sunday data — so before 13:00 the expectation is the day before yesterday,
   after it yesterday, Sundays skipped. Both travel in the agent digest (dataReach,
   expectedReach) so the Worker's sentinel and Agent Analytics read the same answer. */
function dataReach(){
  const mx=o=>{const ks=Object.keys(o||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();return ks.length?ks[ks.length-1]:null};
  return {sales:mx(S.sales),calls:mx(S.calls),attendance:mx(S.att),qa:mx(S.evals),
    roster:{n:(S.roster||[]).length,fp:S.rosterFp||null}};
}
function expectedReach(nowMs,saturday){
  if(saturday===undefined) saturday=true;
  const sast=new Date((nowMs||Date.now())+2*3600000);
  const d=new Date(Date.UTC(sast.getUTCFullYear(),sast.getUTCMonth(),sast.getUTCDate()));
  d.setUTCDate(d.getUTCDate()-(sast.getUTCHours()>=13?1:2));
  while(d.getUTCDay()===0||(!saturday&&d.getUTCDay()===6)) d.setUTCDate(d.getUTCDate()-1);   // no Sunday data; Saturday only for sources that dial (sales, calls)
  return d.toISOString().slice(0,10);
}
const REACH_SATURDAY={sales:true,calls:true,attendance:false,qa:false};
function buildModel(range, periodKey){
  let M_refsAreTotals=false;
  if(!range) return null;
  const newCampaigns=refreshCamps();    // CAMPS = rule book + whatever else the roster names
  const dates=[...allDataDates()].filter(d=>d>=range.from&&d<=range.to).sort();
  /* DIALLING DAYS ARE THE REGISTER'S DAYS (spec §1), not every date some file happens to
     carry. 01 Aug 2026 is the case that makes the difference: a Saturday with four sales
     dated to it and no attendance register at all. It contributes money and no shift — both
     systems agree on that — but counting it as a dialling day divides the TL-level
     SPD (Sales / Employed HC / Dialing Days) by three instead of two and understates every
     team by a third. Falls back to the data dates when no register is loaded, so the figure
     degrades to "what we know" rather than to zero. */
  const attDates=Object.keys(S.att).filter(d=>d>=range.from&&d<=range.to&&Object.keys(S.att[d]||{}).length&&!saturdayDataOnly(d)).sort();
  /* A dialling day needs BOTH a register and something to report on it. The register runs
     ahead of the other exports — on the August drop it reaches the 6th while the dialler and
     BI stop at the 5th — and those trailing register-only days carry no fact rows at all, so
     counting them divides TL-level SPD by a day nobody worked. Counting only the fact dates
     has the opposite fault (01 Aug is a Saturday with sales and no register). The intersection
     is the honest answer; the fallbacks keep the figure meaningful when a source is missing
     entirely rather than collapsing it to zero. */
  const factDates=new Set(dates);
  /* …and a Saturday under the rule is not a dialling day whichever fallback answers */
  const diallingDays=attDates.filter(d=>factDates.has(d)).length||attDates.length||dates.filter(d=>!saturdayDataOnly(d)).length;

  // termination map: first date an agent is marked Terminated/Resigned
  const term={};
  for(const d of Object.keys(S.att).sort()){
    for(const code in S.att[d]) if(attWeight(S.att[d][code])===-1 && !(code in term)) term[code]=d;
  }

  // resolve raw aggregate keys -> codes per date
  const salesBy={}, callsBy={}, cancBy={}, unmatched={};
  /* A CANCELLATION IS A CANCELLED SALE, SO IT IS COUNTED EXACTLY LIKE ONE — same unit, same
     date (Nick's cancellation pivot, 2026-08-18: filtered on Contract Create Date, "Distinct
     Count of Case Number"). It is filed under the day the SALE was made, which is also what
     VR12 and grossUpSales use, so sales and cancellations stay on one grain and "% of
     cancellations to sales" compares like with like.
     A brief experiment dated these on the DEACTIVATE date instead; that answers "how many
     cancellations happened this month", which is a different question and put cancellations
     in a period their sale never appeared in. The pivot settled it. */
  const cancByDate={}; for(const k in S.cancRows){ const r=S.cancRows[k];
    (cancByDate[r.d]=cancByDate[r.d]||[]).push({...r,k}); }
  for(const d of dates){
    salesBy[d]={}; callsBy[d]={}; cancBy[d]={};
    for(const [k,v] of Object.entries(S.sales[d]||{})){
      const c=resolveKey(k);
      if(c){ const t=salesBy[d][c]=salesBy[d][c]||{n:0,gwp:0,gwpEx:0,canc:0};
        t.n+=v.n; t.gwpEx+=(v.x!=null?v.x:(v.gwp||0)/MTD_VAT); t.gwp=Math.round(t.gwpEx*MTD_VAT); t.canc+=v.canc||0; }
      else if(resolveKey(k)!==null||S.map[k]!=='__ignore__'){ const u=unmatched[k]=unmatched[k]||{src:'sales',n:0,gwp:0}; u.n+=v.n; u.gwp+=v.gwp||0; }
    }
    /* Cancellations are stored per CONTRACT and bucketed onto the date the SALE was made.
       They are counted per ACCOUNT, because that is the unit Sales Achieved counts in: one
       cancelled account carrying three contract lines is ONE cancellation, not three, and
       counting the lines trebled every multi-service cancellation against the workbook.
       Records stored before accounts were kept fall back to the contract key, so an older
       cloud blob still counts what it always counted rather than collapsing to one. */
    const cancAcc={};
    for(const rec of cancByDate[d]||[]){
      const c=resolveKey(rec.owner);
      /* THE PIVOT COUNTS DISTINCT CASE NUMBER, and its "(blank)" row is load-bearing: a
         cancellation row with NO case number is a recurring line, not a cancelled sale, and
         lands in (blank) rather than against the agent — the exact mirror of uncased rows on
         the sales side. Enoch's third August cancellation is one of these, which is why the
         pivot says 2 where account-counting said 3.
         Three shapes of stored row, three treatments:
           c = '21231404'  -> count the case (current ingest, case present)
           c = null        -> do NOT count — the export itself says there is no case
           c missing       -> legacy row from before cases were stored: fall back to the
                              account it always counted; an Inactive re-upload upgrades it. */
      if(c){ const unit=(rec.c!==undefined)?rec.c:(rec.a||rec.k);
        if(unit) (cancAcc[c]=cancAcc[c]||new Set()).add(unit); }
      else if(S.map[rec.owner]!=='__ignore__'){ const u=unmatched[rec.owner]=unmatched[rec.owner]||{src:'cancellations',n:0}; u.n++; }
    }
    for(const c in cancAcc) cancBy[d][c]=cancAcc[c].size;
    const byDialler={};
    for(const [k,v] of Object.entries(S.calls[d]||{})){
      const c=resolveKey(k);
      if(c){
        /* ONE DIALLER PER AGENT PER DAY. CallX stores its rows against the raw dialler
           string and ViciDial against the agent's name, so the same agent can hold an
           entry from BOTH systems on one day while Cuddle migrates. Adding them would pay
           one shift twice, so each source is totalled separately and the FULLER one is
           taken - decided here, at model-build time, so the answer never depends on which
           file was uploaded first. */
        const slot=byDialler[c]=byDialler[c]||{v:null,o:null};
        const w=v.v?'v':'o';
        const t=slot[w]=slot[w]||{talk:0,calls:0,ans:0,opt:0,saleD:0};
        t.talk+=v.talk; t.calls+=v.calls; t.ans+=(v.ans||0); t.opt+=v.opt; t.saleD+=v.saleD;
      }
      /* AN UNMATCHED DIALLER LOGIN IS TALK TIME NOBODY IS CREDITED WITH. Counting the calls
         alone hid the size of it: 161 hours sat outside every agent's record while the floor
         read as if those calls never happened. Keep the HOURS too, and separate the three
         reasons a login fails to match, because they need different fixes:
           · a TEAM LEADER dialling  — correct to exclude from agent rows, nothing to fix
           · a system/training login — already excluded by rule, nothing to fix
           · anyone else            — a real person missing from the Agent List, which is a
             data fix and the only one of the three worth chasing. */
      else if(S.map[k]!=='__ignore__'){
        const u=unmatched[k]=unmatched[k]||{src:'calls',n:0,talk:0,kind:null};
        u.n+=v.calls; u.talk+=(v.talk||0);
        if(u.kind==null){
          /* Resolve the alias FIRST: a team leader's dialler login spells their name its own
             way ('Dharmendra Bhudoo' for Dhamendra Budhu), and without the alias they land in
             the missing-agent list, which is the one bucket that implies someone should act.
             System and training logins are filtered here as well as at ingest, so the stored
             data is classified correctly without needing every file uploaded again. */
          const al=MTD_RULES.nameAliases||{};
          const aliasOf=s=>{ for(const key in al) if(normName(key)===normName(s)) return al[key]; return s; };
          const nk=normName(aliasOf(k));
          const sysPat=(MTD_RULES.viciCallReport.nonAgentPatterns||[]).map(x=>new RegExp(x,'i'));
          const sysList=(MTD_RULES.viciCallReport.nonAgentUsers||[]).map(s=>s.toUpperCase());
          const isSys=sysList.includes(String(k).toUpperCase().trim())||sysPat.some(rx=>rx.test(String(k).trim()));
          const isTL=S.roster.some(a=>a.tl&&normName(a.tl)===nk);
          u.kind=isSys?'system login':(isTL?'team leader':'missing from the Agent List');
        }
      }
    }
    // take the fuller of the two diallers for each agent on this day - never the sum
    for(const c in byDialler){ const s=byDialler[c];
      callsBy[d][c]=(s.v&&s.o)?((s.v.talk>=s.o.talk)?s.v:s.o):(s.v||s.o); }
  }


  // week buckets
  const mondays=[...new Set(dates.map(mondayOf))].sort();
  const weekOf={}; dates.forEach(d=>{ weekOf[d]=mondays.indexOf(mondayOf(d))+1; });

  // day-agent facts — one row per agent per dialing day, like the workbook's daily sheet.
  // Agents can work a different campaign on different days, so campaign/TL come from the
  // tracker row when that day was imported from a tracker workbook, else from the roster.
  const facts=[];
  /* Campaigns this dashboard does not report on (MTD_RULES.reportedCampaigns). They are
     counted as they are dropped — agents, sales and GWP — so the Rule checks panel can say
     exactly what is not in the totals. A campaign leaving the report silently is the bug the
     spec spent a whole section on; leaving it out LOUDLY is a decision. */
  const offCampaign={};
  const attCovered=d=>!!S.att[d]&&Object.keys(S.att[d]).length>0;
  const metaOf={}; S.roster.forEach(a=>{ metaOf[a.code]=a; });
  /* hoisted above the facts loop — the loop reads it, and the fuller referral block below
     (refsFromFile / refOf) runs after the loop for the aggregate paths */
  const refsByDay=(S.refs&&S.refs.by&&S.refs.byDay)?S.refs.byDay:null;
  for(const d of dates){
    const hasSalesData=!!S.sales[d]; const trk=S.tracker[d]||{};
    // On days whose only record is an imported tracker workbook, the workbook's rows ARE
    // the register — don't synthesise shifts for roster agents it doesn't contain.
    const trackerOnlyDay=!hasSalesData&&!S.calls[d]&&Object.keys(trk).length>0;
    const codes=trackerOnlyDay?new Set(Object.keys(trk)):new Set([...S.roster.map(a=>a.code),...Object.keys(trk)]);
    for(const code of codes){
      /* AGENT EXCLUSION LIST (spec §5). Three agents the reference tracker leaves out
         entirely — sick leave, suspension, and one who never started. This is NOT derivable
         from the data and the spec says so: CB143 has an identical all-period Sick Leave
         status and IS included. It is a maintained list, confirmed monthly (open item
         OI-10), and every exclusion is reported by the validation panel rather than being
         a silent hole in the head count. */
      if(S.settings.applyExclusions!==false && MTD_RULES.excludeAgents[code]) continue;
      const a=metaOf[code], tr=trk[code];
      /* WHO OWNED THIS AGENT ON THIS DAY — never who owns them now. `a` is the live roster
         row and is the wrong answer for any date before the last reorganisation; asking it
         is what used to move an agent's whole sales history to their new team leader the
         moment a fresh Agent List landed. Order: the day's own tracker row (it states the
         team leader for that date), then the effective-dated history, then the live roster
         as the last resort for an agent we have never observed being assigned. */
      const oh=orgAt(code,d);
      const camp=campOf((tr&&tr.campaign)||(oh&&oh.campaign)||(a&&a.campaign));
      if(!CAMPS.includes(camp)){
        // not a reported campaign — tally what is being left out, then drop the row
        const sd0=salesBy[d][code];
        const t=offCampaign[camp]=offCampaign[camp]||{agents:new Set(),sales:0,gwp:0};
        t.agents.add(code); if(sd0){ t.sales+=sd0.n; t.gwp+=sd0.gwp; }
        continue;
      }
      const started=tr?true:(!a?.start||a.start<=d);
      const terminated=term[code]&&d>=term[code];
      let emp=(started&&!terminated)?1:0;
      const sd=salesBy[d][code], cd=callsBy[d][code];
      let sales=0,gwp=0,gwpEx=0,canc=(cancBy[d]||{})[code]||0,provisional=false;
      if(camp==='VT'){
        // tracker-unit sales never appear in the Power BI money source —
        // count "Sale Made" dispositions from the dialer instead (no GWP).
        if(cd&&cd.saleD){ sales=cd.saleD; provisional=true; }
      }
      else if(hasSalesData){ if(sd){sales=sd.n;gwp=sd.gwp;gwpEx=sd.gwpEx||0;} }
      else if(tr){ sales=tr.sales; gwp=tr.gwp; gwpEx=tr.gwp/MTD_VAT; }
      else if(cd&&cd.saleD){ sales=cd.saleD; gwp=cd.saleD*S.gwpPerUnit; gwpEx=gwp/MTD_VAT; provisional=true; }
      const refDay=refsByDay?(((refsByDay[d]||{})[code])||0):0;
      let talk=cd?cd.talk:(tr?tr.talk:0);
      let opt=cd?cd.opt:(tr?tr.opt:0);
      let ref=tr?tr.ref:refDay;
      const ncalls=cd?cd.calls:0, nans=cd?cd.ans:0;
      const active=(talk>0||sales>0);
      let act;
      const st=(S.att[d]||{})[code];
      const w=(st!=null)?attWeight(st):null;
      /* ACTUAL SHIFTS (spec §6.2). Two rules, because the two campaigns have two different
         best sources — this is not an inconsistency, it is the finding.

         Courtesy and Nesting are DIALLER-derived: a half day (HDCA) is 0,5 whatever the
         phones say, otherwise the shift counts only if the agent actually talked. The HR
         register records whether someone was in the building; the tracker records whether
         they worked the phones, and the two genuinely disagree in both directions. Measured
         over the reference period the dialler rule reproduces 134 of 136 rows against the
         register's 123. It is also the answer to the question the reconciliation left open:
         an agent marked Present who produced nothing all day does not count as a shift.

         Cuddle stays on the register — not by preference but by necessity: its talk time
         comes from ViciDial, whose export is aggregated across the whole period and cannot
         be split per day, so "did they talk today" is a question that file cannot answer. */
      /* a campaign the rule book does not name follows the Courtesy rule (dialler-derived) */
      const shiftSrc=MTD_RULES.actualShiftsFrom[camp]||MTD_RULES.actualShiftsFrom.Courtesy||'register';
      if(shiftSrc==='dialler'){
        if(w===0.5) act=0.5;                       // HDCA — a half day is a half day
        else if(w===-1) act=0;                     // employment ended
        else act=(talk>0)?1:0;
      }else{
        if(w!=null) act=w===-1?0:w;
        else act=active?1:0;                       // no register for this agent-day
      }
      /* A date exists because SOMETHING happened on it - often a single sale carrying that
         date. With no attendance register for that day we cannot claim the whole floor was
         employed and at work; doing so gave every agent a phantom shift, so one Saturday
         with two sales on it became a full working day for the entire roster and inflated
         Employed Shifts, Actual Shifts and every target derived from them. With no register,
         only agents who actually did something that day count. */
      if(!attCovered(d)&&!active&&!tr){ emp=0; act=0; }
      const trackerIsSource=tr&&!cd&&!sd&&st==null;
      if(trackerIsSource){ emp=tr.emp; act=tr.act; }
      if(!emp&&(active)) emp=1;                    // has activity → must be employed
      if(act>0&&!emp) emp=1;
      /* SATURDAY IS DATA, NOT A SHIFT (rule saturdayShiftsFrom, Nick 2026-09-07): whatever the
         register or the dialler say, the day carries its sales, GWP, talk, referrals and
         cancellations into the totals and contributes 0 to Employed and Actual Shifts — so
         the target (perDay × emp) does not grow by it either. The row survives the guard
         below on its data. */
      if(saturdayDataOnly(d)){ emp=0; act=0; }
      /* THE DAILY TARGET IS A RULE, NOT A CELL (Nick, 2026-08-20: 'the nesting target is
         2 SPD'). It used to come straight from the roster's Target column, which let a
         stale per-agent value override the campaign's rule — four agents who moved into
         Nesting kept their Courtesy 3/day and the whole floor's target read wrong. The
         salesTargetMatrix rule decides first (exact campaign|tenure key, then the
         campaign-wide '*' key), and the roster's Target column remains the fallback for
         anyone the matrix does not name — so nothing moves for Cuddle or Courtesy, whose
         roster values equal their matrix rows. Attributed to the campaign the day was
         WORKED under, like everything else. */
      const tm=MTD_RULES.salesTargetMatrix;
      const tTen=(oh&&oh.tenure)||a?.tenure||'';
      /* THE CAMPAIGN MANAGER'S DIAL SITS OVER THE MATRIX (Nick, 2026-09-01: a target
         Dalwin sets "must change on the dashboard as well because this is the new
         targets"). S.cmTargets.matrix arrives from the Worker's /api/cm-targets and
         the chain is shared verbatim with worker/src/campaign.mjs effPerDay():
         override exact -> override campaign-wide -> rule-book exact -> rule-book
         campaign-wide -> the Agent List's own cell. Clearing the override restores
         the rule book exactly; the roster is never rewritten. */
      const ovm=(S.cmTargets&&S.cmTargets.matrix)||{};
      const perDay=ovm[camp+'|'+tTen]??ovm[camp+'|*']??tm[camp+'|'+tTen]??tm[camp+'|*']??(a?.target||0);
      const target=trackerIsSource?tr.target:(perDay*emp);
      const gwpT=trackerIsSource?tr.gwpT:(target*S.gwpPerUnit);
      /* canc belongs in this guard (audit round 3, 2026-08-27): under the NET rule a fully
         cancelled day has sales 0, and on a day with no attendance register emp/act are 0 too,
         so the row was skipped and its cancellation vanished from every total. */
      if(!emp&&!act&&!sales&&!talk&&!opt&&!refDay&&!canc) continue;   // a referral (or a cancellation) alone is still a fact
      facts.push({date:d,week:weekOf[d],code,
        tl:(tr?.tl)||(oh&&oh.tl)||a?.tl||'',
        tlNow:a?.tl||'',                        // current owner, for the "who reports to whom today" views
        campaign:camp,
        agent:a?.name||tr?.agent||code,
        tenure:(tr?.tenure)||(oh&&oh.tenure)||a?.tenure||'',
        emp,act,target,sales,gwp,gwpEx,gwpT,talk,opt,ref,canc,provisional,calls:ncalls,ans:nans});
    }
  }

  /* MULTI-DAY VICIDIAL RANGES. The export is ONE total per agent across its own days — the
     file simply has no per-day detail, and inventing one would be a lie. Two rules make a
     month-long pull usable anyway:
       1. Talk is remembered against the days the export COVERS, so "Ave Talk Time" divides by
          the shifts worked on those days rather than by every shift in the period. Upload a
          month and view the month and the average is exactly right.
       2. When the period covers only PART of the range, the agent's talk is apportioned by the
          shifts they actually worked inside the overlap versus across the whole range (from
          attendance, which is per-day and independent of the window). The row is marked
          provisional so the screen can say it is apportioned rather than measured — far better
          than the old behaviour, which dropped the range entirely and showed 0:00:00.
     An AGENT whose days already arrived as day-level ViciDial exports keeps them: the finer
     data wins. Per AGENT, not per day — this used to skip the whole range the moment any of
     its days carried any day-level ViciDial detail, and the per-call EXPORT_CALL_REPORT
     covering 01–13 Aug is a VT-floor file that flags every one of its days while holding
     not one Cuddle agent. Loading it beside the Cuddle range zeroed Cuddle talk time for
     the whole tab: the flag said "finer data exists" and for those 24 agents it did not.
     A day-level flag set by a file that never saw an agent cannot speak for that agent. */
  const viciSkipped=[], viciPartial=[];
  const diallerDays={};                      // code -> Set(dates the dialler actually covers)
  for(const d of dates) for(const c in (callsBy[d]||{})) (diallerDays[c]=diallerDays[c]||new Set()).add(d);
  /* Which agents actually HAVE day-level ViciDial records, and on which dates. Read from
     S.calls rather than callsBy because the v flag (ViciDial-sourced) does not survive the
     fuller-dialler merge above, and CallX coverage must not count here — CallX-vs-range is
     still decided below by which is fuller, exactly as before. */
  const viciDayCov={};                       // code -> Set(dates with a day-level ViciDial record)
  for(const d of dates) for(const k in (S.calls[d]||{})){ if(!S.calls[d][k].v) continue;
    const c=resolveKey(k); if(c) (viciDayCov[c]=viciDayCov[c]||new Set()).add(d); }
  for(const key in S.vici){
    const v=S.vici[key];
    const days=[]; { const d=new Date(v.from+'T00:00:00Z');
      while(dkey(d)<=v.to&&days.length<400){ days.push(dkey(d)); d.setUTCDate(d.getUTCDate()+1); } }
    const overlap=days.filter(d=>d>=range.from&&d<=range.to);
    if(!overlap.length){ viciSkipped.push({from:v.from,to:v.to,n:v.rows.length}); continue; }
    const partial=overlap.length<days.length;
    if(partial) viciPartial.push({from:v.from,to:v.to,n:v.rows.length,covered:overlap.length,of:days.length});
    const inOverlap=new Set(overlap), last=overlap[overlap.length-1];
    const perAgent={};
    /* rangeAgg rows ARE counted here (audit round 3, 2026-08-27). Excluding them made the
       "is another dialler already fuller?" test blind to talk a PREVIOUS range file had
       already booked in this same build, so two overlapping Agent Performance Detail pulls
       (01-13 Aug and 01-20 Aug — both stored, neither superseding the other) each pushed a
       row and the agent's talk read as their SUM. Measured 3600s+5400s = 9000s where the
       fuller pull alone says 5400s. With them counted, the fuller pull wins and zeroes the
       thinner one, which is the "one dialler per agent, never the sum" rule already applied
       to day-level rows. */
    facts.forEach(f=>{
      /* A rangeAgg row is anchored at ITS range's last day, which may sit outside this
         range's window — so match those on SPAN OVERLAP, not on the anchor date, or the
         dedupe below is blind to a wider pull already applied and the talk is summed
         (audit round 6, second pass: proven order-dependent). */
      const hit=inOverlap.has(f.date)
        || (f.rangeAgg && f.rangeFrom && f.rangeTo && String(f.rangeFrom)<=String(v.to) && String(f.rangeTo)>=String(v.from));
      if(hit) (perAgent[f.code]=perAgent[f.code]||[]).push(f);
    });
    const shifts=(code,list)=>list.reduce((t,d)=>{const st=(S.att[d]||{})[code];
      const w=st!=null?attWeight(st):0; return t+(w>0?w:0)},0);
    for(const r of v.rows){
      const rc=resolveKey(r.name); if(!rc) continue;              // not on the Agent List
      const a=metaOf[rc]; if(!a) continue;                        // leaver — off the current roster
      /* THE SAME TWO GATES THE DAY LOOP APPLIES (audit round 3, 2026-08-27). Neither was
         here, and both matter: an excluded agent (spec §5's maintained list) reached the
         fact table, the model and every talk average through this path alone; and a
         non-reported campaign produced a fact whose campaign key does not exist in byCC,
         which threw "Cannot read properties of undefined" out of buildModel and left the
         whole app unrendered after a ViciDial range upload — VT agents are on the roster
         AND on ViciDial, so this was one export away at any time. */
      if(S.settings.applyExclusions!==false && MTD_RULES.excludeAgents[rc]) continue;
      /* THE DAY'S OWN ROW DECIDES THE CAMPAIGN (audit round 6, 2026-08-28). The day loop lets
         a tracker row's Campaign cell win, this path never saw the tracker, and the Agent
         List now rewrites a whole month (recordOrgList) — so the two could disagree for the
         SAME agent-day and split one person's day across two campaigns. V09 catches exactly
         that and would have reported it as an error on legitimate data. Where a day row
         already exists for this date it is the answer; otherwise fall back to the history. */
      const dayRow=(perAgent[rc]||[]).find(f=>!f.rangeAgg&&f.date===last);
      const rcCamp=dayRow?dayRow.campaign:campOf((orgAt(rc,last)||{}).campaign||a.campaign);
      if(!CAMPS.includes(rcCamp)){
        const t=offCampaign[rcCamp]=offCampaign[rcCamp]||{agents:new Set(),sales:0,gwp:0};
        t.agents.add(rc);
        continue;
      }
      // THIS agent's days already arrived as day-level ViciDial exports — the finer data wins
      const cov=viciDayCov[rc];
      if(cov&&overlap.every(d=>cov.has(d))) continue;
      // apportion by shifts worked, falling back to plain day count where attendance is absent
      const all=shifts(rc,days), ov=shifts(rc,overlap);
      const share=partial ? (all>0 ? ov/all : overlap.length/days.length) : 1;
      if(share<=0) continue;
      const talk=Math.round((r.talk||0)*share), calls=Math.round((r.calls||0)*share);
      const own=perAgent[rc]||[];
      const perDayTalk=own.reduce((t,f)=>t+(f.talk||0),0);
      if(perDayTalk>=talk) continue;                              // the other dialler is fuller — keep it
      own.forEach(f=>{ f.talk=0; f.calls=0; f.ans=0; f.opt=0; }); // one dialler per agent, never the sum
      (diallerDays[rc]=diallerDays[rc]||new Set());
      overlap.forEach(d=>diallerDays[rc].add(d));
      // attributed to the org as it stood on the day the range is booked against, not today's
      const oh=orgAt(rc,last);
      facts.push({date:last,week:weekOf[last]||1,code:rc,tl:(oh&&oh.tl)||a.tl||'',tlNow:a.tl||'',
        campaign:rcCamp,                                          // already resolved + gated above
        agent:a.name||rc,tenure:(oh&&oh.tenure)||a.tenure||'',emp:0,act:0,target:0,sales:0,gwp:0,gwpT:0,
        talk,opt:Math.round((r.opt||0)*share),ref:0,canc:0,provisional:partial,calls,ans:calls,
        rangeAgg:true,rangeFrom:v.from,rangeTo:v.to,apportioned:partial?share:null});
    }
  }
  /* Mark every fact with whether the dialler covered that agent on that day. This is the
     denominator for Ave Talk Time: dividing a dialler's total by shifts it never observed is
     what made the averages read low against the hand-built tracker. */
  for(const f of facts) f.dCov=(diallerDays[f.code]&&diallerDays[f.code].has(f.date))?1:0;


  // per-agent QA over a date range
  const qaFor=(code,from,to)=>{
    let s=0,n=0;
    for(const d in S.evals){ if(d<from||d>to) continue; const arr=S.evals[d][code]; if(arr) for(const v of arr){s+=(typeof v==='number'?v:v.s);n++;} }
    return n?{avg:s/n/100,n}:null;
  };

  /* KEYED ON THE MONTH, NOT THE EXACT RANGE (audit, 2026-08-28). periodKey is
     "from|to", so a keyed referral entered on the 25th vanished on the 26th when the
     range grew — and reappeared, into a published MTD, the moment anyone set "as at" back
     to the 25th. The Adjustments page has always SAID it is scoped to the month. Legacy
     range-keyed entries are still read so nothing already typed is lost. */
  const adjKey=String(range.from).slice(0,7);
  const adj=Object.assign({},S.adjust[periodKey]||{},S.adjust[adjKey]||{});
  // Cancellations now arrive in the BI Inactive upload. Where the file covers a day in
  // this period, the hand-keyed cancellation top-up is IGNORED rather than added - the
  // same cancellation must not be counted once from the file and again by hand.
  // Referrals follow the same doctrine since the HighLevel pull landed (2026-08-14):
  // with a referrals upload loaded, per-agent counts come from the FILE (matched through
  // the Agent List at ingest) and keyed referral adjustments are ignored — one source,
  // never both. With no upload, the Adjustments tab remains the referral source.
  const cancFromFile=Object.keys(S.cancRows||{}).length>0;
  const adjC=code=>cancFromFile?0:((adj[code]||{}).c||0);
  const refsFromFile=!!(S.refs&&S.refs.by);
  /* DATED REFERRALS. When the HighLevel rows carried their created day (they all do on the
     API path), referrals become a per-day fact like sales: Daily and Weekly show real
     counts, and MTD is scoped to the period instead of the pull's whole lifetime. The
     undated path (a per-agent counts CSV) keeps the old total-per-agent behaviour. */
  /* REFERRALS ARRIVE AS A PERIOD TOTAL PER AGENT (the HighLevel pull carries no date), so
     they can be attributed to an agent but NOT to a day or a week. Views must be able to
     tell that apart: printing 0 on a daily row says 'this agent referred nobody today',
     which is not what the source says — it says nothing about today at all. */
  M_refsAreTotals=refsFromFile&&!refsByDay;
  const refOf=code=>refsFromFile?(S.refs.by[code]||0):((adj[code]||{}).r||0);

  function agg(rows,code){
    const o={emp:0,act:0,target:0,sales:0,gwp:0,gwpEx:0,gwpT:0,talk:0,opt:0,ref:0,canc:0,days:0,prov:0,calls:0,ans:0,actDial:0,empDial:0};
    for(const f of rows){ o.emp+=f.emp;o.act+=f.act;o.target+=f.target;o.sales+=f.sales;o.gwpEx+=(f.gwpEx||0);o.gwpT+=f.gwpT;
      o.talk+=f.talk;o.opt+=f.opt;o.ref+=f.ref;o.canc+=f.canc;o.days++; o.calls+=(f.calls||0); o.ans+=(f.ans||0);
      if(f.dCov){o.actDial+=f.act; o.empDial+=f.emp;} // shifts the dialler actually observed
      if(f.provisional)o.prov++; }
    // referrals: the upload (or adjustment) is the per-agent TOTAL — it replaces, never
    // stacks on, whatever the tracker daily rows carried for the same agent
    if(code&&refsFromFile&&!refsByDay){ o.ref=refOf(code); }
    if(code&&adj[code]){ o.canc+=adjC(code); if(!refsFromFile) o.ref+=adj[code].r||0; }
    /* GROSS ONCE, HERE — after every row's ex-VAT charge is summed. Adding up per-day rounded
       rands re-rounds an already-rounded number and drifts against the source: the pivot sums
       Charge Amount for the agent and applies VAT to that total, and so does this.
       DISPLAY BASIS: ex-VAT (the agent's comms; MTD_RULES.gwpDisplayBasis). The inclusive
       figure is kept on o.gwpIncl for anything that genuinely needs VAT; the target scales
       to the same basis so pctG stays a like-for-like ratio. */
    o.gwpIncl=Math.round(o.gwpEx*MTD_VAT);
    o.gwp=(MTD_RULES.gwpDisplayBasis==='ex')?Math.round(o.gwpEx):o.gwpIncl;
    if(MTD_RULES.gwpDisplayBasis==='ex') o.gwpT=Math.round(o.gwpT/MTD_VAT);
    o.att=o.emp?o.act/o.emp:null; o.pctT=o.target?o.sales/o.target:null;
    // SPD is =IFERROR(Sales/Actual Shifts,0) — zero, not blank, when no shift was worked
    o.spd=o.act?o.sales/o.act:0;
    o.pctG=o.gwpT?o.gwp/o.gwpT:null; o.aveG=o.sales?o.gwp/o.sales:null;
    /* AVE TALK TIME DIVIDES BY EMPLOYED SHIFTS (spec §6.4: "divide by employed days, not days
       on which calls were made"). It used to divide by the shifts the dialler saw the agent
       WORK, which is a different question and breaks in both directions: an agent who dialled
       but was credited no shift got no average at all, and anyone who worked part of the
       period read high. The reference tracker settles it — an agent with 5,125s of dialling
       and ZERO actual shifts still shows 0:42:43, which is 5,125 over his 2 EMPLOYED shifts.
       EVERY employed shift in the period, not just the days the dialler covered: an agent the
       dialler saw on one of two employed days still averages over two. Where the dialler does
       not cover the whole period the figure genuinely reads low, and the honest answer is the
       warning that already names those days on the MTD page — not a quietly narrowed
       denominator that makes a partial upload look complete. */
    /* ZERO AND UNKNOWN ARE DIFFERENT ANSWERS. o.empDial counts the employed shifts the
       DIALLER actually observed. If it saw none of this agent's days and they logged no
