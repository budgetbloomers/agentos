<!-- SheetJS — VAS used to read EVERY upload with `await f.text()`, so a .xlsx (a ZIP) was
     decoded as UTF-8 noise: parseCSV split the garbage into thousands of junk rows, the type
     still matched on header strings sitting readable inside the workbook XML, and every row
     then failed its date guard. Result: the file registered as "loaded" with a row count and
     stored NOTHING. Self-hosted rather than cdnjs — an ad-blocker or work network silently
     killing the CDN would take uploads down with it. -->

     the user exports or uploads, both long after DOMContentLoaded, and `defer`
     guarantees it has run by then — so every existing call site is unchanged.

     while the login box was already on screen waiting to be typed into. -->

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ONE SUITE, ONE SKIN (Nick, 2026-08-26: "change the ops, vas and tracker to the
     color of agent analytics, so its all one"). LIGHT is now the DEFAULT and its
     values are the Agent Analytics / Ops palette verbatim (#F2F5FA ground, white
     cards, #0F1E36 ink, #2563EB accent). The dark glass theme survives behind
     data-theme="dark" for anyone who wants it back. */
  :root, :root[data-theme="light"]{
    --bg0:#F2F5FA; --bg1:#F7FAFE; --bg-glow:rgba(37,99,235,.06);
    --glass:#FFFFFF; --glass2:#F1F5FB; --glass3:#EAF1FF;
    --stroke:#E3E9F3; --stroke2:#C7D2E4;
    --ink:#0F1E36; --ink2:#3B4A63; --muted:#71809B;
    --accent:#2563EB; --accent2:#38BDF8; --accent-grad:linear-gradient(135deg,#2563EB,#38BDF8);
    --on-accent:#fff;
    --cuddle:#2563EB; --courtesy:#158A4C; --vt:#6D4AE0; --nesting:#B45309; --violet:#6D4AE0; --amber:#B45309; --rose:#C42D2D;
    --good:#158A4C; --warn:#B45309; --crit:#C42D2D;
    --good-bg:rgba(21,138,76,.10); --warn-bg:rgba(180,83,9,.11); --crit-bg:rgba(196,45,45,.09);
    --grid-line:rgba(15,30,54,.08);
    --card-bg:#FFFFFF;
    --line:#E3E9F3; --ink3:#71809B;   /* some templates read these with white-ish fallbacks — invisible on light unless defined */
    --shadow:0 1px 2px rgba(15,30,54,.05),0 4px 14px rgba(15,30,54,.05);
    --shadow-lift:0 10px 28px rgba(15,30,54,.13);
    --r:14px; --r-sm:10px;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg0:#050D1C; --bg1:#071A2F; --bg-glow:rgba(46,124,246,.16);
    --glass:rgba(148,182,255,.05); --glass2:rgba(148,182,255,.09); --glass3:rgba(148,182,255,.14);
    --stroke:rgba(148,182,255,.13); --stroke2:rgba(148,182,255,.25);
    --ink:#EAF1FB; --ink2:#A9BAD4; --muted:#66799B;
    --accent:#3D9BFF; --accent2:#38C6F4; --accent-grad:linear-gradient(135deg,#2E7CF6,#38C6F4);
    --on-accent:#04101F;
    --cuddle:#4C9DFF; --courtesy:#2BD9B0; --vt:#A78BFA; --nesting:#F5B02E; --violet:#A78BFA; --amber:#F5B02E; --rose:#FB7185;
    --good:#34D399; --warn:#FBBF24; --crit:#FB7185;
    --good-bg:rgba(52,211,153,.12); --warn-bg:rgba(251,191,36,.12); --crit-bg:rgba(251,113,133,.13);
    --grid-line:rgba(148,182,255,.08);
    --card-bg:linear-gradient(180deg,rgba(148,182,255,.05),rgba(148,182,255,.02)),#0A1730;
    --line:rgba(255,255,255,.08); --ink3:#94a3b8;
    --shadow:0 6px 24px rgba(2,8,20,.45);
    --shadow-lift:0 12px 34px rgba(2,8,20,.55);
    --r:18px; --r-sm:12px;
    color-scheme:dark;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background:
      radial-gradient(1100px 600px at 85% -10%, var(--bg-glow), transparent 60%),
      radial-gradient(900px 700px at -10% 110%, var(--bg-glow), transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg0));
    background-attachment:fixed;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  select{color-scheme:inherit}
  option,optgroup{background:var(--bg1) !important;color:var(--ink) !important}
  h1,h2,h3,h4{margin:0;text-wrap:balance}
  ::selection{background:rgba(61,155,255,.35)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  .num{font-variant-numeric:tabular-nums}
  .lab{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

  /* ================= app frame ================= */
  .app{display:flex;min-height:100vh}
  aside.side{
    width:236px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
    padding:16px 12px;gap:4px;border-right:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(148,182,255,.04), transparent 40%);
    backdrop-filter:blur(10px);transition:width .22s ease;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  }
  .app.collapsed aside.side{width:70px}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;white-space:nowrap}
  .logo .mark{width:34px;height:34px;flex:none;border-radius:11px;background:var(--accent-grad);
    display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(46,124,246,.45)}
  .logo .mark svg{width:19px;height:19px}
  .logo b{font-size:16.5px;letter-spacing:-.02em}
  .logo small{display:block;font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .app.collapsed .logo b,.app.collapsed .logo small{display:none}
  .app.collapsed .side-logo,.app.collapsed .side-switch{display:none!important} /* !important: the switch carries an inline display:flex */
  .navgroup{margin-top:12px}
  .navgroup .lab{padding:0 10px 6px;display:block}
  .app.collapsed .navgroup .lab{visibility:hidden;height:0;padding:0}
  .navitem{
    display:flex;align-items:center;gap:11px;width:100%;padding:8.5px 10px;border:none;background:none;
    border-radius:11px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:13.5px;white-space:nowrap;
    transition:background .15s,color .15s;position:relative;
  }
  .navitem svg{width:18px;height:18px;flex:none;opacity:.85}
  .navitem:hover{background:var(--glass2);color:var(--ink)}
  .navitem.on{background:var(--accent-grad);color:#fff;box-shadow:0 4px 14px rgba(46,124,246,.35)}
  .navitem .cnt{margin-left:auto;font-size:10px;background:var(--crit);color:#fff;border-radius:99px;padding:1px 6px;font-weight:800}
  .app.collapsed .navitem span,.app.collapsed .navitem .cnt{display:none}
  .side .foot{margin-top:auto;padding-top:10px}
  .collapse-btn{width:100%;justify-content:center}

  .shell{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{
    position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:12px 22px;border-bottom:1px solid var(--stroke);
    /* NEAR-OPAQUE ON PURPOSE. At 72% transparency the page scrolling underneath read straight
       through the bar — KPI cards showed through the controls and the strip looked like a
       rendering fault. 96% keeps a whisper of depth, the blur does the rest, and machines
       without backdrop-filter get a fully solid bar rather than a ghost. */
    background:color-mix(in srgb, var(--bg1) 96%, transparent);backdrop-filter:blur(16px);
    box-shadow:0 8px 24px rgba(2,8,20,.45);
  }
  @supports not (backdrop-filter: blur(1px)){ header.top{ background:var(--bg1); } }
  .search{
    display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--stroke);
    /* shrinks BEFORE the filters do — a search box that is 60px narrower still works,
       a toolbar that has wrapped onto two rows is the thing people notice. */
    /* shrinks BEFORE the filters do — a search box 60px narrower still works, a
       toolbar that has wrapped onto a second row is the thing people notice. */
    border-radius:12px;padding:7px 12px;min-width:118px;flex:1 1 124px;max-width:340px;position:relative;
  }
  .search input{border:none;background:none;outline:none;width:100%;color:var(--ink)}
  .search svg{width:15px;height:15px;color:var(--muted);flex:none}
  .search .results{
    position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg1);border:1px solid var(--stroke2);
    border-radius:12px;box-shadow:var(--shadow-lift);overflow:hidden;z-index:80;
  }
  .search .results button{display:flex;gap:9px;align-items:center;width:100%;padding:8px 12px;border:none;background:none;cursor:pointer;text-align:left}
  .search .results button:hover{background:var(--glass2)}
  .ctl{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--stroke);border-radius:12px;padding:6px 10px;min-width:0}
  .ctl .lab{letter-spacing:.08em;flex:none;white-space:nowrap}
  /* A native <select> reserves the width of its WIDEST option, not the one on show.
     So "Campaign: All" sat in a 224px box purely because "Matrix Courtesy" exists
     further down the list, "Team: All" in 215px because of "Denise Haripersad", and
     the period box in 173px because of "Cycle (26th–25th)". Four controls padded out
     like that overflowed a 1366px laptop and the whole toolbar wrapped onto a second
     row. fitSelects() sizes each one from the SELECTED option instead; the cap below
     is the backstop for a genuinely long name, which then ellipsises rather than
     stretching the bar. */
  .ctl select,.ctl input{border:none;background:transparent;outline:none;font-weight:600;color:var(--ink);max-width:150px;min-width:0;text-overflow:ellipsis}
  /* flex:none or the width fitSelects sets is treated as a basis and shrunk away
     again the moment the bar is tight — which is exactly when it matters. */
  .ctl select{flex:none;appearance:none;-webkit-appearance:none;padding-right:14px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 5px) calc(50% + 1px),calc(100% - 1px) calc(50% + 1px);
    background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  .ctl input[type=date]{max-width:112px}
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--stroke);background:var(--glass);
    border-radius:12px;padding:7px 14px;cursor:pointer;font-weight:650;color:var(--ink);
    transition:transform .12s,border-color .15s,background .15s;
  }
  .btn svg{width:15px;height:15px}
  .btn:hover{border-color:var(--stroke2);background:var(--glass2);transform:translateY(-1px)}
  .btn.primary{background:var(--accent-grad);border:none;color:#fff;box-shadow:0 4px 14px rgba(46,124,246,.4)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.small{padding:4px 10px;font-size:12.5px;border-radius:9px}
  .btn.ghost{background:none;border-color:transparent}
  .btn.ghost:hover{background:var(--glass2)}
  .btn.danger:hover{border-color:var(--crit);color:var(--crit)}
  .avatar{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;letter-spacing:.02em}
  .avatar.lg{width:58px;height:58px;font-size:20px;border-radius:18px}

  main#view{padding:22px;max-width:1720px;width:100%;margin:0 auto;animation:pagein .3s ease}
  @keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .page-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .page-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .page-head .sub{color:var(--muted);font-size:13px}
  .page-head .spacer{flex:1}

  /* ================= cards ================= */
  .card{
    background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
    padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px);
    transition:transform .16s ease,border-color .16s,box-shadow .16s;
  }
  .card.lift:hover{transform:translateY(-3px);border-color:var(--stroke2);box-shadow:var(--shadow-lift)}
  .card h3{font-size:14.5px;font-weight:750;letter-spacing:-.01em}
  .card .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  .cardhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .cardhead .spacer{flex:1}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
  .cols2{grid-template-columns:1.6fr 1fr}
  .cols2e{grid-template-columns:1fr 1fr}
  .cols3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:1150px){.cols2,.cols2e,.cols3{grid-template-columns:1fr}}
  .mt{margin-top:14px}

  .kpi{position:relative;overflow:hidden;padding:15px 16px 10px;cursor:default}
  .kpi .val{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
  .kpi .cmp{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .kpi .spark{margin:8px -16px -10px}
  .kpi .ico{position:absolute;top:13px;right:13px;width:30px;height:30px;border-radius:9px;background:var(--glass2);
    display:grid;place-items:center;color:var(--accent)}
  .kpi .ico svg{width:16px;height:16px}
  .delta{display:inline-flex;align-items:center;gap:3px;font-weight:750;font-size:12px;border-radius:99px;padding:1.5px 8px}
  .delta.up{color:var(--good);background:var(--good-bg)} .delta.down{color:var(--crit);background:var(--crit-bg)}
  .delta.flat{color:var(--muted);background:var(--glass2)}
  .delta.inv.up{color:var(--crit);background:var(--crit-bg)} .delta.inv.down{color:var(--good);background:var(--good-bg)}

  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-weight:700;font-size:11.5px;white-space:nowrap}
  .pgood{background:var(--good-bg);color:var(--good)} .pwarn{background:var(--warn-bg);color:var(--warn)} .pcrit{background:var(--crit-bg);color:var(--crit)}
  .pmuted{background:var(--glass2);color:var(--ink2)}
  .campchip{display:inline-flex;align-items:center;gap:6px;font-weight:650}
  .campchip i{width:8px;height:8px;border-radius:3px;flex:none}
  .chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--stroke);background:var(--glass);border-radius:99px;padding:5px 13px;cursor:pointer;font-weight:650;font-size:12.5px;color:var(--ink2);transition:all .14s}
  .chip:hover{color:var(--ink);border-color:var(--stroke2)}
  .chip.on{background:var(--accent-grad);border-color:transparent;color:#fff}

  /* insight cards */
  /* 300px only fitted four across, so the fifth insight dropped to a row of its own
   with the rest of it empty. 235px fits all five at desktop width and still wraps
   sensibly below it. */
.insights{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));margin-bottom:16px}
  .insight{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:14px;
    background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);transition:transform .15s,border-color .15s}
  .insight:hover{transform:translateY(-2px);border-color:var(--stroke2)}
  .insight .ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center}
  .insight .ic svg{width:16px;height:16px}
  .insight b{font-size:13px;display:block;margin-bottom:1px}
  .insight p{margin:0;font-size:12.5px;color:var(--ink2)}
  .tone-good .ic{background:var(--good-bg);color:var(--good)}
  .tone-warn .ic{background:var(--warn-bg);color:var(--warn)}
  .tone-crit .ic{background:var(--crit-bg);color:var(--crit)}
  .tone-info .ic{background:var(--glass2);color:var(--accent)}

  /* ================= tables ================= */
  /* content-visibility lets the browser SKIP layout for a table that is scrolled out of
     view, which is most of them on the multi-table pages (MTD, Weekly, Coaching). Measured
     cost of switching tabs was dominated by layout, not by JavaScript. contain-intrinsic-size
     reserves a plausible height so the scrollbar does not jump as sections come into view. */
  .tablewrap{overflow:auto;border:1px solid var(--stroke);border-radius:14px;background:var(--glass);max-height:70vh;backdrop-filter:blur(14px);content-visibility:auto;contain-intrinsic-size:auto 480px}
  /* The coaching queue is the same shape of problem without a table in sight: one card per
     flagged agent, each carrying a heading, its priority cards, a notes textarea and three
     form controls, and forty of them stacked with all but the first two below the fold.
     Layout, not JavaScript, was the whole cost of opening the tab. */
  .cqcard{content-visibility:auto;contain-intrinsic-size:auto 420px}
  table.data{border-collapse:separate;border-spacing:0;width:100%;font-size:12.8px}
  table.data th{
    position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--bg1) 88%, var(--accent));
    color:var(--ink2);text-align:right;font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;
    padding:9px 10px;border-bottom:1px solid var(--stroke);white-space:nowrap;cursor:pointer;user-select:none;
  }
  table.data th.l,table.data td.l{text-align:left}
  table.data th .dir{color:var(--accent);margin-left:3px}
  table.data td{padding:7px 10px;border-bottom:1px solid var(--grid-line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.data tbody tr{transition:background .12s}
  table.data tbody tr:hover{background:var(--glass2)}
  table.data tr.rowlink{cursor:pointer}
  /* The Grand Total is pinned to the bottom of the scroll box, so its background MUST be
     opaque: --glass2 is rgba(...,.09), i.e. 91% see-through, so every agent row scrolling
     underneath showed straight through it — avatars and names smeared across the totals by
     the backdrop blur. Mirrors the sticky <th> above (opaque color-mix of --bg1, which is a
     solid hex in both themes) and sits at z-index 4: over the body rows, under the header. */
  table.data tr.total td{font-weight:750;background:color-mix(in srgb, var(--bg1) 92%, var(--accent));border-top:1.5px solid var(--stroke);position:sticky;bottom:0;z-index:4}
  table.data tr.subtotal td{font-weight:700;background:var(--glass)}
  .agentcell{display:flex;align-items:center;gap:9px}
  .agentcell .nm{font-weight:650;line-height:1.15}
  .agentcell small{display:block;color:var(--muted);font-size:10.5px}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .filters input[type="search"],.filters select,.filters input[type="date"]{
    background:var(--glass);border:1px solid var(--stroke);border-radius:11px;padding:6.5px 12px;outline:none;color:var(--ink)}
  .filters :is(input,select):focus{border-color:var(--accent)}

  /* ================= charts ================= */
  .chartbox{position:relative}
  .chartbox svg{display:block;width:100%;height:auto}
  .chartbox .draw path.line{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1.1s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .chartbox .draw .fillarea{opacity:0;animation:fadein .8s .25s ease forwards}
  .chartbox .draw rect.bar{transform:scaleY(0);transform-origin:bottom;transform-box:fill-box;animation:grow .5s ease forwards}
  @keyframes grow{to{transform:scaleY(1)}}
  @keyframes fadein{to{opacity:1}}
  .tip{position:absolute;pointer-events:none;background:color-mix(in srgb,var(--bg1) 92%,#fff 0%);border:1px solid var(--stroke2);
    box-shadow:var(--shadow-lift);border-radius:11px;padding:8px 11px;font-size:12px;display:none;z-index:30;min-width:140px;backdrop-filter:blur(10px)}
  .tip .t{font-weight:750;margin-bottom:4px}
  .tip .r{display:flex;justify-content:space-between;gap:14px;padding:1px 0}
  .tip .r i{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:6px}
  .legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;font-size:12.3px;color:var(--ink2)}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
  .ring{position:relative;display:grid;place-items:center}
  .ring .rv{position:absolute;text-align:center}
  .ring .rv b{font-size:19px;font-weight:800}

/* ================= MTD ENGINE RULES =================
   THE RULE BOOK. This is Appendix A of "VAS Month-to-Date Report — Complete Specification"
   v6.0, reverse-engineered from the hand-built tracker workbook and verified against source
   data. The canonical copy lives at agentos/specs/mtd_engine_rules.json; this object is the
   operative subset — every rule below is READ BY THE ENGINE, not documentation.

   It is inlined rather than fetched because the dashboard is a single file that must run
   from file:// with no server. When specs/mtd_engine_rules.json changes, change this to
   match: diagnostics/verify-engine-rules.mjs fails the build if the two drift apart.

   Nothing here is a threshold someone tuned. Each entry traces to a numbered section of the
   spec and, in most cases, to a count of how many rows it reproduced. */
const MTD_RULES = {
  version: '6.0',

  /* §4 — reference constants. gwpPerSale and the target matrix are ALSO read from the
     roster's own Target column at runtime; these are the observed state and the fallback. */
  gwpPerSale: 89,
  vat: 1.15,
  salesTargetMatrix: { 'Cuddle|Exp':8, 'Courtesy|Exp':5, 'Courtesy|M2':4, 'Courtesy|M1':3, 'Nesting|M0':2, 'Nesting|*':2 },

  /* §4 — attendance shift weights, keyed on the register's Status Code. The export carries
     both a long Status ("Half Day CA") and a Status Code ("HDCA"); the CODE is canonical. */
  attWeights: { P:1, HDCA:0.5, CA:0, UCA:0, SL:0, FRL:0, AL:0, L:0, Suspended:0 },

  /* §6.2 — Actual Shifts. Courtesy/Nesting are DIALLER-derived: the HR register records
     whether someone was in the building, the tracker records whether they worked the phones.
     Verified 134/136 fact rows against the register's 123/136. Cuddle must stay on the
     register because the ViciDial export is period-aggregated and has no per-day split. */
  actualShiftsFrom: { Courtesy:'dialler', Nesting:'dialler', Cuddle:'register', VT:'register' },

  /* SATURDAY IS DATA, NOT A SHIFT (Nick, 2026-09-07: "for the month to date add the data but
     do not add to the numerator for Saturday only"). A Saturday's sales, GWP, talk, referrals
     and cancellations count in every total; the day itself is never an Employed or Actual
     Shift and never a dialling day — so it moves neither Attendance (Actual ÷ Employed), nor
     SPD (Sales ÷ Actual Shifts), nor the targets that multiply out of employed days. It
     simply adds what was sold. Effective-dated so August, verified row-for-row against the
     workbook, stays exactly as it was: Saturdays on/after this date follow the rule.
     Mirror of specs/mtd_engine_rules.json reference_data.saturday_shifts. */
  saturdayShiftsFrom: '2026-09-01',

  /* AVERAGE TALK TIME IS MINUTES PER EMPLOYED SHIFT (Nick, 2026-09-08: "total talk time divided
     by shifts, and must be in minutes"). The denominator was already employed shifts (spec §6.4);
     the unit was h:mm:ss. One value, read by fmtTalk() for every average-talk figure on screen
     and in the tracker export. Mirror of specs/mtd_engine_rules.json reference_data.talk_time_average. */
  aveTalkUnit: 'minutes',

  /* CallX retired — the whole floor dials on ViciDial from this date (Nick, 2026-09-01).
     The calls() intake refuses rows on/after it and points at the ViciDial slot; earlier
     days still load as history corrections. The dialler-derived shift rule is untouched —

   separated, but ViciDial's EXPORT_CALL_REPORT is a raw TAB-separated .txt — read as CSV it

  return (tabs>=3&&tabs>commas) ? '\t' : ',';

      else field+=c;
    }else{

      else if(c===D){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c!=='\r') field+=c;

    else if(name!==null) buf.push(line);

/* ================= org history — historical attribution ================= *
   THE RULE: an agent's CURRENT team leader must never rewrite the team leader attached to
   activity that happened before they moved. Agent A sold 100 under TL A in Month 1; moving
   them to TL B in Month 2 leaves Month 1 reading "TL A — 100 sales" forever.

   The Agent List is a live snapshot with no effective-date column, so it says who reports to
   whom TODAY and nothing about yesterday. Reading history off it — which is what the model
   used to do — means every historical report silently re-attributes itself the moment the
   floor reorganises. So each snapshot is stamped with the date it describes and stored as an
   effective-dated segment; the model then asks "who owned this agent on THIS day", never
   "who owns them now".

   One entry per CHANGE, not per upload: uploading the same list every morning for a month
   adds nothing, which is what keeps the store small and makes re-uploads idempotent.

   Dates BEFORE the earliest observation resolve to that earliest segment. We genuinely did
   not observe the org before we started looking, and extrapolating the first thing we saw
   backwards is the only answer that is stable — it never changes when a later list arrives,
   which is the whole point. Where a source carries its own per-date team leader (the tracker
   daily sheet does), that source is recorded too and wins outright at fact level: it is a
   dated statement of who owned the agent that day, not a snapshot of today. */
const sameOrg=(a,b)=>!!a&&!!b&&a.tl===b.tl&&a.campaign===b.campaign&&a.tenure===b.tenure;
/* "TBC" is not a team leader — it is the ABSENCE of one. An agent parked under a
   placeholder was never attributed to an org; when their first REAL assignment arrives,
   splitting the period at the list date files their early days under nobody (Nick,
   2026-08-26: the four Nesting movers sat in the MTD Nesting tab under "TBC" after the
   19 Aug list moved them to Courtesy). So a real assignment REPLACES an all-placeholder
   history, back-dated to the first sighting; a real→real change still opens a dated
   segment exactly as before — this rule never touches genuine movements. */
const provisionalTL=t=>{const s=String(t||'').trim();return !s||/^(-+|n\/?a|none|null|nil|tbc|tbd|\.|#n\/a)$/i.test(s)};
function recordOrg(code,d,val,src){
  if(!code||!/^\d{4}-\d{2}-\d{2}$/.test(d||'')) return false;
  const seg={d,tl:String(val.tl||'').trim(),campaign:String(val.campaign||'').trim(),
             tenure:String(val.tenure||'').trim(),src:src||''};
  if(!seg.tl&&!seg.campaign) return false;          // nothing to attribute — don't record a blank
  const list=S.orgHist[code]=S.orgHist[code]||[];
  const at=list.findIndex(s=>s.d===d);
  let moved=false;
  /* THE PLACEHOLDER RULE CUTS BOTH WAYS (review, 2026-08-26). A "TBC"/blank TL is
     the ABSENCE of an assignment — so it must never REPLACE or OPEN OVER a real
     one either: a later list parking an agent under TBC, or a tracker row with a
     blank TL cell, used to erase a real leader from history (and once erased, the
     next real list wholesale-backdated over everything). A provisional incoming
     TL inherits the real one already in force; only a real campaign change on
     such a row still records. */
  if(provisionalTL(seg.tl)&&list.length){
    let inForce=(at>=0)?list[at]:null;
    if(!inForce){ for(let k=0;k<list.length;k++){ if(list[k].d<=d) inForce=list[k]; else break; } }
    if(inForce&&!provisionalTL(inForce.tl)){
      if(!seg.campaign||seg.campaign===inForce.campaign) return false;   // nothing real to record
      seg.tl=inForce.tl;                                                 // keep the real leader
    }
  }
  if(at>=0){                                        // the same day re-observed: a correction, in place
    if(sameOrg(list[at],seg)) return false;
    // the correction path gets the same placeholder rule: re-uploading a fixed list for
    // a day already observed as "TBC" is a FIRST assignment, not a movement
    const backdate=!provisionalTL(seg.tl)&&list.every(s=>provisionalTL(s.tl));
    moved=list[at].tl!==seg.tl&&!backdate;
    if(backdate)for(const s of list){ s.tl=seg.tl; if(seg.campaign)s.campaign=seg.campaign; s.src=(s.src||'')+'+backdated'; }
    list[at]=seg;
  }else{
    if(!provisionalTL(seg.tl)&&list.length&&list.every(s=>provisionalTL(s.tl))){
      // first real assignment after placeholder-only history: back-date it (see above)
      for(const s of list){ s.tl=seg.tl; if(seg.campaign)s.campaign=seg.campaign; s.src=(s.src||'')+'+backdated'; }
    }
    let i=-1; for(let k=0;k<list.length;k++){ if(list[k].d<=d) i=k; else break; }
    if(i>=0&&sameOrg(list[i],seg)) return false;    // no change against what was already in force
    moved=i>=0&&list[i].tl!==seg.tl;
    list.splice(i+1,0,seg);
  }
  // a later segment that now repeats its predecessor is noise, not a movement
  for(let k=1;k<list.length;k++) if(sameOrg(list[k-1],list[k])){ list.splice(k,1); k--; }
  return moved;
}
function orgAt(code,d){
  const list=S.orgHist&&S.orgHist[code];

  let cur=list[0];                                  // before the first observation — see the note above
  for(const s of list){ if(s.d<=d) cur=s; else break; }
  return cur;
}
/* THE AGENT LIST WINS THE WHOLE CURRENT MONTH (Nick, 2026-08-27 — the third time: "when
   the agent list is updating, it needs to update all the time"). The list is a CORRECTION
   of the current month, not an event inside it: when a new list moves an agent's team
   leader or campaign, every report of the month must read the new assignment — a mover
   still sitting under the old leader for the month-so-far reads as "the upload did
   nothing" (Renolan→Hezron, 27 Aug, seven agents). So a list ingest REWRITES the agent's
   segments inside the list's own month and leaves every earlier month exactly as it
   stood: historical attribution (non-negotiable 11) still holds, at MONTH grain — the
   grain every report actually uses. Only the Agent List gets this power; the tracker's
   dated rows still file day-level history through recordOrg, and a later list collapses
   them only within its own month. The placeholder rules survive unchanged: a TBC list
   row never erases a real leader, and a first real assignment still backdates over an
   all-placeholder history. */
function recordOrgList(code,asOf,val){
  if(!code||!/^\d{4}-\d{2}-\d{2}$/.test(asOf||'')) return false;
  const seg={d:asOf,tl:String(val.tl||'').trim(),campaign:String(val.campaign||'').trim(),
             tenure:String(val.tenure||'').trim(),src:'agent-list'};
  if(!seg.tl&&!seg.campaign) return false;          // nothing to attribute — don't record a blank
  const list=S.orgHist[code]=S.orgHist[code]||[];
  // first real assignment after placeholder-only history: back-date the WHOLE history
  if(!provisionalTL(seg.tl)&&list.length&&list.every(s=>provisionalTL(s.tl)))
    for(const s of list){ s.tl=seg.tl; if(seg.campaign)s.campaign=seg.campaign; s.src=(s.src||'')+'+backdated'; }
  /* Only THIS list's month is rewritten. Segments from earlier months are history and
     stay; segments from LATER months (files loaded out of order — the backwards-load
     invariant) are someone else's month and must survive too. */
  const ms=asOf.slice(0,8)+'01';
  const nextMs=(()=>{const y=+asOf.slice(0,4),m=+asOf.slice(5,7);
    return m===12?(y+1)+'-01-01':y+'-'+String(m+1).padStart(2,'0')+'-01';})();
  const pre=list.filter(s=>s.d<ms), mid=list.filter(s=>s.d>=ms&&s.d<nextMs), post=list.filter(s=>s.d>=nextMs);
  const inForce=mid.length?mid[mid.length-1]:(pre.length?pre[pre.length-1]:null);
  if(provisionalTL(seg.tl)&&inForce&&!provisionalTL(inForce.tl)){
    if(!seg.campaign||seg.campaign===inForce.campaign) return false;  // nothing real to record
    seg.tl=inForce.tl;                                                // keep the real leader
  }
  /* The month segment starts at the month boundary — or at the agent's first sighting
     when their whole history begins inside this month (a new intake keeps its true
     start date, so their pre-arrival days never claim an org). */
  seg.d=pre.length?ms:(mid.length?mid[0].d:asOf);
  const moved=!!inForce&&(inForce.tl!==seg.tl||(!!seg.campaign&&inForce.campaign!==seg.campaign));
  const next=pre.slice();
  const prev=next[next.length-1];
  if(!prev||!sameOrg(prev,seg)) next.push(seg);     // month inherits when nothing changed
  for(const s of post){ const p=next[next.length-1]; if(!p||!sameOrg(p,s)) next.push(s); }
  S.orgHist[code]=next;
  return moved;
}
/* The date an Agent List snapshot describes. An explicit "effective from" wins (upload a list
   you are loading late and say so), then a date in the filename, then today. Never the file's
   dates array — a roster carries no activity dates.
   The override is ONE-SHOT, and deliberately so. A sticky one would sit in the settings
   unnoticed and quietly back-date every list uploaded after it, so a real reorganisation
   months later would be recorded against a date in the past and land in the wrong month —
   the exact failure this whole mechanism exists to prevent, arriving through its own
   controls. It applies to the next list and then clears itself. */
let __rosterAsOf=null;   // resolved once per FILE — a multi-sheet workbook calls this per sheet
function rosterAsOf(name){
  if(__rosterAsOf) return __rosterAsOf;
  const ov=(S.settings&&S.settings.rosterAsOf)||'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(ov)){ S.settings.rosterAsOf=''; return (__rosterAsOf=ov); }
  return (__rosterAsOf=dateFromFilename(name)||dkey(new Date()));
}

let toastTimer=null;
function toast(msg,ms){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),ms||2600); }

/* ================= classification rules ================= */
/* ATTENDANCE SHIFT WEIGHT — spec §4's table, keyed on the register's Status Code.
   P = 1 · HDCA = 0,5 · CA, UCA, SL, FRL, AL, L, Suspended = 0 · anything unknown = 0.
   Two paths on purpose: attendance stored by THIS build carries the code, but blobs
   written by an earlier build (and any export without the column) carry the long text,
   so the word-match fallback has to stay or every historical day silently reads zero.
   Terminated/Resigned is an app extension, not a spec status — it ends employment and is
   the reason this returns -1 rather than 0. */
function attWeight(status){
  const ov=S.settings.attOverride||{};
  if(status in ov) return ov[status];
  const raw=String(status||'').trim();
  if(raw in MTD_RULES.attWeights) return MTD_RULES.attWeights[raw];
  const s=raw.toLowerCase();
  if(s==='present') return 1;
  if(s==='training') return S.settings.trainingCounts?1:0;
  if(s.includes('half')) return 0.5;
  if(s==='terminated'||s==='resigned') return -1;   // ends employment
  return 0;
}
function isOptIn(disp){
  const s=(disp||'').toLowerCase();
  return s.includes('insurance opt') && !s.includes('no insurance');
}
function isSaleDisp(disp){
  const s=(disp||'').toLowerCase();
  return (s.includes('sale')&&!s.startsWith('no sale')&&!s.includes('after sales')) || s==='saleinsoptin';
}

/* ================= ingestion ================= */
function detectType(header, sheetName, recs){
  const H=header.map(h=>h.toLowerCase());
  const has=(...ks)=>ks.every(k=>H.some(h=>h.includes(k)));
  if(has('charge amount','contract create date')&&has('account number')){
    // Power BI Active vs Inactive are HEADER-IDENTICAL supersets (both carry 40+
    // columns incl. Contract Deactivate Date) — only the DATA tells them apart:
    // in an Active export the deactivate date is empty on every row; in an Inactive
    // (cancellations) export it is filled on every row. Un-guarded, an Inactive file
    // would REPLACE real sales days with cancelled-contract charges. The deactivate
    // column appears exactly once, so this sniff is immune to the export's duplicated
    // Contract Status / Charge Amount headers.
    const sample=(recs||[]).slice(0,500);
    const dd=sample.filter(r=>String(r['Contract Deactivate Date']||'').trim()!=='').length;
    if(sample.length&&dd>=sample.length/2) return 'inactive';   // cancellations - the MTD Cancellations column
    return 'bi';   // Power BI - Active Cases (the money source)
  }
  /* ViciDial EXPORT_CALL_REPORT — one row per CALL, tab-separated. Sniffed on its own
     lower-case snake_case columns, which nothing else in the drop uses. Checked BEFORE
     attendance: this file carries both a 'status' and a date column and would otherwise be
     read as an HR register with no Employee Code, loading nothing. */
  if(has('call_date','length_in_sec')&&has('user')) return 'viciCalls';
  if(has('date & time','lead disposition')) return 'calls';
  if(has('employee code','status')&&has('date')) return 'attendance';   // Employee Name not required — the parser never reads it
  if(has('qa agent','sales agent cb')) return 'evals';
  /* Salesforce case exports. Lead Management moved here 2026-08-18. Closed is checked
     FIRST — it carries Case Number + Case Owner too and would otherwise be read as the open
     snapshot and overwrite it. 'opencases' is only the DETECTED shape: ingestText routes it
     to Lead Management when the slot or filename says so, and INGEST.opencases refuses the
     rest (the retired Lead Allocation pull, removed 2026-08-27). */
  if(has('date/time closed')) return 'closedcases';
  if(has('case number','case owner')) return 'opencases';
  /* Manual Stats — the agent-logged daily board that feeds the Variance Report
     (spec vas_daily_tracker layout: Agent Name + Sale 1..Sale 27 + Total Sales/GWP +
     Referrals, one day per sheet named DD.MM). 'Sale 1' appears in no other export, so
     this cannot collide with the roster/tracker/referrals detects — but it is checked
     before them because they also key on agent-name columns. */
  if(has('agent name','sale 1')) return 'board';
  /* Referrals from the HighLevel pull (tools/fetch-referrals.mjs) — either shape: the
     row-level per-contact export or the per-agent counts summary. Checked before roster:
     both carry agent-name columns but neither has Team Leader. */
  if(has('agent name','referral count')) return 'referrals';
  if(has('agent_name','referrals')) return 'referralsAgg';
  if(has('team leader','agent name')&&(has('sales force')||has('call x'))) return 'roster';
  if(has('date','team leader','emp code','sales achieved')) return 'trackerDaily';
  return null;
}

let rosterCovered=null; // campaigns already replaced by an earlier sheet of the same file
/* EVERY CODE THIS WORKBOOK NAMES, across all of its sheets. A sheet replaces only the
   campaigns it COVERS — necessary, because the VAS and VT tabs are separate sheets and
   neither may delete the other's people. But that left a hole: remove a whole team and,
   if their campaign then appears nowhere in the workbook, nothing "covers" it and they
   are silently kept. Removing Renolan Pillay's 20 agents dropped his 10 Cuddle people and
   KEPT his 10 Nesting ones, because Nesting had no rows left to cover it — so he went on
   showing as a Nesting team leader with a team, on Month to Date and everywhere else.
   The FILE is the whole truth about the floor, so the union is pruned against once every
   sheet has been read. */
let rosterFileCodes=null, rosterFileLoaded=false;
/* THE FILE AS IT ARRIVED — every row of every sheet, unclassified — for the publisher. The
   server derives the roster from these (publish_agent_list); this app's own classification
   is a preview it then replaces with the record. */
let rosterRaw=null;
/* …and how good the sheet that replaced them was. The Agent List workbook still carries
   legacy tabs ('May' — a Que-column snapshot frozen at 83 rows) ALONGSIDE the live 'VAS'
   tab, and the legacy one sorts FIRST. Sheet order therefore cannot decide which wins: on
   the day the VAS tab has no Nesting agents its campaigns are a subset of what May already
   covered, it would be skipped as redundant, and the whole floor would silently revert to
   a May snapshot. Format decides instead. */
let rosterBestRank=-1;
let __curFileHash=null; // content hash of the file being ingested — regFile stamps it on the registry entry
/* THE GENERATED TRACKER IS AN OUTPUT, NOT AN INPUT. "VAS - <Month> MTD Tracker.xlsx" is the
   workbook this app produces (Export report). Dropped back in with the day's exports it does
   real damage, silently:

     · Its "Team Split" sheet is a column-for-column clone of the Agent List's VAS sheet, so
       detectType reads it as a roster and INGEST.roster then supersedes the live Agent List
       with the stale snapshot frozen into the report. Measured on the 1-4 Aug workbook:
       Courtesy 40 -> 42, Nesting 4 -> 8, six departed agents resurrected, and its campaign
       column says "Courtesy - Nesting" rather than "Nesting".
     · Its "August" sheet is trackerDaily-shaped, so yesterday's computed figures get stored
       as facts and then override today's live ones through the trackerIsSource path.

   Both make the whole report wrong in a way nothing on screen explains. The file is refused
   whole — recognised by its own sheet names, so a rename cannot sneak it past. */
const TRACKER_OUTPUT_SHEETS=[/^team split$/i,/^tl mtd$/i,/^pivot table$/i,/^(mtd|wtd)\s*-\s*/i];
function isGeneratedTracker(names){
  const hits=TRACKER_OUTPUT_SHEETS.filter(re=>names.some(n=>re.test(n.trim()))).length;
  return hits>=2;   // two independent output sheets — no ordinary export looks like this
}
async function ingestText(name, text, expected, hash){
  __curFileHash=hash||null;
  const sheets=splitSheets(text);
  const names=Object.keys(sheets);
  let ingested=[];
  rosterCovered=new Set(); rosterBestRank=-1; rosterFileCodes=null; rosterFileLoaded=false; rosterRaw=null;
  __rosterAsOf=null;      // a fresh file, a fresh snapshot date (and a fresh one-shot override)
  if(isGeneratedTracker(names)){
    toast('"'+name+'" is a tracker workbook this dashboard GENERATED, not a data export — it was not loaded. '
      +'Its Team Split sheet is a stale copy of the agent list and would overwrite your live roster. '
      +'Upload the raw exports instead (Agent List, BI, dialler, attendance, QA).',12000);
    return false;
  }
  // prefer roster sheets named VAS / Agent List when multi-sheet
  const order=names.sort((a,b)=>{
    const rank=n=>/agent list|vas$/i.test(n)?0:(/^(june|july|august|september|october|november|december|january|february|march|april|may)$/i.test(n)?1:2);
    return rank(a)-rank(b);
  });
  let dailyDone=false;
  for(const sn of order){
    if(/"USER NAME"/.test(sheets[sn])&&/time range:/i.test(sheets[sn])){
      const vr=INGEST.vici(sheets[sn],name); if(vr){ ingested.push(vr); continue; }
    }
    const {header,recs}=await toObjectsAsync(await parseCSVAsync(sheets[sn], sniffDelim(sheets[sn])));
    if(!recs.length) continue;
    let type=detectType(header, sn, recs);
    if(!type) continue;
    /* WHICH LEAD PAGE DOES THIS OPEN-CASES PULL BELONG TO? The two Salesforce exports are
       header-identical, so detectType cannot tell them apart and must not try. The SLOT the
       file was dropped on is the user's own declaration; a bulk drop falls back to the
       filename, which Salesforce already stamps (Lead Management Open Cases ....xls). */
    if(type==='opencases'&&(expected==='opencasesLM'||name.toLowerCase().split(' ').join('').indexOf('leadmanage')>=0)) type='opencasesLM';
    if(type==='trackerDaily'&&dailyDone) continue;
    const res=INGEST[type](recs, name, sn);
    if(res){ ingested.push(res); if(type==='trackerDaily')dailyDone=true; }
  }
  /* THE WORKBOOK IS THE WHOLE TRUTH. Every sheet has now been read, so anyone still on the
     roster whom the file never names has left — including a whole campaign that vanished,
     which no single sheet could express. Never runs unless a roster sheet actually loaded,
     and never empties the roster: a parse that yielded nothing is a bad file, not an empty
     floor. Departures are NAMED, never silent. */
  if(rosterFileLoaded && rosterFileCodes && rosterFileCodes.size){
    const gone=(S.roster||[]).filter(a=>!rosterFileCodes.has(a.code));
    if(gone.length && gone.length<(S.roster||[]).length){
      S.roster=(S.roster||[]).filter(a=>rosterFileCodes.has(a.code));
      const by={}; gone.forEach(a=>{const k=(a.tl||'no team leader')+' · '+(a.campaign||'no campaign');
        by[k]=(by[k]||0)+1;});
      toast(gone.length+' agent(s) are on the dashboard but not in this Agent List — removed: '
        +Object.entries(by).map(([k,v])=>k+' ('+v+')').join(', '),12000);
    }
  }
  if(!ingested.length && expected && INGEST[expected]){
    // slot upload with unrecognised headers: try the slot's own parser as a last resort
    const first=Object.values(sheets)[0]||'';
    const {recs}=await toObjectsAsync(await parseCSVAsync(first, sniffDelim(first)));
    if(recs.length){ try{ const res=INGEST[expected](recs,name); if(res) ingested.push(res); }catch(err){} }
  }
  if(!ingested.length){ toast('Could not recognise "'+name+'" — check the file headers'); return false; }
  if(expected){
    const SLOT_TYPES={bi:['bi'],calls:['calls'],attendance:['attendance'],inactive:['cancellations'],vici:['calls (ViciDial)','vici'],
      evals:['evals'],roster:['roster'],trackerDaily:['tracker','roster'],referrals:['referrals'],board:['board']};
    const want=SLOT_TYPES[expected]||[expected];
    if(!ingested.some(r=>want.some(w=>r.type.startsWith(w))))
      toast('Heads up: "'+name+'" is actually '+ingested.map(r=>r.type).join(', ')+' — filed there instead');
  }
  save(); return true;
}

/* THE SOURCE REGISTRY - one place that knows what a data store is.
   This knowledge used to be copied in four places (this map, removeFile's own private
   copy, normalizeState's seed list and the Clear-uploaded-data button). Adding a source
   meant remembering all four, and twice it was not: cancellations became undeletable
   because removeFile's copy was stale, and canc/vici/viciDays were missing from
   normalizeState, which would have killed the app on the next hydrate against an older
   cloud blob. One list now, used by all four. */
// file type (first word of the registry type) -> the store it owns
const STORE_OF={bi:'sales',calls:'calls',attendance:'att',evals:'evals',tracker:'tracker',board:'board'};   // cancellations key by contract, not day - removeFile handles them
function regFile(name,type,dates,rows,extra){
  const nd=[...dates].sort();
  // same file re-uploaded with a SMALLER date span: days the old version stored but the
  // new one no longer carries would otherwise survive with no registry entry claiming
  // them — feeding KPIs forever and undeletable from the UI. Clear them (unless another
  // file also claims the day).
  const old=S.files.find(f=>f.name===name&&f.type===type);
  if(old){
    const t0=type.split(' ')[0], st=STORE_OF[t0];
    if(st) for(const d of old.dates||[]){
      if(nd.includes(d)) continue;
      if(S.files.some(x=>x!==old&&x.type.split(' ')[0]===t0&&(x.dates||[]).includes(d))) continue;
      if(st==='calls'){ if(S.callsMeta&&S.callsMeta[d]&&S.callsMeta[d].f===name){ delete S.calls[d]; delete S.callsMeta[d]; } }
      else if(st==='evals'){   // QA days hold more than one file's evaluations — drop only this file's
        const bk=S.evals[d]; if(!bk) continue;
        for(const c in bk){ const keep=(bk[c]||[]).filter(e=>!(e&&e.f===name)); if(keep.length) bk[c]=keep; else delete bk[c]; }
        if(!Object.keys(bk).length) delete S.evals[d];
      }
      else delete S[st][d];
    }
  }
  S.files=S.files.filter(f=>!(f.name===name&&f.type===type));
  S.files.push({name,type,dates:nd,rows,at:new Date().toISOString().slice(0,16).replace('T',' '),
    ...(__curFileHash?{hash:__curFileHash}:{}),...(extra||{})});
  return {type,rows,dates:nd};
}

/* GROSS SALES — recompute every stored day's Sales Achieved and GWP from the per-account
   charge maps. Two rules, both learnt by reconciling against the hand-built MTD workbook:

   1. SALES ARE GROSS OF CANCELLATION. "Power BI - Active Cases" only lists contracts that
      are STILL active, so a sale that cancels after month-start silently vanishes from it.
      Left alone, Sales Achieved and GWP shrink a little every day the export is re-pulled,
      and "% of Cancellations to Sales" measures cancellations against a NET denominator —
      the one figure it must never be measured against. The Inactive export carries those
      same accounts with their own Contract Create Date, so they are added back here.
      The union is at ACCOUNT level, never row level: an account whose third contract
      cancelled is still ONE sale, but its charge must come back (7 sales / R668 -> 7 / R693),
      while a fully cancelled account is a whole sale returning (34 / R3 446 -> 35 / R3 545).

   2. GWP ROUNDS PER ACCOUNT, NOT PER TOTAL. The export's Charge Amount lines are 2dp and
      ex-VAT: 30,43 + 33,91 + 21,74 = 86,08, and 86,08 x 1,15 = 98,992 — but the account
      bills R99. Rounding each account to the rand before summing is what reproduces the
      workbook to the cent; grossing up the agent's total instead leaves every agent short.

   Idempotent by construction: `a` holds ACTIVE accounts only and is never mutated, so this
   can run after either upload, in either order, as many times as it likes. Days stored by an
   older build carry no `a` map and are left exactly as they are rather than zeroed. */
/* IS THIS UNIT A SALE? Every consumer of the unit map — ingest, gross-up, the variance
   builder — must answer this identically, so it is asked in exactly one place. A cased unit
   is a sale; the pooled '~uncased' residual carries GWP but is not a sale event. */
const saleUnit=k=>k!==MTD_RULES.uncasedUnitKey;
/* A day written by the case-grain ingest is stamped u:'case'. Days stored by an earlier
   build hold ACCOUNT keys and cannot be regrained in place — the Case Number never survived
   ingest — so they are named rather than silently mixed with case-grain days. */
const caseGrainDay=rec=>!!(rec&&rec.u==='case');
function staleGrainDays(){
  const out=[];
  for(const d in S.sales){ const day=S.sales[d];
    const recs=Object.values(day).filter(r=>r&&r.a);
    if(recs.length&&!recs.some(caseGrainDay)) out.push(d); }
  return out.sort();
}
/* THE REGRAIN DOES NOT APPLY ITSELF, AND SILENCE ABOUT THAT IS THE WHOLE PROBLEM.
   Stored BI days hold ACCOUNT keys — Case Number never survived the old ingest — so the money
   model's unit and the net-of-cancellation rule only take effect for days whose export is
   uploaded AGAIN. Without this banner the app shows yesterday's rule with today's label and
   the honest reading is "I deployed it and nothing changed". The app knows exactly which days
   are stale, so it names them and names the fix. */
function staleGrainBanner(){
  const d=staleGrainDays(); if(!d.length) return '';
  const span=d.length>1?d[0]+' → '+d[d.length-1]:d[0];
  return `<div class="card" style="border-left:3px solid var(--amber);margin-bottom:14px">
    <div style="font-size:14px"><b>${fmtNum(d.length)} stored day(s) still count sales per ACCOUNT, not per case</b> — ${esc(span)}.</div>
    <p class="note" style="margin:7px 0 0">
    ${MTD_RULES.salesNetOfCancellation?'Cancellations <b>are</b> already applied to these days — that rule is re-derived from the stored data on every build, so the figures on screen are net. ':''}
    What is not applied is the unit: one sale per <b>${esc(MTD_RULES.saleUnit)}</b>. Case Number was never stored by the old ingest,
    so these days cannot be regrained in place. <b>Re-upload the BI Active and BI Inactive exports</b> covering them to finish the move.
    It changes a figure only where one agent closed two or more cases for the same customer on the same day — rare, and today it is
    exactly the case that reads as one double-value sale instead of two at target.</p></div>`;
}
/* THE AGENT LIST GUARD, ON SCREEN. rebuild() reconciles the current month's model against
   the roster after every build (window.__listCheck); while they agree this is an empty
   string, and the moment any future regression lets a mover keep an old campaign or team
   leader it becomes a red banner NAMING them — the failure mode is loud, never "nesting
   didn't move again" discovered by eye (Nick, 2026-08-27). */
function listAppliedBanner(){
  const c=window.__listCheck; if(!c||!c.bad||!c.bad.length) return '';
  const few=c.bad.slice(0,6).map(b=>esc(b.code)+' '+esc(b.name)+' (shows '+esc(b.model)+' — list says '+esc(b.list)+')');
  return `<div class="card" style="border-left:3px solid #C42D2D;margin-bottom:14px">
    <div style="font-size:14px"><b>${fmtNum(c.bad.length)} agent(s) do not match the current Agent List</b> — the list should own the whole month.</div>
    <p class="note" style="margin:7px 0 0">${few.join(' · ')}${c.bad.length>6?' +'+fmtNum(c.bad.length-6)+' more':''}.
    Re-upload the Agent List in <a class="linky" onclick="go('data')">Upload Station</a>. If this banner survives a re-upload,
    the whole-month rule has regressed — report it rather than working around it.</p></div>`;
}
function grossUpSales(){
  const VAT=MTD_VAT;                                // the MTD_RULES.vat rule, not a copy of it
  const net=!!MTD_RULES.salesNetOfCancellation;
  const back={};                                    // date -> ownerKey -> unit -> ex-VAT charge
  /* NET: a cancelled sale is not added back at all, so the count is what is still active.
     GROSS: the union returns, keyed on the CASE (r.c) so it merges with the same case in
     Active rather than arriving as a second unit. Rows stored before the regrain carry no
     case and fall back to their account — correct for their own grain, and those days are
     flagged for re-upload by staleGrainDays() rather than silently blended. */
  if(!net) for(const k in (S.cancRows||{})){
    const r=S.cancRows[k]; if(!r) continue;
    const unit=r.c||r.a; if(!unit) continue;        // record predates unit-level detail
    const ow=normName(r.owner);
    const o=((back[r.d]=back[r.d]||{})[ow]=back[r.d][ow]||{});
    o[unit]=(o[unit]||0)+(r.x||0);
  }
  for(const d in S.sales){
    const day=S.sales[d];
    // a day stored before this build has no unit detail — recomputing it would zero it
    if(!Object.values(day).some(r=>r&&r.a)) continue;
    const b=back[d]||{};
    // a unit that cancelled in full is absent from Active entirely: its owner may not
    // have a row on this day at all, and that whole sale still belongs to them
    for(const ow in b) if(!day[ow]) day[ow]={a:{},u:'case',n:0,gwp:0,canc:0};
    for(const ow in day){
      const rec=day[ow]; if(!rec.a) continue;
      const units=Object.assign({},rec.a), add=b[ow]||{};
      for(const u in add) units[u]=(units[u]||0)+add[u];
      /* GWP GROSSES ONCE, OFF THE CHARGE TOTAL — the pivot's formula (Nick, 2026-08-18:
         "Sum of Charge Amount", then VAT). Rounding each case to the rand first and adding
         those up drifts a rand or two per agent, because every case rounds the same way; the
         charge lines are the raw material and the rand is applied to their sum. `x` keeps the
         ex-VAT total so every level above — day, week, MTD — can gross once rather than
         re-round an already-rounded number. */
      let n=0,x=0;
      for(const u in units){ if(saleUnit(u)) n++; x+=units[u]; }
      rec.n=n; rec.x=x; rec.gwp=Math.round(x*VAT); rec.canc=rec.canc||0;
    }
  }
}

const INGEST={
  // Power BI - Active Cases — THE money source (replaces Activated Services + the GWP
  // price list). GWP = Σ Charge Amount per account × (1+VAT); charges are EX-VAT (proof:
  // 30,43+33,91+21,74 = 86,08 = 99 ÷ 1,15). Each row is dated by its OWN Contract Create
  // Date; the agent is the Owner. Fills the same S.sales[date][owner]={n,gwp,canc} the
  // rest of the model reads, so nothing downstream changes. Months accumulate by date key.
  bi(recs,name){
    const byDate={};                                  // date -> owner -> {case: ex-VAT charge}
    const dates=new Set();
    let skip=0;
    let excl=0;
    let uncased=0, uncasedVal=0;                      // recurring feature lines — money, not sales
    /* DOES THIS EXPORT CARRY THE CASE COLUMN AT ALL? A row with a BLANK Case Number is a
       recurring feature line and correctly counts no sale. A FILE WITH NO CASE COLUMN is a
       different thing entirely — every row would look uncased and the day would report zero
       sales while still carrying its money, which is the worst kind of wrong: quiet, and
       shaped like real data. Salesforce has changed this export's columns before, so the
       shape is checked rather than assumed: no column, fall back to the ACCOUNT (the grain
       used before 2026-08-18) and say so loudly. */
    const hasCaseCol=recs.some(r=>'Case Number' in r);
    for(const r of recs){
      const acc=String(r['Account Number']||'').trim();
      if(!acc||/^applied filters/i.test(acc)) continue;          // R-ING-BI-07 footer guard (expected junk, not counted)
      /* TEST DATA (spec §2). Charge code TESTRR and account 622622 are internal test rows
         that otherwise land on a real agent's day as real money. Counted and reported —
         "excluded records must be counted, never silently dropped". */
      if(MTD_RULES.excludeChargeCodes.includes(String(r['Charge Code']||'').trim().toUpperCase())){ excl++; continue; }
      if(MTD_RULES.excludeAccounts.includes(acc)){ excl++; continue; }
      /* 'Charge Amount' ONLY. The export also carries a byte-identical 'Charge Amount_1'
         (the spec's 'Charge Amount.1') — reading both doubles GWP. */
      // ZA comma-decimal safe: '30,43' must read 30.43, not 3043
      const chg=parseFloat(String(r['Charge Amount']||'').replace(/\s/g,'').replace(/^(-?\d+),(\d+)$/,'$1.$2').replace(/[^0-9.\-]/g,''));
      if(isNaN(chg)){ skip++; continue; }
      const d=String(r['Contract Create Date']||'').slice(0,10); // ISO 'YYYY-MM-DD …'
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ skip++; continue; }
      const owner=normName(r['Owner']);
      dates.add(d);
      /* THE UNIT IS THE CASE. Case Number ships as TEXT (Excel flags it "number stored as
         text"), so it is stringified rather than compared numerically. A row with no case is
         a recurring feature line: pooled into ONE residual per agent-day, which carries its
         money into GWP but is never counted as a sale. */
      const cs=String(r['Case Number']||'').trim();
      const unit=hasCaseCol?(cs||MTD_RULES.uncasedUnitKey):acc;   // no case column -> account grain
      if(hasCaseCol&&!cs){ uncased++; uncasedVal+=chg; }
      const o=((byDate[d]=byDate[d]||{})[owner]=byDate[d][owner]||{});
      o[unit]=(o[unit]||0)+chg;
    }
    /* THE DAY IS THE RECORD SET, AND REPLACING IT *IS* THE PER-RECORD MERGE HERE — this is
       the one source where merging account by account would create duplicates rather than
       prevent them. `a` means "accounts created on this date that are STILL ACTIVE", and
       grossUpSales() reconstructs the rest by adding the cancelled accounts back from the
       Inactive export. Keep an account a newer pull has dropped and it comes back a second
       time through the gross-up: a fully cancelled account would be counted twice.
       The properties the incremental rule actually asks for all hold: re-uploading a file
       reproduces the same day exactly (idempotent), an overlapping range updates only the
       days it covers and leaves the rest alone, and a corrected row replaces its own
       predecessor instead of joining it.
       What that leaves is a PARTIAL pull — one filtered to a campaign or a team — which
       would legitimately shrink a day it has no business shrinking. That cannot be told
       apart from real cancellation by the data, so it is not guessed at: it is counted and
       said out loud, the same treatment every other dropped record gets here. */
    const shrunk=[];
    for(const d of dates){
      const prev=S.sales[d]||{};
      // count SALE units on both sides — a stored day on the old account grain is compared
      // like for like only after it is re-uploaded, which staleGrainDays() insists on
      let had=0; for(const o in prev) if(prev[o]&&prev[o].a) had+=Object.keys(prev[o].a).filter(saleUnit).length;
      let now=0; for(const o in byDate[d]) now+=Object.keys(byDate[d][o]).filter(saleUnit).length;
      if(had&&now<had) shrunk.push({d,lost:had-now,had});
      S.sales[d]={};
      for(const owner in byDate[d]) S.sales[d][owner]={a:byDate[d][owner],u:hasCaseCol?'case':'account',n:0,gwp:0,canc:0};
    }
    if(shrunk.length){
      const tot=shrunk.reduce((t,x)=>t+x.lost,0);
      toast('"'+name+'" carries fewer sales than were already stored on '+shrunk.length+' day(s) — '
        +tot+' case(s) gone. Expected if they cancelled'+(MTD_RULES.salesNetOfCancellation?' (sales are counted NET, so a cancelled sale leaves the count)':' (the Inactive export adds them back)')+'; '
        +'if this was a filtered pull, re-upload the full export. Days: '
        +shrunk.slice(0,4).map(x=>x.d+' (−'+x.lost+')').join(', ')+(shrunk.length>4?' +'+(shrunk.length-4)+' more':''),12000);
    }
    if(!dates.size) return null;              // stored nothing -> not a load; fail loudly
    grossUpSales();
    if(excl) toast(excl+' test row(s) excluded from "'+name+'" (charge code '+MTD_RULES.excludeChargeCodes.join('/')+', account '+MTD_RULES.excludeAccounts.join('/')+')');
    /* SAY WHAT LANDED OUTSIDE A CASE. These rows carry real money into GWP but are not sale
       events, and staying silent about them is how a GWP/sale figure drifts unexplained. */
    if(!hasCaseCol) toast('"'+name+'" has NO "Case Number" column — the export shape changed. '
      +'Sales for the day(s) it covers are counted per ACCOUNT (the pre-2026-08-18 grain), not per case, '
      +'and are flagged on the Data tab until an export carrying the column replaces them. '
      +'Re-pull the BI Active export with Case Number included.',15000);
    if(uncased) toast(uncased+' row(s) in "'+name+'" carry no Case Number — recurring feature lines, '
      +'not sales. Their R'+Math.round(uncasedVal*MTD_VAT)+' is counted in GWP and pooled per agent-day; '
      +'they add nothing to the sales count.',11000);
    return regFile(name,'bi',[...dates].sort(),recs.length,{skip,excl,uncased,uncasedVal:Math.round(uncasedVal*MTD_VAT),unit:'case'});
  },
  calls(recs,name){
    const dates=new Set();
    const buckets={};
    let skip=0, retired=0;
    for(const r of recs){
      const d=parseDateLoose(r['Date & Time']); if(!d){ skip++; continue; }
      /* CALLX IS RETIRED for days on/after the cutover — the whole floor is on ViciDial.
         Earlier days still load, so an August correction can always land. */
      if(MTD_RULES.callxRetired&&d>=MTD_RULES.callxRetired){ retired++; continue; }
      const agent=(r['Agent']||'').trim(); if(!agent){ skip++; continue; }  // before dates.add: a day of only agent-less rows must not claim the date with an empty bucket
      dates.add(d);
      const key=agent;   // resolved to an employee code at report-build time
      const bk=(buckets[d]=buckets[d]||{});
      const b=bk[key]=bk[key]||{talk:0,calls:0,ans:0,opt:0,saleD:0};
      /* TALK TIME IS CONNECTED TIME. 'Duration' is the whole call including the ring — about
         13 seconds on every dial, and on a 220-dial day that is over an hour of ringing
         counted as talking (Cohen Govender, 3 Aug: 3:56:21 by Duration against 2:13:19 in the
         hand-built tracker). 'Billable Seconds' is the connected leg — zero on every BUSY /
         NO ANSWER row, so no separate answered-only filter is needed — and it lands within a
         few percent of the tracker on every agent-day tested, where Duration is 39-77% over.
         Files that predate the column (or a dialler that does not emit it) fall back to
         Duration rather than reporting no talk at all. */
      const conn=r['Billable Seconds'];
      b.talk+=(conn===''||conn==null)?durSecs(r['Duration']):durSecs(conn); b.calls++;
      if((r['Bridge']||'').toUpperCase()==='ANSWERED') b.ans++;
      if(isOptIn(r['Lead Disposition'])) b.opt++;
      if(isSaleDisp(r['Lead Disposition'])) b.saleD++;
    }
    // FULLEST-DAY-WINS: dialer exports overlap (a "(2)" partial re-export next to the big
    // date-range file). Blind replace let the LAST file wipe a fuller day loaded earlier.
    // Per date, keep whichever FILE recorded more calls; same-file re-upload always wins
    // (it is the corrected version of itself). Provenance lives in S.callsMeta[date].
    S.callsMeta=S.callsMeta||{};
    const stored=[]; let kept=0;
    for(const d of dates){
      const bk=buckets[d]||{};
      let n=0; for(const k in bk) n+=bk[k].calls;
      // Split what is already stored for this day by dialler. ViciDial entries are carried
      // over untouched - the two systems cover different agents on the same day - and the
      // fullest-day comparison is made against the OTHER CallX rows only. Comparing a CallX
      // file against ViciDial's call count let a Vici day block the CallX load entirely.
      const pd=S.calls[d]||{}; const prevV={}; let prevOtherN=0;
      for(const k in pd){ if(pd[k]&&pd[k].v) prevV[k]=pd[k]; else prevOtherN+=(pd[k].calls||0); }
      const m=S.callsMeta[d];
      if(m&&m.f!==name&&prevOtherN>n){ kept++; continue; }       // an earlier CallX file holds a fuller day
      // Where both diallers hold the same agent on this day, the fuller record wins.





      for(const k in prevV) if(!bk[k]||(bk[k].talk||0)<prevV[k].talk) bk[k]=prevV[k];
      S.calls[d]=bk; S.callsMeta[d]={f:name,n};
      stored.push(d);
    }
    if(kept) toast(kept+' day'+(kept>1?'s':'')+' in '+name+' already covered more fully — kept the fuller data');
    if(retired) toast('CallX retired '+MTD_RULES.callxRetired+' — '+fmtNum(retired)+' row(s) in "'+name
      +'" dated on/after the cutover were refused. The whole floor dials on ViciDial now: pull EXPORT_CALL_REPORT '
      +'with every user group ticked and drop it on the ViciDial slot.'+(dates.size?' Earlier days in this file loaded as history.':''),12000);
    if(!stored.length&&dates.size) return regFile(name,'calls',[],recs.length,{skip,retired}); // recognised, but every day was fuller elsewhere
    if(!dates.size) return retired?regFile(name,'calls',[],recs.length,{skip,retired}):null;   // all-retired file: acknowledged, nothing stored; otherwise not a load — fail loudly
    return regFile(name,'calls',stored,recs.length,{skip,retired});
  },
  attendance(recs,name){
    const dates=new Set();
    const byDate={};
    let skip=0, nonAgent=0;
    for(const r of recs){
      const d=parseDateLoose(r['Date']); const code=(r['Employee Code']||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!d||!code){ skip++; continue; }
      /* CALL AGENTS ONLY (spec §2). The register covers the whole company — QA, IT, L&D,
         Payroll, Facilities, Marketing, HR, SOS and Exco all carry shift statuses. Counting
         them put support staff into Employed Shifts and every target derived from it.
         The filter is skipped when the column is absent so an older export still loads. */
      const et=(r['Employee Type']||'').trim();
      if(et && et.toLowerCase()!==MTD_RULES.attendanceEmployeeType.toLowerCase()){ nonAgent++; continue; }
      dates.add(d);
      /* STATUS CODE IS CANONICAL (spec §4). The export carries both a long Status
         ("Half Day CA") and its code ("HDCA"); the shift-weight table is keyed on the code,
         so store that and keep the text only as a fallback for exports without the column. */
      (byDate[d]=byDate[d]||{})[code]=r['Status Code']||r['Status']||'';

    if(!dates.size) return null;              // stored nothing -> not a load; fail loudly
    if(nonAgent) toast(nonAgent+' non-agent row(s) excluded from "'+name+'" (Employee Type is not "'+MTD_RULES.attendanceEmployeeType+'")');

  },
  evals(recs,name){
    const dates=new Set(); const byDate={};
    // An evaluation is identified by its Record ID and can only ever count once. A full-
    // history export that repeats a row (or lists it twice) must not score the agent twice.
    const seenIds=new Set();
    let skip=0, dupes=0;
    for(const r of recs){
      /* Filed on the MTD_RULES.qa.dateField day — Date of Assessment since 2026-08-26
         (owner decision; see the rule for why). Fallbacks cover rows missing the column:
         Submitted At is the same event to the day, and Date of Call is the last resort so
         an old-format export still loads. The export's own Week column stays banned. */
      const d=parseDateLoose(r[MTD_RULES.qa.dateField])||parseDateLoose(String(r['Submitted At']||'').slice(0,10))||parseDateLoose(r['Date of Call']);
      if(!d){ skip++; continue; }
      let code=('CB'+((r['Sales Agent CB']||'').match(/(\d+)/)||[])[1]).replace('CBundefined','');
      if(!code){ skip++; continue; }
      /* SUPERSEDED QA CODES (spec §3), QA ROWS ONLY. Eight agents were re-issued a code and
         the QA system still carries the old one; left alone they appear as a second, empty
         agent. Deliberately not applied anywhere else: CB207 is ALSO team leader Renolan
         Pillay's ViciDial ID, and remapping it there would pay his talk time to CB219. */
      if(MTD_RULES.qaCodeCorrections[code]) code=MTD_RULES.qaCodeCorrections[code];
      /* A 0% score is kept. It is exactly an Escalation Decision of "Critical Fail" (24/24 in
         the reference period) — a real outcome, not missing data. Dropping zeros inflates
         every affected agent's average. */
      const sc=parseFloat((r['Score %']||'').replace('%','')); if(!isFinite(sc)){ skip++; continue; }
      const rid=String(r['Record ID']||'').trim();
      if(rid){ if(seenIds.has(rid)){ dupes++; continue; } seenIds.add(rid); }
      dates.add(d);
      const bk=(byDate[d]=byDate[d]||{});
      /* dsp/st feed checks V20-V22: an UPHELD dispute means a recorded score was wrong, so
         the period's QA is provisional, and an evaluation that is not closed can still
         change both score and outcome. Stored per evaluation so the panel can name them. */
      (bk[code]=bk[code]||[]).push({s:sc,rid,f:name,dec:r['Escalation Decision']||'',cat:r['Coaching Category']||r['Critical Fail Category']||'',pri:r['Priority']||'',camp:r['Campaign']||'',
        dsp:(parseFloat(r['Dispute Count'])||0),dspSt:r['Dispute Status']||'',st:r['Status']||''});
    }
    /* A RECORD ID LIVES ON ONE DAY. The per-day merge below can only see rows already on
       the SAME day — so when an evaluation's filing day moves (the call-date -> assessment-
       date change, or QA amending a date at source), the copy on the old day would survive
       and the evaluation would be counted twice. Sweep the incoming Record IDs out of every
       OTHER day first: the upload then MOVES the evaluation rather than duplicating it. */
    {
      const target={};
      for(const d of dates) for(const c in byDate[d]) for(const e of byDate[d][c]) if(e.rid) target[e.rid]=d;
      for(const d in S.evals){
        const bk=S.evals[d];
        for(const c in bk){
          const keep=(bk[c]||[]).filter(e=>{const rid=e&&e.rid; return !(rid&&target[rid]&&target[rid]!==d)});
          if(keep.length) bk[c]=keep; else delete bk[c];
        }
        if(!Object.keys(bk).length) delete S.evals[d];
      }
    }
    /* MERGE BY RECORD ID, never replace the day. The QA export is pulled by whatever window
       or filter the QA team happened to use, so two exports can both cover 3 August and hold
       different evaluations — one per campaign, one re-pulled after a dispute closed. This
       used to assign the day outright, so the second export silently deleted every
       evaluation the first one carried that it did not repeat.
       The Record ID is the evaluation's identity: an ID already stored is UPDATED in place
       (a re-export carries the corrected score, dispute status and outcome) and an ID not
       stored is added. Rows with no Record ID — older exports predate the column — fall back
       to their content and position, which keeps a re-upload of the same file idempotent. */
    for(const d of dates){
      const cur=S.evals[d]||{}, next=byDate[d]||{};
      const keyOf=(e,i)=>e.rid?'#'+e.rid:'~'+[e.s,e.dec,e.cat,e.camp,i].join('|');
      const out={};
      for(const c of new Set([...Object.keys(cur),...Object.keys(next)])){
        const m=new Map();
        // blobs written before evaluations carried detail stored bare numbers
        (cur[c]||[]).forEach((e,i)=>{ const o=(typeof e==='number')?{s:e}:e; m.set(keyOf(o,i),o); });
        (next[c]||[]).forEach((e,i)=>m.set(keyOf(e,i),e));   // the newer export wins on the same evaluation
        const arr=[...m.values()]; if(arr.length) out[c]=arr;
      }
      S.evals[d]=out;
    }
    if(!dates.size) return null;              // stored nothing -> not a load; fail loudly
    return regFile(name,'evals',dates,recs.length,{skip,dupes,basis:MTD_RULES.qa.dateField});
  },
  roster(recs,name,sheet){

      const sfName=(r['Sales Force']||'').trim()==='-'?'':(r['Sales Force']||'').trim();

    if(rank<0){

    // One row per employee code. A sheet that lists someone twice must not put them on the

  /* MANUAL STATS — the agent-logged daily board, the Variance Report's baseline

       overlapping uploads can never double-count (the attendance merge pattern, but
       day-replace because the sheet IS the day's complete record).

       than boardYearWindowDays in the future, then it is last year's sheet. A full
       date in the filename overrides for sheets not named DD.MM.

       fallback and the cross-check — a disagreement is counted and reported, never
       silently reconciled (VR-style: malformed data must not silently change a number).

    // ZA comma-decimal safe, same treatment as the BI Charge Amount
    const num=v=>{ const s=String(v??'').trim(); if(s==='') return null;
      const n=parseFloat(s.replace(/\s/g,'').replace(/^(-?\d+),(\d+)$/,'$1.$2').replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:null; };

      // the board and logged nothing. Absence from the sheet entirely is the different

        +outside.map(fmtPart).join(', ')+'. '
        +(inside.length?'Counted: '+inside.map(fmtPart).join(', ')+'.'
                       :'Nothing in this file lands on Cuddle or Courtesy — the export was pulled without those floors’ user groups. '+pullFix+' If agents show unmatched, upload a current Agent List too.'),

     is stored whole, flagged, and kept OUT of the per-day metrics — never averaged out.
     Identity comes from the agent NAME through resolveKey (the roster is the base): this
     export's own ID column is unreliable — "Kyle Kisten" ships as CB138, who is really
     Jabu Ntombela — and a wrong code would pay one agent's talk time to another. */
  vici(raw,name){
    const q=l=>(l.match(/"([^"]*)"/g)||[]).map(s=>s.slice(1,-1));
    const lines=raw.split(/\r?\n/);
    const rm=raw.match(/time range:\s*(\d{4}-\d{2}-\d{2})[\s\S]*?\sto\s+(\d{4}-\d{2}-\d{2})/i);
    if(!rm) { toast('"'+name+'" is a ViciDial report with no "Time range:" line — its period cannot be established, so it was not loaded'); return null; }
    const from=rm[1], to=rm[2];
    const hi=lines.findIndex(l=>/^\s*"USER NAME"/.test(l));
    if(hi<0) return null;
    const head=q(lines[hi]);
    const rows=[];
    let totals=0, admins=0;
    for(const l of lines.slice(hi+1)){
      if(!l.trim()) continue;
      const c=q(l); if(!c.length) continue;
      const o={}; head.forEach((h,i)=>o[h]=c[i]);
      const grp=(o['CURRENT USER GROUP']||'').trim();
      if(/^totals?$/i.test(grp)){ totals++; continue; }        // the footer line, never an agent
      if(/^admin$/i.test(grp)){ admins++; continue; }           // supervisor consoles, not selling agents
      const nm=(o['USER NAME']||'').trim(); if(!nm) continue;   // identity resolved at model-build time, not here

      const n=k=>parseFloat(o[k])||0;
      rows.push({name:nm, calls:n('CALLS'), talk:durSecs(o['TALK']),
                 saleD:n('SALE')+n('VASNP')+n('VASKP'), opt:n('VASKP'), id:(o['ID']||'').trim()});

    }
    if(!rows.length) return null;
    // Cross-reference the file's own ID column against the roster and report any clash —
    // flagged, never silently trusted (the name has already decided the attribution).
    const clash=rows.filter(r=>{ if(!/^CB\d+$/i.test(r.id)||!IDX) return false; const c=resolveKey(r.name); return c&&c!==r.id.toUpperCase().replace(/[^A-Z0-9]/g,''); });
    if(clash.length) toast(clash.length+' ViciDial row(s) carry an employee code that belongs to someone else — counted by NAME: '
      +clash.slice(0,3).map(r=>r.name+' ('+r.id+' -> '+resolveKey(r.name)+')').join(', '));

    const days=[]; { const d=new Date(from+'T00:00:00Z');
      while(dkey(d)<=to&&days.length<400){ days.push(dkey(d)); d.setUTCDate(d.getUTCDate()+1); } }
    if(days.length===1){
      // Single-day export: merge onto the day. MERGE, not replace — before the 2026-09-01
      // cutover the same day legitimately holds CallX rows beside Vici rows for DIFFERENT
      // agents, and after it two partial Vici pulls of one day can still coexist.
      // Where one agent appears in both, the fuller record wins (never the sum).
      const d=days[0]; const bk=(S.calls[d]=S.calls[d]||{}); let kept=0;
      for(const r of rows){
        const cur=bk[r.name];
        if(cur&&(cur.talk||0)>=r.talk){ kept++; continue; }
        bk[r.name]={talk:r.talk,calls:r.calls,ans:r.calls,opt:r.opt,saleD:r.saleD,v:1};   // v: sourced from ViciDial
      }
      if(kept) toast(kept+' agent-day(s) already had a fuller dialler record - kept those');
      S.viciDays[d]=1;                       // day-level detail exists for this day now (bookkeeping — supersede is per agent)
      delete S.vici[from+'..'+to];
      return regFile(name,'calls (ViciDial)',[d],rows.length,{totals,admins});
    }
    // Multi-day export: stored whole and kept out of the per-day metrics, because there is
    // no honest way to split one number across three days.
    S.vici[from+'..'+to]={from,to,rows,at:new Date().toISOString().slice(0,16).replace('T',' ')};
    toast('"'+name+'" covers '+days.length+' days as one total per agent — stored, but NOT split across those days. Export one day at a time for daily talk time.',9000);
    return regFile(name,'vici range '+from+'..'+to,[],rows.length,{totals,admins,rangeOnly:true});
  },
  // Recognised-but-not-used: these arrive in the same daily export drop as the files
  // this dashboard DOES read. They are acknowledged (no scary "could not recognise")
  // and deliberately touch nothing — the Ops dashboard is where they belong.
  /* CANCELLATIONS — the Power BI Inactive export, the source of the tracker's Cancellations
     and % of Cancellations columns.
     DATED BY CONTRACT CREATE DATE, not deactivate date: a cancellation counts against the
     period the SALE was made in, which is what the tracker does and what makes
     "% of Cancellations to Sales" meaningful — measured against the tracker, create-date
     reproduces it for 59 of 65 agents where deactivate-date managed 46.
     STORED BY CONTRACT IDENTITY, not by day. A contract cancels once, so account|contract|
     deactivate-date is its identity and re-uploading can only ever overwrite the same key.
     That matters here because the export is a window of DEACTIVATIONS whose create dates are
     scattered across months: replacing "the days this file covers" would have wiped older
     months that a narrower pull happens not to mention. */
  inactive(recs,name){
    const seen=new Set();
    let skip=0, dupes=0, added=0, excl=0, casedC=0, uncasedC=0;
    const dates=new Set();
    for(const r of recs){
      const acc=String(r['Account Number']||'').trim();
