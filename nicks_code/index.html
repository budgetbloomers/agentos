       talk, the honest answer is unknown ('-'), not 0:00:00 — the second reads as 'this
       agent did not talk', which is exactly the wrong conclusion when the truth is that no
       call file covers the period. A real zero (the dialler DID cover them and they talked
       for none of it) still shows 0:00:00, because that is a finding worth seeing. */
    o.aveTalk=(o.emp&&(o.talk>0||o.empDial>0))?o.talk/o.emp:null;
    /* TALK PER DAY WORKED — the same seconds over ACTUAL shifts instead of employed ones.
       Ave Talk Time is a utilisation figure: a rostered shift that was not worked drags it
       down, which is the point of it. This is the intensity figure — how hard the agent went
       on the days they were actually there — and the two only diverge where attendance is the
       problem rather than performance. Null, never 0, when no shift was worked: an agent with
       talk and no credited shift has no meaningful per-day rate, and 0 would say the opposite
       of the truth. */
    o.talkPerWorked=o.act?o.talk/o.act:null;
    o.optPct=o.sales?o.opt/o.sales:null; o.refPct=o.sales?o.ref/o.sales:null; o.cancPct=o.sales?o.canc/o.sales:null;
    o.aht=o.ans?o.talk/o.ans:null; o.ansPct=o.calls?o.ans/o.calls:null;
    return o;
  }

  const byAgentDay={}; facts.forEach(f=>{ (byAgentDay[f.code]=byAgentDay[f.code]||[]).push(f); });

  // agent identity list (roster order, then tracker-only codes) — for pivot & adjustments
  /* The team leader shown beside a PERIOD's figures is the one who owned the agent during
     that period — taken from the last day of it we hold activity for — not whoever owns them
     today. `tlNow` carries the current assignment alongside, and `movedInPeriod` marks the
     agents whose work in this very window is split across two leaders, so a report can say
     so instead of quietly picking one. */
  const seen=new Set(), agents=[];
  const lastFact={}, tlsIn={};
  facts.forEach(f=>{ const p=lastFact[f.code]; if(!p||f.date>=p.date) lastFact[f.code]=f;
    if(f.tl) (tlsIn[f.code]=tlsIn[f.code]||new Set()).add(f.tl); });
  const tlSplit=c=>((tlsIn[c]&&tlsIn[c].size)||0)>1;
  for(const a of S.roster) if(byAgentDay[a.code]){ const lf=lastFact[a.code];
    agents.push({...a, tl:(lf&&lf.tl)||a.tl, tlNow:a.tl, movedInPeriod:tlSplit(a.code)}); seen.add(a.code); }
  for(const f of facts) if(!seen.has(f.code)){ seen.add(f.code);
    agents.push({code:f.code,name:f.agent,tl:f.tl,tlNow:f.tlNow||f.tl,movedInPeriod:tlSplit(f.code),
      campaign:f.campaign,tenure:f.tenure,target:0,start:''}); }

  // aggregate by agent × campaign (an agent can appear in both tabs, like the workbook)
  // meta reads the LATEST day in the period, not the last row pushed: ViciDial range
  // aggregates are appended after the per-day loop and would otherwise decide attribution
  const meta=rows=>{ const l=rows.reduce((b,r)=>(!b||r.date>=b.date)?r:b,null);
    return {tl:l.tl,tlNow:l.tlNow||l.tl,movedInPeriod:tlSplit(l.code),tenure:l.tenure,agent:l.agent,code:l.code}; };
  // built from CAMPS so a campaign added to the rule book cannot be silently dropped here
  const byCC={}; CAMPS.forEach(c=>byCC[c]={});
  facts.forEach(f=>{ (byCC[f.campaign][f.code]=byCC[f.campaign][f.code]||[]).push(f); });
  // adjustments (cancellations/referrals) attach to the agent's primary campaign
  const primaryCamp={};
  for(const code of seen){
    let best=null,bestN=-1;
    for(const c of CAMPS){ if(!byCC[c][code]) continue;
      const n=byCC[c][code].reduce((s,f)=>s+f.sales,0);
      if(n>bestN){bestN=n;best=c;} }
    primaryCamp[code]=best||'Courtesy';
  }
  const mtdCC={}; CAMPS.forEach(c=>mtdCC[c]={}); const wtdCC={};
  const weeks=mondays.map((m,i)=>({num:i+1,from:m,to:addDays(m,6),dates:dates.filter(d=>mondayOf(d)===m)}));
  for(const camp of CAMPS){
    for(const code in byCC[camp]){
      const rows=byCC[camp][code];
      const o=agg(rows, primaryCamp[code]===camp?code:null);
      Object.assign(o, meta(rows)); o.qa=qaFor(code,range.from,range.to);
      mtdCC[camp][code]=o;
      for(const w of weeks){
        const wr=rows.filter(f=>f.week===w.num); if(!wr.length) continue;
        /* CLAMP THE QA WINDOW TO THE PERIOD (audit round 3, 2026-08-27). Week 1 starts on the
           Monday BEFORE the 1st whenever a month opens mid-week (August 2026 opens on a
           Saturday), so five days of July evaluations were averaged into August's Week 1 —
           and the last week spilled forward the same way. Sales and talk never spilled:
           they are filtered on f.week. */
        const wo=agg(wr,null); Object.assign(wo, meta(wr));
        wo.qa=qaFor(code, w.from<range.from?range.from:w.from, w.to>range.to?range.to:w.to);
        ((wtdCC[w.num]=wtdCC[w.num]||Object.fromEntries(CAMPS.map(c=>[c,{}])))[camp])[code]=wo;
      }
    }
  }

  /* EMPLOYED HEADCOUNT COUNTS PEOPLE WHO WERE THERE (audit, 2026-08-28). hc was every distinct
     code appearing in the fact rows, and a cancellation alone is enough to mint a row: a fully
     cancelled day has sales 0, and with no attendance register for it emp and act are 0 too,
     but the row is deliberately kept so the cancellation is not lost from the totals. An agent
     whose ONLY trace in the period is a cancellation of a sale banked in an earlier month —
     someone who has since left, typically — was therefore counted as employed headcount and
     sat in the denominator of "% Agents on Target" while having no target to be on.
     No such agent exists in August 2026 (checked: 0 of 79), so nothing on screen moves today;
     this is the guard, not a restatement. Their cancellation still counts in the totals, which
     is the whole reason the row is kept. */
  const hcOf=rows=>[...new Set(rows.filter(f=>f.emp||f.act||f.sales||f.talk||f.opt||f.ref).map(f=>f.code))];
  // team-leader and campaign rollups
  const tlAgg={}, campAgg={};
  for(const camp of CAMPS){
    const campRows=facts.filter(f=>f.campaign===camp);
    if(campRows.length){
      const tls=[...new Set(campRows.map(f=>f.tl))];
      for(const tl of tls){
        const rows=campRows.filter(f=>f.tl===tl);
        const codes=[...new Set(rows.map(f=>f.code))];
        const empCodes=hcOf(rows);
        const o=agg(rows,null);
        if(refsFromFile&&!refsByDay){ o.ref=0; for(const c of codes) if(primaryCamp[c]===camp) o.ref+=refOf(c); }
        for(const c of codes) if(primaryCamp[c]===camp&&adj[c]){ o.canc+=adjC(c); if(!refsFromFile) o.ref+=adj[c].r||0; }
        o.cancPct=o.sales?o.canc/o.sales:null; o.refPct=o.sales?o.ref/o.sales:null;
        o.hc=empCodes.length;
        o.onT=empCodes.filter(c=>mtdCC[camp][c]&&mtdCC[camp][c].pctT!=null&&mtdCC[camp][c].pctT>=S.settings.onTarget).length;
        tlAgg[camp+'|'+tl]=o;
      }
      const codes=[...new Set(campRows.map(f=>f.code))];
      const empCodes=hcOf(campRows);
      const o=agg(campRows,null);
      if(refsFromFile&&!refsByDay){ o.ref=0; for(const c of codes) if(primaryCamp[c]===camp) o.ref+=refOf(c); }
      for(const c of codes) if(primaryCamp[c]===camp&&adj[c]){ o.canc+=adjC(c); if(!refsFromFile) o.ref+=adj[c].r||0; }
      o.cancPct=o.sales?o.canc/o.sales:null; o.refPct=o.sales?o.ref/o.sales:null;
      o.hc=empCodes.length;
      o.onT=empCodes.filter(c=>mtdCC[camp][c]&&mtdCC[camp][c].pctT!=null&&mtdCC[camp][c].pctT>=S.settings.onTarget).length;
      campAgg[camp]=o;
    }
  }
  // headline totals stay VAS — tracker-unit sales are a different product with no GWP
  const grand=agg(facts.filter(f=>f.campaign!=='VT'),null);
  if(refsFromFile&&!refsByDay){ grand.ref=0; const vasCodes=new Set(facts.filter(f=>f.campaign!=='VT').map(f=>f.code)); for(const c of vasCodes) grand.ref+=refOf(c); }
  /* ONLY agents the campaign rows actually carry (audit round 3, 2026-08-27) — iterating
     every adjustment key added excluded / VT / departed agents to the headline and to no
     campaign, so Cuddle+Courtesy+Nesting stopped summing to the grand total. */
  for(const c in adj){ if(!CAMPS.includes(primaryCamp[c])) continue;
    grand.canc+=adjC(c); if(!refsFromFile) grand.ref+=adj[c].r||0; }
  grand.cancPct=grand.sales?grand.canc/grand.sales:null; grand.refPct=grand.sales?grand.ref/grand.sales:null;

  /* QA PERIOD AVERAGE — the mean of the AGENT averages, over agents on this roster.
     Two deliberate choices, both from the spec:
       · unweighted (§8) — the workbook's total is =AVERAGE(U4:U{last}), a mean of the agent
         column, so one evaluation counts the same as twenty. Agents with none are dropped
         from the denominator, never scored zero.
       · roster-scoped (§6.7 scope warning) — the reference QA pivot averages the whole
         business, including seven Vehicle Tracking agents who are not on the VAS roster at
         all, so its grand total is not a VAS figure. Per-agent lookups are unaffected.
     qn stays the raw evaluation count, for the "n evaluations" caption. */
  let qs=0,qn=0,qa=0;
  for(const a of agents){ const q=qaFor(a.code,range.from,range.to); if(!q) continue; qs+=q.avg; qa++; qn+=q.n; }

  /* Days that carry dialler talk, and days that clearly SHOULD (someone was at work or
     sold something) but carry none. Without this the screen prints Ave Talk 0:00:00, which
     reads as 'this agent never dialled' when the truth is 'no dialler file covers that day'. */
  const talkDays=new Set(), workedDays=new Set();
  for(const f of facts){ if(f.talk>0) talkDays.add(f.date); if(f.act>0||f.sales>0) workedDays.add(f.date); }
  const noDialler=[...workedDays].filter(d=>!talkDays.has(d)).sort();
  return {range,newCampaigns,dates,weeks,facts,agents,byAgentDay,mtdCC,wtdCC,tlAgg,campAgg,grand,unmatched,term,primaryCamp,qaFor,
    viciSkipped,viciPartial,talkDays,noDialler,attDates,diallingDays,refsAreTotals:M_refsAreTotals,
    /* the same aggregator the grand total used, for a page that must total a FILTERED set of
       facts (the Dashboard under the header Team/Campaign filters, 2026-09-07) */
    aggFacts:(rows)=>agg(rows,null),
     /* Agents whose work in THIS period sits under a leader who no longer owns them. Not an
        error — it is the historical rule doing its job — but it is the one thing a reader of
        an old month needs told, because the org chart on screen elsewhere disagrees. */
     tlMoved:agents.filter(a=>a.tlNow&&a.tl&&a.tlNow!==a.tl).map(a=>({code:a.code,name:a.name,was:a.tl,now:a.tlNow})),
     offCampaign:Object.fromEntries(Object.entries(offCampaign).map(([k,v])=>[k,{agents:v.agents.size,sales:v.sales,gwp:Math.round(v.gwp)}])),
     qaAvg:qa?qs/qa:null,qaN:qn,qaAgents:qa,periodKey,adjKey,
     dailyByDate:(()=>{ const o={}; facts.forEach(f=>{ const t=o[f.date]=o[f.date]||Object.fromEntries(CAMPS.map(c=>[c,0])); t[f.campaign]+=f.sales; }); return o; })()};
}


/* ================================================================
   UI LAYER — Pulse
================================================================ */
const $=s=>document.querySelector(s);
function render(){ renderAll(); }  // engine's removeFile() calls render()

/* ---------- icons (Lucide-style, inline) ---------- */

/* ---------- misc helpers ---------- */
const fmtR=(x,d=0)=>(x==null||!isFinite(x))?'–':'R '+fmtNum(x,d);
const AV_HUES=[212,168,262,16,338,120,42,282,196,88];
function avatarOf(name,code,cls=''){
  const h=AV_HUES[(code||'').split('').reduce((s,c)=>s+c.charCodeAt(0),0)%AV_HUES.length];
  const ini=(name||'?').split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
  return `<span class="avatar ${cls}" style="background:linear-gradient(135deg,hsl(${h} 62% 46%),hsl(${(h+40)%360} 62% 38%))">${esc(ini)}</span>`;
}
function deltaChip(cur,prev,{invert=false,d=0}={}){
  if(prev==null||!isFinite(prev)||prev===0||cur==null) return '<span class="delta flat">—</span>';
  const p=(cur-prev)/Math.abs(prev);
  if(Math.abs(p)<0.005) return '<span class="delta flat">0%</span>';
  const dir=p>0?'up':'down', arrow=p>0?'▲':'▼';
  return `<span class="delta ${dir} ${invert?'inv':''}" title="vs previous period (per-day basis)">${arrow} ${(Math.abs(p)*100).toFixed(Math.abs(p)<0.1?1:0)}%</span>`;
}
function pctPill(x,warnAt=0.75){
  if(x==null||!isFinite(x)) return '–';
  const cls=x>=S.settings.onTarget?'pgood':(x>=warnAt?'pwarn':'pcrit');
  return `<span class="pill ${cls}">${fmtPct(x)}</span>`;
}
const campChip=c=>`<span class="campchip"><i style="background:var(--${(c||'').toLowerCase()})"></i>${c}</span>`;
const CAMPC={Cuddle:'var(--cuddle)',Courtesy:'var(--courtesy)',Nesting:'var(--nesting)',VT:'var(--vt)'};

/* ---------- daily series builders ---------- */
function seriesBy(fn,filter){ // -> {dates, values[]}
  if(!M) return {dates:[],values:[]};
  const per={}; M.dates.forEach(d=>per[d]=0);
  for(const f of M.facts){ if(filter&&!filter(f)) continue; per[f.date]+=fn(f)||0; }
  return {dates:M.dates, values:M.dates.map(d=>per[d])};
}
function ratioSeries(numFn,denFn,filter){
  if(!M) return {dates:[],values:[]};
  const n={},d={}; M.dates.forEach(x=>{n[x]=0;d[x]=0;});
  for(const f of M.facts){ if(filter&&!filter(f)) continue; n[f.date]+=numFn(f)||0; d[f.date]+=denFn(f)||0; }
  return {dates:M.dates, values:M.dates.map(x=>d[x]?n[x]/d[x]:null)};
}
function qaSeries(code){
  if(!M) return {dates:[],values:[]};
  const out={dates:[],values:[]};
  for(const d of Object.keys(S.evals).sort()){
    if(d<M.range.from||d>M.range.to) continue;
    let s=0,n=0;
    if(code){ (S.evals[d][code]||[]).forEach(v=>{s+=(typeof v==='number'?v:v.s);n++;}); }
    else for(const c in S.evals[d]) S.evals[d][c].forEach(v=>{s+=(typeof v==='number'?v:v.s);n++;});
    if(n){ out.dates.push(d); out.values.push(s/n); }
  }
  return out;
}

/* ---------- SVG chart kit ---------- */
let CHART_ID=0;
function sparkSVG(values,{color='var(--accent)',w=200,h=44,fill=true}={}){
  const vs=values.filter(v=>v!=null);
  if(vs.length===1) return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="${color}" stroke-width="1.6" stroke-dasharray="3 4" opacity=".5"/>
    <circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${color}"/></svg>`;
  if(vs.length<2) return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
  const min=Math.min(...vs),max=Math.max(...vs),span=(max-min)||1;
  const pts=values.map((v,i)=>v==null?null:[(i/(values.length-1))*w, h-5-((v-min)/span)*(h-12)]);
  const line=pts.filter(Boolean).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const id='sg'+(++CHART_ID);
  const last=pts.filter(Boolean).slice(-1)[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${fill?`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}L${w} ${h}L0 ${h}Z" fill="url(#${id})"/>`:''}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${last?`<circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/>`:''}</svg>`;
}
// big multi-series line/area chart with crosshair tooltip
function lineChart(box,{dates,series,h=250,money=false,pct=false,area=true}){
  const W=640,P={l:44,r:14,t:14,b:30};
  const all=series.flatMap(s=>s.values).filter(v=>v!=null);
  if(!all.length) return `<div class="empty">No data in this period</div>`;
  if(dates.length<2){
    // one day loaded: show that day as bars — the trend line grows as more days arrive
    const fmtV=v=>pct?fmtPct(v/100,1):(money?fmtR(v):fmtNum(v,v<20&&v%1?1:0));
    const maxv=Math.max(...series.map(s=>s.values[0]||0))||1;
    const bw=Math.min(110,380/series.length), gap=26;
    const total=series.length*bw+(series.length-1)*gap, x0=(640-total)/2;
    const base=h-46, top=34;
    const bars=series.map((s,i)=>{
      const v=s.values[0]||0, bh=Math.max(4,(base-top)*(v/maxv));
      const x=x0+i*(bw+gap);
      return `<rect class="bar" x="${x}" y="${base-bh}" width="${bw}" height="${bh}" rx="8" fill="${s.color}" opacity=".85"/>
        <text x="${x+bw/2}" y="${base-bh-10}" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${fmtV(v)}</text>
        ${series.length>1?`<text x="${x+bw/2}" y="${base+16}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${esc(s.name)}</text>`:''}`;
    }).join('');
    return `<div class="chartbox draw"><svg viewBox="0 0 640 ${h}">
      <line x1="40" x2="600" y1="${base}" y2="${base}" stroke="var(--stroke)"/>
      ${bars}
      <text x="320" y="${h-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${fmtDay(dates[0])} — the trend line appears as more days are uploaded</text>
    </svg></div>`;
  }
  let min=Math.min(0,...all),max=Math.max(...all); if(max===min)max=min+1;
  const pad=(max-min)*0.06; max+=pad;
  const x=i=>P.l+(W-P.l-P.r)*i/(dates.length-1);
  const y=v=>P.t+(h-P.t-P.b)*(1-(v-min)/(max-min));
  const fmtV=v=>pct?fmtPct(v/100,1):(money?fmtR(v):fmtNum(v,v<20?1:0));
  const ticks=[0,.25,.5,.75,1].map(f=>min+(max-min)*f);
  let defs='',paths='';
  series.forEach((s,si)=>{
    const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v)]);
    const line=pts.map((p,i)=>p?((i&&pts[i-1])?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1):'').join('');
    const id='gc'+(++CHART_ID);
    if(area&&si===0){
      defs+=`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".30"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
      const fp=pts.filter(Boolean);
      if(fp.length) paths+=`<path class="fillarea" d="${line}L${fp[fp.length-1][0]} ${h-P.b}L${fp[0][0]} ${h-P.b}Z" fill="url(#${id})"/>`;
    }
    paths+=`<path class="line" d="${line}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  const grid=ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid-line)"/>
    <text x="${P.l-7}" y="${y(t)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${fmtV(t)}</text>`).join('');
  const step=Math.ceil(dates.length/10);
  const xl=dates.map((d,i)=>i%step?'':`<text x="${x(i)}" y="${h-P.b+15}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.slice(8)}/${d.slice(5,7)}</text>`).join('');
  const id='lc'+(++CHART_ID);
  setTimeout(()=>wireLine(id,{dates,series,x:P,W,h,money,pct}),0);
  return `<div class="chartbox draw" id="${id}"><svg viewBox="0 0 ${W} ${h}" role="img">
    <defs>${defs}</defs>${grid}${paths}
    <line x1="${P.l}" x2="${W-P.r}" y1="${h-P.b}" y2="${h-P.b}" stroke="var(--stroke)"/>
    <line class="cross" y1="${P.t}" y2="${h-P.b}" stroke="var(--stroke2)" stroke-dasharray="3 3" style="display:none"/>
    <rect class="hit" x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${h-P.t-P.b}" fill="transparent"/></svg>
    <div class="tip"></div>
    ${series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}</div>`;
}
function wireLine(id,cfg){
  const box=document.getElementById(id); if(!box) return;
  const svg=box.querySelector('svg'),hit=box.querySelector('.hit'),cross=box.querySelector('.cross'),tip=box.querySelector('.tip');
  const {dates,series}=cfg,P=cfg.x,W=cfg.W;
  hit.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect();
    const fx=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(dates.length-1,Math.round((fx-P.l)/(W-P.l-P.r)*(dates.length-1))));
    const cx=P.l+(W-P.l-P.r)*i/(dates.length-1);
    cross.style.display='block'; cross.setAttribute('x1',cx); cross.setAttribute('x2',cx);
    tip.style.display='block';
    const bx=box.getBoundingClientRect();
    tip.style.left=Math.min(bx.width-165,Math.max(0,e.clientX-bx.left+14))+'px';
    tip.style.top=Math.max(0,e.clientY-bx.top-14)+'px';
    tip.innerHTML=`<div class="t">${fmtDay(dates[i])}</div>`+series.map(s=>{
      const v=s.values[i];
      return `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><b>${v==null?'–':(cfg.pct?fmtPct(v/100,1):(cfg.money?fmtR(v):fmtNum(v,v<20&&v%1?1:0)))}</b></div>`;
    }).join('');
  });
  hit.addEventListener('mouseleave',()=>{tip.style.display='none';cross.style.display='none';});
}
// stacked daily bars (two campaigns)
function stackChart(box){
  const days=M.dates;
  if(!days.length) return '<div class="empty">No data</div>';
  const W=640,h=250,P={l:40,r:12,t:12,b:30};
  const vals=days.map(d=>M.dailyByDate[d]||Object.fromEntries(CAMPS.map(c=>[c,0])));
  const max=Math.max(10,...vals.map(v=>v.Cuddle+v.Courtesy+(v.VT||0)))*1.05;
  const bw=Math.min(26,(W-P.l-P.r)/days.length-3);
  const x=i=>P.l+(W-P.l-P.r)*(i+0.5)/days.length;
  const y=v=>P.t+(h-P.t-P.b)*(1-v/max);
  let bars='';
  vals.forEach((v,i)=>{
    const xc=x(i)-bw/2, yCo=y(v.Courtesy), yCu=y(v.Courtesy+v.Cuddle);
    bars+=`<g class="dbar" data-i="${i}">
      <rect class="bar" style="animation-delay:${i*18}ms" x="${xc}" y="${yCo}" width="${bw}" height="${Math.max(0,h-P.b-yCo)}" fill="var(--courtesy)" rx="3"/>
      <rect class="bar" style="animation-delay:${i*18}ms" x="${xc}" y="${yCu}" width="${bw}" height="${Math.max(0,yCo-yCu-(v.Cuddle?2:0))}" fill="var(--cuddle)" rx="3"/>
      <rect x="${xc-2}" y="${P.t}" width="${bw+4}" height="${h-P.t-P.b}" fill="transparent"/></g>`;
  });

  return `<div class="chartbox draw" id="${id}"><svg viewBox="0 0 ${W} ${h}">${grid}${bars}

function hbarChart(entries,{money=false,pct=true,target=null}={}){

function radarChart(axes,seriesList,size=280){
  const cx=size/2,cy=size/2+6,R=size/2-46,n=axes.length;
  const pt=(i,r)=>[cx+r*Math.sin(2*Math.PI*i/n),cy-r*Math.cos(2*Math.PI*i/n)];
  let web='';
  for(const f of [.25,.5,.75,1]){
    web+='<polygon points="'+axes.map((_,i)=>pt(i,R*f).join(',')).join(' ')+`" fill="none" stroke="var(--grid-line)"/>`;
  }
  const spokes=axes.map((a,i)=>{const [x,y]=pt(i,R);const [lx,ly]=pt(i,R+24);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--grid-line)"/>

  const polys=seriesList.map(s=>{

  return `<div class="chartbox"><svg viewBox="0 0 ${size} ${size}">${web}${spokes}${polys}</svg>

function ringSVG(v,{size=86,color='var(--accent)',label='score'}={}){

      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .8s ease"/></svg>

/* ---------- analytics: score, risk, trend, insights, coaching ---------- */
function primaryAgg(code){ if(!M)return null; const pc=M.primaryCamp[code]; return (M.mtdCC[pc]||{})[code]||M.mtdCC.Cuddle[code]||M.mtdCC.Courtesy[code]; }
/* The score DECOMPOSED, so Agent Analytics can show each driver's real points
   (Nick, 2026-08-26: "the data must come from the vas analytics"). perfScore is
   built FROM these parts — one formula, one place, nothing to drift. */
/* SCORE THE DRIVERS THE AGENT ACTUALLY HAS, AND RENORMALISE (audit, 2026-08-28).
   Two things used to happen to a driver with no data, and both were wrong:

   - QA with no evaluations was IMPUTED AT 80%, worth 20 of its 25 points. So an agent who
     was evaluated and scored a real 70% (17.5 points) ranked BELOW an agent nobody had
     evaluated at all. Being measured cost you.
   - % to target, attendance and opt-in with no data scored a flat ZERO — a data gap read as
     a failure, which is the same bug the Ops composite and the money model were both fixed
     for: an absence is not a nought.

   Now a driver with no value leaves the denominator and the rest are renormalised to 100,
   which is what non-negotiable 4 already says the Ops composite does, and what the rule book
   itself does with QA (§ TL average: "excluding 'No QA %'"). A REAL 0% still scores zero —
   spec §QA is explicit that a zero is an outcome, not a gap — and w is the EFFECTIVE weight,
   so the agent's rating card still adds up to the score it is printed beside. */
function perfParts(a){
  if(!a) return null;
  const D=[
    {k:'t',  w:45, v:(a.pctT??null),        n:v=>Math.min(v/1.0,1.25)/1.25},
    {k:'qa', w:25, v:(a.qa?a.qa.avg:null),  n:v=>Math.max(0,Math.min(1,v))},
    {k:'att',w:20, v:(a.att??null),         n:v=>Math.max(0,Math.min(1,v))},
    {k:'opt',w:10, v:(a.optPct??null),      n:v=>Math.min(v/0.5,1)}
  ];
  const tot=D.reduce((s,d)=>s+(d.v==null?0:d.w),0);
  const out={};
  D.forEach(d=>{ const w=(d.v==null||!tot)?0:d.w/tot*100;
    out[d.k]={v:d.v, w:Math.round(w*10)/10, pts:(d.v==null?0:d.n(d.v)*w)}; });
  return out;
}
function perfScore(a){
  const p=perfParts(a); if(!p) return 0;
  return Math.max(0,Math.min(1,(p.t.pts+p.qa.pts+p.att.pts+p.opt.pts)/100));
}
/* ================= THE COMPOSITE SCORE =================
   NBA v3.0's seven-driver rating, ported from the engine that shipped with the
   rule book (AP.composite) rather than re-derived from its prose. PULSE computes
   it and publishes the finished object, so Agent Analytics renders arithmetic it
   never has to repeat — the same contract the rest of the digest already runs on.

   THE WINDOW IS THE AGENT'S LAST FIVE WORKED SESSIONS, not the month. A rolling
   window is what makes the score coachable: month-to-date stops moving by the
   20th, so an agent who turns things around sees nothing happen. Days they were
   not scheduled are not counted against them. */
function compositeWindow(code){
  const rows=(M&&M.byAgentDay&&M.byAgentDay[code])||[];
  const worked=rows.filter(f=>f.act>0).sort((a,b)=>a.date.localeCompare(b.date));
  const n=+COMPOSITE_RULES.windowSessions||5;
  return worked.slice(-n);
}
function tenureGroupOf(tenure,campaign){
  const t=String(tenure||'').trim().toLowerCase(), c=String(campaign||'').trim().toLowerCase();
  const norm=t.startsWith('exp')?'experienced':t;
  const find=cc=>COMPOSITE_RULES.tenureGroups.find(g=>{
    const gt=String(g.tenure||'').toLowerCase(), gc=String(g.campaign||'').toLowerCase();
    return (!gt||gt===norm) && (!gc||gc===cc);
  })||null;
  const g=find(c); if(g) return g;
  /* A CAMPAIGN THE RULE BOOK DOES NOT NAME is measured under the Courtesy rules (Nick,
     2026-09-03) — never left with no GWP floor and no conversion target. */
  return (c&&!/^(courtesy|cuddle|nesting|vt)$/.test(c))?find('courtesy'):null;
}
/* The tier is the MORE SEVERE of the count band and the rate band. Where nothing
   has been audited there is no rate band and the count decides alone. */
function r2aTierOf(fails,audited){
  const cfr=audited>0?(fails/audited*100):null;
  const inBand=(v,lo,hi)=>v!=null&&(lo==null||v>=lo)&&(hi==null||v<=hi);
  const tiers=COMPOSITE_RULES.r2aTiers;
  let byCount=null,byRate=null;
  for(const t of tiers){ if(byCount==null&&inBand(fails,t.failsMin,t.failsMax)) byCount=t; }
  if(cfr!=null) for(const t of tiers){ if(byRate==null&&t.tier!=='Tier 0'&&inBand(cfr,t.cfrMin,t.cfrMax)) byRate=t; }
  /* NO FAILS MEANS NO RATE BAND (AP.r2aTier line 9254). R2A-1's rate band runs from
     0 to 10%, so a clean agent with audited calls scores a 0% fail rate, matches that
     band and was handed a −2 "Compliance Note" for having no compliance problem at
     all. The count band is the only one that may speak when the count is zero. */
  if(!fails) byRate=null;
  const worst=[byCount,byRate].filter(Boolean).sort((a,b)=>b.penalty-a.penalty)[0]
    ||tiers.find(t=>t.tier==='Tier 0');
  return {tier:worst.tier, rule:worst.rule, level:worst.level, elite:worst.elite,
    penalty:Math.min(+COMPOSITE_RULES.r2aCap||10, worst.penalty||0),
    fails, audited, cfr:cfr==null?null:Math.round(cfr*10)/10, rateKnown:cfr!=null,
    byCount:byCount?byCount.tier:'Tier 0', byRate:byRate?byRate.tier:'not measured'};
}
/* One agent's unique-lead count for the period, from the SAME walk the Lead
   Management tab uses — never a second count of the same thing. Unfiltered, so a
   colleague's campaign chip cannot change somebody's score. Returns 0 when the
   case books are not loaded, and compositeFor reads that as "unmeasured". */
function leadsFor(code){
  try{
    if(!S.opencasesLM&&!S.closedcases) return 0;
    const lb=leadBook(true);
    return (lb.A[code]&&lb.A[code].leads)?lb.A[code].leads.size:0;
  }catch(e){ return 0; }
}

function compositeFor(code, agent){
  if(!M) return null;
  const R=COMPOSITE_RULES, F=+R.floor||0.5;
  const win=compositeWindow(code);
  const a=agent||(S.roster||[]).find(x=>x.code===code)||{};
  /* TENURE COMES FROM THE WINDOW, NOT FROM THE LIVE ROSTER (non-negotiable 11). The
     roster is a snapshot with no effective date, so it is the wrong answer for any
     day before the last reorganisation — and tenure decides the GWP floor and the
     conversion target this rating is scored against. The window's own rows carry the
     historically attributed value; the roster is the fallback for an agent we have
     never observed. The two agree for all 79 agents today, which is why this is a
     guard rather than a correction. */
  const last=win.length?win[win.length-1]:null;
  const camp=(last&&last.campaign)||(M.primaryCamp&&M.primaryCamp[code])||a.campaign||'';
  const tenure=(last&&last.tenure)||a.tenure||'';
  const grp=tenureGroupOf(tenure,camp);
  const sum=k=>win.reduce((s,f)=>s+(+f[k]||0),0);
  const sales=sum('sales'), gwpEx=sum('gwpEx'), tgt=sum('target');
  /* ATTENDANCE IS MEASURED OVER SCHEDULED SHIFTS, NOT WORKED ONES (audit, 2026-09-03).
     Every other driver averages the last five WORKED sessions — and attendance over
     worked sessions is 100% by definition: 59 of 59 rated agents read 100 while one of
     them had a shift with no activity the day before. The rule's intent ("being here,
     on time, for the whole session") needs the days the agent was EMPLOYED to be there:
     the last five rows carrying an employed shift, worked or not. Same window length,
     different filter — and the only driver that uses it. */
  const sched=((M.byAgentDay&&M.byAgentDay[code])||[]).filter(f=>f.emp>0&&!f.rangeAgg)
    .sort((a,b)=>a.date.localeCompare(b.date)).slice(-(+COMPOSITE_RULES.windowSessions||5));
  const act=sched.reduce((s,f)=>s+(+f.act||0),0), emp=sched.reduce((s,f)=>s+(+f.emp||0),0);
  /* talk still divides by the WORKED days in the window, as before */
  const actWorked=sum('act');
  /* CONVERSION NEEDS A MONTH TO MEAN SOMETHING (audit, 2026-09-03). It is month-to-date
     sales ÷ the month's open leads, so on day 2 of a month every agent reads near zero
     (56 of 59 failed it, median 1,8%) and "the most points unclaimed are in Conversion"
     printed on every card. Until the month carries five working days of data the driver
     is SHOWN but not scored — the others renormalise, exactly as the rule book already
     does for a driver nobody has supplied — and the note says why. */
  const dataDays=(function(){ const last=(M.dates||[]).slice().sort().pop(); if(!last) return 0;
    let n=0,d=M.range.from; while(d<=last){const w=new Date(d+'T00:00:00Z').getUTCDay(); if(w>0&&w<6&&!SA_HOLIDAYS.has(d))n++; d=addDays(d,1);} return n; })();
  const CONV_MIN_DAYS=+R.convMinDataDays||5;
  /* MULTI-DAY VICIDIAL TALK LIVES ON A ROW WITH NO SHIFT, so the window would miss it.
     A range export has no per-day detail, so the engine parks its whole total on one
     anchor row with emp/act 0 and zeroes the day rows it covers — deliberately, one
     dialler per agent, never the sum. This window keeps only worked sessions, so that
     talk fell straight through the gap: for an agent whose talk arrives ONLY as a
     range — which is how Cuddle's monthly ViciDial pull lands — Talk Time would read
     zero while they were on the phone all month. Apportioned by worked days inside the
     range, the same way the range itself is apportioned to a period. */
  let talkSec=sum('talk');
  const allRows=(M.byAgentDay[code]||[]);
  for(const f of allRows){
    if(!f.rangeAgg||!f.talk||!f.rangeFrom||!f.rangeTo) continue;
    const inWin=win.filter(w=>w.date>=f.rangeFrom&&w.date<=f.rangeTo).length;
    if(!inWin) continue;
    const workedInRange=allRows.filter(x=>!x.rangeAgg&&x.act>0&&x.date>=f.rangeFrom&&x.date<=f.rangeTo).length;
    talkSec+=workedInRange?f.talk*(inWin/workedInRange):f.talk;
  }
  /* ONE VAT BASIS PER COMPARISON. min_gwp_per_sale is quoted INCL VAT (R99) while
     every money figure in this engine is EX-VAT, the comms basis. Comparing them
     raw would make the value check ~15% stricter than the rule says. */
  /* …AND TO THE CENT THE SOURCE BOOKS (found 2026-09-03, scoring audit against the
     decision-rules workbook). R99 ÷ 1.15 = 86,0869…, but Salesforce books a R99
     product's ex-VAT charge as R86,08 — so 30 of 59 agents whose every sale WAS the
     R99 product read "To go" on Avg GWP per Sale with 25,0 of 25 points beside it,
     and their Total GWP fell R0,06 short of a target they had met exactly. The floor
     is therefore taken down to the cent, the way the money it is compared to is
     stored. Still derived through MTD_VAT (verify-rule-constants) — this is the
     rounding of the result, not a second VAT rate. */
  const gwpFloorEx=Math.floor(((grp&&grp.minGwpSale)||R.gwpFloorDefault||99)/MTD_VAT*100)/100;
  let convShown=null;                      // conversion when the month is too young to score it
  /* QA over the window's own days — evaluations are dated on the call, and an
     agent-day the window does not contain is not part of this rating. */
  const days=new Set(win.map(f=>f.date));
  let qs=0,qn=0,fails=0;
  for(const d in S.evals){ if(!days.has(d)) continue;
    for(const v of (S.evals[d][code]||[])){ const sc=(typeof v==='number'?v:v.s);
      qs+=sc; qn++; if(/critical/i.test((typeof v==='number'?'':v.dec)||'')) fails++; } }
  const m={
    gwpSale:   sales>0?gwpEx/sales:null,
    targetAch: tgt>0?sales/tgt*100:null,
    qa:        qn?qs/qn:null,
    gwpTotal:  win.length?gwpEx:null,
    /* CONVERSION IS NOW SCORED, ON THE REAL DENOMINATOR (Nick, 2026-08-30).
       The rule has always been sales ÷ UNIQUE LEADS. Until the Lead Management
       books were published into this engine there were no leads to divide by, so
       this stayed null and sales-per-call was shown beside it, labelled for what
       it was. The books are here now, so the real measure is computed and scored.

       IT IS THE PERIOD FIGURE, NOT THE WINDOW'S. Every other driver sums the last
       five worked sessions. Conversion cannot: the open-case book is an UNDATED
       snapshot of what is currently open, so there is no way to say how many leads
       an agent held on a Tuesday. Dividing five days of sales by a month of leads
       would read about a fifth of reality and would be a worse lie than showing
       nothing. So this one driver is month-to-date, and the card says so.

       Null when the case books are not loaded — never zero. An agent with no lead
       book is unmeasured, which renormalises the other drivers; an agent who sold
       nothing from a real book scores zero, because that is an outcome. */
    conv:      (function(){
                 /* BOTH SIDES MUST COVER THE SAME DAYS. `sales` above is the FIVE-SESSION
                    window; leadsFor() is the whole period, because the open-case book is an
                    undated snapshot. Dividing one by the other read Enoch's 29.9% as 6.8%
                    and scored him zero for it. So conversion uses the PERIOD sales that
                    match the period leads — the same pair the Lead Management tab divides. */
                 var L=leadsFor(code); if(!L) return null;
                 var pa=(typeof primaryAgg==='function'?primaryAgg(code):null)||{};
                 var ps=+pa.sales||0;
                 var v=ps?ps/L*100:0;      /* leads but no sales IS zero, not unmeasured */
                 if(dataDays<CONV_MIN_DAYS){ convShown=v; return null; }   /* too early in the month: shown, not scored */
                 return v;
               })(),
    talk:      actWorked>0?(talkSec/60)/actWorked:null,
    attendance:emp>0?act/emp*100:null
  };
  const t={
    gwpSale:gwpFloorEx, targetAch:R.targets.targetAch, qa:R.targets.qa,
    gwpTotal:win.length?tgt*gwpFloorEx:null,
    conv:grp?grp.convTarget:null, talk:R.targets.talk, attendance:R.targets.attendance
  };
  /* The measure is real now, so the only thing worth saying beside it is which
     window it covers — because it is the one driver that is not the five-session
     window the rest of the card is built from. */
  const shownFor={}; if(convShown!=null) shownFor.conv=convShown;
  const shownNote={ conv:dataDays<CONV_MIN_DAYS
    ?'your month to date so far (sales ÷ unique leads) — scored from the month\'s '+CONV_MIN_DAYS+'th working day, when it means something'
    :'your month to date — sales ÷ your unique leads' };
  let raw=0,wsum=0;
  /* NO WORKED SESSION IS NOT A ZERO. An agent published before they have worked a day
     in the period — a new starter, or the first morning of a month — has nothing to
     rate. Falling through would hand them 0 out of 100 and the words "Needs support",
     which is a judgement on an empty file. */
  const parts=R.drivers.map(def=>{
    const v=m[def.k], tv=t[def.k];
    const measured=(v!=null&&tv!=null&&tv!==0);
    const att=measured?Math.max(0,Math.min(1,v/tv)):null;
    const scaled=measured?Math.max(0,Math.min(1,(att-F)/(1-F))):null;
    const pts=measured?Math.round(scaled*def.w*10)/10:0;
    if(measured){ raw+=pts; wsum+=def.w; }
    /* THE LABEL, NOTE AND WEIGHT ARE THE SAME FOR EVERY AGENT, so they travel ONCE
       on the digest as `compositeDrivers` rather than 79 times over. Repeating them
       per agent added 176 KB to a payload that is pushed every 90 seconds while a
       VAS tab is open — nearly doubling it to carry seven strings the reader already
       has. Only the numbers are per-agent. */
    return {k:def.k,w:def.w,value:v,target:tv,measured,
      shown:(!measured&&shownFor[def.k]!=null)?Math.round(shownFor[def.k]*10)/10:null,
      shownNote:(!measured&&shownFor[def.k]!=null)?shownNote[def.k]:null,
      att:measured?Math.round(att*1000)/10:null, points:pts,
      available:measured?Math.round(Math.max(0,def.w-pts)*10)/10:0,
      onTarget:measured?v>=tv:false};
  });
  const score=Math.round(Math.min(100,wsum?raw/wsum*100:0)*10)/10;
  const r2a=r2aTierOf(fails,qn);
  /* THE COACHING ADJUSTMENT IS NOT MEASURED, AND THAT IS THE CORRECT ANSWER.
     It counts the worst live theme over 30 days and the rules require a
     classification confidence of at least 0.6. Every session in our Coaching Hub
     is INFERRED by the back-classifier rather than chosen by a coach, and inferred
     classifications are deliberately never scored — firing a compliance review on
     a named person off a regex is not something a score gets to do. The row still
     renders, so an agent learns the rule before it ever costs them. */
  const cx={points:0,tier:'Not measured',cluster:null,n:0,
    why:'Coaching themes are inferred, not coach-chosen, so none are scored yet.'};
  const penTotal=Math.min(+R.combinedCap||15,(r2a.penalty||0)+(cx.points||0));
  const afterPen=Math.max(0,score-penTotal);
  /* THE SIGN-IN BONUS IS GONE (Nick, 2026-08-31: "remove the five points that the agent
     gets for logging in"). It ran from 2026-08-28: one point per weekday an agent opened
     Agent Analytics, up to 5, added after the deductions. The adjusted score is now the
     composite less its deductions and nothing else — a rating measures the work, not
     whether the person looked at the page. Every agent carrying the bonus loses up to five
     points at the next publish; nobody's drivers change. */
  const adj=Math.round(afterPen*10)/10;
  const band=(R.bands.find(b=>adj>=b.min)||R.bands[R.bands.length-1]).label;
  const next=R.bands.slice().reverse().find(b=>b.min>adj);
  const sorted=parts.slice().sort((x,y)=>y.available-x.available);
  return {rated:win.length>0, score, adj, band, floor:Math.round(F*100),   // the bar changes shade where points start
    nextBand:next?{label:next.label,pointsAway:Math.round((next.min-adj)*10)/10}:null,
    penalty:r2a.penalty, r2a, cx, cxPenalty:cx.points, penaltyTotal:penTotal,
    parts, weightScored:wsum,
    unmeasured:parts.filter(p=>!p.measured).map(p=>(R.drivers.find(d=>d.k===p.k)||{}).label||p.k),
    onTarget:parts.filter(p=>p.onTarget).length,
    weakest:sorted[0]?{k:sorted[0].k,label:(R.drivers.find(d=>d.k===sorted[0].k)||{}).label||sorted[0].k,
      available:sorted[0].available}:null,
    window:win.length, windowFrom:win.length?win[0].date:null,
    windowTo:win.length?win[win.length-1].date:null,
    group:grp?grp.label:(camp||'')+(tenure?' – '+tenure:''),
    eliteEligible:r2a.elite==='Eligible'||r2a.elite==='Retained'};
}

/* ONE SCORE, ONE NAME, BOTH APPS (Nick, 2026-08-28: "why does the score in vas
   analytics not match with the score in agent analytics").
   VAS was showing the four-driver perfScore over the MONTH while Agent Analytics
   showed the seven-driver composite over the last five sessions — 43 and 53 for the
   same agent on the same morning. Both were right for what they were and that is
   exactly the problem: a team leader and an agent cannot discuss two numbers called
   "Score". Every screen now reads the composite where one exists, and perfScore
   remains only as the fallback for an agent the composite cannot rate yet.

   Memoised on M: a rebuild replaces the model, so a stale entry cannot outlive its
   data, and the leaderboard stops recomputing seventy-nine composites per render. */
var __compMemo=null;
function scoreFor(code){
  if(!code||!M) return null;
  if(!__compMemo||__compMemo.m!==M) __compMemo={m:M,v:{}};
  if(!(code in __compMemo.v)) __compMemo.v[code]=compositeFor(code);
  return __compMemo.v[code];
}
function displayScore(code,g){
  const c=scoreFor(code);
  if(c&&c.rated&&c.adj!=null) return c.adj/100;      // 0-1, the scale every caller already formats
  /* AN AGENT THE COMPOSITE CANNOT RATE GETS A DASH, NOT A DIFFERENT MEASURE. The column
     says it is the composite over the last five worked sessions; quietly substituting the
     four-driver month score for a new starter puts a number in that column that the
     caption does not describe. Only a payload with no composite at all — a digest built
     before this existed — falls back. */
  if(c&&c.rated===false) return null;
  return perfScore(g);
}
function riskOf(a){
  if(!a) return {level:'–',cls:'pmuted',reasons:[]};
  const rs=[];
  if((a.pctT??1)<0.5) rs.push('below 50% of sales target');
  if((a.att??1)<0.75) rs.push('attendance under 75%');
  if(a.qa&&a.qa.avg<0.75) rs.push('QA below 75%');
  if(rs.length>=2) return {level:'High',cls:'pcrit',reasons:rs};
  if(rs.length===1) return {level:'Medium',cls:'pwarn',reasons:rs};
  if((a.pctT??1)<0.8||(a.qa&&a.qa.avg<0.85)) return {level:'Watch',cls:'pwarn',reasons:['tracking under 80% of target or QA dipping']};
  return {level:'Low',cls:'pgood',reasons:[]};
}
function trendOf(code){ // last 7 dialing days vs previous 7 — sales per actual shift
  const rows=(M.byAgentDay[code]||[]);
  if(rows.length<4) return {dir:'flat',pct:null};
  const days=M.dates, half=Math.min(7,Math.floor(days.length/2));
  if(!half) return {dir:'flat',pct:null};
  const recent=new Set(days.slice(-half)), prior=new Set(days.slice(-half*2,-half));
  const rate=set=>{let s=0,a=0;rows.forEach(f=>{if(set.has(f.date)){s+=f.sales;a+=f.act;}});return a?s/a:null;};
  const r=rate(recent),p=rate(prior);
  if(r==null||p==null||p===0) return {dir:'flat',pct:null};
  const pc=(r-p)/p;
  return {dir:pc>0.07?'up':(pc<-0.07?'down':'flat'),pct:pc};
}
function evalsFor(code,from,to){
  const out=[];
  for(const d in S.evals){ if(d<from||d>to) continue;
    (S.evals[d][code]||[]).forEach(v=>out.push({date:d,s:(typeof v==='number'?v:v.s),dec:v.dec||'',cat:v.cat||'',pri:v.pri||''})); }
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

function genInsights(){
  const out=[];
  if(!M||!M.dates.length) return out;
  const g=M.grand, days=M.dates.length;
  // forecast to period end
  const range=M.range;
  const totalPlanned=(()=>{let n=0;let d=range.from;while(d<=range.to){const dow=new Date(d+'T00:00:00Z').getUTCDay();if(dow>0&&dow<6)n++;d=addDays(d,1);}return n;})();
  if(days>=3&&totalPlanned>days){
    const fGwp=g.gwp/days*totalPlanned, fT=g.gwpT/days*totalPlanned;
    const r=fT?fGwp/fT:null;
    if(r!=null) out.push({tone:r>=1?'good':(r>=0.85?'warn':'crit'),icon:I.target,title:'Month-end forecast',
      text:`At the current run-rate GWP lands near ${fmtR(fGwp)} by period end — ${r>=1?'ahead of':'about '+fmtPct(1-r)+' short of'} the ${fmtR(fT)} pace target.`});
  }
  // vs previous period
  if(MP&&MP.dates.length){
    const cur=g.sales/days, prev=MP.grand.sales/MP.dates.length;
    if(prev>0){ const pc=(cur-prev)/prev;
      out.push({tone:pc>=0?'good':'warn',icon:pc>=0?I.up:I.down,title:'Sales pace vs last period',
        text:`Sales per dialing day ${pc>=0?'up':'down'} ${fmtPct(Math.abs(pc),1)} (${fmtNum(cur,1)}/day vs ${fmtNum(prev,1)}/day last period).`});
    }
    // QA shift per team
    let worst=null;
    for(const k in M.tlAgg){
      const [camp,tl]=k.split('|');
      const codes=[...new Set(M.facts.filter(f=>f.tl===tl&&f.campaign===camp).map(f=>f.code))];
      let cs=0,cn=0,ps=0,pn=0;
      for(const c of codes){ const q=M.qaFor(c,M.range.from,M.range.to); if(q){cs+=q.avg*q.n;cn+=q.n;}
        const qp=MP.qaFor?MP.qaFor(c,MP.range.from,MP.range.to):null; if(qp){ps+=qp.avg*qp.n;pn+=qp.n;} }
      if(cn>=5&&pn>=5){ const d=cs/cn-ps/pn; if(worst===null||d<worst.d) worst={tl,camp,d,cur:cs/cn}; }
    }
    if(worst&&worst.d<-0.02) out.push({tone:'warn',icon:I.shield,title:`QA slipping — ${worst.tl}`,
      text:`${worst.tl}'s ${worst.camp} team QA is ${fmtPct(worst.cur,1)}, down ${fmtPct(Math.abs(worst.d),1)} on last period. Worth a listen-in this week.`});
  }
  // at-risk agents
  const risky=M.agents.map(a=>({a,r:riskOf(primaryAgg(a.code))})).filter(x=>x.r.level==='High');
  if(risky.length) out.push({tone:'crit',icon:I.alert,title:`${risky.length} agent${risky.length>1?'s':''} at high risk`,
    text:`${risky.slice(0,3).map(x=>x.a.name.split(' ')[0]).join(', ')}${risky.length>3?' and others':''} are far off target — open the Coaching queue for evidence-backed plans.`});
  // star performer
  const stars=M.agents.map(a=>({a,g:primaryAgg(a.code)})).filter(x=>x.g&&x.g.pctT>=1.25&&x.g.qa&&x.g.qa.avg>=0.9);
  if(stars.length){ const s=stars.sort((x,y)=>y.g.pctT-x.g.pctT)[0];
    out.push({tone:'good',icon:I.star,title:`${s.a.name} is flying`,
      text:`${fmtPct(s.g.pctT)} of target with a ${fmtPct(s.g.qa.avg,1)} QA average — a strong shout for recognition or mentoring duty.`});
  }
  // attendance
  if(g.att!=null&&g.att<0.88) out.push({tone:'warn',icon:I.users,title:'Attendance drag',
    text:`Attendance is ${fmtPct(g.att,1)} — every missed shift costs roughly ${fmtNum(g.spd||0,1)} sales at current SPD.`});
  return out.slice(0,6);
}

function coachingFor(code){
  const a=primaryAgg(code); if(!a) return [];
  const camp=M.primaryCamp[code];
  const peers=Object.values(M.mtdCC[camp]||{}).filter(x=>x.code!==code);
  const med=arr=>{const v=arr.filter(x=>x!=null).sort((a,b)=>a-b);return v.length?v[Math.floor(v.length/2)]:null;};
  const spdMed=med(peers.map(p=>p.spd)), ahtMed=med(peers.map(p=>p.aht)), optMed=med(peers.map(p=>p.optPct));
  const evs=evalsFor(code,M.range.from,M.range.to);
  const cats={}; evs.forEach(e=>{ if(e.cat) cats[e.cat]=(cats[e.cat]||0)+1; });
  const topCat=Object.entries(cats).sort((x,y)=>y[1]-x[1])[0];
  const fails=evs.filter(e=>/critical/i.test(e.dec)).length;
  const out=[];
  if(fails>0) out.push({pri:1,area:'Compliance coaching',why:`${fails} critical-fail evaluation${fails>1?'s':''} this period${topCat?' — most flagged: '+topCat[0]:''}.`,
    impact:'Clearing critical fails protects the sale from retraction and the agent from escalation.',
    ev:`${evs.length} evaluations, avg ${a.qa?fmtPct(a.qa.avg,1):'–'} · ${fails} critical`});
  if(a.qa&&a.qa.avg<0.85&&!fails) out.push({pri:2,area:'QA coaching',why:`QA average is ${fmtPct(a.qa.avg,1)} over ${a.qa.n} scored calls${topCat?', clustering on “'+topCat[0]+'”':''}.`,
    impact:`Lifting QA to 90% typically pairs with fewer retractions and stronger conversions.`,
    ev:`${a.qa.n} evaluations in period`});
  if((a.pctT??1)<0.7&&spdMed) out.push({pri:(a.pctT<0.5?1:2),area:'Sales coaching',
    why:`${fmtNum(a.spd,2)} sales per shift vs a team median of ${fmtNum(spdMed,2)} — ${fmtPct(a.pctT)} of target.`,
    impact:`Reaching the team median adds ~${fmtNum(Math.max(0,(spdMed-a.spd))*(a.act||0),0)} sales (~${fmtR(Math.max(0,(spdMed-a.spd))*(a.act||0)*(a.aveG||100))}) per period.`,
    ev:`Target ${fmtNum(a.target)} · achieved ${fmtNum(a.sales)}`});
  if(a.aht&&ahtMed&&a.aht>ahtMed*1.3&&(a.pctT??1)<1) out.push({pri:3,area:'Call efficiency',
    why:`Average handle time ${fmtDur(a.aht)} vs team median ${fmtDur(ahtMed)} — long calls aren't converting to extra sales.`,
    impact:'Tightening call control frees time for more dials per shift.',
    ev:`${fmtNum(a.ans)} answered calls · ${fmtDur(a.talk)} total talk`});
  if((a.att??1)<0.85) out.push({pri:2,area:'Attendance',
    why:`${fmtPct(a.att,1)} attendance (${fmtNum(a.act,1)} of ${fmtNum(a.emp)} shifts).`,
    impact:`Full attendance at current SPD is worth ~${fmtNum((a.emp-a.act)*(a.spd||0),0)} more sales per period.`,
    ev:'From the attendance register'});
  return out.sort((x,y)=>x.pri-y.pri);
}
function narrativeFor(code){
  const a=primaryAgg(code); if(!a) return '';
  const name=(M.agents.find(x=>x.code===code)||{}).name||code;
  const first=name.split(' ')[0];
  const t=trendOf(code);
  const bits=[];
  bits.push(`${first} is at ${fmtPct(a.pctT)} of sales target month-to-date (${fmtNum(a.sales)} sales, ${fmtR(a.gwp)} GWP at ${fmtR(a.aveG,0)} per sale)`);
  if(t.pct!=null) bits.push(`momentum is ${t.dir==='up'?'building — sales rate up':(t.dir==='down'?'fading — sales rate down':'steady, moving')} ${t.pct==null?'':fmtPct(Math.abs(t.pct))} across the last week`);
  if(a.qa) bits.push(`QA sits at ${fmtPct(a.qa.avg,1)} over ${a.qa.n} evaluations`);
  if(a.att!=null) bits.push(`attendance is ${fmtPct(a.att,1)}${a.att>=0.95?' — excellent':a.att<0.8?' — a concern':''}`);
  if(a.aht) bits.push(`average handle time is ${fmtDur(a.aht)}`);
  const recs=coachingFor(code);
  const focus=recs.length?` Coaching focus: ${recs[0].area.toLowerCase()} — ${recs[0].why.replace(/\s+$/,'')}`:` No urgent coaching flags — keep reinforcing what's working.`;
  return bits.join('; ')+'.'+focus;
}

/* ================= VARIANCE REPORT engine =================
   Artefact A of specs/vas_variance_report_rules.json — the per-agent, per-day
   reconciliation of Salesforce (BI Active ∪ Inactive) against the agent-logged board
   (Manual Stats) against dialler activity. IN VAS Analytics, NOT part of the MTD engine:
   both sides of every comparison are computed here from the raw stores, by the
   VARIANCE_RULES formulas alone. Calculation layer only — no HTML in this section.

   Pipeline (spec): resolve identity → filter period → compute per system → variance →
   tolerance verdict → root-cause classification → aggregate. Identity resolves BEFORE
   any variance is computed; an unresolved record lands in `unmapped` and is excluded
   from every comparison, because an identity failure manufactures a false variance on
   BOTH sides (spec identity_layer).

   Snapshot discipline (VR02): the source files carry no export timestamps, so the
   in-app assertion is on COVERAGE — when the compared sources' last covered days differ
   inside the period, the check fails and the days at the ragged edge are marked
   "indeterminate — snapshot skew" (auto RC1) rather than reported as real variances.
   That is the exact mechanism the spec observed: BI exported 05 Aug vs board built
   04 Aug accounted for nearly every residual difference. */
function buildVariance(range){
  const VR={range,rows:[],days:[],unmapped:{},aOnly:new Set(),bOnly:new Set(),
    summary:{exact:0,rounding:0,material:0,blocked:0,indeterminate:0},
    rcCounts:{RC1:0,RC2:0,RC3:0,RC4:0,RC5:0,RC6:0,RC7:0},checks:[],header:null,
    blocked:['Referrals (DV04) — no system-side referral source in the supplied files; agent-logged referrals are shown for information only and the variance is null, never zero']};
  if(!range) return VR;
  if(!IDX) buildIndex();
  const between=d=>d>=range.from&&d<=range.to;
  const unmap=(src,key,d,n,gwp)=>{ const k=src+'|'+key;
    const u=VR.unmapped[k]=VR.unmapped[k]||{src,key,n:0,gwp:0,days:new Set()};
    u.n+=n||0; u.gwp+=gwp||0; if(d)u.days.add(d); };

  /* ---- source coverage inside the period ---- */
  const biDays=Object.keys(S.sales).filter(between).sort();
  const bdDays=Object.keys(S.board).filter(between).sort();
  const callDaysAll=Object.keys(S.calls).filter(between);
  const attDays=Object.keys(S.att).filter(between);
  const lastBi=biDays[biDays.length-1]||null, lastBd=bdDays[bdDays.length-1]||null;
  // the ragged edge: when the two compared systems' coverage ends on different days, the
  // later-pulled source saw events the earlier one had not yet captured. Days past the
  // earlier end are one-sided anyway (blocked); the day AT the earlier end is jointly
  // covered but snapshot-skewed — exactly the observed case (BI dated 05 Aug vs board
  // built 04 Aug accounted for nearly every residual). Those variances are indeterminate.
  const skewEdge=(lastBi&&lastBd&&lastBi!==lastBd)?(lastBi<lastBd?lastBi:lastBd):null;
  const skewDay=d=>skewEdge!=null&&d>=skewEdge;

  /* ---- SALESFORCE side, per day per agent (DV01/DV02 system_a) ----
     Accounts = the day's STILL-ACTIVE accounts (S.sales[d][owner].a, per-account ex-VAT
     charge sums, dated on Contract Create Date at ingest) UNION the accounts the
     Inactive export says cancelled but were CREATED that day (S.cancRows, keyed on
     contract, r.d = Contract CREATE date — VR12). Same union the money model performs;
     the GWP formula deliberately differs: DV02 rounds ONCE after summing the agent-day,
     where the money model rounds per account (documented conflict, VARIANCE_RULES). */
  const backFill={};                       // d -> ownerKey -> unit -> ex-VAT charge
  // NET (MTD_RULES.salesNetOfCancellation): a cancelled sale is not restored, so DV01 counts
  // what is still active — the same rule the money model applies, never a second opinion.
  if(!MTD_RULES.salesNetOfCancellation) for(const k in (S.cancRows||{})){ const r=S.cancRows[k];
    if(!r||!between(r.d)) continue;
    const unit=r.c||r.a; if(!unit) continue;
    const o=((backFill[r.d]=backFill[r.d]||{})[normName(r.owner)]=backFill[r.d][normName(r.owner)]||{});
    o[unit]=(o[unit]||0)+(r.x||0); }
  const sf={};                             // d -> code -> {n,gwp,accts}
  const sfNoDetail=[];                     // days stored by an older build, no unit map
  for(const d of biDays){
    const day=S.sales[d]||{};
    if(!Object.values(day).some(r=>r&&r.a)){ sfNoDetail.push(d); continue; }
    const owners={};                       // ownerKey -> accounts
    for(const ow in day){ if(day[ow]&&day[ow].a) owners[ow]=Object.assign({},day[ow].a); }
    const b=backFill[d]||{};
    for(const ow in b){ owners[ow]=owners[ow]||{}; for(const a in b[ow]) owners[ow][a]=(owners[ow][a]||0)+b[ow][a]; }
    const byCode=sf[d]={};
    for(const ow in owners){
      const code=resolveKey(ow);
      const accts=owners[ow];
      // DV01 counts SALE units (cases); the uncased residual carries money into DV02 but is
      // not a sale, so it is summed and not counted — the money model's own rule.
      let sum=0,n=0; for(const a in accts){ if(saleUnit(a)) n++; sum+=accts[a]; }
      if(!code){ unmap('Salesforce (BI)',ow,d,n,Math.round(sum*VARIANCE_RULES.vat)); continue; }
      const rec=byCode[code]=byCode[code]||{n:0,sum:0};
      rec.n+=n; rec.sum+=sum;              // an owner alias resolving to the same code merges
    }
    for(const c in byCode){ byCode[c].gwp=Math.round(byCode[c].sum*VARIANCE_RULES.vat); } // DV02: round AFTER multiplying, once per agent-day
  }

  /* ---- BOARD side (DV01/DV02 system_b, DV04 system_a) ---- */
  const bd={};                             // d -> code -> {sales,gwp,ref,...}
  for(const d of bdDays){
    const byCode=bd[d]={};
    for(const raw in S.board[d]){
      const r=S.board[d][raw];
      const code=resolveKey(r.name)||resolveKey(raw);
      if(!code){ unmap('Manual Stats',r.name||raw,d,1,r.gwp||0); continue; }
      const rec=byCode[code];
      if(rec){ rec.sales+=r.sales; rec.gwp+=r.gwp; rec.ref=(rec.ref??null)==null?r.ref:(rec.ref+(r.ref||0)); rec.cells+=r.cells; }
      else byCode[code]={sales:r.sales,gwp:r.gwp,ref:r.ref??null,cells:r.cells,ts:r.ts,tg:r.tg,name:r.name};
    }
  }

  /* ---- dialler + attendance, per day per agent (DV03) ---- */
  const dayHasCallX=d=>{ const bk=S.calls[d]; if(!bk) return false; for(const k in bk) if(!bk[k].v) return true; return false; };
  /* Cuddle talk usually arrives as a PERIOD-AGGREGATED ViciDial export (one row per agent,
     no per-day split). The spec's own rule for it: "Cuddle daily talk time must be
     allocated or estimated, and flagged as such." So: the range total is allocated EVENLY
     across the agent's employed (attendance-weighted) days in the range — workdays where
     the register is absent — shown with a ~ and an estimate flag, and NEVER used for the
     DV03 activity checks: an allocation is not evidence of dialling on a specific day.
     Day-level dialler rows always win over an estimate. */
  const viciEst={};                              // code -> {per,days:Set,from,to}
  for(const key in (S.vici||{})){
    const v=S.vici[key]; if(!v||!v.rows) continue;
    const rDays=[]; { const dt=new Date(v.from+'T00:00:00Z');
      while(dkey(dt)<=v.to&&rDays.length<400){ rDays.push(dkey(dt)); dt.setUTCDate(dt.getUTCDate()+1); } }
    for(const r of v.rows){
      const rc=resolveKey(r.name); if(!rc||!(r.talk>0)) continue;
      let emp=rDays.filter(dd=>{ const st=(S.att[dd]||{})[rc]; return st!=null&&attWeight(st)>0; });
      if(!emp.length) emp=rDays.filter(dd=>{ const g=new Date(dd+'T00:00:00Z').getUTCDay(); return g!==0&&g!==6; });
      if(!emp.length) emp=rDays;
      viciEst[rc]={per:(r.talk||0)/emp.length,sale:(r.saleD||0)/emp.length,days:new Set(emp),from:v.from,to:v.to};
    }
  }

  /* ---- rows: one per agent per day, for every day either compared system covers ---- */
  const days=[...new Set([...Object.keys(sf),...Object.keys(bd)])].sort();
  for(const d of days){
    const sfDay=sf[d]||null, bdDay=bd[d]||null;
    const sfCov=!!sfDay, bdCov=!!bdDay;
    const skew=skewDay(d);
    VR.days.push({d,bi:sfCov,board:bdCov,calls:!!S.calls[d],att:!!S.att[d],skew});
    // the day's dialler book, resolved once (identity BEFORE variance). saleMap counts the
    // dialler's own sale DISPOSITIONS (CallX VAS-sale dispositions / ViciDial Sale statuses)
    // — a third system's view of the same events, shown beside SF and the board.
    const talkMap={}, saleMap={}; const bk=S.calls[d];
    /* THE MASTER TABLE (Nick, 2026-08-20): aggregate dialler sales per CB per day from the
       ViciDial report's dispositions, do the same from the CallX import, and join to the
       Agent List on the CB number. One row per CB per date. Where BOTH diallers carry the
       same agent on the same day, the fuller record wins — never the sum — which is the
       same rule the MTD model applies (a Vici xlsx and its txt re-export describe the SAME
       calls; adding them together would pay the agent twice). Summing across diallers was
       exactly the bug this block replaces. */
    if(bk){ const byCB={};
      for(const k in bk){ const c=resolveKey(k); if(!c) continue;
        const slot=(byCB[c]=byCB[c]||{}), w=bk[k].v?'v':'o';
        const t=slot[w]=slot[w]||{talk:0,saleD:0};
        t.talk+=(bk[k].talk||0); t.saleD+=(bk[k].saleD||0); }
      for(const c in byCB){ const s=byCB[c];
        const win=(s.v&&s.o)?((s.v.talk>=s.o.talk)?s.v:s.o):(s.v||s.o);
        talkMap[c]=win.talk; saleMap[c]=win.saleD; } }
    // DV03 row scope: agents on either compared system, plus agents the register marks
    // present or the dialler shows active that day (the "present but not dialling" and
    // "activity, no conversion" flags need them even with zero sales on both sides)
    const codes=new Set([...(sfDay?Object.keys(sfDay):[]),...(bdDay?Object.keys(bdDay):[])]);
    if(S.att[d]) for(const c in S.att[d]){ if(attWeight(S.att[d][c])>=1&&IDX.byCode[c]) codes.add(c); }
    for(const c in talkMap) if(talkMap[c]>0&&IDX.byCode[c]) codes.add(c);
    /* EVERY AGENT ON THE AGENT LIST GETS A ROW (Nick, 2026-08-20: 'agents missing in the
       variance report — must be taken from the agent list'). The report used to show only
       agents with activity, so a team leader could not tell an agent who sold nothing from
       one who was silently dropped — absence and zero are different answers, and the roster
       is the identity source everywhere else in this app. A roster agent with no record on
       a covered day now appears with true zeros (both systems covered the day and hold
       nothing for them). VT stays out: tracker units are a different product with no board.
       Agents SELLING but absent from the Agent List still cannot appear as agents — they
       are in Unmapped, and only a corrected Agent List upload moves them out. */
    for(const a of S.roster){ if(campOf(a.campaign)!=='VT') codes.add(a.code); }
    for(const code of codes){
      const a=IDX.byCode[code]||{};
      const org=orgAt(code,d);                       // history, never the live snapshot
      const camp=campOf((org&&org.campaign)||a.campaign);
      const tl=(org&&org.tl)||a.tl||'';
      const m={name:a.sf||a.name||code};
      const sfr=sfDay?sfDay[code]:null, bdr=bdDay?bdDay[code]:null;
      // a covered day where the agent is absent from that system is a TRUE ZERO on that
      // side (the system holds no record) — but it is also a one-side-only agent, which
      // VR04 requires reported before values are compared
      const sfSales=sfCov?(sfr?sfr.n:0):null;
      const sfGwp  =sfCov?(sfr?sfr.gwp:0):null;
      const bdSales=bdCov?(bdr?bdr.sales:0):null;
      const bdGwp  =bdCov?(bdr?bdr.gwp:0):null;
      const bdRef  =bdr?(bdr.ref??null):null;
      if(sfCov&&bdCov){ if(sfr&&!bdr) VR.aOnly.add(code); if(bdr&&!sfr) VR.bOnly.add(code); }
      const salesVar=(sfSales!=null&&bdSales!=null)?sfSales-bdSales:null;   // DV01: system_a − system_b
      const gwpVar  =(sfGwp!=null&&bdGwp!=null)?sfGwp-bdGwp:null;           // DV02: system_a − system_b
      // DV03 — an agent's talk is KNOWN when they have dialler rows, or when a file that is
      // FULL-FLOOR for their campaign covers the day and they are absent from it. Only the
      // CallX PBX export qualifies as full-floor, and only for Courtesy — ViciDial exports
      // are user-group FILTERED (proven on the 13-Aug package: 2,317 rows, 29 codes, the
      // whole Cuddle floor absent), so a vici day file existing never makes an absent
      // Cuddle/Nesting agent a true zero. Anything else would manufacture exactly the false
      // "sale with no dialling" flag this comparison exists to catch.
      let talk=(code in talkMap)?talkMap[code]:null;
      const talkKnown=talk!=null||(camp==='Courtesy'&&dayHasCallX(d));
      if(talk==null&&talkKnown) talk=0;
      let talkEst=null;                            // allocated estimate — display only, never evidence
      let dlSalesEst=null;
      if(!talkKnown){ const e=viciEst[code]; if(e&&e.days.has(d)){ talkEst=Math.round(e.per); dlSalesEst=Math.round((e.sale||0)*10)/10; } }
      const dlSales=talkKnown?(saleMap[code]||0):null;   // dialler-side sales: null when the dialler cannot answer for this agent-day
      const st=(S.att[d]||{})[code];
      const present=st!=null&&attWeight(st)>=1;
      const flags=[];
      let talkAdj=null;
      if(talkKnown){
        if((sfSales||0)>0&&talk===0){
          /* Sales are dated on CONTRACT CREATE DATE (DV01), which is not always the day the
             call happened — a sale captured or processed late lands on a day the agent never
             dialled. Before reading this as an identity break, look at the neighbouring days:
             talk found there is evidence of exactly that, and the flag says so. */
          const talkOn=dd=>{ const b=S.calls[dd]; if(!b) return 0; let t=0; for(const k in b){ if(resolveKey(k)===code) t+=b[k].talk||0; } return t; };
          for(const dd of [addDays(d,-1),addDays(d,1),addDays(d,-2),addDays(d,2)]){
            const t=talkOn(dd); if(t>0){ talkAdj={d:dd,talk:t}; break; }
          }
          flags.push(talkAdj
            ?{sev:'warning',f:'Sale dated to a day with no dialling — dialled '+fmtDur(talkAdj.talk)+' on '+talkAdj.d+' (Contract Create Date ≠ call day)',dv:'DV03'}
            :{sev:'error',f:'Sale recorded, no dialler activity',dv:'DV03'});
        }
        if(talk>VARIANCE_RULES.talkNoSaleSecs&&sfSales===0) flags.push({sev:'warning',f:'Talk > 2h, no sales',dv:'DV03'});
        if(talk===0&&present) flags.push({sev:'warning',f:'Present but not dialling',dv:'DV03'});
      }else if(talkEst!=null){ flags.push({sev:'info',f:'Talk estimated — ViciDial period export allocated evenly across employed days; activity checks skipped',dv:'DV03'}); }
      else if((sfSales||0)>0||present){ flags.push({sev:'info',f:'Dialler coverage missing — activity checks skipped'+(camp==='Cuddle'?' (pull EXPORT_CALL_REPORT with the Cuddle user groups for day-level talk)':''),dv:'DV03'}); }
      if(bdr&&bdr.ts!=null&&bdr.cells>0&&bdr.ts!==bdr.cells)
        flags.push({sev:'warning',f:'Board states '+bdr.ts+' sales but '+bdr.cells+' Sale cells are populated',dv:'DV01'});
      // tolerance verdicts — bands declared in VARIANCE_RULES.tolerance, applied blind
      const v={};
      v.sales=salesVar==null?'blocked':(skew&&salesVar!==0)?'indeterminate':(salesVar===0?'exact':'material');
      v.gwp  =gwpVar==null?'blocked':(skew&&Math.abs(gwpVar)>VARIANCE_RULES.gwpTolerance)?'indeterminate'
              :(gwpVar===0?'exact':(Math.abs(gwpVar)<=VARIANCE_RULES.gwpTolerance?'rounding':'material'));
      // root cause: a saved human classification wins; the engine only SUGGESTS
      const rcOf=metric=>{
        const saved=S.varRC[d+'|'+code+'|'+metric]; if(saved) return {rc:saved,auto:false};
        if(v[metric]==='blocked') return {rc:'RC7',auto:true};
        if(v[metric]==='indeterminate') return {rc:'RC1',auto:true};
        if(v[metric]==='material'){
          if(sfCov&&bdCov&&((sfr&&!bdr)||(bdr&&!sfr))) return {rc:'RC5',auto:true};
          const a=metric==='sales'?sfSales:sfGwp, b=metric==='sales'?bdSales:bdGwp;
          if(((a===0&&b>0)||(b===0&&a>0))&&(talk||0)>0) return {rc:'RC3',auto:true};
          return {rc:null,auto:true};                 // unclassified — an open defect, not a result
        }
        return {rc:null,auto:true};
      };
      const rcS=rcOf('sales'), rcG=rcOf('gwp');
      for(const [vv,rc] of [[v.sales,rcS],[v.gwp,rcG]]){
        if(vv==='exact')VR.summary.exact++; else if(vv==='rounding')VR.summary.rounding++;
        else if(vv==='material')VR.summary.material++; else if(vv==='blocked')VR.summary.blocked++;
        else if(vv==='indeterminate')VR.summary.indeterminate++;
        if(vv!=='exact'&&vv!=='rounding'&&rc.rc)VR.rcCounts[rc.rc]++;
      }
      VR.rows.push({d,code,agent:m.name,camp,tl,sfSales,sfGwp,bdSales,bdGwp,bdRef,dlSales,
        salesVar,gwpVar,talk:talkKnown?talk:null,talkEst,dlSalesEst,talkAdj,att:st??null,present,flags,v,
        rcSales:rcS.rc,rcSalesAuto:rcS.auto,rcGwp:rcG.rc,rcGwpAuto:rcG.auto,skew,
        accts:sfr?sfr.n:0,chargeSum:sfr?sfr.sum:null});
    }
  }

  /* ---- validation checks (spec validation_checks, in-app subset) ---- */
  const T=VARIANCE_RULES.checkTexts;
  const put=(id,ok,sev,msg)=>VR.checks.push({id,ok,sev,msg:msg||T[id]});
  const missing=[];
  if(!biDays.length) missing.push('Power BI Active/Inactive — blocks Salesforce-side Sales (DV01) and GWP (DV02)');
  if(!bdDays.length) missing.push('Manual Stats — blocks agent-logged Sales/GWP (DV01/DV02) and Referrals (DV04)');
  if(!callDaysAll.length) missing.push('Call records / ViciDial — blocks Activity variance (DV03)');
  if(!attDays.length) missing.push('Attendance — blocks the Present-but-not-dialling flag (DV03)');
  put('VR01',!missing.length,'error',missing.length?('Missing sources: '+missing.join(' · ')):'All compared sources present in this period');
  const ends=[['BI',lastBi],['Manual Stats',lastBd],['Calls',callDaysAll.sort()[callDaysAll.length-1]||null],['Attendance',attDays.sort()[attDays.length-1]||null]].filter(x=>x[1]);
  const skewed=lastBi&&lastBd&&lastBi!==lastBd;
  put('VR02',!skewed,'error',skewed?('Source cut-offs differ — '+ends.map(e=>e[0]+' → '+e[1]).join(' · ')+'. Variances on days from '+(lastBi<lastBd?lastBi:lastBd)+' onward are reported as indeterminate — snapshot skew (RC1), not as real differences.')
    :('Compared sources end together'+(ends.length?(' ('+ends.map(e=>e[0]+' → '+e[1]).join(' · ')+')'):'')));
  const unCount=Object.values(VR.unmapped).reduce((s,u)=>s+u.n,0);
  put('VR03',!Object.keys(VR.unmapped).length,'error',Object.keys(VR.unmapped).length?
    (Object.keys(VR.unmapped).length+' identity(ies) failed to resolve ('+unCount+' record(s)) — excluded from every comparison and listed under Unmapped. Map them in the Upload Station or upload a fresh Agent List.')
    :'Every record resolved to an Employee Code before comparison');
  put('VR04',true,'info','Set-difference reported before values compared: '+VR.aOnly.size+' agent(s) on Salesforce only, '+VR.bOnly.size+' on Manual Stats only (within jointly-covered days)');
  const unclassified=VR.rows.reduce((s,r)=>s+((r.v.sales==='material'&&!r.rcSales)?1:0)+((r.v.gwp==='material'&&!r.rcGwp)?1:0),0);
  put('VR05',!unclassified,'error',unclassified?(unclassified+' material variance(s) carry no root-cause code — an unclassified variance is an open defect, not a result. Classify them from the row audit.')
    :'Every material variance carries a root-cause code');
  put('VR06',true,'info','Tolerances declared in VARIANCE_RULES before any comparison ran (sales ±0 · GWP ±1 · talk ratio 0.98–1.02)');
  put('VR07',true,'info','Formulas are fixed in VARIANCE_RULES v'+VARIANCE_RULES.version+'; no rule is tuned to close a variance (spec anti-pattern)');
  put('VR08',true,'info','Blocked metrics emit null, never zero — a missing side shows “–”, and Referrals (DV04) has no system source');
  put('VR11',true,'info','Sales counted as DISTINCT cases per agent-day ('+MTD_RULES.saleUnit+'), never charge rows and never accounts — a customer can buy twice from one agent in a day'
    +(MTD_RULES.salesNetOfCancellation?'. Counted NET of cancellation.':'. Counted GROSS of cancellation (Active ∪ Inactive).'));
  put('VR12',true,'info','Cancelled-account union filters on Contract CREATE date (the Inactive export header is a legacy caption)');
  put('VR13',true,'info','Unmapped view exists even when empty — an empty result is visibly a result');
  /* VR16 — the dialler_coverage contract. A campaign with ZERO day-level dialler rows in
     the whole period is the August incident repeating (Cuddle blank for weeks, uploads
     all "loaded") — a red FAIL that names the export and the tick-boxes, so the person
     holding the pull screen knows exactly what to change. Per-day gaps inside a covered
     campaign stay per-row info flags; this check is the floor-level alarm. */
  { const covByCamp={}; CAMPS.forEach(c=>covByCamp[c]=0);
    for(const d of days){ const bk=S.calls[d]; if(!bk) continue; const seen=new Set();
      for(const k in bk){ const b=bk[k]; if(!((b.talk||0)>0||(b.calls||0)>0)) continue;
        const c=resolveKey(k); if(!c) continue;
        const org=orgAt(c,d); const a=IDX.byCode[c]||{};
        const camp=campOf((org&&org.campaign)||a.campaign);
        if(covByCamp[camp]!=null) seen.add(camp); }
      seen.forEach(c=>covByCamp[c]++); }
    const need=Math.ceil(days.length*(VARIANCE_RULES.diallerCoverage.minDayShare||0.5));
    /* A campaign is held to the coverage contract only if it has ACTIVITY in the period —
       sales on either compared system, or any dialler talk. A floor that sold nothing and
       logged nothing has nothing for DV03 to verify, and failing VR16 over it would turn a
       quiet floor into a permanent red check (Nesting seeded at zero did exactly that). */
    const activeCamps=new Set(VR.rows.filter(r=>(r.sfSales||0)>0||(r.bdSales||0)>0||(r.talk||0)>0).map(r=>r.camp));
    const uncov=days.length?CAMPS.filter(c=>activeCamps.has(c)&&covByCamp[c]<need):[];
    put('VR16',!uncov.length,'error',uncov.length
      ?uncov.map(c=>{ const dc=VARIANCE_RULES.diallerCoverage.campaigns[c]||{};
        return c+' has day-level dialler rows on '+covByCamp[c]+' of '+days.length+' compared day(s) — the contract needs at least '+need+' — so its DV03 activity checks are skipped almost everywhere. Day-level source: '
          +(dc.source||'per-call dialler export')+(dc.groups?', pulled WITH user groups '+dc.groups.join(' + '):'')+'. '+(dc.remedy||''); }).join(' · ')
      :'Every reported campaign has day-level dialler rows on at least half the compared days ('+CAMPS.map(c=>c+' '+covByCamp[c]+'/'+days.length+' day(s)').join(' · ')+')'); }
  if(sfNoDetail.length) put('VR01b',false,'warning',sfNoDetail.length+' BI day(s) predate account-level storage ('+sfNoDetail.join(', ')+') — re-upload the BI export covering them to compare those days');

  /* ---- output header (spec output_header_template) ---- */
  const fReg=t=>S.files.filter(f=>f.type.split(' ')[0]===t).map(f=>f.name+' (uploaded '+f.at+')');
  VR.header={report_type:'daily_system_variance',
    reporting_period:{start:range.from,end:range.to,dialing_days:attDays.length},
    build_timestamp:new Date().toISOString().slice(0,16).replace('T',' '),
    source_export_timestamps:{bi:fReg('bi'),bi_inactive:fReg('cancellations'),manual_stats:fReg('board'),calls:fReg('calls'),attendance:fReg('attendance')},
    snapshot_skew_detected:!!skewed,
    agents_compared:[...new Set(VR.rows.map(r=>r.code))].length,
    agents_source_a_only:[...VR.aOnly],agents_source_b_only:[...VR.bOnly],
    metrics_blocked:VR.blocked.slice(),
    variance_summary:{exact:VR.summary.exact,within_tolerance:VR.summary.rounding,material:VR.summary.material},
    root_cause_counts:VR.rcCounts,
    unmapped_record_count:unCount,
    checks_failed:VR.checks.filter(c=>!c.ok).map(c=>c.id)};
  return VR;
}
