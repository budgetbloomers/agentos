  return `<div class="chartbox draw" id="${id}"><svg viewBox="0 0 ${W} ${h}">${grid}${bars}
    <line x1="${P.l}" x2="${W-P.r}" y1="${h-P.b}" y2="${h-P.b}" stroke="var(--stroke)"/>${xl}</svg>
    <div class="tip"></div>
    <div class="legend"><span><i style="background:var(--cuddle)"></i>Cuddle</span><span><i style="background:var(--courtesy)"></i>Courtesy</span></div></div>`;
}
function hbarChart(entries,{money=false,pct=true,target=null}={}){
  if(!entries.length) return '<div class="empty">No data</div>';
  const W=640,rowH=30,P={l:200,r:64,t:8,b:8};
  const h=P.t+P.b+entries.length*rowH;
  const max=Math.max(target?target*1.06:0,...entries.map(e=>e.v||0))||1;
  const bx=v=>P.l+(W-P.l-P.r)*v/max;
  let rows='';
  entries.forEach((e,i)=>{
    const yy=P.t+i*rowH;
    rows+=`<text x="${P.l-8}" y="${yy+rowH/2+3.5}" text-anchor="end" font-size="11.3" fill="var(--ink2)">${esc(e.label)}</text>
    <rect class="bar" style="animation-delay:${i*40}ms;transform-origin:${P.l}px ${yy+rowH/2}px" x="${P.l}" y="${yy+6}" width="${Math.max(2,bx(e.v||0)-P.l)}" height="${rowH-12}" rx="4" fill="${e.color||'var(--accent)'}"/>
    <text x="${bx(e.v||0)+7}" y="${yy+rowH/2+3.5}" font-size="10.5" font-weight="700" fill="var(--ink)">${pct?fmtPct(e.v):(money?fmtR(e.v):fmtNum(e.v))}</text>`;
  });
  const tl=target!=null?`<line x1="${bx(target)}" x2="${bx(target)}" y1="${P.t}" y2="${h-P.b}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${bx(target)}" y="${P.t+1}" font-size="8.5" fill="var(--muted)" text-anchor="middle">target</text>`:'';
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${h}" style="max-height:${Math.min(440,h)}px">${rows}${tl}</svg></div>`;
}
function radarChart(axes,seriesList,size=280){
  const cx=size/2,cy=size/2+6,R=size/2-46,n=axes.length;
  const pt=(i,r)=>[cx+r*Math.sin(2*Math.PI*i/n),cy-r*Math.cos(2*Math.PI*i/n)];
  let web='';
  for(const f of [.25,.5,.75,1]){
    web+='<polygon points="'+axes.map((_,i)=>pt(i,R*f).join(',')).join(' ')+`" fill="none" stroke="var(--grid-line)"/>`;
  }
  const spokes=axes.map((a,i)=>{const [x,y]=pt(i,R);const [lx,ly]=pt(i,R+24);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--grid-line)"/>
    <text x="${lx}" y="${ly}" text-anchor="middle" font-size="9.6" font-weight="600" fill="var(--ink2)">${esc(a.label)}</text>
    <text x="${lx}" y="${ly+11}" text-anchor="middle" font-size="8.6" fill="var(--muted)">${seriesList.map(s=>a.fmt(s.raw[a.key])).join(' · ')}</text>`;}).join('');
  const polys=seriesList.map(s=>{
    const pts=axes.map((a,i)=>pt(i,R*Math.max(0.03,Math.min(1,s.norm[a.key]||0))).join(',')).join(' ');
    return `<polygon points="${pts}" fill="${s.color}" fill-opacity=".16" stroke="${s.color}" stroke-width="2"/>`;
  }).join('');
  return `<div class="chartbox"><svg viewBox="0 0 ${size} ${size}">${web}${spokes}${polys}</svg>
  ${seriesList.length>1?`<div class="legend" style="justify-content:center">${seriesList.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}</div>`;
}
function ringSVG(v,{size=86,color='var(--accent)',label='score'}={}){
  const r=(size-12)/2,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,v)));
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--glass3)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .8s ease"/></svg>
    <div class="rv"><b>${Math.round(v*100)}</b><small>${label}</small></div></div>`;
}

/* ---------- analytics: score, risk, trend, insights, coaching ---------- */
function primaryAgg(code){ if(!M)return null; const pc=M.primaryCamp[code]; return (M.mtdCC[pc]||{})[code]||M.mtdCC.Cuddle[code]||M.mtdCC.Courtesy[code]; }
function perfScore(a){
  if(!a) return 0;
  const t=Math.min((a.pctT??0)/1.0,1.25)/1.25;
  const qa=a.qa?a.qa.avg:0.8;
  const att=a.att??0;
  const opt=Math.min((a.optPct??0)/0.5,1);
  return Math.max(0,Math.min(1, t*0.45 + qa*0.25 + att*0.20 + opt*0.10));
}
function riskOf(a){
  if(!a) return {level:'–',cls:'pmuted',reasons:[]};
  const rs=[];
  if((a.pctT??1)<0.5) rs.push('below 50% of sales target');
  if((a.att??1)<0.75) rs.push('attendance under 75%');
  if(a.qa&&a.qa.avg<0.75) rs.push('QA below 75%');
  if(rs.length>=2) return {level:'High',cls:'pcrit',reasons:rs};
  if(rs.length===1) return {level:'Medium',cls:'pwarn',reasons:rs};
  if((a.pctT??1)<0.8||(a.qa&&a.qa.avg<0.85)) return {level:'Watch',cls:'pwarn',reasons:['tracking under 80% of target or QA dipping']};
  return {level:'Low',cls:'pgood',reasons:[]};
}
function trendOf(code){ // last 7 dialing days vs previous 7 — sales per actual shift
  const rows=(M.byAgentDay[code]||[]);
  if(rows.length<4) return {dir:'flat',pct:null};
  const days=M.dates, half=Math.min(7,Math.floor(days.length/2));
  if(!half) return {dir:'flat',pct:null};
  const recent=new Set(days.slice(-half)), prior=new Set(days.slice(-half*2,-half));
  const rate=set=>{let s=0,a=0;rows.forEach(f=>{if(set.has(f.date)){s+=f.sales;a+=f.act;}});return a?s/a:null;};
  const r=rate(recent),p=rate(prior);
  if(r==null||p==null||p===0) return {dir:'flat',pct:null};
  const pc=(r-p)/p;
  return {dir:pc>0.07?'up':(pc<-0.07?'down':'flat'),pct:pc};
}
function evalsFor(code,from,to){
  const out=[];
  for(const d in S.evals){ if(d<from||d>to) continue;
    (S.evals[d][code]||[]).forEach(v=>out.push({date:d,s:(typeof v==='number'?v:v.s),dec:v.dec||'',cat:v.cat||'',pri:v.pri||''})); }
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

function genInsights(){
  const out=[];
  if(!M||!M.dates.length) return out;
  const g=M.grand, days=M.dates.length;
  // forecast to period end
  const range=M.range;
  const totalPlanned=(()=>{let n=0;let d=range.from;while(d<=range.to){const dow=new Date(d+'T00:00:00Z').getUTCDay();if(dow>0&&dow<6)n++;d=addDays(d,1);}return n;})();
  if(days>=3&&totalPlanned>days){
    const fGwp=g.gwp/days*totalPlanned, fT=g.gwpT/days*totalPlanned;
    const r=fT?fGwp/fT:null;
    if(r!=null) out.push({tone:r>=1?'good':(r>=0.85?'warn':'crit'),icon:I.target,title:'Month-end forecast',
      text:`At the current run-rate GWP lands near ${fmtR(fGwp)} by period end — ${r>=1?'ahead of':'about '+fmtPct(1-r)+' short of'} the ${fmtR(fT)} pace target.`});
  }
  // vs previous period
  if(MP&&MP.dates.length){
    const cur=g.sales/days, prev=MP.grand.sales/MP.dates.length;
    if(prev>0){ const pc=(cur-prev)/prev;
      out.push({tone:pc>=0?'good':'warn',icon:pc>=0?I.up:I.down,title:'Sales pace vs last period',
        text:`Sales per dialing day ${pc>=0?'up':'down'} ${fmtPct(Math.abs(pc),1)} (${fmtNum(cur,1)}/day vs ${fmtNum(prev,1)}/day last period).`});
    }
    // QA shift per team
    let worst=null;
    for(const k in M.tlAgg){
      const [camp,tl]=k.split('|');
      const codes=[...new Set(M.facts.filter(f=>f.tl===tl&&f.campaign===camp).map(f=>f.code))];
      let cs=0,cn=0,ps=0,pn=0;
      for(const c of codes){ const q=M.qaFor(c,M.range.from,M.range.to); if(q){cs+=q.avg*q.n;cn+=q.n;}
        const qp=MP.qaFor?MP.qaFor(c,MP.range.from,MP.range.to):null; if(qp){ps+=qp.avg*qp.n;pn+=qp.n;} }
      if(cn>=5&&pn>=5){ const d=cs/cn-ps/pn; if(worst===null||d<worst.d) worst={tl,camp,d,cur:cs/cn}; }
    }
    if(worst&&worst.d<-0.02) out.push({tone:'warn',icon:I.shield,title:`QA slipping — ${worst.tl}`,
      text:`${worst.tl}'s ${worst.camp} team QA is ${fmtPct(worst.cur,1)}, down ${fmtPct(Math.abs(worst.d),1)} on last period. Worth a listen-in this week.`});
  }
  // at-risk agents
  const risky=M.agents.map(a=>({a,r:riskOf(primaryAgg(a.code))})).filter(x=>x.r.level==='High');
  if(risky.length) out.push({tone:'crit',icon:I.alert,title:`${risky.length} agent${risky.length>1?'s':''} at high risk`,
    text:`${risky.slice(0,3).map(x=>x.a.name.split(' ')[0]).join(', ')}${risky.length>3?' and others':''} are far off target — open the Coaching queue for evidence-backed plans.`});
  // star performer
  const stars=M.agents.map(a=>({a,g:primaryAgg(a.code)})).filter(x=>x.g&&x.g.pctT>=1.25&&x.g.qa&&x.g.qa.avg>=0.9);
  if(stars.length){ const s=stars.sort((x,y)=>y.g.pctT-x.g.pctT)[0];
    out.push({tone:'good',icon:I.star,title:`${s.a.name} is flying`,
      text:`${fmtPct(s.g.pctT)} of target with a ${fmtPct(s.g.qa.avg,1)} QA average — a strong shout for recognition or mentoring duty.`});
  }
  // opt-in movement
  if(g.optPct!=null&&MP&&MP.grand.optPct){
    const d=g.optPct-MP.grand.optPct;
    if(Math.abs(d)>0.03) out.push({tone:d>0?'good':'warn',icon:I.tag,title:'Insurance opt-ins '+(d>0?'up':'down'),
      text:`Opt-in rate is ${fmtPct(g.optPct,1)} of sales — ${d>0?'up':'down'} ${fmtPct(Math.abs(d),1)} vs last period.`});
  }
  // attendance
  if(g.att!=null&&g.att<0.88) out.push({tone:'warn',icon:I.users,title:'Attendance drag',
    text:`Attendance is ${fmtPct(g.att,1)} — every missed shift costs roughly ${fmtNum(g.spd||0,1)} sales at current SPD.`});
  return out.slice(0,6);
}

function coachingFor(code){
  const a=primaryAgg(code); if(!a) return [];
  const camp=M.primaryCamp[code];
  const peers=Object.values(M.mtdCC[camp]||{}).filter(x=>x.code!==code);
  const med=arr=>{const v=arr.filter(x=>x!=null).sort((a,b)=>a-b);return v.length?v[Math.floor(v.length/2)]:null;};
  const spdMed=med(peers.map(p=>p.spd)), ahtMed=med(peers.map(p=>p.aht)), optMed=med(peers.map(p=>p.optPct));
  const evs=evalsFor(code,M.range.from,M.range.to);
  const cats={}; evs.forEach(e=>{ if(e.cat) cats[e.cat]=(cats[e.cat]||0)+1; });
  const topCat=Object.entries(cats).sort((x,y)=>y[1]-x[1])[0];
  const fails=evs.filter(e=>/critical/i.test(e.dec)).length;
  const out=[];
  if(fails>0) out.push({pri:1,area:'Compliance coaching',why:`${fails} critical-fail evaluation${fails>1?'s':''} this period${topCat?' — most flagged: '+topCat[0]:''}.`,
    impact:'Clearing critical fails protects the sale from retraction and the agent from escalation.',
    ev:`${evs.length} evaluations, avg ${a.qa?fmtPct(a.qa.avg,1):'–'} · ${fails} critical`});
  if(a.qa&&a.qa.avg<0.85&&!fails) out.push({pri:2,area:'QA coaching',why:`QA average is ${fmtPct(a.qa.avg,1)} over ${a.qa.n} scored calls${topCat?', clustering on “'+topCat[0]+'”':''}.`,
    impact:`Lifting QA to 90% typically pairs with fewer retractions and stronger conversions.`,
    ev:`${a.qa.n} evaluations in period`});
  if((a.pctT??1)<0.7&&spdMed) out.push({pri:(a.pctT<0.5?1:2),area:'Sales coaching',
    why:`${fmtNum(a.spd,2)} sales per shift vs a team median of ${fmtNum(spdMed,2)} — ${fmtPct(a.pctT)} of target.`,
    impact:`Reaching the team median adds ~${fmtNum(Math.max(0,(spdMed-a.spd))*(a.act||0),0)} sales (~${fmtR(Math.max(0,(spdMed-a.spd))*(a.act||0)*(a.aveG||100))}) per period.`,
    ev:`Target ${fmtNum(a.target)} · achieved ${fmtNum(a.sales)}`});
  if(a.aht&&ahtMed&&a.aht>ahtMed*1.3&&(a.pctT??1)<1) out.push({pri:3,area:'Call efficiency',
    why:`Average handle time ${fmtDur(a.aht)} vs team median ${fmtDur(ahtMed)} — long calls aren't converting to extra sales.`,
    impact:'Tightening call control frees time for more dials per shift.',
    ev:`${fmtNum(a.ans)} answered calls · ${fmtDur(a.talk)} total talk`});
  if((a.att??1)<0.85) out.push({pri:2,area:'Attendance',
    why:`${fmtPct(a.att,1)} attendance (${fmtNum(a.act,1)} of ${fmtNum(a.emp)} shifts).`,
    impact:`Full attendance at current SPD is worth ~${fmtNum((a.emp-a.act)*(a.spd||0),0)} more sales per period.`,
    ev:'From the attendance register'});
  if(optMed&&(a.optPct??0)<optMed*0.6&&(a.sales||0)>5) out.push({pri:3,area:'Insurance opt-in pitch',
    why:`Opt-in rate ${fmtPct(a.optPct)} vs team median ${fmtPct(optMed)}.`,
    impact:'Opt-ins compound revenue on every sale already being made.',
    ev:`${fmtNum(a.opt)} opt-ins on ${fmtNum(a.sales)} sales`});
  return out.sort((x,y)=>x.pri-y.pri);
}
function narrativeFor(code){
  const a=primaryAgg(code); if(!a) return '';
  const name=(M.agents.find(x=>x.code===code)||{}).name||code;
  const first=name.split(' ')[0];
  const t=trendOf(code);
  const bits=[];
  bits.push(`${first} is at ${fmtPct(a.pctT)} of sales target month-to-date (${fmtNum(a.sales)} sales, ${fmtR(a.gwp)} GWP at ${fmtR(a.aveG,0)} per sale)`);
  if(t.pct!=null) bits.push(`momentum is ${t.dir==='up'?'building — sales rate up':(t.dir==='down'?'fading — sales rate down':'steady, moving')} ${t.pct==null?'':fmtPct(Math.abs(t.pct))} across the last week`);
  if(a.qa) bits.push(`QA sits at ${fmtPct(a.qa.avg,1)} over ${a.qa.n} evaluations`);
  if(a.att!=null) bits.push(`attendance is ${fmtPct(a.att,1)}${a.att>=0.95?' — excellent':a.att<0.8?' — a concern':''}`);
  if(a.aht) bits.push(`average handle time is ${fmtDur(a.aht)}`);
  const recs=coachingFor(code);
  const focus=recs.length?` Coaching focus: ${recs[0].area.toLowerCase()} — ${recs[0].why.replace(/\s+$/,'')}`:` No urgent coaching flags — keep reinforcing what's working.`;
  return bits.join('; ')+'.'+focus;
}

function renderTop(){
  const tls=[...new Set(S.roster.map(a=>a.tl))].sort();
  const preset=S.ui.preset||(S.ui.mode==='cycle'?'cycle':'month');
  $('#topbar').innerHTML=`
    <button class="btn ghost" id="burger" style="display:none">${I.menu}</button>
    <div class="search" id="gsearch">${I.search}<input placeholder="Search agents…" autocomplete="off"><div class="results" style="display:none"></div></div>
    <div class="ctl">${I.cal}<select id="pPreset">
      ${[['month','Calendar month'],['cycle','Cycle (26th–25th)'],['mtd','Month to date'],['today','Today'],['yesterday','Yesterday'],['7d','Last 7 days'],['30d','Last 30 days'],['prevMonth','Previous month'],['custom','Custom range']]
        .map(([v,l])=>`<option value="${v}" ${preset===v?'selected':''}>${l}</option>`).join('')}</select></div>
    ${(preset==='month'||preset==='cycle')?`<div class="ctl"><input type="month" id="pMonth" value="${S.ui.month}"></div>`:''}
    ${preset==='custom'?`<div class="ctl"><input type="date" id="pFrom" value="${S.ui.from||''}"><span class="lab">→</span><input type="date" id="pTo" value="${S.ui.to||''}"></div>`:''}
    <div class="ctl"><span class="lab">Campaign</span><select id="fCampG">
      <option value="">All</option><option value="Courtesy" ${S.ui.camp==='Courtesy'?'selected':''}>Matrix Courtesy</option><option value="Cuddle" ${S.ui.camp==='Cuddle'?'selected':''}>Matrix Cuddle</option><option value="VT" ${S.ui.camp==='VT'?'selected':''}>Matrix Tracker</option></select></div>
    <div class="ctl"><span class="lab">Team</span><select id="fTeamG"><option value="">All</option>
      ${tls.map(t=>`<option ${S.ui.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <span style="flex:1"></span>
    
    <button class="btn primary" id="btnExportAll">${I.download}<span>Export report</span></button>`;
  $('#pPreset').onchange=e=>{ S.ui.preset=e.target.value;
    if(e.target.value==='custom'&&!S.ui.from&&M){ S.ui.from=M.range.from; S.ui.to=M.range.to; }
    save(); rebuild(); renderAll(); };
  const pm=$('#pMonth'); if(pm) pm.onchange=e=>{ S.ui.month=e.target.value; save(); rebuild(); renderAll(); };
  const pf=$('#pFrom'), pt=$('#pTo');
  if(pf) pf.onchange=e=>{ S.ui.from=e.target.value; save(); rebuild(); renderAll(); };
  if(pt) pt.onchange=e=>{ S.ui.to=e.target.value; save(); rebuild(); renderAll(); };
  $('#fCampG').onchange=e=>{ S.ui.camp=e.target.value; save(); renderPage(); };
  $('#fTeamG').onchange=e=>{ S.ui.team=e.target.value; save(); renderPage(); };
  $('#btnExportAll').onclick=exportReport;
  
  // global search
  const box=$('#gsearch'),inp=box.querySelector('input'),res=box.querySelector('.results');
  inp.oninput=()=>{
    const q=inp.value.trim().toLowerCase();
    if(q.length<2||!M){ res.style.display='none'; return; }
    const hits=M.agents.filter(a=>!vtHidden(a.code)&&(a.name+' '+a.code+' '+a.tl).toLowerCase().includes(q)).slice(0,7);
    if(!hits.length){ res.style.display='none'; return; }
    res.style.display='block';
    res.innerHTML=hits.map(a=>`<button data-code="${a.code}">${avatarOf(a.name,a.code)}<span><b>${esc(a.name)}</b><br><small style="color:var(--muted)">${a.code} · ${esc(a.tl)}</small></span></button>`).join('');
    res.querySelectorAll('button').forEach(b=>b.onclick=()=>{ res.style.display='none'; inp.value=''; openDrawer(b.dataset.code); });
  };
  inp.onblur=()=>setTimeout(()=>res.style.display='none',200);
  const burger=$('#burger');
  if(matchMedia('(max-width:900px)').matches){ burger.style.display='inline-flex';
    burger.onclick=()=>document.getElementById('app').classList.toggle('sideopen'); }
}
function go(page){ S.ui.tab=page; save(); renderSide(); renderPage(); }
function renderAll(){ renderSide(); renderTop(); renderPage(); }

/* global filter helpers */
function gFilter(f){
  // "All" is the VAS view (Cuddle+Courtesy) — tracker units are a separate product with no GWP,
  // so VT only shows when Matrix Tracker is explicitly selected.
  if(S.ui.camp ? f.campaign!==S.ui.camp : f.campaign==='VT') return false;
  return (!S.ui.team||f.tl===S.ui.team); }
const vtHidden=code=>M&&M.primaryCamp[code]==='VT';
function filteredAgents(){
  if(!M) return [];
  return M.agents.filter(a=>{
    const rows=M.byAgentDay[a.code]||[];
    return rows.some(gFilter);
  });
}

/* ================= pages ================= */
const PAGES={};
function renderPage(){
  const el=$('#view');
  const fn=PAGES[S.ui.tab]||PAGES.dashboard;
  // skeleton flash for perceived smoothness
  el.innerHTML=`<div class="grid kpis">${Array(4).fill('<div class="skel" style="height:118px"></div>').join('')}</div>
    <div class="grid cols2 mt"><div class="skel" style="height:300px"></div><div class="skel" style="height:300px"></div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.animation='none'; el.offsetHeight; el.style.animation='';
    el.innerHTML=fn();
    if(PAGES['_wire_'+S.ui.tab]) PAGES['_wire_'+S.ui.tab]();
  }));
}
function emptyState(){
  return `<div class="card"><div class="empty"><div class="big">No data for ${S.ui.month} yet</div>
    Upload the day's exports in <a class="linky" onclick="go('data')">Data &amp; Uploads</a> — money (Power BI - Active Cases), call records, attendance and QA evaluations.</div></div>`;
}

PAGES.manual=()=>`<div class="card vasguide" style="max-width:900px" id="manualCard">
<h2>1 · Read the colours first</h2>
<p>Every KPI card and status dot uses one traffic-light system. Learn it once and you can read any page at a glance:</p>
<ul>
<li><b style="color:#34D399">GREEN</b> — on target. The metric is at or better than its goal.</li>
<li><b style="color:#FBBF24">AMBER</b> — watch. Slipping toward a problem; keep an eye on it.</li>
<li><b style="color:#FB7185">RED</b> — act. Below target; it needs an owner and an action today.</li>
<li><b style="color:#8296B5">GREY</b> — informational, no target set.</li>
</ul>
<p>Each KPI shows its <b>value</b>, its <b>target</b> (e.g. "target ≥ 90%"), a trend arrow versus the previous period, and a mini-sparkline. Click any KPI for its full definition and what to do when it turns red.</p>

<h2>2 · The rules behind the scores (NBA v3.0)</h2>
<p>Agents are scored by The Chatterbox NBA Scoring Framework. You do not calculate anything — the system does — but knowing the rules tells you <i>why</i> an agent is flagged.</p>

<h3>The Two-Check Sales Rule</h3>
<p><b>Value is always checked before Volume.</b> Check 1 (Value): GWP per sale ≥ R99. Check 2 (Volume): daily sales vs the agent's tenure target. A high sales count at low value still fails — because it costs the business on every policy.</p>
<table class="tbl"><thead><tr><th>Value</th><th>Volume</th><th>Status → coach on</th></tr></thead><tbody>
<tr><td>PASS</td><td>PASS</td><td>On Target → stretch goals</td></tr>
<tr><td>FAIL</td><td>PASS</td><td>Value Issue → product mix & upselling</td></tr>
<tr><td>PASS</td><td>FAIL</td><td>Volume Issue → activity, pipeline, closing</td></tr>
<tr><td>FAIL</td><td>FAIL</td><td>Both → value coaching takes priority</td></tr>
</tbody></table>
<p>Tenure daily-sales targets: <b>M1 = 3, M2 = 4, EXP-Courtesy = 5, EXP-Cuddle = 8</b>. GWP/sale target is R99 for everyone. Agents are only ever compared with peers at the same tenure.</p>

<h3>The Decision Ladder — one action per agent</h3>
<p>Rules are checked top-to-bottom; the <b>first one that triggers is the agent's single Next Best Action</b>. Most serious always wins.</p>
<ul>
<li><b style="color:#FB7185">Level 1 · Protect the Business</b> — R1 Zero Attendance · R2 Critical QA (&lt;80%) · R2A-3 Critical Compliance · R3 Attendance Risk (&lt;80%).</li>
<li><b style="color:#FBBF24">Level 2 · Protect the Revenue</b> — R2A-2 Compliance Risk · R4 GWP Value Failure (&lt;R99) · R4A Critical Sales-Volume · R5 Moderate QA (80–89%) · R6 Low Sales (70–89%).</li>
<li><b style="color:#3D9BFF">Level 3 · Improve the Skill</b> — R7 Conversion below target · R8 Talk Time (&lt;150 min/day) · R2A-1 Compliance Note (logged only).</li>
<li><b style="color:#34D399">Level 4 · Develop & Recognise</b> — R9 Developing (90–99%) · R10 Strong/Elite (meets all targets).</li>
</ul>

<h3>Graduated Critical-Fail (R2A)</h3>
<p>Critical Fail Rate (CFR) = critical fails ÷ audited calls. The tier is the <b>higher</b> of the count band and the rate band, and the penalty is <b>capped at −10</b>:</p>
<table class="tbl"><thead><tr><th>Tier</th><th>Trigger</th><th>Composite</th><th>Elite</th></tr></thead><tbody>
<tr><td>R2A-3</td><td>≥4 fails OR CFR ≥30%</td><td>−10</td><td>Blocked</td></tr>
<tr><td>R2A-2</td><td>2–3 fails OR CFR 10–&lt;30%</td><td>−5</td><td>Blocked</td></tr>
<tr><td>R2A-1</td><td>exactly 1 fail AND CFR &lt;10%</td><td>−2</td><td>Retained (a note, never a primary NBA)</td></tr>
</tbody></table>

<h3>The Composite Score (/100)</h3>
<p>Seven weighted metrics sum to 100, then the capped critical-fail penalty is applied and reported as <b>'Adj'</b>: Avg GWP/Sale <b>25</b>, Target Achievement <b>20</b>, QA <b>20</b>, Total GWP percentile <b>15</b>, Conversion <b>10</b>, Talk Time <b>5</b>, Attendance <b>5</b>. Cancellations and attempts-per-lead are diagnostics — they are never scored.</p>

<h2>3 · How to use the software</h2>
<ol>
<li><b>Check Data Trust first.</b> The bar at the top of the page shows every source's freshness — green is fresh, amber/red is stale. A beautiful chart on stale data is a confident wrong answer, so always read the trust bar before the numbers.</li>
<li><b>Upload your exports</b> in the Upload Station. The type is detected from the headers; rejected rows are logged with reasons, never silently dropped.</li>
<li><b>Filter and set the date range</b> in the top bar — every KPI, chart and table re-window to your selection.</li>
<li><b>Click any agent's name</b> (on any table or chart) to open their full card — framework score, the primary NBA, the composite breakdown, graphs, peer comparison, and an AI coaching analysis of what to improve.</li>
<li><b>Ask AgentOS</b> — the chat bubble in the bottom-right answers questions about the numbers on screen, the framework, and the business. It never invents figures.</li>
</ol>

<h2>4 · The weekly rhythm</h2>
<p><b>Daily</b> the system assigns one NBA per agent. <b>Every Monday</b> the Team Leader confirms the data and sets owners and due dates. <b>During the week</b> the coaching happens. <b>At the next review</b> — clear the NBA if resolved, escalate if not. If a red number has no owned action, the system has failed.</p>
</div>`;

  const p=Math.min(S.ui.dashPage||1,pages);
  const view=rows.slice((p-1)*per,p*per);
  const pageBtns=[];
  const push=n=>pageBtns.push(`<button class="${n===p?'on':''}" onclick="dashGo(${n})">${n}</button>`);
  if(pages<=7){ for(let i=1;i<=pages;i++) push(i); }
  else{ push(1); if(p>3) pageBtns.push('<span class="lab">…</span>');
    for(let i=Math.max(2,p-1);i<=Math.min(pages-1,p+1);i++) push(i);

  return `

  </div>

  <table class="data"><thead><tr>
    <th class="l">Agent</th><th class="l">Team</th><th>GWP</th><th>Sales</th><th>% Target</th><th>QA</th><th>Attendance</th><th>Calls</th><th>AHT</th><th>Trend</th><th></th>
  </tr></thead><tbody>
  ${view.map(x=>{ const t=trendOf(x.a.code);
    return `<tr class="rowlink" onclick="openDrawer('${x.a.code}')">
    <td class="l"><span class="agentcell">${avatarOf(x.a.name,x.a.code)}<span class="nm">${esc(x.a.name)}<small>${x.a.code} · ${M.primaryCamp[x.a.code]||''}</small></span></span></td>
    <td class="l">${esc(x.a.tl)}</td>
    <td><b>${fmtR(x.g.gwp)}</b></td><td>${fmtNum(x.g.sales)}</td><td>${pctPill(x.g.pctT)}</td>

    <td style="width:88px">${sparkSVG(seriesBy(f=>f.sales,f=>f.code===x.a.code).values,{color:t.dir==='down'?'var(--crit)':(t.dir==='up'?'var(--good)':'var(--accent)'),w:88,h:24,fill:false})}</td>
    <td><button class="btn small ghost" onclick="event.stopPropagation();openDrawer('${x.a.code}')">${I.eye}</button></td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="pager"><span class="info">Showing ${rows.length?((p-1)*per+1):0} to ${Math.min(p*per,rows.length)} of ${rows.length} agents</span>

}

PAGES.compare=()=>{
  if(!M||!M.dates.length) return emptyState();
  const list=filteredAgents();
  const A=S.ui.cmpA&&list.find(a=>a.code===S.ui.cmpA)?S.ui.cmpA:(list[0]||{}).code;
  const B=S.ui.cmpB&&list.find(a=>a.code===S.ui.cmpB)?S.ui.cmpB:(list[1]||{}).code;
  const sel=(id,cur)=>`<select class="btn" onchange="S.ui.${id}=this.value;save();renderPage()">${list.map(a=>`<option value="${a.code}" ${a.code===cur?'selected':''}>${esc(a.name)} (${a.code})</option>`).join('')}</select>`;
  if(!A||!B) return emptyState();
  const ga=primaryAgg(A)||{}, gb=primaryAgg(B)||{};
  const na=(M.agents.find(x=>x.code===A)||{}).name, nb=(M.agents.find(x=>x.code===B)||{}).name;
  const spdMax=Math.max(ga.spd||0,gb.spd||0)||1, gwpMax=Math.max(ga.aveG||0,gb.aveG||0)||1;
  const axes=[
    {key:'pctT',label:'% Target',fmt:v=>fmtPct(v)},
    {key:'qa',label:'QA',fmt:v=>v!=null?fmtPct(v,0):'–'},
    {key:'att',label:'Attendance',fmt:v=>fmtPct(v)},
    {key:'optPct',label:'Opt-In',fmt:v=>fmtPct(v)},
    {key:'spd',label:'SPD',fmt:v=>fmtNum(v,2)},
    {key:'aveG',label:'Ave GWP',fmt:v=>fmtR(v,0)},
  ];
  const mk=g=>({pctT:Math.min(1,(g.pctT||0)/1.25),qa:g.qa?g.qa.avg:0,att:g.att||0,optPct:Math.min(1,(g.optPct||0)/0.6),spd:(g.spd||0)/spdMax,aveG:(g.aveG||0)/gwpMax});
  const raw=g=>({pctT:g.pctT,qa:g.qa?g.qa.avg:null,att:g.att,optPct:g.optPct,spd:g.spd,aveG:g.aveG});
  const rows=[['GWP',fmtR(ga.gwp),fmtR(gb.gwp)],['Sales',fmtNum(ga.sales),fmtNum(gb.sales)],
    ['% to Target',fmtPct(ga.pctT),fmtPct(gb.pctT)],['SPD',fmtNum(ga.spd,2),fmtNum(gb.spd,2)],
    ['QA',ga.qa?fmtPct(ga.qa.avg,1):'–',gb.qa?fmtPct(gb.qa.avg,1):'–'],['Attendance',fmtPct(ga.att,1),fmtPct(gb.att,1)],
    ['Opt-in %',fmtPct(ga.optPct),fmtPct(gb.optPct)],['Calls',fmtNum(ga.calls),fmtNum(gb.calls)],
    ['AHT',ga.aht?fmtDur(ga.aht):'–',gb.aht?fmtDur(gb.aht):'–'],['Score',Math.round(perfScore(ga)*100),Math.round(perfScore(gb)*100)]];
  return `
  <div class="page-head"><h2>Compare agents</h2><div class="spacer"></div>${sel('cmpA',A)}<span class="lab">vs</span>${sel('cmpB',B)}</div>
  <div class="grid cols2e">
    <div class="card"><div class="cardhead"><div><h3>Profile radar</h3><div class="sub">normalised to period bests</div></div></div>
      ${radarChart(axes,[{name:na,color:'var(--cuddle)',norm:mk(ga),raw:raw(ga)},{name:nb,color:'var(--amber)',norm:mk(gb),raw:raw(gb)}],320)}</div>
    <div class="card"><div class="cardhead"><div><h3>Head to head</h3></div></div>
      <div class="tablewrap" style="max-height:none;border:none;background:none"><table class="data">
      <thead><tr><th class="l">Metric</th><th>${esc(na)}</th><th>${esc(nb)}</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="l">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></div>
  </div>
  <div class="card mt"><div class="cardhead"><div><h3>Daily sales</h3></div></div>
    ${lineChart(null,{dates:M.dates,series:[
      {name:na,color:'var(--cuddle)',values:seriesBy(f=>f.sales,f=>f.code===A).values},
      {name:nb,color:'var(--amber)',values:seriesBy(f=>f.sales,f=>f.code===B).values}]})}</div>`;
};

    {h:'Emp',f:r=>fmtNum(r.emp)},
    {h:'Actual',f:r=>fmtNum(r.act,r.act%1?1:0)},
    {h:'Att %',f:r=>fmtPct(r.att)},
    {h:'Sales ±',f:r=>'<b>'+fmtNum(r.sales)+'</b>',csv:r=>r.sales},
    {h:'SPD',f:r=>fmtNum(r.spd,2)},
    {h:'Calls',f:r=>fmtNum(r.calls)},
    {h:'Answered',f:r=>fmtNum(r.ans)},
    {h:'Answer %',f:r=>fmtPct(r.calls?r.ans/r.calls:null)},
    {h:'AHT',f:r=>r.aht?fmtDur(r.aht):'–'},
    {h:'Ave Talk',f:r=>r.aveTalk!=null?fmtDur(r.aveTalk):'–'},
    {h:'QA',f:r=>r.qa?fmtPct(r.qa.avg,1):'–',csv:r=>r.qa?(r.qa.avg*100).toFixed(1)+'%':''}
  ];
  const c=[
    {h:'Team Leader',l:1,f:r=>esc(r.tl)},
    {h:'Tenure',l:1,f:r=>esc(r.tenure)},
    {h:'Agent',l:1,f:r=>`<span class="agentcell">${r.code?avatarOf(r.agent,r.code):''}<span class="nm">${esc(r.agent)}</span></span>`,csv:r=>r.agent},
    {h:'Emp',f:r=>fmtNum(r.emp)},
    {h:'Actual',f:r=>fmtNum(r.act,r.act%1?1:0)},
    {h:'Att %',f:r=>fmtPct(r.att)},
    {h:'Target',f:r=>fmtNum(r.target)},
    {h:'Sales',f:r=>'<b>'+fmtNum(r.sales)+'</b>',csv:r=>r.sales},
    {h:'% Target',f:r=>pctPill(r.pctT),csv:r=>r.pctT==null?'':(r.pctT*100).toFixed(1)+'%'},
    {h:'SPD',f:r=>fmtNum(r.spd,2)}
  ];
  if(opts.canc) c.push({h:'Canc',f:r=>fmtNum(r.canc)},{h:'Canc %',f:r=>fmtPct(r.cancPct,1)});
  c.push(
    {h:'Ave Talk',f:r=>r.aveTalk!=null?fmtDur(r.aveTalk):'–'},
    {h:'GWP Target',f:r=>fmtNum(r.gwpT)},
    {h:'GWP',f:r=>fmtNum(r.gwp)},
    {h:'% GWP',f:r=>pctPill(r.pctG),csv:r=>r.pctG==null?'':(r.pctG*100).toFixed(1)+'%'},
    {h:'Ave GWP',f:r=>fmtNum(r.aveG,1)},
    {h:'Opt-Ins',f:r=>fmtNum(r.opt)},
    {h:'Opt-In %',f:r=>fmtPct(r.optPct)},
    {h:'Referrals',f:r=>fmtNum(r.ref)},
    {h:'QA',f:r=>r.qa?fmtPct(r.qa.avg,1):'–',csv:r=>r.qa?(r.qa.avg*100).toFixed(1)+'%':''}
  );
  return c;
}
function tableHTML(cols,rows,rowClass){
  const th=cols.map(c=>`<th class="${c.l?'l':''}">${c.h}</th>`).join('');
  const body=rows.map((r,i)=>`<tr class="${rowClass?rowClass(r,i):''}" ${r.code&&!r._tot&&!r._sub?`onclick="openDrawer('${r.code}')" style="cursor:pointer"`:''}>`+
    cols.map(c=>`<td class="${c.l?'l':''}">${c.f(r)}</td>`).join('')+'</tr>').join('');
  return `<div class="tablewrap"><table class="data"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function agentRows(camp, week){
  if(!M) return [];
  const src=week?((M.wtdCC[week]||{})[camp]||{}):M.mtdCC[camp];
  const roleOf={}; S.roster.forEach(a=>roleOf[a.code]=a.role||'');
  const rows=Object.values(src||{}).map(g=>({...g, prov:g.prov>0, role:roleOf[g.code]||''}));
  rows.sort((x,y)=>(y.spd||0)-(x.spd||0));
  return rows;
}
function totalRow(rows,label){
  const t={tl:label,tenure:'',agent:'',emp:0,act:0,target:0,sales:0,gwp:0,gwpT:0,talk:0,opt:0,ref:0,canc:0,calls:0,ans:0,qa:null};
  let qs=0,qn=0;
  for(const r of rows){ t.emp+=r.emp;t.act+=r.act;t.target+=r.target;t.sales+=r.sales;t.gwp+=r.gwp;t.gwpT+=r.gwpT;
    t.talk+=r.talk;t.opt+=r.opt;t.ref+=r.ref;t.canc+=r.canc;t.calls+=(r.calls||0);t.ans+=(r.ans||0); if(r.qa){qs+=r.qa.avg*r.qa.n;qn+=r.qa.n;} }
  t.att=t.emp?t.act/t.emp:null;t.pctT=t.target?t.sales/t.target:null;t.spd=t.act?t.sales/t.act:null;
  t.pctG=t.gwpT?t.gwp/t.gwpT:null;t.aveG=t.sales?t.gwp/t.sales:null;t.aveTalk=t.act?t.talk/t.act:null;
  t.optPct=t.sales?t.opt/t.sales:null;t.refPct=t.sales?t.ref/t.sales:null;t.cancPct=t.sales?t.canc/t.sales:null;
  t.aht=t.ans?t.talk/t.ans:null;
  t.qa=qn?{avg:qs/qn,n:qn}:null;
  return t;
}
function groupByTL(rows){
  const byTL={}; rows.forEach(r=>{(byTL[r.tl]=byTL[r.tl]||[]).push(r);});
  const out=[]; for(const tl of Object.keys(byTL).sort()){ out.push(...byTL[tl], Object.assign(totalRow(byTL[tl],tl+' Total'),{_sub:1})); }
  return out;
}
function campSection(camp,week,opts){
  opts=opts||{}; if(camp==='VT') opts={...opts,vt:true,canc:false};
  let rows=agentRows(camp,week); if(!rows.length) return '';
  if(camp==='Courtesy') rows=groupByTL(rows);
  const tot=Object.assign(totalRow(rows.filter(r=>!r._sub),'Grand Total'),{_tot:1});
  return tableHTML(aggCols(opts),[...rows,tot],r=>r._tot?'total':(r._sub?'subtotal':''));
}

window.dailyF=(k,v)=>{ (S.ui.dailyFilter=S.ui.dailyFilter||{})[k]=v; save(); renderPage(); };
window.dailyStep=dir=>{
  if(!M||!M.dates.length) return;
  const f=S.ui.dailyFilter=S.ui.dailyFilter||{};
  let i;
  if(!f.date) i=dir<0?M.dates.length-1:0;   // from "All days": ‹ jumps to the latest day, › to the first
  else i=Math.max(0,Math.min(M.dates.length-1,M.dates.indexOf(f.date)+dir));
  f.date=M.dates[i];
  save(); renderPage();
};
let dfT=null; window.dailyFQ=v=>{ clearTimeout(dfT); dfT=setTimeout(()=>dailyF('q',v),320); };

PAGES.pivot=()=>{
  if(!M||!M.facts.length) return emptyState();
  const days=M.dates;
  const rows=filteredAgents().map(a=>{
    const per={}; let tot=0;
    (M.byAgentDay[a.code]||[]).forEach(f=>{ if(!gFilter(f))return; per[f.date]=(per[f.date]||0)+f.sales; tot+=f.sales; });
    return {a,per,tot};
  }).sort((x,y)=>y.tot-x.tot);
  const maxCell=Math.max(1,...rows.flatMap(r=>days.map(d=>r.per[d]||0)));
  const heat=v=>{ if(!v) return ''; const t=Math.min(1,v/maxCell);
    return `background:color-mix(in srgb, var(--accent) ${Math.round(10+t*55)}%, transparent);border-radius:6px;`; };
  const head='<th class="l">Agent</th>'+days.map(d=>`<th>${d.slice(8)}/${d.slice(5,7)}</th>`).join('')+'<th>Total</th>';
  const body=rows.map(r=>`<tr class="rowlink" onclick="openDrawer('${r.a.code}')"><td class="l"><span class="agentcell">${avatarOf(r.a.name,r.a.code)}<span class="nm">${esc(r.a.name)}<small>${r.a.code}</small></span></span></td>`+
    days.map(d=>`<td><span style="display:inline-block;min-width:22px;${heat(r.per[d])}">${r.per[d]||''}</span></td>`).join('')+`<td><b>${r.tot}</b></td></tr>`).join('');
  const colTot=days.map(d=>rows.reduce((s,r)=>s+(r.per[d]||0),0));
  const foot=`<tr class="total"><td class="l">Grand Total</td>${colTot.map(v=>`<td>${v}</td>`).join('')}<td>${colTot.reduce((a,b)=>a+b,0)}</td></tr>`;
  window.__exp={name:'pivot',cols:[{h:'Agent',f:r=>r.a.name},{h:'Code',f:r=>r.a.code},...days.map(d=>({h:d,f:r=>r.per[d]||0})),{h:'Total',f:r=>r.tot}],rows};
  return `<div class="page-head"><h2>Sales heatmap</h2><div class="sub">sales per agent per day — darker is more</div>
    <div class="spacer"></div><button class="btn small" onclick="exportCSV('pivot_${S.ui.month}.csv',__exp.cols,__exp.rows)">${I.download}<span>Export</span></button></div>
    <div class="tablewrap"><table class="data"><thead><tr>${head}</tr></thead><tbody>${body}${foot}</tbody></table></div>`;
};

PAGES.attend=()=>{
  if(!M||!M.facts.length) return emptyState();
  const days=M.dates;
  const attCov=days.filter(d=>S.att[d]&&Object.keys(S.att[d]).length).length;
  const rows=filteredAgents().map(a=>{
    const per={}; let emp=0,act=0;
    (M.byAgentDay[a.code]||[]).forEach(f=>{ if(!gFilter(f))return; per[f.date]={emp:f.emp,act:f.act}; emp+=f.emp; act+=f.act; });
    return {a,per,emp,act,att:emp?act/emp:null};
  }).filter(r=>r.emp>0).sort((x,y)=>(x.att??2)-(y.att??2));
  const cell=v=>{ if(!v||!v.emp) return '<span class="attcell attn">·</span>';
    if(v.act>=1) return '<span class="attcell att1">✓</span>';
    if(v.act>0) return '<span class="attcell atth">½</span>';
    return '<span class="attcell att0">✕</span>'; };
  const head='<th class="l">Agent</th><th class="l">Team</th>'+days.map(d=>`<th>${d.slice(8)}/${d.slice(5,7)}</th>`).join('')+'<th>Att %</th>';
  const body=rows.map(r=>`<tr class="rowlink" onclick="openDrawer('${r.a.code}')">
    <td class="l"><span class="agentcell">${avatarOf(r.a.name,r.a.code)}<span class="nm">${esc(r.a.name)}<small>${r.a.code} · ${esc(r.a.tl)}</small></span></span></td>
    <td class="l">${campChip(M.primaryCamp[r.a.code]||r.a.campaign)}</td>`+
    days.map(d=>`<td>${cell(r.per[d])}</td>`).join('')+
    `<td>${r.att!=null?`<span class="pill ${r.att>=0.95?'pgood':(r.att>=0.85?'pwarn':'pcrit')}">${fmtPct(r.att,1)}</span>`:'–'}</td></tr>`).join('');
  window.__exp={name:'attendance',cols:[{h:'Agent',f:r=>r.a.name},{h:'Code',f:r=>r.a.code},{h:'Team',f:r=>r.a.tl},
    ...days.map(d=>({h:d,f:r=>r.per[d]?r.per[d].act:''})),{h:'Att %',f:r=>r.att!=null?(r.att*100).toFixed(1)+'%':''}],rows};
  return `<div class="page-head"><h2>Attendance</h2><div class="sub">shift register per agent per day — sorted worst first · ✓ full · ½ half · ✕ absent</div>
    <div class="spacer"></div><button class="btn small" onclick="exportCSV('attendance_${S.ui.month}.csv',__exp.cols,__exp.rows)">${I.download}<span>Export</span></button></div>
  ${attCov<days.length?`<div class="warnbox">Attendance files cover ${attCov} of ${days.length} dialing days — on uncovered days agents with activity are assumed present.</div>`:''}
  <div class="tablewrap"><table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
};

PAGES['_wire_data']=()=>{
  document.querySelectorAll('.slot[data-slot]').forEach(el=>{
    const t=el.dataset.slot;
    const pick=()=>{ window.__slotExpected=t; $('#fileInput').click(); };
    el.onclick=pick;
    el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
    el.ondragover=e=>{ e.preventDefault(); el.classList.add('over'); };
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{ e.preventDefault(); el.classList.remove('over'); handleFiles(e.dataTransfer.files,t); };
  });
};
window.mapIdentity=(k,v)=>{ if(!v) return; S.map[k]=v; save(); rebuild(); renderAll();
  toast(v==='__ignore__'?'Ignored':'Mapped'); };

function exportCSV(filename, cols, rows){
  const clean=v=>{ const s=String(v??'').replace(/<[^>]*>/g,''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const lines=[cols.map(c=>clean(c.h)).join(',')];
  for(const r of rows) lines.push(cols.map(c=>clean(c.csv?c.csv(r):c.f(r))).join(','));
  downloadText(filename, lines.join('\n'));
}
function downloadText(filename, text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));
  a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}

  const metricList=[['Employed HC','hc'],['Total Employed Shifts','emp'],['Total Actual Shifts','act'],['% Of Attendance','att'],

    ['GWP Target','gwpT'],['GWP Achieved','gwp'],['% To GWP Target','pctG'],['Ave GWP','aveG'],
    ['Insurance Opt-Ins','opt'],['Referrals','ref'],['Agents on Target','onT']];
  const tlAoa=[['Metric',...tlKeys.map(k=>k.replace('|',' — '))]];
  for(const [lab,key] of metricList)
    tlAoa.push([lab,...tlKeys.map(k=>{ const v=M.tlAgg[k][key]; return v==null?'':(typeof v==='number'?(key.startsWith('pct')||key==='att'?(v*100).toFixed(1)+'%':Math.round(v*100)/100):v); })]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tlAoa),'TL MTD');
  const tag=(S.ui.camp||'All')+(S.ui.team?'_'+S.ui.team.replace(/[^A-Za-z0-9]+/g,''):'');

/* ================= boot ================= */
/* Read an upload as TEXT the rest of the pipeline understands.
   .csv/.txt pass straight through. .xlsx (ZIP magic PK) and legacy .xls (CFB magic D0CF)
   are rendered by SheetJS into VAS's OWN multi-sheet format — "### Sheet: Name ###" +
   CSV — so splitSheets/toObjects/INGEST all work unchanged, every sheet included.
   cellDates + dateNF force ISO yyyy-mm-dd: Excel hands back serials or locale strings
   ("7/13/26"), and INGEST.bi requires /^\d{4}-\d{2}-\d{2}$/ or it silently drops the row. */
async function fileToText(f){ return bufferToText(f.name, await f.arrayBuffer()); }
/* PURE spreadsheet → "### Sheet:" text conversion. SELF-CONTAINED on purpose: it is
   serialised with .toString() and shipped into a Web Worker so the multi-second
   XLSX parse of a 50 MB export runs OFF the main thread (the UI used to freeze
   solid for the duration — that was the upload "lag"). No globals, no toast, no
   template literals in here. `data` is an ArrayBuffer (xlsx/xls) or a string
   (Salesforce HTML-.xls). */
function __sheetCore(XLSX, data){
  const wb=(typeof data==='string')?XLSX.read(data,{type:'string'}):XLSX.read(data,{type:'array',cellNF:true});
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn]; if(!ws) continue;
    // Columns whose header names a date, by column index. Some Power BI/SF exports stamp
    // date serials with a junk custom format ('"TRUE";"TRUE";"FALSE"') that SSF.is_date
    // cannot recognise — every date then renders as literal "TRUE" and each row dies on
    // the downstream date guards. For numeric cells in a date-NAMED column whose format
    // is not a date format, convert plausible date serials (1995–2064) directly.
    const dateCols=new Set();
    try{
      const R=XLSX.utils.decode_range(ws['!ref']||'A1');
      // header rows only (first two), and 'date' as a whole word — a DATA cell like
      // "Updated" or "Candidate" deeper in the sheet must never mark a numeric column
      for(let r=R.s.r;r<=Math.min(R.e.r,R.s.r+1);r++)
        for(let cc=R.s.c;cc<=R.e.c;cc++){
          const h=ws[XLSX.utils.encode_cell({r,c:cc})];
          if(h&&h.t==='s'&&/(^|[^a-z])date([^a-z]|$)/i.test(h.v)) dateCols.add(cc);
        }
    }catch(e){}
    for(const a in ws){
      if(a[0]==='!') continue;
      const c=ws[a]; if(!c) continue;
      // Rewrite EVERY date cell to a literal yyyy-mm-dd string. Excel stores dates as
      // serials rendered through a locale format — sheet_to_csv would emit "7/13/26",
      // and every guard downstream (INGEST.bi's /^\d{4}-\d{2}-\d{2}$/, parseDateLoose)
      // wants ISO, so the whole file would parse and then drop every row. SSF.format on
      // the raw serial is timezone-safe; the t==='d' arm covers workbooks already
      // carrying real Date cells. TIME-ONLY cells (Duration hh:mm:ss — no y/d in the
      // format) must NOT become dates: durSecs needs the h:m:s string, so render those
      // as hh:mm:ss or talk time reads zero.
      if(c.t==='n'&&c.z&&XLSX.SSF&&XLSX.SSF.is_date(c.z)){
        const z=String(c.z);
        // time-only (no y/d in the format, incl. 'mm:ss'): render elapsed-style so a
        // 30-hour duration stays 30:00:00 instead of wrapping mod 24, and never
        // becomes a date (that zeroed talk time)
        c.v=(/[hHsS]/.test(z)&&!/[yYdD]/.test(z))?XLSX.SSF.format('[h]:mm:ss',c.v):XLSX.SSF.format('yyyy-mm-dd',c.v);
        c.t='s'; delete c.w; delete c.z;
      }else if(c.t==='n'&&c.v>34700&&c.v<60000&&dateCols.has(XLSX.utils.decode_cell(a).c)){
        // date serial hidden behind a non-date format in a date-named column (see above)
        c.v=XLSX.SSF.format('yyyy-mm-dd',c.v); c.t='s'; delete c.w; delete c.z;
      }else if(c.t==='d'&&c.v instanceof Date){
        const d=c.v;
        c.v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        c.t='s'; delete c.w; delete c.z;
      }
    }
  }
  return wb.SheetNames.map(sn=>'### Sheet: '+sn+' ###\n'+XLSX.utils.sheet_to_csv(wb.Sheets[sn],{blankrows:false})).join('\n');
}
/* Background parser: a Blob Worker built from __sheetCore's own source, loading the
   self-hosted SheetJS via importScripts. Falls back to the synchronous in-page parse
   when workers are unavailable (file://, CSP without worker-src, old browser). */
let __shWorkerP=null, __shJobs={}, __shSeq=0;
function __sheetWorkerP(){
  if(__shWorkerP) return __shWorkerP;
  __shWorkerP=(async()=>{
    try{
      // inline the self-hosted SheetJS into the worker blob — no importScripts, so no
      // MIME/CSP surprises; the ~1 MB source is fetched once and reused for every file
      const r=await fetch(new URL('/xlsx.full.min.js',location.href));
      if(!r.ok) return null;
      const lib=await r.text();
      const src=lib+'\n;var __core=('+__sheetCore.toString()+');'+
        'self.onmessage=function(e){var d=e.data;try{var t=__core(self.XLSX||XLSX,d.data);'+
        'self.postMessage({id:d.id,text:t});}catch(err){self.postMessage({id:d.id,error:String(err&&err.message||err)});}};';
      const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
      w.onmessage=e=>{ const j=__shJobs[e.data.id]; if(!j) return; delete __shJobs[e.data.id];
        e.data.error?j.reject(new Error(e.data.error)):j.resolve(e.data.text); };
      w.onerror=()=>{ for(const k in __shJobs){ __shJobs[k].reject(new Error('worker failed')); delete __shJobs[k]; } };
      return w;
    }catch(e){ return null; }   // no worker support — callers use the in-page parse
  })();
  return __shWorkerP;
}
async function __convertOffThread(data){
  const w=await __sheetWorkerP(); if(!w) return null;
  const id=++__shSeq;
  return new Promise((resolve,reject)=>{ __shJobs[id]={resolve,reject};
    try{ w.postMessage({id, data}); }

async function bufferToText(name, buf){
  const b=new Uint8Array(buf.slice(0,8));
  const isZip=b[0]===0x50&&b[1]===0x4B, isCFB=b[0]===0xD0&&b[1]===0xCF;
  let data=buf;
  if(!isZip&&!isCFB){
    const text=new TextDecoder('utf-8').decode(buf).replace(/^﻿/,'');
    // Salesforce exports "Open Cases.xls" that is really an HTML <table> — SheetJS
    // parses HTML strings, so route it there instead of feeding tags to parseCSV.
    const head=text.slice(0,512).trimStart().toLowerCase();
    if(!(head.startsWith('<')&&/<(!doctype|html|head|meta|table)/.test(head))) return text;
    data=text;
  }

  try{ const t=await __convertOffThread(data); if(t!=null) return t; }catch(e){ /* fall through to the in-page parse */ }
  if(typeof XLSX==='undefined'){ toast('Cannot read '+name+' — the spreadsheet reader did not load. Refresh, or export as CSV.'); return null; }

/* Fingerprint the file's BYTES — identical content is recognised no matter what the
   file is called ("call_records (2).xlsx" re-downloaded = same hash), so the daily
   re-upload of an unchanged export is skipped instead of re-ingested/duplicated. */
async function hashBuf(buf){
  try{
    const h=await crypto.subtle.digest('SHA-256',buf);
    return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){ // non-secure context fallback: dual DJB2/FNV-style rolling hash + length
    const u=new Uint8Array(buf); let h1=5381,h2=52711;
    for(let i=0;i<u.length;i++){ h1=((h1*33)^u[i])>>>0; h2=((h2*31)+u[i])>>>0; }
    return 'x'+h1.toString(16)+'-'+h2.toString(16)+'-'+u.length.toString(16);
  }
}
/* Is the data this registry entry stored still present? A hash entry whose days were
   since deleted (file removals, orphan cleanup) must NOT block re-uploading the same
   file to repair the gap — that would show "already uploaded" while the data is gone. */
function dupStillLive(f){
  const ty=String(f.type||'');
  if(ty.startsWith('roster')) return true;
  if(ty.startsWith('open')) return !!S.opencases;
  const st=STORE_OF[ty.split(' ')[0]];
  if(!st) return true;
  const ds=f.dates||[];
  if(!ds.length) return false;      // stored nothing (e.g. every day was fuller elsewhere) — always allow a retry
  return ds.every(d=>S[st][d]);

async function handleFiles(list, expected){
  let ok=0, skipped=0;
  for(const f of Array.from(list)){
    let buf=null;
    try{ buf=await f.arrayBuffer(); }catch(e){ toast('Could not read '+f.name+' — '+(e.message||e)); continue; }
    const hash=await hashBuf(buf);
    const dup=(S.files||[]).find(x=>x.hash&&x.hash===hash);
    if(dup&&dupStillLive(dup)){ skipped++; toast('Skipped '+f.name+' — already uploaded'+(dup.name!==f.name?' (as "'+dup.name+'")':'')); continue; }
    if(dup) S.files=S.files.filter(x=>x!==dup);   // stale entry, its data is gone — drop it and re-ingest
    if(f.size>4*1048576){ // big export: sticky progress toast — the parse itself runs in a background thread
      toast('Reading '+f.name+' ('+Math.round(f.size/1048576)+' MB) — the app stays usable while this loads…',600000);
      await new Promise(r=>setTimeout(r,60));
    }
    let text=null;
    try{ text=await bufferToText(f.name,buf); }catch(e){ toast('Could not read '+f.name+' — '+(e.message||e)); }
    if(text==null) continue;
    if(await ingestText(f.name,text,expected,hash)) ok++;
  }
  if(ok){
    if(!S.ui.month) S.ui.month=latestMonth();
    const r=periodRange();
    const ds=[...allDataDates()];
    if(r&&!ds.some(d=>d>=r.from&&d<=r.to)&&ds.length){ S.ui.preset=''; S.ui.month=latestMonth(); }  // a sticky 'today/7d' preset outside the data's range would show "No data yet" right after a successful upload
    save(); rebuild(); renderAll();
    toast(ok+' file'+(ok>1?'s':'')+' loaded'+(skipped?' · '+skipped+' skipped (already uploaded)':''));
  }else if(skipped){
    toast(skipped+' file'+(skipped>1?'s':'')+' skipped — already uploaded, nothing new to add');
  }
}
document.getElementById('fileInput').onchange=e=>{ const exp=window.__slotExpected; window.__slotExpected=null;
  handleFiles(e.target.files, exp); e.target.value=''; };

// migrate v1 eval store (plain numbers) → v2 objects; ensure calls have ans
(function migrate(){

    S.evals[d][c]=S.evals[d][c].map(v=>typeof v==='number'?{s:v}:v);

<script>(function(){
var hydWarned=false;
function hydRetry(){
  // 401/5xx/network on hydrate used to leave __vasHydrated false FOREVER: every upload
  // then looked saved but silently never reached the cloud. Warn once, keep retrying.
  if(!hydWarned){ hydWarned=true; try{ if(typeof toast==="function") toast("⚠ Cloud not reachable — uploads are NOT saving to the database yet; retrying…"); }catch(e){} }
  setTimeout(hydrate,30000);
}
function hydrate(){
  var t=sessionStorage.getItem("cbx_token"); if(!t) return;
  fetch("https://chatterbox-agentos-api.chatterbox-agentos.workers.dev/api/kv?key=vas-state",{headers:{"Authorization":"Bearer "+t}})
   .then(function(r){ if(r.status===404) return {empty:true}; return r.ok ? r.text().then(function(x){return {txt:x}}) : {skip:true}; })
   .then(function(res){
     if(!res||res.skip){ hydRetry(); return; }  // auth/5xx — keep local, warn, retry; never push blind
     if(res.empty){
       // no blob in the cloud. If THIS device holds real data (first-ever sync, or the
       // cloud copy was lost), push it up — factory-wiping local uploads loses work.
       if(S&&Array.isArray(S.files)&&S.files.length){ window.__vasHydrated=true; if(typeof __cloudPush==="function")__cloudPush(false); return; }
       try{ if(typeof freshState==="function"){ var fr=freshState(); Object.keys(S).forEach(function(k){delete S[k]}); Object.assign(S,fr); localStorage.setItem("vas_mtd_tracker_v1",JSON.stringify(S)); if(typeof rebuild==="function")rebuild(); if(typeof renderAll==="function")renderAll(); } }catch(e){}
       window.__vasHydrated=true; return;
     }
     var cloud; try{cloud=JSON.parse(res.txt)}catch(e){ window.__vasHydrated=true; return; }
     if(cloud&&typeof cloud==="object"){
       if(cloud._rev&&S&&S._rev&&S._rev>cloud._rev){
         // local is NEWER than the cloud blob (e.g. the push was aborted by a tab close).
         // Keep local and re-push it — adopting the older cloud copy would destroy the upload.
         window.__vasHydrated=true; if(typeof __cloudPush==="function")__cloudPush(false); return;
       }
       // cloud is same-or-newer — adopt it wholesale
       try{ Object.keys(S).forEach(function(k){delete S[k]}); Object.assign(S,cloud); localStorage.setItem("vas_mtd_tracker_v1",JSON.stringify(S)); if(typeof rebuild==="function")rebuild(); if(typeof renderAll==="function")renderAll(); }catch(e){}
