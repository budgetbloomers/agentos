function renderTop(){
  const tls=[...new Set(S.roster.map(a=>a.tl))].sort();
  const preset=S.ui.preset||(S.ui.mode==='cycle'?'cycle':'month');
  $('#topbar').innerHTML=`
    <button class="btn ghost" id="burger" style="display:none">${I.menu}</button>
    <div class="search" id="gsearch">${I.search}<input placeholder="Search agents…" autocomplete="off"><div class="results" style="display:none"></div></div>
    <div class="ctl">${I.cal}<select id="pPreset">
      ${[['month','Calendar month'],['cycle','Cycle (26th–25th)'],['mtd','Month to date'],['today','Today'],['yesterday','Yesterday'],['7d','Last 7 days'],['30d','Last 30 days'],['prevMonth','Previous month'],['custom','Custom range']]
        .map(([v,l])=>`<option value="${v}" ${preset===v?'selected':''}>${l}</option>`).join('')}</select></div>
    ${(preset==='month'||preset==='cycle')?`<div class="ctl"><input type="month" id="pMonth" value="${S.ui.month}"></div>`:''}
    ${preset==='custom'?`<div class="ctl"><input type="date" id="pFrom" value="${S.ui.from||''}"><span class="lab">→</span><input type="date" id="pTo" value="${S.ui.to||''}"></div>`:''}
    ${preset!=='custom'?`<div class="ctl" title="Stop the period on this day. Use it to line the dashboard up with a tracker that was cut earlier — the month keeps its shape, it just ends where you say."><span class="lab">as at</span><input type="date" id="pAsAt" value="${S.ui.asAt||''}">${S.ui.asAt?`<button class="btn ghost" id="pAsAtClear" style="padding:2px 8px" title="show every day again">✕</button>`:''}</div>`:''}
    <div class="ctl"><span class="lab">Campaign</span><select id="fCampG">
      <option value="">All</option>${CAMPS.map(c=>`<option value="${c}" ${S.ui.camp===c?'selected':''}>${esc(CAMPLAB[c]||c)}</option>`).join('')}</select></div>
    <div class="ctl"><span class="lab">Team</span><select id="fTeamG"><option value="">All</option>
      ${tls.map(t=>`<option ${S.ui.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <button class="btn primary" id="btnExportAll" style="margin-left:auto">${I.download}<span>Export report</span></button>`;
  $('#pPreset').onchange=e=>{ S.ui.preset=e.target.value;
    if(e.target.value==='custom'&&!S.ui.from&&M){ S.ui.from=M.range.from; S.ui.to=M.range.to; }
    save(); rebuild(); renderAll(); };
  const pm=$('#pMonth'); if(pm) pm.onchange=e=>{ S.ui.month=e.target.value; saveUI(); rebuild(); renderAll(); };
  const pf=$('#pFrom'), pt=$('#pTo');
  if(pf) pf.onchange=e=>{ S.ui.from=e.target.value; saveUI(); rebuild(); renderAll(); };
  if(pt) pt.onchange=e=>{ S.ui.to=e.target.value; saveUI(); rebuild(); renderAll(); };
  const pa=$('#pAsAt'); if(pa) pa.onchange=e=>{ S.ui.asAt=e.target.value||''; saveUI(); rebuild(); renderAll(); };
  const pac=$('#pAsAtClear'); if(pac) pac.onclick=()=>{ S.ui.asAt=''; saveUI(); rebuild(); renderAll(); };
  $('#fCampG').onchange=e=>{ S.ui.camp=e.target.value; saveUI(); renderPage(); };
  $('#fTeamG').onchange=e=>{ S.ui.team=e.target.value; saveUI(); renderPage(); };
  $('#btnExportAll').onclick=exportReport;
  
  // global search
  const box=$('#gsearch'),inp=box.querySelector('input'),res=box.querySelector('.results');
  inp.oninput=()=>{
    const q=inp.value.trim().toLowerCase();
    if(q.length<2||!M){ res.style.display='none'; return; }
    const hits=M.agents.filter(a=>!vtHidden(a.code)&&(a.name+' '+a.code+' '+a.tl).toLowerCase().includes(q)).slice(0,7);
    if(!hits.length){ res.style.display='none'; return; }
    res.style.display='block';
    res.innerHTML=hits.map(a=>`<button data-code="${a.code}">${avatarOf(a.name,a.code)}<span><b>${esc(a.name)}</b><br><small style="color:var(--muted)">${a.code} · ${esc(a.tl)}</small></span></button>`).join('');
    res.querySelectorAll('button').forEach(b=>b.onclick=()=>{ res.style.display='none'; inp.value=''; openDrawer(b.dataset.code); });
  };
  inp.onblur=()=>setTimeout(()=>res.style.display='none',200);
  /* The arrow is always on: mobile slides the sidebar in, desktop collapses it to the
     icon rail — the same toggle the sidebar-foot Collapse button drives, surfaced where
     it can be seen without scrolling the nav. */
  const burger=$('#burger');
  burger.style.display='inline-flex';
  burger.title='Toggle sidebar';
  sideChevrons();
  burger.onclick=()=>{ const app=document.getElementById('app');
    if(matchMedia('(max-width:900px)').matches) app.classList.toggle('sideopen');
    else app.classList.toggle('collapsed');
    sideChevrons(); };
  fitSelects();
}
/* Size each toolbar dropdown to the option ON SHOW rather than the longest one in
   the list — see the .ctl comment in the stylesheet for why the browser's own width
   is wrong here. Measured on a canvas with the element's real font, so it stays
   right in either theme and at any zoom, and re-run on change because switching to
   "Matrix Courtesy" legitimately needs more room than "All". */
let _fsCtx=null;
function fitSelects(root){
  const sels=(root||document).querySelectorAll('.ctl select');
  if(!sels.length) return;
  if(!_fsCtx) _fsCtx=document.createElement('canvas').getContext('2d');
  sels.forEach(s=>{
    const cs=getComputedStyle(s);
    _fsCtx.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const txt=(s.options[s.selectedIndex]||{}).text||'';
    // +16 leaves room for the chevron the stylesheet paints on the right
    const w=Math.ceil(_fsCtx.measureText(txt).width)+16;
    s.style.width=Math.max(46,Math.min(150,w))+'px';
  });
}
/* One delegated listener rather than per-control wiring: the filters re-render the
   page, not the toolbar, so without this a changed value keeps the old width. */
document.addEventListener('change',e=>{ if(e.target&&e.target.matches&&e.target.matches('.ctl select')) fitSelects(e.target.closest('header')||undefined); });
/* Web fonts land after first paint and are wider than the fallback, so a width
   measured too early clips the text. Re-measure once Inter is actually in. */
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fitSelects()).catch(()=>{});
function go(page){ S.ui.tab=page; saveUI(); renderSide(); renderPage(); }
function renderAll(){ renderSide(); renderTop(); renderPage(); }
/* the collapse control is an ARROW that points where it will take you: « to tuck the
   sidebar into the icon rail, » to bring it back. Both toggles (topbar + sidebar foot)
   share this so they never disagree. */
function sideChevrons(){
  const c=document.getElementById('app').classList.contains('collapsed');
  const b=$('#burger'); if(b) b.innerHTML=c?I.chevR:I.chevL;
  const f=$('#collapseBtn'); if(f) f.innerHTML=(c?I.chevR:I.chevL)+'<span>Collapse</span>';
}

/* global filter helpers */
function gFilter(f){
  // "All" is the VAS view (Cuddle+Courtesy) — tracker units are a separate product with no GWP,
  // so VT only shows when Matrix Tracker is explicitly selected.
  if(S.ui.camp ? f.campaign!==S.ui.camp : f.campaign==='VT') return false;
  return (!S.ui.team||f.tl===S.ui.team); }
/* NAME THE FILTER THAT EMPTIED THE PAGE, and give it a way out.
   A global team filter can select a leader who HAS roster agents but no facts in the period —
   the Nesting floor's "TBC" is exactly that: 8 agents on the roster, 0 fact rows, because
   facts carry the leader the day was worked under (orgAt), not the roster's current label.
   Every row then vanishes AND the page's own dropdown does not offer that value, so it cannot
   be cleared from the screen showing nothing. A bare empty table reads as lost data; this
   says which filter did it and clears it in one click. */
window.__clearFilters=()=>{ S.ui.team=''; S.ui.camp=''; S.ui.dailyFilter={}; saveUI(); rebuild(); renderAll(); };
function filterEmptyNote(total,extra){
  const on=[];
  if(S.ui.team) on.push('team leader <b>'+esc(S.ui.team)+'</b>');
  if(S.ui.camp) on.push('campaign <b>'+esc(S.ui.camp)+'</b>');
  (extra||[]).forEach(x=>on.push(x));
  if(!on.length) return `<div class="card"><div class="empty"><div class="big">No rows in this period</div>
    The period holds ${fmtNum(total)} agent-day row(s), but none match this view.</div></div>`;
  return `<div class="card"><div class="empty"><div class="big">Nothing matches the current filters</div>
    <p style="margin:6px 0 0">The period holds <b>${fmtNum(total)}</b> agent-day row(s); the filter on ${on.join(' and ')} removes them all.
    ${S.ui.team?'A leader can sit on the Agent List and still have no rows here — history attributes each day to the leader it was worked under, so a newly-labelled team shows nothing until days are worked under it.':''}</p>
    <p style="margin:10px 0 0"><button class="btn small primary" onclick="__clearFilters()">Clear filters</button></p></div></div>`;
}
const vtHidden=code=>M&&M.primaryCamp[code]==='VT';
function filteredAgents(){
  if(!M) return [];
  return M.agents.filter(a=>{
    const rows=M.byAgentDay[a.code]||[];
    return rows.some(gFilter);
  });
}

const PAGES={};
function renderPage(){
  const el=$('#view');
  const fn=PAGES[S.ui.tab]||PAGES.dashboard;
  // skeleton flash for perceived smoothness
  el.innerHTML=`<div class="grid kpis">${Array(4).fill('<div class="skel" style="height:118px"></div>').join('')}</div>
    <div class="grid cols2 mt"><div class="skel" style="height:300px"></div><div class="skel" style="height:300px"></div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.animation='none'; el.offsetHeight; el.style.animation='';
    el.innerHTML=fn();
    if(PAGES['_wire_'+S.ui.tab]) PAGES['_wire_'+S.ui.tab]();
  }));

/* "No data" and "not loaded yet" are different answers and must never share a screen.
   Supabase is the store; localStorage is a cache that a month of uploads overflows, so on a
   full-cache device the app starts EMPTY and depends entirely on hydrate() pulling the state
   back. hydrate() needs a session token, and sessionStorage is per-tab — so a fresh tab, or
   one whose session lapsed, showed "No data for 2026-08 yet" over a database holding 25 files.
   That reads as data loss and it is not. Until hydrate has resolved, say so. */
function emptyState(){
  /* Only a COLD start is "loading". If this device already holds sources, render what we have
     — gating on the hydrate flag alone hid a working 25-file state behind a spinner whenever
     hydrate had not resolved (no session token in this tab, slow network), which is worse than
     the stale-data problem it was meant to replace. */
  const haveAny=((S.files||[]).length>0)||Object.keys(S.sales||{}).length>0||Object.keys(S.calls||{}).length>0;
  if(!haveAny&&!window.__vasHydrated){
    const signedIn=!!sessionStorage.getItem('cbx_token');
    return `<div class="card"><div class="empty"><div class="big">Loading your data from Supabase…</div>`
      +(signedIn
        ? `Your uploads live in the database, not on this device. This takes a moment on a slow connection.`
        : `<b>You are not signed in on this tab.</b> Sign in and the data loads automatically — nothing has been lost.`)
      +`</div></div>`;
  }
  return `<div class="card"><div class="empty"><div class="big">No data for ${S.ui.month} yet</div>
    Upload the day's exports in <a class="linky" onclick="go('data')">Data &amp; Uploads</a> — money (Power BI - Active Cases), call records, attendance and QA evaluations.</div></div>`;
}

PAGES.manual=()=>`<div class="card vasguide" style="max-width:900px" id="manualCard">
<h2>1 · Read the colours first</h2>
<p>Every KPI card and status dot uses one traffic-light system. Learn it once and you can read any page at a glance:</p>
<ul>
<li><b style="color:#34D399">GREEN</b> — on target. The metric is at or better than its goal.</li>
<li><b style="color:#FBBF24">AMBER</b> — watch. Slipping toward a problem; keep an eye on it.</li>
<li><b style="color:#FB7185">RED</b> — act. Below target; it needs an owner and an action today.</li>
<li><b style="color:#8296B5">GREY</b> — informational, no target set.</li>
</ul>
<p>Each KPI shows its <b>value</b>, its <b>target</b> (e.g. "target ≥ 90%"), a trend arrow versus the previous period, and a mini-sparkline. Click any KPI for its full definition and what to do when it turns red.</p>

<h2>2 · The rules behind the scores (NBA v3.0)</h2>
<p>Agents are scored by The Chatterbox NBA Scoring Framework. You do not calculate anything — the system does — but knowing the rules tells you <i>why</i> an agent is flagged.</p>

<h3>The Two-Check Sales Rule</h3>
<p><b>Value is always checked before Volume.</b> Check 1 (Value): GWP per sale ≥ R99. Check 2 (Volume): daily sales vs the agent's tenure target. A high sales count at low value still fails — because it costs the business on every policy.</p>
<table class="tbl"><thead><tr><th>Value</th><th>Volume</th><th>Status → coach on</th></tr></thead><tbody>
<tr><td>PASS</td><td>PASS</td><td>On Target → stretch goals</td></tr>
<tr><td>FAIL</td><td>PASS</td><td>Value Issue → product mix & upselling</td></tr>
<tr><td>PASS</td><td>FAIL</td><td>Volume Issue → activity, pipeline, closing</td></tr>
<tr><td>FAIL</td><td>FAIL</td><td>Both → value coaching takes priority</td></tr>
</tbody></table>
<p>Tenure daily-sales targets: <b>M1 = 3, M2 = 4, EXP-Courtesy = 5, EXP-Cuddle = 8</b>. GWP/sale value target is R99 VAT-inclusive = <b>R86.09 ex-VAT</b>; all GWP figures on these pages are shown <b>ex-VAT</b>, the basis the agent is commissioned on. Agents are only ever compared with peers at the same tenure.</p>

<h3>The Decision Ladder — one action per agent</h3>
<p>Rules are checked top-to-bottom; the <b>first one that triggers is the agent's single Next Best Action</b>. Most serious always wins.</p>
<ul>
<li><b style="color:#FB7185">Level 1 · Protect the Business</b> — R1 Zero Attendance · R2 Critical QA (&lt;80%) · R2A-3 Critical Compliance · R3 Attendance Risk (&lt;80%).</li>
<li><b style="color:#FBBF24">Level 2 · Protect the Revenue</b> — R2A-2 Compliance Risk · R4 GWP Value Failure (&lt;R99) · R4A Critical Sales-Volume · R5 Moderate QA (80–89%) · R6 Low Sales (70–89%).</li>
<li><b style="color:#3D9BFF">Level 3 · Improve the Skill</b> — R7 Conversion below target · R8 Talk Time (&lt;150 min/day) · R2A-1 Compliance Note (logged only).</li>
<li><b style="color:#34D399">Level 4 · Develop & Recognise</b> — R9 Developing (90–99%) · R10 Strong/Elite (meets all targets).</li>
</ul>

<h3>Graduated Critical-Fail (R2A)</h3>
<p>Critical Fail Rate (CFR) = critical fails ÷ audited calls. The tier is the <b>higher</b> of the count band and the rate band, and the penalty is <b>capped at −10</b>:</p>
<table class="tbl"><thead><tr><th>Tier</th><th>Trigger</th><th>Composite</th><th>Elite</th></tr></thead><tbody>
<tr><td>R2A-3</td><td>≥4 fails OR CFR ≥30%</td><td>−10</td><td>Blocked</td></tr>
<tr><td>R2A-2</td><td>2–3 fails OR CFR 10–&lt;30%</td><td>−5</td><td>Blocked</td></tr>
<tr><td>R2A-1</td><td>exactly 1 fail AND CFR &lt;10%</td><td>−2</td><td>Retained (a note, never a primary NBA)</td></tr>
</tbody></table>

<h3>The Composite Score (/100)</h3>
<p>Seven weighted metrics sum to 100, then the capped critical-fail penalty is applied and reported as <b>'Adj'</b>: Avg GWP/Sale <b>25</b>, Target Achievement <b>20</b>, QA <b>20</b>, Total GWP percentile <b>15</b>, Conversion <b>10</b>, Talk Time <b>5</b>, Attendance <b>5</b>. Cancellations and attempts-per-lead are diagnostics — they are never scored.</p>

<h2>3 · How to use the software</h2>
<ol>
<li><b>Check Data Trust first.</b> The bar at the top of the page shows every source's freshness — green is fresh, amber/red is stale. A beautiful chart on stale data is a confident wrong answer, so always read the trust bar before the numbers.</li>
<li><b>Upload your exports</b> in the Upload Station. The type is detected from the headers; rejected rows are logged with reasons, never silently dropped.</li>
<li><b>Filter and set the date range</b> in the top bar — every KPI, chart and table re-window to your selection.</li>
<li><b>Click any agent's name</b> (on any table or chart) to open their full card — framework score, the primary NBA, the composite breakdown, graphs, peer comparison, and an AI coaching analysis of what to improve.</li>
<li><b>Ask AgentOS</b> — the chat bubble in the bottom-right answers questions about the numbers on screen, the framework, and the business. It never invents figures.</li>
</ol>

<h2>4 · The weekly rhythm</h2>
<p><b>Daily</b> the system assigns one NBA per agent. <b>Every Monday</b> the Team Leader confirms the data and sets owners and due dates. <b>During the week</b> the coaching happens. <b>At the next review</b> — clear the NBA if resolved, escalate if not. If a red number has no owned action, the system has failed.</p>
</div>`;

  else{ push(1); if(p>3) pageBtns.push('<span class="lab">…</span>');
    for(let i=Math.max(2,p-1);i<=Math.min(pages-1,p+1);i++) push(i);
    if(p<pages-2) pageBtns.push('<span class="lab">…</span>'); push(pages); }
  return `
  <div class="card" style="padding-bottom:12px"><div class="cardhead">
    <div><h3>Agents performance overview</h3><div class="sub">period metrics for all agents</div></div>
    <div class="spacer"></div>
    <input type="search" placeholder="Search agents…" value="${esc(S.ui.dashQ||'')}" oninput="dashQ(this.value)"
      style="background:var(--glass);border:1px solid var(--stroke);border-radius:11px;padding:6px 12px;outline:none;color:var(--ink)">

/* Talk time reads 0:00:00 whenever no dialler file covers a day, which on screen is
   indistinguishable from an agent who genuinely never dialled — and that is exactly how an
   MTD came to disagree with the hand-built tracker. Name the missing days instead. */
function diallerWarning(){
  if(!M) return '';
  const out=[];
  /* TALK TIME CREDITED TO NOBODY. A login the Agent List does not know is not a rounding
     error — it is an agent's whole day missing from their record, and from every average
     that divides by shifts. Team leaders and system logins are separated out because they
     are correct exclusions; what is left is a data fix worth doing. */
  if(M.unmatched){
    const rows=Object.entries(M.unmatched).filter(([,u])=>u.src==='calls'&&(u.talk||0)>0&&u.kind!=='system login');
    const missing=rows.filter(([,u])=>u.kind!=='team leader').sort((a,b)=>b[1].talk-a[1].talk);
    const tls=rows.filter(([,u])=>u.kind==='team leader');
    const hrs=a=>fmtDur(a.reduce((t,[,u])=>t+u.talk,0));
    if(missing.length) out.push('<b>'+hrs(missing)+' of talk belongs to '+missing.length+
      ' dialler login(s) the Agent List does not know</b>, so it is in nobody’s record'
      + ' average that divides by shifts is understated: '
      +missing.slice(0,6).map(([k,u])=>esc(k)+' ('+fmtDur(u.talk)+')').join(', ')
      +(missing.length>6?' +'+(missing.length-6)+' more':'')
      +'. Add them to the Agent List and this resolves itself on the next rebuild.');
    if(tls.length) out.push('<b>'+hrs(tls)+' of talk is a team leader dialling</b> ('
      +tls.map(([k])=>esc(k)).join(', ')+') — correctly kept out of agent rows.');
  }
  if(M.noDialler && M.noDialler.length){
    const d=M.noDialler;
    out.push('<b>No dialler data for '+d.length+' working day'+(d.length>1?'s':'')+'</b> ('
      +d.map(x=>esc(x)).join(', ')+'). Talk time shows 0:00:00 on those days, and every average '
      +'that divides by shifts is understated. Upload the Call Records / ViciDial exports covering them.');
  }
  if(M.viciSkipped && M.viciSkipped.length){
    out.push('<b>A ViciDial export could not be counted.</b> '
      +M.viciSkipped.map(v=>esc(v.from)+' → '+esc(v.to)+' ('+v.n+' agents)').join('; ')
      +' — it holds one total per agent across those days, and the selected period covers none of '
      +'them, so its talk belongs entirely outside this view. Widen the period to include the range.');
  }
  /* The period covers PART of a range: the talk is apportioned by shifts worked inside the
     window and marked provisional. The design promised the screen would say so ("marked
     provisional so the screen can say it is apportioned rather than measured") — this is
     that sentence, previously computed and never rendered. */
  if(M.viciPartial && M.viciPartial.length){
    out.push('<b>A ViciDial export reaches beyond the period.</b> '
      +M.viciPartial.map(v=>esc(v.from)+' → '+esc(v.to)+' ('+v.covered+' of '+v.of+' days inside the period)').join('; ')
      +' — it holds one total per agent across the whole range, so each agent\'s talk is '
      +'apportioned by the shifts they worked inside the period, and is provisional rather than '
      +'measured. Export ViciDial one day at a time for exact daily talk.');
  }
  if(!out.length) return '';
  return '<div class="card mt" style="border-left:3px solid var(--amber)">'
    +'<div class="cardhead"><div><h3>Talk time is incomplete for this period</h3>'
    +'<div class="sub">the figures below are correct for the data loaded — the data is missing days</div>'
    +'</div></div>'
    +out.map(t=>'<p class="note" style="max-width:none">'+t+'</p>').join('')
    +'</div>';
}
/* RAGGED COVERAGE. The single most common reason a figure here disagrees with a hand-built
   tracker: the sources end on different days, the period silently stretches to the furthest
   one, and every shift-derived column reads a whole day high. Said out loud, next to the
   numbers, with the fix one click away. Silent while the sources line up. */
function coverageNote(){
  if(!M||!M.dates.length||S.ui.asAt) return '';
  const e=sourceEnds();
  const have=Object.entries(e).filter(([,v])=>v);
  if(have.length<2) return '';
  const ends=[...new Set(have.map(([,v])=>v))];
  if(ends.length<2) return '';
  const last=ends.sort()[ends.length-1], first=ends[0];
  if(last<=M.range.from||first>=M.range.to) return '';
  return '<div class="card mt" style="border-left:3px solid var(--amber)">'
    +'<div class="cardhead"><div><h3>Your sources end on different days</h3>'
    +'<div class="sub">'+have.map(([k,v])=>esc(k)+' to <b>'+esc(fmtDay(v))+'</b>').join(' · ')
    +'</div></div></div><p class="note" style="max-width:none">This period runs to <b>'+esc(M.range.to)
    +'</b> and counts <b>'+M.diallingDays+' dialling day'+(M.diallingDays===1?'':'s')+'</b>. A tracker cut on '
    +'an earlier day will show fewer Employed Shifts, and a smaller Sales Target, GWP Target, Att % and SPD '
    +'with it — the same numbers over a different number of days, not a disagreement. To line the two up, '
    +'set <b>as at</b> in the toolbar to the day the tracker was cut.</p></div>';
}
function agentRows(camp, week){

  if(!M) return [];
  const src=week?((M.wtdCC[week]||{})[camp]||{}):M.mtdCC[camp];
  const roleOf={}; S.roster.forEach(a=>roleOf[a.code]=a.role||'');
  const rows=Object.values(src||{}).map(g=>({...g, prov:g.prov>0, role:roleOf[g.code]||''}));
  rows.sort((x,y)=>(y.spd||0)-(x.spd||0));
  return rows;
}
function totalRow(rows,label){
  const t={tl:label,tenure:'',agent:'',emp:0,act:0,target:0,sales:0,gwp:0,gwpT:0,talk:0,opt:0,ref:0,canc:0,calls:0,ans:0,empDial:0,qa:null};
  /* QA IS THE ONE COLUMN THAT IS AVERAGED, NOT SUMMED. Every other ratio on this row is
     recomputed from the summed numerator and denominator below (spec §8) — QA cannot be,
     because there is no numerator to sum: the workbook's total is literally
     =AVERAGE(U4:U{last}), the mean of the AGENT averages, with agents who have no
     evaluation ("No QA %") dropped from the denominator rather than scored zero.
     So this is an unweighted mean of agent means: an agent with one evaluation counts the
     same as one with twenty. qn is carried for display only ("n evaluations"). */
  let qs=0,qn=0,qa=0;
  for(const r of rows){ t.emp+=r.emp;t.act+=r.act;t.target+=r.target;t.sales+=r.sales;t.gwp+=r.gwp;t.gwpT+=r.gwpT;
    t.talk+=r.talk;t.opt+=r.opt;t.ref+=r.ref;t.canc+=r.canc;t.calls+=(r.calls||0);t.ans+=(r.ans||0);
    t.empDial+=(r.empDial||0); if(r.qa){qs+=r.qa.avg;qa++;qn+=r.qa.n;} }
  t.att=t.emp?t.act/t.emp:null;t.pctT=t.target?t.sales/t.target:null;t.spd=t.act?t.sales/t.act:0;
  t.pctG=t.gwpT?t.gwp/t.gwpT:null;t.aveG=t.sales?t.gwp/t.sales:null;
  // both talk figures recomputed from the summed seconds and the summed shifts, never by
  // averaging the agent rows — same rule as every other ratio on this row
  t.aveTalk=t.emp?t.talk/t.emp:null;
  t.talkPerWorked=t.act?t.talk/t.act:null;
  t.optPct=t.sales?t.opt/t.sales:null;t.refPct=t.sales?t.ref/t.sales:null;t.cancPct=t.sales?t.canc/t.sales:null;
  t.aht=t.ans?t.talk/t.ans:null;
  t.qa=qa?{avg:qs/qa,n:qn,agents:qa}:null;
  return t;
}
function groupByTL(rows){
  const byTL={}; rows.forEach(r=>{(byTL[r.tl]=byTL[r.tl]||[]).push(r);});
  const out=[]; for(const tl of Object.keys(byTL).sort()){ out.push(...byTL[tl], Object.assign(totalRow(byTL[tl],tl+' Total'),{_sub:1})); }
  return out;
}
function campSection(camp,week,opts){
  opts=opts||{}; if(camp==='VT') opts={...opts,vt:true,canc:false};
  let rows=agentRows(camp,week); if(!rows.length) return '';
  /* the header's Team filter applies here too (2026-09-07) — the page used to offer only its
     own campaign chips and ignore the global Team, so choosing a leader changed nothing */
  if(opts.team){ rows=rows.filter(r=>r.tl===opts.team); if(!rows.length) return ''; }
  if(camp==='Courtesy') rows=groupByTL(rows);
  const tot=Object.assign(totalRow(rows.filter(r=>!r._sub),'Grand Total'),{_tot:1});
  return tableHTML(aggCols(opts),[...rows,tot],r=>r._tot?'total':(r._sub?'subtotal':''));
}

/* ================= LEAD MANAGEMENT =================
   Moved from Ops Analytics 2026-08-18 (Nick: "move lead allocation and lead management to
   vas analytics, do not change the formula"). Every formula below is ported VERBATIM from
   Chatterbox_AgentOS_Analytics.html — the arithmetic, the rounding, the RAG bands and the
   dedupe rules are byte-for-byte the Ops originals. What changed is only the plumbing
   underneath, because the two apps have different data models by design:
     Ops                          → VAS (here)
     state.facts.SF_OPEN_CASES    → S.opencasesLM.rows    (snapshot, one row per Case Number)
     state.facts.SF_CLOSED_CASES  → S.closedcases.rows    (accumulates, keyed on Case Number)
     cbOfOwner(name)              → resolveKey(name)      (the Agent List IS the identity base)
     state.cbInfo[cb]             → IDX.byCode[cb]
     accountPremiums / cancelPremiums → S.sales / S.cancRows (the money model already here)
     CALLX_CALL_RECORDS dialDays  → S.calls
     ATTENDANCE present           → S.att + attWeight
   LEAD ALLOCATION WAS REMOVED 2026-08-27 (Nick: "remove lead allocation from vas and from
   the upload station remove lead allocation open cases"). Its page, its Upload Station slot
   and its own open-cases book (S.opencases) are gone; Lead Management keeps its OWN pulls
   (opencasesLM + closedcases) and never borrows. A plain Salesforce Open Cases file that is
   not declared for Lead Management (slot or filename) is refused with a message, so the
   retired Allocation pull cannot silently land anywhere. */
const LEAD_STATUS_CANON=['1st attempt','2nd attempt','3rd attempt','4th attempt','5th attempt','New','In Progress','Escalated'];
function canonLeadStatus(s){const n=String(s==null?'':s).replace(/\s+/g,' ').trim();
  return LEAD_STATUS_CANON.find(c=>c.toLowerCase()===n.toLowerCase())||(n||'(blank)')}
function leadStatusCols(agents,cap){
  const present=new Set();agents.forEach(a=>Object.keys(a.sts||{}).forEach(k=>present.add(k)));
  const cols=[...LEAD_STATUS_CANON,...[...present].filter(c=>!LEAD_STATUS_CANON.includes(c)).sort()];
  return cap?cols.slice(0,cap):cols;
}
const LEAD_AGE_MAX_H=5*365*24;       // ~5 years — beyond this an 'age' is a defect, not a lead
function leadRoster(all){
  if(!IDX) buildIndex();
  const A={};
  for(const a of S.roster){
    if(a.campaign==='VT') continue;                       // VAS view: Cuddle + Courtesy + Nesting
    /* `all` IGNORES THE VIEW FILTERS. The chips on this tab are one person's view of
       the book, and S.ui is a SHARED blob — so a digest built through them would
       publish whatever campaign whoever last had PULSE open happened to be looking
       at, to the whole floor. The publisher asks for the unfiltered book. */
    if(!all&&S.ui.camp&&a.campaign!==S.ui.camp) continue;
    if(!all&&S.ui.team&&a.tl!==S.ui.team) continue;
    A[a.code]={cb:a.code,name:a.sf||a.name||a.code,tl:a.tl||'(unassigned)',camp:a.campaign,
      ten:a.tenure||'—',sts:{},n:0,ageSum:0,ageN:0,ageMax:null,seen:new Set(),
      open:0,cl:0,nofb:0,tc:0,sales:0,canc:0,leads:new Set(),seenO:new Set(),seenC:new Set(),dialDays:new Set()};
  }
  return A;
}
var __leadsCache=null, __leadsCacheAll=null;   // keyed on the model, so a rebuild clears them

/* THE LEAD MANAGEMENT BOOK, WALKED ONCE PER STATE (perf audit, 2026-08-28).
   The two books hold 26,086 open and 37,623 closed rows on the live state and every
   one was re-read — a resolveKey() each, 67,498 calls — on every paint of the Lead
   Management tab: opening it, changing a chip, sorting a column. 892 ms of pure
   JavaScript before a pixel moved. Nothing in the walk depends on anything but the
   books, the period and the filter, so it is cached against the model: M is a NEW
   object after any rebuild, so a stale cache cannot outlive its data.

   EXTRACTED FROM PAGES.leads (2026-08-30) so the agent digest can publish the unique
   lead count without a second, differently-written walk. `all` skips the view filters
   and caches separately — the publisher must never inherit one person's campaign chip. */
function leadBook(all){
  const oc=S.opencasesLM;
  const range=periodRange()||{from:'0000',to:'9999'};
  const camp=all?'':(S.ui.camp||''), team=all?'':(S.ui.team||'');
  const key=[range.from,range.to,camp,team,
    (oc?oc.rows.length:0),Object.keys(((S.closedcases||{}).rows)||{}).length].join('|');
  /* M must be truthy for a hit: with no period there is no model, and null===null
     would otherwise let one degenerate render's answer stand for every later one. */
  const slot=all?__leadsCacheAll:__leadsCache;
  if(M&&slot&&slot.m===M&&slot.k===key) return slot;
  const A=leadRoster(all);
  let unOpen=0,unClosed=0;
  for(const r of (oc?oc.rows:[])){
    const cb=resolveKey(r.owner);if(!cb||!A[cb]){if(!cb)unOpen++;continue}
    const a=A[cb];const k=String(r.k||'').trim();
    if(k){if(a.seenO.has(k))continue;a.seenO.add(k)}       // one row per case
    const st=canonLeadStatus(r.status);a.open++;if(k)a.leads.add(k);a.sts[st]=(a.sts[st]||0)+1;
  }
  for(const k in ((S.closedcases||{}).rows||{})){
    const r=S.closedcases.rows[k];
    if(r.d<range.from||r.d>range.to) continue;
    const cb=resolveKey(r.owner);if(!cb||!A[cb]){if(!cb)unClosed++;continue}
    const a=A[cb];
    if(a.seenC.has(k))continue;a.seenC.add(k);
    a.tc++;a.leads.add(k);const st=String(r.status||'').toLowerCase();
    if(st.includes('no feedback'))a.nofb++;else a.cl++;
  }
  // sales + cancellations come from the money model already in this app (one source, never two)
  for(const d in S.sales){ if(d<range.from||d>range.to) continue;
    for(const ow in S.sales[d]){ const cb=resolveKey(ow); if(cb&&A[cb]) A[cb].sales+=S.sales[d][ow].n||0; } }
  for(const k in (S.cancRows||{})){ const r=S.cancRows[k];
    if(!r||r.d<range.from||r.d>range.to) continue;
    const cb=resolveKey(r.owner); if(cb&&A[cb]) A[cb].canc++; }
  for(const d in S.calls){ if(d<range.from||d>range.to) continue;
    for(const u in S.calls[d]){ const cb=resolveKey(u); if(cb&&A[cb]&&(S.calls[d][u].talk||0)>0) A[cb].dialDays.add(d); } }
  const out={m:M,k:key,A:A,unOpen:unOpen,unClosed:unClosed,range:range};
  if(all) __leadsCacheAll=out; else __leadsCache=out;
  return out;
}

      return (rank[vrRowStat(b)]-rank[vrRowStat(a)])||(Math.abs(b.salesVar||0)-Math.abs(a.salesVar||0));

    }).join('');
    return `<div class="card mt"><div class="cardhead"><div><h3>${fmtDay(d)} <span class="sub" style="display:inline">· ${d}</span></h3>
      <div class="sub">${dr.length} agent(s)${(S.ui.varOnly&&(fullByDay[d]||0)>dr.length)?` of ${fullByDay[d]} · <b style="color:var(--amber)">variances only is ON — ${fullByDay[d]-dr.length} agent(s) with an exact day are hidden</b> · <a class="linky" onclick="S.ui.varOnly=false;saveUI();renderPage()">show all agents</a>`:''}${meta.skew?' · <b style="color:var(--amber)">snapshot skew — variances indeterminate (RC1)</b>':''}${cov.length?' · no coverage: '+cov.join(', '):''}</div>
      ${dayNotes.length?`<div class="sub" style="color:var(--amber);margin-top:4px">${dayNotes.map(esc).join(' · ')}</div>`:''}</div></div>
      <div class="tablewrap"><table class="data"><thead><tr>
        <th class="l">TL</th><th class="l">Agent</th><th class="l">Campaign</th><th title="Sale dispositions from the dialler that covers the agent’s floor: ViciDial for Cuddle, CallX call recordings for Courtesy — one column, the right source per campaign.">Total Dialer Sales</th><th>VAS Tracker</th><th>Sales Force</th><th title="Salesforce − VAS Tracker, sales (DV01 as stored)">Variance (SF vs VAS Tracker)</th><th title="Salesforce − dialler sale dispositions (ViciDial for Cuddle, CallX for Courtesy). Informational, like the dialler count itself — no tolerance band in the spec. Dash when the dialler cannot answer for this agent-day.">Variance (SF vs Dialer)</th><th title="Salesforce GWP (DV02 verdict still colours Status)">Total GWP</th><th>Ave GWP</th><th class="l" title="Click a cell to add or edit — saved with the data, synced to every device">Comments</th><th class="l">Flags</th><th>Status</th><th class="l">Root cause</th>
      </tr></thead><tbody>${trs}</tbody></table></div></div>`;

}

  const rc=`<div class="card mt"><div class="cardhead"><div><h3>Root-cause taxonomy</h3>
    <div class="sub">every variance must be classified — an unclassified variance is an open defect, not a result</div></div></div>
    <div class="tablewrap" style="border:none"><table class="data"><thead><tr><th class="l">Code</th><th class="l">Name</th><th class="l">Signature / test</th><th class="l">Resolution</th></tr></thead>
    <tbody>${Object.entries(VARIANCE_RULES.rootCauses).map(([k,v])=>`<tr><td class="l"><code>${k}</code></td><td class="l"><b>${esc(v.name)}</b></td><td class="l">${esc(v.sig)}</td><td class="l">${esc(v.fix)}</td></tr>`).join('')}</tbody></table></div></div>`;

  return comp+dcov+tol+rc+conflicts+engRec;

window.__vrAudit=i=>{
  const VR=window.__vr; if(!VR||!VR.rows[i]) return;

  const pct=(v,b)=>(v==null||!b)?'–':fmtPct(v/b,1);
  const rcSel=metric=>{
    const cur=metric==='sales'?r.rcSales:r.rcGwp;
    const key=r.d+'|'+r.code+'|'+metric;
    return `<select onchange="__vrSetRC('${key}',this.value)" style="max-width:220px">
      <option value="">— unclassified —</option>
      ${Object.entries(VARIANCE_RULES.rootCauses).map(([k,v])=>`<option value="${k}" ${cur===k?'selected':''}>${k} — ${esc(v.name)}</option>`).join('')}</select>`;
  };
  const dvRow=(dv,name,fA,fB,a,b,v,verdict,tol,rcHtml)=>`
    <tr class="subtotal"><td class="l" colspan="2"><b><code>${dv}</code> ${name}</b></td></tr>
    <tr><td class="l">Formula A</td><td class="l"><code>${esc(fA)}</code></td></tr>
    <tr><td class="l">Formula B</td><td class="l"><code>${esc(fB)}</code></td></tr>
    <tr><td class="l">System A (Salesforce)</td><td>${a==null?'– (blocked)':fmtNum(a)}</td></tr>

    <tr><td class="l">Variance (A − B)</td><td>${v==null?'– (null, never zero)':(v>0?'+':'')+fmtNum(v)}</td></tr>
    <tr><td class="l">Variance %</td><td>${pct(v,b)}</td></tr>
    <tr><td class="l">Tolerance</td><td>±${tol}</td></tr>
    <tr><td class="l">Verdict</td><td>${vrStatusPill(verdict)}</td></tr>
    <tr><td class="l">Root cause</td><td class="l">${rcHtml}</td></tr>`;

    <div class="sub">${campChip(r.camp)} · TL ${esc(r.tl||'–')}${r.skew?' · <b style="color:var(--amber)">snapshot skew day</b>':''}</div></div>

    <tr><td class="l" style="color:var(--muted)">Inputs</td><td class="l" style="color:var(--muted)">${r.accts} distinct case(s)${r.chargeSum!=null?' · Σ Charge Amount (ex-VAT) R '+fmtNum(r.chargeSum,2):''}</td></tr>
    ${dvRow('DV02','GWP variance',c2.formulaA,c2.formulaB,r.sfGwp,r.bdGwp,r.gwpVar,r.v.gwp,VARIANCE_RULES.gwpTolerance,rcSel('gwp'))}
    <tr class="subtotal"><td class="l" colspan="2"><b><code>DV03</code> Activity variance — flag rather than subtract</b></td></tr>
    <tr><td class="l">Talk time</td><td>${r.talk!=null?fmtDur(r.talk):(r.talkEst!=null?'~'+fmtDur(r.talkEst)+' (ESTIMATE — allocated evenly from a period-aggregated ViciDial export)':'– (dialler coverage missing)')}${r.talkAdj?' · dialled '+fmtDur(r.talkAdj.talk)+' on '+r.talkAdj.d:''}</td></tr>
    <tr><td class="l">Dialler sales (dispositions)</td><td>${r.dlSales!=null?fmtNum(r.dlSales):'– (dialler coverage missing)'}</td></tr>
    <tr><td class="l">Attendance</td><td class="l">${r.att!=null?esc(String(r.att))+(r.present?' (Present)':''):'– (no register row)'}</td></tr>
    <tr><td class="l">Flags</td><td class="l">${r.flags.length?r.flags.map(f=>`<span class="pill ${f.sev==='error'?'pcrit':f.sev==='warning'?'pwarn':'pmuted'}">${esc(f.f)}</span>`).join(' '):'none'}</td></tr>
    <tr class="subtotal"><td class="l" colspan="2"><b><code>DV04</code> Referrals variance — BLOCKED</b></td></tr>
    <tr><td class="l">Agent logged (board AG)</td><td>${r.bdRef!=null?fmtNum(r.bdRef):'–'}</td></tr>

/* export — the workbook mirrors spec output_structure; every cell is a computed VALUE
   (never a formula), so VR10's cached-value requirement is satisfied structurally, and
   the exported figures are the SAME buildVariance() rows the screen shows. */
function exportVariance(){
  const VR=window.__vr||buildVariance(periodRange());
  if(!VR.range){ toast('Nothing to export yet'); return; }
  if(typeof XLSX==='undefined'||!XLSX.writeFile){ toast('Spreadsheet library not loaded - refresh and retry'); return; }
  const rows=vrFilterRows(VR);
  const wb=XLSX.utils.book_new();
  const H=VR.header;
  /* THE SUMMARY MUST DESCRIBE THE ROWS IN THE WORKBOOK (audit, 2026-08-28). The Daily sheet
     is filtered (campaign / team / variances-only) while this header came from VR.header,
     which is built over EVERY row — so an export filtered to Cuddle said "Agents compared
     84" above 12 rows, and the toast claimed the values match the screen. The counts are now
     derived from the exported rows, and the sheet says plainly when a filter is on. */
  const fCodes=new Set(rows.map(r=>r.code));
  const fSum={exact:0,within_tolerance:0,material:0,blocked:0,indeterminate:0};
  for(const r of rows){ const k=r.status||r.flag; if(fSum[k]!=null) fSum[k]++; }
  const filterOn=!!(S.ui.camp||S.ui.team||S.ui.varOnly);
  const sm=[['VAS Variance Report — daily system variance (artefact A)'],[],
    ...(filterOn?[['FILTERED VIEW','campaign '+(S.ui.camp||'all')+' · team '+(S.ui.team||'all')+(S.ui.varOnly?' · variances only':'')+
      ' — the figures below describe the '+fmtNum(rows.length)+' exported row(s), not the whole period'],[]]:[]),
    ['Period',H.reporting_period.start+' → '+H.reporting_period.end],['Dialling days',H.reporting_period.dialing_days],
    ['Built',H.build_timestamp],['Snapshot skew',H.snapshot_skew_detected?'DETECTED — affected days indeterminate (RC1)':'none'],
    ['Agents compared',filterOn?fCodes.size:H.agents_compared],
    ['Salesforce only',H.agents_source_a_only.join(', ')||'–'],['Manual Stats only',H.agents_source_b_only.join(', ')||'–'],
    ['Blocked metrics',H.metrics_blocked.join(' | ')],
    ['Variance summary',filterOn
      ?('exact '+fSum.exact+' · within tolerance '+fSum.within_tolerance+' · material '+fSum.material)
      :'exact '+H.variance_summary.exact+' · within tolerance '+H.variance_summary.within_tolerance+' · material '+H.variance_summary.material],
    ['Root causes',Object.entries(H.root_cause_counts).filter(([,n])=>n).map(([k,n])=>k+':'+n).join(' · ')||'none assigned'],
    ['Unmapped records',H.unmapped_record_count],[],
    ['Checks'],...VR.checks.map(c=>[c.id,c.ok?'pass':(c.sev==='error'?'FAIL':'note'),c.msg]),[],
    ['Source files'],...Object.entries(H.source_export_timestamps).flatMap(([k,v])=>v.length?v.map(f=>[k,f]):[[k,'not uploaded']])];
  XLSX.utils.book_append_sheet(wb,xlSheet(sm),'Summary');
  // Column order mirrors the screen (Nick, 2026-08-17): board first, then SF, then the
  // differences AS DISPLAYED — Board−SF (sign-flipped DV01/DV02) and Board−Dialler.
  const dv=[['Date','TL','Agent','Emp Code','Campaign','Total Dialer Sales','VAS Tracker','Sales Force','Variance (SF vs VAS Tracker)','Variance (SF vs Dialer)','Total GWP','Ave GWP','Comments','Flags','Status','Root Cause']];
  rows.slice().sort((a,b)=>a.d.localeCompare(b.d)||a.agent.localeCompare(b.agent)).forEach(r=>dv.push([
    r.d,r.tl,r.agent,r.code,r.camp,(r.dlSales!=null?r.dlSales:(r.dlSalesEst!=null?('~'+r.dlSalesEst):null)),r.bdSales,r.sfSales,r.salesVar,(r.sfSales!=null&&r.dlSales!=null)?r.sfSales-r.dlSales:null,r.sfGwp,(r.sfGwp!=null&&r.sfSales)?Math.round(r.sfGwp/r.sfSales*10)/10:null,(S.varComments||{})[r.d+'|'+r.code]||'',
    r.flags.map(f=>f.f).join(' | '),vrRowStat(r),[r.rcSales,r.rcGwp].filter(Boolean).join(' ')||'']));
  XLSX.utils.book_append_sheet(wb,xlSheet(dv),'Daily Variance');
  const un=[['Identity in file','Source','Records','GWP at stake','Days']];
  Object.values(VR.unmapped).forEach(u=>un.push([u.key,u.src,u.n,u.gwp||0,[...u.days].sort().join(', ')]));
  if(un.length===1) un.push(['(empty — every record resolved: an empty result is a result)']);
  XLSX.utils.book_append_sheet(wb,xlSheet(un),'Unmapped');           // VR13: present even when empty
  const bs=[['Date','Agent (as written)','Sales (stated AD)','GWP (stated AE)','Referrals (AG)','Populated Sale cells','Σ Sale cell values']];
  Object.keys(S.board).filter(d=>d>=VR.range.from&&d<=VR.range.to).sort().forEach(d=>{
    for(const k in S.board[d]){ const r=S.board[d][k]; bs.push([d,r.name,r.ts??r.sales,r.tg??r.gwp,r.ref??'',r.cells,r.cellGwp]); }});
  XLSX.utils.book_append_sheet(wb,xlSheet(bs),'Manual Stats');       // source extract, as stored
  XLSX.writeFile(wb,'VAS Variance Report '+VR.range.from+' - '+VR.range.to+'.xlsx');
  toast('Variance workbook exported — values match the screen');
}

PAGES.data=()=>{
  const typeLabel={bi:'Power BI - Active Cases',calls:'Call records — CallX (retired 1 Sep)',attendance:'Attendance',evals:'QA evaluations',
    roster:'Agent list','open cases':'Open cases — Lead Allocation (removed)','open cases (lead mgmt)':'Open cases — Lead Management','closed cases':'Closed cases (lead funnel)','tracker daily':'Tracker workbook',cancellations:'Cancellations (BI Inactive)','calls (ViciDial)':'ViciDial','vici range':'ViciDial - multi-day aggregate',referrals:'Referrals (HighLevel)',board:'Manual Stats (daily board)'};

  // per-slot status from the file registry
  /* "IT IS NOT UPDATING" — the slot used to show only what the DATA covers, so an upload that
     landed perfectly looked identical to one that never happened. (QA was the worst case
     while it filed on Date of Call — a pull that assessed only older calls added no new day
     at all; it files on Date of Assessment since 2026-08-26, which also moves the span.) The last-upload stamp is the part that answers "did mine go in?".
     `at` is written with toISOString(), i.e. UTC — read it as UTC and print it local, or a
     Durban user sees every upload timed two hours before they made it. */
  const upStamp=a=>{
    if(!a) return '';
    const d=new Date(String(a).replace(' ','T')+'Z');
    if(isNaN(d)) return esc(a);
    const t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const day=new Date(); const yday=new Date(day.getTime()-864e5);
    if(d.toDateString()===day.toDateString()) return 'today '+t;
    if(d.toDateString()===yday.toDateString()) return 'yesterday '+t;
    return d.toLocaleDateString([],{day:'2-digit',month:'short'})+' '+t;
  };
  const statFor=prefixes=>{
    const fs=S.files.filter(f=>prefixes.some(p=>f.type.startsWith(p)));
    if(!fs.length) return '<span class="pill pmuted">Nothing yet</span>';
    const dates=[...new Set(fs.flatMap(f=>f.dates))].sort();
    const last=fs[fs.length-1];
    /* Newest by upload time, not by registry position — a re-upload rewrites its entry in
       place further up the list, and "last in the array" would then name the wrong file. */
    const newest=fs.reduce((a,b)=>String(b.at||'')>String(a.at||'')?b:a,fs[0]);
    return `<span class="pill pgood">${fs.length} file${fs.length>1?'s':''}</span>
      <span>${dates.length?dates[0].slice(5)+' → '+dates[dates.length-1].slice(5)+' · '+dates.length+' day'+(dates.length>1?'s':''):esc(last.name.slice(0,26))}</span>`
      +(newest&&newest.at?`<span class="smuted" title="${esc(newest.name)} — ${esc(String(newest.rows||0))} rows${(newest.dates||[]).length?', covering '+(newest.dates||[]).length+' day(s) of calls':''}">last upload ${upStamp(newest.at)}</span>`:'');
  };
  const SLOTS=[
    {t:'bi',icon:I.money,color:'var(--accent)',name:'Power BI - Active Cases',desc:'THE money source. GWP = Σ Charge Amount per account × VAT (charges are ex-VAT); sales are unique accounts, dated by Contract Create Date, agent from Owner. Upload monthly — months accumulate and you can filter to any month.',stat:statFor(['bi','sales'])},
    /* CALL RECORDS (CallX) RETIRED 2026-09-01 (Nick: "there is no longer a need for call
       x/call records all the agents will be on vicci now"). The slot is gone; the parser
       still loads pre-cutover days (history corrections) and refuses anything on or after
       the cutover with a pointer at the ViciDial slot — same doctrine as Lead Allocation:
       a retired pull must not silently land anywhere. */
    {t:'attendance',icon:I.users,color:'var(--amber)',name:'Attendance',desc:'Attendance register export — shifts, leave, terminations. Exports cap at 1,000 rows, so pull short ranges.',stat:statFor(['attendance'])},
    {t:'evals',icon:I.shield,color:'var(--good)',name:'QA Evaluations',desc:'CallBi full evaluations export — scores, decisions and coaching categories per call.',stat:statFor(['evals'])},
    {t:'roster',icon:I.grid,color:'var(--violet)',name:'Agent List',desc:'Matrix agent list — team leaders, campaigns, tenure, daily targets, start dates. Replaces the current roster, and the assignments apply to the WHOLE current month the moment it lands.',
      stat:(()=>{const fe=S.rosterEffect;
        return `<span class="pill pgood">${S.roster.length} agents</span>`
          +(fe?`<span>as of ${esc(String(fe.asOf||''))} · applied to whole of ${esc(String(fe.asOf||'').slice(0,7))}</span>
            <span class="smuted" title="${esc(String(fe.file||''))}">${fmtNum(fe.moved)} moved · ${fmtNum(fe.fresh)} new · ${fmtNum(fe.left)} left · last upload ${esc(String(fe.at||''))}</span>`:'');})()},
    {t:'inactive',icon:I.alert,color:'var(--rose)',name:'Cancellations (BI Inactive)',desc:'Power BI Inactive export — cancelled contracts, counted per agent by Contract Deactivate Date. This is where the MTD Cancellations and % of Cancellations columns come from. Upload daily; each upload replaces the days it covers, so overlapping pulls never double-count.',stat:statFor(['cancellations'])},
    {t:'vici',icon:I.phone,color:'var(--cuddle)',name:'ViciDial — all agents',desc:'<b>The one dialler source for the whole floor since 1 Sep 2026</b> — Courtesy and Nesting included, CallX retired. Pull <b>EXPORT_CALL_REPORT</b> (tab-separated .txt) with <b>every user group ticked</b>: an unticked group doesn\'t error, its agents just read as never having dialled. One row per call, dated per call, so any date range splits across its days correctly. Talk time is every call\'s length on the agent\'s CB number; the upload says how much of it is ringing rather than talking. The older <b>Agent Performance Detail</b> is one row per agent for the range in its own "Time range:" line — export that ONE DAY AT A TIME, because a multi-day pull is a single total per agent and cannot be split across days.',stat:statFor(['calls (ViciDial)','vici range'])},
    {t:'board',icon:I.scale,color:'var(--courtesy)',name:'Manual Stats',desc:'The agent-logged daily board that feeds <b>VAS Analytics → Variance Report</b>: Agent Name + Sale 1..Sale 27 (cell value = GWP) + Total Sales / Total GWP / Referrals. <b>One day per sheet, named DD.MM</b> (e.g. 13.08) — re-uploading a day replaces exactly that day, and a workbook of historical DD.MM tabs loads each day separately. Agents match through the Agent List; unmatched names are reported on the Variance page, never guessed.',stat:statFor(['board'])},
    /* The lead book. Lead Management moved here from Ops on 2026-08-18; the Lead Allocation
       page and its own Open Cases slot were removed 2026-08-27 (Nick), so only the Lead
       Management pulls remain. Open Cases is a SNAPSHOT (replaced whole on each upload,
       because a point-in-time position cannot be merged); Closed Cases accumulates. */
    {t:'opencasesLM',icon:I.db,color:'var(--accent)',name:'Lead Management — Open Cases',desc:'The open half of the <b>Lead Management</b> funnel — the Salesforce <b>Open Cases</b> export named for Lead Management. A <b>snapshot</b>, so each upload replaces the whole book rather than merging; one row per Case Number, owners matched through the Agent List on the CB number. Open attempts, the attempt-stage pivot and the unique-lead conversion denominator all come from here; closures come from the slot below.',stat:statFor(['open cases (lead mgmt)'])},
    {t:'closedcases',icon:I.db,color:'var(--good)',name:'Lead Management — Closed Cases',desc:'Feeds <b>Lead Management</b>, together with the Open Cases book above (open attempts come from there, closures from here — one snapshot, two views, which is what keeps Total Allocated equal to Total Open). Salesforce <b>Closed Cases</b> export: total closed, no-feedback, wasted leads and conversion. Keyed on Case Number and dated on Date/Time Closed, so pulls <b>accumulate</b> instead of replacing. Note: a Salesforce .xls that is a frameset shell carries no rows and is refused rather than counted as zero.',stat:statFor(['closed cases'])},
    {t:'referrals',icon:I.grid,color:'var(--violet)',name:'Referrals (HighLevel)',desc:'Referrals pull themselves from HighLevel through the API Worker — automatically on sign-in, or <button class="btn small" onclick="event.stopPropagation();window.__hlSyncVAS&&__hlSyncVAS()" style="vertical-align:1px">⟳ Sync now</button> — and a CSV drop still works. Agents are matched THROUGH THE AGENT LIST (employee code, then the roster name index); unmatched names are counted and reported, never invented. Counts are referral blocks per contact (one referrer can carry up to five), so totals can exceed rows. While loaded, keyed referral adjustments are ignored — one source, never both.',
      /* The stat reads S.refs, the store itself — not the file registry. The API sync's
         registry entry was observed missing while the snapshot sat loaded (60 agents,
         1 Sep), and a card claiming "Nothing yet" over live data is the same lie as a
         save toast over a failed save. Registry is the fallback, never the authority. */
      stat:(()=>{const rf=S.refs,n=rf&&rf.by?Object.keys(rf.by).length:0;
        if(!n) return statFor(['referrals']);
        return `<span class="pill pgood">${fmtNum(rf.total||0)} referrals</span><span>${n} agents · ${esc(rf.f||'HighLevel')}</span>`
          +((rf.un&&Object.keys(rf.un).length)?`<span class="smuted">${Object.keys(rf.un).length} name(s) match no one on the Agent List</span>`:'');})()},
  ];
  const slotCards=SLOTS.map(s=>`
    <div class="slot" data-slot="${s.t}" tabindex="0" role="button" aria-label="Upload ${s.name}">
      <div class="shead"><span class="kic" style="--c:${s.color}">${s.icon}</span><b>${s.name}</b><span class="spacer" style="flex:1"></span><button class="btn small">Choose file</button></div>
      <div class="sdesc">${s.desc}</div>
      <div class="sstat">${s.stat}</div>
    </div>`).join('');

  const reg=S.files.length?`<div class="tablewrap" style="max-height:340px"><table class="data"><thead><tr>
      <th class="l">File</th><th class="l">Detected as</th><th class="l">Dates covered</th><th>Rows</th><th class="l">Uploaded</th><th></th></tr></thead><tbody>
    ${S.files.map((f,i)=>`<tr><td class="l">${esc(f.name)}</td><td class="l">${esc(typeLabel[f.type.split(' (')[0]]||f.type)}</td>
      <td class="l">${f.dates.length?(f.dates.length>3?f.dates[0]+' → '+f.dates[f.dates.length-1]+' ('+f.dates.length+' days)':f.dates.join(', ')):(f.hash&&f.type.startsWith('calls')?'<span class="pill pmuted" title="every day in this file was already covered more fully by another file">covered by fuller file</span>':'–')}</td>
      <td>${fmtNum(f.rows)}${f.skip?` <span class="pill pmuted" title="rows without a usable date, agent or amount — not loaded">−${fmtNum(f.skip)}</span>`:''}</td><td class="l">${f.at}</td>
      <td><button class="btn small danger" onclick="removeFile(${i})">Remove</button></td></tr>`).join('')}
    </tbody></table></div>`:'<p class="note">Nothing uploaded yet.</p>';
  let cov='';
  if(M&&M.dates.length){
    cov=`<div class="card mt"><div class="cardhead"><div><h3>Coverage</h3>
      <div class="sub">dots per day: <b style="color:var(--accent)">sales</b> · <b style="color:var(--cuddle)">calls</b> · <b style="color:var(--amber)">attendance</b> · <b style="color:var(--courtesy)">QA</b></div></div></div>
      <div class="coverage">${M.dates.map(d=>`<div class="covday"><b>${d.slice(8)}</b>${d.slice(5,7)}
        <div class="dots"><i class="${S.sales[d]?'s':''}"></i><i class="${S.calls[d]?'c':''}"></i><i class="${S.att[d]?'a':''}"></i><i class="${S.evals[d]?'q':''}"></i></div></div>`).join('')}</div></div>`;
  }
  const un=Object.entries(M?.unmatched||{});
  const unGwp=un.reduce((s,[,v])=>s+(v.gwp||0),0);
  const unHtml=un.length?`<div class="card mt"><div class="cardhead"><div><h3>Unmatched agents</h3>
    <div class="sub"><b>This activity is NOT counted in any total until mapped${unGwp?' — R'+fmtNum(unGwp)+' GWP is currently unattributed':''}.</b> Names in the uploads that don't match the agent list — upload a fresh Agent List (new starters appear here), or map them once and it sticks</div></div></div>
    <div class="tablewrap" style="max-height:300px"><table class="data"><thead><tr><th class="l">Identity in file</th><th class="l">Source</th><th>Volume</th><th class="l">Map to</th></tr></thead><tbody>
    ${un.map(([k,v])=>`<tr><td class="l"><code>${esc(k)}</code></td><td class="l">${v.src}</td><td>${v.n}${v.gwp?' · R'+fmtNum(v.gwp):''}</td>
      <td class="l"><select onchange="mapIdentity(this.dataset.k,this.value)" onfocus="fillAgentOptions(this)" data-k="${esc(k)}"><option value="">— choose —</option><option value="__ignore__">Ignore</option></select></td></tr>`).join('')}
    </tbody></table></div></div>`:'';
  return `${listAppliedBanner()}${staleGrainBanner()}<div class="page-head"><h2>Upload station</h2>
    <div class="sub">one slot per file — drop the file on its slot or click Choose file. Renamed files are fine: the type is confirmed from the file's own columns, and anything dropped on the wrong slot gets filed correctly with a heads-up.</div></div>
  <div class="slots">${slotCards}</div>
  ${largeFileCard()}
  <div class="card"><div class="cardhead"><div><h3>Uploaded files</h3></div></div>${reg}
    <p class="note" style="margin:10px 0 0">Files are recognised by their <b>content</b> — re-uploading a file that's already loaded (even renamed) is skipped automatically, so you can safely upload your whole export folder every day and only new files are added. Daily sources (sales, calls, attendance, QA) <b>append</b> — each file adds to the history as the month builds up; re-uploading the same day/month refreshes it. The <b>Agent List replaces the roster</b> — upload a fresh one as often as agents join, leave or move. Everything saves to the cloud database, and <b>removing a file here removes it from the database too</b>.</p></div>
  ${cov}${ruleChecksCard()}${unHtml}`;
};
/* THE RULE BOOK, ANSWERING BACK. Every check in spec §11, run against the model that was
   just built, printed next to the upload that built it. Failures first — a check that passes
   is not news, and a wall of green teaches people to stop reading. */
function ruleChecksCard(){
  if(!VCHK||!VCHK.length) return '';
  const fails=VCHK.filter(v=>!v.ok&&v.sev==='error'), warns=VCHK.filter(v=>!v.ok&&v.sev==='warn');
  const info=VCHK.filter(v=>v.sev==='info'), passed=VCHK.filter(v=>v.ok&&v.sev!=='info');
  const edge=fails.length?'var(--crit)':(warns.length?'var(--amber)':'var(--good)');
  const head=fails.length?fails.length+' check'+(fails.length>1?'s':'')+' failed'
    :(warns.length?warns.length+' thing'+(warns.length>1?'s':'')+' to know about':'all '+passed.length+' checks pass');
  const row=v=>`<tr><td class="l"><code>${v.id}</code></td>
    <td class="l"><span class="pill ${v.ok?'pgood':(v.sev==='error'?'pcrit':'pwarn')}">${v.ok?'pass':(v.sev==='error'?'FAIL':'note')}</span></td>
    <td class="l">${esc(v.msg)}</td></tr>`;
  const shown=[...fails,...warns,...info];
  return `<div class="card mt" style="border-left:3px solid ${edge}">
    <div class="cardhead"><div><h3>Rule checks — ${head}</h3>
    <div class="sub">VAS MTD Reporting Engine v${MTD_RULES.version} §11, re-run after every upload.
    A <b>FAIL</b> is a figure that should not be published until it is understood; a <b>note</b> is data that is provisional rather than wrong.</div></div></div>
    ${shown.length?`<div class="tablewrap"><table class="data"><thead><tr><th class="l">Check</th><th class="l">Result</th><th class="l">Detail</th></tr></thead>
      <tbody>${shown.map(row).join('')}</tbody></table></div>`:''}
    <p class="note" style="margin:10px 0 0">${passed.length} of ${VCHK.filter(v=>v.sev!=='info').length} checks pass.
    V18 (pivot cache range) and V19 (cached formula values) apply to the exported workbook, not to a live dashboard — <b>Export report</b> asserts those when it writes the file.</p></div>`;
}
/* THE LARGE-FILE DROP (Data Rake, Phase 1 — Nick, 2026-09-08: the Salesforce and Power BI case exports
   reach 500 MB). This browser cannot parse a file that size and the Worker cannot carry it, so the
   card sends the BYTES straight to Storage on a signed URL the Worker minted for exactly one object,
   then tells the Worker it is done. The runner in the cloud validates, converts and loads it into the
   lake within fifteen minutes; this card lists every large file with its status and reason. Nothing on
   this page reads a large file — the slots above stay the path for the daily drop. */
function largeFileCard(){
  return `<div class="card mt" id="largeCard"><div class="cardhead"><div><h3>Large files</h3>
      <div class="sub">For exports too big for a slot (Salesforce open or closed cases, Power BI, a ViciDial history — anything over 30 MB). The file goes straight to storage and the cloud runner loads it into the data lake; the slots above stay the daily path.</div></div>
      <div><button class="btn" id="largePick">Choose a large file</button><input type="file" id="largeInput" style="display:none"></div></div>
    <div id="largeProg" class="note" style="display:none;margin:8px 0 0"></div>
    <div id="largeList" class="note" style="margin:10px 0 0">Loading recent large uploads…</div></div>`;
}
async function largeUpload(file){
  const prog=$('#largeProg'), say=(m)=>{ prog.style.display='block'; prog.textContent=m; };
  const tk=sessionStorage.getItem('cbx_token'); const base='https://chatterbox-agentos-api.chatterbox-agentos.workers.dev';
  const hdr={'Authorization':'Bearer '+tk,'Content-Type':'application/json','X-Cbx-Client':'v5'};
  say('Preparing '+file.name+' ('+(file.size/1048576).toFixed(1)+' MB)…');
  const st=await fetch(base+'/api/upload/large/start',{method:'POST',headers:hdr,body:JSON.stringify({name:file.name,size:file.size})}).then(r=>r.json()).catch(()=>({error:'Cannot reach the server.'}));
  if(!st||!st.upload_url) return say('Could not start: '+(st&&st.error||'unknown error'));
  const status=await new Promise((res)=>{ const x=new XMLHttpRequest(); x.open('PUT',st.upload_url,true);
    x.setRequestHeader('x-upsert','true');
    x.upload.onprogress=(e)=>{ if(e.lengthComputable) say('Uploading '+file.name+' — '+Math.round(e.loaded/e.total*100)+'% of '+(e.total/1048576).toFixed(1)+' MB'); };
    x.onload=()=>res(x.status); x.onerror=()=>res(0); x.send(file); });
  if(status<200||status>=300) return say('Upload failed (HTTP '+status+'). Check the connection and try again — nothing was recorded.');
  say('Uploaded. Handing over to the runner…');
  const done=await fetch(base+'/api/upload/large/complete',{method:'POST',headers:hdr,body:JSON.stringify({id:st.id,size:file.size})}).then(r=>r.json()).catch(()=>({error:'Cannot reach the server.'}));
  say(done&&done.ok?done.message:('Could not hand over: '+(done&&done.error||'unknown error')));
  largeStatus();
}
async function largeStatus(){
  const el=$('#largeList'); if(!el) return;
  const tk=sessionStorage.getItem('cbx_token'); const base='https://chatterbox-agentos-api.chatterbox-agentos.workers.dev';
  const r=await fetch(base+'/api/upload/large/status',{headers:{'Authorization':'Bearer '+tk,'X-Cbx-Client':'v5'}}).then(r=>r.ok?r.json():null).catch(()=>null);
  if(!r) return el.textContent='Large-upload status is unavailable right now.';
  const fmtB=(b)=>b==null?'':(b/1048576).toFixed(1)+' MB'; const when=(t)=>t?new Date(t).toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg',hour12:false}).slice(0,17):'';
  const badge=(s)=>({received:'pwarn',validated:'pwarn',transforming:'pwarn',loading:'pwarn',loaded:'pok',failed:'pbad'}[s]||'pmuted');
  el.innerHTML=r.files.length?`<div class="tablewrap" style="max-height:260px"><table class="data"><thead><tr><th class="l">File</th><th class="l">Source</th><th>Status</th><th>Size</th><th>Rows</th><th class="l">Received</th><th class="l">Note</th></tr></thead><tbody>`
    +r.files.map(f=>`<tr><td class="l">${esc(f.file_name)}</td><td class="l">${esc(f.source||'—')}</td><td><span class="pill ${badge(f.status)}">${esc(f.status)}</span></td><td>${fmtB(f.bytes)}</td><td>${f.status==='loaded'?fmtNum(f.rows_loaded)+(f.rows_rejected?' <small>('+fmtNum(f.rows_rejected)+' rejected)</small>':''):(f.rows_in!=null?fmtNum(f.rows_in):'')}</td><td class="l">${when(f.received_at)}</td><td class="l">${esc(f.error||'')}</td></tr>`).join('')
    +'</tbody></table></div>':'No large files yet.';
}
PAGES['_wire_data']=()=>{
  const lp=$('#largePick'), li=$('#largeInput');
  if(lp&&li){ lp.onclick=()=>li.click(); li.onchange=()=>{ if(li.files&&li.files[0]) largeUpload(li.files[0]); li.value=''; }; largeStatus(); }
  document.querySelectorAll('.slot[data-slot]').forEach(el=>{
    const t=el.dataset.slot;
    const pick=()=>{ window.__slotExpected=t; $('#fileInput').click(); };
    el.onclick=pick;
    el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
    el.ondragover=e=>{ e.preventDefault(); el.classList.add('over'); };
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{ e.preventDefault(); el.classList.remove('over'); handleFiles(e.dataTransfer.files,t); };
  });
};
/* FILL A "MAP TO" DROPDOWN ONLY WHEN IT IS OPENED (perf, 2026-08-28). Every unmatched row
   used to render the WHOLE roster as options up front: ~92 rows x 125 agents = ~11,500
   option nodes, 640 KB of markup, and the Upload Station took over five seconds to open on
   a normal laptop — almost all of it laying out dropdowns nobody had clicked. */
window.fillAgentOptions=(sel)=>{
  if(!sel||sel.dataset.filled) return;
  sel.dataset.filled='1';
  const frag=document.createDocumentFragment();
  for(const a of S.roster){
    const o=document.createElement('option');
    o.value=a.code; o.textContent=(a.name||a.code)+' ('+a.code+')';
    frag.appendChild(o);
  }
  sel.appendChild(frag);
};
window.mapIdentity=(k,v)=>{ if(!v) return; S.map[k]=v; save(); rebuild(); renderAll();
  toast(v==='__ignore__'?'Ignored':'Mapped'); };

PAGES.adjust=()=>{
  if(!M) return emptyState();
  /* read the month key, falling back to any legacy range-keyed entries (audit, 2026-08-28) */
  const adj=Object.assign({},S.adjust[M.periodKey]||{},S.adjust[M.adjKey]||{});
  const rows=filteredAgents().map(a=>({a,c:(adj[a.code]||{}).c||0,r:(adj[a.code]||{}).r||0}));
  return `<div class="page-head"><h2>Adjustments</h2>
    <div class="sub">referrals for ${S.ui.month}${S.refs&&S.refs.by?' — <b>referrals now come from the Referrals (HighLevel) upload</b> ('+(S.refs.total||0)+' across '+Object.keys(S.refs.by).length+' agents), so anything keyed below is ignored for referrals — it cannot be counted twice.':' — no referrals upload loaded, so key them here (or upload the HighLevel pull in Data &amp; Uploads).'} ${Object.keys(S.cancRows||{}).length?'<b>Cancellations now come from the Cancellations (BI Inactive) upload</b>, so anything keyed below is ignored for cancellations — it cannot be counted twice.':'Cancellations are read from the Cancellations (BI Inactive) upload; key them here only until that file is uploaded.'}</div></div>
  <div class="card" style="padding:0;overflow:hidden"><div class="tablewrap" style="border:none"><table class="data"><thead><tr>
    <th class="l">Team Leader</th><th class="l">Agent</th><th class="l">Campaign</th><th>Cancellations</th><th>Referrals</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="l">${esc(r.a.tl)}</td>
    <td class="l"><span class="agentcell">${avatarOf(r.a.name,r.a.code)}<span class="nm">${esc(r.a.name)}<small>${r.a.code}</small></span></span></td>
    <td class="l">${campChip(M.primaryCamp[r.a.code]||r.a.campaign)}</td>
    <td><input type="number" min="0" class="cell" value="${r.c}" onchange="setAdj('${r.a.code}','c',this.value)"></td>
    <td><input type="number" min="0" class="cell" value="${r.r}" onchange="setAdj('${r.a.code}','r',this.value)"></td></tr>`).join('')}
  </tbody></table></div></div>`;
};
window.setAdj=(code,k,v)=>{
  /* WRITE THE MONTH KEY. Writing "from|to" meant an entry silently disappeared the next day
     and could be resurrected by the "as at" control (audit, 2026-08-28). Anything already
     stored under a legacy range key for this month is carried across on first write, so no
     existing entry is lost, and the range key is dropped so it cannot come back. */

PAGES.hubs=()=>`
  <div class="page-head"><h2>Apps</h2>
    <div class="sub">Separate apps — each opens in a new browser tab, so this dashboard stays where it is</div></div>
  <div class="grid cols2e">
    ${HUBS.map(h=>`<div class="card">
      <div class="cardhead"><div><h3>${esc(h.name)}</h3><div class="sub">${esc(h.desc)}</div></div></div>
      ${h.shot?`<a href="${esc(h.url)}" target="_blank" rel="noopener noreferrer" style="display:block;margin:2px 0 12px"><img src="${h.shot}" alt="${esc(h.name)} preview" loading="lazy" style="width:100%;height:190px;object-fit:cover;object-position:top center;border:1px solid var(--line);border-radius:10px;display:block"></a>`:''}
      <p class="note" style="margin:6px 0 14px;word-break:break-all">${esc(h.url)}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn primary" href="${esc(h.url)}" target="_blank" rel="noopener noreferrer"
           style="display:inline-flex;align-items:center;gap:8px;text-decoration:none">${I.up}<span>Open ${esc(h.name)}</span></a>
        ${h.copy?`<button class="btn" onclick="navigator.clipboard.writeText('${esc(h.url)}').then(()=>toast('Link copied — send it to your agents and team leaders'),()=>toast('Could not copy — the address is printed on the card'))">Copy link</button>`:''}
      </div>
    </div>`).join('')}
  </div>
  <p class="note" style="margin-top:14px">The KPI and Coaching hubs keep their own sign-in and their own data.

/* THE MOVEMENT REGISTER. Every organisational change the uploads have ever shown, and the
   answer to "why does last month still say Nadine when he reports to Renolan now". Only
   agents with more than one segment appear — everyone else has never moved. */
function orgHistCard(){
  const rows=[];
  for(const code of Object.keys(S.orgHist||{})){
    const h=S.orgHist[code]; if(!h||h.length<2) continue;
    const nm=(S.roster.find(a=>a.code===code)||{}).name||code;
    for(let i=1;i<h.length;i++) if(h[i].tl!==h[i-1].tl)
      rows.push({d:h[i].d,code,nm,from:h[i-1].tl,to:h[i].tl,src:h[i].src});
  }
  rows.sort((a,b)=>b.d.localeCompare(a.d)||a.nm.localeCompare(b.nm));
  const body=rows.length
    ? `<div class="tablewrap" style="max-height:300px"><table class="data"><thead><tr>
        <th class="l">Effective</th><th class="l">Agent</th><th class="l">Code</th><th class="l">From</th><th class="l">To</th><th class="l">Recorded by</th></tr></thead><tbody>
       ${rows.map(r=>`<tr><td class="l">${r.d}</td><td class="l">${esc(r.nm)}</td><td class="l">${r.code}</td>
        <td class="l">${esc(r.from||'—')}</td><td class="l">${esc(r.to||'—')}</td><td class="l">${esc(r.src||'')}</td></tr>`).join('')}
       </tbody></table></div>`
    : `<p class="note">No team-leader movements recorded yet. One is recorded the first time an Agent List assigns an agent to a different leader than the last one did.</p>`;
  return `<div class="card mt"><div class="cardhead"><div><h3>Team leader movements</h3>
    <div class="sub">${rows.length} movement${rows.length===1?'':'s'} across ${Object.keys(S.orgHist||{}).length} agents on record</div></div></div>
    <p class="note">Reports are attributed to the leader who owned the agent <b>on the day the work happened</b>. A move recorded here changes future activity only — it never rewrites a month that has already been reported.</p>
    ${body}</div>`;
}
