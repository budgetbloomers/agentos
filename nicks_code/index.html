<!-- Pulse — call centre performance platform for the Matrix VAS operation.
     Self-contained: upload the daily exports (sales, calls, attendance, QA) and it builds
     the month-to-date reporting suite. All data stays in this browser (localStorage). -->
<title>Chatterbox AgentOS · VAS Analytics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232E7CF6'/%3E%3Cstop offset='1' stop-color='%2338C6F4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='800' text-anchor='middle' fill='%2304101F'%3EC%3C/text%3E%3C/svg%3E">
<script src="/auth-gate.js"></script>
<!-- SheetJS — VAS used to read EVERY upload with `await f.text()`, so a .xlsx (a ZIP) was
     decoded as UTF-8 noise: parseCSV split the garbage into thousands of junk rows, the type
     still matched on header strings sitting readable inside the workbook XML, and every row
     then failed its date guard. Result: the file registered as "loaded" with a row count and
     stored NOTHING. Self-hosted rather than cdnjs — an ad-blocker or work network silently
     killing the CDN would take uploads down with it. -->
<script src="/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root, :root[data-theme="dark"]{
    --bg0:#050D1C; --bg1:#071A2F; --bg-glow:rgba(46,124,246,.16);
    --glass:rgba(148,182,255,.05); --glass2:rgba(148,182,255,.09); --glass3:rgba(148,182,255,.14);
    --stroke:rgba(148,182,255,.13); --stroke2:rgba(148,182,255,.25);
    --ink:#EAF1FB; --ink2:#A9BAD4; --muted:#66799B;
    --accent:#3D9BFF; --accent2:#38C6F4; --accent-grad:linear-gradient(135deg,#2E7CF6,#38C6F4);
    --on-accent:#04101F;
    --cuddle:#4C9DFF; --courtesy:#2BD9B0; --vt:#A78BFA; --violet:#A78BFA; --amber:#F5B02E; --rose:#FB7185;
    --good:#34D399; --warn:#FBBF24; --crit:#FB7185;
    --good-bg:rgba(52,211,153,.12); --warn-bg:rgba(251,191,36,.12); --crit-bg:rgba(251,113,133,.13);
    --grid-line:rgba(148,182,255,.08);
    --shadow:0 6px 24px rgba(2,8,20,.45);
    --shadow-lift:0 12px 34px rgba(2,8,20,.55);
    --r:18px; --r-sm:12px;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg0:#EDF2FA; --bg1:#F7FAFF; --bg-glow:rgba(46,124,246,.10);
    --glass:rgba(255,255,255,.72); --glass2:rgba(46,124,246,.06); --glass3:rgba(46,124,246,.12);
    --stroke:rgba(23,58,110,.13); --stroke2:rgba(23,58,110,.25);
    --ink:#0B1B33; --ink2:#3E5475; --muted:#7A8AA6;
    --accent:#1D6FE8; --accent2:#0EA5E9; --accent-grad:linear-gradient(135deg,#1D6FE8,#0EA5E9);
    --on-accent:#fff;
    --cuddle:#2470D8; --courtesy:#0E9E7E; --vt:#7C5CE0; --violet:#7C5CE0; --amber:#B87A00; --rose:#D6455D;
    --good:#0E9E63; --warn:#B87A00; --crit:#D6455D;
    --good-bg:rgba(14,158,99,.10); --warn-bg:rgba(184,122,0,.12); --crit-bg:rgba(214,69,93,.10);
    --grid-line:rgba(23,58,110,.09);
    --shadow:0 4px 18px rgba(23,58,110,.10);
    --shadow-lift:0 12px 30px rgba(23,58,110,.16);
    color-scheme:light;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background:
      radial-gradient(1100px 600px at 85% -10%, var(--bg-glow), transparent 60%),
      radial-gradient(900px 700px at -10% 110%, var(--bg-glow), transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg0));
    background-attachment:fixed;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  select{color-scheme:inherit}
  option,optgroup{background:var(--bg1) !important;color:var(--ink) !important}
  h1,h2,h3,h4{margin:0;text-wrap:balance}
  ::selection{background:rgba(61,155,255,.35)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  .num{font-variant-numeric:tabular-nums}
  .lab{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

  /* ================= app frame ================= */
  .app{display:flex;min-height:100vh}
  aside.side{
    width:236px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
    padding:16px 12px;gap:4px;border-right:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(148,182,255,.04), transparent 40%);
    backdrop-filter:blur(10px);transition:width .22s ease;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  }
  .app.collapsed aside.side{width:70px}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;white-space:nowrap}
  .logo .mark{width:34px;height:34px;flex:none;border-radius:11px;background:var(--accent-grad);
    display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(46,124,246,.45)}
  .logo .mark svg{width:19px;height:19px}
  .logo b{font-size:16.5px;letter-spacing:-.02em}
  .logo small{display:block;font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .app.collapsed .logo b,.app.collapsed .logo small{display:none}
  .navgroup{margin-top:12px}
  .navgroup .lab{padding:0 10px 6px;display:block}
  .app.collapsed .navgroup .lab{visibility:hidden;height:0;padding:0}
  .navitem{
    display:flex;align-items:center;gap:11px;width:100%;padding:8.5px 10px;border:none;background:none;
    border-radius:11px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:13.5px;white-space:nowrap;
    transition:background .15s,color .15s;position:relative;
  }
  .navitem svg{width:18px;height:18px;flex:none;opacity:.85}
  .navitem:hover{background:var(--glass2);color:var(--ink)}
  .navitem.on{background:var(--accent-grad);color:#fff;box-shadow:0 4px 14px rgba(46,124,246,.35)}
  .navitem .cnt{margin-left:auto;font-size:10px;background:var(--crit);color:#fff;border-radius:99px;padding:1px 6px;font-weight:800}
  .app.collapsed .navitem span,.app.collapsed .navitem .cnt{display:none}
  .side .foot{margin-top:auto;padding-top:10px}
  .collapse-btn{width:100%;justify-content:center}

  .shell{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 22px;border-bottom:1px solid var(--stroke);
    background:color-mix(in srgb, var(--bg1) 72%, transparent);backdrop-filter:blur(16px);
  }
  .search{
    display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--stroke);
    border-radius:12px;padding:7px 12px;min-width:210px;flex:1;max-width:340px;position:relative;
  }
  .search input{border:none;background:none;outline:none;width:100%;color:var(--ink)}
  .search svg{width:15px;height:15px;color:var(--muted);flex:none}
  .search .results{
    position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg1);border:1px solid var(--stroke2);
    border-radius:12px;box-shadow:var(--shadow-lift);overflow:hidden;z-index:80;
  }
  .search .results button{display:flex;gap:9px;align-items:center;width:100%;padding:8px 12px;border:none;background:none;cursor:pointer;text-align:left}
  .search .results button:hover{background:var(--glass2)}
  .ctl{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--stroke);border-radius:12px;padding:6px 11px}
  .ctl .lab{letter-spacing:.08em}
  .ctl select,.ctl input{border:none;background:transparent;outline:none;font-weight:600;color:var(--ink);max-width:150px}
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--stroke);background:var(--glass);
    border-radius:12px;padding:7px 14px;cursor:pointer;font-weight:650;color:var(--ink);
    transition:transform .12s,border-color .15s,background .15s;
  }
  .btn svg{width:15px;height:15px}
  .btn:hover{border-color:var(--stroke2);background:var(--glass2);transform:translateY(-1px)}
  .btn.primary{background:var(--accent-grad);border:none;color:#fff;box-shadow:0 4px 14px rgba(46,124,246,.4)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.small{padding:4px 10px;font-size:12.5px;border-radius:9px}
  .btn.ghost{background:none;border-color:transparent}
  .btn.ghost:hover{background:var(--glass2)}
  .btn.danger:hover{border-color:var(--crit);color:var(--crit)}
  .avatar{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;letter-spacing:.02em}
  .avatar.lg{width:58px;height:58px;font-size:20px;border-radius:18px}

  main#view{padding:22px;max-width:1720px;width:100%;margin:0 auto;animation:pagein .3s ease}
  @keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .page-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .page-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .page-head .sub{color:var(--muted);font-size:13px}
  .page-head .spacer{flex:1}

  /* ================= cards ================= */
  .card{
    background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
    padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px);
    transition:transform .16s ease,border-color .16s,box-shadow .16s;
  }
  .card.lift:hover{transform:translateY(-3px);border-color:var(--stroke2);box-shadow:var(--shadow-lift)}
  .card h3{font-size:14.5px;font-weight:750;letter-spacing:-.01em}
  .card .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  .cardhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .cardhead .spacer{flex:1}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
  .cols2{grid-template-columns:1.6fr 1fr}
  .cols2e{grid-template-columns:1fr 1fr}
  .cols3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:1150px){.cols2,.cols2e,.cols3{grid-template-columns:1fr}}
  .mt{margin-top:14px}

  .kpi{position:relative;overflow:hidden;padding:15px 16px 10px;cursor:default}
  .kpi .val{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
  .kpi .cmp{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .kpi .spark{margin:8px -16px -10px}
  .kpi .ico{position:absolute;top:13px;right:13px;width:30px;height:30px;border-radius:9px;background:var(--glass2);
    display:grid;place-items:center;color:var(--accent)}
  .kpi .ico svg{width:16px;height:16px}
  .delta{display:inline-flex;align-items:center;gap:3px;font-weight:750;font-size:12px;border-radius:99px;padding:1.5px 8px}
  .delta.up{color:var(--good);background:var(--good-bg)} .delta.down{color:var(--crit);background:var(--crit-bg)}
  .delta.flat{color:var(--muted);background:var(--glass2)}
  .delta.inv.up{color:var(--crit);background:var(--crit-bg)} .delta.inv.down{color:var(--good);background:var(--good-bg)}

  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-weight:700;font-size:11.5px;white-space:nowrap}
  .pgood{background:var(--good-bg);color:var(--good)} .pwarn{background:var(--warn-bg);color:var(--warn)} .pcrit{background:var(--crit-bg);color:var(--crit)}
  .pmuted{background:var(--glass2);color:var(--ink2)}
  .campchip{display:inline-flex;align-items:center;gap:6px;font-weight:650}
  .campchip i{width:8px;height:8px;border-radius:3px;flex:none}
  .chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--stroke);background:var(--glass);border-radius:99px;padding:5px 13px;cursor:pointer;font-weight:650;font-size:12.5px;color:var(--ink2);transition:all .14s}
  .chip:hover{color:var(--ink);border-color:var(--stroke2)}
  .chip.on{background:var(--accent-grad);border-color:transparent;color:#fff}

  /* insight cards */
  .insights{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:16px}
  .insight{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:14px;
    background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);transition:transform .15s,border-color .15s}
  .insight:hover{transform:translateY(-2px);border-color:var(--stroke2)}
  .insight .ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center}
  .insight .ic svg{width:16px;height:16px}
  .insight b{font-size:13px;display:block;margin-bottom:1px}
  .insight p{margin:0;font-size:12.5px;color:var(--ink2)}
  .tone-good .ic{background:var(--good-bg);color:var(--good)}
  .tone-warn .ic{background:var(--warn-bg);color:var(--warn)}
  .tone-crit .ic{background:var(--crit-bg);color:var(--crit)}
  .tone-info .ic{background:var(--glass2);color:var(--accent)}

  /* ================= tables ================= */
  .tablewrap{overflow:auto;border:1px solid var(--stroke);border-radius:14px;background:var(--glass);max-height:70vh;backdrop-filter:blur(14px)}
  table.data{border-collapse:separate;border-spacing:0;width:100%;font-size:12.8px}
  table.data th{
    position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--bg1) 88%, var(--accent));
    color:var(--ink2);text-align:right;font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;
    padding:9px 10px;border-bottom:1px solid var(--stroke);white-space:nowrap;cursor:pointer;user-select:none;
  }
  table.data th.l,table.data td.l{text-align:left}
  table.data th .dir{color:var(--accent);margin-left:3px}
  table.data td{padding:7px 10px;border-bottom:1px solid var(--grid-line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.data tbody tr{transition:background .12s}
  table.data tbody tr:hover{background:var(--glass2)}
  table.data tr.rowlink{cursor:pointer}
  /* The Grand Total is pinned to the bottom of the scroll box, so its background MUST be
     opaque: --glass2 is rgba(...,.09), i.e. 91% see-through, so every agent row scrolling
     underneath showed straight through it — avatars and names smeared across the totals by
     the backdrop blur. Mirrors the sticky <th> above (opaque color-mix of --bg1, which is a
     solid hex in both themes) and sits at z-index 4: over the body rows, under the header. */
  table.data tr.total td{font-weight:750;background:color-mix(in srgb, var(--bg1) 92%, var(--accent));border-top:1.5px solid var(--stroke);position:sticky;bottom:0;z-index:4}
  table.data tr.subtotal td{font-weight:700;background:var(--glass)}
  .agentcell{display:flex;align-items:center;gap:9px}
  .agentcell .nm{font-weight:650;line-height:1.15}
  .agentcell small{display:block;color:var(--muted);font-size:10.5px}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .filters input[type="search"],.filters select,.filters input[type="date"]{
    background:var(--glass);border:1px solid var(--stroke);border-radius:11px;padding:6.5px 12px;outline:none;color:var(--ink)}
  .filters :is(input,select):focus{border-color:var(--accent)}

  /* ================= charts ================= */
  .chartbox{position:relative}
  .chartbox svg{display:block;width:100%;height:auto}
  .chartbox .draw path.line{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1.1s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .chartbox .draw .fillarea{opacity:0;animation:fadein .8s .25s ease forwards}
  .chartbox .draw rect.bar{transform:scaleY(0);transform-origin:bottom;transform-box:fill-box;animation:grow .5s ease forwards}
  @keyframes grow{to{transform:scaleY(1)}}
  @keyframes fadein{to{opacity:1}}
  .tip{position:absolute;pointer-events:none;background:color-mix(in srgb,var(--bg1) 92%,#fff 0%);border:1px solid var(--stroke2);
    box-shadow:var(--shadow-lift);border-radius:11px;padding:8px 11px;font-size:12px;display:none;z-index:30;min-width:140px;backdrop-filter:blur(10px)}
  .tip .t{font-weight:750;margin-bottom:4px}
  .tip .r{display:flex;justify-content:space-between;gap:14px;padding:1px 0}
  .tip .r i{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:6px}
  .legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;font-size:12.3px;color:var(--ink2)}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
  .ring{position:relative;display:grid;place-items:center}
  .ring .rv{position:absolute;text-align:center}
  .ring .rv b{font-size:19px;font-weight:800}
  .ring .rv small{display:block;color:var(--muted);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}

  /* skeletons */
  .skel{border-radius:12px;background:linear-gradient(100deg,var(--glass) 40%,var(--glass3) 50%,var(--glass) 60%);
    background-size:200% 100%;animation:shim 1.1s linear infinite}
  @keyframes shim{to{background-position:-200% 0}}

  /* ================= drawer ================= */
  .scrim{position:fixed;inset:0;background:rgba(3,9,20,.55);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(620px,96vw);z-index:70;overflow-y:auto;
    background:linear-gradient(180deg,color-mix(in srgb,var(--bg1) 96%,var(--accent)),var(--bg0));
    border-left:1px solid var(--stroke2);box-shadow:-24px 0 60px rgba(2,8,20,.6);
    transform:translateX(103%);transition:transform .3s cubic-bezier(.32,.72,.33,1);padding:22px;
  }
  .drawer.open{transform:none}
  .drawer .card{background:var(--glass)}
  .dhead{display:flex;gap:14px;align-items:center;margin-bottom:16px}
  .dhead .meta{flex:1;min-width:0}
  .dhead h2{font-size:19px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .dclose{position:sticky;top:0;float:right;z-index:5}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .badge{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--glass2);border:1px solid var(--stroke);color:var(--ink2)}
  .badge.gold{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
  .minikpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px}
  .minikpi{background:var(--glass);border:1px solid var(--stroke);border-radius:13px;padding:10px 12px}
  .minikpi .val{font-size:17px;font-weight:800;margin-top:2px}
  .coachcard{border-left:3px solid var(--accent);border-radius:6px 14px 14px 6px;background:var(--glass);border-top:1px solid var(--stroke);border-right:1px solid var(--stroke);border-bottom:1px solid var(--stroke);padding:13px 15px;margin-bottom:10px}
  .coachcard.p1{border-left-color:var(--crit)} .coachcard.p2{border-left-color:var(--warn)} .coachcard.p3{border-left-color:var(--accent)}
  .coachcard h4{font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .coachcard p{margin:5px 0 0;font-size:12.5px;color:var(--ink2)}
  .coachcard .ev{margin-top:7px;font-size:12px;color:var(--muted);border-left:2px solid var(--stroke2);padding-left:9px}
  .tl-item{display:flex;gap:12px;position:relative;padding:0 0 16px 22px}
  .tl-item::before{content:"";position:absolute;left:6px;top:6px;bottom:-2px;width:2px;background:var(--stroke)}
  .tl-item:last-child::before{display:none}
  .tl-item .dot{position:absolute;left:1.5px;top:4px;width:11px;height:11px;border-radius:99px;border:2.5px solid var(--accent);background:var(--bg1)}
  .tl-item.good .dot{border-color:var(--good)} .tl-item.warn .dot{border-color:var(--warn)} .tl-item.crit .dot{border-color:var(--crit)}
  .tl-item b{font-size:12.8px} .tl-item p{margin:1px 0 0;font-size:12px;color:var(--ink2)}
  .tl-item time{font-size:10.5px;color:var(--muted);letter-spacing:.05em}
  textarea.notes{width:100%;min-height:64px;background:var(--glass);border:1px solid var(--stroke);border-radius:11px;padding:9px 12px;outline:none;resize:vertical;color:var(--ink)}
  textarea.notes:focus{border-color:var(--accent)}

/* ===== SUITE UNIFY — one design system across both tabs (matches Ops Analytics) ===== */
:root, :root[data-theme="dark"]{
  --r:16px; --r-sm:10px;
  --muted:#8296B5;
  --stroke:rgba(148,182,255,.14); --stroke2:rgba(148,182,255,.26);
  --shadow:0 6px 24px rgba(2,8,20,.45); --shadow-lift:0 12px 34px rgba(2,8,20,.55);
}
*{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif !important}
.num,[class*=num]{font-variant-numeric:tabular-nums}
html{font-size:14px}body{font-size:14px;line-height:1.45;background:radial-gradient(1200px 700px at 75% -10%,rgba(46,124,246,.14),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(56,198,244,.08),transparent 55%),#050D1C;color:#EAF1FB}

.card{background:linear-gradient(180deg,rgba(148,182,255,.05),rgba(148,182,255,.02)),#0A1730 !important;border:1px solid var(--stroke) !important;border-radius:16px !important;box-shadow:var(--shadow)}

button,.btn{transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s,transform .18s}
.btn-primary,.primary,button.primary{background:linear-gradient(135deg,#2E7CF6,#38C6F4) !important;color:#04101F !important;border:none !important}
/* tables: match Ops hairline rows */
table{font-variant-numeric:tabular-nums}
th{color:var(--muted) !important;text-transform:uppercase;letter-spacing:.7px;font-size:10.5px}
td,th{border-color:rgba(148,182,255,.08) !important}
tr:hover td{background:rgba(148,182,255,.06)}
/* headings: match Ops scale */
h1,.page-title{letter-spacing:-.5px}
/* scrollbars + selection identical */
*{scrollbar-width:thin;scrollbar-color:#22406B transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#22406B;border-radius:8px;border:2px solid #050D1C}
::selection{background:rgba(61,155,255,.30)}
/* LOGO: identical treatment, aspect ratio locked (width fixed, height auto) */
.side .logo, aside.side > div:first-child{margin:0 0 16px}

/* ================= utilities ================= */
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c!=='\r') field+=c;
    }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function splitSheets(text){
  // Multi-sheet CSV exports use "### Sheet: Name ###" marker lines
  if(!text.includes('### Sheet:')) return {'': text};
  const out={}; let name=null, buf=[];
  for(const line of text.split('\n')){
    const m=line.match(/^### Sheet:\s*(.*?)\s*###/);
    if(m){ if(name!==null) out[name]=buf.join('\n'); name=m[1]; buf=[]; }
    else if(name!==null) buf.push(line);
  }
  if(name!==null) out[name]=buf.join('\n');
  return out;
}
function toObjects(rows){
  // first row with ≥2 non-empty cells is the header
  let h=0; while(h<rows.length && rows[h].filter(c=>c.trim()).length<2) h++;
  if(h>=rows.length) return {header:[],recs:[]};
  const header=rows[h].map(c=>c.trim());
  const recs=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]; if(!r.some(c=>c&&c.trim())) continue;
    const o={}; header.forEach((k,j)=>{ if(k && !(k in o)) o[k]=(r[j]||'').trim(); }); // duplicate header → FIRST wins (BI's real Charge Amount)
    recs.push(o);
  }
  return {header,recs};
}
/* Cooperative variants for BIG uploads: identical logic, but they yield to the event
   loop periodically so a 60 MB converted export can't freeze the page (the remaining
   main-thread "lag" after the XLSX parse moved to a Worker). */
const __yield=()=>new Promise(r=>setTimeout(r,0));
async function parseCSVAsync(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    if(i&&(i&0xFFFFF)===0) await __yield();       // every ~1M chars
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c!=='\r') field+=c;
    }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}
async function toObjectsAsync(rows){
  let h=0; while(h<rows.length && rows[h].filter(c=>c.trim()).length<2) h++;
  if(h>=rows.length) return {header:[],recs:[]};
  const header=rows[h].map(c=>c.trim());
  const recs=[];
  for(let i=h+1;i<rows.length;i++){
    if((i%20000)===0&&i>h+1) await __yield();
    const r=rows[i]; if(!r.some(c=>c&&c.trim())) continue;
    const o={}; header.forEach((k,j)=>{ if(k && !(k in o)) o[k]=(r[j]||'').trim(); }); // duplicate header → FIRST wins
    recs.push(o);
  }
  return {header,recs};
}

function parseDateLoose(s){
  if(!s) return null;
  s=s.trim();
  // month/day sanity: an unchecked US-format '12/25/2026' would mint the key '2026-25-12',
  // which lexicographically beats every real month and blanks the whole dashboard via latestMonth()
  const chk=(y,mo,d)=>{ mo=+mo; d=+d; if(mo<1||mo>12||d<1||d>31) return null;
    return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); };
  let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/); if(m) return chk(m[1],m[2],m[3]);
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m) return chk(m[3],m[2],m[1]);
  return null;
}
function dateFromFilename(name){
  let m=name.match(/(\d{4})[._-](\d{2})[._-](\d{2})/);
  if(m && +m[2]<=12) return `${m[1]}-${m[2]}-${m[3]}`;
  m=name.match(/(\d{2})[._-](\d{2})[._-](\d{4})/);
  if(m){ let d=+m[1], mo=+m[2]; if(mo>12&&d<=12){[d,mo]=[mo,d];} if(mo<=12) return `${m[3]}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  return null;
}
function monthFromFilename(name){
  const MN={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  let m=name.toLowerCase().match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[ ._\-]*(20\d{2})/);
  if(m) return m[2]+'-'+String(MN[m[1]]).padStart(2,'0');
  m=name.match(/(20\d{2})[ ._\-](0?[1-9]|1[0-2])(?!\d)/);
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0');
  return null;
}
function addDays(k,n){ const d=new Date(k+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function mondayOf(k){ const d=new Date(k+'T00:00:00Z'); const dow=(d.getUTCDay()+6)%7; return addDays(k,-dow); }
const fmtDay = k => { const d=new Date(k+'T00:00:00Z'); return d.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}); };

   key of S and Object.assign()s the blob over it — so any key that freshState() does not
   declare, or that an older client never pushed, comes back UNDEFINED and is then pushed
   back out in that state, forever. `coach` was exactly that: absent from the live blob, so
   `S.coach[M.periodKey]` in PAGES.agents threw and the whole Agent Performance page died on
   every device. Idempotent — also called from rebuild(), which runs after every hydrate. */
function normalizeState(){
  S.settings=Object.assign({attOverride:{},onTarget:1,trainingCounts:true},S.settings);
  if(!S.coach) S.coach={};                        // periodKey -> code -> {notes,due,status}
  if(!S.adjust) S.adjust={};
  if(!S.map) S.map={};
  if(!Array.isArray(S.files)) S.files=[];
  if(!Array.isArray(S.roster)) S.roster=[];
  for(const k of ['sales','calls','att','evals','tracker','callsMeta']) if(!S[k]) S[k]={};
  // blobs saved before callsMeta existed: seed provenance from the data itself, so
  // fullest-day-wins protects pre-existing days instead of silently blind-replacing them
  for(const d in S.calls){ if(!S.callsMeta[d]){ let n=0; const bk=S.calls[d];
    for(const k in bk) n+=bk[k].calls||0; S.callsMeta[d]={f:'',n}; } }
  if(S.gwpPerUnit==null) S.gwpPerUnit=89;
  if(!S.ui) S.ui={month:'',mode:'calendar',tab:'dashboard'};
  if(!S.ui.camp) S.ui.camp='';                    // global campaign filter
  if(!S.ui.team) S.ui.team='';                    // global team filter
  if(!S.ui.tab) S.ui.tab='dashboard';
}
normalizeState();
// migrate v2 period keys ('YYYY-MM|calendar') to range keys ('from|to')
for(const store of ['adjust','coach']){
  for(const k of Object.keys(S[store]||{})){
    const mm=k.match(/^(\d{4})-(\d{2})\|(calendar|cycle)$/);
    if(!mm) continue;
    const y=+mm[1], mo=+mm[2];
    const nk=mm[3]==='cycle'
      ? dkey(new Date(Date.UTC(y,mo-2,26)))+'|'+dkey(new Date(Date.UTC(y,mo-1,25)))
      : `${mm[1]}-${mm[2]}-01|`+dkey(new Date(Date.UTC(y,mo,0)));
    S[store][nk]=Object.assign({},S[store][nk],S[store][k]); delete S[store][k];
  }
}

/* ================= classification rules ================= */
function attWeight(status){
  const ov=S.settings.attOverride||{};
  if(status in ov) return ov[status];
  const s=(status||'').toLowerCase();
  if(s==='present') return 1;
  if(s==='training') return S.settings.trainingCounts?1:0;
  if(s.includes('half')) return 0.5;
  if(s==='terminated'||s==='resigned') return -1;   // ends employment
  return 0;
}
function isOptIn(disp){
  const s=(disp||'').toLowerCase();
  return s.includes('insurance opt') && !s.includes('no insurance');
}
function isSaleDisp(disp){
  const s=(disp||'').toLowerCase();
  return (s.includes('sale')&&!s.startsWith('no sale')&&!s.includes('after sales')) || s==='saleinsoptin';
}

/* ================= ingestion ================= */
function detectType(header, sheetName, recs){
  const H=header.map(h=>h.toLowerCase());
  const has=(...ks)=>ks.every(k=>H.some(h=>h.includes(k)));
  if(has('charge amount','contract create date')&&has('account number')){
    // Power BI Active vs Inactive are HEADER-IDENTICAL supersets (both carry 40+
    // columns incl. Contract Deactivate Date) — only the DATA tells them apart:
    // in an Active export the deactivate date is empty on every row; in an Inactive
    // (cancellations) export it is filled on every row. Un-guarded, an Inactive file
    // would REPLACE real sales days with cancelled-contract charges. The deactivate
    // column appears exactly once, so this sniff is immune to the export's duplicated
    // Contract Status / Charge Amount headers.
    const sample=(recs||[]).slice(0,500);
    const dd=sample.filter(r=>String(r['Contract Deactivate Date']||'').trim()!=='').length;
    if(sample.length&&dd>=sample.length/2) return 'inactive';   // cancellations - the MTD Cancellations column
    return 'bi';   // Power BI - Active Cases (the money source)
  }
  if(has('date & time','lead disposition')) return 'calls';
  if(has('employee code','status')&&has('date')) return 'attendance';   // Employee Name not required — the parser never reads it
  if(has('qa agent','sales agent cb')) return 'evals';
  if(has('date/time closed')) return 'closedIgnored';   // closed-cases export would otherwise overwrite the open-cases snapshot
  if(has('case number','case owner')) return 'opencases';
  if(has('team leader','agent name')&&(has('sales force')||has('call x'))) return 'roster';
  if(has('date','team leader','emp code','sales achieved')) return 'trackerDaily';
  return null;
}

let rosterCovered=null; // campaigns already replaced by an earlier sheet of the same file
let __curFileHash=null; // content hash of the file being ingested — regFile stamps it on the registry entry
async function ingestText(name, text, expected, hash){
  __curFileHash=hash||null;
  const sheets=splitSheets(text);
  const names=Object.keys(sheets);
  let ingested=[];
  rosterCovered=new Set();
  // prefer roster sheets named VAS / Agent List when multi-sheet
  const order=names.sort((a,b)=>{
    const rank=n=>/agent list|vas$/i.test(n)?0:(/^(june|july|august|september|october|november|december|january|february|march|april|may)$/i.test(n)?1:2);
    return rank(a)-rank(b);
  });
  let dailyDone=false;
  for(const sn of order){
    if(/"USER NAME"/.test(sheets[sn])&&/time range:/i.test(sheets[sn])){
      const vr=INGEST.vici(sheets[sn],name); if(vr){ ingested.push(vr); continue; }
    }
    const {header,recs}=await toObjectsAsync(await parseCSVAsync(sheets[sn]));
    if(!recs.length) continue;
    const type=detectType(header, sn, recs);
    if(!type) continue;
    if(type==='trackerDaily'&&dailyDone) continue;
    const res=INGEST[type](recs, name, sn);
    if(res){ ingested.push(res); if(type==='trackerDaily')dailyDone=true; }
  }
  if(!ingested.length && expected && INGEST[expected]){
    // slot upload with unrecognised headers: try the slot's own parser as a last resort
    const first=Object.values(sheets)[0]||'';
    const {recs}=await toObjectsAsync(await parseCSVAsync(first));
    if(recs.length){ try{ const res=INGEST[expected](recs,name); if(res) ingested.push(res); }catch(err){} }
  }
  if(!ingested.length){ toast('Could not recognise "'+name+'" — check the file headers'); return false; }
  if(expected){
    const SLOT_TYPES={bi:['bi'],calls:['calls'],attendance:['attendance'],inactive:['cancellations'],vici:['calls (ViciDial)','vici'],
      evals:['evals'],roster:['roster'],trackerDaily:['tracker','roster'],opencases:['open']};
    const want=SLOT_TYPES[expected]||[expected];
    if(!ingested.some(r=>want.some(w=>r.type.startsWith(w))))
      toast('Heads up: "'+name+'" is actually '+ingested.map(r=>r.type).join(', ')+' — filed there instead');
  }
  save(); return true;
}

const STORE_OF={bi:'sales',calls:'calls',attendance:'att',evals:'evals',tracker:'tracker',cancellations:'canc'};
function regFile(name,type,dates,rows,extra){
  const nd=[...dates].sort();
  // same file re-uploaded with a SMALLER date span: days the old version stored but the
  // new one no longer carries would otherwise survive with no registry entry claiming
  // them — feeding KPIs forever and undeletable from the UI. Clear them (unless another
  // file also claims the day).
  const old=S.files.find(f=>f.name===name&&f.type===type);
  if(old){
    const t0=type.split(' ')[0], st=STORE_OF[t0];
    if(st) for(const d of old.dates||[]){
      if(nd.includes(d)) continue;
      if(S.files.some(x=>x!==old&&x.type.split(' ')[0]===t0&&(x.dates||[]).includes(d))) continue;
      if(st==='calls'){ if(S.callsMeta&&S.callsMeta[d]&&S.callsMeta[d].f===name){ delete S.calls[d]; delete S.callsMeta[d]; } }
      else delete S[st][d];
    }
  }
  S.files=S.files.filter(f=>!(f.name===name&&f.type===type));
  S.files.push({name,type,dates:nd,rows,at:new Date().toISOString().slice(0,16).replace('T',' '),
    ...(__curFileHash?{hash:__curFileHash}:{}),...(extra||{})});
  return {type,rows,dates:nd};
}

const INGEST={
  // Power BI - Active Cases — THE money source (replaces Activated Services + the GWP
  // price list). GWP = Σ Charge Amount per account × (1+VAT); charges are EX-VAT (proof:
  // 30,43+33,91+21,74 = 86,08 = 99 ÷ 1,15). Each row is dated by its OWN Contract Create
  // Date; the agent is the Owner. Fills the same S.sales[date][owner]={n,gwp,canc} the
  // rest of the model reads, so nothing downstream changes. Months accumulate by date key.
  bi(recs,name){
    const VAT=1.15;                                   // 15%, matching the AgentOS BI model
    const byDate={};                                  // date -> owner -> {accts:Set, ex}
    const dates=new Set();
    let skip=0;
    for(const r of recs){
      const acc=String(r['Account Number']||'').trim();
      if(!acc||/^applied filters/i.test(acc)) continue;          // R-ING-BI-07 footer guard (expected junk, not counted)
      // ZA comma-decimal safe: '30,43' must read 30.43, not 3043
      const chg=parseFloat(String(r['Charge Amount']||'').replace(/\s/g,'').replace(/^(-?\d+),(\d+)$/,'$1.$2').replace(/[^0-9.\-]/g,''));
      if(isNaN(chg)){ skip++; continue; }
      const d=String(r['Contract Create Date']||'').slice(0,10); // ISO 'YYYY-MM-DD …'
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ skip++; continue; }

      dates.add(d);

      o.accts.add(acc); o.ex+=chg;
    }
    // the file is authoritative for the dates it carries — replace those days, keep others
    for(const d of dates){
      S.sales[d]={};
      for(const owner in byDate[d]){
        const o=byDate[d][owner];
        S.sales[d][owner]={n:o.accts.size, gwp:o.ex*VAT, canc:0};
      }
    }
    if(!dates.size) return null;              // stored nothing -> not a load; fail loudly
    return regFile(name,'bi',[...dates].sort(),recs.length,{skip});

  calls(recs,name){
    const dates=new Set();

    // date-range file). Blind replace let the LAST file wipe a fuller day loaded earlier.
    // Per date, keep whichever FILE recorded more calls; same-file re-upload always wins
    // (it is the corrected version of itself). Provenance lives in S.callsMeta[date].
    S.callsMeta=S.callsMeta||{};

     Contract Deactivate Date per agent, so a cancellation lands on the day the contract
     was deactivated, attributed to its Owner. Until now VAS had no upload for this and
     the figures were keyed in by hand on the Adjustments tab.
     DEDUP: a contract can only cancel once, so the identity is account|contract|deactivate
     date. The file is authoritative for every DAY it covers — those days are rebuilt from
     it — which is what makes a daily re-pull of an overlapping range safe: the same
     cancellation cannot be counted twice, whether it arrives once or in five exports. */
  inactive(recs,name){
    const byDate={}, dates=new Set();
    const seen=new Set();
    let skip=0, dupes=0;
    for(const r of recs){
      const acc=String(r['Account Number']||'').trim();
      if(!acc||/^applied filters/i.test(acc)){ skip++; continue; }   // Power BI footer, not data
      const d=parseDateLoose(r['Contract Deactivate Date']);
      if(!d){ skip++; continue; }                                     // still active, or no date
      const key=acc+'|'+String(r['Contract Number']||'').trim()+'|'+d;
      if(seen.has(key)){ dupes++; continue; }                         // same contract twice in one file
      seen.add(key);
      const owner=(r['Owner']||'').trim();   // stored RAW - resolved at model-build time
      if(!owner){ skip++; continue; }

      dates.add(d);
      const bk=(byDate[d]=byDate[d]||{});
      bk[owner]=(bk[owner]||0)+1;
    }
    if(!dates.size){ toast('"'+name+'" carried no cancellations with a Contract Deactivate Date'); return null; }
    // the file owns the days it covers - rebuild them rather than adding to them
    for(const d of dates) S.canc[d]=byDate[d];

    return regFile(name,'cancellations',[...dates].sort(),recs.length,{skip,dupes});
  },
  closedIgnored(recs,name){
    toast('"'+name+'" is a closed-cases export — the VAS dashboard does not use it. Upload it in the Ops dashboard.');
    return {type:'ignored (closed cases — Ops file)',rows:recs.length,dates:[]};
  }
};

function removeFile(idx){
  const f=S.files[idx]; if(!f) return;
  if(!confirm('Remove "'+f.name+'"?\n\nIts data leaves the dashboard and the change is saved to the cloud database.')) return;
  const t0=f.type.split(' ')[0];
  // ownership guard: registry date lists overlap by design (daily cumulative BI exports,
  // overlapping dialler files). A day is only deleted if THIS file still owns it — for
  // calls that is callsMeta provenance; for the rest, no other same-type file claims it.
  // Without this, removing yesterday's entry wiped days today's file had re-stored.
  const claimedElsewhere=d=>S.files.some(x=>x!==f&&x.type.split(' ')[0]===t0&&(x.dates||[]).includes(d));
  const storeOf={bi:'sales',calls:'calls',attendance:'att',evals:'evals'};
  const st=storeOf[t0];
  if(st && f.dates) for(const d of f.dates){
    if(st==='calls'){
      if(S.callsMeta&&S.callsMeta[d]&&S.callsMeta[d].f&&S.callsMeta[d].f!==f.name) continue; // a fuller file owns this day now
      delete S.calls[d]; if(S.callsMeta) delete S.callsMeta[d];
    }else{
      if(claimedElsewhere(d)) continue;
      delete S[st][d];
    }
  }
  if(f.type.startsWith('tracker')) for(const d of f.dates||[]){ if(!claimedElsewhere(d)) delete S.tracker[d]; }
  if(f.type==='open cases') S.opencases=null;
  S.files.splice(idx,1);
  save(); rebuild(); render();
  // VAS mirrors its WHOLE state to the cloud KV blob (vas-state) — deleting a file and saving
  // overwrites that blob without it, so the removal reaches Supabase. Push NOW rather than wait
  // on save()'s 1.5s debounce, so a quick tab-close can't leave the deletion only local.
  if(typeof __cloudPush==='function' && window.__vasHydrated){ clearTimeout(__cloudT); __cloudPush(false); toast('Removed '+f.name+' — updated in the cloud'); }
  else toast('Removed '+f.name);
}

/* ================= identity resolution ================= */
let IDX=null;
const normFull = s => (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function buildIndex(){
  IDX={byCode:{},byName:{},byCallx:{},tok:[]};
  for(const a of S.roster){
    IDX.byCode[a.code]=a;
    // dialer names can carry a DIFFERENT CB number than the employee code
    // (e.g. "Kyle Kisten CB-138" is employee CB137) — so the full "Call x"
    // string wins over the embedded code when resolving call records.
    if(a.callx) IDX.byCallx[normFull(a.callx)]=a.code;
    for(const n of [a.name,a.sf,a.callx]) if(n){ const k=normName(n); if(k) IDX.byName[k]=a.code; }
    { const t=nameTokens(a.name); if(t.length>=2) IDX.tok.push({code:a.code,t}); }
  }
}
function resolveKey(key){
  if(S.map[key]!==undefined) return S.map[key]==='__ignore__'?null:S.map[key];
  if(/^CB\d+$/.test(key)) return IDX.byCode[key]?key:null;
  const fx=IDX.byCallx[normFull(key)]; if(fx) return fx;
  const nn=IDX.byName[normName(key)]; if(nn) return nn;
  // middle names: match on tokens, but only when exactly one roster agent contains them all
  const kt=nameTokens(key);
  if(kt.length>=2){ const h=IDX.tok.filter(e=>kt.every(x=>e.t.includes(x))); if(h.length===1) return h[0].code; }
  const c=cbCode(key); if(c&&IDX.byCode[c]) return c;
  return null;
}

/* ================= period & model ================= */
function periodRange(){
  const p=S.ui.preset||(S.ui.mode==='cycle'?'cycle':'month');
  const today=dkey(new Date());
  const mk=(from,to)=>({from,to});
  if(p==='today') return mk(today,today);
  if(p==='yesterday'){ const y=addDays(today,-1); return mk(y,y); }
  if(p==='7d') return mk(addDays(today,-6),today);
  if(p==='30d') return mk(addDays(today,-29),today);
  if(p==='mtd') return mk(today.slice(0,7)+'-01',today);
  if(p==='prevMonth'){ const [y,m]=today.split('-').map(Number);
    return mk(dkey(new Date(Date.UTC(y,m-2,1))),dkey(new Date(Date.UTC(y,m-1,0)))); }
  if(p==='custom'&&S.ui.from&&S.ui.to) return S.ui.from<=S.ui.to?mk(S.ui.from,S.ui.to):mk(S.ui.to,S.ui.from);
  const mo=S.ui.month||latestMonth(); if(!mo) return null;
  const [y,m]=mo.split('-').map(Number);
  if(p==='cycle') return mk(dkey(new Date(Date.UTC(y,m-2,26))),dkey(new Date(Date.UTC(y,m-1,25))));
  return mk(mo+'-01',dkey(new Date(Date.UTC(y,m,0))));
}
function allDataDates(){
  return new Set([...Object.keys(S.sales),...Object.keys(S.calls),...Object.keys(S.tracker)]);
}
function latestMonth(){
  const ds=[...allDataDates()].sort();
  return ds.length?ds[ds.length-1].slice(0,7):new Date().toISOString().slice(0,7);
}

let M=null, MP=null; // current & previous-period models
function prevRange(){
  const r=periodRange(); if(!r) return null;
  const p=S.ui.preset||(S.ui.mode==='cycle'?'cycle':'month');
  if(p==='cycle'){ const [y,m]=(S.ui.month||latestMonth()).split('-').map(Number);
    return {from:dkey(new Date(Date.UTC(y,m-3,26))),to:dkey(new Date(Date.UTC(y,m-2,25)))}; }
  if(p==='month'||p==='prevMonth'||p==='mtd'){
    const [y,m]=r.from.split('-').map(Number);
    return {from:dkey(new Date(Date.UTC(y,m-2,1))),to:dkey(new Date(Date.UTC(y,m-1,0)))};
  }
  const len=Math.round((new Date(r.to+'T00:00:00Z')-new Date(r.from+'T00:00:00Z'))/86400000)+1;
  return {from:addDays(r.from,-len),to:addDays(r.from,-1)};
}
function monthlyHistory(){
  const months={};
  const addDay=(d,s,g)=>{ const m=d.slice(0,7);
    const o=months[m]=months[m]||{sales:0,gwp:0,src:'daily'}; o.sales+=s; o.gwp+=g; };
  for(const d in S.sales){ let s=0,g=0; for(const v of Object.values(S.sales[d])){s+=v.n;g+=v.gwp;} addDay(d,s,g); }
  for(const d in S.tracker){ if(S.sales[d]) continue; let s=0,g=0; for(const v of Object.values(S.tracker[d])){s+=v.sales;g+=v.gwp;} addDay(d,s,g); }
  return Object.entries(months).sort((a,b)=>a[0].localeCompare(b[0])).map(([m,o])=>({month:m,...o}));
}
/* Drop PHANTOM file registrations — an entry for a date-bearing source that recorded a row
   count but stored ZERO days. These were minted before VAS could read .xlsx: the uploader
   decoded the ZIP as text, parseCSV split the noise into thousands of junk "rows", the type
   still matched on header strings inside the workbook XML, then every row failed its date
   guard. The registry then advertised a file that contributed nothing, so the Upload Station
   and the Data Trust bar both lied. Runs from rebuild() so it heals state arriving from ANY
   path — localStorage, an ingest, or a cloud hydrate that carries the old junk back.
   Roster is exempt (it legitimately has no dates); open cases is judged on whether its
   statuses actually resolved, since "?" for every row is the same binary-garbage tell. */
function pruneDeadFiles(){
  const before=(S.files||[]).length;
  S.files=(S.files||[]).filter(f=>{
    // Entries carrying a content hash were ingested AFTER the xlsx fix by a reader that
    // verified them — they are never phantoms, and a 0-date calls entry can be legitimate
    // (every one of its days was covered more fully by another file). Keeping it keeps its
    // hash, which is what stops tomorrow's re-upload of the same file re-parsing 50 MB.
    if(f.hash) return true;
    const t=String(f.type||'').split(' (')[0];
    if(t==='roster') return true;
    if(t==='open cases'){
      const by=S.opencases&&S.opencases.by;
      const dead=!by||Object.keys(by).join()==='?';
      if(dead) S.opencases=null;
      return !dead;
    }
    return (f.dates||[]).length>0;
  });
  return before-(S.files||[]).length;
}
function rebuild(){
  normalizeState();      // hydrate() may have just replaced S with a blob missing keys
  pruneDeadFiles();
  buildIndex();
  const r=periodRange();
  M=r?buildModel(r, r.from+'|'+r.to):null;
  const pr=prevRange();
  MP=pr?buildModel(pr, pr.from+'|'+pr.to):null;
}
function buildModel(range, periodKey){
  if(!range) return null;
  const dates=[...allDataDates()].filter(d=>d>=range.from&&d<=range.to).sort();

  // termination map: first date an agent is marked Terminated/Resigned
  const term={};
  for(const d of Object.keys(S.att).sort()){
    for(const code in S.att[d]) if(attWeight(S.att[d][code])===-1 && !(code in term)) term[code]=d;
  }

  // resolve raw aggregate keys -> codes per date
  const salesBy={}, callsBy={}, cancBy={}, unmatched={};
  for(const d of dates){
    salesBy[d]={}; callsBy[d]={}; cancBy[d]={};
    for(const [k,v] of Object.entries(S.sales[d]||{})){
      const c=resolveKey(k);
      if(c){ const t=salesBy[d][c]=salesBy[d][c]||{n:0,gwp:0,canc:0}; t.n+=v.n; t.gwp+=v.gwp; t.canc+=v.canc||0; }
      else if(resolveKey(k)!==null||S.map[k]!=='__ignore__'){ const u=unmatched[k]=unmatched[k]||{src:'sales',n:0,gwp:0}; u.n+=v.n; u.gwp+=v.gwp||0; }
    }
    for(const [k,v] of Object.entries(S.canc[d]||{})){
      const c=resolveKey(k);
      if(c) cancBy[d][c]=(cancBy[d][c]||0)+v;
      else if(S.map[k]!=='__ignore__'){ const u=unmatched[k]=unmatched[k]||{src:'cancellations',n:0}; u.n+=v; }
    }
    for(const [k,v] of Object.entries(S.calls[d]||{})){
      const c=resolveKey(k);
      if(c){ const t=callsBy[d][c]=callsBy[d][c]||{talk:0,calls:0,ans:0,opt:0,saleD:0}; t.talk+=v.talk; t.calls+=v.calls; t.ans+=(v.ans||0); t.opt+=v.opt; t.saleD+=v.saleD; }
      else if(S.map[k]!=='__ignore__'){ const u=unmatched[k]=unmatched[k]||{src:'calls',n:0}; u.n+=v.calls; }
    }
  }

  // week buckets
  const mondays=[...new Set(dates.map(mondayOf))].sort();
  const weekOf={}; dates.forEach(d=>{ weekOf[d]=mondays.indexOf(mondayOf(d))+1; });

  // day-agent facts — one row per agent per dialing day, like the workbook's daily sheet.
  // Agents can work a different campaign on different days, so campaign/TL come from the
  // tracker row when that day was imported from a tracker workbook, else from the roster.
  const facts=[];
  const attCovered=d=>!!S.att[d]&&Object.keys(S.att[d]).length>0;
  const metaOf={}; S.roster.forEach(a=>{ metaOf[a.code]=a; });
  for(const d of dates){
    const hasSalesData=!!S.sales[d]; const trk=S.tracker[d]||{};
    // On days whose only record is an imported tracker workbook, the workbook's rows ARE
    // the register — don't synthesise shifts for roster agents it doesn't contain.
    const trackerOnlyDay=!hasSalesData&&!S.calls[d]&&Object.keys(trk).length>0;
    const codes=trackerOnlyDay?new Set(Object.keys(trk)):new Set([...S.roster.map(a=>a.code),...Object.keys(trk)]);
    for(const code of codes){
      const a=metaOf[code], tr=trk[code];
      const camp=campOf((tr&&tr.campaign)||(a&&a.campaign));
      const started=tr?true:(!a?.start||a.start<=d);
      const terminated=term[code]&&d>=term[code];
      let emp=(started&&!terminated)?1:0;
      const sd=salesBy[d][code], cd=callsBy[d][code];
      let sales=0,gwp=0,canc=(cancBy[d]||{})[code]||0,provisional=false;
      if(camp==='VT'){
        // tracker-unit sales never appear in the Power BI money source —
        // count "Sale Made" dispositions from the dialer instead (no GWP).
        if(cd&&cd.saleD){ sales=cd.saleD; provisional=true; }
      }
      else if(hasSalesData){ if(sd){sales=sd.n;gwp=sd.gwp;} }
      else if(tr){ sales=tr.sales; gwp=tr.gwp; }
      else if(cd&&cd.saleD){ sales=cd.saleD; gwp=cd.saleD*S.gwpPerUnit; provisional=true; }
      let talk=cd?cd.talk:(tr?tr.talk:0);
      let opt=cd?cd.opt:(tr?tr.opt:0);
      let ref=tr?tr.ref:0;
      const ncalls=cd?cd.calls:0, nans=cd?cd.ans:0;
      const active=(talk>0||sales>0);
      let act;
      const st=(S.att[d]||{})[code];
      if(st!=null){ const w=attWeight(st); act=w===-1?0:w; }
      else if(attCovered(d)) act=active?1:0;
      else act=active?1:(emp?1:0);
      const trackerIsSource=tr&&!cd&&!sd&&st==null;
      if(trackerIsSource){ emp=tr.emp; act=tr.act; }
      if(!emp&&(active)) emp=1;                    // has activity → must be employed
      if(act>0&&!emp) emp=1;
      const target=trackerIsSource?tr.target:((a?.target||0)*emp);
      const gwpT=trackerIsSource?tr.gwpT:(target*S.gwpPerUnit);
      if(!emp&&!act&&!sales&&!talk&&!opt) continue;
      facts.push({date:d,week:weekOf[d],code,
        tl:(tr?.tl)||a?.tl||'',
        campaign:camp,
        agent:a?.name||tr?.agent||code,
        tenure:(tr?.tenure)||a?.tenure||'',
        emp,act,target,sales,gwp,gwpT,talk,opt,ref,canc,provisional,calls:ncalls,ans:nans});
    }
  }

  // per-agent QA over a date range
  const qaFor=(code,from,to)=>{
    let s=0,n=0;
    for(const d in S.evals){ if(d<from||d>to) continue; const arr=S.evals[d][code]; if(arr) for(const v of arr){s+=(typeof v==='number'?v:v.s);n++;} }
    return n?{avg:s/n/100,n}:null;
  };

  const adj=S.adjust[periodKey]||{};
  // Cancellations now arrive in the BI Inactive upload. Where the file covers a day in
  // this period, the hand-keyed cancellation top-up is IGNORED rather than added - the
  // same cancellation must not be counted once from the file and again by hand. Referrals
  // are untouched: no upload carries them, so the Adjustments tab is still their source.
  const cancFromFile=dates.some(d=>S.canc[d]&&Object.keys(S.canc[d]).length);
  const adjC=code=>cancFromFile?0:((adj[code]||{}).c||0);

  function agg(rows,code){
    const o={emp:0,act:0,target:0,sales:0,gwp:0,gwpT:0,talk:0,opt:0,ref:0,canc:0,days:0,prov:0,calls:0,ans:0};
    for(const f of rows){ o.emp+=f.emp;o.act+=f.act;o.target+=f.target;o.sales+=f.sales;o.gwp+=f.gwp;o.gwpT+=f.gwpT;
      o.talk+=f.talk;o.opt+=f.opt;o.ref+=f.ref;o.canc+=f.canc;o.days++; o.calls+=(f.calls||0); o.ans+=(f.ans||0); if(f.provisional)o.prov++; }
    if(code&&adj[code]){ o.canc+=adjC(code); o.ref+=adj[code].r||0; }
    o.att=o.emp?o.act/o.emp:null; o.pctT=o.target?o.sales/o.target:null; o.spd=o.act?o.sales/o.act:null;
    o.pctG=o.gwpT?o.gwp/o.gwpT:null; o.aveG=o.sales?o.gwp/o.sales:null; o.aveTalk=o.act?o.talk/o.act:null;
    o.optPct=o.sales?o.opt/o.sales:null; o.refPct=o.sales?o.ref/o.sales:null; o.cancPct=o.sales?o.canc/o.sales:null;
    o.aht=o.ans?o.talk/o.ans:null; o.ansPct=o.calls?o.ans/o.calls:null;
    return o;
  }

  const byAgentDay={}; facts.forEach(f=>{ (byAgentDay[f.code]=byAgentDay[f.code]||[]).push(f); });

  // agent identity list (roster order, then tracker-only codes) — for pivot & adjustments
  const seen=new Set(), agents=[];
  for(const a of S.roster) if(byAgentDay[a.code]){ agents.push(a); seen.add(a.code); }
  for(const f of facts) if(!seen.has(f.code)){ seen.add(f.code);
    agents.push({code:f.code,name:f.agent,tl:f.tl,campaign:f.campaign,tenure:f.tenure,target:0,start:''}); }

  // aggregate by agent × campaign (an agent can appear in both tabs, like the workbook)
  const meta=rows=>{ const l=rows[rows.length-1]; return {tl:l.tl,tenure:l.tenure,agent:l.agent,code:l.code}; };
  const byCC={Cuddle:{},Courtesy:{},VT:{}};
  facts.forEach(f=>{ (byCC[f.campaign][f.code]=byCC[f.campaign][f.code]||[]).push(f); });
  // adjustments (cancellations/referrals) attach to the agent's primary campaign
  const primaryCamp={};
  for(const code of seen){
    let best=null,bestN=-1;
    for(const c of CAMPS){ if(!byCC[c][code]) continue;
      const n=byCC[c][code].reduce((s,f)=>s+f.sales,0);
      if(n>bestN){bestN=n;best=c;} }
    primaryCamp[code]=best||'Courtesy';
  }
  const mtdCC={Cuddle:{},Courtesy:{},VT:{}}, wtdCC={};
  const weeks=mondays.map((m,i)=>({num:i+1,from:m,to:addDays(m,6),dates:dates.filter(d=>mondayOf(d)===m)}));
  for(const camp of CAMPS){
    for(const code in byCC[camp]){
      const rows=byCC[camp][code];
      const o=agg(rows, primaryCamp[code]===camp?code:null);
      Object.assign(o, meta(rows)); o.qa=qaFor(code,range.from,range.to);
      mtdCC[camp][code]=o;
      for(const w of weeks){
        const wr=rows.filter(f=>f.week===w.num); if(!wr.length) continue;
        const wo=agg(wr,null); Object.assign(wo, meta(wr)); wo.qa=qaFor(code,w.from,w.to);
        ((wtdCC[w.num]=wtdCC[w.num]||{Cuddle:{},Courtesy:{},VT:{}})[camp])[code]=wo;
      }
    }
  }

  // team-leader and campaign rollups
  const tlAgg={}, campAgg={};
  for(const camp of ['Courtesy','Cuddle','VT']){
    const campRows=facts.filter(f=>f.campaign===camp);
    if(campRows.length){
      const tls=[...new Set(campRows.map(f=>f.tl))];
      for(const tl of tls){
        const rows=campRows.filter(f=>f.tl===tl);
        const codes=[...new Set(rows.map(f=>f.code))];
        const o=agg(rows,null);
        for(const c of codes) if(primaryCamp[c]===camp&&adj[c]){ o.canc+=adjC(c); o.ref+=adj[c].r||0; }
        o.cancPct=o.sales?o.canc/o.sales:null; o.refPct=o.sales?o.ref/o.sales:null;
        o.hc=codes.length;
        o.onT=codes.filter(c=>mtdCC[camp][c]&&mtdCC[camp][c].pctT!=null&&mtdCC[camp][c].pctT>=S.settings.onTarget).length;
        tlAgg[camp+'|'+tl]=o;
      }
      const codes=[...new Set(campRows.map(f=>f.code))];
      const o=agg(campRows,null);
      for(const c of codes) if(primaryCamp[c]===camp&&adj[c]){ o.canc+=adjC(c); o.ref+=adj[c].r||0; }
      o.cancPct=o.sales?o.canc/o.sales:null; o.refPct=o.sales?o.ref/o.sales:null;
      o.hc=codes.length;
      o.onT=codes.filter(c=>mtdCC[camp][c]&&mtdCC[camp][c].pctT!=null&&mtdCC[camp][c].pctT>=S.settings.onTarget).length;
      campAgg[camp]=o;
    }
  }
  // headline totals stay VAS — tracker-unit sales are a different product with no GWP
  const grand=agg(facts.filter(f=>f.campaign!=='VT'),null);
  for(const c in adj){ grand.canc+=adjC(c); grand.ref+=adj[c].r||0; }
  grand.cancPct=grand.sales?grand.canc/grand.sales:null; grand.refPct=grand.sales?grand.ref/grand.sales:null;

  // QA period average
  let qs=0,qn=0; for(const d in S.evals){ if(d<range.from||d>range.to) continue;
    for(const c in S.evals[d]) for(const v of S.evals[d][c]){qs+=(typeof v==='number'?v:v.s);qn++;} }

  return {range,dates,weeks,facts,agents,byAgentDay,mtdCC,wtdCC,tlAgg,campAgg,grand,unmatched,term,primaryCamp,qaFor,
     qaAvg:qn?qs/qn/100:null,qaN:qn,periodKey,
     dailyByDate:(()=>{ const o={}; facts.forEach(f=>{ const t=o[f.date]=o[f.date]||{Cuddle:0,Courtesy:0,VT:0}; t[f.campaign]+=f.sales; }); return o; })()};
}

const $=s=>document.querySelector(s);
function render(){ renderAll(); }  // engine's removeFile() calls render()

/* ---------- icons (Lucide-style, inline) ---------- */

/* ---------- misc helpers ---------- */
const fmtR=(x,d=0)=>(x==null||!isFinite(x))?'–':'R '+fmtNum(x,d);
const AV_HUES=[212,168,262,16,338,120,42,282,196,88];
function avatarOf(name,code,cls=''){
  const h=AV_HUES[(code||'').split('').reduce((s,c)=>s+c.charCodeAt(0),0)%AV_HUES.length];
  const ini=(name||'?').split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
  return `<span class="avatar ${cls}" style="background:linear-gradient(135deg,hsl(${h} 62% 46%),hsl(${(h+40)%360} 62% 38%))">${esc(ini)}</span>`;
}
function deltaChip(cur,prev,{invert=false,d=0}={}){
  if(prev==null||!isFinite(prev)||prev===0||cur==null) return '<span class="delta flat">—</span>';
  const p=(cur-prev)/Math.abs(prev);
  if(Math.abs(p)<0.005) return '<span class="delta flat">0%</span>';
  const dir=p>0?'up':'down', arrow=p>0?'▲':'▼';
  return `<span class="delta ${dir} ${invert?'inv':''}" title="vs previous period (per-day basis)">${arrow} ${(Math.abs(p)*100).toFixed(Math.abs(p)<0.1?1:0)}%</span>`;
}
function pctPill(x,warnAt=0.75){
  if(x==null||!isFinite(x)) return '–';
  const cls=x>=S.settings.onTarget?'pgood':(x>=warnAt?'pwarn':'pcrit');
  return `<span class="pill ${cls}">${fmtPct(x)}</span>`;
}
const campChip=c=>`<span class="campchip"><i style="background:var(--${(c||'').toLowerCase()})"></i>${c}</span>`;
const CAMPC={Cuddle:'var(--cuddle)',Courtesy:'var(--courtesy)',VT:'var(--vt)'};

/* ---------- daily series builders ---------- */
function seriesBy(fn,filter){ // -> {dates, values[]}
  if(!M) return {dates:[],values:[]};
  const per={}; M.dates.forEach(d=>per[d]=0);
  for(const f of M.facts){ if(filter&&!filter(f)) continue; per[f.date]+=fn(f)||0; }
  return {dates:M.dates, values:M.dates.map(d=>per[d])};
}
function ratioSeries(numFn,denFn,filter){
  if(!M) return {dates:[],values:[]};
  const n={},d={}; M.dates.forEach(x=>{n[x]=0;d[x]=0;});
  for(const f of M.facts){ if(filter&&!filter(f)) continue; n[f.date]+=numFn(f)||0; d[f.date]+=denFn(f)||0; }
  return {dates:M.dates, values:M.dates.map(x=>d[x]?n[x]/d[x]:null)};
}
function qaSeries(code){
  if(!M) return {dates:[],values:[]};
  const out={dates:[],values:[]};
  for(const d of Object.keys(S.evals).sort()){
    if(d<M.range.from||d>M.range.to) continue;
    let s=0,n=0;
    if(code){ (S.evals[d][code]||[]).forEach(v=>{s+=(typeof v==='number'?v:v.s);n++;}); }
    else for(const c in S.evals[d]) S.evals[d][c].forEach(v=>{s+=(typeof v==='number'?v:v.s);n++;});
    if(n){ out.dates.push(d); out.values.push(s/n); }
  }
  return out;
}

/* ---------- SVG chart kit ---------- */
let CHART_ID=0;
function sparkSVG(values,{color='var(--accent)',w=200,h=44,fill=true}={}){
  const vs=values.filter(v=>v!=null);
  if(vs.length===1) return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="${color}" stroke-width="1.6" stroke-dasharray="3 4" opacity=".5"/>
    <circle cx="${w/2}" cy="${h/2}" r="3.2" fill="${color}"/></svg>`;
  if(vs.length<2) return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
  const min=Math.min(...vs),max=Math.max(...vs),span=(max-min)||1;
  const pts=values.map((v,i)=>v==null?null:[(i/(values.length-1))*w, h-5-((v-min)/span)*(h-12)]);
  const line=pts.filter(Boolean).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const id='sg'+(++CHART_ID);
  const last=pts.filter(Boolean).slice(-1)[0];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${fill?`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}L${w} ${h}L0 ${h}Z" fill="url(#${id})"/>`:''}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${last?`<circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/>`:''}</svg>`;
}
// big multi-series line/area chart with crosshair tooltip
function lineChart(box,{dates,series,h=250,money=false,pct=false,area=true}){
  const W=640,P={l:44,r:14,t:14,b:30};
  const all=series.flatMap(s=>s.values).filter(v=>v!=null);
  if(!all.length) return `<div class="empty">No data in this period</div>`;
  if(dates.length<2){
    // one day loaded: show that day as bars — the trend line grows as more days arrive
    const fmtV=v=>pct?fmtPct(v/100,1):(money?fmtR(v):fmtNum(v,v<20&&v%1?1:0));
    const maxv=Math.max(...series.map(s=>s.values[0]||0))||1;
    const bw=Math.min(110,380/series.length), gap=26;
    const total=series.length*bw+(series.length-1)*gap, x0=(640-total)/2;
    const base=h-46, top=34;
    const bars=series.map((s,i)=>{
      const v=s.values[0]||0, bh=Math.max(4,(base-top)*(v/maxv));
      const x=x0+i*(bw+gap);
      return `<rect class="bar" x="${x}" y="${base-bh}" width="${bw}" height="${bh}" rx="8" fill="${s.color}" opacity=".85"/>
        <text x="${x+bw/2}" y="${base-bh-10}" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${fmtV(v)}</text>
        ${series.length>1?`<text x="${x+bw/2}" y="${base+16}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${esc(s.name)}</text>`:''}`;
    }).join('');
    return `<div class="chartbox draw"><svg viewBox="0 0 640 ${h}">
      <line x1="40" x2="600" y1="${base}" y2="${base}" stroke="var(--stroke)"/>
      ${bars}
      <text x="320" y="${h-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${fmtDay(dates[0])} — the trend line appears as more days are uploaded</text>
    </svg></div>`;
  }
  let min=Math.min(0,...all),max=Math.max(...all); if(max===min)max=min+1;
  const pad=(max-min)*0.06; max+=pad;
  const x=i=>P.l+(W-P.l-P.r)*i/(dates.length-1);
  const y=v=>P.t+(h-P.t-P.b)*(1-(v-min)/(max-min));
  const fmtV=v=>pct?fmtPct(v/100,1):(money?fmtR(v):fmtNum(v,v<20?1:0));
  const ticks=[0,.25,.5,.75,1].map(f=>min+(max-min)*f);
  let defs='',paths='';
  series.forEach((s,si)=>{
    const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v)]);
    const line=pts.map((p,i)=>p?((i&&pts[i-1])?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1):'').join('');
    const id='gc'+(++CHART_ID);
    if(area&&si===0){
      defs+=`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".30"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
      const fp=pts.filter(Boolean);
      if(fp.length) paths+=`<path class="fillarea" d="${line}L${fp[fp.length-1][0]} ${h-P.b}L${fp[0][0]} ${h-P.b}Z" fill="url(#${id})"/>`;
    }
    paths+=`<path class="line" d="${line}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  const grid=ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid-line)"/>
    <text x="${P.l-7}" y="${y(t)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${fmtV(t)}</text>`).join('');
  const step=Math.ceil(dates.length/10);
  const xl=dates.map((d,i)=>i%step?'':`<text x="${x(i)}" y="${h-P.b+15}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.slice(8)}/${d.slice(5,7)}</text>`).join('');
  const id='lc'+(++CHART_ID);
  setTimeout(()=>wireLine(id,{dates,series,x:P,W,h,money,pct}),0);
  return `<div class="chartbox draw" id="${id}"><svg viewBox="0 0 ${W} ${h}" role="img">
    <defs>${defs}</defs>${grid}${paths}
    <line x1="${P.l}" x2="${W-P.r}" y1="${h-P.b}" y2="${h-P.b}" stroke="var(--stroke)"/>
    <line class="cross" y1="${P.t}" y2="${h-P.b}" stroke="var(--stroke2)" stroke-dasharray="3 3" style="display:none"/>
    <rect class="hit" x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${h-P.t-P.b}" fill="transparent"/></svg>
    <div class="tip"></div>
    ${series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}</div>`;
}
function wireLine(id,cfg){
  const box=document.getElementById(id); if(!box) return;
  const svg=box.querySelector('svg'),hit=box.querySelector('.hit'),cross=box.querySelector('.cross'),tip=box.querySelector('.tip');
  const {dates,series}=cfg,P=cfg.x,W=cfg.W;
  hit.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect();
    const fx=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(dates.length-1,Math.round((fx-P.l)/(W-P.l-P.r)*(dates.length-1))));
    const cx=P.l+(W-P.l-P.r)*i/(dates.length-1);
    cross.style.display='block'; cross.setAttribute('x1',cx); cross.setAttribute('x2',cx);
    tip.style.display='block';
    const bx=box.getBoundingClientRect();
    tip.style.left=Math.min(bx.width-165,Math.max(0,e.clientX-bx.left+14))+'px';
    tip.style.top=Math.max(0,e.clientY-bx.top-14)+'px';
    tip.innerHTML=`<div class="t">${fmtDay(dates[i])}</div>`+series.map(s=>{
      const v=s.values[i];
      return `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><b>${v==null?'–':(cfg.pct?fmtPct(v/100,1):(cfg.money?fmtR(v):fmtNum(v,v<20&&v%1?1:0)))}</b></div>`;
    }).join('');
  });
  hit.addEventListener('mouseleave',()=>{tip.style.display='none';cross.style.display='none';});
}
// stacked daily bars (two campaigns)
function stackChart(box){
  const days=M.dates;
  if(!days.length) return '<div class="empty">No data</div>';
  const W=640,h=250,P={l:40,r:12,t:12,b:30};
  const vals=days.map(d=>M.dailyByDate[d]||{Cuddle:0,Courtesy:0,VT:0});
  const max=Math.max(10,...vals.map(v=>v.Cuddle+v.Courtesy+(v.VT||0)))*1.05;
  const bw=Math.min(26,(W-P.l-P.r)/days.length-3);
  const x=i=>P.l+(W-P.l-P.r)*(i+0.5)/days.length;
  const y=v=>P.t+(h-P.t-P.b)*(1-v/max);
  let bars='';
  vals.forEach((v,i)=>{
    const xc=x(i)-bw/2, yCo=y(v.Courtesy), yCu=y(v.Courtesy+v.Cuddle);
    bars+=`<g class="dbar" data-i="${i}">
      <rect class="bar" style="animation-delay:${i*18}ms" x="${xc}" y="${yCo}" width="${bw}" height="${Math.max(0,h-P.b-yCo)}" fill="var(--courtesy)" rx="3"/>
      <rect class="bar" style="animation-delay:${i*18}ms" x="${xc}" y="${yCu}" width="${bw}" height="${Math.max(0,yCo-yCu-(v.Cuddle?2:0))}" fill="var(--cuddle)" rx="3"/>
      <rect x="${xc-2}" y="${P.t}" width="${bw+4}" height="${h-P.t-P.b}" fill="transparent"/></g>`;
  });
  const ticks=[0,.25,.5,.75,1].map(f=>Math.round(max*f));
  const grid=ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid-line)"/>
    <text x="${P.l-6}" y="${y(t)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${t}</text>`).join('');
  const step=Math.ceil(days.length/10);
