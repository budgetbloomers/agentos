/* ---------------- CHART HELPERS ---------------- */
function killCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
/* Chart.js (~200 KB parsed) is fetched the first time a chart is actually drawn.
   It used to be a blocking <script> in the head, so it was downloaded, parsed and
   compiled before the sign-in box would respond — for a library that cannot draw
   anything until somebody has logged in and a page has rendered. Its defaults are
   applied on load, which is why they no longer sit at the top level. */
let __chartP=null;
function ensureChart(){
  if(window.Chart)return Promise.resolve();
  if(!__chartP)__chartP=new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    el.onload=()=>{try{Chart.defaults.font.family="'Inter','Segoe UI',sans-serif";Chart.defaults.color='#A9BAD4';Chart.defaults.font.size=11;}catch(e){}res()};
    el.onerror=()=>{__chartP=null;rej(new Error('chart library unavailable'))};
    document.head.appendChild(el);
  });
  return __chartP;
}
function mkChart(id,cfg){const el=document.getElementById(id);if(!el)return;
  /* Not loaded yet: come back when it is. No caller reads the return value, so
     returning nothing here is safe — but the canvas may be gone by then (the user
     navigated), so re-resolve it rather than drawing into a detached element. */
  if(!window.Chart){ensureChart().then(()=>{if(document.getElementById(id))mkChart(id,cfg)}).catch(()=>{});return}
  // Two renders can land back-to-back (local-snapshot paint, then the cloud refresh) and
  // both schedule their deferred chart creation — the earlier one may claim THIS render's
  // canvas first. A canvas already bound to a chart is released before reuse, never fatal.
  try{const prev=Chart.getChart(el);if(prev){prev.destroy();const i=charts.indexOf(prev);if(i>=0)charts.splice(i,1)}}catch(e){}
  const c=new Chart(el.getContext('2d'),cfg);charts.push(c);return c}
const PALETTE=['#2563EB','#38BDF8','#6D4AE0','#158A4C','#F59E0B','#DC2626','#0EA5E9','#94A3B8','#10B981','#E879F9'];
function groupCount(rows,field,filt){const m={};rows.forEach(r=>{if(filt&&!passFilter(r,filt))return;const k=r[field]||'(none)';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
/* Trend / sparkline x-axis range. The default "all data" window uses a 1900-01-01
   sentinel for `from`; walking 90-120 days forward from THAT plotted every point in
   1900 and left every chart blank (the data is in 2026). So: resolve the sentinel to
   the real data start, end at the window end (capped to the data anchor = latest dated
   row), and span back at most maxDays — a wide window then shows the MOST RECENT
   activity, not empty ancient buckets. Every series on one chart shares this range, so
   multi-line axes stay aligned. */
function seriesRange(win,maxDays){
  const anc=isoDay(anchorDate());
  const to=win.to>anc?anc:win.to;
  let from=win.from<'2000-01-01'?minDataDay():win.from;
  const t=new Date(to+'T12:00:00'),cap=new Date(t);cap.setDate(cap.getDate()-(maxDays-1));
  if(new Date(from+'T12:00:00')<cap)from=isoDay(cap);
  return{from,to};
}
function dailySeries(rows,win,valFn){
  const R=seriesRange(win,220);   // ~7 months so a stale-but-loaded source (e.g. attendance) still trends
  const byDay={};rows.forEach(r=>{if(r._d)(byDay[r._d]=byDay[r._d]||[]).push(r)});
  const f=new Date(R.from+'T12:00:00'),t=new Date(R.to+'T12:00:00');
  const days=Math.max(1,Math.min(240,Math.round((t-f)/864e5)+1));   // backstop ≥ seriesRange cap, so the range is never clipped
  const labels=[],data=[];
  for(let i=0;i<days;i++){const d=new Date(f);d.setDate(d.getDate()+i);const day=isoDay(d);
    labels.push(day.slice(5));data.push(valFn(byDay[day]||[]))}
  return{labels,data};
}
function doughnut(id,entries,cutout){
  mkChart(id,{type:'doughnut',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:PALETTE,borderWidth:2,borderColor:'#0A1730'}]},
   options:{cutout:cutout||'62%',plugins:{legend:{position:'right',labels:{boxWidth:9,boxHeight:9,padding:9,font:{size:11}}}},maintainAspectRatio:false}});
}
function hbar(id,entries,color){
  mkChart(id,{type:'bar',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:color||'#2563EB',borderRadius:5,barThickness:14}]},

/* %-to-target foot for KPI tiles. "now" = current value ÷ target (the KPI's green
   threshold from the rules — edit it and this line re-bases). "proj" = where the
   period lands: counts extrapolate by workday run-rate; rates blend the period
   average with the trailing week for the workdays still to come. A fully-elapsed
   window projects to itself, so proj = now once the month is done. */
function kpiTargetFoot(k,v,win,nowOnly){
  const T=k.green;
  if(T==null||!T||v==null)return '';
  const f=x=>(Math.round(x/T*1000)/10).toLocaleString()+'%';
  const good=x=>k.dir==='higher'?x>=T:x<=T;
  const nowSpan='<span class="delta '+(good(v)?'up':'down')+'" title="Current ÷ target ('+esc(fmtVal(T,k.format))+'). 100% = on target.">now '+f(v)+' of tgt</span>';
  if(nowOnly)return nowSpan;   // snapshots: a point-in-time figure can't be projected
  const a=isoDay(anchorDate());
  const end=win.to<=a?win.to:a;
  /* The period the projection runs TO. Every range mode but Month-to-date already ends on the
     newest data day, so elapsed equals total and there is correctly nothing to extrapolate.
     MTD is the one mode where "proj" is read as "by month end", and it used to stop at the
     latest data day too — silently reprinting today's number as the projection. */
  let tot=workDays(win);
  if(state.range.mode==='mtd'&&win.from>'2000-01-01'){
    const me=new Date(win.from.slice(0,7)+'-01T12:00:00');me.setMonth(me.getMonth()+1);me.setDate(0);
    tot=workDays({from:win.from,to:isoDay(me)});
  }
  const ela=workDays({from:win.from,to:end<win.from?win.from:end});
  let proj=v;
  if(ela<tot&&!k.special){   // specials (gwpAvg, slaBreach, …) project to themselves
    if(k.type==='count'||k.type==='sum'){proj=v/Math.max(1,ela)*tot}   // flows: workday run-rate
    else if(k.type!=='distinct'){   // prevalence distincts don't scale with time — leave at v
      const rf=new Date(end+'T12:00:00');rf.setDate(rf.getDate()-6);const rfd=isoDay(rf);
      const recent=evalKPI(k,{from:rfd>win.from?rfd:win.from,to:end});
      if(recent!=null)proj=(v*ela+recent*(tot-ela))/tot}
  }
  return nowSpan
   +'<span class="delta '+(good(proj)?'up':'down')+'" title="Projected period-end ÷ target. Counts extrapolate by workday run-rate; rates carry the trailing week forward over the remaining days.">proj '+f(proj)+'</span>';
}
/* DEFERRED KPI FOOTERS — the tile VALUE paints immediately; the delta (a full extra
   prev-period evaluation) and the 90-day sparkline (one evalKPI per DAY — the single
   heaviest render cost with big fact tables) are computed afterwards in a yielding queue,
   one tile per tick, and cached per (kpi, window, filters, data version) so a revisit is
   instant. Page-render time stops scaling with sparkline cost — "no delay" doctrine. */
const _kfCache=new Map();
function kpiFootFull(k,win){
  const key=k.id+'|'+win.from+'~'+win.to+'|'+JSON.stringify(state.filters)+'|'+_dataVer;
  let h=_kfCache.get(key);
  if(h!=null)return h;
  const v=evalKPI(k,win);
  const tf=kpiTargetFoot(k,v,win,false);
  let deltaHtml='';
  if(tf)deltaHtml=tf;
  else{const d=kpiDelta(k,win);
    if(d){const up=d.val>=0;const good=(k.dir==='higher')===up;
      deltaHtml='<span class="delta '+(Math.abs(d.val)<0.05?'flat':good?'up':'down')+'">'+(up?'↑':'↓')+' '+Math.abs(Math.round(d.val*10)/10).toLocaleString()+d.unit+'</span><span class="asof">vs prev period</span>'}
    else deltaHtml='<span class="asof">No prior period</span>'}
  const series=kpiSeries(k,win);
  h=deltaHtml+(series?sparkSVG(series,COLHEX[DOMCOL[k.domain]||'blue']):'');
  if(_kfCache.size>1500)_kfCache.clear();
  _kfCache.set(key,h);
  return h;
}
let _kfQueue=[];
function scheduleKpiFoots(){
  _kfQueue=[...document.querySelectorAll('[data-kfoot]')];
  if(!_kfQueue.length)return;
  (function step(){
    const el=_kfQueue.shift();
    if(!el)return;
    if(el.isConnected){
      const k=state.kpis.find(x=>x.id===el.getAttribute('data-kfoot'));
      const w=(el.getAttribute('data-kwin')||'').split('~');
      if(k&&w.length===2){try{el.innerHTML=kpiFootFull(k,{from:w[0],to:w[1]})}catch(e){}}
      el.removeAttribute('data-kfoot');
    }
    if(_kfQueue.length)setTimeout(step,0);   // yield between tiles — first paint always wins
  })();
}
function kpiTile(k,win){
  const v=evalKPI(k,win);
  const rag=ragOf(k,v);
  const snap=kpiSnapshotSrc(k);
  const col=COLHEX[DOMCOL[k.domain]||'blue'];
  const unitTag=k.format==='hoursnum'?'':'';
  let foot;
  if(snap){const tf=kpiTargetFoot(k,v,win,snap);const fr=freshness(k.src||k.num?.src||k.den?.src);
    foot='<div class="kpi-foot">'+tf+'<span class="asof">Snapshot · as of '+(fr.batch?new Date(fr.batch.uploaded_at).toLocaleDateString():'—')+'</span></div>'}
  else{
    const key=k.id+'|'+win.from+'~'+win.to+'|'+JSON.stringify(state.filters)+'|'+_dataVer;
    const cached=_kfCache.get(key);
    foot=cached!=null?'<div class="kpi-foot">'+cached+'</div>'
      :'<div class="kpi-foot" data-kfoot="'+esc(k.id)+'" data-kwin="'+esc(win.from)+'~'+esc(win.to)+'"><span class="asof">…</span></div>';
  }
  return '<div class="kpi" onclick="kpiInfo(\''+k.id+'\')" title="Click for definition & interpretation">'
    +(k.green!=null?'<span class="rag-dot '+rag+'"></span>':'')
    +'<div class="kpi-top"><span class="kpi-ic" style="background:'+(COLSOFT[DOMCOL[k.domain]]||'var(--blue-soft)')+'">'+icon(k.icon||'grid',col)+'</span><span class="kpi-name">'+esc(k.name)+'</span></div>'
    +'<div class="kpi-val num">'+(k.format==='zar'&&v!=null?zarStack(v):fmtVal(v,k.format))+unitTag+'</div>'
    +foot+'</div>';
}
/* CALLX IS RETIRED, THE TILES ARE NOT (Ops audit, 2026-09-14). The Executive Command Centre led with
   'Total Calls 0 ↓ 100%' and 'Answer Rate —' for the whole of September: those tiles read
   CALLX_CALL_RECORDS, and the floor has dialled on ViciDial since CALLX_RETIRED. For a window that
   starts on or after the cutover a CallX tile is SWAPPED for its ViciDial twin where one exists and
   dropped where none does (unique calls, outbound calls — the ViciDial export has no such cut), with a
   line saying so. A window that spans the cutover keeps both — August's CallX history still counts. */
const CALLX_TO_VICI={total_calls:'vici_dials',answer_rate:'vici_answer',talk_time:'vici_talk'};
/* the id to read for a window — the ViciDial twin once the window starts after the cutover.
   Used by every Executive path that names a KPI directly (rings, the nutshell sentence, the
   "where value is leaking" checks), which kpiRow's swap below does not reach. */
function kpiIdFor(id,win){
  if(!(win&&win.from&&win.from>=CALLX_RETIRED))return id;
  const k=state.kpis.find(x=>x.id===id);
  return (k&&k.src==='CALLX_CALL_RECORDS'&&CALLX_TO_VICI[id])?CALLX_TO_VICI[id]:id;
}
function kpiRow(domain,win,ids){
  const afterCutover=!!(win&&win.from&&win.from>=CALLX_RETIRED);
  const isCallx=k=>k.src==='CALLX_CALL_RECORDS';
  let want=ids;
  if(afterCutover&&ids) want=[...new Set(ids.map(id=>{const k=state.kpis.find(x=>x.id===id);return (k&&isCallx(k)&&CALLX_TO_VICI[id])?CALLX_TO_VICI[id]:id}))];
  let ks=state.kpis.filter(k=>k.show&&(want?want.includes(k.id):k.domain===domain));
  let hidden=0;
  if(afterCutover){const b4=ks.length;ks=ks.filter(k=>!isCallx(k));hidden=b4-ks.length}
  const note=hidden?'<div class="note" style="margin:-4px 0 10px;font-size:12px;color:var(--muted)">'+hidden+' CallX tile'+(hidden>1?'s':'')+' hidden — CallX was retired on '+CALLX_RETIRED+'; the floor dials on ViciDial, whose tiles carry this window.</div>':'';
  const bar=domain?'<div style="display:flex;justify-content:flex-end;margin:-2px 0 8px"><button class="btn small" onclick="openThresh(&#39;'+domain+'&#39;)">⚙ Thresholds &amp; rules for this area</button></div>':'';
  return bar+note+'<div class="kpi-grid">'+ks.map(k=>kpiTile(k,win)).join('')+'</div>';
}

function deptStatus(domain){
  const ks=state.kpis.filter(k=>k.show&&k.domain===domain&&k.green!=null);
  const win=periodWindow();let worst='g',any=false;
  ks.forEach(k=>{const r=ragOf(k,evalKPI(k,win));if(r==='n')return;any=true;
    if(r==='r')worst='r';else if(r==='a'&&worst!=='r')worst='a'});

function leakTable(win){
  const rows=[];
  const K=id=>state.kpis.find(k=>k.id===id);
  const val=id=>{const k=K(id);return k?evalKPI(k,win):null};
  /* Each signal fires on its OWN KPI's amber band, read live from the Dictionary. These were
     hardcoded 55 / 90 / 90, so the list disagreed with the RAG dot on the same screen (Answer
     Rate is amber from 45) and a threshold edit moved the dot but never the list — which
     teaches people that one of the two is lying. The file's rule: a threshold that belongs to
     a rule is never written as a literal. */
  const under=id0=>{const id=kpiIdFor(id0,win);const k=K(id);if(!k)return null;const v=evalKPI(k,win);
    const lim=k.amber!=null?k.amber:k.green;
    if(v==null||lim==null)return null;
    return (k.dir==='higher'?v<lim:v>lim)?{v,lim}:null};
  const ar=under('answer_rate'),cs=under('clean_sale_rate'),at=under('attendance_rate');
  const uv=val('unverified_sales'),bk=val('open_backlog');
  if(ar)rows.push(['Connection','Answer rate '+fmtVal(ar.v,'pct')+' — below the '+fmtVal(ar.lim,'pct')+' watch line · lead list / dialling windows','Leon']);
  if(cs)rows.push(['Quality','Clean-sale rate '+fmtVal(cs.v,'pct')+' — below '+fmtVal(cs.lim,'pct')+' · dirty sales cost more than missed ones','Jared']);
  if(at)rows.push(['People','Attendance '+fmtVal(at.v,'pct')+' — below '+fmtVal(at.lim,'pct')+' · the denominator is shrinking','Claudell']);
  if(uv!=null&&uv>0)rows.push(['Assurance',fmtVal(uv,'int')+' activations have no QA record','Jared']);
  if(bk!=null&&bk>0)rows.push(['Backlog',fmtVal(bk,'int')+' open cases awaiting contact','Nick']);
  if(!rows.length)return '<div class="empty">No leaks detected against current thresholds.</div>';
  return '<table class="tbl"><thead><tr><th class="noclick">Area</th><th class="noclick">Signal</th><th class="noclick">Owner</th></tr></thead><tbody>'
    +rows.map(r=>'<tr><td><span class="pill b">'+r[0]+'</span></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')+'</tbody></table>';
}

/* Built once. toLocaleString WITH an options object constructs a fresh Intl.NumberFormat per
   call — the dominant cost in table builds across the suite (perf audit, 2026-08-28). */
const __zar2fmt=new Intl.NumberFormat('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
function zar2(v){return 'R'+__zar2fmt.format(Number(v||0))}
function vatPct(){const p=parseFloat((state.rules.vatRate?.vals||[])[0]);return (isNaN(p)?15:p)/100}
function exVat(v){return v/(1+vatPct())}
/* THE R99 FLOOR, AT THE CENT THE SOURCE BOOKS IT (scoring audit, 2026-09-03). The Two-Check
   value line is R99 INCL VAT. A R99 product's charge is booked by Salesforce as R86,08 EX-VAT,
   which grosses back up to R98,99 — so an agent whose every sale IS the R99 product read
   "below the R99 line" and fired R4 GWP Value Failure while meeting the rule exactly (30 of
   59 rated agents on the PULSE side sat at precisely R86,08). The floor is taken to the cent
   ex-VAT, the way the money it is compared with is stored, then grossed back up through the
   same vatRate rule. Display strings still quote T('gwpFloor') — the rule is unchanged, only
   the comparison basis. Mirrors gwpFloorEx in nicks_code/index.html compositeFor. */
function gwpFloorEx(){return Math.floor(nbaVal('gwpFloor',99)/(1+vatPct())*100)/100}
function gwpFloorIncl(){return gwpFloorEx()*(1+vatPct())-1e-9}
function zarStack(v){return fmtVal(v,'zar')+'<div class="exv">'+fmtVal(exVat(v),'zar')+' ex VAT</div>'}
function zar2Stack(v){return zar2(v)+'<div class="exv">'+zar2(exVat(v))+' ex VAT</div>'}
function cycleCalc(mode){
  /* mode: 'cycle' (default, 26th-anchored VAS cycle) · 'month' (calendar-month backup
     view, client 2026-07-20) · 'win' (linked to the main dashboard range filter). All
     three share one maths path — only the window and day-count denominator change. */
  mode=mode||'cycle';
  const vat=vatPct();
  const targets=[];(state.rules.cycleTargets?.vals||[]).forEach(v=>{const i=String(v).lastIndexOf(':');const t=parseFloat(String(v).slice(i+1));if(!isNaN(t))targets.push([String(v).slice(0,i).trim(),t])});
  let start,cw,totD;
  if(mode==='month'){
    const a=isoDay(anchorDate());start=a.slice(0,8)+'01';
    const e=new Date(a.slice(0,7)+'-01T12:00:00');e.setMonth(e.getMonth()+1);e.setDate(0);
    cw={from:start,to:isoDay(e)};totD=workDays(cw);
  }else if(mode==='win'){
    const w=periodWindow();start=winFrom(w);cw={from:start,to:w.to};totD=workDays(cw);
  }else{
    start=String((state.rules.cycleStart?.vals||[])[0]||'').trim();
    if(!start)return null;
    totD=parseFloat((state.rules.cycleDialingDays?.vals||[])[0])||21;
    cw={from:start,to:'2099-12-31'};
  }
  const prem=(function(){const f=state.filters;try{return accountPremiums(cw)}finally{state.filters=f}})();
  const dial=diallerRows(cw);   // both diallers across the 2026-09-01 cutover
  /* Fold the raw roster queue to the campaign key the targets are written in, exactly as every
     other campaign view in the app does. This was the one place that keyed on the RAW queue, so
     it depended on the Agent List's Campaign-format tab winning the preferHeader race: on a
     workbook carrying only the older Que-format tab the queue reads "Cuddle Calls", the target
     lookup misses, and both panels show R0.00 against a live target. Unrecognised queues
     (Nesting) keep their own name so their money stays visible instead of pooling. */
  const campKey=q=>campBucket(q)||String(q||'').trim()||'(no queue)';
  const byCamp={},campSales={},dialDays={},moneyDays={},tlAgg={},campOfAcc={};let unatt=0;
  prem.forEach(e=>{if(!e.cb){unatt+=e.gwp||0;return}
    const q=campKey(state.cbInfo[e.cb]?.queue);byCamp[q]=(byCamp[q]||0)+(e.gwp||0);campSales[q]=(campSales[q]||0)+1;
    campOfAcc[e.acc]=q;                                  // where this account's money landed
    const tl=(state.cbInfo[e.cb]?.tl)||'(unassigned)';const T=tlAgg[tl]=tlAgg[tl]||{gwp:0,sales:0,q:{}};T.gwp+=(e.gwp||0);T.sales++;T.q[q]=(T.q[q]||0)+1});
  /* Days Past follows the MONEY, not the dialler. This panel projects GWP, so its
     denominator has to be the days the campaign actually banked money. Counting dialler
     days alone divided a whole cycle's premium by 1 whenever the call-record export
     covered fewer days than the BI file — BI lands monthly, call records daily — which
     projected ~1500% to target. Every BI row's day is attributed through the SAME
     account -> cb -> queue path the premium split above uses, so a day can never be
     counted against a campaign its money was not. Unattributed accounts (no cb) are
     excluded from both, exactly as they are from byCamp. */
  /* Week-on-week rollup (Mon-anchored ISO weeks) — the calendar-month view reports on a
     week-on-week basis; harmless and available in the other modes too. */
  const WK={};
  rowsFor('BI_ACTIVE_CASES',cw).forEach(r=>{
    if(r._d){const d=new Date(r._d+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));const k=isoDay(d);
      const o=WK[k]=WK[k]||{ex:0,acc:new Set()};o.ex+=r.charge_amount||0;o.acc.add(r.account_number)}

function agingTable(open){

/* ===================== QA CLIENT VIEWS (2026-07-20) ===================== */
/* Phase a connected call reached before ending — reads the callPhases rule, same
   band logic as callBandFor. Duration-derived proxy (see rule help). */
function phaseBandFor(sec){
  const rungs=(state.rules.callPhases?.vals||[]).map(v=>{const i=String(v).indexOf(':');return{n:parseFloat(String(v).slice(0,i)),label:String(v).slice(i+1).trim()}}).filter(r=>!isNaN(r.n)).sort((a,b)=>a.n-b.n);
  let cur=rungs.length?rungs[0].label:'(no phases)';
  rungs.forEach(r=>{if((sec||0)>=r.n)cur=r.label});
  return cur;
}
function phaseLabels(){return (state.rules.callPhases?.vals||[]).map(v=>String(v).slice(String(v).indexOf(':')+1).trim())}
/* Drop-off by call phase: of OUTBOUND dial attempts, how many ended in each phase
   (= where the agent was cut off). Optionally scoped to one campaign bucket. */
function callPhaseDropoff(win,campFilter){
  const calls=diallerRows(win).filter(c=>c.agent&&c.call_type!=='inbound');
  const labels=phaseLabels();const dist={};labels.forEach(l=>dist[l]=0);let total=0;
  calls.forEach(c=>{if(campFilter){const cb=c._cb||cbOf(c.agent);const cc=cb?campBucket(state.cbInfo[cb]?.queue):null;if(cc!==campFilter)return}
    const ph=phaseBandFor(c.billable_seconds);dist[ph]=(dist[ph]||0)+1;total++});
  return{labels,dist,total};
}
/* QA rolled up by Matrix campaign: evaluations, pass rate, avg score, % sales
   (BI sales for the campaign ÷ QA'd calls), critical-fail rate. campBucket folds the
   raw campaign/queue spelling; unbucketed evals aggregate under '(other)'. Sales come
   from accountPremiums — the single money model — bucketed by the owning agent's queue. */
function qaByCampaign(qa,win){
  const B={};const bump=k=>(B[k]=B[k]||{n:0,pass:0,crit:0,s:0,sn:0,sale:0});
  qa.forEach(r=>{const c=campBucket(r.campaign)||'(other)';const o=bump(c);o.n++;
    if(resolveRule('$qaPass').includes(r.escalation_decision))o.pass++;
    if(resolveRule('$qaCritical').includes(r.escalation_decision))o.crit++;
    if(r.score_percent!=null){o.s+=r.score_percent;o.sn++}});
  (function(){const f=state.filters;try{accountPremiums(win).forEach(e=>{if(!e.cb)return;
    const c=campBucket(state.cbInfo[e.cb]?.queue)||'(other)';bump(c).sale++})}finally{state.filters=f}})();
  return B;
}
/* Live QA pipeline: evaluations not yet closed out (qa_status has no "closed"),
   the items still pending action. Ordered most-severe first. */
function qaPipeline(qa){
  const open=qa.filter(r=>!/closed/i.test(r.qa_status||''));
  const rank=r=>resolveRule('$qaCritical').includes(r.escalation_decision)?0
    :resolveRule('$qaCoaching').includes(r.escalation_decision)?1:2;
  return open.map(r=>({r,rk:rank(r)})).sort((a,b)=>a.rk-b.rk||String(a.r.call_date||'').localeCompare(String(b.r.call_date||''))).map(x=>x.r);
}

function pageQAPerf(win){
  if(!hasData())return emptyState('QA Agent Performance needs the QA evaluations export');
  const rows=rowsFor('QA_EVALUATIONS',win);
  if(!rows.length)return emptyState('No evaluations in the selected window');
  const CRIT=resolveRule('$qaCritical'),COACH=resolveRule('$qaCoaching'),PASS=resolveRule('$qaPass');
  const A={};
  rows.forEach(r=>{const k=r.qa_agent||'(blank)';const a=A[k]=A[k]||{name:k,n:0,sec:0,crit:0,coach:0,pass:0,s:0,sn:0};
    a.n++;a.sec+=r.call_duration_seconds||0;
    if(CRIT.includes(r.escalation_decision))a.crit++;
    else if(COACH.includes(r.escalation_decision))a.coach++;
    else if(PASS.includes(r.escalation_decision))a.pass++;
    if(r.score_percent!=null){a.s+=r.score_percent;a.sn++}});
  const list=Object.values(A).sort((x,y)=>y.n-x.n);
  const G=list.reduce((g,a)=>({n:g.n+a.n,sec:g.sec+a.sec,crit:g.crit+a.crit,coach:g.coach+a.coach,pass:g.pass+a.pass,s:g.s+a.s,sn:g.sn+a.sn}),{n:0,sec:0,crit:0,coach:0,pass:0,s:0,sn:0});
  const fh=sec=>{const m=Math.round(sec/60);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
  const row=(a,gt)=>'<tr'+(gt?' style="font-weight:800;background:#F4F8FE;border-top:2px solid var(--line)"':'')+'>'
    +'<td><b>'+(gt?'ALL ASSESSORS ('+list.length+')':maskName(a.name))+'</b></td>'
    +'<td class="num" style="font-weight:800">'+a.n.toLocaleString()+'</td>'
    +'<td class="num">'+fh(a.sec)+'</td>'
    +'<td class="num">'+(a.sn?fmtVal(a.s/a.sn,'pct'):'—')+'</td>'
    +'<td>'+(a.crit?'<span class="pill r">'+a.crit+'</span>':'<span class="num">0</span>')+'</td>'
    +'<td class="num">'+(a.n?fmtVal(a.crit/a.n*100,'pct'):'—')+'</td>'
    +'<td>'+(a.coach?'<span class="pill a">'+a.coach+'</span>':'<span class="num">0</span>')+'</td>'
    +'<td class="num">'+a.pass.toLocaleString()+'</td></tr>';
  return '<div class="card" style="margin-bottom:14px">The assessors&#39; own scoreboard: how many calls each QA agent evaluated, the talk time they actually listened to (summed from Call Duration), and how they classified what they heard. Critical / Coaching / Pass follow the live rules, so a rule change re-reads every assessor. Big gaps in <b>Critical %</b> or <b>Avg score given</b> between assessors on the same period are the calibration conversation to have.</div>'
   +'<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start">'
   +'<div class="card"><div class="card-h"><span class="t">Assessor performance</span><span class="s">'+list.length+' QA agents · '+G.n.toLocaleString()+' evaluations · '+fh(G.sec)+' listened</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">QA Agent</th><th class="noclick">Evaluations</th><th class="noclick">Talk time listened</th><th class="noclick">Avg score given</th><th class="noclick">Critical fails</th><th class="noclick">Critical %</th><th class="noclick">Coaching</th><th class="noclick">Pass</th></tr></thead><tbody>'
   +list.map(a=>row(a,false)).join('')+row(G,true)
   +'</tbody></table></div></div>'
   +'<div class="card"><div class="card-h"><span class="t">Evaluations share</span></div><div style="height:260px"><canvas id="chQP1"></canvas></div></div>'
   +'</div>'
   +setTimeoutChart();
  function setTimeoutChart(){setTimeout(()=>{doughnut('chQP1',list.slice(0,8).map(a=>[maskNameText(a.name),a.n]))},0);return ''}
}
function pageWF(win){
  if(!hasData())return emptyState('Workforce needs the attendance export');

  const A0=(()=>{let m=null;(state.facts.ATTENDANCE||[]).forEach(r=>{if(r._d&&(!m||r._d>m))m=r._d});return m||isoDay(anchorDate())})();
  const monOf=k=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return isoDay(d)};
  const addD=(k,n)=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return isoDay(d)};
  const mStart=k=>k.slice(0,8)+'01';
  const prevM=k=>{const d=new Date(k+'T00:00:00');d.setDate(0);return[mStart(isoDay(d)),isoDay(d)]};
  const W={tw:{from:monOf(A0),to:A0},lw:{from:addD(monOf(A0),-7),to:addD(monOf(A0),-1)},
           tm:{from:mStart(A0),to:A0},lm:(()=>{const[f,t]=prevM(A0);return{from:f,to:t}})()};
  const pull={};for(const k in W)pull[k]=rowsFor('ATTENDANCE',W[k]);
  const stat=rows=>{const o={sched:0,p:0,abs:0,exits:0,mem:new Set()};
    rows.forEach(r=>{if(r.excluded_flag){o.exits++;return}o.sched++;if(r.present_flag)o.p++;if(r.absence_flag)o.abs++;const c=normCB(r.employee_code);if(c)o.mem.add(c)});
    o.att=o.sched?o.p/o.sched*100:null;o.absR=o.sched?o.abs/o.sched*100:null;return o};
  const S={};for(const k in pull)S[k]=stat(pull[k]);
  const pp=(a,b)=>(a==null||b==null)?null:a-b;
  const ppPill=(d,inv)=>d==null?'—':'<span class="pill '+((inv?d<=0:d>=0)?'g':'r')+'">'+(d>=0?'+':'−')+(Math.round(Math.abs(d)*10)/10).toLocaleString()+'pp</span>';
  const nPill=(a,b,inv)=>{const d=a-b;return a+' <span style="color:var(--muted)">vs '+b+'</span> <span class="pill '+((inv?d<=0:d>=0)?'g':'r')+'">'+(d>=0?'+':'−')+Math.abs(d)+'</span>'};
  const keyTeam=r=>r.reports_to||'(unassigned)';
  const keyCamp=r=>(state.cbInfo[normCB(r.employee_code)]?.queue)||'(not on roster)';
  const splitStat=(rows,keyF)=>{const M={};rows.forEach(r=>{const k=keyF(r);(M[k]=M[k]||[]).push(r)});const O={};for(const k in M)O[k]=stat(M[k]);return O};
  const splitTbl=(label,keyF)=>{
    const cur=splitStat(att,keyF),tw=splitStat(pull.tw,keyF),lw=splitStat(pull.lw,keyF),tm=splitStat(pull.tm,keyF),lm=splitStat(pull.lm,keyF);
    const keys=[...new Set([...Object.keys(cur),...Object.keys(tw),...Object.keys(tm)])].sort((a,b)=>((cur[b]?.sched)||0)-((cur[a]?.sched)||0)).slice(0,14);
    return '<div class="card" style="margin-bottom:14px"><div class="card-h"><span class="t">'+label+' — attendance movement &amp; attrition</span><span class="s">WoW/MoM windows anchor to the latest data day ('+A0+'); roster filters apply, the date filter does not</span></div>'
     +'<div style="overflow-x:auto"><table class="tbl" style="font-size:11.5px"><thead><tr><th class="noclick">'+label+'</th><th class="noclick">People</th><th class="noclick">Att % (window)</th><th class="noclick">Att WoW Δ</th><th class="noclick">Att MoM Δ</th><th class="noclick">Attrition WoW</th><th class="noclick">Attrition MoM</th></tr></thead><tbody>'
     +keys.map(k=>{const c=cur[k]||stat([]),w1=tw[k]||stat([]),w0=lw[k]||stat([]),m1=tm[k]||stat([]),m0=lm[k]||stat([]);
       return '<tr><td><b>'+(keyF===keyTeam?maskName(k):esc(k))+'</b></td><td class="num">'+c.mem.size+'</td>'
        +'<td>'+ragPill(c.att,92,85)+'</td>'
        +'<td>'+ppPill(pp(w1.att,w0.att))+'</td><td>'+ppPill(pp(m1.att,m0.att))+'</td>'
        +'<td>'+nPill(w1.exits,w0.exits,true)+'</td><td>'+nPill(m1.exits,m0.exits,true)+'</td></tr>'}).join('')
     +'</tbody></table></div></div>'};
  const fmtW=w=>w.from.slice(5)+'→'+w.to.slice(5);
  const mvCompany='<div class="card" style="margin-bottom:14px"><div class="card-h"><span class="t">Company — week-on-week &amp; month-on-month</span><span class="s">this week '+fmtW(W.tw)+' vs last '+fmtW(W.lw)+' · this month vs '+W.lm.from.slice(0,7)+'</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick"></th><th class="noclick">This week</th><th class="noclick">Last week</th><th class="noclick">WoW Δ</th><th class="noclick">This month</th><th class="noclick">Last month</th><th class="noclick">MoM Δ</th></tr></thead><tbody>'
   +'<tr><td><b>Attendance %</b></td><td class="num">'+(S.tw.att==null?'—':fmtVal(S.tw.att,'pct'))+'</td><td class="num">'+(S.lw.att==null?'—':fmtVal(S.lw.att,'pct'))+'</td><td>'+ppPill(pp(S.tw.att,S.lw.att))+'</td>'
   +'<td class="num">'+(S.tm.att==null?'—':fmtVal(S.tm.att,'pct'))+'</td><td class="num">'+(S.lm.att==null?'—':fmtVal(S.lm.att,'pct'))+'</td><td>'+ppPill(pp(S.tm.att,S.lm.att))+'</td></tr>'
   +'<tr><td><b>Unplanned absence %</b></td><td class="num">'+(S.tw.absR==null?'—':fmtVal(S.tw.absR,'pct'))+'</td><td class="num">'+(S.lw.absR==null?'—':fmtVal(S.lw.absR,'pct'))+'</td><td>'+ppPill(pp(S.tw.absR,S.lw.absR),true)+'</td>'

   +'<tr><td><b>Present person-days</b></td><td class="num">'+S.tw.p.toLocaleString()+'</td><td class="num">'+S.lw.p.toLocaleString()+'</td><td>'+nPill(S.tw.p,S.lw.p)+'</td><td class="num">'+S.tm.p.toLocaleString()+'</td><td class="num">'+S.lm.p.toLocaleString()+'</td><td>'+nPill(S.tm.p,S.lm.p)+'</td></tr>'
   +'<tr><td><b>Attrition (exit records)</b></td><td class="num">'+S.tw.exits+'</td><td class="num">'+S.lw.exits+'</td><td>'+nPill(S.tw.exits,S.lw.exits,true)+'</td><td class="num">'+S.tm.exits+'</td><td class="num">'+S.lm.exits+'</td><td>'+nPill(S.tm.exits,S.lm.exits,true)+'</td></tr>'
   +'</tbody></table></div>'
   +'<div style="font-size:11px;color:var(--muted);margin-top:6px">Attrition counts Terminated / Resigned records in the attendance register per window — the same exit codes the rates exclude.</div></div>';
  const wfMovement=mvCompany+splitTbl('Team',keyTeam)+splitTbl('Campaign',keyCamp);
  const byStat=groupCount(att,'status').slice(0,8);
  /* Roster-exit rows (Terminated / Resigned, the excludeCodes rule) are NOT attendance events
     and sit outside every attendance denominator - the KPI, the status-distribution table below
     and the WoW/MoM block all drop them. This table and the trend chart used to keep them, so
     each exit record landed as a guaranteed non-present day and pulled the rate down hardest on
     the teams that lost people - on a table that sorts worst-first. Same denominator now. */
  const byTL={};att.forEach(r=>{if(r.excluded_flag)return;const t=r.reports_to;byTL[t]=byTL[t]||{n:0,p:0,a:0};byTL[t].n++;if(r.present_flag)byTL[t].p++;if(r.absence_flag)byTL[t].a++});
  const tlRows=Object.entries(byTL).map(([t,v])=>({t,rate:v.n?v.p/v.n*100:null,abs:v.a,n:v.n})).sort((a,b)=>(a.rate==null?101:a.rate)-(b.rate==null?101:b.rate));
  const trend=dailySeries(att,win,rs=>{const d=rs.filter(r=>!r.excluded_flag);return d.length?d.filter(r=>r.present_flag).length/d.length*100:null});
  const unknown=[...new Set(att.filter(r=>r.absence_flag).map(r=>r.status_code))];
  /* status distribution by chosen dimension */
  const dim=state.wfDim||'tl';
  const dimDef={tl:{label:'Reporting line',get:r=>r.reports_to||'(unassigned)'},
    dept:{label:'Department',get:r=>r.department||'(none)'},
    tenure:{label:'Tenure',get:r=>(state.cbInfo[normCB(r.employee_code)]?.tenure)||'(not on roster)'},
    type:{label:'Employee type',get:r=>r.employee_type||'(none)'}};
  const statFreqW=groupCount(att,'status');
  const stCols=statFreqW.slice(0,9).map(e=>e[0]);

  const stColsAll=stHasOther?[...stCols,'Other']:stCols;
  const DV={};att.forEach(r=>{const k=dimDef[dim].get(r);const d=DV[k]=DV[k]||{t:0,ex:0,p:0,sts:{}};
    d.t++;if(r.excluded_flag)d.ex++;if(r.present_flag)d.p++;
    const st=stCols.includes(r.status)?r.status:'Other';d.sts[st]=(d.sts[st]||0)+1});
  const dvRows=Object.entries(DV).sort((a,b)=>b[1].t-a[1].t).slice(0,14);
  setTimeout(()=>{
    mkChart('chW1',{type:'line',data:{labels:trend.labels,datasets:[{label:'Attendance %',data:trend.data,borderColor:'#0EA5E9',backgroundColor:'rgba(14,165,233,.08)',fill:true,tension:.3,pointRadius:0,borderWidth:2,spanGaps:true}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10}},y:{grid:{color:'rgba(148,182,255,.10)'},suggestedMin:60,suggestedMax:100}},maintainAspectRatio:false}});

   +'<div class="card"><div class="card-h"><span class="t">Status distribution — by '+dimDef[dim].label.toLowerCase()+'</span><span class="info" title="Every attendance status counted for the selected period, split by the dimension you choose. Tenure comes from the daily Agent List via the CB number. Present % excludes roster-exit rows (Terminated / Resigned) per the rules.">i</span>'
   +'<span class="right">'+Object.entries(dimDef).map(([k,v])=>'<button class="btn small'+(dim===k?' primary':'')+'" onclick="state.wfDim=&#39;'+k+'&#39;;render()">'+v.label+'</button>').join(' ')+'</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">'+dimDef[dim].label+'</th>'+stColsAll.map(st=>'<th class="noclick">'+esc(st)+'</th>').join('')+'<th class="noclick">Total</th><th class="noclick">Present %</th></tr></thead><tbody>'

function pageDisc(win){
  if(!hasData())return emptyState('Agent Discipline reads the QA evaluations export');
  const qa=rowsFor('QA_EVALUATIONS',win);
  const anchor=isoDay(anchorDate());
  const A={};
  qa.forEach(r=>{const key=normCB(r.sales_agent_code)||state.sfOwnerMap?.[normName(r.sales_agent)]||('N'+normName(r.sales_agent));if(!key)return;
    const a=A[key]=A[key]||{cb:key,code:(state.cbInfo[key]?.code)||r.sales_agent_code||'—',name:(state.cbInfo[key]?.name)||r.sales_agent,tl:(state.cbInfo[key]?.tl)||r.team_leader,off:0,open:0,openCrit:0,sla:0,tl1:0,tl2:0,sm:0,last:null};
    a.off=Math.max(a.off,r.offense_number||0);
    const open=!/closed/i.test(r.qa_status||'');
    const isC=resolveRule('$qaCritical').includes(r.escalation_decision);
    const isCo=resolveRule('$qaCoaching').includes(r.escalation_decision);
    if(open&&(isC||isCo))a.open++;
    if(open&&isC)a.openCrit++;
    if(open&&r.sla_deadline){const d=isoDay(parseDT(r.sla_deadline));if(d&&d<anchor)a.sla++}
    if(r.tl1_flag)a.tl1=1;if(r.tl2_flag)a.tl2=1;if(r.sm_flag)a.sm=1;
    if(r.call_date&&(!a.last||r.call_date>a.last))a.last=r.call_date;
  });
  const reg=Object.values(A).filter(a=>a.off>0||a.open>0)
    .sort((x,y)=>(y.openCrit-x.openCrit)||(y.off-x.off)||(y.open-x.open));
  const stageDist={};reg.forEach(a=>{const st=stageFor(a.off);const l=st?st.label:'No stage yet';stageDist[l]=(stageDist[l]||0)+1});
  const escal=qa.filter(r=>r.sm_flag&&!/closed/i.test(r.qa_status||''));
  const ladder=(state.rules.discStages?.vals||[]).join('  ·  ');
  setTimeout(()=>{hbar('chD1',Object.entries(stageDist).sort((a,b)=>b[1]-a[1]),'#C42D2D')},0);
  const stagePill=st=>{if(!st)return '<span class="pill n">—</span>';
    const frac=st.total>1?st.idx/(st.total-1):1;
    return '<span class="pill '+(frac>=0.75?'r':frac>=0.4?'a':'b')+'">'+esc(st.label)+'</span>'};
  return kpiRow('Discipline',win)
   +'<div class="stale-banner" style="background:var(--blue-soft);border-color:#D4E2FB;color:#1D4FD8">Stage ladder in force: '+esc(ladder)+' — this is a live rule (Dictionary → Interpretation rules). CONFIGURATION REQUIRED: confirm the ladder with Claudell / HR before disciplinary use. Derived from the QA export today; a dedicated HR/IR source can be added as a new upload slot later.</div>'
   +'<div class="grid g21">'
   +'<div class="card"><div class="card-h"><span class="t">Disciplinary register</span><span class="s">'+reg.length+' agents with open items or offenses · worst first</span></div>'
   +(reg.length?'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">Agent</th><th class="noclick">Team leader</th><th class="noclick">Offense #</th><th class="noclick">Current stage</th><th class="noclick">Open items</th><th class="noclick">Open criticals</th><th class="noclick">SLA</th><th class="noclick">Path</th><th class="noclick">Last incident</th></tr></thead><tbody>'
    +reg.map(a=>'<tr><td><b>'+aName(a.cb,maskName(a.name))+'</b><div style="font-size:10.5px;color:var(--muted)">'+esc(a.code)+'</div></td>'
     +'<td>'+maskName(a.tl)+'</td>'

function acStats(cb,win,C){
  const i=state.cbInfo[cb]||{};const T=k=>nbaVal(k,0);

  const qa=C.qa[cb]||{n:0,s:0,s0:0,sn:0,sd:0,crit:0},at=C.att[cb]||{sched:0,p:0},ca=C.call[cb]||{n:0,sec:0,bands:{},days:new Set(),uniq:new Set()};

     across the metrics the agent actually HAS, and the ladder skips the rules that read them.
     They used to fall back to the whole-period TOTAL while keeping their per-day labels, so an
     attendance register that did not reach into the window turned a data gap into 300%+ Target
     Achievement and a passing Talk Time — for the whole floor at once, silently. */
  /* NO MONEY SOURCE, NO SALES METRICS (audit, 2026-08-28). Sales come from the Power BI
     Active Cases export and nowhere else (non-negotiable 6). With no BI file loaded every
     agent's sale.n is 0, which is not "sold nothing" — it is "we were not told". Reading it
     as a nought scored a hard 0 on Target Achievement (weight 20) and Conversion (weight 10),
     dropped 30 points off every composite on the floor, and fired R4A "Critical Sales-Volume
     Failure" on the whole team with a band label that did not contain its own 0%. GWP/Sale
     already abstained and applyGroupPercentiles already abstains; these now do the same, and
     acComposite drops a null metric out of the denominator. An agent who genuinely sold
     nothing WITH a BI file loaded still scores 0 and still fires the ladder — as they must. */
  const haveMoney=(typeof biLoaded==='function')?biLoaded():true;
  const spd=(p>0&&haveMoney)?sale.n/p:null;
  const ta=(spd!=null&&target>0)?spd/target*100:null;
  const gwpSale=sale.n>0?sale.gwp/sale.n:null;
  const leads=(C.lead[cb]||mkLeads()).n;   // unique cases across open+closed — not op.n+cl.tc (a case in both is ONE lead)

     published rows read exactly 0.0 while VAS had the same agents on 200+ minutes a day.
     Same doctrine as the money model and the GWP percentile: an absence leaves the
     denominator; a real zero WITH call rows present still scores zero. */

  const att=sched>0?p/sched*100:null;

  const attLead=leads>0&&ca.n>0?ca.n/leads:null;   // v3.0 diagnostic: total dials ÷ unique leads

const clusterLabel = k => CLUSTER_LABELS[k] || String(k||'').replace(/^[a-z]+./,'').replace(/_/g,' ');

   a repeat offender. */
function coachThemes(sessions, win){
  const to = (win && win.to) ? new Date(win.to) : new Date();
  const from = new Date(to.getTime() - COACH_TH.windowDays*86400000);
  const iso = d => d.toISOString().slice(0,10);

  (sessions||[]).forEach(s=>{

      const t = themes[c.clusterKey] ??= { key:c.clusterKey, family:c.family, scored:0, shown:0, last:'' };
      t.shown++; if(scored) t.scored++;
      if(s.date > t.last) t.last = s.date;

/* Same shape as cfTier so the two penalties compose predictably. Basis is the

       agent is working on, purpose is why the session was held. Counting purpose
       would be meaningless here — 451 of 458 historical QA sessions carry
       purpose.quality_compliance, because the checkbox it was migrated from was
       ticked on nearly every one. That would hand almost every agent the same
       penalty and say nothing about any of them. */
    if(t.family !== 'gap') return;
    if(t.scored < COACH_TH.repeatMin) return;

    const p = t.scored >= COACH_TH.persistentMin ? COACH_TH.penPersistent : COACH_TH.penRepeat;

    return{code:'R2A-3',lvl:1,lvlName:'Protect the Business',label:'Critical Compliance Fail',detail:tier.cf+' fails · CFR '+fmtVal(tier.cfr,'pct')+' of audited calls ('+ (tier.cf>=nbaVal('r2a3Count',4)?'count':'rate')+' trigger).',action:'P1 compliance review within 48h — audit each fail, corrective action signed, daily monitoring 10 days. Elite blocked.'};

  const R=(code,lvl,lvlName,label,detail,action)=>({code,lvl,lvlName,label,detail,action});
  if(st.sched>0&&st.p===0)return R('R1',1,'Protect the Business','Zero Attendance','Did not attend any scheduled day in the period.','Escalate to HR immediately; attempt contact within 24 hrs; start formal absence management.');
  if(st.qaS!=null&&st.qaS<T('qaCritical'))return R('R2',1,'Protect the Business','Critical QA Failure','QA score '+fmtVal(st.qaS,'pct')+' — below '+T('qaCritical')+'%.','QA intervention within 48 hrs: review calls, complete retraining, monitor daily, sign coaching plan.');
  if(st.att!=null&&st.att<T('attRisk'))return R('R3',1,'Protect the Business','Attendance Risk','Attendance '+fmtVal(st.att,'pct')+' — below '+T('attRisk')+'%.','Attendance discussion within 2 days; wellness check if needed; document and monitor weekly.');
  if(r2bFires)return R('R2B',1,'Protect the Business','Repeat Compliance Coaching',
    'The same compliance theme has been coached '+worst.scored+' times in the window — '+esc(clusterLabel(worst.key))+'.',
    'Compliance review with QA within 48 hours. The theme is recurring after coaching, so review the calls behind each session, not only the last one, and agree a written commitment.');
  if(tier.tier==='R2A-2')return R('R2A-2',2,'Protect the Revenue','Compliance Risk',tier.cf+' fails · CFR '+fmtVal(tier.cfr,'pct')+' (emerging tier).','P2 structured compliance coaching 5 days — root-cause review, raised audit cadence. Elite blocked.');
  if(st.gwpSale!=null&&st.gwpSale<gwpFloorIncl())return R('R4',2,'Protect the Revenue','GWP Value Failure','GWP per sale R'+Math.round(st.gwpSale)+' — below the R'+T('gwpFloor')+' line.','Value coaching 48h: policy mix, upsell, GWP mini-target.');
  if(st.ta!=null&&st.gwpSale!=null&&st.gwpSale>=gwpFloorIncl()&&st.ta<T('salesLow'))return R('R4A',2,'Protect the Revenue','Critical Sales-Volume Failure','Value clears R'+T('gwpFloor')+' but volume is '+fmtVal(st.ta,'pct')+' of target.','Start PIP: weekly 1:1, side-by-side call listening, workshops, review activity and pipeline.');
  if(st.qaS!=null&&st.qaS<T('qaTarget'))return R('R5',2,'Protect the Revenue','Moderate QA Risk','QA '+fmtVal(st.qaS,'pct')+' — between '+T('qaCritical')+'% and '+T('qaTarget')+'%.','QA refresher within 5 days; audit 5 calls per week; coach every 2 weeks.');
  /* R6 CATCHES MORE THAN ITS BAND. An agent below salesLow normally lands on R4A, but R4A
     requires a GWP-per-sale figure, and an agent who has sold NOTHING has none — so they fall

  if(st.ta!=null&&st.ta<T('salesNear'))return R('R6',2,'Protect the Revenue','Low Sales Achievement','Volume at '+fmtVal(st.ta,'pct')+' of target'+(st.ta>=T('salesLow')?' ('+T('salesLow')+'–'+T('salesNear')+'% band)':' — below the '+T('salesLow')+'% line, with no sale banked to read a GWP value from')+'.','Sales coaching every 2 weeks: objection roleplays, peer pairing, activity review; add conversion training if low.');

     session. Sits here, above R10, because "coach it once" beats "recognise and

  if(coach&&coach.loaded&&(()=>{

  /* NOTHING MEASURED IS NOT "ELITE" (audit round 3, 2026-08-27). Every rule above is
     null-guarded, so an agent with no shifts, no QA, no sales and no calls in the window
     satisfied none of them and fell through to R10 — a joiner on their first Monday, and
     the whole floor whenever the date range predates the uploads, were published as
     "Strong / Elite Performer". A missing measurement must never read as a passed one. */
  /* "Nothing measured" is about the SCORED DRIVERS, not about whether any row exists
     (audit round 6, 2026-08-28). Every driver is a rate over present/scheduled days, so a
     window with dialler rows but no attendance register — a failure this file documents as
     having hit the whole floor at once — left every driver null, fired no rule, and landed
     on R10 "Strong / Elite Performer" with a composite of 0: a green Level-4 bar of length
     zero. If the composite has an empty denominator, there is nothing to judge. */
  const __noDrivers=compWeights().every(([n])=>n==='GWP %ile'||st.sc[n]==null);
  if(__noDrivers||(!(st.sched>0)&&!(st.qaN>0)&&!(st.sales>0)&&!(st.calls>0)))

      'Check the date range, and that the exports for these days are uploaded. This is a gap in the data, not a judgement on the agent.');
  return R('R10',4,'Develop & Recognise','Strong / Elite Performer','Meeting or exceeding all key targets.','Recognise and reward; set a stretch goal; consider mentor / buddy roles.');
}

/* The driver with the most points still on the table — what R13 checks has never
   been coached. Uses the same weights and scores the composite is built from, so
   "most points available" means the same thing in both places. */
/* GWP percentile WITHIN TENURE GROUP, then the composite. This was copy-pasted in
   three places — TL view, Visual Brain, the AI context builder — identical maths each
   time, one of them transliterated into ES5. Three copies of a ranking rule is three
   places to forget when the rule changes. One copy now; behaviour unchanged.
   Peers are the FLEET (callers raise _fleetCtx), never the permission-scoped set. */
function applyGroupPercentiles(stats){
  /* NO MONEY SOURCE, NO MONEY PERCENTILE (audit round 3, 2026-08-27). With no BI file every
     agent's gwp is 0, so everyone tied, everyone scored 0 on the 15-weight "GWP %ile" metric,
     and every composite on the floor fell ~15 points with nothing on the page to say why.
     Money doctrine (non-negotiable 6) is that money reads BLANK without BI — acComposite
     already drops a null metric out of the denominator, which is the honest answer. */
  const haveMoney=(typeof biLoaded==='function')?biLoaded():true;
  const byGroup={};stats.forEach(st=>{(byGroup[st.group]=byGroup[st.group]||[]).push(st)});
  Object.values(byGroup).forEach(g=>{const sorted=g.map(x=>x.gwp).sort((a,b)=>a-b);
    g.forEach(st=>{const below=sorted.filter(x=>x<st.gwp).length;
      const pct=!haveMoney?null:(g.length<2?100:below/(g.length-1)*100);st.comp=acComposite(st,pct)})});
}
function acWeakestDriver(st){
  /* Keyed on the compositeWeights rule's OWN names — the same strings acStats writes into
     st.sc — because that is what compWeights() hands back. The map used to be keyed on
     prettier display names ('GWP / Sale', 'QA Score', 'Target Achievement', 'Talk Time'),
     none of which matched, so four of the six drivers were skipped and only Conversion and
     Attendance could ever be "the weakest" — 15% of the composite deciding for the 70% it
     could not see. LABEL is what the reader is shown; the key is what R13 compares. */
  const DRIVER={'GWP/Sale':'gwpSale','Target Ach':'targetAch','QA':'qa','Conversion':'conv','Talk':'talk','Attendance':'attendance'};
  const LABEL={'GWP/Sale':'GWP / Sale','Target Ach':'Target Achievement','QA':'QA Score','Conversion':'Conversion','Talk':'Talk Time','Attendance':'Attendance'};
  let best=null;
  compWeights().forEach(([name,w])=>{
    const v=st.sc?st.sc[name]:null; const key=DRIVER[name]; if(v==null||!key)return;
    const points=(100-v)/100*w;                       // weight not yet earned
    if(!best||points>best.points)best={driver:key,label:LABEL[name]||name,points};
  });
  return best;
}
/* Coaching for one agent, read live from the Coaching Hub through the Worker.
   Never throws: if the Hub is unreachable the drill-down still opens and the
   coaching section says so, rather than the whole modal failing. */
async function coachFetch(cb){
  try{
    const ep=workerBase();
    const t=(()=>{try{return sessionStorage.getItem('cbx_token')}catch(e){return null}})();
    if(!t)return{loaded:false,error:'not signed in',sessions:[],themes:[]};
    // Hard ceiling: the drill-down waits on this, so a slow or hanging Hub must
    // never be the reason an agent's card does not open. Past the timeout the
    // card renders with the coaching section saying it is unavailable.
    const ac=new AbortController();
    const timer=setTimeout(()=>ac.abort(),3000);
    let res;
    try{
      res=await fetch(ep+'/api/coaching?cb='+encodeURIComponent(cb),
        {headers:{'Authorization':'Bearer '+t,'x-cbx-client':'v5'},signal:ac.signal});
    } finally { clearTimeout(timer); }
    const r=await res.json();
    if(!res.ok||!r||r.error)return{loaded:false,error:(r&&r.detail)||('HTTP '+res.status),sessions:[],themes:[]};
    const sessions=r.sessions||[];
    return{loaded:true,unresolved:!!r.unresolved,sessions,themes:coachThemes(sessions,periodWindow())};
  }catch(e){return{loaded:false,error:String(e.message||e),sessions:[],themes:[]}}
}

   +'</tbody></table></div>'

   +'<div class="card" style="margin-bottom:10px"><b style="color:'+(nba.lvl<=2?'var(--red)':'inherit')+'">['+nba.code+'] '+esc(nba.label)+'</b><div style="font-size:12px;color:var(--muted);margin:4px 0">'+esc(nba.detail)+'</div><div style="font-size:12.5px">'+esc(nba.action)+'</div></div>'

  setTimeout(function(){

/* ---------------- PAGE: TEAM LEADER VIEW (NBA v3.0 report) ---------------- */
function pageTL(win){
  if(!hasData())return emptyState('The Team Leader view needs the Agent List plus the activity sources');
  const GF=state.filters;
  const C=acCtx(win);
  /* cbsBase = the fleet (GF-filtered but NOT permission-scoped); the display set
     (stats) is narrowed to what the signed-in user may see. Critical-fail counts on
     this view come straight from each agent's own QA rows, so scoping is display-only. */
  const cbsBase=Object.keys(state.cbInfo).filter(cb=>{const i=state.cbInfo[cb];
    if(GF.tenure&&i.tenure!==GF.tenure)return false;
    if(GF.team&&i.tl!==GF.team)return false;
    if(GF.campaign&&campBucket(i.queue)!==GF.campaign)return false;
    if(GF.agent&&cb!==normCB(GF.agent))return false;
    return true});
  if(!cbsBase.length)return emptyState('No roster agents match the current filters');
  const wd=workDays(win);
  const statsAll=cbsBase.map(cb=>{const st=acStats(cb,win,C);st.tierInfo=cfTier(st);st.nba=acNBA(st);return st});
  /* Composite /100 per agent — tenure-relative GWP percentile within group.
     THE PEER GROUP IS THE WHOLE ROSTER, NEVER THE FILTER BAR'S SUBSET (audit round 3,
     2026-08-27). cbsBase is already narrowed by GF.tenure/team/campaign/agent, so ranking
     inside it meant selecting one agent ranked them against themselves — g.length<2 → 100th
     percentile → up to +15 composite points for touching a dropdown, and a team filter
     re-ranked everyone against 9 team-mates instead of their tenure group. Non-negotiable 5
     is tenure-relative, which the filter bar must not redefine. Peers are computed only when
     a filter is on, so the unfiltered path costs exactly what it did before. */
  if(GF.tenure||GF.team||GF.campaign||GF.agent){
    const inView=new Set(cbsBase);
    const peers=Object.keys(state.cbInfo).filter(cb=>!inView.has(cb)).map(cb=>acStats(cb,win,C));
    applyGroupPercentiles(statsAll.concat(peers));   // ranks statsAll against the full roster
  } else applyGroupPercentiles(statsAll);
  const lvlHex=l=>l===1?'#C42D2D':l===2?'#B45309':l===3?'#2563EB':'#158A4C';
  const stats=statsAll.filter(st=>cbInScope(st.cb));   // display: only agents the user may see
  if(!stats.length)return emptyState('No roster agents match the current filters');
  /* Lean TL view (client 2026-07-20): show ONLY talk time, unique calls/day, GWP,
     referrals, critical fails, and conversion (closed cases ÷ sales). Protect-the-
     business (P1) moved to QA & Compliance; open/closed/unique leads, sales targets,
     dual-check, NBA distribution, Mon-Fri and cancellation watch removed from this view.
     Click an agent name for the full deep-dive (agentOpen) — no duplicate standalone tab. */
  /* Rolled up as floor totals over floor present-days, NOT as a mean of each agent's own
     per-day rate. Averaging rates gives an agent who attended one day the same vote as one who
     attended twenty, which is not what "TALK TIME / DAY" says on the tile. */
  const T={};stats.forEach(st=>{const t=T[st.tl]=T[st.tl]||{tl:st.tl,ag:[],gwp:0,sales:0,refs:0,cf:0,closed:0,talkMin:0,uniqCalls:0,p:0};
    t.ag.push(st);t.gwp+=st.gwp;t.sales+=st.sales;t.refs+=st.refs||0;t.cf+=st.crit||0;t.closed+=st.closedCases||0;
    t.talkMin+=st.talkMin||0;t.uniqCalls+=st.uniqCalls||0;t.p+=st.p||0});
  const tls=Object.values(T).sort((a,b)=>b.gwp-a.gwp);
  const pick=state.tlPick&&T[state.tlPick]?state.tlPick:(tls[0]&&tls[0].tl);
  const P=pick?T[pick]:null;
  /* Closed cases PER SALE (client 2026-07-20). Deliberately not a conversion rate - it is
     well above 1 in normal trading, because most worked leads close without a sale. It used to
     print as a percentage under a column headed "Conversion", beside a Sales Conversion tile
     (sales over leads, target 10%) that moves the opposite way. Shown as a ratio now, so the
     two can no longer be read as the same measure. */
  const closedPer=(closed,sales)=>sales>0?closed/sales:null;
  const cpsFmt=v=>v==null?'\u2014':'\u00d7'+(Math.round(v*10)/10).toFixed(1);
  const talkFmt=m=>{m=Math.round(m||0);return m>=60?(Math.floor(m/60)+'h '+(m%60)+'m'):(m+'m')};
  const p1Total=stats.filter(st=>st.nba&&st.nba.lvl===1).length;
  const F={gwp:0,sales:0,refs:0,cf:0,closed:0,talkMin:0,uniqCalls:0,p:0};
  stats.forEach(st=>{F.gwp+=st.gwp;F.sales+=st.sales;F.refs+=st.refs||0;F.cf+=st.crit||0;F.closed+=st.closedCases||0;
    F.talkMin+=st.talkMin||0;F.uniqCalls+=st.uniqCalls||0;F.p+=st.p||0});
  const box=(v,l,c)=>'<div class="ac-tile" style="min-width:112px"><div class="ac-big" style="color:'+(c||'inherit')+'">'+v+'</div><div class="ac-sub" style="margin:2px 0 0">'+l+'</div></div>';
  const fCps=closedPer(F.closed,F.sales);
  let h='<div class="ac-tiles" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">'
   +box(F.p?Math.round(F.talkMin/F.p)+'m':'—','TALK TIME / DAY')
   +box(F.p?(Math.round(F.uniqCalls/F.p*10)/10).toFixed(1):'—','UNIQUE CALLS / DAY')
   +box(zarStack(F.gwp),'GWP')
   +box(String(F.refs),'REFERRALS')
   +box(String(F.cf),'CRITICAL FAILS',F.cf?'var(--red)':'#158A4C')
   +box(cpsFmt(fCps),'CLOSED PER SALE')
   +'</div>';
  h+='<div class="card" style="margin-bottom:16px"><div class="card-h"><span class="t">Team leaders</span><span class="info" title="The six team-leader metrics (client 2026-07-20): talk time per day and unique calls per day (floor totals over floor present days, not an average of per-agent rates), GWP (VAT-incl), referrals, outstanding critical fails, and closed cases per sale. That last one is a workload ratio, NOT a conversion rate - x8.0 means eight leads were closed out for every sale banked, and higher is not better. The funnel figure (sales over unique leads, target 10%) is Sales Conversion, on Sales Production. Protect-the-business / compliance detail lives on QA &amp; Compliance.">i</span><span class="s">'+stats.length+' agents · '+tls.length+' teams · '+wd+' working days · click a team to focus</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl" style="font-size:11.5px"><thead><tr><th class="noclick">Team Leader</th><th class="noclick">Agents</th><th class="noclick">Talk/day</th><th class="noclick">Unique calls/day</th><th class="noclick">GWP</th><th class="noclick">Referrals</th><th class="noclick">Critical fails</th><th class="noclick" title="Closed cases per sale — a workload ratio, not a win rate">Closed / sale</th></tr></thead><tbody>'
   +tls.map(t=>{const cv=closedPer(t.closed,t.sales);
     return '<tr class="rowlink" onclick="state.tlPick=&#39;'+esc(t.tl).replace(/&#39;/g,"").replace(/'/g,'&#39;')+'&#39;;render()"><td><b>'+maskName(t.tl)+'</b></td><td class="num">'+t.ag.length+'</td>'
      +'<td class="num">'+(t.p?Math.round(t.talkMin/t.p)+'m':'—')+'</td>'
      +'<td class="num">'+(t.p?(Math.round(t.uniqCalls/t.p*10)/10).toFixed(1):'—')+'</td>'
      +'<td class="num" style="font-weight:800">'+zarStack(t.gwp)+'</td><td class="num">'+t.refs+'</td>'
      +'<td class="num" style="color:'+(t.cf?'var(--red)':'#158A4C')+';font-weight:800">'+t.cf+'</td>'
      +'<td class="num">'+cpsFmt(cv)+'</td></tr>'}).join('')
   +'</tbody></table></div></div>';
  if(P){const ag=[...P.ag].sort((a,b)=>b.gwp-a.gwp);
    // Agent-scores graph for the picked TL only — filtering by team leader narrows stats to one
    // team, so this shows exactly that team's agents. Coloured by NBA priority level.
    const gag=[...P.ag].sort((a,b)=>((b.comp&&b.comp.adj)||0)-((a.comp&&a.comp.adj)||0)),gid='chTLscores';
    setTimeout(()=>hbar(gid,gag.map(st=>[maskNameText(st.name),Math.round((st.comp&&st.comp.adj)||0)]),gag.map(st=>lvlHex(st.nba.lvl))),0);
    h+='<div class="card" style="margin-bottom:16px"><div class="card-h"><span class="t">'+maskName(pick)+' — Agent Scores</span><span class="s">composite /100 · coloured by NBA priority (red P1 · amber P2 · blue P3 · green clear)</span></div>'
     +'<div class="chart-wrap" style="height:'+Math.max(160,gag.length*24+40)+'px"><canvas id="'+gid+'"></canvas></div></div>';
    h+='<div class="card"><div class="card-h"><span class="t">'+maskName(pick)+' — agents</span><span class="s">'+P.ag.length+' agents · click a name for the full agent card</span>'
     +'<span class="right">'+tls.map(t=>'<button class="btn small'+(t.tl===pick?' primary':'')+'" onclick="state.tlPick=&#39;'+esc(t.tl).replace(/&#39;/g,"").replace(/'/g,'&#39;')+'&#39;;render()">'+maskName(t.tl)+'</button>').join(' ')+'</span></div>'
     +'<div style="overflow-x:auto"><table class="tbl" style="font-size:11.5px"><thead><tr><th class="noclick">Agent</th><th class="noclick">Talk time</th><th class="noclick">Unique calls/day</th><th class="noclick">GWP</th><th class="noclick">Referrals</th><th class="noclick">Critical fails</th><th class="noclick" title="Closed cases per sale — a workload ratio, not a win rate">Closed / sale</th></tr></thead><tbody>'
     +ag.map(st=>{const cv=st.closedPerSale;
       return '<tr><td><b>'+aName(st.cb,maskName(st.name))+'</b></td>'
        +'<td class="num">'+talkFmt(st.talkMin)+'<div class="exv">'+(st.talkDay!=null?Math.round(st.talkDay)+'m/day':'')+'</div></td>'
        +'<td class="num">'+(st.uniqPerDay!=null?(Math.round(st.uniqPerDay*10)/10).toFixed(1):'—')+'<div class="exv">'+st.uniqCalls+' total</div></td>'
        +'<td class="num" style="font-weight:800">'+zarStack(st.gwp)+'</td><td class="num">'+st.refs+'</td>'
        +'<td class="num" style="color:'+(st.crit?'var(--red)':'#158A4C')+';font-weight:800">'+st.crit+'</td>'
        +'<td class="num">'+cpsFmt(cv)+'</td></tr>'}).join('')
     +'</tbody></table></div>'
     +'<div style="font-size:11px;color:var(--muted);margin-top:8px">Closed / sale = closed cases ÷ sales — how many leads were worked to a close for each sale banked, so lower is better and it is not a percentage. For the funnel rate (sales ÷ unique leads) see Sales Conversion on Sales Production. Protect-the-business (P1) compliance now lives on the QA &amp; Compliance page.'+(p1Total?' <b style="color:var(--red)">'+p1Total+' agent(s) sit at P1 this period</b> — see QA &amp; Compliance.':'')+'</div></div>';

/* The Open Cases Status field, in the order a lead actually travels. Lead Allocation and the
   Lead Management funnel pivot the SAME field, so the list and the folding rule live here once —
   two private copies drift the moment Salesforce renames a stage. canonLeadStatus folds case and
   whitespace variants into the canonical name, so "4th Attempt" counts into the 4th-attempt
   column instead of opening a duplicate one after Escalated. Anything unrecognised keeps its own
   name (blank becomes "(blank)") — a new stage shows up as its own column, never silently pooled. */
const LEAD_STATUS_CANON=['1st attempt','2nd attempt','3rd attempt','4th attempt','5th attempt','New','In Progress','Escalated'];
function canonLeadStatus(s){const n=String(s==null?'':s).replace(/\s+/g,' ').trim();
  return LEAD_STATUS_CANON.find(c=>c.toLowerCase()===n.toLowerCase())||(n||'(blank)')}
/* Status columns for a set of agents: the canonical stages first (whether or not anyone is
   sitting on them, so the shape of the table is stable between uploads), then any stage the
   data carries that the canon does not know about, alphabetically. cap=0 means no cap. */
function leadStatusCols(agents,cap){
  const present=new Set();agents.forEach(a=>Object.keys(a.sts||{}).forEach(k=>present.add(k)));
  const cols=[...LEAD_STATUS_CANON,...[...present].filter(c=>!LEAD_STATUS_CANON.includes(c)).sort()];
  return cap?cols.slice(0,cap):cols;
}

/* One question: who is holding which leads right now, and at what stage. The Salesforce Open
   Cases snapshot matched to the roster on the CB NUMBER, with Status pivoted per person.

   nothing is capped and every stage gets a column. Computes no new number: an agent's Total
   Allocated here must equal that agent's Total Open on Lead Management for the same window. */
/* pageLeadAlloc removed 2026-08-23 — unreachable: not in PAGES, not routed. 196 lines. */
/* The empty state carries its own uploader: with no snapshot there is nothing to show, and the
   one useful action is loading the file. Routes through handleFile, so validation, the confirm

     ?'<div id="slot_alloc_drop" style="margin-top:14px" ondragover="event.preventDefault();this.classList.add(&#39;drag&#39;)" ondragleave="this.classList.remove(&#39;drag&#39;)" ondrop="this.classList.remove(&#39;drag&#39;);dropFile(event,&#39;SF_OPEN_CASES&#39;)">'
      +'<div style="display:flex;gap:8px;justify-content:center">'
      +'<label class="btn primary" style="display:inline-block">Upload Open Cases<input type="file" style="display:none" onchange="if(this.files[0]){handleFile(&#39;SF_OPEN_CASES&#39;,this.files[0]);this.value=&#39;&#39;}"></label>'
      +'<button class="btn" onclick="go(\'uploads\')">Open the Upload Station</button></div>'

function pageBrain(win){

  const GF=state.filters;

  const cbsBase=Object.keys(state.cbInfo).filter(cb=>{const i=state.cbInfo[cb];
    if(GF.tenure&&i.tenure!==GF.tenure)return false;
    if(GF.team&&i.tl!==GF.team)return false;
    if(GF.campaign&&campBucket(i.queue)!==GF.campaign)return false;
    if(GF.agent&&cb!==normCB(GF.agent))return false;
    return true});
  if(!cbsBase.length)return emptyState('No roster agents match the current filters');
  const statsAll=cbsBase.map(cb=>{const st=acStats(cb,win,C);st.tierInfo=cfTier(st);st.nba=acNBA(st);return st});
  (function(){ /* same peer-group rule as the TL page — see the note there */
    if(GF.tenure||GF.team||GF.campaign||GF.agent){
      const inView=new Set(cbsBase);
      const peers=Object.keys(state.cbInfo).filter(cb=>!inView.has(cb)).map(cb=>acStats(cb,win,C));
      applyGroupPercentiles(statsAll.concat(peers));
    } else applyGroupPercentiles(statsAll);
  })();
  const stats=statsAll.filter(st=>cbInScope(st.cb));
  if(!stats.length)return emptyState('No roster agents match the current filters');
  const lvlHex=l=>l===1?'#C42D2D':l===2?'#B45309':l===3?'#2563EB':'#158A4C';
  const nodes=[],edges=[],idx={};
  const addNode=(id,label,type,color,r,meta)=>{if(idx[id]!=null)return idx[id];idx[id]=nodes.length;
    nodes.push({id,label,type,color,r,meta:meta||{},deg:0,x:0,y:0,vx:0,vy:0});return idx[id]};
  const link=(a,b)=>{edges.push([a,b]);nodes[a].deg++;nodes[b].deg++};
  stats.forEach(st=>{
    const a=addNode('A:'+st.cb,maskNameText(st.name),'agent',lvlHex(st.nba.lvl),4+Math.max(0,Math.min(100,st.comp.adj))/18,
      {cb:st.cb,sub:st.nba.code+' '+st.nba.label+' · Adj '+Math.round(st.comp.adj)});
    link(a,addNode('T:'+st.tl,maskNameText(st.tl),'tl','#E7EEFA',8,{sub:'Team leader'}));
    link(a,addNode('Q:'+st.queue,String(st.queue),'campaign','#38BDF8',7,{sub:'Campaign'}));
    link(a,addNode('R:'+st.nba.code,st.nba.code,'rule',lvlHex(st.nba.lvl),6,{sub:st.nba.label}));
  });
  const counts={1:0,2:0,3:0,4:0};stats.forEach(st=>counts[st.nba.lvl]++);
  setTimeout(()=>brainInit(nodes,edges),0);
  const chip=(c,l)=>'<span class="chip n"><span class="dot" style="background:'+c+'"></span>'+l+'</span>';
  return '<div class="card" style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
   +'<b>The floor as a graph.</b>'
   +chip('#C42D2D','L1 Urgent · '+counts[1])
   +chip('#B45309','L2 Revenue · '+counts[2])
   +chip('#2563EB','L3 Skill · '+counts[3])
   +chip('#158A4C','L4 Recognise · '+counts[4])
   +chip('#8FA2C4','light squares = team leaders')+chip('#38BDF8','sky squares = campaigns')+chip('#71809B','diamonds = NBA rules')
   +'<span style="margin-left:auto;font-size:11.5px;color:var(--muted)">a living map — always in motion · hover any node to spotlight it and read its story · scroll to zoom · drag to pan</span></div>'
   +'<div class="card" style="padding:0;overflow:hidden;background:#0A1730;border-color:#0A1730"><canvas id="brainCanvas" style="width:100%;height:620px;display:block;cursor:grab"></canvas></div>'
   +'<div class="footer-note" style="margin-top:8px"><span>'+stats.length+' agents · '+nodes.length+' nodes · '+edges.length+' links · window '+esc(winFrom(win))+' → '+esc(win.to)+' · many agents orbiting one red rule = one coaching theme, not many separate agent problems</span></div>';
}
function brainInit(nodes,edges){
  const cv=document.getElementById('brainCanvas');if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||900,H=cv.clientHeight||600;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');
  let hi=0,ai=0;const hubs=nodes.filter(n=>n.type!=='agent').length,ags=nodes.length-hubs;
  nodes.forEach(n=>{if(n.type!=='agent'){const t=(hi++/Math.max(1,hubs))*6.283;n.x=W/2+Math.cos(t)*Math.min(W,H)*.17;n.y=H/2+Math.sin(t)*Math.min(W,H)*.17}
    else{const t=(ai++/Math.max(1,ags))*6.283;const rr=Math.min(W,H)*(.30+.10*Math.sin(ai*2.7));n.x=W/2+Math.cos(t)*rr;n.y=H/2+Math.sin(t)*rr}});
  let scale=1,ox=0,oy=0,alpha=1,drag=null,pan=null,hover=-1,tick=0;
  const toWorld=(px,py)=>[(px-ox)/scale,(py-oy)/scale];
  const pick=(px,py)=>{const w=toWorld(px,py);let best=-1,bd=1e9;
    nodes.forEach((n,i)=>{const d=Math.hypot(n.x-w[0],n.y-w[1]);if(d<n.r+5&&d<bd){bd=d;best=i}});return best};
  function physics(){
    tick++;
    if(alpha<.005)return;
    for(let i=0;i<nodes.length;i++){const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
        let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<1)d2=1;if(d2>40000)continue;
        const f=1400/d2,d=Math.sqrt(d2);dx/=d;dy/=d;
        a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}}
    edges.forEach(e=>{const a=nodes[e[0]],b=nodes[e[1]];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-76)*.02,ux=dx/d,uy=dy/d;
      a.vx+=ux*f;a.vy+=uy*f;b.vx-=ux*f;b.vy-=uy*f});
    nodes.forEach((n,i)=>{
      n.vx+=(W/2-n.x)*.0016;n.vy+=(H/2-n.y)*.0016;
      n.vx+=Math.sin(tick*.008+i*1.7)*.014;n.vy+=Math.cos(tick*.006+i*2.3)*.014;
      if(!(drag&&drag.node===n)){n.x+=n.vx*alpha;n.y+=n.vy*alpha}
      n.vx*=.86;n.vy*=.86});
    alpha=Math.max(alpha*.996,.06);
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#0A1730';ctx.fillRect(0,0,W,H);
    const vg=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,Math.max(W,H)*.72);
    vg.addColorStop(0,'rgba(14,34,68,.6)');vg.addColorStop(1,'rgba(10,23,48,0)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    let nb=null;
    if(hover>=0){nb=new Set([hover]);edges.forEach(e=>{if(e[0]===hover)nb.add(e[1]);if(e[1]===hover)nb.add(e[0])})}
    ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
    ctx.strokeStyle=nb?'rgba(201,214,236,.04)':'rgba(201,214,236,.10)';ctx.lineWidth=1/scale;
    ctx.beginPath();edges.forEach(e=>{const a=nodes[e[0]],b=nodes[e[1]];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)});ctx.stroke();
    if(nb){ctx.strokeStyle='rgba(201,214,236,.38)';ctx.lineWidth=1.2/scale;
      ctx.beginPath();edges.forEach(e=>{if(e[0]===hover||e[1]===hover){const a=nodes[e[0]],b=nodes[e[1]];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}});ctx.stroke();}
    nodes.forEach((n,i)=>{
      ctx.beginPath();
      if(n.type==='agent')ctx.arc(n.x,n.y,n.r,0,6.283);
      else if(n.type==='rule'){const s=n.r;ctx.moveTo(n.x,n.y-s);ctx.lineTo(n.x+s,n.y);ctx.lineTo(n.x,n.y+s);ctx.lineTo(n.x-s,n.y);ctx.closePath()}
      else{const s=n.r*.85;ctx.rect(n.x-s,n.y-s,s*2,s*2)}
      const lit=!nb||nb.has(i);
      ctx.shadowColor=n.color;ctx.shadowBlur=i===hover?24:(lit?11:0);
      ctx.fillStyle=n.color;ctx.globalAlpha=lit?.96:.16;ctx.fill();
      ctx.shadowBlur=0;ctx.globalAlpha=1;
      if(i===hover){ctx.lineWidth=1.6/scale;ctx.strokeStyle='#fff';ctx.stroke()}
      const showLabel=i===hover||(nb&&nb.has(i))||(n.type!=='agent'&&scale>=1.15)||(n.type==='agent'&&scale>=1.8);
      if(showLabel&&lit){ctx.font=(n.type==='agent'?10:11)/scale+'px Inter,system-ui,sans-serif';
        ctx.fillStyle='rgba(201,214,236,.85)';ctx.textAlign='center';
        ctx.fillText(n.label,n.x,n.y-n.r-(5/scale));}
    });
    ctx.restore();
    if(hover>=0){const n=nodes[hover],sx=n.x*scale+ox,sy=n.y*scale+oy;
      const t1=n.label,t2=(n.meta.sub||'')+(n.type!=='agent'?' · '+n.deg+' link'+(n.deg===1?'':'s'):'');
      ctx.font='bold 11px Inter,system-ui,sans-serif';
      const w=Math.max(ctx.measureText(t1).width,ctx.measureText(t2).width)+16;
      const bx=Math.min(W-w-6,Math.max(6,sx+14)),by=Math.max(6,sy-46);
      ctx.fillStyle='rgba(14,34,68,.95)';
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(bx,by,w,36,7);ctx.fill()}else ctx.fillRect(bx,by,w,36);
      ctx.strokeStyle='rgba(201,214,236,.25)';ctx.lineWidth=1;ctx.strokeRect?ctx.strokeRect(bx+.5,by+.5,w-1,35):null;
      ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(t1,bx+8,by+15);
      ctx.font='10px Inter,system-ui,sans-serif';ctx.fillStyle='#C9D6EC';ctx.fillText(t2,bx+8,by+29);}
  }
  cv.onmousedown=e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,i=pick(px,py);
    if(i>=0){drag={node:nodes[i],moved:false};alpha=Math.max(alpha,.4)}else pan={px,py,ox,oy};
    cv.style.cursor='grabbing'};
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
    if(drag){const w=toWorld(px,py);drag.node.x=w[0];drag.node.y=w[1];drag.node.vx=0;drag.node.vy=0;drag.moved=true;alpha=Math.max(alpha,.3)}
    else if(pan){ox=pan.ox+(px-pan.px);oy=pan.oy+(py-pan.py)}
    else hover=pick(px,py);
    cv.style.cursor=(drag||pan)?'grabbing':'grab'};
  window.addEventListener('mouseup',function up(){
    if(!cv.isConnected){window.removeEventListener('mouseup',up);return}
    drag=null;pan=null;cv.style.cursor='grab'});
  cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
    const z=e.deltaY<0?1.12:.89,ns=Math.max(.25,Math.min(4,scale*z));
    ox=px-(px-ox)*(ns/scale);oy=py-(py-oy)*(ns/scale);scale=ns};
  (function loop(){if(!cv.isConnected)return;physics();draw();requestAnimationFrame(loop)})();
}

/* ---------------- THE COVERAGE LAW ----------------
   specs/dialler-attribution-framework.md §5. One agent with no dialler row is ordinary — leave,
   training, an admin day. A WHOLE campaign at zero while its people are on the floor is a
   FILTERED EXPORT, and that is invisible without this check: the file parses, every row it does
   carry attributes correctly, and the trust bar goes green while a quarter of the business has
   no calls. It cost a fortnight on 13 Aug — 26 Cuddle agents, 24 marked present, 22 booking
   sales, and not one dial, because the ViciDial pull was filtered by user group.
   Campaign comes from the Agent List, never from the export (non-negotiable 7). */
function dialCoverage(win){
  const roster=state.facts.AGENT_LIST||[];
  if(!roster.length)return null;
  const G={};
  /* campBucket only knows Cuddle/Courtesy/VT; Nesting and anything new keep their roster label
     rather than collapsing into one bucket that hides which floor is dark. */
  const grp=a=>campBucket(a.queue)||String(a.queue||'').trim()||'(no campaign)';
  roster.forEach(a=>{if(!a.cb_norm)return;
    (G[grp(a)]=G[grp(a)]||{roster:new Set(),present:new Set(),dialled:new Set()}).roster.add(a.cb_norm)});
  const P=new Set((resolveRule('$presentCodes')||[]).map(s=>String(s).toUpperCase()));
  rowsNF('ATTENDANCE',win).forEach(r=>{
    if(!P.has(String(r.status_code||'').toUpperCase()))return;
    const cb=normCB(r.employee_code);const a=state.cbInfo[cb];if(!a)return;
    const g=grp(a);if(G[g])G[g].present.add(cb)});
  const mark=cb=>{const a=cb&&state.cbInfo[cb];if(!a)return;
    const g=grp(a);if(G[g])G[g].dialled.add(cb)};
  rowsNF('CALLX_CALL_RECORDS',win).forEach(r=>mark(cbOf(r.agent)));
  rowsNF('VICI_CALL_REPORT',win).forEach(r=>mark(viciCbOf(r)));
  const out=Object.keys(G).sort().map(g=>{const o=G[g];
    const present=o.present.size,dialled=o.dialled.size;
    let v='ok',why=dialled+' dialling of '+present+' present';
    if(!present&&!dialled){v='none';why='no attendance rows for this campaign in the window'}
    else if(present&&!dialled){v='fail';why=present+' present but ZERO dialler rows — the export is filtered or missing'}
    else if(present&&dialled/present<0.5){v='warn';why='only '+dialled+' of '+present+' present agents have dialler rows'}
    return{g,roster:o.roster.size,present,dialled,v,why}});
  return{groups:out,failed:out.filter(x=>x.v==='fail'),warned:out.filter(x=>x.v==='warn')};
}
/* The user_group census is the EVIDENCE for a fail: it says what the pull actually covered, so
   the cause sits beside the symptom instead of needing a separate investigation. */
function viciGroupCensus(win){
  const c={};rowsNF('VICI_CALL_REPORT',win).forEach(r=>{const g=String(r.user_group||'').trim()||'(blank)';c[g]=(c[g]||0)+1});
  return Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>({g:k,n:c[k]}));
}
function coverageCard(win){
  const cv=dialCoverage(win);

function setThresh(id,field,val){const k=state.kpis.find(x=>x.id===id);if(!k)return;
  const n=val===''?null:parseFloat(val);k[field]=(n==null||isNaN(n))?null:n;
  saveConfig();render();toast(k.name+' — thresholds updated across all dashboards','ok')}
function setDir(id,val){const k=state.kpis.find(x=>x.id===id);if(!k)return;k.dir=val;saveConfig();render();toast(k.name+' — direction flipped')}
function resetThresh(id){const k=state.kpis.find(x=>x.id===id);const d=DEFAULT_KPIS.find(x=>x.id===id);if(!k||!d){toast('No default for this custom KPI — set values manually');return}
  k.green=d.green;k.amber=d.amber;k.dir=d.dir;saveConfig();render();toast(k.name+' — restored to default thresholds','ok')}
function clearThresh(id){const k=state.kpis.find(x=>x.id===id);if(!k)return;k.green=null;k.amber=null;saveConfig();render();toast(k.name+' — RAG removed (informational metric)')}
function toggleKPI(id,on){const k=state.kpis.find(x=>x.id===id);if(k){k.show=on;saveConfig();toast(k.name+(on?' shown':' hidden'))}}
function deleteKPI(id){const k=state.kpis.find(x=>x.id===id);if(!k)return;if(!confirm('Delete "'+k.name+'"? (Defaults can be restored later.)'))return;state.kpis=state.kpis.filter(x=>x.id!==id);saveConfig();render()}
function restoreKPIs(){if(!confirm('Restore the default KPI set? Custom KPIs are kept.'))return;const custom=state.kpis.filter(k=>!k.core);state.kpis=structuredClone(DEFAULT_KPIS).concat(custom);saveConfig();render();toast('Default KPIs restored','ok')}
function restoreRules(){if(!confirm('Restore all interpretation rules to defaults?'))return;state.rules=structuredClone(DEFAULT_RULES);saveConfig();render();toast('Rules restored to defaults','ok')}
function ruleAdd(key){const inp=document.getElementById('rin_'+key);const v=(inp.value||'').trim();if(!v)return;state.rules[key].vals.push(v);inp.value='';saveConfig();render();toast('Rule updated — all KPIs recalculated','ok')}
function ruleDel(key,i){state.rules[key].vals.splice(i,1);saveConfig();render();toast('Rule updated — all KPIs recalculated','ok')}
/* A MAPPING MUST ACTUALLY TAKE EFFECT (perf audit, 2026-08-28). This writes the alias
   the whole Mappings tab exists to set, but never bumped the data version — so the
   row cache, the owner-match cache and (now) the cbOf cache all kept serving the old
   attribution, and the figures the mapping was meant to correct did not move until
   something else happened to invalidate them. */
function mapAgent(name,code){
  if(code)state.agentMap[name]=normCB(code);else delete state.agentMap[name];
  saveConfig();
  bumpDataVer();                      // identity changed: every cached read must be re-taken
  toast('Mapping saved');
  try{render()}catch(e){}
}
