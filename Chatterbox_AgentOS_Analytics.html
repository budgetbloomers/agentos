function pageManual(){return '<div class="card guide" style="max-width:900px">'+"\n<h2>1 · Read the colours first</h2>\n<p>Every KPI card and status dot uses one traffic-light system. Learn it once and you can read any page at a glance:</p>\n<ul>\n<li><b style=\"color:#34D399\">GREEN</b> — on target. The metric is at or better than its goal.</li>\n<li><b style=\"color:#FBBF24\">AMBER</b> — watch. Slipping toward a problem; keep an eye on it.</li>\n<li><b style=\"color:#FB7185\">RED</b> — act. Below target; it needs an owner and an action today.</li>\n<li><b style=\"color:#8296B5\">GREY</b> — informational, no target set.</li>\n</ul>\n<p>Each KPI shows its <b>value</b>, its <b>target</b> (e.g. \"target ≥ 90%\"), a trend arrow versus the previous period, and a mini-sparkline. Click any KPI for its full definition and what to do when it turns red.</p>\n\n<h2>2 · The rules behind the scores (NBA v3.0)</h2>\n<p>Agents are scored by The Chatterbox NBA Scoring Framework. You do not calculate anything — the system does — but knowing the rules tells you <i>why</i> an agent is flagged.</p>\n\n<h3>The Two-Check Sales Rule</h3>\n<p><b>Value is always checked before Volume.</b> Check 1 (Value): GWP per sale ≥ R99. Check 2 (Volume): daily sales vs the agent's tenure target. A high sales count at low value still fails — because it costs the business on every policy.</p>\n<table class=\"tbl\"><thead><tr><th>Value</th><th>Volume</th><th>Status → coach on</th></tr></thead><tbody>\n<tr><td>PASS</td><td>PASS</td><td>On Target → stretch goals</td></tr>\n<tr><td>FAIL</td><td>PASS</td><td>Value Issue → product mix & upselling</td></tr>\n<tr><td>PASS</td><td>FAIL</td><td>Volume Issue → activity, pipeline, closing</td></tr>\n<tr><td>FAIL</td><td>FAIL</td><td>Both → value coaching takes priority</td></tr>\n</tbody></table>\n<p>Tenure daily-sales targets: <b>M1 = 3, M2 = 4, EXP-Courtesy = 5, EXP-Cuddle = 8</b>. GWP/sale target is R99 for everyone. Agents are only ever compared with peers at the same tenure.</p>\n\n<h3>The Decision Ladder — one action per agent</h3>\n<p>Rules are checked top-to-bottom; the <b>first one that triggers is the agent's single Next Best Action</b>. Most serious always wins.</p>\n<ul>\n<li><b style=\"color:#FB7185\">Level 1 · Protect the Business</b> — R1 Zero Attendance · R2 Critical QA (&lt;80%) · R2A-3 Critical Compliance · R3 Attendance Risk (&lt;80%).</li>\n<li><b style=\"color:#FBBF24\">Level 2 · Protect the Revenue</b> — R2A-2 Compliance Risk · R4 GWP Value Failure (&lt;R99) · R4A Critical Sales-Volume · R5 Moderate QA (80–89%) · R6 Low Sales (70–89%).</li>\n<li><b style=\"color:#3D9BFF\">Level 3 · Improve the Skill</b> — R7 Conversion below target · R8 Talk Time (&lt;150 min/day) · R2A-1 Compliance Note (logged only).</li>\n<li><b style=\"color:#34D399\">Level 4 · Develop & Recognise</b> — R9 Developing (90–99%) · R10 Strong/Elite (meets all targets).</li>\n</ul>\n\n<h3>Graduated Critical-Fail (R2A)</h3>\n<p>Critical Fail Rate (CFR) = critical fails ÷ audited calls. The tier is the <b>higher</b> of the count band and the rate band, and the penalty is <b>capped at −10</b>:</p>\n<table class=\"tbl\"><thead><tr><th>Tier</th><th>Trigger</th><th>Composite</th><th>Elite</th></tr></thead><tbody>\n<tr><td>R2A-3</td><td>≥4 fails OR CFR ≥30%</td><td>−10</td><td>Blocked</td></tr>\n<tr><td>R2A-2</td><td>2–3 fails OR CFR 10–&lt;30%</td><td>−5</td><td>Blocked</td></tr>\n<tr><td>R2A-1</td><td>exactly 1 fail AND CFR &lt;10%</td><td>−2</td><td>Retained (a note, never a primary NBA)</td></tr>\n</tbody></table>\n\n<h3>The Composite Score (/100)</h3>\n<p>Seven weighted metrics sum to 100, then the capped critical-fail penalty is applied and reported as <b>'Adj'</b>: Avg GWP/Sale <b>25</b>, Target Achievement <b>20</b>, QA <b>20</b>, Total GWP percentile <b>15</b>, Conversion <b>10</b>, Talk Time <b>5</b>, Attendance <b>5</b>. Cancellations and attempts-per-lead are diagnostics — they are never scored.</p>\n\n<h2>3 · How to use the software</h2>\n<ol>\n<li><b>Check Data Trust first.</b> The bar at the top of the page shows every source's freshness — green is fresh, amber/red is stale. A beautiful chart on stale data is a confident wrong answer, so always read the trust bar before the numbers.</li>\n<li><b>Upload your exports</b> in the Upload Station. The type is detected from the headers; rejected rows are logged with reasons, never silently dropped.</li>\n<li><b>Filter and set the date range</b> in the top bar — every KPI, chart and table re-window to your selection.</li>\n<li><b>Click any agent's name</b> (on any table or chart) to open their full card — framework score, the primary NBA, the composite breakdown, graphs, peer comparison, and an AI coaching analysis of what to improve.</li>\n<li><b>Ask AgentOS</b> — the chat bubble in the bottom-right answers questions about the numbers on screen, the framework, and the business. It never invents figures.</li>\n</ol>\n\n<h2>4 · The weekly rhythm</h2>\n<p><b>Daily</b> the system assigns one NBA per agent. <b>Every Monday</b> the Team Leader confirms the data and sets owners and due dates. <b>During the week</b> the coaching happens. <b>At the next review</b> — clear the NBA if resolved, escalate if not. If a red number has no owned action, the system has failed.</p>\n\n<h2>Privacy (POPIA)</h2>\n<p>PII masking is on by default: names become initials, numbers and emails are partially hidden. The toggle in the footer is for authorised eyes doing casework — turn it back on before screen-sharing. Customer contact details are never needed for any KPI on these pages.</p>\n\n<h2>If something looks wrong</h2>\n<p>Work the chain in order: <b>Trust bar</b> (is the source fresh?) → <b>Upload audit</b> (did the batch load with warnings?) → <b>Exceptions</b> (what got rejected and why?) → <b>Rules</b> (does \"pass\"/\"present\" mean what you think?) → then, and only then, question the floor. Nine times out of ten the answer is in the first two steps.</p>\n"+'</div>'}

const RETIRED_SRC=['SF_ACTIVATED_SERVICES'].concat(SES_TIMES.map(t=>'SES_ACT_'+t));
async function purgeRetired(){
  if(await load('cb-purged-activations'))return 0;
  let n=0;

  }

/* A saved config is a snapshot of the KPI DEFINITIONS as they were when it was
   saved. Definitions are code — restoring old ones verbatim resurrects retired
   sources (e.g. activations → SF_ACTIVATED_SERVICES after the BI cutover), and
   evalKPI on a source that no longer exists used to take the whole page down.
   So: every core KPI takes its CURRENT definition from DEFAULT_KPIS and keeps
   only the user's dials (thresholds, direction, visibility, owner); custom KPIs
   survive only if every source they reference still exists. */
let __kpisMigrated=false;
function migrateKpis(saved){
  const out=structuredClone(DEFAULT_KPIS);
  for(const k of out){const s=saved.find(x=>x.id===k.id);if(!s)continue;
    k.green=s.green;k.amber=s.amber;if(s.dir)k.dir=s.dir;k.show=s.show!==false;if(s.owner)k.owner=s.owner}
  const srcOK=k=>[k.src,k.num?.src,k.den?.src].filter(Boolean).every(s=>SOURCES[s]);
  for(const s of saved){
    if(s.core||out.some(x=>x.id===s.id))continue;      // core defs come from code, above
    if(srcOK(s)){out.push(s);continue}
    __kpisMigrated=true;
    console.warn('[AgentOS] dropped custom KPI "'+(s.name||s.id)+'" — it references a retired source');
  }
  // detect definition drift so the healed set is saved back over the stale one
  if(!__kpisMigrated)__kpisMigrated=saved.some(s=>{const d=out.find(x=>x.id===s.id);
    return d&&(d.src!==s.src||JSON.stringify(d.num??null)!==JSON.stringify(s.num??null))});
  return out;
}

/* PHASE A — paint from the local IndexedDB snapshot before any network happens. The auth

let __localPainted=false;
async function initLocal(){

    if(__initGen)return;

    // Paint EITHER WAY: with a snapshot this is last session's data; without one it is

    render();
    const fa=$('#footAsof');if(fa)fa.textContent+=__localPainted?' · showing last-loaded data — refreshing from the cloud…':' · waiting for the cloud…';

if(document.readyState!=='loading')initLocal();else document.addEventListener('DOMContentLoaded',initLocal);
async function init(){
  const gen=++__initGen;
  state.kpis=structuredClone(DEFAULT_KPIS);
  state.rules=structuredClone(DEFAULT_RULES);
  // shell first — never leave the user on a blank frame while ANY network runs
  if(!__localPainted){try{bumpDataVer();render()}catch(e){}}
  const [cfg,audit]=await Promise.all([load('cb-config'),load('cb-audit')]); // PERF: parallel boot reads
  if(gen!==__initGen)return; // a newer (post-login) init superseded this run
  applyCfg(cfg);
  if(audit){state.batches=audit.batches||[];state.exceptions=audit.exceptions||[]}
  // FIRST PAINT NOW — the shell, nav, trust bar and whatever the local snapshot already
  // put on screen must never wait for the fact downloads. The blank-screen-until-every-
  // blob-arrives boot is what read as "the app is not loading" on a slow connection.
  bumpDataVer();
  $('#userNm').textContent=state.user;$('#userAv').textContent=state.user[0]||'A';
  render();
  {const fa=$('#footAsof');if(fa&&!/downloading/.test(fa.textContent))fa.textContent+=' · downloading data from the cloud…'}
  // Parallel + resilient: 15 multi-MB sources load at once; one slow or failed
  // source never blocks or serialises behind the others.
  /* CONDITIONAL LOADS (perf audit, 2026-08-27). The boot used to re-download EVERY fact
     blob — ~154 MB across the Salesforce books and the dialler — on every open, even when
     nothing had changed since the local IndexedDB snapshot. One /api/kv-meta call now
     fetches every source's cloud updated_at; a source whose stamp matches the local
     mirror's is served from the mirror (memory if Phase A got there, IndexedDB if not)
     and never downloaded. A changed source, a cold cache, or any meta failure downloads
     exactly as before — the cloud stays the authority.
     A STAMP IS A CLAIM THAT THIS DEVICE HOLDS THAT VERSION, so it is recorded ONLY for a
     source actually reused or freshly downloaded in this boot (audit round 3, 2026-08-27).
     Writing the whole cloud map regardless — the first cut — meant one failed download
     stamped a version this device did NOT have, and every later boot then served the older
     mirror copy believing it was current: stale data presented as fresh, silently, until
     the cloud stamp happened to move again. A source that fails simply keeps its old stamp
     (or none) and is re-downloaded next boot. */
  let __cloudMeta=null,__localMeta=null;
  try{
    const t=sessionStorage.getItem('cbx_token');
    if(t){const mr=await fetch('https://chatterbox-agentos-api.chatterbox-agentos.workers.dev/api/kv-meta?prefix=cb-facts-',{headers:{'Authorization':'Bearer '+t}});
      if(mr.ok){__cloudMeta=((await mr.json())||{}).keys||null;__localMeta=await idbGet('cb-meta');}}
  }catch(e){}
  if(gen!==__initGen)return;
  let __reused=0;
  const __heldMeta=Object.assign({},__localMeta||{});   // what this device can honestly claim
  await Promise.all(SRC_KEYS.map(async k=>{try{
    const mk='cb-facts-'+k;
    const stamp=__cloudMeta&&__cloudMeta[mk];
    if(stamp&&__localMeta&&__localMeta[mk]===stamp){
      if(window.storage&&window.storage.ver) window.storage.ver[mk]=stamp;   // the version this copy IS — a compare-and-set save needs it
      if(state.facts[k]&&state.facts[k].length){__reused++;return}     // Phase A already painted it
      const f0=await idbGet(mk);
      if(f0&&f0.length){state.facts[k]=f0;__reused++;return}           // mirror has it — no download
    }
    const f=await load(mk);
    if(gen!==__initGen) return;                        // a newer init() owns state now — never write behind it
    if(f&&f.length){
      state.facts[k]=f;
      /* Two things must BOTH be true before this device claims to hold that version:
         the value came from the cloud (storage.get falls back to its local cache when the
         network fails — deliberate, but it is not a download), and the mirror write landed
         (a quota rejection is asynchronous and used to be invisible). Either one unknown and
         we claim nothing, so the next boot re-downloads instead of serving a stale copy. */
      const fromCloud=!(window.storage&&window.storage.fresh)||window.storage.fresh[mk]===true;
      const mirrored=await (__idbPutP[mk]||Promise.resolve(true));
      if(stamp&&fromCloud&&mirrored)__heldMeta[mk]=stamp; else delete __heldMeta[mk];
    }
    else if(!f) delete __heldMeta[mk];                                    // failed or empty: claim nothing
  }catch(e){ delete __heldMeta['cb-facts-'+k]; }}));   // SES_* load on demand — see ensureSession()
  if(__cloudMeta&&gen===__initGen)idbPut('cb-meta',__heldMeta);
  if(__reused)console.info('[AgentOS] '+__reused+' source(s) unchanged since last visit — served from the local snapshot, not re-downloaded');
  if(gen!==__initGen)return;
  await purgeRetired();                      // after the loads, so SES_ACT_* rows are caught too
  if(gen!==__initGen)return;
  if(__kpisMigrated){__kpisMigrated=false;saveConfig();   // heal the stale cloud copy once
    console.info('[AgentOS] KPI definitions refreshed from code (saved config predated a source retirement) — config re-saved')}
  bumpDataVer();
  __initDone=true;
  // Auto-unmask names for authorised users (admins / users with pii_unmask).
  // POPIA-safe: restricted users stay masked; the footer toggle still overrides.
  try{var U=window.CBX_USER;if(U){if(U.full_name||U.username)state.user=U.full_name||U.username;
    if(U.pii_unmask||U.role==='admin'){state.unmasked=true;var sw=document.getElementById('piiSwitch');if(sw)sw.checked=true;var ps=document.getElementById('piiState');if(ps)ps.textContent='Off — authorised view';}}}catch(e){}
  $('#userNm').textContent=state.user;$('#userAv').textContent=state.user[0]||'A';
  render();
  syncReferralsFromAPI(true);   // referrals pull themselves from HighLevel on every sign-in — no manual upload needed
  setTimeout(function(){try{if(!(state.facts.REFERRALS||[]).length)syncReferralsFromAPI(true)}catch(e){}},20000);   // one retry if the first pull hit a transient failure
  syncRosterFromVAS();          // the Agent List follows the VAS Upload Station — see the function's note
  syncUploadsFromVAS();         // ...and so does every other export, as raw files through this app's own parser
  if(!window.__rosterSyncTimer)window.__rosterSyncTimer=setInterval(function(){syncRosterFromVAS();syncUploadsFromVAS()},600000);   // re-check every 10 min
  /* THE LIST MUST BE FRESH WHEN SOMEONE LOOKS (Nick, 2026-08-27: "everytime the agent list
     is uploaded data must change"). The 10-minute timer leaves a window where a list just
     uploaded in VAS has not reached this app — so coming back to this tab re-syncs at once,
     throttled to one pull a minute. The Worker's own roster cache is 120s, which bounds
     total staleness at about two minutes instead of ten. */
  if(!window.__rosterFocusWired){window.__rosterFocusWired=1;
    var focusSync=function(){var n=Date.now();
      if(n-(window.__rosterFocusSync||0)<60000)return;
      window.__rosterFocusSync=n;syncRosterFromVAS();syncUploadsFromVAS();};
    window.addEventListener('focus',focusSync);
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')focusSync();});
    /* AND THE MOMENT VAS ARCHIVES ONE. Same origin, so the upload station can say so
       directly instead of this app waiting for its next ten-minute sweep. Throttled by
       the same one-a-minute rule as focus, and purely an accelerator — every other
       trigger still works if the channel is unavailable or the tab is closed. */
    try{ if('BroadcastChannel' in window){
      var ch=new BroadcastChannel('cbx-uploads');
      ch.onmessage=function(ev){ if(ev&&ev.data&&ev.data.t==='archived') focusSync(); };
    } }catch(e){}
  }
}

/* ---------------- IN-APP TRAINING GUIDE ---------------- */


// Boot gating: load cloud data ONLY after a confirmed sign-in, so every read
// carries the Bearer token. auth-gate.js dispatches 'cbx-authed' once the
// session is validated — for both a fresh login and a returning session — so
// keying off it means init() never fires token-less against the cloud (the old
// "init at page load" bug: a slow login passed the 8s fallback, lost the token,
// and rendered "Never uploaded" forever). file:// / offline loads after 9s.
document.addEventListener('cbx-authed', function(){ init(); }, { once:true });
document.addEventListener('cbx-authed', function(){ if(__initDone) init(); }); // later re-auths refresh cloud data
/* Offline / file:// fallback ONLY. This used to fire unconditionally, so an agent
   who took more than nine seconds to type their password had the whole data load
   kick off underneath them mid-keystroke — fourteen parallel fetches that then
   went out unauthenticated, came back 401, and fell back to the local cache. If
   the sign-in overlay is still up, auth-gate is alive and `cbx-authed` will start
   the load at the right moment; there is nothing for this timer to rescue. */
setTimeout(function(){
  if(__initGen) return;
  if(document.getElementById('cbxAuth')) return;   // still signing in — let cbx-authed do it
  init();
}, 9000);
</script>

<script>/* cbx-nba-push: THE WEEKLY REVIEW, PUBLISHED FROM THE APP THAT COMPUTES IT.
   Found 2026-08-28: kv:nba-digest was last written on 24 August over a window of
   2022-08-27 to 2026-08-22 — 1 040 working days — and NOTHING in the codebase wrote
   it. Only readers. So the next best action every team leader and every agent sees
   was frozen four days old and computed over four years: one agent read QA 27,2%
   against a real 55,5% and was handed a P1 "Critical QA Failure", a 48-hour
   compliance action, on a four-year average.

   Ops already computes every field of this payload for its own screens — acStats,
   acNBA, acComposite, cfTier, acWeakestDriver. It simply never published them. This
   publishes exactly what the portal reads, over THE PERIOD ON SCREEN, on the same
   cadence and with the same guards as the AI digest beside it: never without a
   token, never an empty session over a rich payload, never an unchanged repost. */
(function(){
  var last='';
  /* THE REVIEW WINDOW IS THE REPORTING MONTH — NOT WHATEVER RANGE IS ON SCREEN.
     Found 2026-08-31: the live payload ran 2025-10-01 to 2026-08-28, 238 working days,
     because this built from periodWindow() and state.range is SHARED UI state — whoever
     last opened Ops with "all data" selected set the review window for every agent and
     every team leader in the portal. On that window a Cuddle agent at 128% of target for
     August read 17.7% and was handed "R4A Critical Sales-Volume Failure — start PIP".
     The August fix resolved the 1900-01-01 sentinel; it did not stop the window itself
     travelling. The ladder is DEFINED over a reporting period, so the publisher decides
     the period and the dropdown cannot reach it. */
  /* R2A_TIERS.rule_name, so the published tier carries the words the rule book gives it —
     cfTier returns no rule field, so this used to publish rule:undefined. */
  var R2A_RULE={'Tier 0':'Clean','R2A-1':'Compliance Note','R2A-2':'Compliance Risk','R2A-3':'Critical Compliance Fail'};
  function reviewWindow(){
    var to=isoDay(anchorDate());
    return {from:to.slice(0,8)+'01', to:to};
  }
  function winDays(w){
    var a=Date.parse(w.from+'T00:00:00Z'), b=Date.parse(w.to+'T00:00:00Z');
    return (isNaN(a)||isNaN(b))?null:Math.round((b-a)/86400000)+1;
  }
  function build(){
    var win=reviewWindow();
    /* Belt and braces: a month can be 31 days and never more. A payload wider than that
       is a bug upstream of here and must not reach a team leader's triage list. */
    var wd=winDays(win);
    if(wd==null||wd<1||wd>62) return null;
    var C=acCtx(win);
    var codes=Object.keys(state.cbInfo||{}).filter(cbInScope);
    if(!codes.length) return null;
    var stats=codes.map(function(cb){ return acStats(cb,win,C); });
    applyGroupPercentiles(stats);                       // the composite needs its peer percentile
    var T=function(k){ return nbaVal(k,0); };
    var agents=stats.map(function(st){
      var nba=acNBA(st), tier=cfTier(st), drv=acWeakestDriver(st), comp=st.comp||acComposite(st,null);
      var i=state.cbInfo[st.cb]||{};
      /* THE TWO-CHECK RULE, the same one the drill-down prints: value is GWP per sale
         against the floor, volume is target achievement against the R4A line. */
      var value=(st.gwpSale!=null)?st.gwpSale>=gwpFloorIncl():null;
      /* CHECK 2 PASSES AT 100% OF TARGET — Chatterbox_Decision_Rules.xlsx, NBA_THRESHOLDS:
         "target_ach | 100 | % | Check 2 passes at or above this." This used to read
         T('sales_critical_pct'), which the workbook does define (70, the line R4A FIRES at)
         but which nbaThresholds carries under the name salesLow — so nbaVal returned its
         default of 0, the test was "ta >= 0", and every agent with any figure at all passed.
         Live on 2026-08-31: 49 of the 57 agents under 70% were published volume:true, which
         is how "Both Pass" came to print beside a reason reading "volume is 17.7% of target".
         Passing at 100% also makes this agree with the on-target count both apps already
         compute as sales >= target, so one agent can no longer be on target on one screen
         and off it on the next. 70 and 89 keep their own jobs on the ladder: R4A below 70,
         R6 between 70 and 89. */
      var volume=(st.ta!=null)?st.ta>=nbaVal('targetAch',100):null;
      return {cb:st.cb,name:st.name,tl:st.tl,group:st.group,tenure:st.tenure,campaign:st.queue,
        nba:nba?{code:nba.code,lvl:nba.lvl,lvlName:nba.lvlName,label:nba.label,
                 reason:nba.detail,action:nba.action,hrs:null}:null,
        composite:{raw:comp?comp.raw:null,adj:comp?comp.adj:null,pen:comp?comp.pen:0,
                   cfPen:comp?comp.cfPen:0,coachPen:comp?comp.coachPen:0},
        /* lvl travels because the reader colours the tier with it — without it R2A-3, the
           most severe compliance tier, rendered the same amber as R2A-1. */
        r2a:{tier:tier.tier||'Tier 0',rule:R2A_RULE[tier.tier||'Tier 0']||'',lvl:tier.lvl,penalty:tier.pen,elite:tier.elite,
             fails:st.crit,cfr:tier.cfr==null?null:Math.round(tier.cfr*10)/10},
        twoCheck:{value:value,volume:volume,
          status:(value&&volume)?'Both Pass':((!value&&!volume)?'Both Issues':(value?'Volume Issue':'Value Issue')),
          gwpSale:st.gwpSale==null?null:Math.round(st.gwpSale*100)/100,
          ta:st.ta==null?null:Math.round(st.ta*10)/10},
        stats:{sales:st.sales,gwp:Math.round(st.gwp),ta:st.ta,gwpSale:st.gwpSale,qa:st.qaS,
               qaN:st.qaN,conv:st.conv,talkDay:st.talkDay,att:st.att,present:st.p,
               scheduled:st.sched,target:i.target==null?null:i.target},
        /* acWeakestDriver returns {driver,label,points} — this read drv.key, which is
           undefined, so every published row carried key:undefined and the team leader's
           "where your time buys the most" table looked the agent's figure up by it and
           printed a dash on all 96 rows. */
        driver:drv?{key:drv.driver,label:drv.label,points:Math.round((drv.points||0)*10)/10}:null};
    });
    /* PUBLISH THE EFFECTIVE WINDOW, NOT THE SENTINEL. periodWindow() returns
       from:'1900-01-01' for "all data", and that is how the frozen review came to be
       stamped 2022-08-27 to 2026-08-22 — nobody typed a wrong date; the window simply
       had no lower bound and swallowed four years of history. winFrom() resolves the
       sentinel to the earliest real data day, which is what every label already shows,
       and workDays() has always clamped it the same way. */
    var pFrom=winFrom(win);
    return {v:1,updatedAt:new Date().toISOString(),
      period:{from:pFrom,to:win.to},workDays:workDays(win),
      thresholds:{gwpFloor:T('gwpFloor'),qaTarget:T('qaTarget'),qaCritical:T('qaCritical'),
        attTarget:T('attTarget'),attRisk:T('attRisk'),convTarget:T('convTarget'),
        /* The two lines, published rather than repeated: the agent's two-check card and the
           team leader's table both used to hard-code their own figure (70 and 100), so one
           screen could call an agent a pass and the next a fail. targetAch is where check 2
           passes; salesLow is where R4A fires. */
        targetAch:nbaVal('targetAch',100), salesLow:nbaVal('salesLow',70),
        talkTargetMin:T('talkTargetMin'),talkFloorMin:T('talkFloorMin')},
      /* the penalty rule this engine ran under — a copy without it was built by an older engine
         (see push's self-heal); 0/0/0 since 2026-09-11 */
      rules:{pen:[nbaVal('pen1',0),nbaVal('pen2',0),nbaVal('pen3',0)]},
      agents:agents};
  }
  function push(){
    try{
      if(!sessionStorage.getItem('cbx_token'))return;
      if(typeof periodWindow!=='function'||typeof acStats!=='function'||!window.storage)return;
      if(!Object.keys(state.cbInfo||{}).length)return;   // an empty session must never overwrite
      var p=build(); if(!p||!p.agents.length)return;
      var cmp=JSON.stringify(p.agents)+p.period.from+p.period.to;   // ignore updatedAt churn
      /* A STALE PUBLISHER MUST NOT WIN (2026-09-11): the runner republishes this key every fifteen
         minutes from main's code; a copy without `rules` came from an engine that still deducted
         R2A points, and this tab republishes over it even though its own payload is unchanged. */
      if(cmp===last){
        try{ Promise.resolve(window.storage.get('nba-digest')).then(function(t){ var d=null; try{ d=JSON.parse(t||''); }catch(e){}
          if(d&&!d.rules) window.storage.set('nba-digest', JSON.stringify(p)); }).catch(function(){}); }catch(e){}
        return; }
      last=cmp;
      window.storage.set('nba-digest', JSON.stringify(p));
    }catch(e){}
  }
  window.__nbaPush=push;                                 // manual trigger + the test harness
  setInterval(push,180000);
  document.addEventListener('cbx-authed', function(){ setTimeout(push,12000); });
  setTimeout(push,15000);
})();</script>

<script>/* cbx-digest-push: keep the Ops AI digest current in the cloud */
(function(){
  var last='';
  function push(){
    try{
      if(!sessionStorage.getItem('cbx_token'))return;
      if(typeof cbxContext!=='function'||!window.storage)return;
      if(window.__pushedVer===_dataVer)return; // PERF: digest recompute only when data changed
      var t=cbxContext(); if(!t||t.indexOf('CTX_ERROR')===0)return;
      if(!Object.keys(state.cbInfo||{}).length)return; // empty session must never overwrite a rich digest
      if(t===last)return; last=t;
      window.__pushedVer=_dataVer;
      window.storage.set('ai-digest-ops', t);
    }catch(e){}
  }
  setInterval(push, 90000);
  document.addEventListener('cbx-authed', function(){ setTimeout(push, 6000); });
  setTimeout(push, 9000);
})();</script>
<script>/* cbx-fresh: multi-user visibility — when ANOTHER user uploads, open tabs
   see cb-audit's updated_at move (meta poll, no payload) and re-init from the
   cloud. Fixes: user B logged into the same account couldn't see user A's
   uploads until a manual hard refresh. */
(function(){
  var API='https://chatterbox-agentos-api.chatterbox-agentos.workers.dev/api/kv';
  var seen=null;
  function check(){
    try{
      var t=sessionStorage.getItem('cbx_token'); if(!t)return;
      if(typeof __initDone==='undefined'||!__initDone)return;               // boot not finished yet
      if(Date.now()-(window.__cbxLastWrite||0)<240000){seenAdopt();return}  // this tab just wrote — adopt, don't re-init
      var ae=document.activeElement;
      if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;               // never clobber mid-edit
      fetch(API+'?key=cb-audit&meta=1',{headers:{'Authorization':'Bearer '+t}})
        .then(function(r){return r.ok?r.json():null})
        .then(function(j){
          if(!j||!j.updated_at)return;
          if(seen===null){seen=j.updated_at;return}                          // first sighting = current state
          if(j.updated_at!==seen){seen=j.updated_at;init();}                 // someone else uploaded → re-pull
        }).catch(function(){});
    }catch(e){}
  }
  function seenAdopt(){
    var t=sessionStorage.getItem('cbx_token'); if(!t)return;
    fetch(API+'?key=cb-audit&meta=1',{headers:{'Authorization':'Bearer '+t}})
      .then(function(r){return r.ok?r.json():null})
      .then(function(j){ if(j&&j.updated_at)seen=j.updated_at; }).catch(function(){});
  }
  setInterval(check,240000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden)check(); });
  document.addEventListener('cbx-authed',function(){ setTimeout(check,15000); });
})();</script>
<script>(function(){

/* ---- PERSISTENCE HEALTH BANNER (save-reliability-plan P2c) ----
   The Worker cron compares the upload archive's clock against both apps' state
   clocks and writes kv:health-alerts when files keep arriving while neither
   state saves — the 28-31 Aug incident's signature, seen from the server side.
   Every staff tab polls it, so the people who can act see it inside the tool
   they already have open; the banner clears itself when the cron clears the
   key. Distinct from the top save banner: that one is THIS tab's unsaved work,
   this one is the whole floor's persistence. */
function __healthPoll(){

    fetch('https://chatterbox-agentos-api.chatterbox-agentos.workers.dev/api/kv?key=health-alerts',{headers:{'Authorization':'Bearer '+t,'X-Cbx-Client':'v5'}})

        el.textContent='\u26a0 '+alerts[0].message+(alerts.length>1?' (+'+(alerts.length-1)+' more)':'');
      }).catch(function(){});
  }catch(e){}
}
setInterval(__healthPoll,180000); setTimeout(__healthPoll,20000);
document.addEventListener('cbx-authed',function(){setTimeout(__healthPoll,12000)});
})();</script>
