function pageExec(win){
  if(!hasData())return emptyState('No data yet — the Command Centre is waiting for its first upload');
  const qaRows=rowsFor('QA_EVALUATIONS',win);
  const critOpen=qaRows.filter(r=>resolveRule('$qaCritical').includes(r.escalation_decision)&&!/closed/i.test(r.qa_status||''));
  const coachOpen=qaRows.filter(r=>resolveRule('$qaCoaching').includes(r.escalation_decision)&&!/closed/i.test(r.qa_status||''));
  const stale=SRC_KEYS.filter(k=>['a','r','n'].includes(freshness(k).state));
  const actions=[
    ...critOpen.slice(0,5).map(r=>({p:'r',t:'Critical fail ('+esc(r.priority||'P1')+') — '+maskName(r.sales_agent),d:esc(r.critical_fail_category||'Compliance'),own:r.team_leader,date:r.call_date})),
    ...coachOpen.slice(0,3).map(r=>({p:'a',t:'Coaching pending — '+maskName(r.sales_agent),d:esc(r.coaching_category||'Coaching'),own:r.team_leader,date:r.call_date})),
    ...stale.map(k=>({p:'a',t:'Upload needed — '+esc(SOURCES[k].label),d:'Source is stale or missing',own:'Ryan',date:''}))
  ];
  const callRows=rowsFor('CALLX_CALL_RECORDS',win);
  const ds=dailySeries(callRows,win,rs=>rs.length);
  const dsAns=dailySeries(callRows,win,rs=>rs.filter(r=>r.call_band!=='No Answer').length);
  /* Client 2026-07-20: headline QA metric is the AVERAGE SCORE, not pass rate. */
  const qaTrend=dailySeries(qaRows,win,rs=>{const v=rs.map(r=>parseFloat(r.score_percent)).filter(x=>!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null});
  /* ---- command wall: gauge rings (same KPIs, evalKPI unchanged) ---- */
  const ring=id=>{const k=state.kpis.find(x=>x.id===id);if(!k)return '';const v=evalKPI(k,win);const rag=ragOf(k,v);
    const c=rag==='g'?'var(--green)':rag==='a'?'var(--amber)':rag==='r'?'var(--red)':'var(--blue)';
    return '<div class="card ringbox"><span class="ring" style="--p:'+(v==null?0:Math.max(0,Math.min(100,Math.round(v))))+';--c:'+c+'"><i class="num">'+fmtVal(v,k.format)+'</i></span>'
     +'<span><div class="ring-name">'+esc(k.name)+'</div><div class="ring-sub">'+(k.green!=null?('target '+(k.dir==='higher'?'≥ ':'≤ ')+k.green+(k.format==='pct'?'%':'')):'monitored')+'</div>'
     +'<div class="ring-sub" style="cursor:pointer;color:var(--blue)" onclick="kpiInfo(\''+k.id+'\')">definition →</div></span></div>'};
  /* ---- daily activity heatmap (calls per day) ----
     This is CALLS per day, so it must anchor on the call data — NOT minDataDay, which
     is now dominated by year-old open cases. The grid ends at the window end (capped to
     today) and spans back to the earliest in-window call day, but never more than ~28
     weeks (the 203-cell grid shows the MOST RECENT weeks). The old version started at
     minDataDay and walked forward, so with calls dated after the 203rd cell the grid
     truncated before reaching a single call and rendered completely blank. */
  const byDay={};callRows.forEach(r=>{if(r._d)byDay[r._d]=(byDay[r._d]||0)+1});
  const hmDays=[];{
    const anc=isoDay(anchorDate());
    const end=win.to<=anc?win.to:anc;
    const ck=Object.keys(byDay);
    let s=ck.length?ck.reduce((a,b)=>a<b?a:b):end;              // earliest in-window call day
    const cap=new Date(end+'T12:00:00');cap.setDate(cap.getDate()-195);
    if(new Date(s+'T12:00:00')<cap)s=isoDay(cap);               // cap to the most recent ~28 weeks
    const d=new Date(s+'T12:00:00'),e=new Date(end+'T12:00:00');
    d.setDate(d.getDate()-((d.getDay()+6)%7));let g=0;
    while(d<=e&&g++<210){hmDays.push(isoDay(d));d.setDate(d.getDate()+1)}}
  const hmMax=Math.max(1,...hmDays.map(k=>byDay[k]||0));

function zar2(v){return 'R'+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})}

function cycleCalc(mode){
  /* mode: 'cycle' (default, 26th-anchored VAS cycle) · 'month' (calendar-month backup
     view, client 2026-07-20) · 'win' (linked to the main dashboard range filter). All
     three share one maths path — only the window and day-count denominator change. */
  mode=mode||'cycle';
  const vat=vatPct();
  const targets=[];(state.rules.cycleTargets?.vals||[]).forEach(v=>{const i=String(v).lastIndexOf(':');const t=parseFloat(String(v).slice(i+1));if(!isNaN(t))targets.push([String(v).slice(0,i).trim(),t])});
  let start,cw,totD;
  if(mode==='month'){
    const a=isoDay(anchorDate());start=a.slice(0,8)+'01';
    const e=new Date(a.slice(0,7)+'-01T12:00:00');e.setMonth(e.getMonth()+1);e.setDate(0);
    cw={from:start,to:isoDay(e)};totD=workDays(cw);
  }else if(mode==='win'){
    const w=periodWindow();start=winFrom(w);cw={from:start,to:w.to};totD=workDays(cw);
  }else{
    start=String((state.rules.cycleStart?.vals||[])[0]||'').trim();
    if(!start)return null;
    totD=parseFloat((state.rules.cycleDialingDays?.vals||[])[0])||21;
    cw={from:start,to:'2099-12-31'};
  }
  const prem=(function(){const f=state.filters;try{return accountPremiums(cw)}finally{state.filters=f}})();
  const dial=rowsFor('CALLX_CALL_RECORDS',cw);
  const byCamp={},campSales={},dialDays={},moneyDays={},tlAgg={},campOfAcc={};let unatt=0;
  prem.forEach(e=>{if(!e.cb){unatt+=e.gwp||0;return}
    const q=(state.cbInfo[e.cb]?.queue)||'(no queue)';byCamp[q]=(byCamp[q]||0)+(e.gwp||0);campSales[q]=(campSales[q]||0)+1;
    campOfAcc[e.acc]=q;                                  // where this account's money landed
    const tl=(state.cbInfo[e.cb]?.tl)||'(unassigned)';const T=tlAgg[tl]=tlAgg[tl]||{gwp:0,sales:0,q:{}};T.gwp+=(e.gwp||0);T.sales++;T.q[q]=(T.q[q]||0)+1});
  /* Days Past follows the MONEY, not the dialler. This panel projects GWP, so its
     denominator has to be the days the campaign actually banked money. Counting dialler
     days alone divided a whole cycle's premium by 1 whenever the call-record export
     covered fewer days than the BI file — BI lands monthly, call records daily — which
     projected ~1500% to target. Every BI row's day is attributed through the SAME
     account -> cb -> queue path the premium split above uses, so a day can never be
     counted against a campaign its money was not. Unattributed accounts (no cb) are
     excluded from both, exactly as they are from byCamp. */
  /* Week-on-week rollup (Mon-anchored ISO weeks) — the calendar-month view reports on a
     week-on-week basis; harmless and available in the other modes too. */
  const WK={};
  rowsFor('BI_ACTIVE_CASES',cw).forEach(r=>{
    if(r._d){const d=new Date(r._d+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));const k=isoDay(d);
      const o=WK[k]=WK[k]||{ex:0,acc:new Set()};o.ex+=r.charge_amount||0;o.acc.add(r.account_number)}
    const q=campOfAcc[r.account_number];if(!q||!r._d)return;
    (moneyDays[q]=moneyDays[q]||new Set()).add(r._d)});
  const weeks=Object.keys(WK).sort().map(k=>({wk:k,gwp:WK[k].ex*(1+vat),sales:WK[k].acc.size}));
  dial.forEach(r=>{const cb=cbOf(r.agent);if(!cb||!r._d)return;const q=(state.cbInfo[cb]?.queue);if(!q)return;(dialDays[q]=dialDays[q]||new Set()).add(r._d)});
  const anc=isoDay(anchorDate());
  const wdFallback=workDays({from:start,to:cw.to<anc?cw.to:anc});
  /* A campaign worked a day if it banked money OR dialled on it — the union, so neither a
     sparse dialler export nor a legitimate no-sale day can shrink the run-rate denominator. */
  const pastOf=camp=>{const d=new Set(moneyDays[camp]||[]);(dialDays[camp]||[]).forEach(x=>d.add(x));
    return Math.min(totD,d.size||Math.min(wdFallback,totD))};
  const tlRows=Object.entries(tlAgg).map(([tl,T])=>{
    const camp=Object.entries(T.q).sort((a,b)=>b[1]-a[1])[0][0];
    const past=pastOf(camp);const rem=Math.max(0,totD-past);
    const perDay=past>0?T.gwp/past:0;
    const salesDay=past>0?T.sales/past:0;
    return{tl,camp,gwp:T.gwp,sales:T.sales,salesDay,projSales:T.sales+salesDay*rem,perDay,rem,proj:perDay*rem,total:T.gwp+perDay*rem}})
   .sort((a,b)=>b.total-a.total);
  const byTL={};tlRows.forEach(r=>byTL[r.tl]=r);
  return{mode,start,to:cw.to,totD,vat,targets,byCamp,campSales,dialDays,unatt,wdFallback,pastOf,tlRows,byTL,weeks};
}

  const title=mode==='month'?'Matrix VAS Calendar Month — Operational Performance Overview'

function agingTable(open){
  const buckets=[['0–72h',0,72],['3–14d',72,336],['14–30d',336,720],['30d+',720,1e9]];
  const counts=buckets.map(b=>open.filter(r=>r.age_hours!=null&&r.age_hours>=b[1]&&r.age_hours<b[2]).length);
  const total=counts.reduce((a,b)=>a+b,0)||1;
  return '<div class="card"><div class="card-h"><span class="t">Open case ageing</span><span class="info" title="Salesforce exports age with comma decimals; the parser normalises them.">i</span></div>'
   +'<table class="tbl"><thead><tr><th class="noclick">Bucket</th><th class="noclick">Cases</th><th class="noclick" style="width:45%">Share</th></tr></thead><tbody>'
   +buckets.map((b,i)=>'<tr><td><b>'+b[0]+'</b></td><td class="num">'+counts[i].toLocaleString()+'</td><td><div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:'+(counts[i]/total*100)+'%;background:'+(i>=3?'var(--red)':i===2?'#F59E0B':'var(--blue)')+'"></div></div><span class="num" style="font-size:11px;color:var(--muted)">'+Math.round(counts[i]/total*100)+'%</span></div></td></tr>').join('')
   +'</tbody></table></div>';
}

/* ===================== QA CLIENT VIEWS (2026-07-20) ===================== */
/* Phase a connected call reached before ending — reads the callPhases rule, same
   band logic as callBandFor. Duration-derived proxy (see rule help). */
function phaseBandFor(sec){
  const rungs=(state.rules.callPhases?.vals||[]).map(v=>{const i=String(v).indexOf(':');return{n:parseFloat(String(v).slice(0,i)),label:String(v).slice(i+1).trim()}}).filter(r=>!isNaN(r.n)).sort((a,b)=>a.n-b.n);
  let cur=rungs.length?rungs[0].label:'(no phases)';
  rungs.forEach(r=>{if((sec||0)>=r.n)cur=r.label});
  return cur;
}
function phaseLabels(){return (state.rules.callPhases?.vals||[]).map(v=>String(v).slice(String(v).indexOf(':')+1).trim())}
/* Drop-off by call phase: of OUTBOUND dial attempts, how many ended in each phase
   (= where the agent was cut off). Optionally scoped to one campaign bucket. */
function callPhaseDropoff(win,campFilter){
  const calls=rowsFor('CALLX_CALL_RECORDS',win).filter(c=>c.agent&&c.call_type!=='inbound');
  const labels=phaseLabels();const dist={};labels.forEach(l=>dist[l]=0);let total=0;
  calls.forEach(c=>{if(campFilter){const cb=cbOf(c.agent);const cc=cb?campBucket(state.cbInfo[cb]?.queue):null;if(cc!==campFilter)return}
    const ph=phaseBandFor(c.billable_seconds);dist[ph]=(dist[ph]||0)+1;total++});
  return{labels,dist,total};
}
/* QA rolled up by Matrix campaign: evaluations, pass rate, avg score, % sales
   (BI sales for the campaign ÷ QA'd calls), critical-fail rate. campBucket folds the
   raw campaign/queue spelling; unbucketed evals aggregate under '(other)'. Sales come
   from accountPremiums — the single money model — bucketed by the owning agent's queue. */
function qaByCampaign(qa,win){
  const B={};const bump=k=>(B[k]=B[k]||{n:0,pass:0,crit:0,s:0,sn:0,sale:0});
  qa.forEach(r=>{const c=campBucket(r.campaign)||'(other)';const o=bump(c);o.n++;
    if(resolveRule('$qaPass').includes(r.escalation_decision))o.pass++;
    if(resolveRule('$qaCritical').includes(r.escalation_decision))o.crit++;
    if(r.score_percent!=null){o.s+=r.score_percent;o.sn++}});
  (function(){const f=state.filters;try{accountPremiums(win).forEach(e=>{if(!e.cb)return;
    const c=campBucket(state.cbInfo[e.cb]?.queue)||'(other)';bump(c).sale++})}finally{state.filters=f}})();
  return B;
}
/* Live QA pipeline: evaluations not yet closed out (qa_status has no "closed"),
   the items still pending action. Ordered most-severe first. */
function qaPipeline(qa){
  const open=qa.filter(r=>!/closed/i.test(r.qa_status||''));
  const rank=r=>resolveRule('$qaCritical').includes(r.escalation_decision)?0
    :resolveRule('$qaCoaching').includes(r.escalation_decision)?1:2;
  return open.map(r=>({r,rk:rank(r)})).sort((a,b)=>a.rk-b.rk||String(a.r.call_date||'').localeCompare(String(b.r.call_date||''))).map(x=>x.r);
}

     +qpRows.map(p=>'<tr><td><b>'+aName(p.__cb,maskName(p.__name))+'</b>'+(p.__unmapped?' <span class="pill a" style="padding:1px 6px">unmapped</span>':'')+'</td>'
       +'<td>'+(p.__sn?ragPill(p.__s/p.__sn,90,80):'—')+'</td>'
       +decCols.map(d=>'<td class="num">'+(p.__d[d]||'·')+'</td>').join('')
       +'<td class="num" style="font-weight:800">'+p.__t+'</td>'

/* ---------------- PAGE: QA AGENT PERFORMANCE (assessors) ---------------- */
function pageQAPerf(win){
  if(!hasData())return emptyState('QA Agent Performance needs the QA evaluations export');
  const rows=rowsFor('QA_EVALUATIONS',win);
  if(!rows.length)return emptyState('No evaluations in the selected window');
  const CRIT=resolveRule('$qaCritical'),COACH=resolveRule('$qaCoaching'),PASS=resolveRule('$qaPass');
  const A={};
  rows.forEach(r=>{const k=r.qa_agent||'(blank)';const a=A[k]=A[k]||{name:k,n:0,sec:0,crit:0,coach:0,pass:0,s:0,sn:0};
    a.n++;a.sec+=r.call_duration_seconds||0;
    if(CRIT.includes(r.escalation_decision))a.crit++;
    else if(COACH.includes(r.escalation_decision))a.coach++;
    else if(PASS.includes(r.escalation_decision))a.pass++;
    if(r.score_percent!=null){a.s+=r.score_percent;a.sn++}});
  const list=Object.values(A).sort((x,y)=>y.n-x.n);
  const G=list.reduce((g,a)=>({n:g.n+a.n,sec:g.sec+a.sec,crit:g.crit+a.crit,coach:g.coach+a.coach,pass:g.pass+a.pass,s:g.s+a.s,sn:g.sn+a.sn}),{n:0,sec:0,crit:0,coach:0,pass:0,s:0,sn:0});
  const fh=sec=>{const m=Math.round(sec/60);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
  const row=(a,gt)=>'<tr'+(gt?' style="font-weight:800;background:#F4F8FE;border-top:2px solid var(--line)"':'')+'>'
    +'<td><b>'+(gt?'ALL ASSESSORS ('+list.length+')':maskName(a.name))+'</b></td>'
    +'<td class="num" style="font-weight:800">'+a.n.toLocaleString()+'</td>'
    +'<td class="num">'+fh(a.sec)+'</td>'
    +'<td class="num">'+(a.sn?fmtVal(a.s/a.sn,'pct'):'—')+'</td>'
    +'<td>'+(a.crit?'<span class="pill r">'+a.crit+'</span>':'<span class="num">0</span>')+'</td>'
    +'<td class="num">'+(a.n?fmtVal(a.crit/a.n*100,'pct'):'—')+'</td>'
    +'<td>'+(a.coach?'<span class="pill a">'+a.coach+'</span>':'<span class="num">0</span>')+'</td>'
    +'<td class="num">'+a.pass.toLocaleString()+'</td></tr>';
  return '<div class="card" style="margin-bottom:14px">The assessors&#39; own scoreboard: how many calls each QA agent evaluated, the talk time they actually listened to (summed from Call Duration), and how they classified what they heard. Critical / Coaching / Pass follow the live rules, so a rule change re-reads every assessor. Big gaps in <b>Critical %</b> or <b>Avg score given</b> between assessors on the same period are the calibration conversation to have.</div>'
   +'<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start">'
   +'<div class="card"><div class="card-h"><span class="t">Assessor performance</span><span class="s">'+list.length+' QA agents · '+G.n.toLocaleString()+' evaluations · '+fh(G.sec)+' listened</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">QA Agent</th><th class="noclick">Evaluations</th><th class="noclick">Talk time listened</th><th class="noclick">Avg score given</th><th class="noclick">Critical fails</th><th class="noclick">Critical %</th><th class="noclick">Coaching</th><th class="noclick">Pass</th></tr></thead><tbody>'
   +list.map(a=>row(a,false)).join('')+row(G,true)
   +'</tbody></table></div></div>'
   +'<div class="card"><div class="card-h"><span class="t">Evaluations share</span></div><div style="height:260px"><canvas id="chQP1"></canvas></div></div>'
   +'</div>'
   +setTimeoutChart();
  function setTimeoutChart(){setTimeout(()=>{doughnut('chQP1',list.slice(0,8).map(a=>[maskNameText(a.name),a.n]))},0);return ''}
}
function pageWF(win){
  if(!hasData())return emptyState('Workforce needs the attendance export');
  const att=rowsFor('ATTENDANCE',win);
  /* ---- WoW / MoM movement + attrition (calendar windows off the latest data day; roster filters apply, date filter does not) ---- */
  const A0=(()=>{let m=null;(state.facts.ATTENDANCE||[]).forEach(r=>{if(r._d&&(!m||r._d>m))m=r._d});return m||isoDay(anchorDate())})();
  const monOf=k=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return isoDay(d)};
  const addD=(k,n)=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return isoDay(d)};
  const mStart=k=>k.slice(0,8)+'01';
  const prevM=k=>{const d=new Date(k+'T00:00:00');d.setDate(0);return[mStart(isoDay(d)),isoDay(d)]};
  const W={tw:{from:monOf(A0),to:A0},lw:{from:addD(monOf(A0),-7),to:addD(monOf(A0),-1)},
           tm:{from:mStart(A0),to:A0},lm:(()=>{const[f,t]=prevM(A0);return{from:f,to:t}})()};
  const pull={};for(const k in W)pull[k]=rowsFor('ATTENDANCE',W[k]);
  const stat=rows=>{const o={sched:0,p:0,abs:0,exits:0,mem:new Set()};
    rows.forEach(r=>{if(r.excluded_flag){o.exits++;return}o.sched++;if(r.present_flag)o.p++;if(r.absence_flag)o.abs++;const c=normCB(r.employee_code);if(c)o.mem.add(c)});
    o.att=o.sched?o.p/o.sched*100:null;o.absR=o.sched?o.abs/o.sched*100:null;return o};
  const S={};for(const k in pull)S[k]=stat(pull[k]);
  const pp=(a,b)=>(a==null||b==null)?null:a-b;
  const ppPill=(d,inv)=>d==null?'—':'<span class="pill '+((inv?d<=0:d>=0)?'g':'r')+'">'+(d>=0?'+':'−')+(Math.round(Math.abs(d)*10)/10).toLocaleString()+'pp</span>';
  const nPill=(a,b,inv)=>{const d=a-b;return a+' <span style="color:var(--muted)">vs '+b+'</span> <span class="pill '+((inv?d<=0:d>=0)?'g':'r')+'">'+(d>=0?'+':'−')+Math.abs(d)+'</span>'};
  const keyTeam=r=>r.reports_to||'(unassigned)';
  const keyCamp=r=>(state.cbInfo[normCB(r.employee_code)]?.queue)||'(not on roster)';
  const splitStat=(rows,keyF)=>{const M={};rows.forEach(r=>{const k=keyF(r);(M[k]=M[k]||[]).push(r)});const O={};for(const k in M)O[k]=stat(M[k]);return O};
  const splitTbl=(label,keyF)=>{
    const cur=splitStat(att,keyF),tw=splitStat(pull.tw,keyF),lw=splitStat(pull.lw,keyF),tm=splitStat(pull.tm,keyF),lm=splitStat(pull.lm,keyF);
    const keys=[...new Set([...Object.keys(cur),...Object.keys(tw),...Object.keys(tm)])].sort((a,b)=>((cur[b]?.sched)||0)-((cur[a]?.sched)||0)).slice(0,14);
    return '<div class="card" style="margin-bottom:14px"><div class="card-h"><span class="t">'+label+' — attendance movement &amp; attrition</span><span class="s">WoW/MoM windows anchor to the latest data day ('+A0+'); roster filters apply, the date filter does not</span></div>'
     +'<div style="overflow-x:auto"><table class="tbl" style="font-size:11.5px"><thead><tr><th class="noclick">'+label+'</th><th class="noclick">People</th><th class="noclick">Att % (window)</th><th class="noclick">Att WoW Δ</th><th class="noclick">Att MoM Δ</th><th class="noclick">Attrition WoW</th><th class="noclick">Attrition MoM</th></tr></thead><tbody>'
     +keys.map(k=>{const c=cur[k]||stat([]),w1=tw[k]||stat([]),w0=lw[k]||stat([]),m1=tm[k]||stat([]),m0=lm[k]||stat([]);
       return '<tr><td><b>'+(keyF===keyTeam?maskName(k):esc(k))+'</b></td><td class="num">'+c.mem.size+'</td>'
        +'<td>'+ragPill(c.att,92,85)+'</td>'
        +'<td>'+ppPill(pp(w1.att,w0.att))+'</td><td>'+ppPill(pp(m1.att,m0.att))+'</td>'
        +'<td>'+nPill(w1.exits,w0.exits,true)+'</td><td>'+nPill(m1.exits,m0.exits,true)+'</td></tr>'}).join('')
     +'</tbody></table></div></div>'};
  const fmtW=w=>w.from.slice(5)+'→'+w.to.slice(5);
  const mvCompany='<div class="card" style="margin-bottom:14px"><div class="card-h"><span class="t">Company — week-on-week &amp; month-on-month</span><span class="s">this week '+fmtW(W.tw)+' vs last '+fmtW(W.lw)+' · this month vs '+W.lm.from.slice(0,7)+'</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick"></th><th class="noclick">This week</th><th class="noclick">Last week</th><th class="noclick">WoW Δ</th><th class="noclick">This month</th><th class="noclick">Last month</th><th class="noclick">MoM Δ</th></tr></thead><tbody>'
   +'<tr><td><b>Attendance %</b></td><td class="num">'+(S.tw.att==null?'—':fmtVal(S.tw.att,'pct'))+'</td><td class="num">'+(S.lw.att==null?'—':fmtVal(S.lw.att,'pct'))+'</td><td>'+ppPill(pp(S.tw.att,S.lw.att))+'</td>'
   +'<td class="num">'+(S.tm.att==null?'—':fmtVal(S.tm.att,'pct'))+'</td><td class="num">'+(S.lm.att==null?'—':fmtVal(S.lm.att,'pct'))+'</td><td>'+ppPill(pp(S.tm.att,S.lm.att))+'</td></tr>'
   +'<tr><td><b>Unplanned absence %</b></td><td class="num">'+(S.tw.absR==null?'—':fmtVal(S.tw.absR,'pct'))+'</td><td class="num">'+(S.lw.absR==null?'—':fmtVal(S.lw.absR,'pct'))+'</td><td>'+ppPill(pp(S.tw.absR,S.lw.absR),true)+'</td>'
   +'<td class="num">'+(S.tm.absR==null?'—':fmtVal(S.tm.absR,'pct'))+'</td><td class="num">'+(S.lm.absR==null?'—':fmtVal(S.lm.absR,'pct'))+'</td><td>'+ppPill(pp(S.tm.absR,S.lm.absR),true)+'</td></tr>'
   +'<tr><td><b>Present person-days</b></td><td class="num">'+S.tw.p.toLocaleString()+'</td><td class="num">'+S.lw.p.toLocaleString()+'</td><td>'+nPill(S.tw.p,S.lw.p)+'</td><td class="num">'+S.tm.p.toLocaleString()+'</td><td class="num">'+S.lm.p.toLocaleString()+'</td><td>'+nPill(S.tm.p,S.lm.p)+'</td></tr>'
   +'<tr><td><b>Attrition (exit records)</b></td><td class="num">'+S.tw.exits+'</td><td class="num">'+S.lw.exits+'</td><td>'+nPill(S.tw.exits,S.lw.exits,true)+'</td><td class="num">'+S.tm.exits+'</td><td class="num">'+S.lm.exits+'</td><td>'+nPill(S.tm.exits,S.lm.exits,true)+'</td></tr>'
   +'</tbody></table></div>'
   +'<div style="font-size:11px;color:var(--muted);margin-top:6px">Attrition counts Terminated / Resigned records in the attendance register per window — the same exit codes the rates exclude.</div></div>';
  const wfMovement=mvCompany+splitTbl('Team',keyTeam)+splitTbl('Campaign',keyCamp);
  const byStat=groupCount(att,'status').slice(0,8);
  const byDept={};att.forEach(r=>{const d=r.department;byDept[d]=byDept[d]||{n:0,p:0};byDept[d].n++;if(r.present_flag)byDept[d].p++});
  const byTL={};att.forEach(r=>{const t=r.reports_to;byTL[t]=byTL[t]||{n:0,p:0,a:0};byTL[t].n++;if(r.present_flag)byTL[t].p++;if(r.absence_flag)byTL[t].a++});
  const tlRows=Object.entries(byTL).map(([t,v])=>({t,rate:v.p/v.n*100,abs:v.a,n:v.n})).sort((a,b)=>a.rate-b.rate);
  const trend=dailySeries(att,win,rs=>{return rs.length?rs.filter(r=>r.present_flag).length/rs.length*100:null});
  const unknown=[...new Set(att.filter(r=>r.absence_flag).map(r=>r.status_code))];
  /* status distribution by chosen dimension */
  const dim=state.wfDim||'tl';
  const dimDef={tl:{label:'Reporting line',get:r=>r.reports_to||'(unassigned)'},
    dept:{label:'Department',get:r=>r.department||'(none)'},
    tenure:{label:'Tenure',get:r=>(state.cbInfo[normCB(r.employee_code)]?.tenure)||'(not on roster)'},
    type:{label:'Employee type',get:r=>r.employee_type||'(none)'}};
  const statFreqW=groupCount(att,'status');
  const stCols=statFreqW.slice(0,9).map(e=>e[0]);
  const stHasOther=statFreqW.length>9;
  const stColsAll=stHasOther?[...stCols,'Other']:stCols;
  const DV={};att.forEach(r=>{const k=dimDef[dim].get(r);const d=DV[k]=DV[k]||{t:0,ex:0,p:0,sts:{}};
    d.t++;if(r.excluded_flag)d.ex++;if(r.present_flag)d.p++;
    const st=stCols.includes(r.status)?r.status:'Other';d.sts[st]=(d.sts[st]||0)+1});
  const dvRows=Object.entries(DV).sort((a,b)=>b[1].t-a[1].t).slice(0,14);
  setTimeout(()=>{
    mkChart('chW1',{type:'line',data:{labels:trend.labels,datasets:[{label:'Attendance %',data:trend.data,borderColor:'#0EA5E9',backgroundColor:'rgba(14,165,233,.08)',fill:true,tension:.3,pointRadius:0,borderWidth:2,spanGaps:true}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10}},y:{grid:{color:'rgba(148,182,255,.10)'},suggestedMin:60,suggestedMax:100}},maintainAspectRatio:false}});

      +'<td class="num" style="font-weight:800">'+d.t+'</td>'
      +'<td>'+ragPill(pr,92,85)+'</td></tr>'}).join('')

   +(unknown.length?'<div style="margin-top:10px" class="stale-banner">Codes counted as unplanned absence (in no rule): '+esc(unknown.join(', '))+' — reclassify in Dictionary → Rules if any are authorised.</div>':'')
   +'</div></div>'
   +wfMovement;
}

function pageDisc(win){
  if(!hasData())return emptyState('Agent Discipline reads the QA evaluations export');
  const qa=rowsFor('QA_EVALUATIONS',win);
  const anchor=isoDay(anchorDate());
  const A={};
  qa.forEach(r=>{const key=normCB(r.sales_agent_code)||state.sfOwnerMap?.[normName(r.sales_agent)]||('N'+normName(r.sales_agent));if(!key)return;
    const a=A[key]=A[key]||{cb:key,code:(state.cbInfo[key]?.code)||r.sales_agent_code||'—',name:(state.cbInfo[key]?.name)||r.sales_agent,tl:(state.cbInfo[key]?.tl)||r.team_leader,off:0,open:0,openCrit:0,sla:0,tl1:0,tl2:0,sm:0,last:null};
    a.off=Math.max(a.off,r.offense_number||0);
    const open=!/closed/i.test(r.qa_status||'');
    const isC=resolveRule('$qaCritical').includes(r.escalation_decision);
    const isCo=resolveRule('$qaCoaching').includes(r.escalation_decision);
    if(open&&(isC||isCo))a.open++;
    if(open&&isC)a.openCrit++;
    if(open&&r.sla_deadline){const d=isoDay(parseDT(r.sla_deadline));if(d&&d<anchor)a.sla++}
    if(r.tl1_flag)a.tl1=1;if(r.tl2_flag)a.tl2=1;if(r.sm_flag)a.sm=1;
    if(r.call_date&&(!a.last||r.call_date>a.last))a.last=r.call_date;
  });
  const reg=Object.values(A).filter(a=>a.off>0||a.open>0)
    .sort((x,y)=>(y.openCrit-x.openCrit)||(y.off-x.off)||(y.open-x.open));
  const stageDist={};reg.forEach(a=>{const st=stageFor(a.off);const l=st?st.label:'No stage yet';stageDist[l]=(stageDist[l]||0)+1});
  const escal=qa.filter(r=>r.sm_flag&&!/closed/i.test(r.qa_status||''));
  const ladder=(state.rules.discStages?.vals||[]).join('  ·  ');
  setTimeout(()=>{hbar('chD1',Object.entries(stageDist).sort((a,b)=>b[1]-a[1]),'#C42D2D')},0);
  const stagePill=st=>{if(!st)return '<span class="pill n">—</span>';
    const frac=st.total>1?st.idx/(st.total-1):1;
    return '<span class="pill '+(frac>=0.75?'r':frac>=0.4?'a':'b')+'">'+esc(st.label)+'</span>'};
  return kpiRow('Discipline',win)
   +'<div class="stale-banner" style="background:var(--blue-soft);border-color:#D4E2FB;color:#1D4FD8">Stage ladder in force: '+esc(ladder)+' — this is a live rule (Dictionary → Interpretation rules). CONFIGURATION REQUIRED: confirm the ladder with Claudell / HR before disciplinary use. Derived from the QA export today; a dedicated HR/IR source can be added as a new upload slot later.</div>'
   +'<div class="grid g21">'
   +'<div class="card"><div class="card-h"><span class="t">Disciplinary register</span><span class="s">'+reg.length+' agents with open items or offenses · worst first</span></div>'
   +(reg.length?'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">Agent</th><th class="noclick">Team leader</th><th class="noclick">Offense #</th><th class="noclick">Current stage</th><th class="noclick">Open items</th><th class="noclick">Open criticals</th><th class="noclick">SLA</th><th class="noclick">Path</th><th class="noclick">Last incident</th></tr></thead><tbody>'
    +reg.map(a=>'<tr><td><b>'+aName(a.cb,maskName(a.name))+'</b><div style="font-size:10.5px;color:var(--muted)">'+esc(a.code)+'</div></td>'
     +'<td>'+maskName(a.tl)+'</td>'
     +'<td class="num" style="font-weight:800">'+a.off+'</td>'
     +'<td>'+stagePill(stageFor(a.off))+'</td>'
     +'<td class="num">'+a.open+'</td>'
     +'<td>'+(a.openCrit?'<span class="pill r">'+a.openCrit+'</span>':'<span class="pill g">0</span>')+'</td>'
     +'<td>'+(a.sla?'<span class="pill r">Breached ×'+a.sla+'</span>':'<span class="pill g">OK</span>')+'</td>'
     +'<td>'+['tl1','tl2','sm'].map(f=>'<span class="pill '+(a[f]?'v':'n')+'" style="padding:2px 6px;margin-right:3px">'+f.toUpperCase()+'</span>').join('')+'</td>'
     +'<td style="font-size:11.5px;color:var(--muted)">'+esc(a.last||'—')+'</td></tr>').join('')
    +'</tbody></table></div>':'<div class="empty"><div class="big">Clean sheet</div><p>No agents with open offenses in this window.</p></div>')
   +'</div>'
   +'<div><div class="card" style="margin-bottom:14px"><div class="card-h"><span class="t">Stage distribution</span></div><div class="chart-wrap short"><canvas id="chD1"></canvas></div></div>'
   +'<div class="card"><div class="card-h"><span class="t">Open SM escalations</span><span class="s">'+escal.length+'</span></div>'
   +(escal.length?'<table class="tbl"><tbody>'+escal.slice(0,7).map(r=>'<tr><td><b>'+maskName(r.sales_agent)+'</b><div style="font-size:11px;color:var(--muted)">'+esc((r.sm_reason||'').slice(0,60))+'</div></td><td style="text-align:right;font-size:11px;color:var(--muted)">'+esc(r.call_date||'')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">None open.</div>')
   +'</div></div></div>';
}

/* ---------------- AGENT CARD: scoring engine (NBA explainer) ---------------- */
function nbaVal(key,def){const v=(state.rules.nbaThresholds?.vals||[]).find(x=>String(x).startsWith(key+':'));return v?parseFloat(String(v).split(':')[1]):def}
function compWeights(){const out=[];(state.rules.compositeWeights?.vals||[]).forEach(v=>{const i=String(v).lastIndexOf(':');const w=parseFloat(String(v).slice(i+1));if(!isNaN(w))out.push([String(v).slice(0,i),w])});return out}
function rowsNF(src,win){const f=state.filters;state.filters={};let r;try{r=rowsFor(src,win)}finally{state.filters=f}return r}
function groupOf(cb){const i=state.cbInfo[cb]||{};const t=String(i.tenure||'').trim();
  if(/^exp/i.test(t))return 'EXP - '+String(i.queue||'?').toUpperCase().split(' ')[0];
  return (t||'UNGROUPED').toUpperCase()}
function acCtx(win){
  _fleetCtx++;try{return acCtxBuild(win)}finally{_fleetCtx--}
}
function acCtxBuild(win){
  const C={open:{},closed:{},qa:{},att:{},call:{},sale:{},canc:{},ref:{},lead:{}};
  const LD=cb=>C.lead[cb]=C.lead[cb]||mkLeads();
  rowsNF('SF_OPEN_CASES',win).forEach(r=>{const cb=cbOfOwner(r.case_owner);if(!cb||!openInWin(r,win))return;
    const o=C.open[cb]=C.open[cb]||{n:0,aSum:0,aN:0,seen:new Set()};
    const k=String(r.case_number||'').trim();
    if(k){if(o.seen.has(k))return;o.seen.add(k)}                     // one row per case
    o.n++;addLead(LD(cb),r);const m=String(r.status||'').match(/^(\d)/);if(m){o.aSum+=+m[1];o.aN++}});
  rowsNF('SF_CLOSED_CASES',win).forEach(r=>{const cb=cbOfOwner(r.case_owner);if(!cb)return;
    const o=C.closed[cb]=C.closed[cb]||{tc:0,seen:new Set()};
    const k=String(r.case_number||'').trim();
    if(k){if(o.seen.has(k))return;o.seen.add(k)}
    o.tc++;addLead(LD(cb),r)});
  const _CRIT=resolveRule('$qaCritical');
  rowsNF('QA_EVALUATIONS',win).forEach(r=>{const cb=normCB(r.sales_agent_code)||state.sfOwnerMap?.[normName(r.sales_agent)];if(!cb)return;const o=C.qa[cb]=C.qa[cb]||{n:0,s:0,s0:0,sn:0,crit:0};o.n++;const isC=_CRIT.includes(r.escalation_decision);if(isC)o.crit++;if(r.score_percent!=null){o.s+=r.score_percent;o.sn++;o.s0+=isC?0:r.score_percent}else if(isC){/* crit with no score still counts as zero in the n denominator */}});
  rowsNF('ATTENDANCE',win).forEach(r=>{const cb=normCB(r.employee_code);if(!cb||r.excluded_flag)return;const o=C.att[cb]=C.att[cb]||{sched:0,p:0};o.sched++;if(r.present_flag)o.p++});
  rowsNF('CALLX_CALL_RECORDS',win).forEach(r=>{const cb=cbOf(r.agent);if(!cb)return;const o=C.call[cb]=C.call[cb]||{n:0,sec:0,bands:{},days:new Set(),uniq:new Set()};o.n++;o.sec+=r.billable_seconds||0;o.bands[r.call_band]=(o.bands[r.call_band]||0)+1;if(r._d)o.days.add(r._d);const d=String(r.destination_number||'').trim();if(d&&d!=='s')o.uniq.add(d)});
  rowsNF('REFERRALS',win).forEach(r=>{const cb=normCB(r.employee_code)||cbOf(r.agent);if(!cb)return;const o=C.ref[cb]=C.ref[cb]||{n:0};o.n+=(r.referral_count??1)});
  (function(){const f=state.filters;state.filters={};try{
    accountPremiums(win).forEach(e=>{if(!e.cb)return;const o=C.sale[e.cb]=C.sale[e.cb]||{n:0,gwp:0};o.n++;o.gwp+=e.gwp||0});
    cancelPremiums(win).forEach(e=>{if(!e.cb)return;const o=C.canc[e.cb]=C.canc[e.cb]||{n:0};o.n++});
  }finally{state.filters=f}})();
  return C;
}
function acStats(cb,win,C){
  const i=state.cbInfo[cb]||{};const T=k=>nbaVal(k,0);
  const sale=C.sale[cb]||{n:0,gwp:0},cl=C.closed[cb]||{tc:0},op=C.open[cb]||{n:0,aSum:0,aN:0};
  const qa=C.qa[cb]||{n:0,s:0,sn:0,crit:0},at=C.att[cb]||{sched:0,p:0},ca=C.call[cb]||{n:0,sec:0,bands:{},days:new Set(),uniq:new Set()};
  const canc=(C.canc[cb]||{n:0}).n;const refs=(C.ref[cb]||{n:0}).n;
  const p=at.p, sched=at.sched;
  const target=i.target??null;
  const spd=p>0?sale.n/p:(sale.n>0?sale.n:0);
  const ta=target>0?spd/target*100:null;
  const gwpSale=sale.n>0?sale.gwp/sale.n:null;
  const leads=(C.lead[cb]||mkLeads()).n;   // unique cases across open+closed — not op.n+cl.tc (a case in both is ONE lead)
  const conv=leads>0?sale.n/leads*100:null;
  const qaS=qa.n?((qa.s0!=null?qa.s0:qa.s))/qa.n:null;   // v3.0: critical-fail calls score zero and are included
  const talkMin=Math.round(ca.sec/60);
  const talkDay=p>0?talkMin/p:(ca.n?talkMin:null);
  const att=sched>0?p/sched*100:null;
  const attempts=op.aN?op.aSum/op.aN:null;
  const attLead=leads>0&&ca.n>0?ca.n/leads:null;   // v3.0 diagnostic: total dials ÷ unique leads
  const uniqCalls=ca.uniq?ca.uniq.size:0;          // distinct destinations reached
  const uniqPerDay=p>0?uniqCalls/p:(uniqCalls||null);
  const closedCases=cl.tc;                          // closed cases owned by this agent in the window
  const convClosed=sale.n>0?closedCases/sale.n*100:null;   // client 2026-07-20: conversion = closed cases ÷ sales
  const cancPct=sale.n>0?canc/sale.n*100:(canc>0?999:0);
  const sc={};
  sc['GWP/Sale']=gwpSale==null?null:Math.min(100,gwpSale/T('gwpFloor')*100);
  sc['Target Ach']=ta==null?null:Math.min(100,ta);
  sc['QA']=qaS==null?null:Math.min(100,qaS);
  sc['Conversion']=conv==null?null:Math.min(100,conv/T('convTarget')*100);
  sc['Talk']=talkDay==null?null:Math.min(100,talkDay/T('talkTargetMin')*100);
  sc['Attendance']=att==null?null:Math.min(100,att/T('attTarget')*100);
  return{cb,name:i.name||cb,code:i.code||cb,tl:i.tl||'—',queue:i.queue||'—',tenure:i.tenure||'—',group:groupOf(cb),
    target,sales:sale.n,gwp:sale.gwp,gwpSale,spd,ta,leads,conv,qaN:qa.n,qaS,crit:qa.crit,
    calls:ca.n,uniqCalls,uniqPerDay,closedCases,convClosed,bands:ca.bands,talkMin,talkDay,dialDays:ca.days.size,p,sched,att,canc,cancPct,attempts,attLead,refs,sc};
}
function cfTier(st){ // v3.0 graduated critical-fail rule: tier = highest of count or rate
  const T=k=>nbaVal(k,0);const cf=st.crit||0;const audited=st.qaN||0;
  const cfr=audited>0?cf/audited*100:0;
  if(cf===0)return{tier:'',lvl:0,pen:0,cf,cfr,elite:'Allowed'};
  if(cf>=nbaVal('r2a3Count',4)||cfr>=nbaVal('r2a3Rate',30))return{tier:'R2A-3',lvl:1,pen:nbaVal('pen3',10),cf,cfr,elite:'Blocked'};
  if(cf>=nbaVal('r2a2Count',2)||cfr>=nbaVal('r2a2Rate',10))return{tier:'R2A-2',lvl:2,pen:nbaVal('pen2',5),cf,cfr,elite:'Blocked'};
  return{tier:'R2A-1',lvl:3,pen:nbaVal('pen1',2),cf,cfr,elite:'Allowed'};
}
function acComposite(st,pctile){
  const ws=compWeights();
  const parts=[];let wSum=0,acc=0;
  ws.forEach(([name,w])=>{let v=name==='GWP %ile'?pctile:st.sc[name];
    if(v==null)return;wSum+=w;acc+=v*w;parts.push({name,v:Math.round(v),w,contrib:v*w})});
  const raw=wSum?acc/wSum:0;
  const tier=cfTier(st);
  const pen=tier.pen;   // capped tier penalty (−2 / −5 / −10) replaces the unbounded per-fail deduction
  return{parts,wSum,raw,pen,tier,adj:Math.max(0,Math.min(100,raw-pen))};
}
function acNBA(st){
  const T=k=>nbaVal(k,0);const tier=cfTier(st);
  if(!(st.sched>0&&st.p===0)&&!(st.qaS!=null&&st.qaS<T('qaCritical'))&&tier.tier==='R2A-3')
    return{code:'R2A-3',lvl:1,lvlName:'Protect the Business',label:'Critical Compliance Fail',detail:tier.cf+' fails · CFR '+fmtVal(tier.cfr,'pct')+' of audited calls ('+ (tier.cf>=nbaVal('r2a3Count',4)?'count':'rate')+' trigger).',action:'P1 compliance review within 48h — audit each fail, corrective action signed, daily monitoring 10 days. Elite blocked.'};

  const R=(code,lvl,lvlName,label,detail,action)=>({code,lvl,lvlName,label,detail,action});
  if(st.sched>0&&st.p===0)return R('R1',1,'Protect the Business','Zero Attendance','Did not attend any scheduled day in the period.','Escalate to HR immediately; attempt contact within 24 hrs; start formal absence management.');
  if(st.qaS!=null&&st.qaS<T('qaCritical'))return R('R2',1,'Protect the Business','Critical QA Failure','QA score '+fmtVal(st.qaS,'pct')+' — below '+T('qaCritical')+'%.','QA intervention within 48 hrs: review calls, complete retraining, monitor daily, sign coaching plan.');
  if(st.att!=null&&st.att<T('attRisk'))return R('R3',1,'Protect the Business','Attendance Risk','Attendance '+fmtVal(st.att,'pct')+' — below '+T('attRisk')+'%.','Attendance discussion within 2 days; wellness check if needed; document and monitor weekly.');
  if(tier.tier==='R2A-2')return R('R2A-2',2,'Protect the Revenue','Compliance Risk',tier.cf+' fails · CFR '+fmtVal(tier.cfr,'pct')+' (emerging tier).','P2 structured compliance coaching 5 days — root-cause review, raised audit cadence. Elite blocked.');
  if(st.gwpSale!=null&&st.gwpSale<T('gwpFloor'))return R('R4',2,'Protect the Revenue','GWP Value Failure','GWP per sale R'+Math.round(st.gwpSale)+' — below the R'+T('gwpFloor')+' line.','Value coaching 48h: policy mix, upsell, GWP mini-target.');
  if(st.ta!=null&&st.gwpSale!=null&&st.gwpSale>=T('gwpFloor')&&st.ta<T('salesLow'))return R('R4A',2,'Protect the Revenue','Critical Sales-Volume Failure','Value clears R'+T('gwpFloor')+' but volume is '+fmtVal(st.ta,'pct')+' of target.','Start PIP: weekly 1:1, side-by-side call listening, workshops, review activity and pipeline.');
  if(st.qaS!=null&&st.qaS<T('qaTarget'))return R('R5',2,'Protect the Revenue','Moderate QA Risk','QA '+fmtVal(st.qaS,'pct')+' — between '+T('qaCritical')+'% and '+T('qaTarget')+'%.','QA refresher within 5 days; audit 5 calls per week; coach every 2 weeks.');
  if(st.ta!=null&&st.ta<T('salesNear'))return R('R6',2,'Protect the Revenue','Low Sales Achievement','Volume at '+fmtVal(st.ta,'pct')+' of target ('+T('salesLow')+'–'+T('salesNear')+'% band).','Sales coaching every 2 weeks: objection roleplays, peer pairing, activity review; add conversion training if low.');
  if(st.conv!=null&&st.conv<T('convTarget'))return R('R7',3,'Improve the Skill','Critical Conversion Failure','Conversion '+fmtVal(st.conv,'pct')+' — below the '+T('convTarget')+'% tenure target.','Conversion masterclass within 5 days: pipeline review, closing calls, closing skills, follow-up.');
  if(st.talkDay!=null&&st.talkDay<T('talkFloorMin'))return R('R8',3,'Improve the Skill','Talk Time Below Target','Avg talk '+Math.round(st.talkDay)+'m/day — below the '+T('talkFloorMin')+'m floor.','Engagement and discovery coaching; set a daily talk-time target; review the call-cycle profile.');
  /* R2A-1 is a logged note (−2), never the surfaced rule */
  if(st.ta!=null&&st.ta<100)return R('R9',4,'Develop & Recognise','Developing Performer','Near target ('+T('salesNear')+'–99%) with all critical checks clear.','Monthly coaching; set one improvement goal; track weekly; share best practices.');
  return R('R10',4,'Develop & Recognise','Strong / Elite Performer','Meeting or exceeding all key targets.','Recognise and reward; set a stretch goal; consider mentor / buddy roles.');
}

   +tile('ATTENDANCE',st.att==null?'—':fmtVal(st.att,'pct'),st.p+'/'+st.sched+' days · ≥'+T('attTarget')+'%',st3(st.att,T('attTarget'),T('attRisk')))

   +'<tr><td colspan="3">Critical-fail tier penalty'+(comp.tier.tier?' ('+comp.tier.tier+' · '+comp.tier.cf+' fails · CFR '+fmtVal(comp.tier.cfr,'pct')+')':' (none)')+'</td><td class="num" style="color:var(--red)">−'+comp.pen+'</td></tr>'

  setTimeout(function(){

/* ---------------- PAGE: TEAM LEADER VIEW (NBA v3.0 report) ---------------- */
function pageTL(win){
  if(!hasData())return emptyState('The Team Leader view needs the Agent List plus the activity sources');
  const GF=state.filters;
  const C=acCtx(win);
  /* cbsBase = the fleet (GF-filtered but NOT permission-scoped); the display set
     (stats) is narrowed to what the signed-in user may see. Critical-fail counts on
     this view come straight from each agent's own QA rows, so scoping is display-only. */
  const cbsBase=Object.keys(state.cbInfo).filter(cb=>{const i=state.cbInfo[cb];
    if(GF.tenure&&i.tenure!==GF.tenure)return false;
    if(GF.team&&i.tl!==GF.team)return false;
    if(GF.campaign&&campBucket(i.queue)!==GF.campaign)return false;
    if(GF.agent&&cb!==normCB(GF.agent))return false;
    return true});
  if(!cbsBase.length)return emptyState('No roster agents match the current filters');
  const wd=workDays(win);
  const statsAll=cbsBase.map(cb=>{const st=acStats(cb,win,C);st.tierInfo=cfTier(st);st.nba=acNBA(st);return st});
  // Composite /100 per agent — tenure-relative GWP percentile within group (same as Visual Brain).
  const byGroup={};statsAll.forEach(st=>{(byGroup[st.group]=byGroup[st.group]||[]).push(st)});
  Object.values(byGroup).forEach(g=>{const sorted=g.map(x=>x.gwp).sort((a,b)=>a-b);
    g.forEach(st=>{const below=sorted.filter(x=>x<st.gwp).length;const pct=g.length<2?100:below/(g.length-1)*100;st.comp=acComposite(st,pct)})});
  const lvlHex=l=>l===1?'#C42D2D':l===2?'#B45309':l===3?'#2563EB':'#158A4C';
  const stats=statsAll.filter(st=>cbInScope(st.cb));   // display: only agents the user may see
  if(!stats.length)return emptyState('No roster agents match the current filters');
  /* Lean TL view (client 2026-07-20): show ONLY talk time, unique calls/day, GWP,
     referrals, critical fails, and conversion (closed cases ÷ sales). Protect-the-
     business (P1) moved to QA & Compliance; open/closed/unique leads, sales targets,
     dual-check, NBA distribution, Mon-Fri and cancellation watch removed from this view.
     Click an agent name for the full deep-dive (agentOpen) — no duplicate standalone tab. */
  const T={};stats.forEach(st=>{const t=T[st.tl]=T[st.tl]||{tl:st.tl,ag:[],gwp:0,sales:0,refs:0,cf:0,closed:0,talkDay:0,talkN:0,uniqDay:0,uniqN:0};
    t.ag.push(st);t.gwp+=st.gwp;t.sales+=st.sales;t.refs+=st.refs||0;t.cf+=st.crit||0;t.closed+=st.closedCases||0;
    if(st.talkDay!=null){t.talkDay+=st.talkDay;t.talkN++}
    if(st.uniqPerDay!=null){t.uniqDay+=st.uniqPerDay;t.uniqN++}});
  const tls=Object.values(T).sort((a,b)=>b.gwp-a.gwp);
  const pick=state.tlPick&&T[state.tlPick]?state.tlPick:(tls[0]&&tls[0].tl);
  const P=pick?T[pick]:null;
  const convOf=(closed,sales)=>sales>0?closed/sales*100:null;
  const talkFmt=m=>{m=Math.round(m||0);return m>=60?(Math.floor(m/60)+'h '+(m%60)+'m'):(m+'m')};
  const p1Total=stats.filter(st=>st.nba&&st.nba.lvl===1).length;
  const F={gwp:0,sales:0,refs:0,cf:0,closed:0,talk:0,talkN:0,uniq:0,uniqN:0};
  stats.forEach(st=>{F.gwp+=st.gwp;F.sales+=st.sales;F.refs+=st.refs||0;F.cf+=st.crit||0;F.closed+=st.closedCases||0;
    if(st.talkDay!=null){F.talk+=st.talkDay;F.talkN++}if(st.uniqPerDay!=null){F.uniq+=st.uniqPerDay;F.uniqN++}});
  const box=(v,l,c)=>'<div class="ac-tile" style="min-width:112px"><div class="ac-big" style="color:'+(c||'inherit')+'">'+v+'</div><div class="ac-sub" style="margin:2px 0 0">'+l+'</div></div>';
  const fConv=convOf(F.closed,F.sales);
  let h='<div class="ac-tiles" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">'
   +box(F.talkN?Math.round(F.talk/F.talkN)+'m':'—','TALK TIME / DAY')
   +box(F.uniqN?(Math.round(F.uniq/F.uniqN*10)/10).toFixed(1):'—','UNIQUE CALLS / DAY')
   +box(zarStack(F.gwp),'GWP')
   +box(String(F.refs),'REFERRALS')
   +box(String(F.cf),'CRITICAL FAILS',F.cf?'var(--red)':'#158A4C')
   +box(fConv==null?'—':fmtVal(fConv,'pct'),'CONVERSION')
   +'</div>';
  h+='<div class="card" style="margin-bottom:16px"><div class="card-h"><span class="t">Team leaders</span><span class="info" title="The six team-leader metrics (client 2026-07-20): talk time per day, unique calls per day, GWP (VAT-incl), referrals, outstanding critical fails, and conversion = closed cases ÷ sales (a closed-per-sale ratio, so it CAN exceed 100% — it is not a funnel/win rate). Protect-the-business / compliance detail lives on QA & Compliance.">i</span><span class="s">'+stats.length+' agents · '+tls.length+' teams · '+wd+' working days · click a team to focus</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl" style="font-size:11.5px"><thead><tr><th class="noclick">Team Leader</th><th class="noclick">Agents</th><th class="noclick">Talk/day</th><th class="noclick">Unique calls/day</th><th class="noclick">GWP</th><th class="noclick">Referrals</th><th class="noclick">Critical fails</th><th class="noclick">Conversion</th></tr></thead><tbody>'
   +tls.map(t=>{const cv=convOf(t.closed,t.sales);
     return '<tr class="rowlink" onclick="state.tlPick=&#39;'+esc(t.tl).replace(/&#39;/g,"").replace(/'/g,'&#39;')+'&#39;;render()"><td><b>'+maskName(t.tl)+'</b></td><td class="num">'+t.ag.length+'</td>'
      +'<td class="num">'+(t.talkN?Math.round(t.talkDay/t.talkN)+'m':'—')+'</td>'
      +'<td class="num">'+(t.uniqN?(Math.round(t.uniqDay/t.uniqN*10)/10).toFixed(1):'—')+'</td>'
      +'<td class="num" style="font-weight:800">'+zarStack(t.gwp)+'</td><td class="num">'+t.refs+'</td>'
      +'<td class="num" style="color:'+(t.cf?'var(--red)':'#158A4C')+';font-weight:800">'+t.cf+'</td>'
      +'<td class="num">'+(cv==null?'—':fmtVal(cv,'pct'))+'</td></tr>'}).join('')
   +'</tbody></table></div></div>';
  if(P){const ag=[...P.ag].sort((a,b)=>b.gwp-a.gwp);
    // Agent-scores graph for the picked TL only — filtering by team leader narrows stats to one
    // team, so this shows exactly that team's agents. Coloured by NBA priority level.
    const gag=[...P.ag].sort((a,b)=>((b.comp&&b.comp.adj)||0)-((a.comp&&a.comp.adj)||0)),gid='chTLscores';
    setTimeout(()=>hbar(gid,gag.map(st=>[maskNameText(st.name),Math.round((st.comp&&st.comp.adj)||0)]),gag.map(st=>lvlHex(st.nba.lvl))),0);
    h+='<div class="card" style="margin-bottom:16px"><div class="card-h"><span class="t">'+maskName(pick)+' — Agent Scores</span><span class="s">composite /100 · coloured by NBA priority (red P1 · amber P2 · blue P3 · green clear)</span></div>'
     +'<div class="chart-wrap" style="height:'+Math.max(160,gag.length*24+40)+'px"><canvas id="'+gid+'"></canvas></div></div>';
    h+='<div class="card"><div class="card-h"><span class="t">'+maskName(pick)+' — agents</span><span class="s">'+P.ag.length+' agents · click a name for the full agent card</span>'
     +'<span class="right">'+tls.map(t=>'<button class="btn small'+(t.tl===pick?' primary':'')+'" onclick="state.tlPick=&#39;'+esc(t.tl).replace(/&#39;/g,"").replace(/'/g,'&#39;')+'&#39;;render()">'+maskName(t.tl)+'</button>').join(' ')+'</span></div>'
     +'<div style="overflow-x:auto"><table class="tbl" style="font-size:11.5px"><thead><tr><th class="noclick">Agent</th><th class="noclick">Talk time</th><th class="noclick">Unique calls/day</th><th class="noclick">GWP</th><th class="noclick">Referrals</th><th class="noclick">Critical fails</th><th class="noclick">Conversion</th></tr></thead><tbody>'
     +ag.map(st=>{const cv=st.convClosed;
       return '<tr><td><b>'+aName(st.cb,maskName(st.name))+'</b></td>'
        +'<td class="num">'+talkFmt(st.talkMin)+'<div class="exv">'+(st.talkDay!=null?Math.round(st.talkDay)+'m/day':'')+'</div></td>'
        +'<td class="num">'+(st.uniqPerDay!=null?(Math.round(st.uniqPerDay*10)/10).toFixed(1):'—')+'<div class="exv">'+st.uniqCalls+' total</div></td>'
        +'<td class="num" style="font-weight:800">'+zarStack(st.gwp)+'</td><td class="num">'+st.refs+'</td>'
        +'<td class="num" style="color:'+(st.crit?'var(--red)':'#158A4C')+';font-weight:800">'+st.crit+'</td>'
        +'<td class="num">'+(cv==null?'—':fmtVal(cv,'pct'))+'</td></tr>'}).join('')
     +'</tbody></table></div>'
     +'<div style="font-size:11px;color:var(--muted);margin-top:8px">Conversion = closed cases ÷ sales. Protect-the-business (P1) compliance now lives on the QA &amp; Compliance page.'+(p1Total?' <b style="color:var(--red)">'+p1Total+' agent(s) sit at P1 this period</b> — see QA &amp; Compliance.':'')+'</div></div>';
  }
  return h;
}

/* ---------------- PAGE: LEAD MANAGEMENT ---------------- */
function pageLeads(win){
  if(!hasData())return emptyState('Lead Management joins the Agent List with open cases, closed cases, activations and cancellations');
  const roster=state.facts.AGENT_LIST||[];
  const GF=state.filters;
  const A={};
  const mk=cb=>A[cb]=A[cb]||{cb,name:(state.cbInfo[cb]?.name)||cb,tl:(state.cbInfo[cb]?.tl)||'(unassigned)',ds:(state.cbInfo[cb]?.queue)||'—',ten:(state.cbInfo[cb]?.tenure)||'—',sts:{},open:0,cl:0,nofb:0,tc:0,sales:0,canc:0,leads:mkLeads(),seenO:new Set(),seenC:new Set(),dialDays:new Set()};
  roster.forEach(a=>{if(!a.cb_norm)return;
    if(!cbInScope(a.cb_norm))return;
    if(GF.tenure&&a.tenure!==GF.tenure)return;
    if(GF.team&&a.team_leader!==GF.team)return;
    if(GF.campaign&&campBucket(a.queue)!==GF.campaign)return;
    if(GF.agent&&normCB(a.cb_code)!==normCB(GF.agent))return;
    mk(a.cb_norm)});
  const CANON=['1st attempt','2nd attempt','3rd attempt','4th attempt','5th attempt','New','In Progress','Escalated'];
  // Fold status variants (case/whitespace) into the canonical name so "4th Attempt" counts into
  // the canonical 4th column instead of a duplicate appended after Escalated.
  const canonSt=s=>{const n=String(s==null?'':s).replace(/\s+/g,' ').trim();return CANON.find(c=>c.toLowerCase()===n.toLowerCase())||(n||'(blank)')};
  let unOpen=0,unClosed=0;
  rowsFor('SF_OPEN_CASES',win).forEach(r=>{const cb=cbOfOwner(r.case_owner);if(!cb||!A[cb]){if(!cb)unOpen++;return}
    if(!openInWin(r,win))return;                                    // snapshot: rowsFor can't window it
    const a=A[cb];const k=String(r.case_number||'').trim();
    if(k){if(a.seenO.has(k))return;a.seenO.add(k)}                  // one row per case

  rowsFor('SF_CLOSED_CASES',win).forEach(r=>{const cb=cbOfOwner(r.case_owner);if(!cb||!A[cb]){if(!cb)unClosed++;return}
    const a=A[cb];const k=String(r.case_number||'').trim();
    if(k){if(a.seenC.has(k))return;a.seenC.add(k)}

  cancelPremiums(win).forEach(e=>{if(e.cb&&A[e.cb])A[e.cb].canc++});
  rowsFor('CALLX_CALL_RECORDS',win).forEach(r=>{const cb=cbOf(r.agent);if(cb&&A[cb]&&r._d)A[cb].dialDays.add(r._d)});
  const wd=workDays(win);
  const present=new Set();Object.values(A).forEach(a=>Object.keys(a.sts).forEach(k=>present.add(k)));
  const stCols=[...CANON,...[...present].filter(c=>!CANON.includes(c)).sort()].slice(0,10);
  const rows=Object.values(A).sort((x,y)=>String(x.tl).localeCompare(String(y.tl))||y.tc-x.tc||String(x.name).localeCompare(String(y.name)));
  const G={open:0,cl:0,nofb:0,tc:0,sales:0,canc:0,sts:{},leads:mkLeads()};
  rows.forEach(a=>{G.open+=a.open;G.cl+=a.cl;G.nofb+=a.nofb;G.tc+=a.tc;G.sales+=a.sales;G.canc+=a.canc;
    a.leads.set.forEach(k=>G.leads.set.add(k));G.leads.nokey+=a.leads.nokey;   // union, so ALL AGENTS dedupes too
    stCols.forEach(c=>G.sts[c]=(G.sts[c]||0)+(a.sts[c]||0))});
  const pc=(n,d)=>d>0?fmtVal(n/d*100,'pct'):'—';
  const f1=v=>(Math.round(v*10)/10).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
  const ctL=nbaVal('convTarget',10);   // same target the scorecard's Conversion uses — one definition, one dial
  const cell=(a,gt)=>{const wasted=Math.max(0,a.tc-a.sales);
    const uleads=a.leads.n,cvL=uleads>0?a.sales/uleads*100:null;   // unique cases, not open+tc (a case in both is ONE lead)
    return '<tr'+(gt?' style="font-weight:800;background:#F4F8FE;border-top:2px solid var(--line)"':'')+'>'
     +'<td>'+(gt?'ALL AGENTS':maskName(a.tl))+'</td>'
     +'<td style="font-size:11.5px">'+(gt?'—':esc(a.ds))+'</td>'
     +'<td style="font-size:11.5px">'+(gt?'—':esc(a.ten))+'</td>'
     +'<td><b>'+(gt?rows.length+' agents':aName(a.cb,maskName(a.name)))+'</b></td>'
     +stCols.map(c=>'<td class="num">'+((a.sts[c]||0)||'·')+'</td>').join('')

     +'<td class="num">'+a.cl+'</td>'
     +'<td class="num">'+a.nofb+'</td>'
     +'<td class="num" style="font-weight:800">'+a.tc+'</td>'
     +'<td class="num" style="font-weight:800">'+uleads.toLocaleString()+'</td>'
     +'<td class="num">'+f1(a.tc/wd)+'</td>'
     +'<td class="num">'+f1(wasted/wd)+'</td>'
     +'<td class="num" style="font-weight:800">'+a.sales+'</td>'
     +'<td class="num">'+f1(a.sales/wd)+'</td>'
     +'<td class="num">'+(gt?'—':(a.dialDays.size?f1(a.sales/a.dialDays.size):'—'))+'</td>'
     +'<td>'+ragPill(cvL,ctL,ctL*.8)+'</td>'
     +'<td>'+(a.tc>0?ragPill(a.sales/a.tc*100,20,10):'—')+'</td>'
     +'<td class="num">'+pc(a.sales,wasted)+'</td>'
     +'<td>'+(a.canc?'<span class="pill r">'+a.canc+'</span>':'<span class="num">0</span>')+'</td>'
     +'<td class="num">'+pc(a.canc,a.sales)+'</td></tr>'};
  const head=t=>'<th class="noclick">'+t+'</th>';
  /* ---- Daily lead movement ---- */
  const clampFrom=win.from<'2000-01-01'?minDataDay():win.from;
  const asg={},clo={},salByAcc={},attD={};
  rowsFor('SF_OPEN_CASES',win).forEach(r=>{const o=r.opened_at;if(o&&o>=clampFrom&&o<=win.to)asg[o]=(asg[o]||0)+1});
  rowsFor('SF_CLOSED_CASES',win).forEach(r=>{const o=r.opened_at;if(o&&o>=clampFrom&&o<=win.to)asg[o]=(asg[o]||0)+1;
    if(r._d)clo[r._d]=(clo[r._d]||0)+1});
  /* F-MOVE-01: Sales on day d = distinct accounts carrying a BI charge row dated d.
     Each row sits on its own Contract Create Date, so an account with contracts on two
     days counts on both — the same rule as F-MONEY-01, not "first sale day wins". */
  rowsFor('BI_ACTIVE_CASES',win).forEach(r=>{const d=r._d,k=r.account_number;
    if(!d||!k||d<clampFrom||d>win.to)return;
    (salByAcc[d]=salByAcc[d]||new Set()).add(k)});
  const salD={};Object.keys(salByAcc).forEach(d=>{salD[d]=salByAcc[d].size});
  rowsFor('ATTENDANCE',win).forEach(r=>{if(r.present_flag&&r._d)attD[r._d]=(attD[r._d]||0)+1});
  const dd=[];{const cur=new Date(clampFrom+'T00:00:00'),end=new Date(win.to+'T00:00:00');let g=0;
    while(cur<=end&&g++<4000){const k=isoDay(cur);const wdY=cur.getDay()!==0&&cur.getDay()!==6;
      if(wdY||asg[k]||clo[k]||salD[k]||attD[k])dd.push(k);cur.setDate(cur.getDate()+1)}}
  const over=dd.length>70;const days=over?dd.slice(-70):dd;
  // Month-relative weeks: bucket = month + week-of-month (resets each month), so subtotals read

  const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const wkOf=k=>k.slice(0,7)+'-W'+Math.ceil(+k.slice(8,10)/7);
  const wkLabel=b=>MON[+b.slice(5,7)-1]+' · W'+b.slice(-1);
  const fmtD=k=>k.slice(8,10)+'.'+k.slice(5,7)+'.'+k.slice(0,4);
  /* F-MOVE-01 Conv% = Sales ÷ Leads Assigned. On this suite BI sales (the money book)
     and Salesforce leads are different populations, so a day can post more sales than it
     assigned new leads — the sales came from the existing open backlog, not fresh intake.
     That is a real signal, not a broken number, so flag it amber past 100% rather than

    return v>100?'<span class="pill a" title="Sales exceeded new leads assigned this day — the sales came from the existing open backlog, not fresh intake. Not a true conversion while Power BI (money) and Salesforce (leads) track different populations.">'+fmtVal(v,'pct')+'</span>':fmtVal(v,'pct')};
  const dRow=(label,a,c,sl,at,bold)=>'<tr'+(bold?' style="font-weight:800;background:#F4F8FE;border-top:2px solid var(--line)"':'')+'>'
    +'<td>'+label+'</td><td class="num">'+(a||'·')+'</td><td class="num" style="font-weight:700">'+(c||'·')+'</td>'
    +'<td class="num" style="font-weight:700">'+(sl||'·')+'</td>'
    +'<td class="num">'+convCell(sl,a)+'</td>'   // F-MOVE-01: Sales ÷ Assigned, amber past 100%
    +'<td class="num">'+(at||'·')+'</td>'
    +'<td class="num">'+(at?f1((sl||0)/at):'—')+'</td>'
    +'<td class="num" style="color:'+(at?'var(--red)':'inherit')+'">'+(at?f1((c||0)/at):'—')+'</td></tr>';
  let dailyRows='',wk=null,W={a:0,c:0,s:0,atSum:0,atN:0},G2={a:0,c:0,s:0,atSum:0,atN:0};
  const flushWk=()=>{if(wk==null)return;dailyRows+=dRow(wkLabel(wk)+' Totals',W.a,W.c,W.s,W.atN?f1(W.atSum/W.atN):0,true);W={a:0,c:0,s:0,atSum:0,atN:0}};
  days.forEach(k=>{const w=wkOf(k);if(wk!==null&&w!==wk)flushWk();wk=w;
    const a=asg[k]||0,c=clo[k]||0,sl=salD[k]||0,at=attD[k]||0;
    dailyRows+=dRow(fmtD(k),a,c,sl,at,false);
    W.a+=a;W.c+=c;W.s+=sl;if(at){W.atSum+=at;W.atN++}
    G2.a+=a;G2.c+=c;G2.s+=sl;if(at){G2.atSum+=at;G2.atN++}});
  flushWk();
  dailyRows+=dRow('Period Totals',G2.a,G2.c,G2.s,G2.atN?f1(G2.atSum/G2.atN):0,true);
  const dailyCard='<div class="card" style="margin-bottom:16px"><div class="card-h"><span class="t">Daily lead movement</span>'
   +'<span class="info" title="Leads Assigned counts cases (open + closed) by the day they were opened. Total Closed by close date; Total Sales by contract create date, one per account. Conv % (assigned) = Sales ÷ Leads Assigned that day (F-MOVE-01) — turns amber above 100%, which means sales that day came from the existing open backlog rather than fresh lead intake (BI sales and Salesforce leads are different populations). Attendance is the headcount of present agents that day. SPD = sales ÷ present agents; Closure p/day = closed ÷ present agents. Week rows show attendance as the average present headcount.">i</span>'
   +'<span class="s">'+(over?'last 70 of '+dd.length+' days — narrow the date range for the rest · ':'')+'all global filters apply</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl" style="font-size:12px"><thead><tr>'
   +head('Date')+head('Leads Assigned')+head('Total Closed')+head('Total Sales')+head('Conv % (assigned)')+head('Attendance')+head('SPD')+'<th class="noclick" style="color:var(--red)">Closure p/day</th>'
   +'</tr></thead><tbody>'+dailyRows+'</tbody></table></div></div>';
  return dailyCard
   +'<div class="card"><div class="card-h"><span class="t">Lead management — the funnel per agent</span>'
   +'<span class="info" title="Working days in the selected window: '+wd+'. p/d and Payroll SPD divide by working days; Dialing SPD divides by the days the agent actually dialled (CallX). Wasted = Total Closed − Sales. Conv % (leads) = Sales ÷ Total Leads (open + closed cases = unique leads; same formula and convTarget as the scorecard Conversion — edit the target in Dictionary → NBA thresholds). Conv % (closed) = Sales ÷ Total Closed only. CONFIRM the two SPD definitions with Ryan.">i</span>'
   +'<span class="s">'+rows.length+' roster agents · window '+esc(winFrom(win))+' → '+esc(win.to)+' · all global filters apply</span></div>'
   +'<div style="overflow-x:auto"><table class="tbl" style="font-size:11.5px"><thead><tr>'
   +head('Team Leader')+head('Data Set')+head('Tenure')+head('Agent Name')
   +stCols.map(head).join('')
   +head('Total Open')+head('Closed')+head('Closed - No feedback')+head('Total Closed')+head('Total Leads')
   +head('Ave Closed p/d')+head('Ave Wasted p/d')+head('Sales')+head('Payroll SPD')+head('Dialing SPD')
   +head('Conv % (leads)')+head('Conv % (closed)')+head('Conv % wasted')+head('Cancelled')+head('Canc to Sales %')
   +'</tr></thead><tbody>'
   +rows.map(a=>cell(a,false)).join('')

   +'</tbody></table></div>'
   +((unOpen||unClosed)?'<div class="stale-banner" style="margin-top:10px">⚠ Not attributed to any roster agent (excluded here, still counted in totals on the Sales page): '+(unOpen?unOpen.toLocaleString()+' open case(s)':'')+(unOpen&&unClosed?' · ':'')+(unClosed?unClosed.toLocaleString()+' closed case(s)':'')+'.</div>':'')
   +'</div>';
}

function pageBrain(win){

    if(GF.tenure&&i.tenure!==GF.tenure)return false;
    if(GF.team&&i.tl!==GF.team)return false;
    if(GF.campaign&&campBucket(i.queue)!==GF.campaign)return false;
    if(GF.agent&&cb!==normCB(GF.agent))return false;
    return true});
  if(!cbsBase.length)return emptyState('No roster agents match the current filters');
  const statsAll=cbsBase.map(cb=>{const st=acStats(cb,win,C);st.tierInfo=cfTier(st);st.nba=acNBA(st);return st});
  const byGroup={};statsAll.forEach(st=>{(byGroup[st.group]=byGroup[st.group]||[]).push(st)});
  Object.values(byGroup).forEach(g=>{const sorted=g.map(x=>x.gwp).sort((a,b)=>a-b);
    g.forEach(st=>{const below=sorted.filter(x=>x<st.gwp).length;const pct=g.length<2?100:below/(g.length-1)*100;st.comp=acComposite(st,pct)})});
  const stats=statsAll.filter(st=>cbInScope(st.cb));

  const lvlHex=l=>l===1?'#C42D2D':l===2?'#B45309':l===3?'#2563EB':'#158A4C';
  const nodes=[],edges=[],idx={};
  const addNode=(id,label,type,color,r,meta)=>{if(idx[id]!=null)return idx[id];idx[id]=nodes.length;
    nodes.push({id,label,type,color,r,meta:meta||{},deg:0,x:0,y:0,vx:0,vy:0});return idx[id]};
  const link=(a,b)=>{edges.push([a,b]);nodes[a].deg++;nodes[b].deg++};
  stats.forEach(st=>{
    const a=addNode('A:'+st.cb,maskNameText(st.name),'agent',lvlHex(st.nba.lvl),4+Math.max(0,Math.min(100,st.comp.adj))/18,
      {cb:st.cb,sub:st.nba.code+' '+st.nba.label+' · Adj '+Math.round(st.comp.adj)});
    link(a,addNode('T:'+st.tl,maskNameText(st.tl),'tl','#E7EEFA',8,{sub:'Team leader'}));
    link(a,addNode('Q:'+st.queue,String(st.queue),'campaign','#38BDF8',7,{sub:'Campaign'}));
    link(a,addNode('R:'+st.nba.code,st.nba.code,'rule',lvlHex(st.nba.lvl),6,{sub:st.nba.label}));
  });
  const counts={1:0,2:0,3:0,4:0};stats.forEach(st=>counts[st.nba.lvl]++);
  setTimeout(()=>brainInit(nodes,edges),0);
  const chip=(c,l)=>'<span class="chip n"><span class="dot" style="background:'+c+'"></span>'+l+'</span>';
  return '<div class="card" style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
   +'<b>The floor as a graph.</b>'
   +chip('#C42D2D','L1 Urgent · '+counts[1])
   +chip('#B45309','L2 Revenue · '+counts[2])
   +chip('#2563EB','L3 Skill · '+counts[3])
   +chip('#158A4C','L4 Recognise · '+counts[4])
   +chip('#8FA2C4','light squares = team leaders')+chip('#38BDF8','sky squares = campaigns')+chip('#71809B','diamonds = NBA rules')
   +'<span style="margin-left:auto;font-size:11.5px;color:var(--muted)">a living map — always in motion · hover any node to spotlight it and read its story · scroll to zoom · drag to pan</span></div>'
   +'<div class="card" style="padding:0;overflow:hidden;background:#0A1730;border-color:#0A1730"><canvas id="brainCanvas" style="width:100%;height:620px;display:block;cursor:grab"></canvas></div>'
   +'<div class="footer-note" style="margin-top:8px"><span>'+stats.length+' agents · '+nodes.length+' nodes · '+edges.length+' links · window '+esc(winFrom(win))+' → '+esc(win.to)+' · many agents orbiting one red rule = one coaching theme, not many separate agent problems</span></div>';

function brainInit(nodes,edges){
  const cv=document.getElementById('brainCanvas');if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||900,H=cv.clientHeight||600;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');
  let hi=0,ai=0;const hubs=nodes.filter(n=>n.type!=='agent').length,ags=nodes.length-hubs;
  nodes.forEach(n=>{if(n.type!=='agent'){const t=(hi++/Math.max(1,hubs))*6.283;n.x=W/2+Math.cos(t)*Math.min(W,H)*.17;n.y=H/2+Math.sin(t)*Math.min(W,H)*.17}
    else{const t=(ai++/Math.max(1,ags))*6.283;const rr=Math.min(W,H)*(.30+.10*Math.sin(ai*2.7));n.x=W/2+Math.cos(t)*rr;n.y=H/2+Math.sin(t)*rr}});
  let scale=1,ox=0,oy=0,alpha=1,drag=null,pan=null,hover=-1,tick=0;
  const toWorld=(px,py)=>[(px-ox)/scale,(py-oy)/scale];
  const pick=(px,py)=>{const w=toWorld(px,py);let best=-1,bd=1e9;
    nodes.forEach((n,i)=>{const d=Math.hypot(n.x-w[0],n.y-w[1]);if(d<n.r+5&&d<bd){bd=d;best=i}});return best};
  function physics(){
    tick++;
    if(alpha<.005)return;
    for(let i=0;i<nodes.length;i++){const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
        let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<1)d2=1;if(d2>40000)continue;
        const f=1400/d2,d=Math.sqrt(d2);dx/=d;dy/=d;
        a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}}
    edges.forEach(e=>{const a=nodes[e[0]],b=nodes[e[1]];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-76)*.02,ux=dx/d,uy=dy/d;
      a.vx+=ux*f;a.vy+=uy*f;b.vx-=ux*f;b.vy-=uy*f});
    nodes.forEach((n,i)=>{
      n.vx+=(W/2-n.x)*.0016;n.vy+=(H/2-n.y)*.0016;
      n.vx+=Math.sin(tick*.008+i*1.7)*.014;n.vy+=Math.cos(tick*.006+i*2.3)*.014;
      if(!(drag&&drag.node===n)){n.x+=n.vx*alpha;n.y+=n.vy*alpha}
      n.vx*=.86;n.vy*=.86});
    alpha=Math.max(alpha*.996,.06);
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#0A1730';ctx.fillRect(0,0,W,H);
    const vg=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,Math.max(W,H)*.72);
    vg.addColorStop(0,'rgba(14,34,68,.6)');vg.addColorStop(1,'rgba(10,23,48,0)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    let nb=null;
    if(hover>=0){nb=new Set([hover]);edges.forEach(e=>{if(e[0]===hover)nb.add(e[1]);if(e[1]===hover)nb.add(e[0])})}
    ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
    ctx.strokeStyle=nb?'rgba(201,214,236,.04)':'rgba(201,214,236,.10)';ctx.lineWidth=1/scale;
    ctx.beginPath();edges.forEach(e=>{const a=nodes[e[0]],b=nodes[e[1]];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)});ctx.stroke();
    if(nb){ctx.strokeStyle='rgba(201,214,236,.38)';ctx.lineWidth=1.2/scale;
      ctx.beginPath();edges.forEach(e=>{if(e[0]===hover||e[1]===hover){const a=nodes[e[0]],b=nodes[e[1]];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}});ctx.stroke();}
    nodes.forEach((n,i)=>{
      ctx.beginPath();
      if(n.type==='agent')ctx.arc(n.x,n.y,n.r,0,6.283);
      else if(n.type==='rule'){const s=n.r;ctx.moveTo(n.x,n.y-s);ctx.lineTo(n.x+s,n.y);ctx.lineTo(n.x,n.y+s);ctx.lineTo(n.x-s,n.y);ctx.closePath()}
      else{const s=n.r*.85;ctx.rect(n.x-s,n.y-s,s*2,s*2)}
      const lit=!nb||nb.has(i);
      ctx.shadowColor=n.color;ctx.shadowBlur=i===hover?24:(lit?11:0);
      ctx.fillStyle=n.color;ctx.globalAlpha=lit?.96:.16;ctx.fill();
      ctx.shadowBlur=0;ctx.globalAlpha=1;
      if(i===hover){ctx.lineWidth=1.6/scale;ctx.strokeStyle='#fff';ctx.stroke()}
      const showLabel=i===hover||(nb&&nb.has(i))||(n.type!=='agent'&&scale>=1.15)||(n.type==='agent'&&scale>=1.8);
      if(showLabel&&lit){ctx.font=(n.type==='agent'?10:11)/scale+'px Inter,system-ui,sans-serif';
        ctx.fillStyle='rgba(201,214,236,.85)';ctx.textAlign='center';
        ctx.fillText(n.label,n.x,n.y-n.r-(5/scale));}
    });
    ctx.restore();
    if(hover>=0){const n=nodes[hover],sx=n.x*scale+ox,sy=n.y*scale+oy;
      const t1=n.label,t2=(n.meta.sub||'')+(n.type!=='agent'?' · '+n.deg+' link'+(n.deg===1?'':'s'):'');
      ctx.font='bold 11px Inter,system-ui,sans-serif';
      const w=Math.max(ctx.measureText(t1).width,ctx.measureText(t2).width)+16;
      const bx=Math.min(W-w-6,Math.max(6,sx+14)),by=Math.max(6,sy-46);
      ctx.fillStyle='rgba(14,34,68,.95)';
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(bx,by,w,36,7);ctx.fill()}else ctx.fillRect(bx,by,w,36);
      ctx.strokeStyle='rgba(201,214,236,.25)';ctx.lineWidth=1;ctx.strokeRect?ctx.strokeRect(bx+.5,by+.5,w-1,35):null;
      ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(t1,bx+8,by+15);
      ctx.font='10px Inter,system-ui,sans-serif';ctx.fillStyle='#C9D6EC';ctx.fillText(t2,bx+8,by+29);}
  }
  cv.onmousedown=e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,i=pick(px,py);
    if(i>=0){drag={node:nodes[i],moved:false};alpha=Math.max(alpha,.4)}else pan={px,py,ox,oy};
    cv.style.cursor='grabbing'};
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
    if(drag){const w=toWorld(px,py);drag.node.x=w[0];drag.node.y=w[1];drag.node.vx=0;drag.node.vy=0;drag.moved=true;alpha=Math.max(alpha,.3)}
    else if(pan){ox=pan.ox+(px-pan.px);oy=pan.oy+(py-pan.py)}
    else hover=pick(px,py);
    cv.style.cursor=(drag||pan)?'grabbing':'grab'};
  window.addEventListener('mouseup',function up(){
    if(!cv.isConnected){window.removeEventListener('mouseup',up);return}
    drag=null;pan=null;cv.style.cursor='grab'});
  cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
    const z=e.deltaY<0?1.12:.89,ns=Math.max(.25,Math.min(4,scale*z));
    ox=px-(px-ox)*(ns/scale);oy=py-(py-oy)*(ns/scale);scale=ns};
  (function loop(){if(!cv.isConnected)return;physics();draw();requestAnimationFrame(loop)})();
}

function pageDict(){
  const tab=state.dictTab;
  let body='';
  if(tab==='thresh'){
    const win=periodWindow();
    const doms=['Sales','QA','Workforce','Discipline'];
    const sel=state.threshDomain;
    const chips='<div class="tabs" style="margin-bottom:12px">'+['',...doms].map(d=>'<button class="tab '+((sel===d)?'active':'')+'" onclick="state.threshDomain=&#39;'+d+'&#39;;render()">'+(d||'All areas')+'</button>').join('')+'</div>';
    const explain='<div class="card" style="margin-bottom:14px"><div class="card-h"><span class="t">How RAG works here</span></div>'
     +'<p style="font-size:12.5px;color:var(--body);line-height:1.6">Every metric has a direction and two boundaries. When <b>higher is better</b>: green at or above <b>Good</b>, amber at or above <b>Watch</b>, red below it. When <b>lower is better</b> the comparisons flip. Change a number and press Enter or click away — the tile dots, department statuses and the nutshell recolour instantly, and the change persists. Clear both boxes to remove RAG from a metric. What the <i>words</i> mean (answered, pass, present, clean sale, stage ladder) lives one tab over in Interpretation rules.</p></div>';

       +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">Metric</th><th class="noclick">Current</th><th class="noclick">Direction</th><th class="noclick">Good (green)</th><th class="noclick">Watch (amber)</th><th class="noclick">Owner</th><th class="noclick"></th></tr></thead><tbody>'
       +ks.map(k=>{const v=evalKPI(k,win);const rag=ragOf(k,v);

          +'<td><input class="th-in" type="number" step="any" value="'+(k.amber??'')+'" placeholder="—" onchange="setThresh(&#39;'+k.id+'&#39;,&#39;amber&#39;,this.value)"></td>'

          +'<td style="white-space:nowrap"><button class="btn small" onclick="resetThresh(&#39;'+k.id+'&#39;)">Reset</button> <button class="btn small" onclick="clearThresh(&#39;'+k.id+'&#39;)">Clear RAG</button></td></tr>'}).join('')

     +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="noclick">Show</th><th class="noclick">KPI</th><th class="noclick">Domain</th><th class="noclick">Source</th><th class="noclick">Type</th><th class="noclick">Good / Watch</th><th class="noclick">Owner</th><th class="noclick"></th></tr></thead><tbody>'

      +'<td><b style="cursor:pointer" onclick="kpiInfo(\''+k.id+'\')">'+esc(k.name)+'</b>'+(k.core?'':' <span class="pill v" style="padding:2px 6px">custom</span>')+'</td>'
      +'<td><span class="pill b">'+esc(k.domain)+'</span></td><td style="font-size:11px">'+esc(k.type==='cross'?'Cross-source':SOURCES[k.src]?.label||'—')+'</td><td>'+esc(k.type)+'</td>'
      +'<td class="num" style="font-size:11.5px">'+(k.green!=null?(k.dir==='higher'?'≥':'≤')+k.green+' / '+(k.dir==='higher'?'≥':'≤')+k.amber:'—')+'</td>'
      +'<td>'+esc(k.owner||'—')+'</td>'

     +'</tbody></table></div></div>';
  }else if(tab==='rules'){
    body='<div class="grid g2">'+Object.entries(state.rules).map(([key,r])=>{
      return '<div class="card"><div class="card-h"><span class="t" style="font-size:13.5px">'+esc(r.label)+'</span></div>'
       +'<p style="font-size:12px;color:var(--muted);margin-bottom:8px">'+esc(r.help)+'</p>'

       +'<div style="display:flex;gap:7px;margin-top:10px"><input type="'+(r.numeric?'number':'text')+'" id="rin_'+key+'" placeholder="Add value…" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px" onkeydown="if(event.key===\'Enter\')ruleAdd(\''+key+'\')"><button class="btn small primary" onclick="ruleAdd(\''+key+'\')">Add</button></div></div>';
    }).join('')+'</div>'
    +'<div class="card" style="margin-top:2px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>These rules feed every KPI live.</b><span style="color:var(--muted);font-size:12.5px">Example: add "Pending" to Pass values and the pass rate, clean-sale rate and Scorecard all recalculate instantly.</span><button class="btn small" style="margin-left:auto" onclick="restoreRules()">Restore default rules</button></div></div>';
  }else if(tab==='map'){
    const bridge=state.facts.AGENT_LIST||[];
    const calls=state.facts.CALLX_CALL_RECORDS||[];
    const names=[...new Set(calls.filter(c=>c.agent).map(c=>c.agent))].sort();
    const codes=distinct('ATTENDANCE','employee_code');

     +(bridge.length?'<p style="font-size:12.5px;color:var(--muted);margin-bottom:8px">One row per agent, all systems: CB code (normalised, so CB15 = CB-15), attendance name, dialler alias, Salesforce name and team leader. Every cross-source join in the app runs through this table.</p>'
      +'<div style="overflow-x:auto;max-height:320px;overflow-y:auto"><table class="tbl"><thead><tr><th class="noclick">CB</th><th class="noclick">Agent</th><th class="noclick">Team leader</th><th class="noclick">Campaign</th><th class="noclick">Dialler alias</th><th class="noclick">Salesforce name</th><th class="noclick">Target</th></tr></thead><tbody>'
      +bridge.map(a=>'<tr><td><b>'+esc(a.cb_code)+'</b></td><td>'+maskName(a.agent_name)+'</td><td>'+maskName(a.team_leader)+'</td><td style="font-size:11.5px">'+esc(a.queue||'—')+'</td><td style="font-size:11.5px">'+maskName(a.callx_alias||'—')+'</td><td style="font-size:11.5px">'+maskName(a.sf_name||'—')+'</td><td class="num">'+(a.target??'—')+'</td></tr>').join('')
      +'</tbody></table></div>':'<div class="empty"><div class="big">No Agent List loaded</div><p>Upload the Matrix Agent List in the Upload Station — it maps CB codes, dialler aliases and Salesforce names in one file and unlocks per-agent GWP.</p></div>')+'</div>'
     +'<div class="grid g2"><div class="card"><div class="card-h"><span class="t">Dialler names — manual overrides</span><span class="s">'+names.filter(n=>state.agentMap[n]).length+' of '+names.length+' mapped</span></div>'
     +(names.length?'<div style="max-height:300px;overflow-y:auto"><table class="tbl"><thead><tr><th class="noclick">Dialler agent name</th><th class="noclick">Calls</th><th class="noclick">CB code</th></tr></thead><tbody>'
      +names.map(n=>{const cnt=calls.filter(c=>c.agent===n).length;

      +'</tbody></table></div>':'<div class="empty">Upload CallX call records first.</div>')+'</div>'
     +'</div>';

  return '<div class="tabs">'
   +'<button class="tab '+(tab==='kpis'?'active':'')+'" onclick="state.dictTab=\'kpis\';render()">KPI definitions</button>'
